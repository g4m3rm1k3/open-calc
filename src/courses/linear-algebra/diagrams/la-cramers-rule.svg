<svg viewBox="0 0 380 190" xmlns="http://www.w3.org/2000/svg" style="font-family: ui-sans-serif, system-ui, sans-serif; border-radius: 10px;">
  <style>
    .svg-bg    { fill: #f8fafc; }
    .svg-text  { fill: #1e293b; }
    .svg-muted { fill: #64748b; }
    .svg-cell  { stroke: #cbd5e1; fill: #ffffff; }
    .dark .svg-bg    { fill: #0f172a; }
    .dark .svg-text  { fill: #e2e8f0; }
    .dark .svg-muted { fill: #94a3b8; }
    .dark .svg-cell  { stroke: #475569; fill: #1e293b; }
  </style>
  <rect width="380" height="190" rx="10" class="svg-bg"/>

  <text x="190" y="16" font-size="11.5" class="svg-text" text-anchor="middle" font-weight="700">Replace one column with b, take the determinant ratio</text>

  <!-- A -->
  <rect x="20" y="34" width="32" height="32" class="svg-cell" stroke-width="1"/>
  <rect x="52" y="34" width="32" height="32" class="svg-cell" stroke-width="1"/>
  <rect x="20" y="66" width="32" height="32" class="svg-cell" stroke-width="1"/>
  <rect x="52" y="66" width="32" height="32" class="svg-cell" stroke-width="1"/>
  <text x="36" y="55" font-size="13" class="svg-text" text-anchor="middle">2</text>
  <text x="68" y="55" font-size="13" class="svg-text" text-anchor="middle">1</text>
  <text x="36" y="87" font-size="13" class="svg-text" text-anchor="middle">1</text>
  <text x="68" y="87" font-size="13" class="svg-text" text-anchor="middle">-3</text>
  <text x="52" y="116" font-size="10.5" class="svg-muted" text-anchor="middle">A</text>
  <text x="52" y="132" font-size="10" class="svg-muted" text-anchor="middle">det(A) = -7</text>

  <!-- A1: column 1 replaced by b -->
  <rect x="148" y="34" width="32" height="32" fill="rgba(16,185,129,0.18)" stroke="#10b981" stroke-width="1.3"/>
  <rect x="180" y="34" width="32" height="32" class="svg-cell" stroke-width="1"/>
  <rect x="148" y="66" width="32" height="32" fill="rgba(16,185,129,0.18)" stroke="#10b981" stroke-width="1.3"/>
  <rect x="180" y="66" width="32" height="32" class="svg-cell" stroke-width="1"/>
  <text x="164" y="55" font-size="13" fill="#10b981" font-weight="700" text-anchor="middle">5</text>
  <text x="196" y="55" font-size="13" class="svg-text" text-anchor="middle">1</text>
  <text x="164" y="87" font-size="13" fill="#10b981" font-weight="700" text-anchor="middle">-2</text>
  <text x="196" y="87" font-size="13" class="svg-text" text-anchor="middle">-3</text>
  <text x="180" y="116" font-size="10.5" class="svg-muted" text-anchor="middle">A₁ (col 1 → b)</text>
  <text x="180" y="132" font-size="10" fill="#10b981" text-anchor="middle" font-weight="700">x₁ = -13/-7 = 13/7</text>

  <!-- A2: column 2 replaced by b -->
  <rect x="276" y="34" width="32" height="32" class="svg-cell" stroke-width="1"/>
  <rect x="308" y="34" width="32" height="32" fill="rgba(16,185,129,0.18)" stroke="#10b981" stroke-width="1.3"/>
  <rect x="276" y="66" width="32" height="32" class="svg-cell" stroke-width="1"/>
  <rect x="308" y="66" width="32" height="32" fill="rgba(16,185,129,0.18)" stroke="#10b981" stroke-width="1.3"/>
  <text x="292" y="55" font-size="13" class="svg-text" text-anchor="middle">2</text>
  <text x="324" y="55" font-size="13" fill="#10b981" font-weight="700" text-anchor="middle">5</text>
  <text x="292" y="87" font-size="13" class="svg-text" text-anchor="middle">1</text>
  <text x="324" y="87" font-size="13" fill="#10b981" font-weight="700" text-anchor="middle">-2</text>
  <text x="308" y="116" font-size="10.5" class="svg-muted" text-anchor="middle">A₂ (col 2 → b)</text>
  <text x="308" y="132" font-size="10" fill="#10b981" text-anchor="middle" font-weight="700">x₂ = -9/-7 = 9/7</text>

  <text x="190" y="170" font-size="10.5" class="svg-muted" text-anchor="middle">xᵢ = det(Aᵢ) / det(A) — one determinant ratio per unknown</text>
</svg>
