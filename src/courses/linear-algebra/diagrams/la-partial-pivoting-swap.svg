<svg viewBox="0 0 360 200" xmlns="http://www.w3.org/2000/svg" style="font-family: ui-sans-serif, system-ui, sans-serif; border-radius: 10px;">
  <style>
    .svg-bg    { fill: #f8fafc; }
    .svg-text  { fill: #1e293b; }
    .svg-muted { fill: #64748b; }
    .svg-cell  { stroke: #cbd5e1; fill: #ffffff; }
    .svg-axis  { stroke: #94a3b8; }
    .dark .svg-bg    { fill: #0f172a; }
    .dark .svg-text  { fill: #e2e8f0; }
    .dark .svg-muted { fill: #94a3b8; }
    .dark .svg-cell  { stroke: #475569; fill: #1e293b; }
    .dark .svg-axis  { stroke: #475569; }
  </style>
  <rect width="360" height="200" rx="10" class="svg-bg"/>
  <defs>
    <marker id="pp-arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M1,1 L1,7 L7,4 z" class="svg-axis" fill="#94a3b8"/></marker>
  </defs>

  <text x="180" y="16" font-size="11.5" class="svg-text" text-anchor="middle" font-weight="700">Partial pivoting swaps in the largest entry before dividing by it</text>

  <!-- Before -->
  <text x="90" y="36" font-size="10.5" fill="#dc2626" text-anchor="middle" font-weight="700">without pivoting</text>
  <rect x="50" y="44" width="34" height="32" fill="rgba(220,38,38,0.18)" stroke="#dc2626" stroke-width="1.5"/>
  <rect x="84" y="44" width="34" height="32" class="svg-cell" stroke-width="1"/>
  <rect x="50" y="76" width="34" height="32" class="svg-cell" stroke-width="1"/>
  <rect x="84" y="76" width="34" height="32" class="svg-cell" stroke-width="1"/>
  <text x="67" y="64" font-size="12" fill="#dc2626" font-weight="700" text-anchor="middle">0.001</text>
  <text x="101" y="64" font-size="12" class="svg-text" text-anchor="middle">1</text>
  <text x="67" y="96" font-size="12" class="svg-text" text-anchor="middle">1</text>
  <text x="101" y="96" font-size="12" class="svg-text" text-anchor="middle">1</text>
  <text x="84" y="124" font-size="9.5" fill="#dc2626" text-anchor="middle">multiplier = 1/0.001 = 1000</text>

  <line x1="130" y1="76" x2="170" y2="76" class="svg-axis" stroke-width="1.4" marker-end="url(#pp-arrow)"/>
  <text x="150" y="68" font-size="8.5" class="svg-muted" text-anchor="middle">swap rows</text>

  <!-- After -->
  <text x="270" y="36" font-size="10.5" fill="#10b981" text-anchor="middle" font-weight="700">with partial pivoting</text>
  <rect x="230" y="44" width="34" height="32" fill="rgba(16,185,129,0.18)" stroke="#10b981" stroke-width="1.5"/>
  <rect x="264" y="44" width="34" height="32" class="svg-cell" stroke-width="1"/>
  <rect x="230" y="76" width="34" height="32" class="svg-cell" stroke-width="1"/>
  <rect x="264" y="76" width="34" height="32" class="svg-cell" stroke-width="1"/>
  <text x="247" y="64" font-size="12" fill="#10b981" font-weight="700" text-anchor="middle">1</text>
  <text x="281" y="64" font-size="12" class="svg-text" text-anchor="middle">1</text>
  <text x="247" y="96" font-size="12" class="svg-text" text-anchor="middle">0.001</text>
  <text x="281" y="96" font-size="12" class="svg-text" text-anchor="middle">1</text>
  <text x="264" y="124" font-size="9.5" fill="#10b981" text-anchor="middle">multiplier = 0.001/1 = 0.001</text>

  <text x="180" y="158" font-size="10" class="svg-muted" text-anchor="middle">Bounded multipliers (magnitude ≤ 1) keep floating-point errors from amplifying</text>
  <text x="180" y="175" font-size="10" class="svg-muted" text-anchor="middle">— this is what makes pivoted LU backward stable</text>
</svg>
