<svg viewBox="0 0 460 220" xmlns="http://www.w3.org/2000/svg" style="font-family: ui-sans-serif, system-ui, sans-serif; border-radius: 10px;">
  <style>
    .svg-bg    { fill: rgb(var(--tw-custom-slate-50)); }
    .svg-panel { fill: #ffffff; }
    .svg-text  { fill: rgb(var(--tw-custom-slate-800)); }
    .svg-muted { fill: rgb(var(--tw-custom-slate-500)); }
    .svg-div   { stroke: rgb(var(--tw-custom-slate-200)); fill: none; }
    .dark .svg-bg    { fill: rgb(var(--tw-custom-slate-900)); }
    .dark .svg-panel { fill: rgb(var(--tw-custom-slate-800)); }
    .dark .svg-text  { fill: rgb(var(--tw-custom-slate-200)); }
    .dark .svg-muted { fill: rgb(var(--tw-custom-slate-400)); }
    .dark .svg-div   { stroke: rgb(var(--tw-custom-slate-700)); }
  </style>
  <rect width="460" height="220" rx="10" class="svg-bg"/>

  <!-- Panel 1: natural order, eliminate center first -> fill-in -->
  <rect x="12" y="20" width="216" height="186" rx="8" class="svg-panel svg-div" stroke-width="1"/>
  <text x="120" y="38" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="700">eliminate 1 first: fill-in</text>

  <circle cx="120" cy="110" r="16" fill="rgba(220,38,38,0.18)" stroke="#dc2626" stroke-width="1.6"/>
  <text x="120" y="115" font-size="11" fill="#dc2626" font-weight="700" text-anchor="middle">1</text>

  <circle cx="60" cy="60" r="14" fill="#94a3b8" opacity="0.15" stroke="#64748b" stroke-width="1.3"/>
  <text x="60" y="65" font-size="10" class="svg-muted" text-anchor="middle">2</text>
  <circle cx="180" cy="60" r="14" fill="#94a3b8" opacity="0.15" stroke="#64748b" stroke-width="1.3"/>
  <text x="180" y="65" font-size="10" class="svg-muted" text-anchor="middle">3</text>
  <circle cx="120" cy="170" r="14" fill="#94a3b8" opacity="0.15" stroke="#64748b" stroke-width="1.3"/>
  <text x="120" y="175" font-size="10" class="svg-muted" text-anchor="middle">4</text>

  <line x1="120" y1="110" x2="60" y2="60" stroke="#64748b" stroke-width="1.3"/>
  <line x1="120" y1="110" x2="180" y2="60" stroke="#64748b" stroke-width="1.3"/>
  <line x1="120" y1="110" x2="120" y2="170" stroke="#64748b" stroke-width="1.3"/>

  <!-- new fill-in edges among 2,3,4 -->
  <line x1="60" y1="60" x2="180" y2="60" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="4,3"/>
  <line x1="60" y1="60" x2="120" y2="170" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="4,3"/>
  <line x1="180" y1="60" x2="120" y2="170" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="4,3"/>

  <text x="120" y="195" font-size="9.5" fill="#dc2626" text-anchor="middle">3 new edges — {2,3,4} fully connects</text>

  <!-- Panel 2: reordered, eliminate leaves first -> no fill-in -->
  <rect x="232" y="20" width="216" height="186" rx="8" class="svg-panel svg-div" stroke-width="1"/>
  <text x="340" y="38" font-size="11" fill="#10b981" text-anchor="middle" font-weight="700">eliminate leaves first: zero fill-in</text>

  <circle cx="340" cy="170" r="16" fill="rgba(16,185,129,0.14)" stroke="#10b981" stroke-width="1.4"/>
  <text x="340" y="175" font-size="11" fill="#10b981" font-weight="700" text-anchor="middle">1</text>

  <circle cx="280" cy="80" r="14" fill="rgba(217,119,6,0.16)" stroke="#d97706" stroke-width="1.3"/>
  <text x="280" y="85" font-size="10" fill="#d97706" text-anchor="middle">4</text>
  <circle cx="400" cy="80" r="14" fill="rgba(217,119,6,0.16)" stroke="#d97706" stroke-width="1.3"/>
  <text x="400" y="85" font-size="10" fill="#d97706" text-anchor="middle">3</text>
  <circle cx="340" cy="50" r="14" fill="rgba(217,119,6,0.16)" stroke="#d97706" stroke-width="1.3"/>
  <text x="340" y="55" font-size="10" fill="#d97706" text-anchor="middle">2</text>

  <line x1="340" y1="170" x2="280" y2="80" stroke="#64748b" stroke-width="1.3"/>
  <line x1="340" y1="170" x2="400" y2="80" stroke="#64748b" stroke-width="1.3"/>
  <line x1="340" y1="170" x2="340" y2="50" stroke="#64748b" stroke-width="1.3"/>

  <text x="340" y="195" font-size="9.5" fill="#10b981" text-anchor="middle">leaves connect only to 1 — no new edges ever</text>
</svg>
