<svg viewBox="0 0 320 220" xmlns="http://www.w3.org/2000/svg" style="font-family: ui-sans-serif, system-ui, sans-serif; border-radius: 12px;">
  <style>
    .svg-bg    { fill: rgb(var(--tw-custom-slate-50)); }
    .svg-muted { fill: rgb(var(--tw-custom-slate-400)); }
    .dark .svg-bg    { fill: rgb(var(--tw-custom-slate-900)); }
    .dark .svg-muted { fill: rgb(var(--tw-custom-slate-500)); }
  </style>
  <rect width="320" height="220" rx="12" class="svg-bg"/>
  <defs>
    <marker id="pr-arrow" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto"><path d="M1,1 L1,8 L8,4.5 z" fill="#2563eb"/></marker>
  </defs>

  <text x="160" y="16" font-size="11" class="svg-muted" text-anchor="middle">3-page web: rank flows along links</text>

  <!-- 3 nodes -->
  <circle cx="160" cy="60" r="26" fill="rgba(16,185,129,0.18)" stroke="#10b981" stroke-width="2"/>
  <text x="160" y="56" font-size="13" fill="#10b981" font-weight="700" text-anchor="middle">Page 1</text>
  <text x="160" y="71" font-size="10" fill="#10b981" text-anchor="middle">rank ≈ 0.39</text>

  <circle cx="80" cy="165" r="26" fill="rgba(37,99,235,0.14)" stroke="#2563eb" stroke-width="2"/>
  <text x="80" y="161" font-size="13" fill="#2563eb" font-weight="700" text-anchor="middle">Page 2</text>
  <text x="80" y="176" font-size="10" fill="#2563eb" text-anchor="middle">rank ≈ 0.20</text>

  <circle cx="240" cy="165" r="26" fill="rgba(217,119,6,0.16)" stroke="#d97706" stroke-width="2"/>
  <text x="240" y="161" font-size="13" fill="#d97706" font-weight="700" text-anchor="middle">Page 3</text>
  <text x="240" y="176" font-size="10" fill="#d97706" text-anchor="middle">rank ≈ 0.41</text>

  <!-- edges: 1->2, 1->3, 2->3, 3->1 -->
  <line x1="142" y1="78" x2="96" y2="147" stroke="#64748b" stroke-width="1.6" marker-end="url(#pr-arrow)"/>
  <line x1="178" y1="78" x2="224" y2="147" stroke="#64748b" stroke-width="1.6" marker-end="url(#pr-arrow)"/>
  <line x1="106" y1="165" x2="214" y2="165" stroke="#64748b" stroke-width="1.6" marker-end="url(#pr-arrow)"/>
  <path d="M 218 150 Q 170 100 178 76" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#pr-arrow)"/>

  <text x="160" y="205" font-size="9.5" class="svg-muted" text-anchor="middle">Page 3 gets links from both 1 and 2, then forwards everything to Page 1</text>
</svg>
