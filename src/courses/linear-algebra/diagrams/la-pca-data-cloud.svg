<svg viewBox="0 0 320 220" xmlns="http://www.w3.org/2000/svg" style="font-family: ui-sans-serif, system-ui, sans-serif; border-radius: 12px;">
  <style>
    .svg-bg    { fill: rgb(var(--tw-custom-slate-50)); }
    .svg-axis  { stroke: rgb(var(--tw-custom-slate-400)); }
    .svg-muted { fill: rgb(var(--tw-custom-slate-400)); }
    .dark .svg-bg    { fill: rgb(var(--tw-custom-slate-900)); }
    .dark .svg-axis  { stroke: rgb(var(--tw-custom-slate-600)); }
    .dark .svg-muted { fill: rgb(var(--tw-custom-slate-500)); }
  </style>
  <rect width="320" height="220" rx="12" class="svg-bg"/>
  <defs>
    <marker id="pca-blue" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M1,1 L1,7 L7,4 z" fill="#2563eb"/></marker>
    <marker id="pca-amber" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M1,1 L1,7 L7,4 z" fill="#d97706"/></marker>
  </defs>

  <text x="160" y="16" font-size="11" class="svg-muted" text-anchor="middle">PC1 finds the longest axis, PC2 the leftover spread</text>

  <!-- elongated cloud of points along a tilted axis -->
  <g fill="#64748b" opacity="0.7">
    <circle cx="100" cy="150" r="3"/>
    <circle cx="115" cy="135" r="3"/>
    <circle cx="125" cy="140" r="3"/>
    <circle cx="140" cy="120" r="3"/>
    <circle cx="150" cy="128" r="3"/>
    <circle cx="160" cy="110" r="3"/>
    <circle cx="170" cy="100" r="3"/>
    <circle cx="180" cy="108" r="3"/>
    <circle cx="190" cy="90" r="3"/>
    <circle cx="200" cy="95" r="3"/>
    <circle cx="210" cy="78" r="3"/>
    <circle cx="220" cy="85" r="3"/>
    <circle cx="160" cy="118" r="3"/>
    <circle cx="145" cy="135" r="3"/>
    <circle cx="180" cy="95" r="3"/>
  </g>

  <!-- centroid -->
  <circle cx="160" cy="115" r="3.5" fill="#1e293b"/>

  <!-- PC1: long axis -->
  <line x1="160" y1="115" x2="232" y2="72" stroke="#2563eb" stroke-width="3" marker-end="url(#pca-blue)"/>
  <line x1="160" y1="115" x2="88" y2="158" stroke="#2563eb" stroke-width="3" marker-end="url(#pca-blue)"/>
  <text x="236" y="68" font-size="12" fill="#2563eb" font-weight="700">PC1</text>

  <!-- PC2: short, perpendicular axis -->
  <line x1="160" y1="115" x2="183" y2="155" stroke="#d97706" stroke-width="3" marker-end="url(#pca-amber)"/>
  <text x="188" y="162" font-size="12" fill="#d97706" font-weight="700">PC2</text>

  <text x="160" y="195" font-size="10" class="svg-muted" text-anchor="middle">PC1 ⊥ PC2 — orthogonal directions, ordered by variance captured</text>
  <text x="160" y="210" font-size="9.5" class="svg-muted" text-anchor="middle">eigenvectors of the covariance matrix, ranked by eigenvalue</text>
</svg>
