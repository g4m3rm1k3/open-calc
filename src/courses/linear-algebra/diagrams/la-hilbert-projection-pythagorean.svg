<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg" style="font-family: ui-sans-serif, system-ui, sans-serif; border-radius: 12px;">
  <style>
    .svg-bg    { fill: rgb(var(--tw-custom-slate-50)); }
    .svg-axis  { stroke: rgb(var(--tw-custom-slate-400)); }
    .svg-muted { fill: rgb(var(--tw-custom-slate-400)); }
    .dark .svg-bg    { fill: rgb(var(--tw-custom-slate-900)); }
    .dark .svg-axis  { stroke: rgb(var(--tw-custom-slate-600)); }
    .dark .svg-muted { fill: rgb(var(--tw-custom-slate-500)); }
  </style>
  <rect width="300" height="200" rx="12" class="svg-bg"/>
  <defs>
    <marker id="hp-blue" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M1,1 L1,7 L7,4 z" fill="#2563eb"/></marker>
    <marker id="hp-green" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M1,1 L1,7 L7,4 z" fill="#10b981"/></marker>
  </defs>

  <text x="150" y="16" font-size="11" class="svg-muted" text-anchor="middle">Projection onto M = x-axis, the Pythagorean way</text>

  <line x1="30" y1="170" x2="270" y2="170" class="svg-axis" stroke-width="1.6"/>
  <text x="276" y="174" font-size="10" class="svg-muted">M</text>

  <!-- v = (3,4) -->
  <line x1="50" y1="170" x2="170" y2="50" stroke="#2563eb" stroke-width="2.8" marker-end="url(#hp-blue)"/>
  <text x="178" y="46" font-size="12" fill="#2563eb" font-weight="700">v = (3,4)</text>

  <!-- projection P_M v = (3,0) -->
  <line x1="50" y1="170" x2="170" y2="170" stroke="#10b981" stroke-width="2.8" marker-end="url(#hp-green)"/>
  <text x="110" y="186" font-size="10.5" fill="#10b981" font-weight="700" text-anchor="middle">P_M v = (3,0)</text>

  <!-- perpendicular remainder -->
  <line x1="170" y1="170" x2="170" y2="50" stroke="#d97706" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="178" y="120" font-size="10" fill="#d97706" font-weight="700">v − P_M v</text>
  <rect x="160" y="160" width="10" height="10" fill="none" stroke="#64748b" stroke-width="1"/>

  <circle cx="50" cy="170" r="3" fill="#1e293b"/>
</svg>
