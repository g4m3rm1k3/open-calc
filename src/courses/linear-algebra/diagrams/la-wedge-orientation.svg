<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg" style="font-family: ui-sans-serif, system-ui, sans-serif; border-radius: 10px;">
  <style>
    .svg-bg    { fill: rgb(var(--tw-custom-slate-50)); }
    .svg-panel { fill: #ffffff; }
    .svg-text  { fill: rgb(var(--tw-custom-slate-800)); }
    .svg-muted { fill: rgb(var(--tw-custom-slate-500)); }
    .svg-div   { stroke: rgb(var(--tw-custom-slate-200)); }
    .dark .svg-bg    { fill: rgb(var(--tw-custom-slate-900)); }
    .dark .svg-panel { fill: rgb(var(--tw-custom-slate-800)); }
    .dark .svg-text  { fill: rgb(var(--tw-custom-slate-200)); }
    .dark .svg-muted { fill: rgb(var(--tw-custom-slate-400)); }
    .dark .svg-div   { stroke: rgb(var(--tw-custom-slate-700)); }
  </style>
  <rect width="320" height="200" rx="10" class="svg-bg"/>
  <defs>
    <marker id="we-blue" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto"><path d="M1,1 L1,6 L6,3.5 z" fill="#2563eb"/></marker>
    <marker id="we-amber" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto"><path d="M1,1 L1,6 L6,3.5 z" fill="#d97706"/></marker>
  </defs>

  <!-- Panel 1: u then v, CCW, +5 -->
  <rect x="10" y="20" width="146" height="160" rx="8" class="svg-panel svg-div" stroke-width="1"/>
  <text x="83" y="36" font-size="10.5" fill="#10b981" text-anchor="middle" font-weight="700">u ∧ v = +5</text>
  <polygon points="50,150 110,150 130,110 70,110" fill="rgba(16,185,129,0.12)" stroke="none"/>
  <line x1="50" y1="150" x2="110" y2="150" stroke="#2563eb" stroke-width="2.5" marker-end="url(#we-blue)"/>
  <text x="80" y="166" font-size="10" fill="#2563eb" font-weight="700">u</text>
  <line x1="50" y1="150" x2="70" y2="110" stroke="#d97706" stroke-width="2.5" marker-end="url(#we-amber)"/>
  <text x="58" y="100" font-size="10" fill="#d97706" font-weight="700">v</text>
  <path d="M 65 138 A 14 14 0 0 1 60 122" fill="none" stroke="#10b981" stroke-width="1.5" marker-end="url(#we-blue)"/>
  <text x="83" y="184" font-size="9" fill="#10b981" text-anchor="middle">u then v: counterclockwise</text>

  <!-- Panel 2: v then u, CW, -5 -->
  <rect x="166" y="20" width="146" height="160" rx="8" class="svg-panel svg-div" stroke-width="1"/>
  <text x="239" y="36" font-size="10.5" fill="#dc2626" text-anchor="middle" font-weight="700">v ∧ u = −5</text>
  <polygon points="206,150 266,150 286,110 226,110" fill="rgba(220,38,38,0.10)" stroke="none"/>
  <line x1="206" y1="150" x2="226" y2="110" stroke="#d97706" stroke-width="2.5" marker-end="url(#we-amber)"/>
  <text x="214" y="100" font-size="10" fill="#d97706" font-weight="700">v</text>
  <line x1="206" y1="150" x2="266" y2="150" stroke="#2563eb" stroke-width="2.5" marker-end="url(#we-blue)"/>
  <text x="236" y="166" font-size="10" fill="#2563eb" font-weight="700">u</text>
  <path d="M 221 122 A 14 14 0 0 1 226 138" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#we-amber)"/>
  <text x="239" y="184" font-size="9" fill="#dc2626" text-anchor="middle">v then u: clockwise</text>
</svg>
