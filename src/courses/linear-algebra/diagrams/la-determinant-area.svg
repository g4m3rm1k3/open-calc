<svg viewBox="0 0 320 260" xmlns="http://www.w3.org/2000/svg" style="font-family: ui-sans-serif, system-ui, sans-serif; border-radius: 12px;">
  <style>
    .svg-bg    { fill: rgb(var(--tw-custom-slate-50)); }
    .svg-muted { fill: rgb(var(--tw-custom-slate-400)); }
    .dark .svg-bg    { fill: rgb(var(--tw-custom-slate-900)); }
    .dark .svg-muted { fill: rgb(var(--tw-custom-slate-500)); }
  </style>
  <rect width="320" height="260" rx="12" class="svg-bg"/>
  <defs>
    <marker id="da-blue" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M1,1 L1,7 L7,4 z" fill="#2563eb"/></marker>
    <marker id="da-amber" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M1,1 L1,7 L7,4 z" fill="#d97706"/></marker>
  </defs>

  <polygon points="70,210 140,175 175,70 105,105" fill="rgba(16,185,129,0.18)" stroke="#10b981" stroke-width="1.5"/>

  <circle cx="70" cy="210" r="3" fill="#1e293b"/>
  <line x1="70" y1="210" x2="136" y2="178" stroke="#2563eb" stroke-width="3" marker-end="url(#da-blue)"/>
  <text x="142" y="178" font-size="12" fill="#2563eb" font-weight="700">a₁ = [2,1]</text>
  <line x1="70" y1="210" x2="102" y2="110" stroke="#d97706" stroke-width="3" marker-end="url(#da-amber)"/>
  <text x="40" y="100" font-size="12" fill="#d97706" font-weight="700">a₂ = [1,3]</text>

  <text x="160" y="135" font-size="13" fill="#10b981" font-weight="700" text-anchor="middle">Area = det(A) = 5</text>

  <text x="160" y="245" font-size="11" class="svg-muted" text-anchor="middle">det(A) is the signed area of the parallelogram spanned by A's columns</text>
</svg>
