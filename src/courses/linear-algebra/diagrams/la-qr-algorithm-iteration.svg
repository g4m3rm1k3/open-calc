<svg viewBox="0 0 440 190" xmlns="http://www.w3.org/2000/svg" style="font-family: ui-sans-serif, system-ui, sans-serif; border-radius: 10px;">
  <style>
    .svg-bg    { fill: #f8fafc; }
    .svg-text  { fill: #1e293b; }
    .svg-muted { fill: #64748b; }
    .svg-cell  { stroke: #cbd5e1; fill: #ffffff; }
    .svg-axis  { stroke: #94a3b8; }
    .dark .svg-bg    { fill: #0f172a; }
    .dark .svg-text  { fill: #e2e8f0; }
    .dark .svg-muted { fill: #94a3b8; }
    .dark .svg-cell  { stroke: #475569; fill: #1e293b; }
    .dark .svg-axis  { stroke: #475569; }
  </style>
  <rect width="440" height="190" rx="10" class="svg-bg"/>
  <defs>
    <marker id="qra-arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M1,1 L1,7 L7,4 z" class="svg-axis" fill="#94a3b8"/></marker>
  </defs>

  <text x="220" y="16" font-size="11" class="svg-text" text-anchor="middle" font-weight="700">The QR algorithm: Aₖ₊₁ = Rₖ Qₖ</text>
  <text x="220" y="30" font-size="9.5" class="svg-muted" text-anchor="middle">same eigenvalues, less off-diagonal noise each step</text>

  <!-- Panel 1: A0, full off-diagonal noise -->
  <g>
    <rect x="20" y="40" width="22" height="22" fill="rgba(37,99,235,0.18)" stroke="#2563eb" stroke-width="1.3"/>
    <rect x="42" y="40" width="22" height="22" fill="#94a3b8" opacity="0.55" stroke="#64748b" stroke-width="1"/>
    <rect x="64" y="40" width="22" height="22" fill="#94a3b8" opacity="0.55" stroke="#64748b" stroke-width="1"/>
    <rect x="20" y="62" width="22" height="22" fill="#94a3b8" opacity="0.55" stroke="#64748b" stroke-width="1"/>
    <rect x="42" y="62" width="22" height="22" fill="rgba(37,99,235,0.18)" stroke="#2563eb" stroke-width="1.3"/>
    <rect x="64" y="62" width="22" height="22" fill="#94a3b8" opacity="0.55" stroke="#64748b" stroke-width="1"/>
    <rect x="20" y="84" width="22" height="22" fill="#94a3b8" opacity="0.55" stroke="#64748b" stroke-width="1"/>
    <rect x="42" y="84" width="22" height="22" fill="#94a3b8" opacity="0.55" stroke="#64748b" stroke-width="1"/>
    <rect x="64" y="84" width="22" height="22" fill="rgba(37,99,235,0.18)" stroke="#2563eb" stroke-width="1.3"/>
    <text x="53" y="118" font-size="10.5" class="svg-text" text-anchor="middle" font-weight="700">A₀</text>
    <text x="53" y="132" font-size="8.5" class="svg-muted" text-anchor="middle">dense, noisy</text>
  </g>

  <line x1="92" y1="73" x2="142" y2="73" class="svg-axis" stroke-width="1.4" marker-end="url(#qra-arrow)"/>
  <text x="117" y="65" font-size="8.5" class="svg-muted" text-anchor="middle">QR step</text>

  <!-- Panel 2: A1, off-diagonal shrinking -->
  <g>
    <rect x="150" y="40" width="22" height="22" fill="rgba(37,99,235,0.18)" stroke="#2563eb" stroke-width="1.3"/>
    <rect x="172" y="40" width="22" height="22" fill="#94a3b8" opacity="0.30" stroke="#64748b" stroke-width="1"/>
    <rect x="194" y="40" width="22" height="22" fill="#94a3b8" opacity="0.30" stroke="#64748b" stroke-width="1"/>
    <rect x="150" y="62" width="22" height="22" fill="#94a3b8" opacity="0.30" stroke="#64748b" stroke-width="1"/>
    <rect x="172" y="62" width="22" height="22" fill="rgba(37,99,235,0.18)" stroke="#2563eb" stroke-width="1.3"/>
    <rect x="194" y="62" width="22" height="22" fill="#94a3b8" opacity="0.30" stroke="#64748b" stroke-width="1"/>
    <rect x="150" y="84" width="22" height="22" fill="#94a3b8" opacity="0.30" stroke="#64748b" stroke-width="1"/>
    <rect x="172" y="84" width="22" height="22" fill="#94a3b8" opacity="0.30" stroke="#64748b" stroke-width="1"/>
    <rect x="194" y="84" width="22" height="22" fill="rgba(37,99,235,0.18)" stroke="#2563eb" stroke-width="1.3"/>
    <text x="183" y="118" font-size="10.5" class="svg-text" text-anchor="middle" font-weight="700">A₁</text>
    <text x="183" y="132" font-size="8.5" class="svg-muted" text-anchor="middle">quieter</text>
  </g>

  <line x1="222" y1="73" x2="272" y2="73" class="svg-axis" stroke-width="1.4" marker-end="url(#qra-arrow)"/>
  <text x="247" y="65" font-size="8.5" class="svg-muted" text-anchor="middle">repeat</text>

  <!-- Panel 3: converged, upper triangular -->
  <g>
    <rect x="280" y="40" width="22" height="22" fill="rgba(37,99,235,0.22)" stroke="#2563eb" stroke-width="1.5"/>
    <rect x="302" y="40" width="22" height="22" fill="#94a3b8" opacity="0.12" stroke="#64748b" stroke-width="1"/>
    <rect x="324" y="40" width="22" height="22" fill="#94a3b8" opacity="0.12" stroke="#64748b" stroke-width="1"/>
    <rect x="280" y="62" width="22" height="22" fill="rgba(16,185,129,0.18)" stroke="#10b981" stroke-width="1.3"/>
    <rect x="302" y="62" width="22" height="22" fill="rgba(37,99,235,0.22)" stroke="#2563eb" stroke-width="1.5"/>
    <rect x="324" y="62" width="22" height="22" fill="#94a3b8" opacity="0.12" stroke="#64748b" stroke-width="1"/>
    <rect x="280" y="84" width="22" height="22" fill="rgba(16,185,129,0.18)" stroke="#10b981" stroke-width="1.3"/>
    <rect x="302" y="84" width="22" height="22" fill="rgba(16,185,129,0.18)" stroke="#10b981" stroke-width="1.3"/>
    <rect x="324" y="84" width="22" height="22" fill="rgba(37,99,235,0.22)" stroke="#2563eb" stroke-width="1.5"/>
    <text x="313" y="118" font-size="10.5" fill="#2563eb" text-anchor="middle" font-weight="700">Aₖ → Schur form</text>
    <text x="313" y="132" font-size="8.5" fill="#10b981" text-anchor="middle">eigenvalues on diagonal</text>
  </g>

  <text x="220" y="160" font-size="10" class="svg-muted" text-anchor="middle">Each step is a similarity transform, so eigenvalues never change</text>
  <text x="220" y="175" font-size="10" class="svg-muted" text-anchor="middle">— only the off-diagonal "noise" decays toward zero</text>
</svg>
