<svg viewBox="0 0 460 170" xmlns="http://www.w3.org/2000/svg" style="font-family: ui-sans-serif, system-ui, sans-serif; border-radius: 10px;">
  <style>
    .svg-bg    { fill: rgb(var(--tw-custom-slate-50)); }
    .svg-text  { fill: rgb(var(--tw-custom-slate-800)); }
    .svg-muted { fill: rgb(var(--tw-custom-slate-500)); }
    .svg-box   { fill: #ffffff; stroke: rgb(var(--tw-custom-slate-300)); }
    .dark .svg-bg    { fill: rgb(var(--tw-custom-slate-900)); }
    .dark .svg-text  { fill: rgb(var(--tw-custom-slate-200)); }
    .dark .svg-muted { fill: rgb(var(--tw-custom-slate-400)); }
    .dark .svg-box   { fill: rgb(var(--tw-custom-slate-800)); stroke: rgb(var(--tw-custom-slate-600)); }
  </style>
  <rect width="460" height="170" rx="10" class="svg-bg"/>
  <defs>
    <marker id="dp-arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M1,1 L1,7 L7,4 z" fill="#1e293b"/></marker>
  </defs>

  <text x="230" y="16" font-size="11.5" class="svg-text" text-anchor="middle" font-weight="700">Three simple steps replace one complicated matrix</text>

  <text x="40" y="60" font-size="13" class="svg-text" font-weight="700">x</text>

  <line x1="55" y1="55" x2="85" y2="55" stroke="#1e293b" stroke-width="2" marker-end="url(#dp-arrow)"/>

  <rect x="90" y="35" width="86" height="40" rx="6" class="svg-box" stroke-width="1.3"/>
  <text x="133" y="59" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="700">P⁻¹</text>
  <text x="133" y="90" font-size="9" class="svg-muted" text-anchor="middle">into eigenbasis</text>

  <line x1="176" y1="55" x2="206" y2="55" stroke="#1e293b" stroke-width="2" marker-end="url(#dp-arrow)"/>

  <rect x="211" y="35" width="86" height="40" rx="6" class="svg-box" stroke-width="1.3"/>
  <text x="254" y="59" font-size="13" fill="#d97706" text-anchor="middle" font-weight="700">D</text>
  <text x="254" y="90" font-size="9" class="svg-muted" text-anchor="middle">scale each axis</text>

  <line x1="297" y1="55" x2="327" y2="55" stroke="#1e293b" stroke-width="2" marker-end="url(#dp-arrow)"/>

  <rect x="332" y="35" width="86" height="40" rx="6" class="svg-box" stroke-width="1.3"/>
  <text x="375" y="59" font-size="13" fill="#10b981" text-anchor="middle" font-weight="700">P</text>
  <text x="375" y="90" font-size="9" class="svg-muted" text-anchor="middle">back to standard</text>

  <line x1="418" y1="55" x2="440" y2="55" stroke="#1e293b" stroke-width="2" marker-end="url(#dp-arrow)"/>
  <text x="430" y="40" font-size="13" class="svg-text">Ax</text>

  <text x="230" y="130" font-size="13" class="svg-text" text-anchor="middle" font-weight="700">A = P D P⁻¹  ⟹  Aᵏ = P Dᵏ P⁻¹</text>
  <text x="230" y="150" font-size="10" class="svg-muted" text-anchor="middle">raising D to a power is trivial — raise each diagonal entry, that's it</text>
</svg>
