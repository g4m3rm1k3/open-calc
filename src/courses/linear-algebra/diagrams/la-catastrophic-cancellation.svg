<svg viewBox="0 0 340 190" xmlns="http://www.w3.org/2000/svg" style="font-family: ui-sans-serif, system-ui, sans-serif; border-radius: 10px;">
  <style>
    .svg-bg    { fill: rgb(var(--tw-custom-slate-50)); }
    .svg-text  { fill: rgb(var(--tw-custom-slate-800)); }
    .svg-muted { fill: rgb(var(--tw-custom-slate-500)); }
    .svg-panel { fill: #ffffff; }
    .svg-div   { stroke: rgb(var(--tw-custom-slate-200)); }
    .dark .svg-bg    { fill: rgb(var(--tw-custom-slate-900)); }
    .dark .svg-text  { fill: rgb(var(--tw-custom-slate-200)); }
    .dark .svg-muted { fill: rgb(var(--tw-custom-slate-400)); }
    .dark .svg-panel { fill: rgb(var(--tw-custom-slate-800)); }
    .dark .svg-div   { stroke: rgb(var(--tw-custom-slate-700)); }
  </style>
  <rect width="340" height="190" rx="10" class="svg-bg"/>

  <text x="170" y="16" font-size="10.5" class="svg-text" text-anchor="middle" font-weight="700">cos(10⁻⁸) rounds to exactly 1</text>
  <text x="170" y="29" font-size="9.5" class="svg-muted" text-anchor="middle">— the subtraction loses everything</text>

  <rect x="30" y="36" width="280" height="120" rx="8" class="svg-panel svg-div" stroke-width="1"/>

  <text x="50" y="62" font-size="13" font-family="monospace" class="svg-muted">1.</text>
  <text x="64" y="62" font-size="13" font-family="monospace" class="svg-muted">0000000000000000</text>

  <text x="50" y="84" font-size="13" font-family="monospace" class="svg-muted">0.</text>
  <text x="64" y="84" font-size="13" font-family="monospace" class="svg-muted">9999999999999999</text>
  <text x="290" y="73" font-size="9" fill="#dc2626" text-anchor="end">17 matching digits</text>

  <line x1="50" y1="96" x2="285" y2="96" class="svg-text" stroke="#1e293b" stroke-width="1.2"/>

  <text x="50" y="116" font-size="13" font-family="monospace" fill="#dc2626" font-weight="700">0.</text>
  <text x="64" y="116" font-size="13" font-family="monospace" fill="#dc2626" font-weight="700">0000000000000001</text>

  <text x="170" y="140" font-size="10" fill="#dc2626" text-anchor="middle" font-weight="700">true difference ≈ 5×10⁻¹⁷ — but float gives exactly 0</text>

  <text x="170" y="174" font-size="10" class="svg-muted" text-anchor="middle">all significant digits were already used representing the matching part</text>
</svg>
