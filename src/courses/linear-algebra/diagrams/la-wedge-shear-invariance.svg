<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg" style="font-family: ui-sans-serif, system-ui, sans-serif; border-radius: 10px;">
  <style>
    .svg-bg    { fill: rgb(var(--tw-custom-slate-50)); }
    .svg-muted { fill: rgb(var(--tw-custom-slate-400)); }
    .dark .svg-bg    { fill: rgb(var(--tw-custom-slate-900)); }
    .dark .svg-muted { fill: rgb(var(--tw-custom-slate-500)); }
  </style>
  <rect width="300" height="200" rx="10" class="svg-bg"/>
  <defs>
    <marker id="ws-blue" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M1,1 L1,7 L7,4 z" fill="#2563eb"/></marker>
    <marker id="ws-amber" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M1,1 L1,7 L7,4 z" fill="#d97706"/></marker>
  </defs>

  <text x="150" y="16" font-size="11" class="svg-muted" text-anchor="middle">u ∧ (u+v) = u ∧ v — shearing never changes the area</text>

  <!-- original parallelogram u,v dashed -->
  <polygon points="60,160 160,160 190,90 90,90" fill="none" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4,3"/>
  <!-- sheared parallelogram u,(u+v) solid -->
  <polygon points="60,160 160,160 230,90 130,90" fill="rgba(16,185,129,0.12)" stroke="#10b981" stroke-width="2"/>

  <line x1="60" y1="160" x2="160" y2="160" stroke="#2563eb" stroke-width="2.5" marker-end="url(#ws-blue)"/>
  <text x="110" y="176" font-size="10" fill="#2563eb" font-weight="700" text-anchor="middle">u</text>

  <line x1="60" y1="160" x2="90" y2="90" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="3,2" marker-end="url(#ws-blue)"/>
  <text x="74" y="84" font-size="9.5" class="svg-muted">v</text>

  <line x1="60" y1="160" x2="130" y2="90" stroke="#d97706" stroke-width="2.5" marker-end="url(#ws-amber)"/>
  <text x="138" y="86" font-size="10" fill="#d97706" font-weight="700">u+v</text>

  <text x="150" y="188" font-size="9.5" fill="#10b981" text-anchor="middle">same base, same height — area is identical</text>
</svg>
