<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg" style="font-family: ui-sans-serif, system-ui, sans-serif; border-radius: 10px;">
  <style>
    .svg-bg    { fill: rgb(var(--tw-custom-slate-50)); }
    .svg-text  { fill: rgb(var(--tw-custom-slate-800)); }
    .svg-muted { fill: rgb(var(--tw-custom-slate-500)); }
    .dark .svg-bg    { fill: rgb(var(--tw-custom-slate-900)); }
    .dark .svg-text  { fill: rgb(var(--tw-custom-slate-200)); }
    .dark .svg-muted { fill: rgb(var(--tw-custom-slate-400)); }
  </style>
  <rect width="320" height="200" rx="10" class="svg-bg"/>
  <defs>
    <marker id="cn-blue" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M1,1 L1,7 L7,4 z" fill="#2563eb"/></marker>
    <marker id="cn-amber" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M1,1 L1,7 L7,4 z" fill="#d97706"/></marker>
  </defs>

  <text x="160" y="18" font-size="11.5" class="svg-text" text-anchor="middle" font-weight="700">A unit circle becomes a needle-thin ellipse</text>

  <circle cx="160" cy="105" r="42" fill="none" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4,3"/>
  <ellipse cx="160" cy="105" rx="95" ry="2.5" fill="rgba(37,99,235,0.10)" stroke="#2563eb" stroke-width="1.8"/>

  <line x1="160" y1="105" x2="255" y2="105" stroke="#2563eb" stroke-width="2.5" marker-end="url(#cn-blue)"/>
  <text x="260" y="101" font-size="11" fill="#2563eb" font-weight="700">stretch ×3</text>

  <line x1="160" y1="105" x2="160" y2="83" stroke="#d97706" stroke-width="2.5" marker-end="url(#cn-amber)"/>
  <text x="166" y="76" font-size="10.5" fill="#d97706" font-weight="700">shrink ×0.001</text>

  <text x="160" y="150" font-size="12" fill="#1e293b" font-weight="700" text-anchor="middle">κ₂(A) = 3 / 0.001 = 3000</text>
  <text x="160" y="172" font-size="10" class="svg-muted" text-anchor="middle">the thin direction is where small input errors get fanned out enormously</text>
</svg>
