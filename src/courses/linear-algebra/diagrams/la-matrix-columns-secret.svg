<svg viewBox="0 0 560 290" xmlns="http://www.w3.org/2000/svg" style="font-family: ui-sans-serif, system-ui, sans-serif; border-radius: 10px;">
  <style>
    .svg-bg    { fill: rgb(var(--tw-custom-slate-50)); }
    .svg-panel { fill: #ffffff; }
    .svg-text  { fill: rgb(var(--tw-custom-slate-800)); }
    .svg-muted { fill: rgb(var(--tw-custom-slate-400)); }
    .svg-grid  { stroke: rgb(var(--tw-custom-slate-200)); }
    .svg-div   { stroke: rgb(var(--tw-custom-slate-200)); fill: none; }
    .dark .svg-bg    { fill: rgb(var(--tw-custom-slate-900)); }
    .dark .svg-panel { fill: rgb(var(--tw-custom-slate-800)); }
    .dark .svg-text  { fill: rgb(var(--tw-custom-slate-200)); }
    .dark .svg-muted { fill: rgb(var(--tw-custom-slate-500)); }
    .dark .svg-grid  { stroke: rgb(var(--tw-custom-slate-800)); }
    .dark .svg-div   { stroke: rgb(var(--tw-custom-slate-700)); }
  </style>
  <rect width="560" height="290" rx="10" class="svg-bg"/>
  <defs>
    <marker id="mc-blue" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M1,1 L1,7 L7,4 z" fill="#2563eb"/></marker>
    <marker id="mc-amber" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M1,1 L1,7 L7,4 z" fill="#d97706"/></marker>
  </defs>

  <text x="280" y="20" font-size="12" class="svg-text" text-anchor="middle" font-weight="700">A = [1 3; 0 1] — track only where î and ĵ land</text>

  <!-- Panel 1: Before -->
  <rect x="12" y="30" width="248" height="230" rx="8" class="svg-panel svg-div" stroke-width="1"/>
  <text x="136" y="48" font-size="11" class="svg-muted" text-anchor="middle" font-weight="700">Before — standard basis</text>
  <line x1="20" y1="220" x2="252" y2="220" class="svg-grid" stroke-width="1"/>
  <line x1="20" y1="190" x2="252" y2="190" class="svg-grid" stroke-width="1"/>
  <line x1="20" y1="160" x2="252" y2="160" class="svg-grid" stroke-width="1"/>
  <line x1="110" y1="130" x2="110" y2="250" class="svg-grid" stroke-width="1"/>
  <line x1="140" y1="130" x2="140" y2="250" class="svg-grid" stroke-width="1"/>
  <line x1="170" y1="130" x2="170" y2="250" class="svg-grid" stroke-width="1"/>
  <circle cx="140" cy="190" r="3" fill="#64748b"/>
  <line x1="140" y1="190" x2="167" y2="190" stroke="#2563eb" stroke-width="3" marker-end="url(#mc-blue)"/>
  <text x="172" y="186" font-size="12" fill="#2563eb" font-weight="700">î</text>
  <line x1="140" y1="190" x2="140" y2="163" stroke="#d97706" stroke-width="3" marker-end="url(#mc-amber)"/>
  <text x="146" y="160" font-size="12" fill="#d97706" font-weight="700">ĵ</text>

  <!-- Panel 2: After -->
  <rect x="300" y="30" width="248" height="230" rx="8" class="svg-panel svg-div" stroke-width="1"/>
  <text x="424" y="48" font-size="11" class="svg-muted" text-anchor="middle" font-weight="700">After A — î, ĵ land on A's columns</text>
  <line x1="310" y1="220" x2="540" y2="220" class="svg-grid" stroke-width="1"/>
  <line x1="310" y1="190" x2="540" y2="190" class="svg-grid" stroke-width="1"/>
  <line x1="310" y1="160" x2="540" y2="160" class="svg-grid" stroke-width="1"/>
  <line x1="300" y1="220" x2="480" y2="160" class="svg-grid" stroke-width="1"/>
  <line x1="330" y1="220" x2="510" y2="160" class="svg-grid" stroke-width="1"/>
  <line x1="360" y1="220" x2="540" y2="160" class="svg-grid" stroke-width="1"/>
  <circle cx="420" cy="190" r="3" fill="#64748b"/>
  <line x1="420" y1="190" x2="447" y2="190" stroke="#2563eb" stroke-width="3" marker-end="url(#mc-blue)"/>
  <text x="452" y="186" font-size="11" fill="#2563eb" font-weight="700">î → col 1 = [1,0]</text>
  <line x1="420" y1="190" x2="507" y2="163" stroke="#d97706" stroke-width="3" marker-end="url(#mc-amber)"/>
  <text x="430" y="148" font-size="11" fill="#d97706" font-weight="700">ĵ → col 2 = [3,1]</text>

  <text x="280" y="278" font-size="11" class="svg-muted" text-anchor="middle">The columns of A are exactly the new locations of î and ĵ — read them and you know everything</text>
</svg>
