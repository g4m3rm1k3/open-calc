<svg viewBox="0 0 280 240" xmlns="http://www.w3.org/2000/svg" style="font-family: ui-sans-serif, system-ui, sans-serif; border-radius: 12px;">
  <style>
    .svg-bg    { fill: #f8fafc; }
    .svg-axis  { stroke: #94a3b8; }
    .svg-muted { fill: #94a3b8; }
    .dark .svg-bg    { fill: #0f172a; }
    .dark .svg-axis  { stroke: #475569; }
    .dark .svg-muted { fill: #64748b; }
  </style>
  <rect width="280" height="240" rx="12" class="svg-bg"/>

  <text x="140" y="16" font-size="10.5" class="svg-muted" text-anchor="middle">No coordinates needed — just an integral</text>

  <!-- axes -->
  <line x1="40" y1="200" x2="240" y2="200" class="svg-axis" stroke-width="1.5"/>
  <line x1="40" y1="200" x2="40" y2="20" class="svg-axis" stroke-width="1.5"/>
  <text x="244" y="204" font-size="10" class="svg-muted">x</text>
  <text x="20" y="196" font-size="10" class="svg-muted">0</text>
  <text x="216" y="216" font-size="10" class="svg-muted">1</text>

  <!-- f(x) = x -->
  <line x1="40" y1="200" x2="220" y2="20" stroke="#2563eb" stroke-width="2.5"/>
  <text x="225" y="20" font-size="12" fill="#2563eb" font-weight="700">f(x) = x</text>

  <!-- g(x) = x^2 -->
  <path d="M 40 200 Q 130 200 220 20" fill="none" stroke="#d97706" stroke-width="2.5"/>
  <text x="225" y="42" font-size="12" fill="#d97706" font-weight="700">g(x) = x²</text>

  <text x="140" y="222" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">⟨f,g⟩ = ∫₀¹ f(x)g(x) dx = 1/4 → θ ≈ 15°</text>
</svg>
