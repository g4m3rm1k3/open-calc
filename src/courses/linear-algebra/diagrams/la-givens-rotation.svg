<svg viewBox="0 0 320 220" xmlns="http://www.w3.org/2000/svg" style="font-family: ui-sans-serif, system-ui, sans-serif; border-radius: 12px;">
  <style>
    .svg-bg    { fill: #f8fafc; }
    .svg-axis  { stroke: #94a3b8; }
    .svg-muted { fill: #94a3b8; }
    .dark .svg-bg    { fill: #0f172a; }
    .dark .svg-axis  { stroke: #475569; }
    .dark .svg-muted { fill: #64748b; }
  </style>
  <rect width="320" height="220" rx="12" class="svg-bg"/>
  <defs>
    <marker id="gv-blue" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M1,1 L1,7 L7,4 z" fill="#2563eb"/></marker>
    <marker id="gv-green" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M1,1 L1,7 L7,4 z" fill="#10b981"/></marker>
  </defs>

  <text x="160" y="16" font-size="11" class="svg-muted" text-anchor="middle">Givens rotation: rotate the pair (a, b) onto (r, 0)</text>

  <line x1="20" y1="190" x2="300" y2="190" class="svg-axis" stroke-width="1.3"/>
  <line x1="70" y1="210" x2="70" y2="30" class="svg-axis" stroke-width="1.3"/>

  <!-- arc showing rotation -->
  <path d="M 170 90 A 100 100 0 0 1 195 190" fill="none" stroke="#d97706" stroke-width="1.3" stroke-dasharray="4,3"/>
  <text x="178" y="135" font-size="11" fill="#d97706" font-weight="700">θ</text>

  <!-- (a,b) -->
  <line x1="70" y1="190" x2="170" y2="90" stroke="#2563eb" stroke-width="3" marker-end="url(#gv-blue)"/>
  <text x="174" y="86" font-size="13" fill="#2563eb" font-weight="700">(a, b)</text>

  <!-- (r,0) -->
  <line x1="70" y1="190" x2="195" y2="190" stroke="#10b981" stroke-width="3" marker-end="url(#gv-green)"/>
  <text x="198" y="194" font-size="13" fill="#10b981" font-weight="700">(r, 0)</text>

  <circle cx="70" cy="190" r="3" fill="#1e293b"/>

  <text x="160" y="206" font-size="9.5" class="svg-muted" text-anchor="middle">cos θ = a/r, sin θ = b/r, r = √(a² + b²) — only 2 entries ever touched</text>
</svg>
