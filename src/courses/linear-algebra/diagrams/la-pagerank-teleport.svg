<svg viewBox="0 0 320 220" xmlns="http://www.w3.org/2000/svg" style="font-family: ui-sans-serif, system-ui, sans-serif; border-radius: 12px;">
  <style>
    .svg-bg    { fill: #f8fafc; }
    .svg-muted { fill: #94a3b8; }
    .dark .svg-bg    { fill: #0f172a; }
    .dark .svg-muted { fill: #64748b; }
  </style>
  <rect width="320" height="220" rx="12" class="svg-bg"/>
  <defs>
    <marker id="pt-blue" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto"><path d="M1,1 L1,8 L8,4.5 z" fill="#2563eb"/></marker>
    <marker id="pt-red" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto"><path d="M1,1 L1,8 L8,4.5 z" fill="#dc2626"/></marker>
  </defs>

  <text x="160" y="16" font-size="11" class="svg-muted" text-anchor="middle">G = α·M (follow a link) + (1−α)·teleport (jump anywhere)</text>

  <circle cx="80" cy="100" r="22" fill="rgba(37,99,235,0.14)" stroke="#2563eb" stroke-width="1.8"/>
  <text x="80" y="105" font-size="11" fill="#2563eb" font-weight="700" text-anchor="middle">page A</text>

  <circle cx="240" cy="60" r="22" fill="#94a3b8" opacity="0.15" stroke="#64748b" stroke-width="1.5"/>
  <text x="240" y="65" font-size="11" class="svg-muted" text-anchor="middle">page B</text>

  <circle cx="240" cy="150" r="22" fill="#94a3b8" opacity="0.15" stroke="#64748b" stroke-width="1.5"/>
  <text x="240" y="155" font-size="11" class="svg-muted" text-anchor="middle">page C</text>

  <circle cx="160" cy="190" r="22" fill="#94a3b8" opacity="0.15" stroke="#64748b" stroke-width="1.5"/>
  <text x="160" y="195" font-size="11" class="svg-muted" text-anchor="middle">page D</text>

  <!-- normal link: solid blue -->
  <line x1="100" y1="92" x2="220" y2="64" stroke="#2563eb" stroke-width="2.2" marker-end="url(#pt-blue)"/>
  <text x="160" y="68" font-size="9.5" fill="#2563eb" font-weight="700" text-anchor="middle">α: follow link</text>

  <!-- teleport jumps: dashed red, to all other pages -->
  <line x1="95" y1="115" x2="225" y2="145" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#pt-red)"/>
  <line x1="92" y1="120" x2="150" y2="178" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#pt-red)"/>

  <text x="155" y="100" font-size="9.5" fill="#dc2626" font-weight="700" text-anchor="middle">1−α: teleport</text>

  <text x="160" y="215" font-size="9" class="svg-muted" text-anchor="middle">teleportation guarantees a unique stationary distribution</text>
</svg>
