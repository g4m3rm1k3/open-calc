<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg" style="font-family: ui-sans-serif, system-ui, sans-serif; border-radius: 10px;">
  <style>
    .svg-bg    { fill: rgb(var(--tw-custom-slate-50)); }
    .svg-axis  { stroke: rgb(var(--tw-custom-slate-400)); }
    .svg-muted { fill: rgb(var(--tw-custom-slate-400)); }
    .dark .svg-bg    { fill: rgb(var(--tw-custom-slate-900)); }
    .dark .svg-axis  { stroke: rgb(var(--tw-custom-slate-600)); }
    .dark .svg-muted { fill: rgb(var(--tw-custom-slate-500)); }
  </style>
  <rect width="300" height="200" rx="10" class="svg-bg"/>

  <text x="150" y="16" font-size="11" class="svg-muted" text-anchor="middle">Two Fourier terms already nearly match x² on [0,1]</text>

  <line x1="40" y1="160" x2="260" y2="160" class="svg-axis" stroke-width="1.3"/>
  <line x1="40" y1="160" x2="40" y2="40" class="svg-axis" stroke-width="1.3"/>
  <text x="260" y="174" font-size="9" class="svg-muted" text-anchor="middle">x</text>
  <text x="30" y="40" font-size="9" class="svg-muted" text-anchor="middle">1</text>

  <!-- f(x) = x^2 on [0,1], scaled: x in [40,240], y in [160,60] for range [0,1] -->
  <path d="M 40 160 Q 140 160 240 60" fill="none" stroke="#2563eb" stroke-width="2.4"/>
  <text x="248" y="58" font-size="10.5" fill="#2563eb" font-weight="700">x²</text>

  <!-- approximation: x - 1/12, a straight line -->
  <line x1="40" y1="176" x2="240" y2="62" stroke="#d97706" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="244" y="78" font-size="10.5" fill="#d97706" font-weight="700">x − 1/12</text>

  <text x="150" y="190" font-size="9.5" class="svg-muted" text-anchor="middle">just 2 orthonormal terms already capture the shape of x²</text>
</svg>
