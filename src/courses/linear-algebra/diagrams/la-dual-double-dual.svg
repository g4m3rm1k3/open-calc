<svg viewBox="0 0 340 212" xmlns="http://www.w3.org/2000/svg" style="font-family: ui-sans-serif, system-ui, sans-serif; border-radius: 10px;">
  <style>
    .svg-bg    { fill: rgb(var(--tw-custom-slate-50)); }
    .svg-muted { fill: rgb(var(--tw-custom-slate-500)); }
    .dark .svg-bg    { fill: rgb(var(--tw-custom-slate-900)); }
    .dark .svg-muted { fill: rgb(var(--tw-custom-slate-400)); }
  </style>
  <rect width="340" height="212" rx="10" class="svg-bg"/>
  <defs>
    <marker id="dd-arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M1,1 L1,7 L7,4 z" fill="#2563eb"/></marker>
    <marker id="dd-green" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M1,1 L1,7 L7,4 z" fill="#10b981"/></marker>
  </defs>

  <text x="170" y="16" font-size="11" class="svg-muted" text-anchor="middle">V ≅ V** needs nothing extra; V ≅ V* needs an inner product</text>

  <circle cx="60" cy="120" r="32" fill="rgba(37,99,235,0.12)" stroke="#2563eb" stroke-width="1.6"/>
  <text x="60" y="125" font-size="14" fill="#2563eb" font-weight="700" text-anchor="middle">V</text>

  <circle cx="200" cy="60" r="32" fill="rgba(217,119,6,0.12)" stroke="#d97706" stroke-width="1.6"/>
  <text x="200" y="65" font-size="14" fill="#d97706" font-weight="700" text-anchor="middle">V*</text>

  <circle cx="280" cy="150" r="32" fill="rgba(16,185,129,0.12)" stroke="#10b981" stroke-width="1.6"/>
  <text x="280" y="155" font-size="13" fill="#10b981" font-weight="700" text-anchor="middle">V**</text>

  <!-- V to V*: dashed, needs inner product -->
  <line x1="86" y1="100" x2="174" y2="76" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#dd-arrow)"/>
  <text x="125" y="80" font-size="9" fill="#64748b" text-anchor="middle">needs inner product</text>

  <!-- V to V**: solid natural map -->
  <path d="M 80 145 Q 170 195 252 168" fill="none" stroke="#10b981" stroke-width="2.2" marker-end="url(#dd-green)"/>
  <text x="170" y="195" font-size="10" fill="#10b981" font-weight="700" text-anchor="middle">ι: natural, no extra structure</text>

  <text x="170" y="35" font-size="9.5" class="svg-muted" text-anchor="middle">ι(v)(f) = f(v) — the canonical isomorphism</text>
</svg>
