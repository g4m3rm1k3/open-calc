<svg viewBox="0 0 420 280" xmlns="http://www.w3.org/2000/svg" style="font-family: ui-sans-serif, system-ui, sans-serif; border-radius: 12px;">
  <style>
    .svg-bg    { fill: rgb(var(--tw-custom-slate-50)); }
    .svg-muted { fill: rgb(var(--tw-custom-slate-400)); }
    .dark .svg-bg    { fill: rgb(var(--tw-custom-slate-900)); }
    .dark .svg-muted { fill: rgb(var(--tw-custom-slate-500)); }
  </style>
  <rect width="420" height="280" rx="12" class="svg-bg"/>
  <defs>
    <marker id="pn-amber" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M1,1 L1,7 L7,4 z" fill="#d97706"/></marker>
    <marker id="pn-green" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M1,1 L1,7 L7,4 z" fill="#10b981"/></marker>
  </defs>

  <!-- the plane patch -->
  <polygon points="160,210 290,185 320,95 190,120" fill="rgba(37,99,235,0.10)" stroke="#94a3b8" stroke-width="1"/>

  <!-- P0 (origin of the plane) -->
  <circle cx="160" cy="210" r="4" fill="#1e293b"/>
  <text x="140" y="226" font-size="12" fill="#1e293b" font-weight="700">P₀</text>

  <!-- x: another point in the plane -->
  <circle cx="254" cy="159" r="4" fill="#d97706"/>
  <text x="262" y="155" font-size="12" fill="#d97706" font-weight="700">x</text>

  <!-- vector (x - P0), lying in the plane -->
  <line x1="160" y1="210" x2="249" y2="162" stroke="#d97706" stroke-width="3" marker-end="url(#pn-amber)"/>
  <text x="160" y="245" font-size="12" fill="#d97706" font-weight="700">x − P₀  (lies in the plane)</text>

  <!-- normal vector n, straight up, perpendicular to the plane -->
  <line x1="160" y1="210" x2="160" y2="42" stroke="#10b981" stroke-width="3.5" marker-end="url(#pn-green)"/>
  <text x="168" y="50" font-size="12" fill="#10b981" font-weight="700">n — perpendicular to the plane</text>

  <text x="210" y="266" font-size="12" class="svg-muted" text-anchor="middle">n · (x − P₀) = 0 — the defining equation of the plane</text>
</svg>
