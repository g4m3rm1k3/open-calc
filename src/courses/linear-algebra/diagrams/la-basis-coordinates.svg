<svg viewBox="0 0 400 280" xmlns="http://www.w3.org/2000/svg" style="font-family: ui-sans-serif, system-ui, sans-serif; border-radius: 12px;">
  <style>
    .svg-bg    { fill: #f8fafc; }
    .svg-grid  { stroke: #e2e8f0; }
    .svg-axis  { stroke: #94a3b8; }
    .svg-axis-fill { fill: #94a3b8; }
    .svg-muted { fill: #94a3b8; }
    .dark .svg-bg    { fill: #0f172a; }
    .dark .svg-grid  { stroke: #1e293b; }
    .dark .svg-axis  { stroke: #475569; }
    .dark .svg-axis-fill { fill: #475569; }
    .dark .svg-muted { fill: #64748b; }
  </style>
  <rect width="400" height="280" rx="12" class="svg-bg"/>
  <defs>
    <marker id="bc-gray" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto"><path d="M1,1 L1,6 L6,3.5 z" fill="#94a3b8"/></marker>
    <marker id="bc-blue" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M1,1 L1,7 L7,4 z" fill="#2563eb"/></marker>
    <marker id="bc-amber" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M1,1 L1,7 L7,4 z" fill="#d97706"/></marker>
    <marker id="bc-green" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M1,1 L1,7 L7,4 z" fill="#10b981"/></marker>
  </defs>

  <!-- Grid: x in [-1,5], y in [-3,2], 55px/unit, origin at (90,130) -->
  <line x1="35" y1="20" x2="35" y2="240" class="svg-grid" stroke-width="1"/>
  <line x1="145" y1="20" x2="145" y2="240" class="svg-grid" stroke-width="1"/>
  <line x1="200" y1="20" x2="200" y2="240" class="svg-grid" stroke-width="1"/>
  <line x1="255" y1="20" x2="255" y2="240" class="svg-grid" stroke-width="1"/>
  <line x1="310" y1="20" x2="310" y2="240" class="svg-grid" stroke-width="1"/>
  <line x1="20" y1="20" x2="380" y2="20" class="svg-grid" stroke-width="1"/>
  <line x1="20" y1="75" x2="380" y2="75" class="svg-grid" stroke-width="1"/>
  <line x1="20" y1="185" x2="380" y2="185" class="svg-grid" stroke-width="1"/>
  <line x1="20" y1="240" x2="380" y2="240" class="svg-grid" stroke-width="1"/>

  <!-- Axes: x-axis at y=130 (yval=0), y-axis at x=90 (xval=0) -->
  <line x1="20" y1="130" x2="380" y2="130" class="svg-axis" stroke-width="2"/>
  <line x1="90" y1="240" x2="90" y2="20" class="svg-axis" stroke-width="2"/>
  <polygon points="380,126 380,134 388,130" class="svg-axis-fill"/>

  <!-- Standard basis î (unit, gray) and ĵ (unit, gray) for reference -->
  <line x1="90" y1="130" x2="142" y2="130" stroke="#94a3b8" stroke-width="2" marker-end="url(#bc-gray)"/>
  <text x="146" y="125" font-size="11" class="svg-muted">î</text>
  <line x1="90" y1="130" x2="90" y2="78" stroke="#94a3b8" stroke-width="2" marker-end="url(#bc-gray)"/>
  <text x="96" y="82" font-size="11" class="svg-muted">ĵ</text>

  <!-- 3î = [3,0]: origin to (255,130) -->
  <line x1="90" y1="130" x2="249" y2="130" stroke="#2563eb" stroke-width="3" marker-end="url(#bc-blue)"/>
  <text x="130" y="146" font-size="13" fill="#2563eb" font-weight="700">3î = [3, 0]</text>

  <!-- -2ĵ placed tip to tail at (255,130) to (255,240) -->
  <line x1="255" y1="130" x2="255" y2="234" stroke="#d97706" stroke-width="3" marker-end="url(#bc-amber)"/>
  <text x="262" y="190" font-size="13" fill="#d97706" font-weight="700">-2ĵ = [0, -2]</text>

  <!-- Sum: [3,-2] from origin -->
  <line x1="90" y1="130" x2="250" y2="237" stroke="#10b981" stroke-width="3.5" marker-end="url(#bc-green)"/>
  <text x="120" y="220" font-size="13" fill="#10b981" font-weight="700">[3, -2]</text>

  <text x="200" y="262" font-size="11" class="svg-muted" text-anchor="middle">The coordinates [3, -2] ARE the weights: 3î + (-2)ĵ</text>
</svg>
