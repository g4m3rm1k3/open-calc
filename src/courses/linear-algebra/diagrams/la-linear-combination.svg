<svg viewBox="0 0 440 260" xmlns="http://www.w3.org/2000/svg" style="font-family: ui-sans-serif, system-ui, sans-serif; border-radius: 12px;">
  <style>
    .svg-bg    { fill: #f8fafc; }
    .svg-grid  { stroke: #e2e8f0; }
    .svg-axis  { stroke: #94a3b8; }
    .svg-axis-fill { fill: #94a3b8; }
    .svg-muted { fill: #94a3b8; }
    .dark .svg-bg    { fill: #0f172a; }
    .dark .svg-grid  { stroke: #1e293b; }
    .dark .svg-axis  { stroke: #475569; }
    .dark .svg-axis-fill { fill: #475569; }
    .dark .svg-muted { fill: #64748b; }
  </style>
  <rect width="440" height="260" rx="12" class="svg-bg"/>
  <defs>
    <marker id="lc-gray" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto"><path d="M1,1 L1,6 L6,3.5 z" fill="#94a3b8"/></marker>
    <marker id="lc-blue" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M1,1 L1,7 L7,4 z" fill="#2563eb"/></marker>
    <marker id="lc-amber" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M1,1 L1,7 L7,4 z" fill="#d97706"/></marker>
    <marker id="lc-green" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M1,1 L1,7 L7,4 z" fill="#10b981"/></marker>
  </defs>

  <!-- Grid: x in [-1,7], y in [-3,1], 45px/unit, origin at (85,85) -->
  <line x1="40" y1="20" x2="40" y2="240" class="svg-grid" stroke-width="1"/>
  <line x1="130" y1="20" x2="130" y2="240" class="svg-grid" stroke-width="1"/>
  <line x1="175" y1="20" x2="175" y2="240" class="svg-grid" stroke-width="1"/>
  <line x1="220" y1="20" x2="220" y2="240" class="svg-grid" stroke-width="1"/>
  <line x1="265" y1="20" x2="265" y2="240" class="svg-grid" stroke-width="1"/>
  <line x1="310" y1="20" x2="310" y2="240" class="svg-grid" stroke-width="1"/>
  <line x1="400" y1="20" x2="400" y2="240" class="svg-grid" stroke-width="1"/>
  <line x1="20" y1="40" x2="420" y2="40" class="svg-grid" stroke-width="1"/>
  <line x1="20" y1="130" x2="420" y2="130" class="svg-grid" stroke-width="1"/>
  <line x1="20" y1="175" x2="420" y2="175" class="svg-grid" stroke-width="1"/>
  <line x1="20" y1="220" x2="420" y2="220" class="svg-grid" stroke-width="1"/>

  <!-- Axes (x-axis at y=85, y-axis at x=85) -->
  <line x1="20" y1="85" x2="420" y2="85" class="svg-axis" stroke-width="2"/>
  <line x1="85" y1="240" x2="85" y2="20" class="svg-axis" stroke-width="2"/>
  <polygon points="420,81 420,89 428,85" class="svg-axis-fill"/>

  <!-- Reference (unscaled) v1 = [2,0] and v2 = [0,1], dashed gray -->
  <line x1="85" y1="85" x2="170" y2="85" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#lc-gray)"/>
  <text x="160" y="78" font-size="11" class="svg-muted">v₁</text>
  <line x1="85" y1="85" x2="85" y2="44" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#lc-gray)"/>
  <text x="92" y="50" font-size="11" class="svg-muted">v₂</text>

  <!-- 3v1 = [6,0]: origin to (355,85) -->
  <line x1="85" y1="85" x2="349" y2="85" stroke="#2563eb" stroke-width="3" marker-end="url(#lc-blue)"/>
  <text x="200" y="100" font-size="13" fill="#2563eb" font-weight="700">3v₁ = [6, 0]</text>

  <!-- -2v2 = [0,-2] placed tip-to-tail at (355,85) to (355,175) -->
  <line x1="355" y1="85" x2="355" y2="169" stroke="#d97706" stroke-width="3" marker-end="url(#lc-amber)"/>
  <text x="362" y="135" font-size="13" fill="#d97706" font-weight="700">-2v₂ = [0, -2]</text>

  <!-- Sum vector [6,-2]: origin straight to (355,175) -->
  <line x1="85" y1="85" x2="350" y2="172" stroke="#10b981" stroke-width="3.5" marker-end="url(#lc-green)"/>
  <text x="190" y="155" font-size="13" fill="#10b981" font-weight="700">3v₁ - 2v₂ = [6, -2]</text>

  <text x="230" y="252" font-size="11" class="svg-muted" text-anchor="middle">Scale each vector, then place tip-to-tail — that is a linear combination</text>
</svg>
