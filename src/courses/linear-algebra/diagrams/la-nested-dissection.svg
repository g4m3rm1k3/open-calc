<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg" style="font-family: ui-sans-serif, system-ui, sans-serif; border-radius: 10px;">
  <style>
    .svg-bg    { fill: rgb(var(--tw-custom-slate-50)); }
    .svg-muted { fill: rgb(var(--tw-custom-slate-500)); }
    .dark .svg-bg    { fill: rgb(var(--tw-custom-slate-900)); }
    .dark .svg-muted { fill: rgb(var(--tw-custom-slate-400)); }
  </style>
  <rect width="320" height="200" rx="10" class="svg-bg"/>

  <text x="160" y="16" font-size="11" class="svg-muted" text-anchor="middle">Nested dissection: cut with a small separator, recurse</text>

  <rect x="50" y="36" width="220" height="140" fill="none" stroke="#64748b" stroke-width="1.3"/>

  <!-- grid lines suggesting a mesh -->
  <g stroke="#94a3b8" stroke-width="0.6" opacity="0.6">
    <line x1="86" y1="36" x2="86" y2="176"/>
    <line x1="122" y1="36" x2="122" y2="176"/>
    <line x1="198" y1="36" x2="198" y2="176"/>
    <line x1="234" y1="36" x2="234" y2="176"/>
    <line x1="50" y1="71" x2="270" y2="71"/>
    <line x1="50" y1="106" x2="270" y2="106"/>
    <line x1="50" y1="141" x2="270" y2="141"/>
  </g>

  <!-- left half label -->
  <text x="100" y="106" font-size="11" fill="#2563eb" font-weight="700" text-anchor="middle">left half</text>
  <!-- right half label -->
  <text x="220" y="106" font-size="11" fill="#d97706" font-weight="700" text-anchor="middle">right half</text>

  <!-- separator strip -->
  <rect x="150" y="36" width="20" height="140" fill="rgba(220,38,38,0.18)" stroke="#dc2626" stroke-width="1.5"/>
  <text x="160" y="26" font-size="9.5" fill="#dc2626" font-weight="700" text-anchor="middle">separator</text>

  <text x="160" y="194" font-size="9.5" class="svg-muted" text-anchor="middle">eliminate both halves first, the small separator last</text>
</svg>
