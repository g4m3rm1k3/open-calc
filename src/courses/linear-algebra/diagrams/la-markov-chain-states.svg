<svg viewBox="0 0 360 220" xmlns="http://www.w3.org/2000/svg" style="font-family: ui-sans-serif, system-ui, sans-serif; border-radius: 12px;">
  <style>
    .svg-bg    { fill: #f8fafc; }
    .svg-text  { fill: #1e293b; }
    .svg-muted { fill: #64748b; }
    .dark .svg-bg    { fill: #0f172a; }
    .dark .svg-text  { fill: #e2e8f0; }
    .dark .svg-muted { fill: #94a3b8; }
  </style>
  <rect width="360" height="220" rx="12" class="svg-bg"/>
  <defs>
    <marker id="mk-blue" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M1,1 L1,7 L7,4 z" fill="#2563eb"/></marker>
    <marker id="mk-amber" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M1,1 L1,7 L7,4 z" fill="#d97706"/></marker>
  </defs>

  <text x="180" y="18" font-size="11.5" class="svg-text" text-anchor="middle" font-weight="700">A transition diagram for P — columns sum to 1</text>

  <!-- Sunny state -->
  <circle cx="100" cy="100" r="42" fill="rgba(217,119,6,0.12)" stroke="#d97706" stroke-width="2"/>
  <text x="100" y="96" font-size="13" fill="#d97706" font-weight="700" text-anchor="middle">Sunny</text>
  <text x="100" y="112" font-size="10" fill="#d97706" text-anchor="middle">q = 2/3</text>

  <!-- Rainy state -->
  <circle cx="260" cy="100" r="42" fill="rgba(37,99,235,0.12)" stroke="#2563eb" stroke-width="2"/>
  <text x="260" y="96" font-size="13" fill="#2563eb" font-weight="700" text-anchor="middle">Rainy</text>
  <text x="260" y="112" font-size="10" fill="#2563eb" text-anchor="middle">q = 1/3</text>

  <!-- self loop: sunny stays sunny 0.8 -->
  <path d="M 78 64 A 26 26 0 1 1 90 62" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#mk-amber)"/>
  <text x="60" y="36" font-size="11" fill="#d97706">0.8</text>

  <!-- self loop: rainy stays rainy 0.6 -->
  <path d="M 270 64 A 26 26 0 1 0 258 62" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#mk-blue)"/>
  <text x="280" y="36" font-size="11" fill="#2563eb">0.6</text>

  <!-- sunny -> rainy 0.2 -->
  <path d="M 138 112 Q 180 140 222 112" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#mk-amber)"/>
  <text x="180" y="150" font-size="11" fill="#d97706" text-anchor="middle">0.2</text>

  <!-- rainy -> sunny 0.4 -->
  <path d="M 222 88 Q 180 60 138 88" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#mk-blue)"/>
  <text x="180" y="58" font-size="11" fill="#2563eb" text-anchor="middle">0.4</text>

  <text x="180" y="200" font-size="11" class="svg-muted" text-anchor="middle">Any starting mix converges here: steady state q = [2/3, 1/3] — the eigenvector for λ = 1</text>
</svg>
