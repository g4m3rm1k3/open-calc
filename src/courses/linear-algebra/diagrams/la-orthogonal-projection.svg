<svg viewBox="0 0 320 240" xmlns="http://www.w3.org/2000/svg" style="font-family: ui-sans-serif, system-ui, sans-serif; border-radius: 12px;">
  <style>
    .svg-bg    { fill: #f8fafc; }
    .svg-muted { fill: #94a3b8; }
    .dark .svg-bg    { fill: #0f172a; }
    .dark .svg-muted { fill: #64748b; }
  </style>
  <rect width="320" height="240" rx="12" class="svg-bg"/>
  <defs>
    <marker id="op-blue" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M1,1 L1,7 L7,4 z" fill="#2563eb"/></marker>
    <marker id="op-green" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M1,1 L1,7 L7,4 z" fill="#10b981"/></marker>
    <marker id="op-gray" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto"><path d="M1,1 L1,6 L6,3.5 z" fill="#94a3b8"/></marker>
  </defs>

  <!-- the line spanned by a -->
  <line x1="40" y1="200" x2="280" y2="200" stroke="#94a3b8" stroke-width="2" marker-end="url(#op-gray)"/>
  <text x="240" y="216" font-size="11" class="svg-muted">line spanned by a</text>

  <!-- b -->
  <line x1="40" y1="200" x2="127" y2="83" stroke="#2563eb" stroke-width="3" marker-end="url(#op-blue)"/>
  <text x="132" y="80" font-size="13" fill="#2563eb" font-weight="700">b</text>

  <!-- p: projection onto the line -->
  <line x1="40" y1="200" x2="127" y2="200" stroke="#10b981" stroke-width="3.5" marker-end="url(#op-green)"/>
  <text x="100" y="195" font-size="12" fill="#10b981" font-weight="700">p = proj of b</text>

  <!-- e: perpendicular error -->
  <line x1="130" y1="83" x2="130" y2="197" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="5,4"/>
  <text x="138" y="145" font-size="12" fill="#dc2626" font-weight="700">e = b − p</text>

  <!-- right angle mark -->
  <rect x="120" y="188" width="10" height="10" fill="none" stroke="#dc2626" stroke-width="1.3"/>

  <circle cx="40" cy="200" r="3" fill="#1e293b"/>

  <text x="160" y="232" font-size="11" class="svg-muted" text-anchor="middle">e is perpendicular to the line — that's what makes p the CLOSEST point</text>
</svg>
