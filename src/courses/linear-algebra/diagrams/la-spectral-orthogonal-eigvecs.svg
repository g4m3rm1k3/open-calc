<svg viewBox="0 0 460 220" xmlns="http://www.w3.org/2000/svg" style="font-family: ui-sans-serif, system-ui, sans-serif; border-radius: 10px;">
  <style>
    .svg-bg    { fill: rgb(var(--tw-custom-slate-50)); }
    .svg-panel { fill: #ffffff; }
    .svg-text  { fill: rgb(var(--tw-custom-slate-800)); }
    .svg-muted { fill: rgb(var(--tw-custom-slate-500)); }
    .svg-div   { stroke: rgb(var(--tw-custom-slate-200)); fill: none; }
    .dark .svg-bg    { fill: rgb(var(--tw-custom-slate-900)); }
    .dark .svg-panel { fill: rgb(var(--tw-custom-slate-800)); }
    .dark .svg-text  { fill: rgb(var(--tw-custom-slate-200)); }
    .dark .svg-muted { fill: rgb(var(--tw-custom-slate-400)); }
    .dark .svg-div   { stroke: rgb(var(--tw-custom-slate-700)); }
  </style>
  <rect width="460" height="220" rx="10" class="svg-bg"/>
  <defs>
    <marker id="se-blue" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto"><path d="M1,1 L1,6 L6,3.5 z" fill="#2563eb"/></marker>
    <marker id="se-amber" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto"><path d="M1,1 L1,6 L6,3.5 z" fill="#d97706"/></marker>
  </defs>

  <!-- Panel 1: symmetric, orthogonal eigenvectors -->
  <rect x="12" y="20" width="216" height="186" rx="8" class="svg-panel svg-div" stroke-width="1"/>
  <text x="120" y="38" font-size="11.5" fill="#10b981" text-anchor="middle" font-weight="700">Symmetric A = Aᵗ</text>
  <line x1="110" y1="110" x2="160" y2="160" stroke="#2563eb" stroke-width="2.5" marker-end="url(#se-blue)"/>
  <text x="166" y="166" font-size="11" fill="#2563eb" font-weight="700">v₁ (λ=2)</text>
  <line x1="110" y1="110" x2="160" y2="60" stroke="#d97706" stroke-width="2.5" marker-end="url(#se-amber)"/>
  <text x="166" y="56" font-size="11" fill="#d97706" font-weight="700">v₂ (λ=4)</text>
  <circle cx="110" cy="110" r="3" fill="#1e293b"/>
  <text x="120" y="195" font-size="9.5" fill="#10b981" text-anchor="middle">v₁ ⊥ v₂ — guaranteed</text>

  <!-- Panel 2: non-symmetric, eigenvectors not orthogonal -->
  <rect x="232" y="20" width="216" height="186" rx="8" class="svg-panel svg-div" stroke-width="1"/>
  <text x="340" y="38" font-size="11.5" fill="#dc2626" text-anchor="middle" font-weight="700">Non-symmetric B ≠ Bᵗ</text>
  <line x1="330" y1="110" x2="380" y2="110" stroke="#2563eb" stroke-width="2.5" marker-end="url(#se-blue)"/>
  <text x="386" y="114" font-size="11" fill="#2563eb" font-weight="700">v₁ (λ=1)</text>
  <line x1="330" y1="110" x2="380" y2="60" stroke="#d97706" stroke-width="2.5" marker-end="url(#se-amber)"/>
  <text x="386" y="56" font-size="11" fill="#d97706" font-weight="700">v₂ (λ=3)</text>
  <circle cx="330" cy="110" r="3" fill="#1e293b"/>
  <text x="340" y="195" font-size="9.5" fill="#dc2626" text-anchor="middle">v₁, v₂ — not perpendicular</text>
</svg>
