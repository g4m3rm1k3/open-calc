<svg viewBox="0 0 280 196" xmlns="http://www.w3.org/2000/svg" style="font-family: ui-sans-serif, system-ui, sans-serif; border-radius: 10px;">
  <style>
    .svg-bg    { fill: #f8fafc; }
    .svg-text  { fill: #1e293b; }
    .svg-muted { fill: #64748b; }
    .svg-cell  { stroke: #cbd5e1; fill: #ffffff; }
    .dark .svg-bg    { fill: #0f172a; }
    .dark .svg-text  { fill: #e2e8f0; }
    .dark .svg-muted { fill: #94a3b8; }
    .dark .svg-cell  { stroke: #475569; fill: #1e293b; }
  </style>
  <rect width="280" height="196" rx="10" class="svg-bg"/>

  <text x="140" y="14" font-size="10.5" class="svg-text" text-anchor="middle" font-weight="700">u ⊗ v = uvᵗ</text>
  <text x="140" y="27" font-size="9.5" class="svg-muted" text-anchor="middle">every pairwise product, laid out as a grid</text>

  <!-- v as row header on top -->
  <rect x="100" y="48" width="40" height="26" fill="rgba(217,119,6,0.16)" stroke="#d97706" stroke-width="1.3"/>
  <text x="120" y="65" font-size="12" fill="#d97706" font-weight="700" text-anchor="middle">3</text>
  <rect x="140" y="48" width="40" height="26" fill="rgba(217,119,6,0.16)" stroke="#d97706" stroke-width="1.3"/>
  <text x="160" y="65" font-size="12" fill="#d97706" font-weight="700" text-anchor="middle">4</text>
  <text x="60" y="65" font-size="10" fill="#d97706" font-weight="700">v = (3, 4)</text>

  <!-- u as column header on left -->
  <rect x="60" y="74" width="40" height="26" fill="rgba(37,99,235,0.14)" stroke="#2563eb" stroke-width="1.3"/>
  <text x="80" y="91" font-size="12" fill="#2563eb" font-weight="700" text-anchor="middle">2</text>
  <rect x="60" y="100" width="40" height="26" fill="rgba(37,99,235,0.14)" stroke="#2563eb" stroke-width="1.3"/>
  <text x="80" y="117" font-size="12" fill="#2563eb" font-weight="700" text-anchor="middle">1</text>
  <text x="80" y="138" font-size="10" fill="#2563eb" font-weight="700" text-anchor="middle">u</text>

  <!-- result grid -->
  <rect x="100" y="74" width="40" height="26" class="svg-cell" stroke-width="1"/>
  <text x="120" y="91" font-size="13" class="svg-text" text-anchor="middle">6</text>
  <rect x="140" y="74" width="40" height="26" class="svg-cell" stroke-width="1"/>
  <text x="160" y="91" font-size="13" class="svg-text" text-anchor="middle">8</text>
  <rect x="100" y="100" width="40" height="26" class="svg-cell" stroke-width="1"/>
  <text x="120" y="117" font-size="13" class="svg-text" text-anchor="middle">3</text>
  <rect x="140" y="100" width="40" height="26" class="svg-cell" stroke-width="1"/>
  <text x="160" y="117" font-size="13" class="svg-text" text-anchor="middle">4</text>

  <text x="140" y="160" font-size="9.5" class="svg-muted" text-anchor="middle">cell (i,j) = uᵢ × vⱼ — a rank-1 matrix</text>
  <text x="140" y="176" font-size="9.5" class="svg-muted" text-anchor="middle">this grid is the elementary tensor u ⊗ v itself</text>
</svg>
