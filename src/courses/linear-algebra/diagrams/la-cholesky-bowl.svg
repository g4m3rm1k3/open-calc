<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg" style="font-family: ui-sans-serif, system-ui, sans-serif; border-radius: 10px;">
  <style>
    .svg-bg    { fill: #f8fafc; }
    .svg-text  { fill: #1e293b; }
    .svg-muted { fill: #64748b; }
    .dark .svg-bg    { fill: #0f172a; }
    .dark .svg-text  { fill: #e2e8f0; }
    .dark .svg-muted { fill: #94a3b8; }
  </style>
  <rect width="320" height="200" rx="10" class="svg-bg"/>

  <text x="160" y="18" font-size="11.5" class="svg-text" text-anchor="middle" font-weight="700">Positive definite: xᵗAx &gt; 0 in every direction</text>

  <path d="M 50 70 Q 160 175 270 70 L 270 70 Q 160 230 50 70 Z" fill="rgba(16,185,129,0.15)" stroke="none"/>
  <path d="M 50 70 Q 160 175 270 70" fill="none" stroke="#10b981" stroke-width="2.5"/>
  <line x1="35" y1="70" x2="285" y2="70" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>
  <circle cx="160" cy="172" r="4" fill="#10b981"/>
  <text x="160" y="150" font-size="10" fill="#10b981" text-anchor="middle" font-weight="700">unique minimum at 0 — a bowl</text>

  <!-- contrast: saddle hint, faded -->
  <text x="160" y="40" font-size="9.5" class="svg-muted" text-anchor="middle">No negative eigenvalues, no downward direction</text>
  <text x="160" y="54" font-size="9.5" class="svg-muted" text-anchor="middle">— Cholesky never hits √(negative)</text>

  <text x="160" y="188" font-size="9.5" class="svg-muted" text-anchor="middle">This is what "A is SPD" buys you, geometrically</text>
</svg>
