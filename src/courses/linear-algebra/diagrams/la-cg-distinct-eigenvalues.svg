<svg viewBox="0 0 340 200" xmlns="http://www.w3.org/2000/svg" style="font-family: ui-sans-serif, system-ui, sans-serif; border-radius: 10px;">
  <style>
    .svg-bg    { fill: rgb(var(--tw-custom-slate-50)); }
    .svg-axis  { stroke: rgb(var(--tw-custom-slate-400)); }
    .svg-text  { fill: rgb(var(--tw-custom-slate-800)); }
    .svg-muted { fill: rgb(var(--tw-custom-slate-500)); }
    .dark .svg-bg    { fill: rgb(var(--tw-custom-slate-900)); }
    .dark .svg-axis  { stroke: rgb(var(--tw-custom-slate-600)); }
    .dark .svg-text  { fill: rgb(var(--tw-custom-slate-200)); }
    .dark .svg-muted { fill: rgb(var(--tw-custom-slate-400)); }
  </style>
  <rect width="340" height="200" rx="10" class="svg-bg"/>

  <text x="170" y="16" font-size="11" class="svg-text" text-anchor="middle" font-weight="700">CG steps = number of distinct eigenvalues, not matrix size n</text>

  <!-- top number line: {1,1,1,100} -->
  <text x="20" y="55" font-size="10" class="svg-muted">A: 4×4, λ = {1,1,1,100}</text>
  <line x1="40" y1="75" x2="300" y2="75" class="svg-axis" stroke-width="1.3"/>
  <circle cx="60" cy="75" r="5" fill="#2563eb"/>
  <text x="60" y="92" font-size="9" fill="#2563eb" text-anchor="middle">λ=1 (×3)</text>
  <circle cx="270" cy="75" r="5" fill="#2563eb"/>
  <text x="270" y="92" font-size="9" fill="#2563eb" text-anchor="middle">λ=100</text>
  <text x="335" y="79" font-size="10" fill="#10b981" font-weight="700" text-anchor="end">2 steps</text>

  <!-- bottom number line: {1,2,3,4} -->
  <text x="20" y="135" font-size="10" class="svg-muted">A: 4×4, λ = {1,2,3,4}</text>
  <line x1="40" y1="155" x2="300" y2="155" class="svg-axis" stroke-width="1.3"/>
  <circle cx="60" cy="155" r="5" fill="#d97706"/>
  <circle cx="120" cy="155" r="5" fill="#d97706"/>
  <circle cx="180" cy="155" r="5" fill="#d97706"/>
  <circle cx="240" cy="155" r="5" fill="#d97706"/>
  <text x="150" y="172" font-size="9" fill="#d97706" text-anchor="middle">four distinct values</text>
  <text x="335" y="159" font-size="10" fill="#dc2626" font-weight="700" text-anchor="end">4 steps</text>
</svg>
