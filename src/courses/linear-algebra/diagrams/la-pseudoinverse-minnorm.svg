<svg viewBox="0 0 320 220" xmlns="http://www.w3.org/2000/svg" style="font-family: ui-sans-serif, system-ui, sans-serif; border-radius: 12px;">
  <style>
    .svg-bg    { fill: rgb(var(--tw-custom-slate-50)); }
    .svg-muted { fill: rgb(var(--tw-custom-slate-400)); }
    .dark .svg-bg    { fill: rgb(var(--tw-custom-slate-900)); }
    .dark .svg-muted { fill: rgb(var(--tw-custom-slate-500)); }
  </style>
  <rect width="320" height="220" rx="12" class="svg-bg"/>
  <defs>
    <marker id="pi-green" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M1,1 L1,7 L7,4 z" fill="#10b981"/></marker>
  </defs>

  <text x="160" y="16" font-size="11" class="svg-muted" text-anchor="middle">All exact solutions lie on one line — only one is closest to the origin</text>

  <!-- the solution line: x_p + N(A) -->
  <line x1="80" y1="30" x2="250" y2="178" stroke="#64748b" stroke-width="2"/>
  <text x="255" y="182" font-size="10.5" class="svg-muted">solution line xₚ + N(A)</text>

  <!-- other solutions on the line, gray -->
  <circle cx="111" cy="58" r="4" fill="#94a3b8"/>
  <circle cx="174" cy="112" r="4" fill="#94a3b8"/>
  <text x="180" y="118" font-size="9.5" class="svg-muted">larger ‖x‖</text>

  <!-- minimum norm solution -->
  <circle cx="141" cy="84" r="5" fill="#10b981"/>
  <text x="148" y="80" font-size="11" fill="#10b981" font-weight="700">x⁺ = A⁺b</text>

  <!-- dashed perpendicular from origin -->
  <line x1="50" y1="190" x2="139" y2="86" stroke="#10b981" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#pi-green)"/>
  <circle cx="50" cy="190" r="3" fill="#1e293b"/>
  <text x="40" y="205" font-size="10.5" class="svg-text" fill="#1e293b">0</text>

  <text x="160" y="208" font-size="10.5" fill="#10b981" text-anchor="middle">x⁺ is the closest solution to the origin — the minimum-norm answer</text>
</svg>
