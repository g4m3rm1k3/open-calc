<svg viewBox="0 0 280 230" xmlns="http://www.w3.org/2000/svg" style="font-family: ui-sans-serif, system-ui, sans-serif; border-radius: 12px;">
  <style>
    .svg-bg    { fill: rgb(var(--tw-custom-slate-50)); }
    .svg-axis  { stroke: rgb(var(--tw-custom-slate-400)); }
    .svg-muted { fill: rgb(var(--tw-custom-slate-400)); }
    .dark .svg-bg    { fill: rgb(var(--tw-custom-slate-900)); }
    .dark .svg-axis  { stroke: rgb(var(--tw-custom-slate-600)); }
    .dark .svg-muted { fill: rgb(var(--tw-custom-slate-500)); }
  </style>
  <rect width="280" height="230" rx="12" class="svg-bg"/>

  <!-- axes -->
  <line x1="40" y1="200" x2="240" y2="200" class="svg-axis" stroke-width="1.5"/>
  <line x1="40" y1="200" x2="40" y2="20" class="svg-axis" stroke-width="1.5"/>
  <text x="244" y="204" font-size="10.5" class="svg-muted">x</text>
  <text x="44" y="18" font-size="10.5" class="svg-muted">y</text>

  <!-- best-fit line y = 1.5x + 5/6 -->
  <line x1="40" y1="167" x2="160" y2="47" stroke="#10b981" stroke-width="2.5"/>
  <text x="165" y="44" font-size="11" fill="#10b981" font-weight="700">best-fit line</text>

  <!-- residuals, dashed red, vertical -->
  <line x1="40" y1="160" x2="40" y2="167" stroke="#dc2626" stroke-width="2" stroke-dasharray="3,2"/>
  <line x1="100" y1="120" x2="100" y2="107" stroke="#dc2626" stroke-width="2" stroke-dasharray="3,2"/>
  <line x1="160" y1="40" x2="160" y2="47" stroke="#dc2626" stroke-width="2" stroke-dasharray="3,2"/>

  <!-- data points -->
  <circle cx="40" cy="160" r="5" fill="#2563eb"/>
  <circle cx="100" cy="120" r="5" fill="#2563eb"/>
  <circle cx="160" cy="40" r="5" fill="#2563eb"/>
  <text x="20" y="150" font-size="9.5" fill="#2563eb">(0,1)</text>
  <text x="106" y="112" font-size="9.5" fill="#2563eb">(1,2)</text>
  <text x="166" y="34" font-size="9.5" fill="#2563eb">(2,4)</text>

  <text x="140" y="220" font-size="10.5" fill="#dc2626" text-anchor="middle">residuals (dashed) — minimize the sum of their squares</text>
</svg>
