<svg viewBox="0 0 520 220" xmlns="http://www.w3.org/2000/svg" style="font-family: ui-sans-serif, system-ui, sans-serif; border-radius: 10px;">
  <style>
    .svg-bg    { fill: rgb(var(--tw-custom-slate-50)); }
    .svg-panel { fill: #ffffff; }
    .svg-text  { fill: rgb(var(--tw-custom-slate-800)); }
    .svg-muted { fill: rgb(var(--tw-custom-slate-500)); }
    .svg-div   { stroke: rgb(var(--tw-custom-slate-200)); fill: none; }
    .dark .svg-bg    { fill: rgb(var(--tw-custom-slate-900)); }
    .dark .svg-panel { fill: rgb(var(--tw-custom-slate-800)); }
    .dark .svg-text  { fill: rgb(var(--tw-custom-slate-200)); }
    .dark .svg-muted { fill: rgb(var(--tw-custom-slate-400)); }
    .dark .svg-div   { stroke: rgb(var(--tw-custom-slate-700)); }
  </style>
  <rect width="520" height="220" rx="10" class="svg-bg"/>

  <text x="260" y="18" font-size="11" class="svg-text" text-anchor="middle" font-weight="700">The Row Picture: every linear system is two lines (or planes) — three possible outcomes</text>

  <!-- Panel 1: unique solution -->
  <rect x="16" y="26" width="152" height="176" rx="8" class="svg-panel svg-div" stroke-width="1"/>
  <text x="92" y="44" font-size="10" fill="#10b981" text-anchor="middle" font-weight="700">Lines cross</text>
  <line x1="30" y1="180" x2="155" y2="50" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="30" y1="60" x2="155" y2="170" stroke="#d97706" stroke-width="2.5"/>
  <circle cx="92" cy="115" r="4" fill="#10b981"/>
  <text x="92" y="192" font-size="9" fill="#10b981" text-anchor="middle">One unique solution</text>

  <!-- Panel 2: no solution (parallel) -->
  <rect x="184" y="26" width="152" height="176" rx="8" class="svg-panel svg-div" stroke-width="1"/>
  <text x="260" y="44" font-size="10" fill="#dc2626" text-anchor="middle" font-weight="700">Lines parallel</text>
  <line x1="198" y1="178" x2="323" y2="68" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="198" y1="196" x2="323" y2="86" stroke="#d97706" stroke-width="2.5"/>
  <text x="260" y="192" font-size="9" fill="#dc2626" text-anchor="middle">No solution — never meet</text>

  <!-- Panel 3: infinite solutions (identical lines) -->
  <rect x="352" y="26" width="152" height="176" rx="8" class="svg-panel svg-div" stroke-width="1"/>
  <text x="428" y="44" font-size="10" fill="#7c3aed" text-anchor="middle" font-weight="700">Lines identical</text>
  <line x1="366" y1="178" x2="491" y2="68" stroke="#2563eb" stroke-width="3.5" opacity="0.55"/>
  <line x1="366" y1="178" x2="491" y2="68" stroke="#d97706" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="428" y="192" font-size="9" fill="#7c3aed" text-anchor="middle">Infinitely many — same line</text>
</svg>
