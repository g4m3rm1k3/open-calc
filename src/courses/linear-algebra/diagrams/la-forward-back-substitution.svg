<svg viewBox="0 0 460 210" xmlns="http://www.w3.org/2000/svg" style="font-family: ui-sans-serif, system-ui, sans-serif; border-radius: 10px;">
  <style>
    .svg-bg    { fill: rgb(var(--tw-custom-slate-50)); }
    .svg-panel { fill: #ffffff; }
    .svg-text  { fill: rgb(var(--tw-custom-slate-800)); }
    .svg-muted { fill: rgb(var(--tw-custom-slate-500)); }
    .svg-div   { stroke: rgb(var(--tw-custom-slate-200)); fill: none; }
    .dark .svg-bg    { fill: rgb(var(--tw-custom-slate-900)); }
    .dark .svg-panel { fill: rgb(var(--tw-custom-slate-800)); }
    .dark .svg-text  { fill: rgb(var(--tw-custom-slate-200)); }
    .dark .svg-muted { fill: rgb(var(--tw-custom-slate-400)); }
    .dark .svg-div   { stroke: rgb(var(--tw-custom-slate-700)); }
  </style>
  <rect width="460" height="210" rx="10" class="svg-bg"/>
  <defs>
    <marker id="fb-blue" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M1,1 L1,7 L7,4 z" fill="#2563eb"/></marker>
    <marker id="fb-amber" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M1,1 L1,7 L7,4 z" fill="#d97706"/></marker>
  </defs>

  <!-- Panel 1: forward substitution -->
  <rect x="12" y="20" width="216" height="178" rx="8" class="svg-panel svg-div" stroke-width="1"/>
  <text x="120" y="40" font-size="12" fill="#2563eb" text-anchor="middle" font-weight="700">Forward: Ly = b</text>
  <polygon points="55,65 55,155 145,155" fill="rgba(37,99,235,0.15)" stroke="#2563eb" stroke-width="1.5"/>
  <text x="100" y="148" font-size="9" fill="#2563eb">L (lower triangular)</text>
  <line x1="180" y1="75" x2="180" y2="145" stroke="#2563eb" stroke-width="2.5" marker-end="url(#fb-blue)"/>
  <text x="180" y="68" font-size="10" fill="#2563eb" text-anchor="middle">top → bottom</text>
  <text x="180" y="170" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="700">y₁ → y₂ → y₃</text>

  <!-- Panel 2: back substitution -->
  <rect x="232" y="20" width="216" height="178" rx="8" class="svg-panel svg-div" stroke-width="1"/>
  <text x="340" y="40" font-size="12" fill="#d97706" text-anchor="middle" font-weight="700">Back: Ux = y</text>
  <polygon points="295,155 385,155 385,65" fill="rgba(217,119,6,0.15)" stroke="#d97706" stroke-width="1.5"/>
  <text x="300" y="148" font-size="9" fill="#d97706">U (upper triangular)</text>
  <line x1="260" y1="145" x2="260" y2="75" stroke="#d97706" stroke-width="2.5" marker-end="url(#fb-amber)"/>
  <text x="260" y="170" font-size="10" fill="#d97706" text-anchor="middle">bottom → top</text>
  <text x="260" y="68" font-size="11" fill="#d97706" text-anchor="middle" font-weight="700">x₃ → x₂ → x₁</text>
</svg>
