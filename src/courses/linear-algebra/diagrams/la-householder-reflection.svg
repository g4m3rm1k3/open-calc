<svg viewBox="0 0 320 220" xmlns="http://www.w3.org/2000/svg" style="font-family: ui-sans-serif, system-ui, sans-serif; border-radius: 12px;">
  <style>
    .svg-bg    { fill: #f8fafc; }
    .svg-grid  { stroke: #e2e8f0; }
    .svg-axis  { stroke: #94a3b8; }
    .svg-muted { fill: #94a3b8; }
    .dark .svg-bg    { fill: #0f172a; }
    .dark .svg-grid  { stroke: #1e293b; }
    .dark .svg-axis  { stroke: #475569; }
    .dark .svg-muted { fill: #64748b; }
  </style>
  <rect width="320" height="220" rx="12" class="svg-bg"/>
  <defs>
    <marker id="hh-blue" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M1,1 L1,7 L7,4 z" fill="#2563eb"/></marker>
    <marker id="hh-green" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M1,1 L1,7 L7,4 z" fill="#10b981"/></marker>
  </defs>

  <text x="160" y="16" font-size="11" class="svg-muted" text-anchor="middle">Hx reflects x across a hyperplane onto the axis</text>

  <line x1="20" y1="190" x2="300" y2="190" class="svg-axis" stroke-width="1.3"/>
  <line x1="70" y1="210" x2="70" y2="30" class="svg-axis" stroke-width="1.3"/>

  <!-- x = (3,4) scaled 25px/unit -->
  <line x1="70" y1="190" x2="145" y2="90" stroke="#2563eb" stroke-width="3" marker-end="url(#hh-blue)"/>
  <text x="150" y="86" font-size="13" fill="#2563eb" font-weight="700">x = (3, 4)</text>

  <!-- Hx = (5,0) along axis -->
  <line x1="70" y1="190" x2="195" y2="190" stroke="#10b981" stroke-width="3" marker-end="url(#hh-green)"/>
  <text x="198" y="194" font-size="13" fill="#10b981" font-weight="700">Hx = (5, 0)</text>

  <!-- mirror hyperplane: perpendicular bisector of x and Hx -->
  <line x1="105" y1="50" x2="170" y2="220" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="100" y="44" font-size="10" fill="#d97706" font-weight="700">mirror plane ⟂ v</text>

  <circle cx="70" cy="190" r="3" fill="#1e293b"/>

  <text x="160" y="206" font-size="9.5" class="svg-muted" text-anchor="middle">‖x‖ = ‖Hx‖ = 5 — reflection preserves length, just changes direction</text>
</svg>
