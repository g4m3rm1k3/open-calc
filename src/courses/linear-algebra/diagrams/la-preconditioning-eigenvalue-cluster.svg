<svg viewBox="0 0 340 190" xmlns="http://www.w3.org/2000/svg" style="font-family: ui-sans-serif, system-ui, sans-serif; border-radius: 10px;">
  <style>
    .svg-bg    { fill: rgb(var(--tw-custom-slate-50)); }
    .svg-axis  { stroke: rgb(var(--tw-custom-slate-400)); }
    .svg-text  { fill: rgb(var(--tw-custom-slate-800)); }
    .svg-muted { fill: rgb(var(--tw-custom-slate-500)); }
    .dark .svg-bg    { fill: rgb(var(--tw-custom-slate-900)); }
    .dark .svg-axis  { stroke: rgb(var(--tw-custom-slate-600)); }
    .dark .svg-text  { fill: rgb(var(--tw-custom-slate-200)); }
    .dark .svg-muted { fill: rgb(var(--tw-custom-slate-400)); }
  </style>
  <rect width="340" height="190" rx="10" class="svg-bg"/>

  <text x="170" y="16" font-size="11" class="svg-text" text-anchor="middle" font-weight="700">Preconditioning squeezes eigenvalues toward 1</text>

  <text x="20" y="44" font-size="10" fill="#dc2626" font-weight="700">A: κ = 100</text>
  <line x1="40" y1="60" x2="300" y2="60" class="svg-axis" stroke-width="1.3"/>
  <circle cx="45" cy="60" r="4.5" fill="#dc2626"/>
  <circle cx="90" cy="60" r="4.5" fill="#dc2626"/>
  <circle cx="160" cy="60" r="4.5" fill="#dc2626"/>
  <circle cx="230" cy="60" r="4.5" fill="#dc2626"/>
  <circle cx="290" cy="60" r="4.5" fill="#dc2626"/>
  <text x="45" y="76" font-size="9" class="svg-muted" text-anchor="middle">~1</text>
  <text x="290" y="76" font-size="9" class="svg-muted" text-anchor="middle">~100</text>

  <text x="20" y="124" font-size="10" fill="#10b981" font-weight="700">M⁻¹A: κ ≈ 1</text>
  <line x1="40" y1="140" x2="300" y2="140" class="svg-axis" stroke-width="1.3"/>
  <circle cx="165" cy="140" r="4.5" fill="#10b981"/>
  <circle cx="170" cy="140" r="4.5" fill="#10b981"/>
  <circle cx="160" cy="140" r="4.5" fill="#10b981"/>
  <circle cx="175" cy="140" r="4.5" fill="#10b981"/>
  <circle cx="155" cy="140" r="4.5" fill="#10b981"/>
  <text x="165" y="156" font-size="9" class="svg-muted" text-anchor="middle">all clustered near 1</text>

  <text x="170" y="180" font-size="9.5" class="svg-muted" text-anchor="middle">tight clustering near 1 is exactly what fast Krylov convergence needs</text>
</svg>
