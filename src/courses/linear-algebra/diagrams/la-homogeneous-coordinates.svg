<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg" style="font-family: ui-sans-serif, system-ui, sans-serif; border-radius: 10px;">
  <style>
    .svg-bg    { fill: rgb(var(--tw-custom-slate-50)); }
    .svg-text  { fill: rgb(var(--tw-custom-slate-800)); }
    .svg-muted { fill: rgb(var(--tw-custom-slate-500)); }
    .svg-cell  { stroke: rgb(var(--tw-custom-slate-300)); fill: #ffffff; }
    .dark .svg-bg    { fill: rgb(var(--tw-custom-slate-900)); }
    .dark .svg-text  { fill: rgb(var(--tw-custom-slate-200)); }
    .dark .svg-muted { fill: rgb(var(--tw-custom-slate-400)); }
    .dark .svg-cell  { stroke: rgb(var(--tw-custom-slate-600)); fill: rgb(var(--tw-custom-slate-800)); }
  </style>
  <rect width="320" height="200" rx="10" class="svg-bg"/>

  <text x="160" y="16" font-size="11" class="svg-text" text-anchor="middle" font-weight="700">Homogeneous 4×4: rotation/scale block + translation column</text>

  <!-- 4x4 grid: 3x3 rotation/scale (blue), 3x1 translation (amber), bottom row 0 0 0 1 (gray) -->
  <g transform="translate(70,34)">
    <rect x="0" y="0" width="30" height="30" fill="rgba(37,99,235,0.16)" stroke="#2563eb" stroke-width="1.3"/>
    <rect x="30" y="0" width="30" height="30" fill="rgba(37,99,235,0.16)" stroke="#2563eb" stroke-width="1.3"/>
    <rect x="60" y="0" width="30" height="30" fill="rgba(37,99,235,0.16)" stroke="#2563eb" stroke-width="1.3"/>
    <rect x="90" y="0" width="30" height="30" fill="rgba(217,119,6,0.18)" stroke="#d97706" stroke-width="1.5"/>

    <rect x="0" y="30" width="30" height="30" fill="rgba(37,99,235,0.16)" stroke="#2563eb" stroke-width="1.3"/>
    <rect x="30" y="30" width="30" height="30" fill="rgba(37,99,235,0.16)" stroke="#2563eb" stroke-width="1.3"/>
    <rect x="60" y="30" width="30" height="30" fill="rgba(37,99,235,0.16)" stroke="#2563eb" stroke-width="1.3"/>
    <rect x="90" y="30" width="30" height="30" fill="rgba(217,119,6,0.18)" stroke="#d97706" stroke-width="1.5"/>

    <rect x="0" y="60" width="30" height="30" fill="rgba(37,99,235,0.16)" stroke="#2563eb" stroke-width="1.3"/>
    <rect x="30" y="60" width="30" height="30" fill="rgba(37,99,235,0.16)" stroke="#2563eb" stroke-width="1.3"/>
    <rect x="60" y="60" width="30" height="30" fill="rgba(37,99,235,0.16)" stroke="#2563eb" stroke-width="1.3"/>
    <rect x="90" y="60" width="30" height="30" fill="rgba(217,119,6,0.18)" stroke="#d97706" stroke-width="1.5"/>

    <rect x="0" y="90" width="30" height="22" fill="#94a3b8" opacity="0.15" stroke="#64748b" stroke-width="1"/>
    <rect x="30" y="90" width="30" height="22" fill="#94a3b8" opacity="0.15" stroke="#64748b" stroke-width="1"/>
    <rect x="60" y="90" width="30" height="22" fill="#94a3b8" opacity="0.15" stroke="#64748b" stroke-width="1"/>
    <rect x="90" y="90" width="30" height="22" fill="#94a3b8" opacity="0.15" stroke="#64748b" stroke-width="1"/>

    <text x="45" y="44" font-size="11" fill="#2563eb" font-weight="700" text-anchor="middle">R (rotate/scale)</text>
    <text x="105" y="44" font-size="11" fill="#d97706" font-weight="700" text-anchor="middle">t</text>
    <text x="45" y="105" font-size="9.5" class="svg-muted" text-anchor="middle">0  0  0</text>
    <text x="105" y="105" font-size="11" class="svg-muted" text-anchor="middle">1</text>
  </g>

  <text x="160" y="160" font-size="10" class="svg-muted" text-anchor="middle">(x, y, z, 1) → R·(x,y,z) + t, all in one matrix multiply</text>
  <text x="160" y="178" font-size="10" class="svg-muted" text-anchor="middle">rotation, scale, and translation now compose by matrix product alone</text>
</svg>
