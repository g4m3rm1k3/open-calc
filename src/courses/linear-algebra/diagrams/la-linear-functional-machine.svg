<svg viewBox="0 0 320 180" xmlns="http://www.w3.org/2000/svg" style="font-family: ui-sans-serif, system-ui, sans-serif; border-radius: 10px;">
  <style>
    .svg-bg    { fill: #f8fafc; }
    .svg-panel { fill: #ffffff; }
    .svg-text  { fill: #1e293b; }
    .svg-muted { fill: #64748b; }
    .svg-div   { stroke: #e2e8f0; }
    .dark .svg-bg    { fill: #0f172a; }
    .dark .svg-panel { fill: #1e293b; }
    .dark .svg-text  { fill: #e2e8f0; }
    .dark .svg-muted { fill: #94a3b8; }
    .dark .svg-div   { stroke: #334155; }
  </style>
  <rect width="320" height="180" rx="10" class="svg-bg"/>
  <defs>
    <marker id="lf-arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M1,1 L1,7 L7,4 z" fill="#2563eb"/></marker>
  </defs>

  <text x="160" y="16" font-size="11" class="svg-text" text-anchor="middle" font-weight="700">A functional eats a vector, returns a single number</text>

  <!-- input vector -->
  <rect x="20" y="60" width="64" height="40" rx="6" fill="rgba(37,99,235,0.12)" stroke="#2563eb" stroke-width="1.4"/>
  <text x="52" y="84" font-size="12" fill="#2563eb" font-weight="700" text-anchor="middle">(1, 1)</text>
  <text x="52" y="112" font-size="9" class="svg-muted" text-anchor="middle">vector in V</text>

  <line x1="84" y1="80" x2="118" y2="80" stroke="#2563eb" stroke-width="2" marker-end="url(#lf-arrow)"/>

  <!-- functional box -->
  <rect x="120" y="56" width="80" height="48" rx="8" fill="rgba(217,119,6,0.14)" stroke="#d97706" stroke-width="1.6"/>
  <text x="160" y="74" font-size="12" fill="#d97706" font-weight="700" text-anchor="middle">f(x,y)</text>
  <text x="160" y="90" font-size="10" fill="#d97706" text-anchor="middle">= 3x − 2y</text>

  <line x1="200" y1="80" x2="234" y2="80" stroke="#d97706" stroke-width="2" marker-end="url(#lf-arrow)"/>

  <!-- output scalar -->
  <circle cx="262" cy="80" r="24" fill="rgba(16,185,129,0.16)" stroke="#10b981" stroke-width="1.6"/>
  <text x="262" y="86" font-size="14" fill="#10b981" font-weight="700" text-anchor="middle">1</text>
  <text x="262" y="118" font-size="9" fill="#10b981" text-anchor="middle">scalar</text>

  <text x="160" y="148" font-size="10" class="svg-muted" text-anchor="middle">f is a member of V* — the space of all such machines</text>
  <text x="160" y="164" font-size="9.5" class="svg-muted" text-anchor="middle">unlike a linear map V→V, the output is never a vector</text>
</svg>
