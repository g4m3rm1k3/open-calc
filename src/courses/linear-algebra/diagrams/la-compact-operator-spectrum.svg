<svg viewBox="0 0 320 180" xmlns="http://www.w3.org/2000/svg" style="font-family: ui-sans-serif, system-ui, sans-serif; border-radius: 10px;">
  <style>
    .svg-bg    { fill: rgb(var(--tw-custom-slate-50)); }
    .svg-axis  { stroke: rgb(var(--tw-custom-slate-400)); }
    .svg-text  { fill: rgb(var(--tw-custom-slate-800)); }
    .svg-muted { fill: rgb(var(--tw-custom-slate-500)); }
    .dark .svg-bg    { fill: rgb(var(--tw-custom-slate-900)); }
    .dark .svg-axis  { stroke: rgb(var(--tw-custom-slate-600)); }
    .dark .svg-text  { fill: rgb(var(--tw-custom-slate-200)); }
    .dark .svg-muted { fill: rgb(var(--tw-custom-slate-400)); }
  </style>
  <rect width="320" height="180" rx="10" class="svg-bg"/>

  <text x="160" y="16" font-size="11" class="svg-text" text-anchor="middle" font-weight="700">Eigenvalues 1/n accumulate only at 0</text>

  <line x1="280" y1="100" x2="30" y2="100" class="svg-axis" stroke-width="1.3"/>

  <circle cx="270" cy="100" r="5" fill="#2563eb"/>
  <text x="270" y="118" font-size="9" fill="#2563eb" text-anchor="middle">1</text>
  <circle cx="220" cy="100" r="5" fill="#2563eb"/>
  <text x="220" y="118" font-size="9" fill="#2563eb" text-anchor="middle">1/2</text>
  <circle cx="180" cy="100" r="4.5" fill="#2563eb"/>
  <text x="180" y="118" font-size="9" fill="#2563eb" text-anchor="middle">1/3</text>
  <circle cx="150" cy="100" r="4" fill="#2563eb"/>
  <circle cx="128" cy="100" r="3.5" fill="#2563eb"/>
  <circle cx="112" cy="100" r="3" fill="#2563eb"/>
  <circle cx="100" cy="100" r="2.5" fill="#2563eb"/>
  <circle cx="91" cy="100" r="2" fill="#2563eb"/>
  <circle cx="84" cy="100" r="1.6" fill="#2563eb"/>

  <circle cx="60" cy="100" r="6" fill="rgba(220,38,38,0.18)" stroke="#dc2626" stroke-width="1.6"/>
  <text x="60" y="122" font-size="9.5" fill="#dc2626" font-weight="700" text-anchor="middle">0</text>
  <text x="60" y="80" font-size="9" fill="#dc2626" text-anchor="middle">not an eigenvalue,</text>
  <text x="60" y="68" font-size="9" fill="#dc2626" text-anchor="middle">but in the spectrum</text>

  <text x="160" y="150" font-size="10" class="svg-muted" text-anchor="middle">discrete eigenvalues clustering toward the one limit point</text>
  <text x="160" y="166" font-size="9.5" class="svg-muted" text-anchor="middle">this clustering-at-zero pattern is typical of every compact operator</text>
</svg>
