<svg viewBox="0 0 320 220" xmlns="http://www.w3.org/2000/svg" style="font-family: ui-sans-serif, system-ui, sans-serif; border-radius: 12px;">
  <style>
    .svg-bg    { fill: rgb(var(--tw-custom-slate-50)); }
    .svg-muted { fill: rgb(var(--tw-custom-slate-400)); }
    .dark .svg-bg    { fill: rgb(var(--tw-custom-slate-900)); }
    .dark .svg-muted { fill: rgb(var(--tw-custom-slate-500)); }
  </style>
  <rect width="320" height="220" rx="12" class="svg-bg"/>

  <text x="160" y="16" font-size="11" class="svg-muted" text-anchor="middle">Same elongated bowl, two very different paths to the bottom</text>

  <!-- elongated contour ellipses, shared center -->
  <ellipse cx="160" cy="115" rx="130" ry="50" fill="none" stroke="#94a3b8" stroke-width="1" opacity="0.6"/>
  <ellipse cx="160" cy="115" rx="95" ry="36" fill="none" stroke="#94a3b8" stroke-width="1" opacity="0.6"/>
  <ellipse cx="160" cy="115" rx="60" ry="23" fill="none" stroke="#94a3b8" stroke-width="1" opacity="0.6"/>
  <circle cx="160" cy="115" r="3.5" fill="#1e293b"/>
  <text x="160" y="135" font-size="9" class="svg-muted" text-anchor="middle">x*</text>

  <!-- steepest descent: zig-zag, many short steps -->
  <polyline points="40,60 110,150 70,90 100,135 80,105 95,125 85,112 92,120 87,113 90,117 88,114"
            fill="none" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="3,2"/>
  <circle cx="40" cy="60" r="3" fill="#dc2626"/>
  <text x="30" y="50" font-size="9.5" fill="#dc2626" font-weight="700">steepest descent</text>

  <!-- CG: two clean direct steps -->
  <polyline points="280,170 175,95 160,115" fill="none" stroke="#2563eb" stroke-width="2.2"/>
  <circle cx="280" cy="170" r="3" fill="#2563eb"/>
  <text x="300" y="186" font-size="9.5" fill="#2563eb" font-weight="700" text-anchor="end">CG: 2 conjugate steps</text>

  <text x="160" y="205" font-size="9.5" class="svg-muted" text-anchor="middle">A-conjugate directions never repeat work — CG never zig-zags</text>
</svg>
