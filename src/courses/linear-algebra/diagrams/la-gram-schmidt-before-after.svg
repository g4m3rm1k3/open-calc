<svg viewBox="0 0 460 220" xmlns="http://www.w3.org/2000/svg" style="font-family: ui-sans-serif, system-ui, sans-serif; border-radius: 10px;">
  <style>
    .svg-bg    { fill: #f8fafc; }
    .svg-panel { fill: #ffffff; }
    .svg-text  { fill: #1e293b; }
    .svg-muted { fill: #64748b; }
    .svg-div   { stroke: #e2e8f0; fill: none; }
    .dark .svg-bg    { fill: #0f172a; }
    .dark .svg-panel { fill: #1e293b; }
    .dark .svg-text  { fill: #e2e8f0; }
    .dark .svg-muted { fill: #94a3b8; }
    .dark .svg-div   { stroke: #334155; }
  </style>
  <rect width="460" height="220" rx="10" class="svg-bg"/>
  <defs>
    <marker id="gs-blue" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto"><path d="M1,1 L1,6 L6,3.5 z" fill="#2563eb"/></marker>
    <marker id="gs-amber" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto"><path d="M1,1 L1,6 L6,3.5 z" fill="#d97706"/></marker>
  </defs>

  <!-- Panel 1: before -->
  <rect x="12" y="20" width="216" height="186" rx="8" class="svg-panel svg-div" stroke-width="1"/>
  <text x="120" y="38" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="700">Before: v₁, v₂ — tilted</text>
  <line x1="115" y1="170" x2="163" y2="106" stroke="#2563eb" stroke-width="2.5" marker-end="url(#gs-blue)"/>
  <text x="168" y="102" font-size="12" fill="#2563eb" font-weight="700">v₁</text>
  <line x1="115" y1="170" x2="147" y2="170" stroke="#d97706" stroke-width="2.5" marker-end="url(#gs-amber)"/>
  <text x="152" y="174" font-size="12" fill="#d97706" font-weight="700">v₂</text>
  <circle cx="115" cy="170" r="3" fill="#1e293b"/>
  <text x="120" y="195" font-size="9.5" class="svg-muted">not perpendicular</text>

  <!-- Panel 2: after -->
  <rect x="232" y="20" width="216" height="186" rx="8" class="svg-panel svg-div" stroke-width="1"/>
  <text x="340" y="38" font-size="11.5" fill="#10b981" text-anchor="middle" font-weight="700">After: e₁, e₂ — orthonormal</text>
  <line x1="345" y1="170" x2="387" y2="114" stroke="#2563eb" stroke-width="2.5" marker-end="url(#gs-blue)"/>
  <text x="392" y="110" font-size="12" fill="#2563eb" font-weight="700">e₁</text>
  <line x1="345" y1="170" x2="289" y2="128" stroke="#d97706" stroke-width="2.5" marker-end="url(#gs-amber)"/>
  <text x="262" y="122" font-size="12" fill="#d97706" font-weight="700">e₂</text>
  <circle cx="345" cy="170" r="3" fill="#1e293b"/>
  <rect x="333" y="148" width="9" height="9" fill="none" stroke="#10b981" stroke-width="1.3" transform="rotate(-37 337.5 152.5)"/>
  <text x="340" y="195" font-size="9.5" fill="#10b981">e₁ ⊥ e₂, both unit length</text>
</svg>
