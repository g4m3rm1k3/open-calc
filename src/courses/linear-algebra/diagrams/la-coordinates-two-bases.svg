<svg viewBox="0 0 320 240" xmlns="http://www.w3.org/2000/svg" style="font-family: ui-sans-serif, system-ui, sans-serif; border-radius: 12px;">
  <style>
    .svg-bg    { fill: rgb(var(--tw-custom-slate-50)); }
    .svg-axis  { stroke: rgb(var(--tw-custom-slate-400)); }
    .svg-muted { fill: rgb(var(--tw-custom-slate-400)); }
    .dark .svg-bg    { fill: rgb(var(--tw-custom-slate-900)); }
    .dark .svg-axis  { stroke: rgb(var(--tw-custom-slate-600)); }
    .dark .svg-muted { fill: rgb(var(--tw-custom-slate-500)); }
  </style>
  <rect width="320" height="240" rx="12" class="svg-bg"/>
  <defs>
    <marker id="cb-blue" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M1,1 L1,7 L7,4 z" fill="#2563eb"/></marker>
  </defs>

  <text x="160" y="16" font-size="11" class="svg-muted" text-anchor="middle">One vector v, two coordinate grids</text>

  <!-- standard axes -->
  <line x1="20" y1="200" x2="290" y2="200" class="svg-axis" stroke-width="1.3"/>
  <line x1="70" y1="220" x2="70" y2="40" class="svg-axis" stroke-width="1.3"/>

  <!-- basis B directions, dashed, through origin -->
  <line x1="20" y1="250" x2="220" y2="50" stroke="#d97706" stroke-width="1.3" stroke-dasharray="4,3"/>
  <line x1="20" y1="150" x2="170" y2="300" stroke="#7c3aed" stroke-width="1.3" stroke-dasharray="4,3" opacity="0.7"/>

  <!-- v = (5,3) -->
  <line x1="70" y1="200" x2="170" y2="140" stroke="#2563eb" stroke-width="3" marker-end="url(#cb-blue)"/>
  <text x="176" y="136" font-size="13" fill="#2563eb" font-weight="700">v</text>

  <circle cx="70" cy="200" r="3" fill="#1e293b"/>

  <text x="180" y="190" font-size="11.5" fill="#2563eb" font-weight="700">standard: [v]_E = (5, 3)</text>
  <text x="190" y="80" font-size="11.5" fill="#d97706" font-weight="700">basis B: [v]_B = (4, 1)</text>

  <text x="160" y="228" font-size="10" class="svg-muted" text-anchor="middle">Same arrow, same point — only the ruler changes</text>
</svg>
