<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg" style="font-family: ui-sans-serif, system-ui, sans-serif; border-radius: 10px;">
  <style>
    .svg-bg    { fill: #f8fafc; }
    .svg-text  { fill: #1e293b; }
    .svg-muted { fill: #64748b; }
    .svg-cell  { stroke: #cbd5e1; fill: #ffffff; }
    .dark .svg-bg    { fill: #0f172a; }
    .dark .svg-text  { fill: #e2e8f0; }
    .dark .svg-muted { fill: #94a3b8; }
    .dark .svg-cell  { stroke: #475569; fill: #1e293b; }
  </style>
  <rect width="320" height="200" rx="10" class="svg-bg"/>

  <text x="160" y="16" font-size="11" class="svg-text" text-anchor="middle" font-weight="700">A ⊗ B: each entry aᵢⱼ becomes a whole copy of B, scaled</text>

  <!-- 4x4 grid as 2x2 super-blocks, each super-block is the 2x2 matrix B scaled -->
  <g transform="translate(90,36)">
    <!-- block (1,1) = 1*B, highlighted -->
    <rect x="0" y="0" width="32" height="32" fill="rgba(217,119,6,0.16)" stroke="#d97706" stroke-width="1.6"/>
    <text x="8" y="14" font-size="9" class="svg-muted" text-anchor="middle">0</text>
    <text x="24" y="14" font-size="9" class="svg-muted" text-anchor="middle">1</text>
    <text x="8" y="26" font-size="9" class="svg-muted" text-anchor="middle">1</text>
    <text x="24" y="26" font-size="9" class="svg-muted" text-anchor="middle">0</text>
    <text x="16" y="-4" font-size="9" fill="#d97706" font-weight="700" text-anchor="middle">a₁₁B = 1·B</text>

    <!-- block (1,2) = 2*B -->
    <rect x="32" y="0" width="32" height="32" fill="rgba(37,99,235,0.10)" stroke="#2563eb" stroke-width="1.2"/>
    <text x="48" y="20" font-size="10" fill="#2563eb" text-anchor="middle">2B</text>

    <!-- block (2,1) = 3*B -->
    <rect x="0" y="32" width="32" height="32" fill="rgba(37,99,235,0.10)" stroke="#2563eb" stroke-width="1.2"/>
    <text x="16" y="52" font-size="10" fill="#2563eb" text-anchor="middle">3B</text>

    <!-- block (2,2) = 4*B -->
    <rect x="32" y="32" width="32" height="32" fill="rgba(37,99,235,0.10)" stroke="#2563eb" stroke-width="1.2"/>
    <text x="48" y="52" font-size="10" fill="#2563eb" text-anchor="middle">4B</text>
  </g>

  <text x="160" y="166" font-size="10" class="svg-muted" text-anchor="middle">A is 2×2, B is 2×2 → A⊗B is 4×4, built from 4 scaled copies of B</text>
  <text x="160" y="184" font-size="9.5" class="svg-muted" text-anchor="middle">rank(A⊗B) = rank(A)·rank(B) — not rank-1 unless both factors are</text>
</svg>
