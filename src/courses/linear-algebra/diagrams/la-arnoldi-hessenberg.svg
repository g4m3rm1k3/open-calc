<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg" style="font-family: ui-sans-serif, system-ui, sans-serif; border-radius: 10px;">
  <style>
    .svg-bg    { fill: #f8fafc; }
    .svg-text  { fill: #1e293b; }
    .svg-muted { fill: #64748b; }
    .svg-cell  { stroke: #cbd5e1; fill: #ffffff; }
    .dark .svg-bg    { fill: #0f172a; }
    .dark .svg-text  { fill: #e2e8f0; }
    .dark .svg-muted { fill: #94a3b8; }
    .dark .svg-cell  { stroke: #475569; fill: #1e293b; }
  </style>
  <rect width="320" height="200" rx="10" class="svg-bg"/>

  <text x="160" y="16" font-size="10.5" class="svg-text" text-anchor="middle" font-weight="700">Arnoldi builds an upper Hessenberg H̃ₖ</text>
  <text x="160" y="29" font-size="9.5" class="svg-muted" text-anchor="middle">one nonzero band below the diagonal</text>

  <!-- 5x4 grid (k+1 x k), upper triangle + one subdiagonal nonzero (amber), rest zero (green) -->
  <g transform="translate(90,36)">
    <rect x="0" y="0" width="32" height="32" fill="rgba(217,119,6,0.16)" stroke="#d97706" stroke-width="1.4"/>
    <rect x="32" y="0" width="32" height="32" fill="rgba(217,119,6,0.16)" stroke="#d97706" stroke-width="1.4"/>
    <rect x="64" y="0" width="32" height="32" fill="rgba(217,119,6,0.16)" stroke="#d97706" stroke-width="1.4"/>
    <rect x="96" y="0" width="32" height="32" fill="rgba(217,119,6,0.16)" stroke="#d97706" stroke-width="1.4"/>

    <rect x="0" y="32" width="32" height="32" fill="rgba(217,119,6,0.16)" stroke="#d97706" stroke-width="1.4"/>
    <rect x="32" y="32" width="32" height="32" fill="rgba(217,119,6,0.16)" stroke="#d97706" stroke-width="1.4"/>
    <rect x="64" y="32" width="32" height="32" fill="rgba(217,119,6,0.16)" stroke="#d97706" stroke-width="1.4"/>
    <rect x="96" y="32" width="32" height="32" fill="rgba(217,119,6,0.16)" stroke="#d97706" stroke-width="1.4"/>

    <rect x="0" y="64" width="32" height="32" fill="rgba(16,185,129,0.18)" stroke="#10b981" stroke-width="1.3"/>
    <rect x="32" y="64" width="32" height="32" fill="rgba(217,119,6,0.16)" stroke="#d97706" stroke-width="1.4"/>
    <rect x="64" y="64" width="32" height="32" fill="rgba(217,119,6,0.16)" stroke="#d97706" stroke-width="1.4"/>
    <rect x="96" y="64" width="32" height="32" fill="rgba(217,119,6,0.16)" stroke="#d97706" stroke-width="1.4"/>

    <rect x="0" y="96" width="32" height="32" fill="rgba(16,185,129,0.18)" stroke="#10b981" stroke-width="1.3"/>
    <rect x="32" y="96" width="32" height="32" fill="rgba(16,185,129,0.18)" stroke="#10b981" stroke-width="1.3"/>
    <rect x="64" y="96" width="32" height="32" fill="rgba(217,119,6,0.16)" stroke="#d97706" stroke-width="1.4"/>
    <rect x="96" y="96" width="32" height="32" fill="rgba(217,119,6,0.16)" stroke="#d97706" stroke-width="1.4"/>

    <rect x="0" y="128" width="32" height="32" fill="rgba(16,185,129,0.18)" stroke="#10b981" stroke-width="1.3"/>
    <rect x="32" y="128" width="32" height="32" fill="rgba(16,185,129,0.18)" stroke="#10b981" stroke-width="1.3"/>
    <rect x="64" y="128" width="32" height="32" fill="rgba(16,185,129,0.18)" stroke="#10b981" stroke-width="1.3"/>
    <rect x="96" y="128" width="32" height="32" fill="rgba(217,119,6,0.16)" stroke="#d97706" stroke-width="1.4"/>
  </g>

  <text x="160" y="184" font-size="9.5" class="svg-muted" text-anchor="middle">amber = Gram-Schmidt inner products hⱼₖ, green = zero</text>
</svg>
