<svg viewBox="0 0 320 220" xmlns="http://www.w3.org/2000/svg" style="font-family: ui-sans-serif, system-ui, sans-serif; border-radius: 12px;">
  <style>
    .svg-bg    { fill: #f8fafc; }
    .svg-axis  { stroke: #94a3b8; }
    .svg-muted { fill: #94a3b8; }
    .dark .svg-bg    { fill: #0f172a; }
    .dark .svg-axis  { stroke: #475569; }
    .dark .svg-muted { fill: #64748b; }
  </style>
  <rect width="320" height="220" rx="12" class="svg-bg"/>

  <text x="160" y="16" font-size="11" class="svg-muted" text-anchor="middle">Most of the energy hides in the first few singular values</text>

  <!-- axis -->
  <line x1="20" y1="180" x2="290" y2="180" class="svg-axis" stroke-width="1.5"/>

  <!-- kept bars (top k = 3), green -->
  <rect x="30" y="40" width="24" height="140" fill="#10b981"/>
  <rect x="60" y="96" width="24" height="84" fill="#10b981"/>
  <rect x="90" y="145" width="24" height="35" fill="#10b981"/>

  <!-- discarded bars, gray -->
  <rect x="120" y="169" width="24" height="11" fill="#94a3b8"/>
  <rect x="150" y="173" width="24" height="7" fill="#94a3b8"/>
  <rect x="180" y="176" width="24" height="4.2" fill="#94a3b8"/>
  <rect x="210" y="177" width="24" height="2.8" fill="#94a3b8"/>
  <rect x="240" y="178" width="24" height="1.4" fill="#94a3b8"/>

  <!-- cutoff line -->
  <line x1="117" y1="30" x2="117" y2="180" stroke="#1e293b" stroke-width="1.3" stroke-dasharray="4,3"/>
  <text x="60" y="200" font-size="10" fill="#10b981" font-weight="700">keep: top k</text>
  <text x="190" y="200" font-size="10" class="svg-muted">discard: ≈ 0 energy</text>

  <text x="160" y="32" font-size="10" fill="#1e293b" text-anchor="middle">σ₁ σ₂ … σₖ</text>
</svg>
