<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" style="font-family: ui-sans-serif, system-ui, sans-serif; border-radius: 12px;">
  <style>
    .svg-bg    { fill: rgb(var(--tw-custom-slate-50)); }
    .svg-grid  { stroke: rgb(var(--tw-custom-slate-200)); }
    .svg-axis  { stroke: rgb(var(--tw-custom-slate-400)); }
    .svg-axis-fill { fill: rgb(var(--tw-custom-slate-400)); }
    .svg-muted { fill: rgb(var(--tw-custom-slate-400)); }
    .dark .svg-bg    { fill: rgb(var(--tw-custom-slate-900)); }
    .dark .svg-grid  { stroke: rgb(var(--tw-custom-slate-800)); }
    .dark .svg-axis  { stroke: rgb(var(--tw-custom-slate-600)); }
    .dark .svg-axis-fill { fill: rgb(var(--tw-custom-slate-600)); }
    .dark .svg-muted { fill: rgb(var(--tw-custom-slate-500)); }
  </style>
  <rect width="400" height="300" rx="12" class="svg-bg"/>
  <defs>
    <marker id="uv-blue" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M1,1 L1,7 L7,4 z" fill="#2563eb"/></marker>
    <marker id="uv-amber" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M1,1 L1,7 L7,4 z" fill="#d97706"/></marker>
  </defs>

  <!-- Grid -->
  <line x1="110" y1="10" x2="110" y2="270" class="svg-grid" stroke-width="1"/>
  <line x1="160" y1="10" x2="160" y2="270" class="svg-grid" stroke-width="1"/>
  <line x1="210" y1="10" x2="210" y2="270" class="svg-grid" stroke-width="1"/>
  <line x1="260" y1="10" x2="260" y2="270" class="svg-grid" stroke-width="1"/>
  <line x1="60" y1="220" x2="340" y2="220" class="svg-grid" stroke-width="1"/>
  <line x1="60" y1="170" x2="340" y2="170" class="svg-grid" stroke-width="1"/>
  <line x1="60" y1="120" x2="340" y2="120" class="svg-grid" stroke-width="1"/>
  <line x1="60" y1="70" x2="340" y2="70" class="svg-grid" stroke-width="1"/>

  <!-- Axes -->
  <line x1="60" y1="270" x2="345" y2="270" class="svg-axis" stroke-width="2"/>
  <line x1="60" y1="280" x2="60" y2="15" class="svg-axis" stroke-width="2"/>
  <polygon points="345,266 345,274 353,270" class="svg-axis-fill"/>
  <polygon points="56,15 64,15 60,7" class="svg-axis-fill"/>

  <!-- v = [3, 4]: origin (60,270) to (210, 70), length 5 -->
  <line x1="60" y1="270" x2="206" y2="74" stroke="#2563eb" stroke-width="3" marker-end="url(#uv-blue)"/>
  <text x="214" y="68" font-size="14" fill="#2563eb" font-weight="700">v = [3, 4],  ‖v‖ = 5</text>

  <!-- unit vector û = [0.6, 0.8]: origin to (90, 230) -->
  <line x1="60" y1="270" x2="86" y2="234" stroke="#d97706" stroke-width="3" marker-end="url(#uv-amber)"/>
  <text x="96" y="252" font-size="13" fill="#d97706" font-weight="700">û = [0.6, 0.8],  ‖û‖ = 1</text>

  <text x="200" y="294" font-size="12" class="svg-muted" text-anchor="middle">Same direction, different length — û = v / ‖v‖</text>
</svg>
