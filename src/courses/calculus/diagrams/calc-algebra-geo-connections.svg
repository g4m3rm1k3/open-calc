<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" style="font-family: ui-monospace, monospace; border-radius: 12px;">
  <style>.bg{fill:rgb(var(--tw-custom-slate-50))}.dark .bg{fill:rgb(var(--tw-custom-slate-900))}</style>
  <rect width="480" height="200" rx="12" class="bg"/>
  <text x="240" y="16" font-size="11" fill="#4338ca" text-anchor="middle" font-weight="700">Algebra ↔ Geometry Connections</text>
  <!-- Algebra formula → geometric meaning -->
  <!-- Panel 1: Slope -->
  <rect x="8" y="24" width="146" height="80" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="81" y="40" font-size="8.5" fill="#4338ca" text-anchor="middle" font-weight="700">Slope</text>
  <text x="81" y="58" font-size="9" fill="#374151" text-anchor="middle">m = (y₂−y₁)/(x₂−x₁)</text>
  <text x="81" y="76" font-size="8" fill="#374151" text-anchor="middle">= rise / run</text>
  <text x="81" y="92" font-size="8" fill="#6366f1" text-anchor="middle">→ derivative in calculus</text>
  <!-- Panel 2: Distance -->
  <rect x="162" y="24" width="156" height="80" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="240" y="40" font-size="8.5" fill="#166534" text-anchor="middle" font-weight="700">Distance Formula</text>
  <text x="240" y="58" font-size="8.5" fill="#374151" text-anchor="middle">d = √((x₂−x₁)²+(y₂−y₁)²)</text>
  <text x="240" y="74" font-size="8" fill="#374151" text-anchor="middle">= Pythagorean theorem in 2D</text>
  <text x="240" y="90" font-size="8" fill="#22c55e" text-anchor="middle">→ arc length integral in calc</text>
  <!-- Panel 3: Midpoint -->
  <rect x="326" y="24" width="146" height="80" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="399" y="40" font-size="8.5" fill="#92400e" text-anchor="middle" font-weight="700">Midpoint</text>
  <text x="399" y="58" font-size="8.5" fill="#374151" text-anchor="middle">M = ((x₁+x₂)/2, (y₁+y₂)/2)</text>
  <text x="399" y="74" font-size="8" fill="#374151" text-anchor="middle">average of coordinates</text>
  <text x="399" y="90" font-size="8" fill="#f59e0b" text-anchor="middle">→ avg value of a function</text>
  <!-- Panel 4: Area under a line -->
  <rect x="8" y="112" width="220" height="82" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="118" y="128" font-size="8.5" fill="#5b21b6" text-anchor="middle" font-weight="700">Area Under a Line</text>
  <text x="118" y="145" font-size="8" fill="#374151" text-anchor="middle">Area of triangle: ½ · base · height</text>
  <text x="118" y="161" font-size="8" fill="#374151" text-anchor="middle">= ½ · b · m·b = ½mb²</text>
  <text x="118" y="177" font-size="8" fill="#7c3aed" text-anchor="middle">∫₀ᵇ mx dx = ½mb² — same formula!</text>
  <!-- Panel 5: Circle equation -->
  <rect x="236" y="112" width="236" height="82" rx="6" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
  <text x="354" y="128" font-size="8.5" fill="#be185d" text-anchor="middle" font-weight="700">Circle &amp; Derivatives</text>
  <text x="354" y="144" font-size="8" fill="#374151" text-anchor="middle">x² + y² = r² → implicit diff:</text>
  <text x="354" y="160" font-size="8" fill="#374151" text-anchor="middle">2x + 2y·(dy/dx) = 0</text>
  <text x="354" y="176" font-size="8.5" fill="#ec4899" text-anchor="middle">dy/dx = −x/y (slope of tangent!)</text>
</svg>
