<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" style="font-family: ui-monospace, monospace; border-radius: 12px;">
  <style>.bg{fill:rgb(var(--tw-custom-slate-50))}.dark .bg{fill:rgb(var(--tw-custom-slate-900))}</style>
  <rect width="480" height="200" rx="12" class="bg"/>
  <text x="240" y="16" font-size="11" fill="#4338ca" text-anchor="middle" font-weight="700">Function Families — Graphs &amp; Properties</text>
  <!-- 6 mini panels -->
  <!-- Linear -->
  <rect x="8" y="24" width="72" height="82" rx="4" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="44" y="38" font-size="7.5" fill="#4338ca" text-anchor="middle" font-weight="700">Linear</text>
  <line x1="14" y1="95" x2="74" y2="35" stroke="#6366f1" stroke-width="2"/>
  <text x="44" y="110" font-size="7" fill="#374151" text-anchor="middle">y = mx + b</text>
  <!-- Quadratic -->
  <rect x="86" y="24" width="72" height="82" rx="4" fill="#dcfce7" stroke="#22c55e" stroke-width="1.2"/>
  <text x="122" y="38" font-size="7.5" fill="#166534" text-anchor="middle" font-weight="700">Quadratic</text>
  <path d="M 90,96 Q 122,30 154,96" fill="none" stroke="#22c55e" stroke-width="2"/>
  <text x="122" y="110" font-size="7" fill="#374151" text-anchor="middle">y = ax² + bx + c</text>
  <!-- Exponential -->
  <rect x="164" y="24" width="72" height="82" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="200" y="38" font-size="7.5" fill="#92400e" text-anchor="middle" font-weight="700">Exponential</text>
  <path d="M 168,95 C 180,90 192,78 200,60 C 208,42 218,34 232,30" fill="none" stroke="#f59e0b" stroke-width="2"/>
  <text x="200" y="110" font-size="7" fill="#374151" text-anchor="middle">y = aˣ (a&gt;1)</text>
  <!-- Log -->
  <rect x="242" y="24" width="72" height="82" rx="4" fill="#fce7f3" stroke="#ec4899" stroke-width="1.2"/>
  <text x="278" y="38" font-size="7.5" fill="#be185d" text-anchor="middle" font-weight="700">Logarithm</text>
  <path d="M 248,95 C 256,60 264,45 278,38 C 292,31 302,29 310,28" fill="none" stroke="#ec4899" stroke-width="2"/>
  <text x="278" y="110" font-size="7" fill="#374151" text-anchor="middle">y = ln x</text>
  <!-- Sine -->
  <rect x="320" y="24" width="72" height="82" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="356" y="38" font-size="7.5" fill="#5b21b6" text-anchor="middle" font-weight="700">Trig</text>
  <path d="M 324,65 C 330,45 338,30 344,45 C 350,60 358,80 364,65 C 370,50 378,30 384,50 C 388,65 388,80 388,80" fill="none" stroke="#7c3aed" stroke-width="2"/>
  <text x="356" y="110" font-size="7" fill="#374151" text-anchor="middle">y = sin x, cos x</text>
  <!-- Rational -->
  <rect x="398" y="24" width="74" height="82" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="435" y="38" font-size="7.5" fill="#1d4ed8" text-anchor="middle" font-weight="700">Rational</text>
  <path d="M 402,30 C 408,35 414,45 420,95" fill="none" stroke="#2563eb" stroke-width="2"/>
  <path d="M 450,30 C 444,35 438,45 432,95" fill="none" stroke="#2563eb" stroke-width="2"/>
  <text x="435" y="110" font-size="7" fill="#374151" text-anchor="middle">y = 1/x</text>
  <!-- Properties table -->
  <rect x="8" y="118" width="464" height="76" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="240" y="134" font-size="8.5" fill="#4338ca" text-anchor="middle" font-weight="700">Key Calculus Properties by Family</text>
  <text x="30" y="150" font-size="8" fill="#374151">Linear: d/dx[mx+b] = m (constant slope)</text>
  <text x="270" y="150" font-size="8" fill="#374151">Quadratic: vertex at x = −b/2a (critical point)</text>
  <text x="30" y="165" font-size="8" fill="#374151">Exponential: d/dx[eˣ] = eˣ, grows without bound</text>
  <text x="270" y="165" font-size="8" fill="#374151">Log: d/dx[ln x] = 1/x, defined only for x &gt; 0</text>
  <text x="30" y="180" font-size="8" fill="#374151">Trig: periodic, derivative cycles sin↔cos</text>
  <text x="270" y="180" font-size="8" fill="#374151">Rational: vertical asymptote where denom = 0</text>
</svg>
