<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" style="font-family: ui-monospace, monospace; border-radius: 12px;">
  <style>.bg{fill:rgb(var(--tw-custom-slate-50))}.dark .bg{fill:rgb(var(--tw-custom-slate-900))}</style>
  <rect width="480" height="200" rx="12" class="bg"/>
  <text x="240" y="16" font-size="11" fill="#4338ca" text-anchor="middle" font-weight="700">Definite Integral — Anatomy</text>
  <rect x="8" y="22" width="240" height="172" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="28" y1="165" x2="240" y2="165" stroke="#64748b" stroke-width="1"/>
  <line x1="28" y1="28" x2="28" y2="169" stroke="#64748b" stroke-width="1"/>
  <!-- Shaded area -->
  <path d="M 55,165 L 55,100 Q 80,72 110,55 Q 140,40 170,40 Q 195,40 210,50 L 210,165 Z" fill="#6366f1" opacity="0.2"/>
  <!-- Curve -->
  <path d="M 35,155 Q 50,135 70,108 Q 95,78 125,58 Q 155,40 180,36 Q 200,34 220,38 Q 232,42 238,48" fill="none" stroke="#6366f1" stroke-width="2.5"/>
  <!-- a and b -->
  <line x1="55" y1="160" x2="55" y2="169" stroke="#4338ca" stroke-width="2"/>
  <line x1="210" y1="160" x2="210" y2="169" stroke="#4338ca" stroke-width="2"/>
  <text x="55" y="182" font-size="9" fill="#4338ca" text-anchor="middle">a</text>
  <text x="210" y="182" font-size="9" fill="#4338ca" text-anchor="middle">b</text>
  <!-- Integral symbol labels -->
  <text x="130" y="140" font-size="10" fill="#4338ca" text-anchor="middle" font-weight="700">∫ₐᵇ f(x) dx</text>
  <!-- Right panel: parts breakdown -->
  <rect x="256" y="26" width="216" height="168" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="364" y="46" font-size="8.5" fill="#4338ca" text-anchor="middle" font-weight="700">Reading ∫ₐᵇ f(x) dx</text>
  <rect x="264" y="54" width="200" height="22" rx="4" fill="#dbeafe"/>
  <text x="364" y="69" font-size="8" fill="#1d4ed8" text-anchor="middle">∫ = "integral of"</text>
  <rect x="264" y="80" width="200" height="22" rx="4" fill="#dcfce7"/>
  <text x="364" y="95" font-size="8" fill="#166534" text-anchor="middle">f(x) = integrand</text>
  <rect x="264" y="106" width="200" height="22" rx="4" fill="#fef3c7"/>
  <text x="364" y="121" font-size="8" fill="#92400e" text-anchor="middle">dx = "with respect to x"</text>
  <rect x="264" y="132" width="200" height="22" rx="4" fill="#fee2e2"/>
  <text x="364" y="147" font-size="8" fill="#991b1b" text-anchor="middle">a = lower limit, b = upper limit</text>
  <rect x="264" y="158" width="200" height="30" rx="4" fill="#ede9fe"/>
  <text x="364" y="172" font-size="8" fill="#5b21b6" text-anchor="middle">Result: a NUMBER (not a function)</text>
  <text x="364" y="184" font-size="7.5" fill="#6d28d9" text-anchor="middle">= signed area between f and x-axis</text>
</svg>
