<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" style="font-family: ui-monospace, monospace; border-radius: 12px;">
  <style>.bg{fill:rgb(var(--tw-custom-slate-50))}.dark .bg{fill:rgb(var(--tw-custom-slate-900))}</style>
  <rect width="480" height="200" rx="12" class="bg"/>
  <text x="240" y="16" font-size="11" fill="#4338ca" text-anchor="middle" font-weight="700">Rolle's Theorem — All 3 Conditions Required</text>
  <!-- Condition 1: Continuous -->
  <rect x="8" y="26" width="148" height="168" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="82" y="44" font-size="8.5" fill="#166534" text-anchor="middle" font-weight="700">✓ Condition 1</text>
  <text x="82" y="58" font-size="8" fill="#166534" text-anchor="middle">Continuous on [a,b]</text>
  <line x1="20" y1="80" x2="20" y2="160" stroke="#64748b" stroke-width="1"/>
  <line x1="20" y1="160" x2="144" y2="160" stroke="#64748b" stroke-width="1"/>
  <path d="M 35,140 Q 60,100 82,80 Q 104,60 130,90 Q 138,100 143,120" fill="none" stroke="#16a34a" stroke-width="2"/>
  <circle cx="35" cy="140" r="4" fill="#16a34a"/>
  <circle cx="143" cy="120" r="4" fill="#16a34a"/>
  <text x="82" y="176" font-size="8" fill="#166534" text-anchor="middle">no breaks/holes</text>

  <!-- Condition 2: Differentiable -->
  <rect x="166" y="26" width="148" height="168" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="240" y="44" font-size="8.5" fill="#166534" text-anchor="middle" font-weight="700">✓ Condition 2</text>
  <text x="240" y="58" font-size="8" fill="#166534" text-anchor="middle">Differentiable on (a,b)</text>
  <line x1="178" y1="80" x2="178" y2="160" stroke="#64748b" stroke-width="1"/>
  <line x1="178" y1="160" x2="302" y2="160" stroke="#64748b" stroke-width="1"/>
  <path d="M 193,140 Q 220,110 240,80 Q 258,52 278,80 Q 290,100 302,120" fill="none" stroke="#16a34a" stroke-width="2"/>
  <circle cx="193" cy="140" r="4" fill="#16a34a"/>
  <circle cx="302" cy="120" r="4" fill="#16a34a"/>
  <text x="240" y="176" font-size="8" fill="#166534" text-anchor="middle">no corners/cusps</text>

  <!-- Condition 3: Equal endpoints -->
  <rect x="324" y="26" width="148" height="168" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="398" y="44" font-size="8.5" fill="#166534" text-anchor="middle" font-weight="700">✓ Condition 3</text>
  <text x="398" y="58" font-size="8" fill="#166534" text-anchor="middle">f(a) = f(b)</text>
  <line x1="336" y1="80" x2="336" y2="160" stroke="#64748b" stroke-width="1"/>
  <line x1="336" y1="160" x2="460" y2="160" stroke="#64748b" stroke-width="1"/>
  <path d="M 351,120 Q 370,90 398,70 Q 426,52 450,120" fill="none" stroke="#16a34a" stroke-width="2"/>
  <circle cx="351" cy="120" r="4" fill="#16a34a"/>
  <circle cx="450" cy="120" r="4" fill="#16a34a"/>
  <line x1="336" y1="120" x2="460" y2="120" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="398" y="176" font-size="8" fill="#166534" text-anchor="middle">same height at a, b</text>
</svg>
