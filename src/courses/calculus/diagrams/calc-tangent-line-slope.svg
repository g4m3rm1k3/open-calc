<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" style="font-family: ui-monospace, monospace; border-radius: 12px;">
  <style>
    .bg { fill: rgb(var(--tw-custom-slate-50)); }
    .dark .bg { fill: rgb(var(--tw-custom-slate-900)); }
  </style>
  <rect width="480" height="200" rx="12" class="bg"/>
  <text x="240" y="16" font-size="11" fill="#4338ca" text-anchor="middle" font-weight="700">The Tangent Line — Slope at a Single Point</text>

  <!-- LEFT: secant → tangent limit -->
  <rect x="8" y="22" width="220" height="170" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="118" y="40" font-size="9" fill="#4338ca" text-anchor="middle" font-weight="700">Secant → Tangent as h → 0</text>

  <!-- Axes -->
  <line x1="24" y1="168" x2="218" y2="168" stroke="#64748b" stroke-width="1"/>
  <line x1="54" y1="32" x2="54" y2="172" stroke="#64748b" stroke-width="1"/>

  <!-- Curve y=x² (rough) -->
  <path d="M 24,168 Q 54,140 90,100 Q 120,68 158,44" fill="none" stroke="#6366f1" stroke-width="2"/>

  <!-- Tangent point at x=1 → approx (90, 100) in SVG coords -->
  <circle cx="90" cy="100" r="4" fill="#6366f1"/>
  <text x="96" y="98" font-size="7.5" fill="#6366f1">(a, f(a))</text>

  <!-- Secant 1: through (90,100) and (140, 68) -->
  <line x1="40" y1="138" x2="200" y2="46" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.7"/>

  <!-- Secant 2: tighter -->
  <line x1="50" y1="124" x2="180" y2="62" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.5"/>

  <!-- Tangent: final -->
  <line x1="30" y1="128" x2="180" y2="56" stroke="#ef4444" stroke-width="2"/>
  <text x="166" y="52" font-size="8" fill="#ef4444">tangent</text>
  <text x="36" y="142" font-size="8" fill="#f59e0b" opacity="0.8">secants</text>

  <!-- h arrow -->
  <line x1="90" y1="176" x2="138" y2="176" stroke="#059669" stroke-width="1.5"/>
  <text x="114" y="188" font-size="7.5" fill="#059669" text-anchor="middle">h → 0</text>

  <!-- RIGHT: slope formula -->
  <rect x="236" y="22" width="236" height="170" rx="8" fill="#1e1b4b"/>
  <text x="354" y="40" font-size="9" fill="#a5b4fc" text-anchor="middle" font-weight="700">Tangent Slope = Derivative</text>
  <line x1="244" y1="46" x2="464" y2="46" stroke="#4338ca" stroke-width="1"/>

  <text x="248" y="64" font-size="8" fill="#94a3b8">Secant slope (average):</text>
  <rect x="246" y="70" width="216" height="22" rx="4" fill="#312e81"/>
  <text x="354" y="84" font-size="9.5" fill="#c7d2fe" text-anchor="middle" font-weight="700">m = [f(a+h) − f(a)] / h</text>

  <text x="248" y="106" font-size="8" fill="#94a3b8">Tangent slope (instantaneous):</text>
  <rect x="246" y="112" width="216" height="22" rx="4" fill="#4338ca"/>
  <text x="354" y="126" font-size="10" fill="white" text-anchor="middle" font-weight="700">f ′(a) = lim [f(a+h)−f(a)] / h</text>
  <text x="354" y="140" font-size="8.5" fill="#a5b4fc" text-anchor="middle">h → 0</text>

  <text x="248" y="158" font-size="8" fill="#94a3b8">The tangent line at (a, f(a)):</text>
  <rect x="246" y="164" width="216" height="20" rx="4" fill="#312e81"/>
  <text x="354" y="177" font-size="9" fill="#4ade80" text-anchor="middle" font-weight="700">y − f(a) = f ′(a)(x − a)</text>
</svg>
