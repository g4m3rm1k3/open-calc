<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" style="font-family: ui-monospace, monospace; border-radius: 12px;">
  <style>.bg{fill:rgb(var(--tw-custom-slate-50))}.dark .bg{fill:rgb(var(--tw-custom-slate-900))}</style>
  <rect width="480" height="200" rx="12" class="bg"/>
  <text x="240" y="16" font-size="11" fill="#4338ca" text-anchor="middle" font-weight="700">Initial Value Problem — Pinning Down C</text>
  <!-- 4 steps -->
  <rect x="8" y="26" width="108" height="168" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="62" y="46" font-size="8" fill="#1d4ed8" text-anchor="middle" font-weight="700">① Setup</text>
  <text x="62" y="62" font-size="7.5" fill="#1e40af" text-anchor="middle">Given:</text>
  <text x="62" y="76" font-size="7.5" fill="#1e40af" text-anchor="middle">f ′(x) = 2x</text>
  <text x="62" y="90" font-size="7.5" fill="#1e40af" text-anchor="middle">f(1) = 5</text>
  <text x="62" y="110" font-size="7.5" fill="#3b82f6" text-anchor="middle">Initial</text>
  <text x="62" y="124" font-size="7.5" fill="#3b82f6" text-anchor="middle">condition</text>
  <text x="62" y="138" font-size="7.5" fill="#3b82f6" text-anchor="middle">pins down</text>
  <text x="62" y="152" font-size="7.5" fill="#3b82f6" text-anchor="middle">the curve</text>

  <rect x="124" y="26" width="108" height="168" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="178" y="46" font-size="8" fill="#166534" text-anchor="middle" font-weight="700">② Integrate</text>
  <text x="178" y="62" font-size="7.5" fill="#15803d" text-anchor="middle">∫ 2x dx</text>
  <text x="178" y="78" font-size="7.5" fill="#15803d" text-anchor="middle">= x² + C</text>
  <text x="178" y="98" font-size="7.5" fill="#166534" text-anchor="middle">General</text>
  <text x="178" y="112" font-size="7.5" fill="#166534" text-anchor="middle">solution:</text>
  <text x="178" y="128" font-size="7.5" fill="#166534" text-anchor="middle">f(x) = x² + C</text>
  <text x="178" y="148" font-size="7.5" fill="#15803d" text-anchor="middle">(all members</text>
  <text x="178" y="162" font-size="7.5" fill="#15803d" text-anchor="middle">of family)</text>

  <rect x="240" y="26" width="108" height="168" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="294" y="46" font-size="8" fill="#92400e" text-anchor="middle" font-weight="700">③ Apply IC</text>
  <text x="294" y="62" font-size="7.5" fill="#78350f" text-anchor="middle">f(1) = 5:</text>
  <text x="294" y="78" font-size="7.5" fill="#78350f" text-anchor="middle">1² + C = 5</text>
  <text x="294" y="94" font-size="7.5" fill="#78350f" text-anchor="middle">1 + C = 5</text>
  <text x="294" y="110" font-size="7.5" fill="#b45309" text-anchor="middle" font-weight="700">C = 4</text>
  <text x="294" y="130" font-size="7.5" fill="#92400e" text-anchor="middle">Substitute</text>
  <text x="294" y="144" font-size="7.5" fill="#92400e" text-anchor="middle">known point</text>
  <text x="294" y="160" font-size="7.5" fill="#92400e" text-anchor="middle">to solve for C</text>

  <rect x="356" y="26" width="116" height="168" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="414" y="46" font-size="8" fill="#4c1d95" text-anchor="middle" font-weight="700">④ Solution</text>
  <rect x="364" y="56" width="100" height="26" rx="4" fill="#dbeafe"/>
  <text x="414" y="70" font-size="8.5" fill="#1d4ed8" text-anchor="middle" font-weight="700">f(x) = x² + 4</text>
  <text x="414" y="92" font-size="7.5" fill="#5b21b6" text-anchor="middle">Unique function</text>
  <text x="414" y="106" font-size="7.5" fill="#5b21b6" text-anchor="middle">that satisfies</text>
  <text x="414" y="120" font-size="7.5" fill="#5b21b6" text-anchor="middle">both the ODE</text>
  <text x="414" y="134" font-size="7.5" fill="#5b21b6" text-anchor="middle">and IC</text>
  <text x="414" y="154" font-size="7" fill="#7c3aed" text-anchor="middle">Verify: f(1)=5 ✓</text>
  <text x="414" y="168" font-size="7" fill="#7c3aed" text-anchor="middle">f′(x)=2x ✓</text>
</svg>
