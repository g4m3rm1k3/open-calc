<svg xmlns="http://www.w3.org/2000/svg" style="font-family: ui-monospace, monospace; border-radius: 12px;" viewBox="0 0 480 200">
  <style>.bg{fill:rgb(var(--tw-custom-slate-50))}.dark .bg{fill:rgb(var(--tw-custom-slate-900))}</style>
  <rect width="480" height="200" rx="12" class="bg"/>
  <text x="240" y="16" font-size="11" fill="#4338ca" text-anchor="middle" font-weight="700">Math Language: Expressions vs Equations vs Functions</text>
  <rect x="8" y="24" width="146" height="170" rx="8" fill="#dbeafe" stroke="#6366f1" stroke-width="1.5"/>
  <text x="81" y="42" font-size="8.5" fill="#1d4ed8" text-anchor="middle" font-weight="700">Expression</text>
  <text x="81" y="58" font-size="8" fill="#374151" text-anchor="middle">No equal sign</text>
  <text x="81" y="72" font-size="8" fill="#374151" text-anchor="middle">Has a value</text>
  <rect x="16" y="80" width="130" height="20" rx="3" fill="#c7d2fe"/>
  <text x="81" y="94" font-size="9" fill="#1d4ed8" text-anchor="middle" font-weight="700">3x²+2x−5</text>
  <text x="81" y="118" font-size="7.5" fill="#374151" text-anchor="middle">Plug in x=2:</text>
  <text x="81" y="130" font-size="8" fill="#374151" text-anchor="middle">3(4)+4−5 = 11</text>
  <rect x="162" y="24" width="156" height="170" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="240" y="42" font-size="8.5" fill="#166534" text-anchor="middle" font-weight="700">Equation</text>
  <text x="240" y="58" font-size="8" fill="#374151" text-anchor="middle">Has an equal sign</text>
  <text x="240" y="72" font-size="8" fill="#374151" text-anchor="middle">Find the unknown</text>
  <rect x="170" y="80" width="140" height="20" rx="3" fill="#bbf7d0"/>
  <text x="240" y="94" font-size="9" fill="#166534" text-anchor="middle" font-weight="700">3x²+2x−5 = 0</text>
  <text x="240" y="118" font-size="7.5" fill="#374151" text-anchor="middle">x = 1  or  x = −5/3</text>
  <text x="240" y="134" font-size="7.5" fill="#374151" text-anchor="middle">(specific solutions)</text>
  <rect x="326" y="24" width="146" height="170" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="399" y="42" font-size="8.5" fill="#92400e" text-anchor="middle" font-weight="700">Function</text>
  <text x="399" y="58" font-size="8" fill="#374151" text-anchor="middle">Input → Output rule</text>
  <text x="399" y="72" font-size="8" fill="#374151" text-anchor="middle">Each input → one output</text>
  <rect x="334" y="80" width="130" height="20" rx="3" fill="#fde68a"/>
  <text x="399" y="94" font-size="9" fill="#92400e" text-anchor="middle" font-weight="700">f(x) = 3x²+2x−5</text>
  <text x="399" y="118" font-size="7.5" fill="#374151" text-anchor="middle">f(0)=−5, f(1)=0</text>
  <text x="399" y="132" font-size="7.5" fill="#374151" text-anchor="middle">f(−1)=−4, f(2)=11</text>
  <text x="399" y="148" font-size="7.5" fill="#374151" text-anchor="middle">Calculus studies how</text>
  <text x="399" y="162" font-size="7.5" fill="#374151" text-anchor="middle">f(x) changes with x</text>
</svg>
