<svg viewBox="0 0 480 215" xmlns="http://www.w3.org/2000/svg" style="font-family: ui-monospace, monospace; border-radius: 12px;">
  <style>
    .bg  { fill: #f8fafc; }
    .mu  { fill: #64748b; }
    .dark .bg  { fill: #0f172a; }
    .dark .mu  { fill: #64748b; }
  </style>
  <rect width="480" height="215" rx="12" class="bg"/>

  <text x="240" y="18" font-size="11" fill="#4338ca" text-anchor="middle" font-weight="700">Product Rule — Differentiating f(x) · g(x)</text>

  <!-- LEFT: Rectangle area model (geometric intuition) -->
  <text x="120" y="34" font-size="9" fill="#4338ca" text-anchor="middle" font-weight="700">Area Model</text>
  <text x="120" y="46" font-size="8" class="mu" text-anchor="middle">change in area = two new strips</text>

  <!-- Original rectangle f × g -->
  <rect x="20" y="58" width="80" height="80" fill="#6366f1" fill-opacity="0.15" stroke="#6366f1" stroke-width="2"/>
  <text x="60" y="102" font-size="11" fill="#6366f1" text-anchor="middle" font-weight="700">f · g</text>
  <text x="60" y="50" font-size="9" fill="#6366f1" text-anchor="middle">g</text>
  <text x="12" y="102" font-size="9" fill="#6366f1" text-anchor="end">f</text>

  <!-- g grows by Δg: right strip -->
  <rect x="100" y="58" width="30" height="80" fill="#10b981" fill-opacity="0.3" stroke="#10b981" stroke-width="1.5"/>
  <text x="115" y="102" font-size="8.5" fill="#10b981" text-anchor="middle">f·Δg</text>
  <text x="115" y="46" font-size="9" fill="#10b981" text-anchor="middle">Δg</text>

  <!-- f grows by Δf: top strip -->
  <rect x="20" y="26" width="80" height="32" fill="#ef4444" fill-opacity="0.3" stroke="#ef4444" stroke-width="1.5"/>
  <text x="60" y="46" font-size="8.5" fill="#ef4444" text-anchor="middle">g·Δf</text>
  <text x="6" y="44" font-size="9" fill="#ef4444" text-anchor="end">Δf</text>

  <!-- Corner piece Δf·Δg (negligible) -->
  <rect x="100" y="26" width="30" height="32" fill="#94a3b8" fill-opacity="0.2" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="115" y="46" font-size="7" class="mu" text-anchor="middle">Δf·Δg</text>
  <text x="115" y="56" font-size="7" class="mu" text-anchor="middle">→ 0</text>

  <text x="75" y="162" font-size="8.5" fill="#4338ca" text-anchor="middle">d(fg) ≈ f·dg + g·df</text>

  <!-- DIVIDER -->
  <line x1="162" y1="28" x2="162" y2="205" stroke="#e2e8f0" stroke-width="1"/>

  <!-- CENTER: The rule -->
  <text x="320" y="34" font-size="9" fill="#4338ca" text-anchor="middle" font-weight="700">The Product Rule</text>

  <rect x="170" y="44" width="295" height="36" rx="5" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/>
  <text x="318" y="64" font-size="13" fill="#4338ca" text-anchor="middle" font-weight="700">(fg)′ = f′g + fg′</text>

  <text x="318" y="100" font-size="9" fill="#4338ca" text-anchor="middle" font-weight="700">Reading it: "derivative of first times second,</text>
  <text x="318" y="113" font-size="9" fill="#4338ca" text-anchor="middle">plus first times derivative of second"</text>

  <!-- Example -->
  <text x="318" y="135" font-size="9" fill="#4338ca" text-anchor="middle" font-weight="700">Example: d/dx[x² sin x]</text>
  <rect x="170" y="142" width="295" height="62" rx="5" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1"/>
  <text x="176" y="160" font-size="9" fill="#059669">f = x²,  g = sin x</text>
  <text x="176" y="176" font-size="9" fill="#059669">f′ = 2x,  g′ = cos x</text>
  <text x="176" y="192" font-size="9" fill="#059669">= f′g + fg′ = 2x sin x + x² cos x</text>

  <!-- Common mistake -->
  <rect x="170" y="210" width="295" height="0" rx="5"/>
  <text x="318" y="208" font-size="8" fill="#ef4444" text-anchor="middle">⚠ (fg)′ ≠ f′g′ — never just multiply the derivatives</text>
</svg>
