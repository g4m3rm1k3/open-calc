<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" style="font-family: ui-monospace, monospace; border-radius: 12px;">
  <style>.bg{fill:rgb(var(--tw-custom-slate-50))}.dark .bg{fill:rgb(var(--tw-custom-slate-900))}</style>
  <rect width="480" height="200" rx="12" class="bg"/>
  <text x="240" y="16" font-size="11" fill="#4338ca" text-anchor="middle" font-weight="700">Interval Notation</text>
  <!-- Header row -->
  <rect x="8" y="24" width="464" height="14" rx="0" fill="#6366f1"/>
  <text x="100" y="35" font-size="8" fill="white" text-anchor="middle" font-weight="700">Interval</text>
  <text x="230" y="35" font-size="8" fill="white" text-anchor="middle" font-weight="700">Number Line</text>
  <text x="370" y="35" font-size="8" fill="white" text-anchor="middle" font-weight="700">Inequality</text>
  <!-- Row 1 -->
  <rect x="8" y="38" width="464" height="26" rx="0" fill="#eef2ff"/>
  <text x="100" y="55" font-size="9" fill="#1d4ed8" text-anchor="middle" font-weight="700">[a, b]</text>
  <line x1="175" y1="51" x2="285" y2="51" stroke="#6366f1" stroke-width="3"/>
  <circle cx="175" cy="51" r="5" fill="#6366f1"/>
  <circle cx="285" cy="51" r="5" fill="#6366f1"/>
  <text x="175" y="60" font-size="6.5" fill="#374151" text-anchor="middle">a ●</text>
  <text x="285" y="60" font-size="6.5" fill="#374151" text-anchor="middle">● b</text>
  <text x="370" y="55" font-size="9" fill="#374151" text-anchor="middle">a ≤ x ≤ b</text>
  <!-- Row 2 -->
  <rect x="8" y="64" width="464" height="26" rx="0" fill="#f8fafc"/>
  <text x="100" y="81" font-size="9" fill="#166534" text-anchor="middle" font-weight="700">(a, b)</text>
  <line x1="175" y1="77" x2="285" y2="77" stroke="#22c55e" stroke-width="3"/>
  <circle cx="175" cy="77" r="5" fill="white" stroke="#22c55e" stroke-width="2"/>
  <circle cx="285" cy="77" r="5" fill="white" stroke="#22c55e" stroke-width="2"/>
  <text x="175" y="86" font-size="6.5" fill="#374151" text-anchor="middle">a ○</text>
  <text x="285" y="86" font-size="6.5" fill="#374151" text-anchor="middle">○ b</text>
  <text x="370" y="81" font-size="9" fill="#374151" text-anchor="middle">a &lt; x &lt; b</text>
  <!-- Row 3 -->
  <rect x="8" y="90" width="464" height="26" rx="0" fill="#eef2ff"/>
  <text x="100" y="107" font-size="9" fill="#92400e" text-anchor="middle" font-weight="700">[a, b)</text>
  <line x1="175" y1="103" x2="285" y2="103" stroke="#f59e0b" stroke-width="3"/>
  <circle cx="175" cy="103" r="5" fill="#f59e0b"/>
  <circle cx="285" cy="103" r="5" fill="white" stroke="#f59e0b" stroke-width="2"/>
  <text x="175" y="112" font-size="6.5" fill="#374151" text-anchor="middle">a ●</text>
  <text x="285" y="112" font-size="6.5" fill="#374151" text-anchor="middle">○ b</text>
  <text x="370" y="107" font-size="9" fill="#374151" text-anchor="middle">a ≤ x &lt; b</text>
  <!-- Row 4 -->
  <rect x="8" y="116" width="464" height="26" rx="0" fill="#f8fafc"/>
  <text x="100" y="133" font-size="9" fill="#dc2626" text-anchor="middle" font-weight="700">[a, ∞)</text>
  <line x1="175" y1="129" x2="290" y2="129" stroke="#ef4444" stroke-width="3"/>
  <circle cx="175" cy="129" r="5" fill="#ef4444"/>
  <polygon points="290,124 300,129 290,134" fill="#ef4444"/>
  <text x="175" y="138" font-size="6.5" fill="#374151" text-anchor="middle">a ●</text>
  <text x="370" y="133" font-size="9" fill="#374151" text-anchor="middle">x ≥ a</text>
  <!-- Row 5 -->
  <rect x="8" y="142" width="464" height="26" rx="0" fill="#eef2ff"/>
  <text x="100" y="159" font-size="9" fill="#5b21b6" text-anchor="middle" font-weight="700">(−∞, b]</text>
  <line x1="170" y1="155" x2="285" y2="155" stroke="#7c3aed" stroke-width="3"/>
  <polygon points="170,150 160,155 170,160" fill="#7c3aed"/>
  <circle cx="285" cy="155" r="5" fill="#7c3aed"/>
  <text x="285" y="164" font-size="6.5" fill="#374151" text-anchor="middle">● b</text>
  <text x="370" y="159" font-size="9" fill="#374151" text-anchor="middle">x ≤ b</text>
  <!-- Note -->
  <rect x="8" y="174" width="464" height="22" rx="4" fill="#dcfce7"/>
  <text x="240" y="189" font-size="8" fill="#166534" text-anchor="middle">[ ] = closed (endpoint included) — ( ) = open (endpoint excluded) — ∞ always uses ( )</text>
</svg>
