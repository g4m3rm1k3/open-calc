<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" style="font-family: ui-monospace, monospace; border-radius: 12px;">
  <style>.bg{fill:rgb(var(--tw-custom-slate-50))}.dark .bg{fill:rgb(var(--tw-custom-slate-900))}</style>
  <rect width="480" height="200" rx="12" class="bg"/>
  <text x="240" y="16" font-size="11" fill="#4338ca" text-anchor="middle" font-weight="700">Indefinite Integrals — Quick Reference</text>
  <rect x="8" y="24" width="464" height="170" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="16" y="32" width="220" height="14" rx="0" fill="#e2e8f0"/>
  <text x="126" y="43" font-size="7.5" fill="#1e293b" text-anchor="middle" font-weight="700">∫ f(x) dx</text>
  <rect x="16" y="46" width="220" height="14" rx="0" fill="#dbeafe"/>
  <text x="126" y="57" font-size="7.5" fill="#1d4ed8" text-anchor="middle">∫ xⁿ dx = xⁿ⁺¹/(n+1) + C  (n≠−1)</text>
  <rect x="16" y="60" width="220" height="14" rx="0" fill="#f8fafc"/>
  <text x="126" y="71" font-size="7.5" fill="#374151" text-anchor="middle">∫ 1/x dx = ln|x| + C</text>
  <rect x="16" y="74" width="220" height="14" rx="0" fill="#dbeafe"/>
  <text x="126" y="85" font-size="7.5" fill="#1d4ed8" text-anchor="middle">∫ eˣ dx = eˣ + C</text>
  <rect x="16" y="88" width="220" height="14" rx="0" fill="#f8fafc"/>
  <text x="126" y="99" font-size="7.5" fill="#374151" text-anchor="middle">∫ aˣ dx = aˣ/ln(a) + C</text>
  <rect x="16" y="102" width="220" height="14" rx="0" fill="#dbeafe"/>
  <text x="126" y="113" font-size="7.5" fill="#1d4ed8" text-anchor="middle">∫ sin x dx = −cos x + C</text>
  <rect x="16" y="116" width="220" height="14" rx="0" fill="#f8fafc"/>
  <text x="126" y="127" font-size="7.5" fill="#374151" text-anchor="middle">∫ cos x dx = sin x + C</text>
  <rect x="16" y="130" width="220" height="14" rx="0" fill="#dbeafe"/>
  <text x="126" y="141" font-size="7.5" fill="#1d4ed8" text-anchor="middle">∫ sec²x dx = tan x + C</text>
  <rect x="16" y="144" width="220" height="14" rx="0" fill="#f8fafc"/>
  <text x="126" y="155" font-size="7.5" fill="#374151" text-anchor="middle">∫ csc²x dx = −cot x + C</text>
  <rect x="16" y="158" width="220" height="14" rx="0" fill="#dbeafe"/>
  <text x="126" y="169" font-size="7.5" fill="#1d4ed8" text-anchor="middle">∫ sec x tan x dx = sec x + C</text>
  <rect x="16" y="172" width="220" height="16" rx="0" fill="#f8fafc"/>
  <text x="126" y="183" font-size="7.5" fill="#374151" text-anchor="middle">∫ 1/(1+x²) dx = arctan x + C</text>
  <!-- Right side: derivatives reversed -->
  <rect x="244" y="32" width="220" height="14" rx="0" fill="#e2e8f0"/>
  <text x="354" y="43" font-size="7.5" fill="#1e293b" text-anchor="middle" font-weight="700">Derivative (reversed)</text>
  <rect x="244" y="46" width="220" height="14" rx="0" fill="#dbeafe"/>
  <text x="354" y="57" font-size="7.5" fill="#1d4ed8" text-anchor="middle">d/dx[xⁿ⁺¹/(n+1)] = xⁿ  ✓</text>
  <rect x="244" y="60" width="220" height="14" rx="0" fill="#f8fafc"/>
  <text x="354" y="71" font-size="7.5" fill="#374151" text-anchor="middle">d/dx[ln|x|] = 1/x  ✓</text>
  <rect x="244" y="74" width="220" height="14" rx="0" fill="#dbeafe"/>
  <text x="354" y="85" font-size="7.5" fill="#1d4ed8" text-anchor="middle">d/dx[eˣ] = eˣ  ✓</text>
  <rect x="244" y="88" width="220" height="14" rx="0" fill="#f8fafc"/>
  <text x="354" y="99" font-size="7.5" fill="#374151" text-anchor="middle">d/dx[aˣ/ln a] = aˣ  ✓</text>
  <rect x="244" y="102" width="220" height="14" rx="0" fill="#dbeafe"/>
  <text x="354" y="113" font-size="7.5" fill="#1d4ed8" text-anchor="middle">d/dx[−cos x] = sin x  ✓</text>
  <rect x="244" y="116" width="220" height="14" rx="0" fill="#f8fafc"/>
  <text x="354" y="127" font-size="7.5" fill="#374151" text-anchor="middle">d/dx[sin x] = cos x  ✓</text>
  <rect x="244" y="130" width="220" height="14" rx="0" fill="#dbeafe"/>
  <text x="354" y="141" font-size="7.5" fill="#1d4ed8" text-anchor="middle">d/dx[tan x] = sec²x  ✓</text>
  <rect x="244" y="144" width="220" height="14" rx="0" fill="#f8fafc"/>
  <text x="354" y="155" font-size="7.5" fill="#374151" text-anchor="middle">d/dx[−cot x] = csc²x  ✓</text>
  <rect x="244" y="158" width="220" height="14" rx="0" fill="#dbeafe"/>
  <text x="354" y="169" font-size="7.5" fill="#1d4ed8" text-anchor="middle">d/dx[sec x] = sec x tan x  ✓</text>
  <rect x="244" y="172" width="220" height="16" rx="0" fill="#f8fafc"/>
  <text x="354" y="183" font-size="7.5" fill="#374151" text-anchor="middle">d/dx[arctan x] = 1/(1+x²)  ✓</text>
</svg>
