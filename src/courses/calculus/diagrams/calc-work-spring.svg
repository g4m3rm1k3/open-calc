<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" style="font-family: ui-monospace, monospace; border-radius: 12px;">
  <style>.bg{fill:rgb(var(--tw-custom-slate-50))}.dark .bg{fill:rgb(var(--tw-custom-slate-900))}</style>
  <rect width="480" height="200" rx="12" class="bg"/>
  <text x="240" y="16" font-size="11" fill="#4338ca" text-anchor="middle" font-weight="700">Work — Variable Force (Spring Example)</text>
  <rect x="8" y="22" width="250" height="172" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <!-- Wall -->
  <rect x="18" y="35" width="10" height="125" fill="#374151"/>
  <!-- Spring (zigzag) -->
  <polyline points="28,100 45,85 60,115 75,85 90,115 105,85 120,115 135,85 145,100" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
  <!-- Block -->
  <rect x="145" y="80" width="40" height="40" rx="4" fill="#6366f1" opacity="0.7"/>
  <text x="165" y="104" font-size="8.5" fill="white" text-anchor="middle" font-weight="700">m</text>
  <!-- Force arrow -->
  <line x1="185" y1="100" x2="215" y2="100" stroke="#ef4444" stroke-width="2"/>
  <polygon points="215,96 222,100 215,104" fill="#ef4444"/>
  <text x="218" y="94" font-size="8.5" fill="#ef4444">F</text>
  <!-- Natural length label -->
  <line x1="28" y1="145" x2="145" y2="145" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="86" y="158" font-size="7.5" fill="#64748b" text-anchor="middle">natural length</text>
  <!-- x = displacement -->
  <line x1="145" y1="162" x2="220" y2="162" stroke="#6366f1" stroke-width="1.5"/>
  <text x="183" y="175" font-size="8" fill="#6366f1" text-anchor="middle">x (stretch)</text>
  <line x1="220" y1="62" x2="220" y2="172" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 2"/>
  <!-- Right panel -->
  <rect x="266" y="26" width="206" height="168" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="369" y="46" font-size="8.5" fill="#4338ca" text-anchor="middle" font-weight="700">Work = ∫ F(x) dx</text>
  <rect x="274" y="52" width="190" height="24" rx="4" fill="#dbeafe"/>
  <text x="369" y="68" font-size="8.5" fill="#1d4ed8" text-anchor="middle" font-weight="700">F(x) = kx  (Hooke's Law)</text>
  <text x="369" y="90" font-size="8" fill="#4338ca" text-anchor="middle">To stretch spring by b meters:</text>
  <rect x="274" y="96" width="190" height="24" rx="4" fill="#dcfce7"/>
  <text x="369" y="112" font-size="8.5" fill="#166534" text-anchor="middle" font-weight="700">W = ∫₀ᵇ kx dx = kb²/2</text>
  <text x="369" y="134" font-size="8" fill="#4338ca" text-anchor="middle">Example: k=40 N/m</text>
  <text x="369" y="148" font-size="8" fill="#4338ca" text-anchor="middle">stretch 0.5 m from natural:</text>
  <rect x="274" y="154" width="190" height="34" rx="4" fill="#fef3c7"/>
  <text x="369" y="170" font-size="8" fill="#92400e" text-anchor="middle">W = ∫₀^0.5 40x dx</text>
  <text x="369" y="184" font-size="8.5" fill="#92400e" text-anchor="middle" font-weight="700">= 5 J</text>
</svg>
