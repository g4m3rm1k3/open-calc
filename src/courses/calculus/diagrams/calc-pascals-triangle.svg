<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" style="font-family: ui-monospace, monospace; border-radius: 12px;">
  <style>.bg{fill:rgb(var(--tw-custom-slate-50))}.dark .bg{fill:rgb(var(--tw-custom-slate-900))}</style>
  <rect width="480" height="200" rx="12" class="bg"/>
  <text x="240" y="16" font-size="11" fill="#4338ca" text-anchor="middle" font-weight="700">Pascal's Triangle — Binomial Coefficients</text>
  <!-- Triangle -->
  <!-- Row 0 -->
  <circle cx="240" cy="36" r="14" fill="#6366f1"/>
  <text x="240" y="40" font-size="10" fill="white" text-anchor="middle" font-weight="700">1</text>
  <!-- Row 1 -->
  <circle cx="208" cy="66" r="14" fill="#4338ca"/>
  <text x="208" y="70" font-size="10" fill="white" text-anchor="middle" font-weight="700">1</text>
  <circle cx="272" cy="66" r="14" fill="#4338ca"/>
  <text x="272" y="70" font-size="10" fill="white" text-anchor="middle" font-weight="700">1</text>
  <!-- Row 2 -->
  <circle cx="176" cy="96" r="14" fill="#1d4ed8"/>
  <text x="176" y="100" font-size="10" fill="white" text-anchor="middle" font-weight="700">1</text>
  <circle cx="240" cy="96" r="14" fill="#2563eb"/>
  <text x="240" y="100" font-size="10" fill="white" text-anchor="middle" font-weight="700">2</text>
  <circle cx="304" cy="96" r="14" fill="#1d4ed8"/>
  <text x="304" y="100" font-size="10" fill="white" text-anchor="middle" font-weight="700">1</text>
  <!-- Row 3 -->
  <circle cx="144" cy="126" r="14" fill="#166534"/>
  <text x="144" y="130" font-size="10" fill="white" text-anchor="middle" font-weight="700">1</text>
  <circle cx="208" cy="126" r="14" fill="#16a34a"/>
  <text x="208" y="130" font-size="10" fill="white" text-anchor="middle" font-weight="700">3</text>
  <circle cx="272" cy="126" r="14" fill="#16a34a"/>
  <text x="272" y="130" font-size="10" fill="white" text-anchor="middle" font-weight="700">3</text>
  <circle cx="336" cy="126" r="14" fill="#166534"/>
  <text x="336" y="130" font-size="10" fill="white" text-anchor="middle" font-weight="700">1</text>
  <!-- Row 4 -->
  <circle cx="112" cy="156" r="14" fill="#92400e"/>
  <text x="112" y="160" font-size="10" fill="white" text-anchor="middle" font-weight="700">1</text>
  <circle cx="176" cy="156" r="14" fill="#d97706"/>
  <text x="176" y="160" font-size="10" fill="white" text-anchor="middle" font-weight="700">4</text>
  <circle cx="240" cy="156" r="14" fill="#f59e0b"/>
  <text x="240" y="160" font-size="10" fill="white" text-anchor="middle" font-weight="700">6</text>
  <circle cx="304" cy="156" r="14" fill="#d97706"/>
  <text x="304" y="160" font-size="10" fill="white" text-anchor="middle" font-weight="700">4</text>
  <circle cx="368" cy="156" r="14" fill="#92400e"/>
  <text x="368" y="160" font-size="10" fill="white" text-anchor="middle" font-weight="700">1</text>
  <!-- Row labels -->
  <text x="14" y="40" font-size="8" fill="#94a3b8">n=0</text>
  <text x="14" y="70" font-size="8" fill="#94a3b8">n=1</text>
  <text x="14" y="100" font-size="8" fill="#94a3b8">n=2</text>
  <text x="14" y="130" font-size="8" fill="#94a3b8">n=3</text>
  <text x="14" y="160" font-size="8" fill="#94a3b8">n=4</text>
  <!-- Addition arrows (sample) -->
  <text x="208" y="84" font-size="8" fill="#94a3b8" text-anchor="middle">+</text>
  <text x="272" y="84" font-size="8" fill="#94a3b8" text-anchor="middle">+</text>
  <!-- Formula -->
  <rect x="8" y="176" width="464" height="20" rx="4" fill="#eef2ff"/>
  <text x="240" y="190" font-size="8.5" fill="#4338ca" text-anchor="middle">Each entry = sum of two entries above it. Entry (n,k) = C(n,k) = n! / (k!(n−k)!)</text>
</svg>
