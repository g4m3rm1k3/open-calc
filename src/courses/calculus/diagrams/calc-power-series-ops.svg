<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" style="font-family: ui-monospace, monospace; border-radius: 12px;">
  <style>.bg{fill:rgb(var(--tw-custom-slate-50))}.dark .bg{fill:rgb(var(--tw-custom-slate-900))}</style>
  <rect width="480" height="200" rx="12" class="bg"/>
  <text x="240" y="16" font-size="11" fill="#4338ca" text-anchor="middle" font-weight="700">Operations on Power Series</text>
  <!-- Starting series -->
  <rect x="8" y="24" width="464" height="26" rx="6" fill="#dbeafe" stroke="#6366f1" stroke-width="1.5"/>
  <text x="240" y="42" font-size="9" fill="#1d4ed8" text-anchor="middle" font-weight="700">f(x) = Σ aₙ(x−c)ⁿ  (converges on |x−c| &lt; R)</text>
  <!-- Differentiation -->
  <rect x="8" y="58" width="228" height="66" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="122" y="76" font-size="8.5" fill="#166534" text-anchor="middle" font-weight="700">Differentiation (same R)</text>
  <rect x="16" y="82" width="212" height="18" rx="3" fill="#bbf7d0"/>
  <text x="122" y="95" font-size="8" fill="#14532d" text-anchor="middle">f′(x) = Σ n·aₙ(x−c)ⁿ⁻¹</text>
  <text x="122" y="116" font-size="7.5" fill="#374151" text-anchor="middle">Differentiate term-by-term — R unchanged</text>
  <!-- Integration -->
  <rect x="244" y="58" width="228" height="66" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="358" y="76" font-size="8.5" fill="#4338ca" text-anchor="middle" font-weight="700">Integration (same R)</text>
  <rect x="252" y="82" width="212" height="18" rx="3" fill="#dbeafe"/>
  <text x="358" y="95" font-size="8" fill="#1d4ed8" text-anchor="middle">∫f dx = Σ aₙ(x−c)ⁿ⁺¹/(n+1) + C</text>
  <text x="358" y="116" font-size="7.5" fill="#374151" text-anchor="middle">Integrate term-by-term — R unchanged</text>
  <!-- Example -->
  <rect x="8" y="132" width="464" height="62" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="240" y="150" font-size="8.5" fill="#92400e" text-anchor="middle" font-weight="700">Example: 1/(1−x) = 1+x+x²+x³+…  (|x|&lt;1)</text>
  <text x="240" y="164" font-size="8" fill="#374151" text-anchor="middle">Differentiate: 1/(1−x)² = 1+2x+3x²+…</text>
  <text x="240" y="178" font-size="8" fill="#374151" text-anchor="middle">Integrate: −ln(1−x) = x + x²/2 + x³/3 + …  → at x=1: ln 2 = 1−½+⅓−¼+…</text>
</svg>
