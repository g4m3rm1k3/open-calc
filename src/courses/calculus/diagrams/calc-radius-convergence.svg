<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" style="font-family: ui-monospace, monospace; border-radius: 12px;">
  <style>.bg{fill:rgb(var(--tw-custom-slate-50))}.dark .bg{fill:rgb(var(--tw-custom-slate-900))}</style>
  <rect width="480" height="200" rx="12" class="bg"/>
  <text x="240" y="16" font-size="11" fill="#4338ca" text-anchor="middle" font-weight="700">Radius and Interval of Convergence</text>
  <!-- Number line -->
  <line x1="40" y1="72" x2="440" y2="72" stroke="#64748b" stroke-width="2"/>
  <line x1="440" y1="66" x2="448" y2="72"/><line x1="440" y1="78" x2="448" y2="72"/>
  <circle cx="240" cy="72" r="4" fill="#374151"/>
  <text x="240" y="90" font-size="9" fill="#374151" text-anchor="middle">c</text>
  <text x="240" y="104" font-size="8" fill="#64748b" text-anchor="middle">(center)</text>
  <!-- Convergence interval -->
  <rect x="140" y="52" width="200" height="20" rx="3" fill="#22c55e" opacity="0.3"/>
  <circle cx="140" cy="62" r="5" fill="none" stroke="#22c55e" stroke-width="2"/>
  <circle cx="340" cy="62" r="5" fill="none" stroke="#22c55e" stroke-width="2"/>
  <line x1="140" y1="42" x2="140" y2="82" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="3 2"/>
  <line x1="340" y1="42" x2="340" y2="82" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="3 2"/>
  <text x="140" y="36" font-size="8.5" fill="#22c55e" text-anchor="middle">c − R</text>
  <text x="340" y="36" font-size="8.5" fill="#22c55e" text-anchor="middle">c + R</text>
  <!-- R arrow -->
  <line x1="240" y1="114" x2="340" y2="114" stroke="#4338ca" stroke-width="2"/>
  <polygon points="340,110 348,114 340,118" fill="#4338ca"/>
  <text x="290" y="130" font-size="9" fill="#4338ca" text-anchor="middle" font-weight="700">R</text>
  <text x="290" y="144" font-size="8" fill="#374151" text-anchor="middle">(radius of convergence)</text>
  <!-- Labels: diverges, converges, diverges -->
  <text x="80" y="68" font-size="8" fill="#dc2626" text-anchor="middle">diverges</text>
  <text x="240" y="68" font-size="8.5" fill="#166534" text-anchor="middle" font-weight="700">converges</text>
  <text x="395" y="68" font-size="8" fill="#dc2626" text-anchor="middle">diverges</text>
  <!-- Bottom: how to find R -->
  <rect x="8" y="152" width="464" height="42" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="240" y="168" font-size="8" fill="#4338ca" text-anchor="middle" font-weight="700">Finding R: use Ratio Test on |aₙ₊₁/aₙ| → L·|x−c|  ; set L·|x−c| &lt; 1 → R = 1/L</text>
  <text x="240" y="186" font-size="7.5" fill="#374151" text-anchor="middle">Always check endpoints separately (ratio test is inconclusive at x = c±R)</text>
</svg>
