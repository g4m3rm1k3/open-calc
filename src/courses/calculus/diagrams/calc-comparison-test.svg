<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" style="font-family: ui-monospace, monospace; border-radius: 12px;">
  <style>.bg{fill:rgb(var(--tw-custom-slate-50))}.dark .bg{fill:rgb(var(--tw-custom-slate-900))}</style>
  <rect width="480" height="200" rx="12" class="bg"/>
  <text x="240" y="16" font-size="11" fill="#4338ca" text-anchor="middle" font-weight="700">Comparison and Limit Comparison Tests</text>
  <rect x="8" y="24" width="220" height="170" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="118" y="40" font-size="8.5" fill="#4338ca" text-anchor="middle" font-weight="700">Direct Comparison Test</text>
  <text x="118" y="55" font-size="7.5" fill="#374151" text-anchor="middle">0 ≤ aₙ ≤ bₙ for all n</text>
  <rect x="16" y="62" width="204" height="26" rx="3" fill="#dcfce7"/>
  <text x="118" y="74" font-size="8" fill="#166534" text-anchor="middle">Σbₙ converges</text>
  <text x="118" y="86" font-size="8" fill="#166534" text-anchor="middle">→ Σaₙ converges</text>
  <rect x="16" y="94" width="204" height="26" rx="3" fill="#fee2e2"/>
  <text x="118" y="106" font-size="8" fill="#dc2626" text-anchor="middle">Σaₙ diverges</text>
  <text x="118" y="118" font-size="8" fill="#dc2626" text-anchor="middle">→ Σbₙ diverges</text>
  <!-- Visual bars -->
  <text x="118" y="138" font-size="7.5" fill="#374151" text-anchor="middle">bₙ is the "known" series (p-series, geom.)</text>
  <rect x="50" y="148" width="12" height="30" fill="#6366f1" opacity="0.8"/>
  <rect x="70" y="155" width="12" height="23" fill="#22c55e" opacity="0.8"/>
  <rect x="90" y="160" width="12" height="18" fill="#6366f1" opacity="0.8"/>
  <rect x="110" y="164" width="12" height="14" fill="#22c55e" opacity="0.8"/>
  <rect x="130" y="167" width="12" height="11" fill="#6366f1" opacity="0.8"/>
  <text x="75" y="185" font-size="7" fill="#6366f1" text-anchor="middle">bₙ ≥ aₙ</text>
  <text x="115" y="185" font-size="7" fill="#22c55e" text-anchor="middle">(aₙ)</text>
  <rect x="236" y="24" width="236" height="170" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="354" y="40" font-size="8.5" fill="#166534" text-anchor="middle" font-weight="700">Limit Comparison Test</text>
  <rect x="244" y="48" width="220" height="26" rx="3" fill="#bbf7d0"/>
  <text x="354" y="60" font-size="8" fill="#14532d" text-anchor="middle">L = lim (aₙ/bₙ) as n→∞</text>
  <text x="354" y="72" font-size="8" fill="#14532d" text-anchor="middle">0 &lt; L &lt; ∞ → same behavior</text>
  <rect x="244" y="82" width="220" height="38" rx="3" fill="#dcfce7"/>
  <text x="354" y="95" font-size="8" fill="#166534" text-anchor="middle">If Σbₙ converges → Σaₙ converges</text>
  <text x="354" y="110" font-size="8" fill="#166534" text-anchor="middle">If Σbₙ diverges → Σaₙ diverges</text>
  <text x="354" y="132" font-size="7.5" fill="#374151" text-anchor="middle">Useful when direct comparison is tricky</text>
  <rect x="244" y="140" width="220" height="48" rx="3" fill="#dbeafe"/>
  <text x="354" y="153" font-size="8" fill="#1d4ed8" text-anchor="middle">Example: Σ 1/(n²+1)</text>
  <text x="354" y="167" font-size="8" fill="#1d4ed8" text-anchor="middle">Compare to bₙ=1/n² (p-series, p=2)</text>
  <text x="354" y="181" font-size="8" fill="#1d4ed8" text-anchor="middle">L = lim n²/(n²+1) = 1 → converges</text>
</svg>
