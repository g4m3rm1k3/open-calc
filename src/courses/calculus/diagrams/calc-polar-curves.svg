<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" style="font-family: ui-monospace, monospace; border-radius: 12px;">
  <style>.bg{fill:rgb(var(--tw-custom-slate-50))}.dark .bg{fill:rgb(var(--tw-custom-slate-900))}</style>
  <rect width="480" height="200" rx="12" class="bg"/>
  <text x="240" y="16" font-size="11" fill="#4338ca" text-anchor="middle" font-weight="700">Common Polar Curves</text>
  <!-- Cardioid -->
  <rect x="8" y="24" width="110" height="170" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="63" y="38" font-size="7.5" fill="#4338ca" text-anchor="middle" font-weight="700">Cardioid</text>
  <text x="63" y="50" font-size="7" fill="#374151" text-anchor="middle">r = 1+cos θ</text>
  <path d="M 63,100 C 40,80 25,85 30,100 C 35,115 40,125 63,135 C 86,125 91,115 96,100 C 101,85 86,80 63,100 Z" fill="#6366f1" opacity="0.2" stroke="#6366f1" stroke-width="1.5"/>
  <circle cx="63" cy="100" r="2" fill="#6366f1"/>
  <text x="63" y="162" font-size="7" fill="#374151" text-anchor="middle">heart-shaped</text>
  <text x="63" y="174" font-size="7" fill="#374151" text-anchor="middle">Area = 3π/2</text>
  <!-- Lemniscate -->
  <rect x="126" y="24" width="110" height="170" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="181" y="38" font-size="7.5" fill="#166534" text-anchor="middle" font-weight="700">Lemniscate</text>
  <text x="181" y="50" font-size="7" fill="#374151" text-anchor="middle">r² = cos 2θ</text>
  <path d="M 181,100 C 165,85 145,85 145,100 C 145,115 165,115 181,100 C 197,85 217,85 217,100 C 217,115 197,115 181,100 Z" fill="#22c55e" opacity="0.2" stroke="#22c55e" stroke-width="1.5"/>
  <circle cx="181" cy="100" r="2" fill="#22c55e"/>
  <text x="181" y="162" font-size="7" fill="#374151" text-anchor="middle">figure-8</text>
  <text x="181" y="174" font-size="7" fill="#374151" text-anchor="middle">r² = a²cos2θ</text>
  <!-- Rose curve -->
  <rect x="244" y="24" width="110" height="170" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="299" y="38" font-size="7.5" fill="#92400e" text-anchor="middle" font-weight="700">Rose Curve</text>
  <text x="299" y="50" font-size="7" fill="#374151" text-anchor="middle">r = cos(3θ)</text>
  <!-- 3-petal rose -->
  <path d="M 299,100 Q 312,80 319,70 Q 326,60 319,75 Q 312,90 299,100 Q 286,88 284,72 Q 282,58 290,68 Q 298,78 299,100 Q 302,80 320,100 Q 338,120 318,115 Q 298,110 299,100 Z" fill="#f59e0b" opacity="0.3" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="299" y="162" font-size="7" fill="#374151" text-anchor="middle">n petals if n odd</text>
  <text x="299" y="174" font-size="7" fill="#374151" text-anchor="middle">2n petals if n even</text>
  <!-- Spiral -->
  <rect x="362" y="24" width="110" height="170" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="417" y="38" font-size="7.5" fill="#5b21b6" text-anchor="middle" font-weight="700">Archimedean</text>
  <text x="417" y="50" font-size="7" fill="#374151" text-anchor="middle">r = θ</text>
  <path d="M 417,100 Q 428,94 428,100 Q 428,109 415,112 Q 402,115 398,100 Q 394,82 409,74 Q 425,65 437,75 Q 449,86 444,104" fill="none" stroke="#7c3aed" stroke-width="2"/>
  <text x="417" y="162" font-size="7" fill="#374151" text-anchor="middle">grows as θ</text>
  <text x="417" y="174" font-size="7" fill="#374151" text-anchor="middle">increases</text>
</svg>
