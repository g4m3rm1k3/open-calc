<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" style="font-family: ui-monospace, monospace; border-radius: 12px;">
  <style>.bg{fill:rgb(var(--tw-custom-slate-50))}.dark .bg{fill:rgb(var(--tw-custom-slate-900))}</style>
  <rect width="480" height="200" rx="12" class="bg"/>
  <text x="240" y="16" font-size="11" fill="#4338ca" text-anchor="middle" font-weight="700">From Arithmetic to Algebra to Calculus</text>
  <!-- Ladder of abstraction -->
  <rect x="8" y="24" width="464" height="168" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <!-- Arithmetic row -->
  <rect x="20" y="36" width="440" height="36" rx="6" fill="#dbeafe"/>
  <text x="100" y="52" font-size="9" fill="#1d4ed8" font-weight="700">Arithmetic</text>
  <text x="240" y="52" font-size="8" fill="#374151">3 + 5 = 8  ,  2 × 6 = 12  ,  (2+3)² = 25</text>
  <text x="100" y="64" font-size="7.5" fill="#374151">Specific numbers, specific answers</text>
  <text x="460" y="54" font-size="16" fill="#6366f1" text-anchor="end">↑</text>
  <!-- Algebra row -->
  <rect x="20" y="80" width="440" height="36" rx="6" fill="#dcfce7"/>
  <text x="100" y="96" font-size="9" fill="#166534" font-weight="700">Algebra</text>
  <text x="240" y="96" font-size="8" fill="#374151">x + 5 = 8  ,  a² + 2ab + b² = (a+b)²</text>
  <text x="100" y="108" font-size="7.5" fill="#374151">Variables stand for any number — patterns become visible</text>
  <text x="460" y="98" font-size="16" fill="#6366f1" text-anchor="end">↑</text>
  <!-- Calculus row -->
  <rect x="20" y="124" width="440" height="36" rx="6" fill="#eef2ff"/>
  <text x="100" y="140" font-size="9" fill="#4338ca" font-weight="700">Calculus</text>
  <text x="240" y="140" font-size="8" fill="#374151">f′(x) = lim[h→0] (f(x+h)−f(x))/h</text>
  <text x="100" y="152" font-size="7.5" fill="#374151">Functions change — calculus measures HOW they change</text>
  <!-- Bridge label -->
  <text x="240" y="182" font-size="8" fill="#6366f1" text-anchor="middle" font-weight="700">Algebra is the language calculus is written in — fluency here = fluency in calculus</text>
</svg>
