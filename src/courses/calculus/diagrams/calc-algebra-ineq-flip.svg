<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" style="font-family: ui-monospace, monospace; border-radius: 12px;">
  <style>
    .bg  { fill: rgb(var(--tw-custom-slate-50)); }
    .mu  { fill: rgb(var(--tw-custom-slate-500)); }
    .tx  { fill: rgb(var(--tw-custom-slate-900)); }
    .dark .bg  { fill: rgb(var(--tw-custom-slate-900)); }
    .dark .mu  { fill: rgb(var(--tw-custom-slate-400)); }
    .dark .tx  { fill: rgb(var(--tw-custom-slate-200)); }
  </style>
  <rect width="480" height="200" rx="12" class="bg"/>

  <text x="240" y="17" font-size="11" fill="#4338ca" text-anchor="middle" font-weight="700">Inequality Rules — When Does the Sign Flip?</text>

  <!-- TOP ROW: Safe operations (no flip) -->
  <rect x="10" y="26" width="230" height="78" rx="8" fill="#f0fdf4" stroke="#10b981" stroke-width="1.5"/>
  <text x="125" y="44" font-size="9" fill="#059669" text-anchor="middle" font-weight="700">✓ SAFE — sign stays the same</text>

  <text x="125" y="60" font-size="8.5" class="mu" text-anchor="middle">Add or subtract any number:</text>
  <text x="125" y="74" font-size="10" fill="#059669" text-anchor="middle" font-weight="700">x &lt; 5  →  x+3 &lt; 8  ✓</text>

  <text x="125" y="88" font-size="8.5" class="mu" text-anchor="middle">Multiply/divide by positive:</text>
  <text x="125" y="99" font-size="10" fill="#059669" text-anchor="middle" font-weight="700">2x &lt; 10  →  x &lt; 5  ✓</text>

  <!-- TOP ROW RIGHT: Dangerous (flip!) -->
  <rect x="248" y="26" width="222" height="78" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="359" y="44" font-size="9" fill="#dc2626" text-anchor="middle" font-weight="700">⚠ FLIP — multiply/divide by negative</text>

  <!-- Number line showing reversal -->
  <text x="262" y="62" font-size="8.5" fill="#dc2626">Start: −1 &lt; 2  (true)</text>
  <text x="262" y="76" font-size="8.5" fill="#dc2626">×(−1): 1 &gt; −2  sign FLIPS!</text>
  <text x="262" y="90" font-size="9" fill="#dc2626" font-weight="700">−2x &lt; 6  →  x &gt; −3</text>
  <text x="359" y="100" font-size="7.5" class="mu" text-anchor="middle">(divided by −2, sign reversed)</text>

  <!-- MIDDLE: Worked example -->
  <rect x="10" y="112" width="460" height="60" rx="8" fill="#1e1b4b"/>
  <text x="240" y="131" font-size="10" fill="#a5b4fc" text-anchor="middle" font-weight="700">Worked Example: Solve  −3x + 6 &gt; 0</text>

  <text x="60"  y="152" font-size="9" fill="white" text-anchor="middle">−3x + 6 &gt; 0</text>
  <text x="60"  y="165" font-size="7.5" fill="#94a3b8" text-anchor="middle">original</text>

  <text x="148" y="152" font-size="14" fill="#6366f1" text-anchor="middle">→</text>

  <text x="240" y="152" font-size="9" fill="white" text-anchor="middle">−3x &gt; −6</text>
  <text x="240" y="165" font-size="7.5" fill="#94a3b8" text-anchor="middle">subtract 6</text>

  <text x="328" y="152" font-size="14" fill="#6366f1" text-anchor="middle">→</text>

  <text x="420" y="152" font-size="10" fill="#4ade80" text-anchor="middle" font-weight="700">x &lt; 2  ★</text>
  <text x="420" y="165" font-size="7.5" fill="#ef4444" text-anchor="middle">÷(−3) → FLIP!</text>

  <!-- Bottom reminder -->
  <rect x="10" y="178" width="460" height="18" rx="5" fill="#fde68a"/>
  <text x="240" y="191" font-size="9" fill="#78350f" text-anchor="middle" font-weight="700">Memory: "Negatives are contrarians — they always reverse the order!"</text>
</svg>
