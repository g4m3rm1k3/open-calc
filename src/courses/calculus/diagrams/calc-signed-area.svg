<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" style="font-family: ui-monospace, monospace; border-radius: 12px;">
  <style>.bg{fill:rgb(var(--tw-custom-slate-50))}.dark .bg{fill:rgb(var(--tw-custom-slate-900))}</style>
  <rect width="480" height="200" rx="12" class="bg"/>
  <text x="240" y="16" font-size="11" fill="#4338ca" text-anchor="middle" font-weight="700">Signed Area — Positive Above, Negative Below</text>
  <rect x="8" y="22" width="464" height="172" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="28" y1="110" x2="460" y2="110" stroke="#64748b" stroke-width="1.5"/>
  <line x1="28" y1="28" x2="28" y2="185" stroke="#64748b" stroke-width="1"/>
  <!-- Curve: one positive hump, one negative hump -->
  <path d="M 35,110 Q 55,70 90,48 Q 120,30 150,40 Q 180,52 200,80 Q 220,100 240,110 Q 260,120 290,140 Q 320,158 350,162 Q 380,162 410,148 Q 435,136 455,110" fill="none" stroke="#6366f1" stroke-width="2.5"/>
  <!-- Positive shading (above axis) -->
  <path d="M 35,110 L 35,110 Q 55,70 90,48 Q 120,30 150,40 Q 180,52 200,80 Q 220,100 240,110 Z" fill="#22c55e" opacity="0.2"/>
  <!-- Negative shading (below axis) -->
  <path d="M 240,110 Q 260,120 290,140 Q 320,158 350,162 Q 380,162 410,148 Q 435,136 455,110 Z" fill="#ef4444" opacity="0.2"/>
  <!-- Labels -->
  <text x="140" y="90" font-size="11" fill="#166534" text-anchor="middle" font-weight="700">+</text>
  <text x="350" y="148" font-size="11" fill="#991b1b" text-anchor="middle" font-weight="700">−</text>
  <!-- Zero crossing -->
  <circle cx="240" cy="110" r="4" fill="#64748b"/>
  <text x="240" y="104" font-size="8" fill="#64748b" text-anchor="middle">x=c</text>
  <!-- a and b markers -->
  <line x1="35" y1="106" x2="35" y2="116" stroke="#4338ca" stroke-width="2"/>
  <text x="35" y="128" font-size="9" fill="#4338ca" text-anchor="middle">a</text>
  <line x1="455" y1="106" x2="455" y2="116" stroke="#4338ca" stroke-width="2"/>
  <text x="455" y="128" font-size="9" fill="#4338ca" text-anchor="middle">b</text>
  <!-- Info boxes -->
  <rect x="38" y="142" width="148" height="46" rx="5" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="112" y="158" font-size="8" fill="#166534" text-anchor="middle" font-weight="700">∫ₐᶜ f(x) dx &gt; 0</text>
  <text x="112" y="172" font-size="7.5" fill="#166534" text-anchor="middle">counts positive</text>
  <text x="112" y="184" font-size="7.5" fill="#166534" text-anchor="middle">(curve above axis)</text>
  <rect x="296" y="142" width="148" height="46" rx="5" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="370" y="158" font-size="8" fill="#991b1b" text-anchor="middle" font-weight="700">∫ᶜᵇ f(x) dx &lt; 0</text>
  <text x="370" y="172" font-size="7.5" fill="#991b1b" text-anchor="middle">counts negative</text>
  <text x="370" y="184" font-size="7.5" fill="#991b1b" text-anchor="middle">(curve below axis)</text>
</svg>
