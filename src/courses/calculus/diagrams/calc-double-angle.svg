<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" style="font-family: ui-monospace, monospace; border-radius: 12px;">
  <style>.bg{fill:rgb(var(--tw-custom-slate-50))}.dark .bg{fill:rgb(var(--tw-custom-slate-900))}</style>
  <rect width="480" height="200" rx="12" class="bg"/>
  <text x="240" y="16" font-size="11" fill="#4338ca" text-anchor="middle" font-weight="700">Trig Identities — Double Angle &amp; Half Angle</text>
  <!-- Double angle -->
  <rect x="8" y="24" width="220" height="104" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="118" y="40" font-size="8.5" fill="#4338ca" text-anchor="middle" font-weight="700">Double Angle Formulas</text>
  <text x="118" y="57" font-size="8.5" fill="#374151" text-anchor="middle">sin(2θ) = 2 sin θ cos θ</text>
  <text x="118" y="73" font-size="8.5" fill="#374151" text-anchor="middle">cos(2θ) = cos²θ − sin²θ</text>
  <text x="118" y="89" font-size="8" fill="#374151" text-anchor="middle">         = 2cos²θ − 1</text>
  <text x="118" y="105" font-size="8" fill="#374151" text-anchor="middle">         = 1 − 2sin²θ</text>
  <text x="118" y="121" font-size="8.5" fill="#374151" text-anchor="middle">tan(2θ) = 2tanθ / (1−tan²θ)</text>
  <!-- Half angle -->
  <rect x="236" y="24" width="236" height="104" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="354" y="40" font-size="8.5" fill="#166534" text-anchor="middle" font-weight="700">Half Angle Formulas</text>
  <text x="354" y="57" font-size="8.5" fill="#374151" text-anchor="middle">sin²θ = (1 − cos 2θ) / 2</text>
  <text x="354" y="73" font-size="8.5" fill="#374151" text-anchor="middle">cos²θ = (1 + cos 2θ) / 2</text>
  <text x="354" y="89" font-size="8" fill="#374151" text-anchor="middle">Derived from double-angle cos forms</text>
  <text x="354" y="105" font-size="8" fill="#374151" text-anchor="middle">sin(θ/2) = ±√((1−cosθ)/2)</text>
  <text x="354" y="121" font-size="8" fill="#374151" text-anchor="middle">cos(θ/2) = ±√((1+cosθ)/2)</text>
  <!-- Sum/difference -->
  <rect x="8" y="134" width="220" height="60" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="118" y="150" font-size="8.5" fill="#92400e" text-anchor="middle" font-weight="700">Sum &amp; Difference</text>
  <text x="118" y="166" font-size="8" fill="#374151" text-anchor="middle">sin(A±B) = sinA cosB ± cosA sinB</text>
  <text x="118" y="182" font-size="8" fill="#374151" text-anchor="middle">cos(A±B) = cosA cosB ∓ sinA sinB</text>
  <!-- Calculus use -->
  <rect x="236" y="134" width="236" height="60" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="354" y="150" font-size="8.5" fill="#5b21b6" text-anchor="middle" font-weight="700">Calculus Applications</text>
  <text x="354" y="166" font-size="8" fill="#374151" text-anchor="middle">sin²θ = (1−cos2θ)/2 powers reduction</text>
  <text x="354" y="182" font-size="8" fill="#374151" text-anchor="middle">∫sin²x dx = x/2 − sin(2x)/4 + C</text>
</svg>
