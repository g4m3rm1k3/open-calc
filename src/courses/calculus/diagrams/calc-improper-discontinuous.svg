<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" style="font-family: ui-monospace, monospace; border-radius: 12px;">
  <style>.bg{fill:rgb(var(--tw-custom-slate-50))}.dark .bg{fill:rgb(var(--tw-custom-slate-900))}</style>
  <rect width="480" height="200" rx="12" class="bg"/>
  <text x="240" y="16" font-size="11" fill="#4338ca" text-anchor="middle" font-weight="700">Improper Integrals — Discontinuous Integrand</text>
  <rect x="8" y="22" width="290" height="172" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="28" y1="165" x2="290" y2="165" stroke="#64748b" stroke-width="1"/>
  <line x1="28" y1="28" x2="28" y2="169" stroke="#64748b" stroke-width="1"/>
  <!-- Curve 1/√x from 0 to 1 (left singularity) -->
  <path d="M 55,30 Q 65,42 80,60 Q 100,82 120,102 Q 145,120 165,135 Q 190,148 215,156 Q 240,162 270,165" fill="none" stroke="#6366f1" stroke-width="2.5"/>
  <!-- Shaded area -->
  <path d="M 55,165 L 55,30 Q 65,42 80,60 Q 100,82 120,102 Q 145,120 165,135 Q 190,148 215,156 Q 240,162 270,165 Z" fill="#6366f1" opacity="0.15"/>
  <!-- Vertical asymptote at x=0 -->
  <line x1="55" y1="28" x2="55" y2="165" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="55" y="182" font-size="8.5" fill="#ef4444" text-anchor="middle">0</text>
  <line x1="270" y1="160" x2="270" y2="169" stroke="#4338ca" stroke-width="1.5"/>
  <text x="270" y="182" font-size="8.5" fill="#4338ca" text-anchor="middle">1</text>
  <!-- Labels -->
  <text x="70" y="40" font-size="8.5" fill="#6366f1">f(x)=1/√x</text>
  <text x="165" y="140" font-size="8" fill="#4338ca" text-anchor="middle">area = 2</text>
  <text x="165" y="154" font-size="8" fill="#059669" text-anchor="middle">CONVERGES ✓</text>
  <!-- Right panel -->
  <rect x="306" y="26" width="166" height="168" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="389" y="46" font-size="8.5" fill="#4338ca" text-anchor="middle" font-weight="700">Type II Improper</text>
  <rect x="314" y="52" width="150" height="36" rx="4" fill="#dbeafe"/>
  <text x="389" y="66" font-size="8" fill="#1d4ed8" text-anchor="middle">∫₀¹ 1/√x dx</text>
  <text x="389" y="80" font-size="8" fill="#1d4ed8" text-anchor="middle">= lim_{t→0⁺} ∫ₜ¹ 1/√x dx</text>
  <text x="389" y="100" font-size="8" fill="#4338ca" text-anchor="middle">= lim_{t→0⁺} [2√x]ₜ¹</text>
  <text x="389" y="114" font-size="8" fill="#4338ca" text-anchor="middle">= lim_{t→0⁺} (2 − 2√t)</text>
  <rect x="314" y="120" width="150" height="24" rx="4" fill="#dcfce7"/>
  <text x="389" y="136" font-size="9" fill="#059691" text-anchor="middle" font-weight="700">= 2 − 0 = 2  ✓</text>
  <line x1="314" y1="148" x2="462" y2="148" stroke="#cbd5e1" stroke-width="1"/>
  <text x="389" y="166" font-size="8" fill="#4338ca" text-anchor="middle">Singularity at left endpoint</text>
  <text x="389" y="180" font-size="8" fill="#4338ca" text-anchor="middle">→ limit from the right</text>
</svg>
