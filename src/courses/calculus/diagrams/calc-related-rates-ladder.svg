<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" style="font-family: ui-monospace, monospace; border-radius: 12px;">
  <style>.bg{fill:rgb(var(--tw-custom-slate-50))}.dark .bg{fill:rgb(var(--tw-custom-slate-900))}</style>
  <rect width="480" height="200" rx="12" class="bg"/>
  <text x="240" y="16" font-size="11" fill="#4338ca" text-anchor="middle" font-weight="700">Related Rates — Ladder Problem</text>
  <!-- Ground and wall -->
  <rect x="8" y="22" width="240" height="172" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="20" y1="170" x2="238" y2="170" stroke="#374151" stroke-width="4"/>
  <rect x="20" y="40" width="8" height="130" fill="#374151"/>
  <!-- Wall label -->
  <text x="34" y="120" font-size="8" fill="#374151" text-transform="rotate(-90)" transform="rotate(-90,34,120)">Wall</text>
  <!-- Ladder -->
  <line x1="28" y1="55" x2="180" y2="170" stroke="#f59e0b" stroke-width="5"/>
  <!-- Height y -->
  <line x1="28" y1="55" x2="28" y2="170" stroke="#ef4444" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="42" y="115" font-size="9" fill="#ef4444" font-weight="700">y</text>
  <!-- Base x -->
  <line x1="28" y1="178" x2="180" y2="178" stroke="#6366f1" stroke-width="2"/>
  <text x="104" y="193" font-size="9" fill="#6366f1" text-anchor="middle" font-weight="700">x</text>
  <!-- Right angle -->
  <rect x="28" y="160" width="10" height="10" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <!-- Ladder label -->
  <text x="100" y="98" font-size="8.5" fill="#b45309" transform="rotate(-33, 100, 98)">L = 10 m</text>
  <!-- Arrows: dx/dt -->
  <text x="155" y="162" font-size="7.5" fill="#6366f1">→ dx/dt = ?</text>
  <!-- Arrows: dy/dt -->
  <text x="35" y="50" font-size="7.5" fill="#ef4444">dy/dt = −2 m/s</text>

  <!-- Equations panel -->
  <rect x="254" y="26" width="218" height="168" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="363" y="44" font-size="8.5" fill="#4338ca" text-anchor="middle" font-weight="700">Solution Steps</text>
  <rect x="262" y="50" width="202" height="22" rx="4" fill="#dbeafe"/>
  <text x="363" y="65" font-size="8" fill="#1d4ed8" text-anchor="middle" font-weight="700">Equation: x² + y² = L²</text>
  <rect x="262" y="78" width="202" height="22" rx="4" fill="#dcfce7"/>
  <text x="363" y="93" font-size="8" fill="#166534" text-anchor="middle">Diff both sides w.r.t. t:</text>
  <rect x="262" y="106" width="202" height="22" rx="4" fill="#fef3c7"/>
  <text x="363" y="121" font-size="8" fill="#92400e" text-anchor="middle" font-weight="700">2x(dx/dt) + 2y(dy/dt) = 0</text>
  <rect x="262" y="134" width="202" height="22" rx="4" fill="#ede9fe"/>
  <text x="363" y="149" font-size="8" fill="#5b21b6" text-anchor="middle">x=6, y=8, dy/dt=−2:</text>
  <rect x="262" y="162" width="202" height="22" rx="4" fill="#fce7f3"/>
  <text x="363" y="177" font-size="8.5" fill="#be185d" text-anchor="middle" font-weight="700">dx/dt = 8/3 m/s</text>
</svg>
