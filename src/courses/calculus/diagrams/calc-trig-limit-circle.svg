<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" style="font-family: ui-monospace, monospace; border-radius: 12px;">
  <style>
    .bg  { fill: rgb(var(--tw-custom-slate-50)); }
    .mu  { fill: rgb(var(--tw-custom-slate-500)); }
    .tx  { fill: rgb(var(--tw-custom-slate-900)); }
    .dark .bg  { fill: rgb(var(--tw-custom-slate-900)); }
    .dark .mu  { fill: rgb(var(--tw-custom-slate-400)); }
    .dark .tx  { fill: rgb(var(--tw-custom-slate-200)); }
  </style>
  <rect width="480" height="200" rx="12" class="bg"/>
  <text x="240" y="17" font-size="11" fill="#4338ca" text-anchor="middle" font-weight="700">Why sin(x)/x → 1 as x → 0 (Geometric Proof)</text>

  <!-- Circle for geometric proof -->
  <rect x="10" y="24" width="230" height="168" rx="8" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5"/>

  <!-- Unit circle (center 120,116, radius 70) -->
  <circle cx="120" cy="116" r="70" fill="none" stroke="#0284c7" stroke-width="1.5"/>

  <!-- x axis -->
  <line x1="28" y1="116" x2="200" y2="116" stroke="#64748b" stroke-width="1"/>
  <!-- y axis -->
  <line x1="120" y1="36" x2="120" y2="180" stroke="#64748b" stroke-width="1"/>

  <!-- Angle θ ≈ 35° → point on circle at (120+70cos35, 116-70sin35) ≈ (177, 76) -->
  <!-- cos(35°)≈0.819, sin(35°)≈0.574 → (177, 76) -->

  <!-- Radius to point on circle -->
  <line x1="120" y1="116" x2="177" y2="76" stroke="#0284c7" stroke-width="2"/>
  <circle cx="177" cy="76" r="3.5" fill="#0284c7"/>

  <!-- sin(θ): vertical drop from circle point to x-axis -->
  <line x1="177" y1="76" x2="177" y2="116" stroke="#6366f1" stroke-width="2"/>
  <text x="182" y="100" font-size="8.5" fill="#6366f1" font-weight="700">sin θ</text>

  <!-- tan(θ): vertical line from x-axis to tan point (120+70, 116 - 70·tan35) -->
  <!-- tan(35°)≈0.700 → tan point: (190, 116-49) = (190, 67) -->
  <line x1="190" y1="116" x2="190" y2="67" stroke="#ef4444" stroke-width="2"/>
  <text x="194" y="94" font-size="8.5" fill="#ef4444" font-weight="700">tan θ</text>
  <line x1="120" y1="116" x2="190" y2="67" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,2"/>

  <!-- Arc θ: arc label -->
  <path d="M 162,116 A 42,42 0 0,0 154,87" fill="none" stroke="#059669" stroke-width="2"/>
  <text x="163" y="108" font-size="8.5" fill="#059669" font-weight="700">θ (arc)</text>

  <!-- Legend: sin < θ < tan -->
  <rect x="18" y="150" width="214" height="30" rx="5" fill="#dbeafe"/>
  <text x="125" y="163" font-size="8" fill="#1d4ed8" text-anchor="middle" font-weight="700">Area comparison (squeeze):</text>
  <text x="125" y="176" font-size="8.5" fill="#1d4ed8" text-anchor="middle">sin θ ≤ θ ≤ tan θ</text>

  <!-- Right: derivation -->
  <rect x="248" y="24" width="222" height="168" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="359" y="42" font-size="9" fill="#059669" text-anchor="middle" font-weight="700">Area Squeeze (θ &gt; 0)</text>
  <line x1="256" y1="48" x2="462" y2="48" stroke="#a7f3d0" stroke-width="1"/>

  <text x="258" y="64" font-size="8" fill="#166534">Triangle ≤ Sector ≤ Triangle</text>
  <text x="258" y="80" font-size="8.5" fill="#059669" font-weight="700">½sinθ ≤ θ/2 ≤ ½tanθ</text>

  <text x="258" y="98" font-size="8" fill="#166534">Divide through by sinθ/2:</text>
  <text x="258" y="114" font-size="8.5" fill="#059669" font-weight="700">1 ≤ θ/sinθ ≤ 1/cosθ</text>

  <text x="258" y="132" font-size="8" fill="#166534">Take reciprocals (flip ineq):</text>
  <text x="258" y="148" font-size="8.5" fill="#059669" font-weight="700">cosθ ≤ sinθ/θ ≤ 1</text>

  <text x="258" y="166" font-size="8" fill="#166534">As θ→0, cos θ→1:</text>
  <rect x="256" y="170" width="196" height="18" rx="4" fill="#4338ca"/>
  <text x="354" y="183" font-size="10" fill="white" text-anchor="middle" font-weight="700">lim sin(θ)/θ = 1</text>
</svg>
