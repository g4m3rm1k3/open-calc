<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" style="font-family: ui-monospace, monospace; border-radius: 12px;">
  <style>
    .bg  { fill: rgb(var(--tw-custom-slate-50)); }
    .mu  { fill: rgb(var(--tw-custom-slate-500)); }
    .tx  { fill: rgb(var(--tw-custom-slate-900)); }
    .dark .bg  { fill: rgb(var(--tw-custom-slate-900)); }
    .dark .mu  { fill: rgb(var(--tw-custom-slate-400)); }
    .dark .tx  { fill: rgb(var(--tw-custom-slate-200)); }
  </style>
  <rect width="480" height="200" rx="12" class="bg"/>

  <text x="240" y="17" font-size="11" fill="#4338ca" text-anchor="middle" font-weight="700">Secant → Tangent: The Limit Process</text>

  <!-- LEFT PANEL: Secant Line -->
  <rect x="10" y="24" width="196" height="166" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="108" y="41" font-size="9" fill="#4338ca" text-anchor="middle" font-weight="700">SECANT (two points)</text>

  <!-- Curve (approximate parabola going up-right in SVG coords) -->
  <path d="M 22,176 Q 80,148 108,112 Q 136,76 192,44" fill="none" stroke="#6366f1" stroke-width="2"/>

  <!-- Two points on curve -->
  <circle cx="65" cy="152" r="4" fill="#6366f1"/>
  <circle cx="152" cy="76" r="4" fill="#6366f1"/>

  <!-- Secant line (dashed red, through both points, extended) -->
  <line x1="18" y1="178" x2="198" y2="56" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="6,3"/>

  <!-- Rise/Run guide lines -->
  <line x1="65" y1="152" x2="152" y2="152" stroke="#059669" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="152" y1="76" x2="152" y2="152" stroke="#059669" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="105" y="164" font-size="7.5" fill="#059669" text-anchor="middle">run = h</text>
  <text x="160" y="118" font-size="7.5" fill="#059669">rise</text>

  <!-- Point labels -->
  <text x="22" y="148" font-size="7" class="tx">(x, f(x))</text>
  <text x="105" y="72" font-size="7" class="tx">(x+h, f(x+h))</text>

  <!-- Formula box -->
  <rect x="18" y="164" width="180" height="18" rx="4" fill="#c7d2fe"/>
  <text x="108" y="176" font-size="8.5" fill="#3730a3" text-anchor="middle" font-weight="700">slope = [f(x+h)−f(x)] / h</text>

  <!-- CENTER: h→0 arrow -->
  <text x="238" y="98" font-size="9" fill="#059669" text-anchor="middle" font-weight="700">h → 0</text>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto">
      <polygon points="0,0 8,3.5 0,7" fill="#059669"/>
    </marker>
  </defs>
  <line x1="212" y1="106" x2="264" y2="106" stroke="#059669" stroke-width="2" marker-end="url(#arr)"/>

  <!-- RIGHT PANEL: Tangent Line -->
  <rect x="270" y="24" width="200" height="166" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="370" y="41" font-size="9" fill="#059669" text-anchor="middle" font-weight="700">TANGENT (one point)</text>

  <!-- Curve (same shape, shifted right) -->
  <path d="M 282,176 Q 340,148 368,112 Q 396,76 452,44" fill="none" stroke="#10b981" stroke-width="2"/>

  <!-- Single tangent point -->
  <circle cx="368" cy="112" r="4" fill="#10b981"/>
  <text x="340" y="130" font-size="7" class="tx">(x, f(x))</text>

  <!-- Tangent line (solid, just touches curve at one point) -->
  <line x1="278" y1="160" x2="460" y2="52" stroke="#f59e0b" stroke-width="1.5"/>

  <!-- Formula box -->
  <rect x="278" y="164" width="184" height="18" rx="4" fill="#a7f3d0"/>
  <text x="370" y="176" font-size="8.5" fill="#065f46" text-anchor="middle" font-weight="700">f′(x) = instantaneous rate</text>
</svg>
