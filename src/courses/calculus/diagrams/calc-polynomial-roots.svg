<svg viewBox="0 0 480 215" xmlns="http://www.w3.org/2000/svg" style="font-family: ui-monospace, monospace; border-radius: 12px;">
  <style>
    .bg  { fill: rgb(var(--tw-custom-slate-50)); }
    .ax  { stroke: rgb(var(--tw-custom-slate-400)); }
    .axf { fill: rgb(var(--tw-custom-slate-400)); }
    .mu  { fill: rgb(var(--tw-custom-slate-500)); }
    .dark .bg  { fill: rgb(var(--tw-custom-slate-900)); }
    .dark .ax  { stroke: rgb(var(--tw-custom-slate-600)); }
    .dark .axf { fill: rgb(var(--tw-custom-slate-600)); }
    .dark .mu  { fill: rgb(var(--tw-custom-slate-400)); }
  </style>
  <rect width="480" height="215" rx="12" class="bg"/>
  <text x="240" y="17" font-size="11" fill="#4338ca" text-anchor="middle" font-weight="700">Roots, Factors, and Zeros — The Factor Theorem</text>

  <!-- LEFT: cubic polynomial graph with 3 labeled zeros -->
  <!-- x-axis at y=130, x from 20 to 240 -->
  <line x1="20"  y1="130" x2="240" y2="130" class="ax" stroke-width="1.2"/>
  <line x1="50"  y1="30"  x2="50"  y2="200" class="ax" stroke-width="1.2"/>
  <polygon points="238,126 246,130 238,134" class="axf"/>

  <!-- Polynomial f(x)=(x+1)(x-1)(x-3)/4 but scaled to SVG coords
       Let origin = (50,130), scale=40px per unit, x range from -1.8 to 3.8
       SVG x = 50 + x*40, SVG y = 130 - f(x)*40
       f(x) = (1/4)(x+1)(x-1)(x-3)
       At x=−1: f=0 → (10, 130)
       At x=+1: f=0 → (90, 130)
       At x=+3: f=0 → (170, 130)
       At x=−1.5: f=(1/4)(−0.5)(−2.5)(−4.5)≈−1.4 → (−10,186) ← clip
       Actually let me scale less: 36px per unit
       SVG x = 50 + (x+1.3)*36  so x=-1 → 50+0.3*36=61, x=1 → 50+2.3*36=133, x=3 → 50+4.3*36=205 -->
  <!-- Using cubic bezier approximation -->
  <path d="M 30,160 C 50,180 55,205 61,130 C 70,75 80,40 133,130 C 155,160 165,185 205,130 C 220,105 230,68 240,40"
        fill="none" stroke="#6366f1" stroke-width="2.5"/>
  <!-- shade area below curve between x=−1 and x=1 (negative lobe) -->

  <!-- Root markers: (61,130), (133,130), (205,130) -->
  <circle cx="61"  cy="130" r="5" fill="white" stroke="#059669" stroke-width="2"/>
  <circle cx="133" cy="130" r="5" fill="white" stroke="#059669" stroke-width="2"/>
  <circle cx="205" cy="130" r="5" fill="white" stroke="#059669" stroke-width="2"/>

  <!-- Labels -->
  <text x="61"  y="148" font-size="9" fill="#059669" text-anchor="middle" font-weight="700">x = −1</text>
  <text x="133" y="148" font-size="9" fill="#059669" text-anchor="middle" font-weight="700">x = 1</text>
  <text x="205" y="148" font-size="9" fill="#059669" text-anchor="middle" font-weight="700">x = 3</text>
  <text x="50"  y="142" font-size="8" class="mu" text-anchor="middle">0</text>

  <!-- Factor annotations above root markers -->
  <line x1="61"  y1="120" x2="61"  y2="100" stroke="#059669" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="61"  y="95"  font-size="8.5" fill="#059669" text-anchor="middle">(x+1)</text>
  <line x1="133" y1="120" x2="133" y2="80" stroke="#059669" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="133" y="75"  font-size="8.5" fill="#059669" text-anchor="middle">(x−1)</text>
  <line x1="205" y1="120" x2="205" y2="55" stroke="#059669" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="205" y="50"  font-size="8.5" fill="#059669" text-anchor="middle">(x−3)</text>

  <text x="130" y="198" font-size="8.5" fill="#4338ca" text-anchor="middle">f(x) = (x+1)(x−1)(x−3)/4</text>

  <!-- DIVIDER -->
  <line x1="258" y1="26" x2="258" y2="205" stroke="#e2e8f0" stroke-width="1"/>

  <!-- RIGHT: Factor Theorem and facts -->
  <text x="369" y="33" font-size="9" fill="#4338ca" text-anchor="middle" font-weight="700">Factor Theorem</text>

  <rect x="266" y="40" width="206" height="40" rx="5" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1"/>
  <text x="369" y="57" font-size="8.5" fill="#4338ca" text-anchor="middle">(x − r) is a factor of f(x)</text>
  <text x="369" y="72" font-size="9"   fill="#6366f1" text-anchor="middle" font-weight="700">⟺  f(r) = 0</text>

  <rect x="266" y="88" width="206" height="50" rx="4" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1"/>
  <text x="369" y="103" font-size="8.5" fill="#059669" text-anchor="middle" font-weight="700">Degree–Root Connection</text>
  <text x="268" y="117" font-size="8" class="mu">• Degree n polynomial has ≤ n roots</text>
  <text x="268" y="130" font-size="8" class="mu">• If n real roots: f(x) = a(x−r₁)···(x−rₙ)</text>

  <rect x="266" y="146" width="206" height="42" rx="4" fill="#fef9c3" stroke="#fde68a" stroke-width="1"/>
  <text x="369" y="162" font-size="8.5" fill="#d97706" text-anchor="middle" font-weight="700">Rational Root Theorem</text>
  <text x="268" y="175" font-size="8" class="mu">Rational roots of aₙxⁿ+…+a₀ are ± (factor of a₀)</text>
  <text x="268" y="187" font-size="8" class="mu">                                         (factor of aₙ)</text>

  <rect x="266" y="196" width="206" height="14" rx="3" fill="#fff1f2"/>
  <text x="369" y="207" font-size="8" fill="#dc2626" text-anchor="middle">Complex roots come in conjugate pairs for real coefficients</text>
</svg>
