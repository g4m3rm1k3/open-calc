<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" style="font-family: ui-monospace, monospace; border-radius: 12px;">
  <style>.bg{fill:rgb(var(--tw-custom-slate-50))}.dark .bg{fill:rgb(var(--tw-custom-slate-900))}</style>
  <rect width="480" height="200" rx="12" class="bg"/>
  <text x="240" y="16" font-size="11" fill="#4338ca" text-anchor="middle" font-weight="700">Net Change Theorem — ∫ₐᵇ f ′(x) dx = f(b) − f(a)</text>
  <rect x="8" y="24" width="464" height="170" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <!-- Rate graph (velocity) -->
  <text x="140" y="40" font-size="8.5" fill="#1e293b" text-anchor="middle" font-weight="700">Rate (velocity v(t))</text>
  <line x1="18" y1="130" x2="280" y2="130" stroke="#64748b" stroke-width="1"/>
  <line x1="18" y1="36" x2="18" y2="134" stroke="#64748b" stroke-width="1"/>
  <!-- Velocity curve - positive then negative -->
  <path d="M 30,130 Q 60,100 90,78 Q 115,62 135,58 Q 155,56 170,65 Q 190,80 210,105 Q 230,125 250,132 Q 265,134 275,130" fill="none" stroke="#6366f1" stroke-width="2.5"/>
  <!-- Positive area (above axis) -->
  <path d="M 30,130 Q 60,100 90,78 Q 115,62 135,58 Q 155,56 170,65 Q 185,75 200,98 L 200,130 Z" fill="#22c55e" opacity="0.2"/>
  <!-- Negative area -->
  <path d="M 200,130 Q 210,108 225,125 Q 240,130 255,130 Z" fill="#ef4444" opacity="0.2"/>
  <text x="105" y="110" font-size="8" fill="#166534" text-anchor="middle">+ (moving right)</text>
  <text x="225" y="124" font-size="8" fill="#991b1b" text-anchor="middle">−</text>
  <!-- Right panel: formula -->
  <rect x="295" y="36" width="168" height="150" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="379" y="56" font-size="8.5" fill="#4338ca" text-anchor="middle" font-weight="700">Net Change Theorem</text>
  <rect x="303" y="62" width="152" height="28" rx="4" fill="#dbeafe"/>
  <text x="379" y="76" font-size="8.5" fill="#1d4ed8" text-anchor="middle" font-weight="700">∫ₐᵇ v(t) dt = s(b) − s(a)</text>
  <text x="379" y="92" font-size="7.5" fill="#1e40af" text-anchor="middle">= net displacement</text>
  <text x="379" y="112" font-size="8" fill="#4338ca" text-anchor="middle">Integrating the rate of</text>
  <text x="379" y="126" font-size="8" fill="#4338ca" text-anchor="middle">change gives the NET</text>
  <text x="379" y="140" font-size="8" fill="#4338ca" text-anchor="middle">change in quantity</text>
  <rect x="303" y="152" width="152" height="28" rx="4" fill="#dcfce7"/>
  <text x="379" y="164" font-size="8" fill="#166534" text-anchor="middle">+ area → moved right</text>
  <text x="379" y="178" font-size="8" fill="#ef4444" text-anchor="middle">− area → moved left</text>
</svg>
