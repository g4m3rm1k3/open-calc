<svg viewBox="0 0 480 220" xmlns="http://www.w3.org/2000/svg" style="font-family: ui-monospace, monospace; border-radius: 12px;">
  <style>
    .bg  { fill: #f8fafc; }
    .mu  { fill: #64748b; }
    .dark .bg  { fill: #0f172a; }
    .dark .mu  { fill: #64748b; }
  </style>
  <rect width="480" height="220" rx="12" class="bg"/>

  <text x="240" y="18" font-size="11" fill="#4338ca" text-anchor="middle" font-weight="700">Limit Laws — Arithmetic on Limits</text>

  <!-- Header -->
  <rect x="12" y="26" width="456" height="18" rx="4" fill="#eef2ff"/>
  <text x="240" y="39" font-size="8.5" fill="#4338ca" text-anchor="middle">If lim f(x) = L and lim g(x) = M (both exist and are finite), then:</text>
  <text x="380" y="39" font-size="8" class="mu" text-anchor="middle">  (as x→a)</text>

  <!-- Two-column layout -->
  <!-- Left column: basic arithmetic laws -->
  <!-- Right column: power/root/constant laws -->

  <!-- Left column header -->
  <text x="10" y="60" font-size="9" fill="#6366f1" font-weight="700">Law</text>
  <text x="200" y="60" font-size="9" fill="#059669" font-weight="700">Rule</text>

  <!-- Row 1: Sum -->
  <rect x="10" y="64" width="220" height="18" rx="3" fill="#f1f5f9"/>
  <text x="15" y="77" font-size="9" fill="#6366f1">Sum</text>
  <text x="80" y="77" font-size="9" fill="#0f172a">lim [f + g] = L + M</text>

  <!-- Row 2: Difference -->
  <text x="15" y="97" font-size="9" fill="#6366f1">Difference</text>
  <text x="80" y="97" font-size="9" fill="#0f172a">lim [f − g] = L − M</text>
  <line x1="10" y1="102" x2="230" y2="102" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Row 3: Product -->
  <rect x="10" y="104" width="220" height="18" rx="3" fill="#f1f5f9"/>
  <text x="15" y="117" font-size="9" fill="#6366f1">Product</text>
  <text x="80" y="117" font-size="9" fill="#0f172a">lim [f · g] = L · M</text>

  <!-- Row 4: Quotient -->
  <text x="15" y="137" font-size="9" fill="#6366f1">Quotient</text>
  <text x="80" y="137" font-size="9" fill="#0f172a">lim [f / g] = L / M  (M ≠ 0)</text>
  <line x1="10" y1="142" x2="230" y2="142" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Row 5: Constant multiple -->
  <rect x="10" y="144" width="220" height="18" rx="3" fill="#f1f5f9"/>
  <text x="15" y="157" font-size="9" fill="#6366f1">Const ×</text>
  <text x="80" y="157" font-size="9" fill="#0f172a">lim [c·f] = c · L</text>

  <!-- Row 6: Power -->
  <text x="15" y="177" font-size="9" fill="#6366f1">Power</text>
  <text x="80" y="177" font-size="9" fill="#0f172a">lim [fⁿ] = Lⁿ</text>
  <line x1="10" y1="182" x2="230" y2="182" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Row 7: Root -->
  <rect x="10" y="184" width="220" height="18" rx="3" fill="#f1f5f9"/>
  <text x="15" y="197" font-size="9" fill="#6366f1">Root</text>
  <text x="80" y="197" font-size="9" fill="#0f172a">lim [ⁿ√f] = ⁿ√L  (if defined)</text>

  <!-- DIVIDER -->
  <line x1="244" y1="44" x2="244" y2="210" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Right side: What this enables + key examples -->
  <text x="362" y="60" font-size="9" fill="#4338ca" text-anchor="middle" font-weight="700">Why It Matters</text>

  <!-- Box: Direct substitution theorem -->
  <rect x="252" y="66" width="220" height="48" rx="5" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1"/>
  <text x="362" y="82" font-size="9" fill="#059669" text-anchor="middle" font-weight="700">Direct Substitution</text>
  <text x="258" y="97" font-size="8.5" fill="#059669">If f is a polynomial or rational function</text>
  <text x="258" y="109" font-size="8.5" fill="#059669">and a is in the domain: lim f(x) = f(a)</text>
  <text x="362" y="97" font-size="0" text-anchor="middle"/>

  <!-- Example 1 -->
  <rect x="252" y="122" width="220" height="36" rx="5" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1"/>
  <text x="362" y="136" font-size="9" fill="#6366f1" text-anchor="middle" font-weight="700">Example: lim (x²+3x) as x→2</text>
  <text x="258" y="151" font-size="9" fill="#4338ca">= lim x² + lim 3x = 4 + 6 = 10</text>

  <!-- Example 2 -->
  <rect x="252" y="166" width="220" height="36" rx="5" fill="#fef9c3" stroke="#fde68a" stroke-width="1"/>
  <text x="362" y="180" font-size="9" fill="#d97706" text-anchor="middle" font-weight="700">Watch for: 0/0 forms</text>
  <text x="258" y="195" font-size="8.5" fill="#92400e">Laws break when M=0 in quotient — factor!</text>
</svg>
