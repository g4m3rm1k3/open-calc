<svg viewBox="0 0 480 240" xmlns="http://www.w3.org/2000/svg" style="font-family: ui-monospace, monospace; border-radius: 12px;">
  <style>
    .bg  { fill: rgb(var(--tw-custom-slate-50)); }
    .ax  { stroke: rgb(var(--tw-custom-slate-400)); }
    .axf { fill: rgb(var(--tw-custom-slate-400)); }
    .mu  { fill: rgb(var(--tw-custom-slate-500)); }
    .dark .bg  { fill: rgb(var(--tw-custom-slate-900)); }
    .dark .ax  { stroke: rgb(var(--tw-custom-slate-600)); }
    .dark .axf { fill: rgb(var(--tw-custom-slate-600)); }
    .dark .mu  { fill: rgb(var(--tw-custom-slate-400)); }
  </style>
  <rect width="480" height="240" rx="12" class="bg"/>

  <!-- Divider -->
  <line x1="240" y1="10" x2="240" y2="220" stroke="#e2e8f0" stroke-width="1"/>

  <!-- ===== LEFT PANEL: FTC Part 1 ===== -->
  <text x="115" y="22" font-size="10" fill="#4338ca" text-anchor="middle" font-weight="700">FTC Part 1</text>
  <text x="115" y="35" font-size="9" fill="#6366f1" text-anchor="middle">d/dx ∫ₐˣ f(t) dt = f(x)</text>

  <!-- Axes left -->
  <line x1="28" y1="185" x2="228" y2="185" class="ax" stroke-width="1.5"/>
  <line x1="28" y1="30"  x2="28"  y2="188" class="ax" stroke-width="1.5"/>

  <!-- Curve f(t) on left -->
  <path d="M 28,185 C 60,185 80,100 110,90 C 140,80 160,120 200,115 C 215,113 228,130 228,185"
        fill="#6366f1" fill-opacity="0.12" stroke="#6366f1" stroke-width="2"/>

  <!-- Shaded area from a to x -->
  <path d="M 50,185 C 60,185 80,100 110,90 C 130,83 145,105 162,108 L 162,185 Z"
        fill="#6366f1" opacity="0.25"/>

  <!-- a, x markers -->
  <line x1="50"  y1="185" x2="50"  y2="192" class="ax" stroke-width="1"/>
  <line x1="162" y1="185" x2="162" y2="192" class="ax" stroke-width="1"/>
  <text x="50"   y="200" font-size="10" fill="#6366f1" text-anchor="middle">a</text>
  <text x="162"  y="200" font-size="10" fill="#6366f1" text-anchor="middle">x</text>

  <!-- F(x) label on area -->
  <text x="108" y="155" font-size="11" fill="#6366f1" text-anchor="middle" font-weight="700">A(x)</text>
  <text x="108" y="168" font-size="8"  fill="#6366f1" text-anchor="middle">= ∫ₐˣ f(t) dt</text>

  <!-- f(x) label on curve -->
  <text x="196" y="108" font-size="9" fill="#6366f1">f(t)</text>

  <!-- Key insight left -->
  <text x="115" y="214" font-size="8.5" fill="#4338ca" text-anchor="middle">Rate of change of area = height of curve</text>

  <!-- ===== RIGHT PANEL: FTC Part 2 ===== -->
  <text x="360" y="22" font-size="10" fill="#059669" text-anchor="middle" font-weight="700">FTC Part 2</text>
  <text x="360" y="35" font-size="9" fill="#10b981" text-anchor="middle">∫ₐᵇ f(x) dx = F(b) − F(a)</text>

  <!-- Axes right -->
  <line x1="256" y1="185" x2="468" y2="185" class="ax" stroke-width="1.5"/>
  <line x1="256" y1="30"  x2="256" y2="188" class="ax" stroke-width="1.5"/>

  <!-- Curve f(x) on right -->
  <path d="M 256,185 C 275,185 290,80 320,70 C 350,60 370,90 400,85 C 430,80 455,140 468,185"
        fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-width="2"/>

  <!-- Shaded area a to b -->
  <path d="M 280,185 C 290,185 290,80 320,70 C 350,60 370,90 400,85 L 420,185 Z"
        fill="#10b981" opacity="0.25"/>

  <!-- a, b markers -->
  <line x1="280" y1="185" x2="280" y2="192" class="ax" stroke-width="1"/>
  <line x1="420" y1="185" x2="420" y2="192" class="ax" stroke-width="1"/>
  <text x="280"  y="200" font-size="10" fill="#10b981" text-anchor="middle">a</text>
  <text x="420"  y="200" font-size="10" fill="#10b981" text-anchor="middle">b</text>

  <!-- F(b)-F(a) on y-axis -->
  <!-- F(a) at y≈160, F(b) at y≈75 -->
  <line x1="248" y1="160" x2="264" y2="160" stroke="#10b981" stroke-width="1.5"/>
  <line x1="248" y1="75"  x2="264" y2="75"  stroke="#10b981" stroke-width="1.5"/>
  <line x1="253" y1="75"  x2="253" y2="160" stroke="#10b981" stroke-width="2"/>
  <text x="236" y="164" font-size="9" fill="#10b981" text-anchor="end">F(a)</text>
  <text x="236" y="79"  font-size="9" fill="#10b981" text-anchor="end">F(b)</text>
  <text x="236" y="120" font-size="10" fill="#10b981" text-anchor="end" font-weight="700">F(b)−F(a)</text>

  <!-- Area label -->
  <text x="350" y="148" font-size="11" fill="#10b981" text-anchor="middle" font-weight="700">area</text>
  <text x="350" y="162" font-size="8"  fill="#10b981" text-anchor="middle">= F(b) − F(a)</text>

  <text x="360" y="214" font-size="8.5" fill="#059669" text-anchor="middle">Just evaluate the antiderivative at endpoints and subtract</text>

  <text x="240" y="232" font-size="9" class="mu" text-anchor="middle">FTC links differentiation and integration — they are inverse operations</text>
</svg>
