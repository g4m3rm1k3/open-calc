<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" style="font-family: ui-monospace, monospace; border-radius: 12px;">
  <style>.bg{fill:rgb(var(--tw-custom-slate-50))}.dark .bg{fill:rgb(var(--tw-custom-slate-900))}</style>
  <rect width="480" height="200" rx="12" class="bg"/>
  <text x="240" y="16" font-size="11" fill="#4338ca" text-anchor="middle" font-weight="700">Partial Fractions — Solving for A and B</text>
  <!-- Steps -->
  <rect x="8" y="24" width="464" height="22" rx="4" fill="#dbeafe"/>
  <text x="240" y="39" font-size="8.5" fill="#1d4ed8" text-anchor="middle">Step 1 — Set up: (3x+5)/((x+1)(x+2)) = A/(x+1) + B/(x+2)</text>
  <rect x="8" y="50" width="464" height="22" rx="4" fill="#dcfce7"/>
  <text x="240" y="65" font-size="8.5" fill="#166534" text-anchor="middle">Step 2 — Multiply both sides by (x+1)(x+2): 3x+5 = A(x+2) + B(x+1)</text>
  <rect x="8" y="76" width="464" height="40" rx="4" fill="#fef3c7"/>
  <text x="240" y="91" font-size="8.5" fill="#92400e" text-anchor="middle">Step 3 — Plug in convenient x values (zeros of denominators):</text>
  <text x="240" y="107" font-size="8.5" fill="#374151" text-anchor="middle">x = −1: 3(−1)+5 = A(1)+B(0)  →  2 = A  →  A = 2</text>
  <rect x="8" y="120" width="464" height="22" rx="4" fill="#fce7f3"/>
  <text x="240" y="135" font-size="8.5" fill="#be185d" text-anchor="middle">x = −2: 3(−2)+5 = A(0)+B(−1)  →  −1 = −B  →  B = 1</text>
  <rect x="8" y="146" width="464" height="22" rx="4" fill="#ede9fe"/>
  <text x="240" y="161" font-size="8.5" fill="#5b21b6" text-anchor="middle" font-weight="700">Answer: (3x+5)/((x+1)(x+2)) = 2/(x+1) + 1/(x+2)</text>
  <rect x="8" y="172" width="464" height="24" rx="4" fill="#f8fafc"/>
  <text x="240" y="188" font-size="8" fill="#374151" text-anchor="middle">Verify: 2(x+2)/(x+1)(x+2) + 1(x+1)/(x+1)(x+2) = (2x+4+x+1)/denom = (3x+5)/denom ✓</text>
</svg>
