<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" style="font-family: ui-monospace, monospace; border-radius: 12px;">
  <style>
    .bg  { fill: rgb(var(--tw-custom-slate-50)); }
    .mu  { fill: rgb(var(--tw-custom-slate-500)); }
    .tx  { fill: rgb(var(--tw-custom-slate-900)); }
    .dark .bg  { fill: rgb(var(--tw-custom-slate-900)); }
    .dark .mu  { fill: rgb(var(--tw-custom-slate-400)); }
    .dark .tx  { fill: rgb(var(--tw-custom-slate-200)); }
  </style>
  <rect width="480" height="200" rx="12" class="bg"/>
  <text x="240" y="17" font-size="11" fill="#4338ca" text-anchor="middle" font-weight="700">Intermediate Value Theorem — Root Guarantee</text>

  <!-- LEFT: IVT visual -->
  <rect x="10" y="24" width="240" height="168" rx="8" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5"/>
  <text x="130" y="42" font-size="9" fill="#0369a1" text-anchor="middle" font-weight="700">If f is continuous on [a, b]...</text>

  <!-- Axes -->
  <line x1="28" y1="164" x2="240" y2="164" stroke="#94a3b8" stroke-width="1"/>
  <line x1="28" y1="44" x2="28" y2="172" stroke="#94a3b8" stroke-width="1"/>

  <!-- Horizontal zero line -->
  <line x1="28" y1="114" x2="240" y2="114" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="20" y="117" font-size="7.5" fill="#94a3b8" text-anchor="end">0</text>

  <!-- f(a) negative: below zero (y > 114 in SVG) -->
  <line x1="50" y1="164" x2="50" y2="140" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="50" y="180" font-size="8" fill="#0369a1" text-anchor="middle">a</text>
  <circle cx="50" cy="140" r="4" fill="#ef4444"/>
  <text x="38" y="137" font-size="7.5" fill="#ef4444">f(a)&lt;0</text>

  <!-- Curve crosses zero somewhere in (a,b) -->
  <path d="M 50,140 Q 90,150 120,114 Q 150,78 200,60" fill="none" stroke="#0284c7" stroke-width="2.5"/>

  <!-- f(b) positive: above zero (y < 114 in SVG) -->
  <line x1="200" y1="164" x2="200" y2="60" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="200" y="180" font-size="8" fill="#0369a1" text-anchor="middle">b</text>
  <circle cx="200" cy="60" r="4" fill="#10b981"/>
  <text x="214" y="57" font-size="7.5" fill="#10b981">f(b)&gt;0</text>

  <!-- Root c where curve crosses zero -->
  <circle cx="120" cy="114" r="5" fill="#4338ca"/>
  <line x1="120" y1="114" x2="120" y2="164" stroke="#4338ca" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="120" y="180" font-size="8" fill="#4338ca" text-anchor="middle" font-weight="700">c</text>
  <text x="126" y="108" font-size="7.5" fill="#4338ca" font-weight="700">f(c)=0</text>

  <!-- IVT statement -->
  <rect x="18" y="155" width="214" height="0" rx="0" fill="none"/>

  <!-- RIGHT: formal statement -->
  <rect x="258" y="24" width="212" height="168" rx="8" fill="#1e1b4b"/>
  <text x="364" y="44" font-size="9.5" fill="#a5b4fc" text-anchor="middle" font-weight="700">IVT — Formal Statement</text>
  <line x1="266" y1="50" x2="462" y2="50" stroke="#4338ca" stroke-width="1"/>

  <text x="270" y="68" font-size="8" fill="#e2e8f0">If f is continuous on [a, b]</text>
  <text x="270" y="82" font-size="8" fill="#e2e8f0">and N is any number between</text>
  <text x="270" y="96" font-size="8" fill="#e2e8f0">f(a) and f(b), then there</text>
  <text x="270" y="110" font-size="8" fill="#e2e8f0">exists at least one c in (a, b)</text>
  <text x="270" y="124" font-size="8" fill="#e2e8f0">such that f(c) = N.</text>

  <line x1="266" y1="134" x2="462" y2="134" stroke="#4338ca" stroke-width="1"/>

  <text x="270" y="150" font-size="8.5" fill="#a5b4fc" font-weight="700">Root Corollary:</text>
  <text x="270" y="163" font-size="8" fill="#e2e8f0">If f(a) &lt; 0 and f(b) &gt; 0</text>
  <text x="270" y="176" font-size="8" fill="#e2e8f0">(or vice versa), then f has</text>
  <text x="270" y="189" font-size="9" fill="#4ade80" font-weight="700">at least one root in (a, b)</text>
</svg>
