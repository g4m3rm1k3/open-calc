<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" style="font-family: ui-monospace, monospace; border-radius: 12px;">
  <style>.bg{fill:rgb(var(--tw-custom-slate-50))}.dark .bg{fill:rgb(var(--tw-custom-slate-900))}</style>
  <rect width="480" height="200" rx="12" class="bg"/>
  <text x="240" y="16" font-size="11" fill="#4338ca" text-anchor="middle" font-weight="700">Quadratic Inequality — Sign Chart Method</text>
  <!-- Step 1: equation -->
  <rect x="8" y="24" width="464" height="26" rx="4" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="240" y="36" font-size="8.5" fill="#4338ca" text-anchor="middle" font-weight="700">Solve: x² − x − 6 &gt; 0  →  factor: (x−3)(x+2) &gt; 0  →  roots at x=3, x=−2</text>
  <text x="240" y="48" font-size="8" fill="#374151" text-anchor="middle">Step 1: factor &amp; find roots (critical points)</text>
  <!-- Sign chart -->
  <rect x="8" y="56" width="464" height="70" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="240" y="72" font-size="9" fill="#374151" text-anchor="middle" font-weight="700">Sign Chart — test each region</text>
  <!-- Dividers -->
  <line x1="8" y1="78" x2="472" y2="78" stroke="#cbd5e1" stroke-width="1"/>
  <!-- Column headers -->
  <text x="70" y="94" font-size="8" fill="#374151" text-anchor="middle">x &lt; −2</text>
  <text x="240" y="94" font-size="8" fill="#374151" text-anchor="middle">−2 &lt; x &lt; 3</text>
  <text x="400" y="94" font-size="8" fill="#374151" text-anchor="middle">x &gt; 3</text>
  <!-- Vertical lines -->
  <line x1="160" y1="56" x2="160" y2="126" stroke="#94a3b8" stroke-width="1"/>
  <line x1="320" y1="56" x2="320" y2="126" stroke="#94a3b8" stroke-width="1"/>
  <!-- Critical point markers -->
  <text x="160" y="76" font-size="8" fill="#ef4444" text-anchor="middle">−2</text>
  <text x="320" y="76" font-size="8" fill="#ef4444" text-anchor="middle">3</text>
  <!-- Signs -->
  <text x="70" y="116" font-size="12" fill="#166534" text-anchor="middle" font-weight="700">+</text>
  <text x="240" y="116" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="700">−</text>
  <text x="400" y="116" font-size="12" fill="#166534" text-anchor="middle" font-weight="700">+</text>
  <!-- Solution visualization -->
  <rect x="8" y="132" width="464" height="30" rx="4" fill="#f8fafc"/>
  <line x1="30" y1="147" x2="450" y2="147" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="180" y1="147" x2="30" y2="147" stroke="#22c55e" stroke-width="5" stroke-linecap="round"/>
  <line x1="330" y1="147" x2="450" y2="147" stroke="#22c55e" stroke-width="5" stroke-linecap="round"/>
  <circle cx="180" cy="147" r="5" fill="white" stroke="#22c55e" stroke-width="2.5"/>
  <circle cx="330" cy="147" r="5" fill="white" stroke="#22c55e" stroke-width="2.5"/>
  <text x="180" y="158" font-size="8" fill="#374151" text-anchor="middle">−2</text>
  <text x="330" y="158" font-size="8" fill="#374151" text-anchor="middle">3</text>
  <!-- Solution -->
  <rect x="8" y="168" width="464" height="26" rx="4" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="240" y="183" font-size="9" fill="#166534" text-anchor="middle" font-weight="700">Solution: x ∈ (−∞, −2) ∪ (3, ∞) — where parabola is ABOVE x-axis</text>
</svg>
