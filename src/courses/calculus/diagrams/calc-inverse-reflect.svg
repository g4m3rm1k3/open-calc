<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" style="font-family: ui-monospace, monospace; border-radius: 12px;">
  <style>
    .bg { fill: rgb(var(--tw-custom-slate-50)); }
    .dark .bg { fill: rgb(var(--tw-custom-slate-900)); }
  </style>
  <rect width="480" height="200" rx="12" class="bg"/>
  <text x="240" y="16" font-size="11" fill="#4338ca" text-anchor="middle" font-weight="700">Inverse Functions — Derivative via Reflection</text>

  <!-- Graph: f and f⁻¹ reflected over y=x -->
  <rect x="8" y="22" width="250" height="172" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Axes -->
  <line x1="20" y1="182" x2="248" y2="182" stroke="#64748b" stroke-width="1"/>
  <line x1="20" y1="28" x2="20" y2="186" stroke="#64748b" stroke-width="1"/>

  <!-- y=x reflection line -->
  <line x1="20" y1="182" x2="248" y2="28" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="210" y="46" font-size="7.5" fill="#94a3b8">y = x</text>

  <!-- f(x) = eˣ curve (bottom-right area) -->
  <path d="M 20,178 Q 60,168 90,148 Q 130,118 168,72 Q 196,44 240,30" fill="none" stroke="#6366f1" stroke-width="2.5"/>
  <text x="200" y="42" font-size="8" fill="#6366f1" font-weight="700">f(x)=eˣ</text>

  <!-- f⁻¹(x) = ln(x) curve (reflected) -->
  <path d="M 22,182 Q 52,178 92,148 Q 122,118 148,90 Q 172,60 186,28" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="188" y="26" font-size="8" fill="#b45309" font-weight="700">f⁻¹(x)=ln x</text>

  <!-- Reflection point -->
  <circle cx="110" cy="110" r="4" fill="#dc2626"/>
  <text x="114" y="108" font-size="7" fill="#dc2626">(a, b)</text>
  <circle cx="110" cy="110" r="4" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2,2" r="14"/>

  <!-- Reflected point -->
  <line x1="110" y1="110" x2="110" y2="110" stroke="none"/>
  <text x="64" y="100" font-size="7.5" fill="#059669">slope = 1/f ′(b)</text>

  <!-- RIGHT: formula box -->
  <rect x="266" y="22" width="206" height="172" rx="8" fill="#1e1b4b"/>
  <text x="369" y="40" font-size="9" fill="#a5b4fc" text-anchor="middle" font-weight="700">Inverse Derivative Formula</text>
  <line x1="274" y1="46" x2="464" y2="46" stroke="#312e81" stroke-width="1"/>

  <text x="274" y="62" font-size="8" fill="#94a3b8">If y = f(x) and f is invertible:</text>

  <rect x="274" y="66" width="184" height="22" rx="4" fill="#4338ca"/>
  <text x="366" y="81" font-size="10" fill="white" text-anchor="middle" font-weight="700">(f⁻¹)′(b) = 1 / f ′(a)</text>
  <text x="366" y="94" font-size="7.5" fill="#a5b4fc" text-anchor="middle">where f(a) = b</text>

  <line x1="274" y1="100" x2="464" y2="100" stroke="#312e81" stroke-width="1"/>
  <text x="274" y="116" font-size="8" fill="#94a3b8">Why: if f ′(a) = m (slope of f),</text>
  <text x="274" y="130" font-size="8" fill="#94a3b8">then f⁻¹ has slope 1/m there</text>
  <text x="274" y="144" font-size="8" fill="#94a3b8">(reflection flips Δx and Δy)</text>

  <line x1="274" y1="150" x2="464" y2="150" stroke="#312e81" stroke-width="1"/>
  <text x="274" y="166" font-size="8" fill="#94a3b8">Example: d/dx[ln x]</text>
  <text x="274" y="180" font-size="8.5" fill="#4ade80" font-weight="700">= 1 / eˣ|_{x=ln(a)} = 1/a ✓</text>
</svg>
