<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" style="font-family: ui-monospace, monospace; border-radius: 12px;">
  <style>.bg{fill:rgb(var(--tw-custom-slate-50))}.dark .bg{fill:rgb(var(--tw-custom-slate-900))}</style>
  <rect width="480" height="200" rx="12" class="bg"/>
  <text x="240" y="16" font-size="11" fill="#4338ca" text-anchor="middle" font-weight="700">Slope Field — Visualizing y′ = f(x)</text>
  <rect x="8" y="22" width="280" height="172" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="148" y1="28" x2="148" y2="186" stroke="#94a3b8" stroke-width="1"/>
  <line x1="16" y1="107" x2="280" y2="107" stroke="#94a3b8" stroke-width="1"/>
  <!-- Slope field dashes for y′ = x (slope = x coordinate) -->
  <!-- x=-3 col -->
  <line x1="28" y1="55" x2="36" y2="67" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="28" y1="80" x2="36" y2="92" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="28" y1="105" x2="36" y2="117" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="28" y1="130" x2="36" y2="142" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="28" y1="155" x2="36" y2="167" stroke="#94a3b8" stroke-width="1.2"/>
  <!-- x=-2 col -->
  <line x1="62" y1="57" x2="68" y2="65" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="62" y1="82" x2="68" y2="90" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="62" y1="107" x2="68" y2="115" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="62" y1="132" x2="68" y2="140" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="62" y1="157" x2="68" y2="165" stroke="#94a3b8" stroke-width="1.2"/>
  <!-- x=-1 col -->
  <line x1="110" y1="58" x2="114" y2="63" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="110" y1="83" x2="114" y2="88" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="110" y1="105" x2="114" y2="110" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="110" y1="130" x2="114" y2="135" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="110" y1="155" x2="114" y2="160" stroke="#94a3b8" stroke-width="1.2"/>
  <!-- x=0 col: horizontal lines -->
  <line x1="144" y1="57" x2="152" y2="57" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="144" y1="82" x2="152" y2="82" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="144" y1="107" x2="152" y2="107" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="144" y1="132" x2="152" y2="132" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="144" y1="157" x2="152" y2="157" stroke="#94a3b8" stroke-width="1.2"/>
  <!-- x=+1 col -->
  <line x1="182" y1="62" x2="186" y2="57" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="182" y1="87" x2="186" y2="82" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="182" y1="112" x2="186" y2="107" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="182" y1="137" x2="186" y2="132" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="182" y1="162" x2="186" y2="157" stroke="#94a3b8" stroke-width="1.2"/>
  <!-- x=+2 col -->
  <line x1="222" y1="67" x2="228" y2="57" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="222" y1="92" x2="228" y2="82" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="222" y1="117" x2="228" y2="107" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="222" y1="142" x2="228" y2="132" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="222" y1="167" x2="228" y2="157" stroke="#94a3b8" stroke-width="1.2"/>
  <!-- Solution curves (parabolas y=x²/2 + C) -->
  <path d="M 30,180 Q 80,165 148,107 Q 216,49 268,28" fill="none" stroke="#6366f1" stroke-width="2" stroke-dasharray="0"/>
  <path d="M 30,165 Q 80,150 148,92 Q 216,34 260,26" fill="none" stroke="#ef4444" stroke-width="2"/>
  <path d="M 40,185 Q 90,172 148,122 Q 210,68 270,40" fill="none" stroke="#22c55e" stroke-width="2"/>
  <!-- Right panel -->
  <rect x="296" y="26" width="176" height="168" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="384" y="46" font-size="8.5" fill="#4338ca" text-anchor="middle" font-weight="700">Slope Field for y′ = x</text>
  <text x="384" y="64" font-size="8" fill="#4338ca" text-anchor="middle">Each dash shows the slope</text>
  <text x="384" y="78" font-size="8" fill="#4338ca" text-anchor="middle">of the solution at that point</text>
  <line x1="304" y1="88" x2="464" y2="88" stroke="#cbd5e1" stroke-width="1"/>
  <text x="384" y="104" font-size="8" fill="#4338ca" text-anchor="middle">Solutions: y = x²/2 + C</text>
  <text x="384" y="120" font-size="7.5" fill="#6366f1" text-anchor="middle">— blue: C=0</text>
  <text x="384" y="134" font-size="7.5" fill="#ef4444" text-anchor="middle">— red: C=−½</text>
  <text x="384" y="148" font-size="7.5" fill="#22c55e" text-anchor="middle">— green: C=+½</text>
  <rect x="304" y="158" width="160" height="30" rx="4" fill="#dbeafe"/>
  <text x="384" y="172" font-size="8" fill="#1d4ed8" text-anchor="middle">IVP picks exactly one curve</text>
  <text x="384" y="184" font-size="8" fill="#1d4ed8" text-anchor="middle">through a given point</text>
</svg>
