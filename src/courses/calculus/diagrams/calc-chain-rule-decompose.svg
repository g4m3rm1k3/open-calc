<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" style="font-family: ui-monospace, monospace; border-radius: 12px;">
  <style>
    .bg { fill: rgb(var(--tw-custom-slate-50)); }
    .dark .bg { fill: rgb(var(--tw-custom-slate-900)); }
  </style>
  <rect width="480" height="200" rx="12" class="bg"/>
  <text x="240" y="16" font-size="11" fill="#4338ca" text-anchor="middle" font-weight="700">Chain Rule — Decompose Outer and Inner</text>

  <!-- Main formula -->
  <rect x="10" y="22" width="460" height="32" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="240" y="42" font-size="12" fill="#3730a3" text-anchor="middle" font-weight="700">d/dx [f(g(x))]  =  f ′(g(x)) · g′(x)</text>

  <!-- Two examples -->
  <rect x="10" y="62" width="220" height="132" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="120" y="80" font-size="9" fill="#4338ca" text-anchor="middle" font-weight="700">Example 1: sin(x²)</text>

  <text x="20" y="98" font-size="8" fill="#64748b">Identify outer and inner:</text>
  <text x="20" y="114" font-size="8.5" fill="#6366f1">Outer f(u) = sin(u)  → f ′(u) = cos(u)</text>
  <text x="20" y="130" font-size="8.5" fill="#059669">Inner g(x) = x²     → g′(x) = 2x</text>

  <line x1="18" y1="137" x2="222" y2="137" stroke="#e2e8f0" stroke-width="1"/>
  <text x="20" y="153" font-size="8" fill="#64748b">Apply chain rule:</text>
  <text x="20" y="169" font-size="8.5" fill="#dc2626" font-weight="700">= cos(x²) · 2x</text>
  <text x="20" y="185" font-size="7.5" fill="#94a3b8">f ′(g(x))·g′(x) = cos(x²)·2x</text>

  <rect x="250" y="62" width="220" height="132" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="360" y="80" font-size="9" fill="#4338ca" text-anchor="middle" font-weight="700">Example 2: (3x+1)⁵</text>

  <text x="260" y="98" font-size="8" fill="#64748b">Identify outer and inner:</text>
  <text x="260" y="114" font-size="8.5" fill="#6366f1">Outer f(u) = u⁵  → f ′(u) = 5u⁴</text>
  <text x="260" y="130" font-size="8.5" fill="#059669">Inner g(x) = 3x+1 → g′(x) = 3</text>

  <line x1="258" y1="137" x2="462" y2="137" stroke="#e2e8f0" stroke-width="1"/>
  <text x="260" y="153" font-size="8" fill="#64748b">Apply chain rule:</text>
  <text x="260" y="169" font-size="8.5" fill="#dc2626" font-weight="700">= 5(3x+1)⁴ · 3 = 15(3x+1)⁴</text>
  <text x="260" y="185" font-size="7.5" fill="#94a3b8">f ′(g(x))·g′(x) = 5(3x+1)⁴·3</text>
</svg>
