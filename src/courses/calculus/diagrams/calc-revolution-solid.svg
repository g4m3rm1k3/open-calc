<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" style="font-family: ui-monospace, monospace; border-radius: 12px;">
  <style>.bg{fill:rgb(var(--tw-custom-slate-50))}.dark .bg{fill:rgb(var(--tw-custom-slate-900))}</style>
  <rect width="480" height="200" rx="12" class="bg"/>
  <text x="240" y="16" font-size="11" fill="#4338ca" text-anchor="middle" font-weight="700">Rotation — 2D Region → 3D Solid</text>
  <!-- Left: 2D region -->
  <rect x="8" y="24" width="228" height="170" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="122" y="42" font-size="8.5" fill="#4338ca" text-anchor="middle" font-weight="700">2D Region</text>
  <line x1="22" y1="155" x2="228" y2="155" stroke="#64748b" stroke-width="2"/>
  <line x1="22" y1="42" x2="22" y2="158" stroke="#64748b" stroke-width="1"/>
  <!-- Curve and shaded region -->
  <path d="M 40,155 L 40,96 Q 65,74 95,60 Q 120,48 150,46 Q 175,46 195,50 L 195,155 Z" fill="#6366f1" opacity="0.2"/>
  <path d="M 35,140 Q 55,118 80,96 Q 105,74 135,60 Q 160,50 185,48 Q 200,48 215,52" fill="none" stroke="#6366f1" stroke-width="2.5"/>
  <text x="118" y="115" font-size="9" fill="#4338ca" text-anchor="middle">region</text>
  <text x="118" y="130" font-size="8" fill="#4338ca" text-anchor="middle">between f(x)</text>
  <text x="118" y="144" font-size="8" fill="#4338ca" text-anchor="middle">and x-axis</text>
  <!-- Arrow rotation indicator -->
  <text x="242" y="100" font-size="18" fill="#f59e0b" text-anchor="middle">→</text>
  <text x="242" y="116" font-size="8" fill="#b45309" text-anchor="middle">rotate</text>
  <text x="242" y="128" font-size="8" fill="#b45309" text-anchor="middle">360°</text>
  <!-- Right: 3D solid (perspective view) -->
  <rect x="256" y="24" width="216" height="170" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="364" y="42" font-size="8.5" fill="#4338ca" text-anchor="middle" font-weight="700">3D Solid of Revolution</text>
  <!-- Simplified 3D parabolic solid -->
  <ellipse cx="276" cy="100" rx="14" ry="55" fill="#6366f1" opacity="0.15" stroke="#6366f1" stroke-width="1.5"/>
  <ellipse cx="456" cy="100" rx="8" ry="12" fill="#6366f1" opacity="0.25" stroke="#6366f1" stroke-width="1.5"/>
  <!-- Top and bottom silhouette -->
  <path d="M 276,45 Q 330,35 400,55 Q 430,62 456,88" fill="none" stroke="#6366f1" stroke-width="2"/>
  <path d="M 276,155 Q 330,165 400,145 Q 430,138 456,112" fill="none" stroke="#6366f1" stroke-width="2"/>
  <!-- Fill body -->
  <path d="M 276,45 Q 330,35 400,55 Q 430,62 456,88 L 456,112 Q 430,138 400,145 Q 330,165 276,155 Z" fill="#6366f1" opacity="0.1"/>
  <!-- Axis -->
  <line x1="268" y1="100" x2="464" y2="100" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="364" y="185" font-size="8" fill="#4338ca" text-anchor="middle">V = π ∫ₐᵇ [f(x)]² dx</text>
</svg>
