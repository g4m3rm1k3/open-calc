<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" style="font-family: ui-monospace, monospace; border-radius: 12px;">
  <style>.bg{fill:rgb(var(--tw-custom-slate-50))}.dark .bg{fill:rgb(var(--tw-custom-slate-900))}</style>
  <rect width="480" height="200" rx="12" class="bg"/>
  <text x="240" y="16" font-size="11" fill="#4338ca" text-anchor="middle" font-weight="700">Trig Integrals Reference Table</text>
  <rect x="8" y="24" width="228" height="170" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="16" y="32" width="212" height="14" rx="0" fill="#e2e8f0"/>
  <text x="122" y="43" font-size="7.5" fill="#1e293b" text-anchor="middle" font-weight="700">∫ f(x) dx</text>
  <rect x="16" y="46" width="212" height="14" rx="0" fill="#dbeafe"/>
  <text x="122" y="57" font-size="7.5" fill="#1d4ed8" text-anchor="middle">∫ sin x dx = −cos x + C</text>
  <rect x="16" y="60" width="212" height="14" rx="0" fill="#f8fafc"/>
  <text x="122" y="71" font-size="7.5" fill="#374151" text-anchor="middle">∫ cos x dx = sin x + C</text>
  <rect x="16" y="74" width="212" height="14" rx="0" fill="#dbeafe"/>
  <text x="122" y="85" font-size="7.5" fill="#1d4ed8" text-anchor="middle">∫ tan x dx = −ln|cos x| + C</text>
  <rect x="16" y="88" width="212" height="14" rx="0" fill="#f8fafc"/>
  <text x="122" y="99" font-size="7.5" fill="#374151" text-anchor="middle">∫ cot x dx = ln|sin x| + C</text>
  <rect x="16" y="102" width="212" height="14" rx="0" fill="#dbeafe"/>
  <text x="122" y="113" font-size="7.5" fill="#1d4ed8" text-anchor="middle">∫ sec x dx = ln|sec x+tan x| + C</text>
  <rect x="16" y="116" width="212" height="14" rx="0" fill="#f8fafc"/>
  <text x="122" y="127" font-size="7.5" fill="#374151" text-anchor="middle">∫ csc x dx = −ln|csc x+cot x| + C</text>
  <rect x="16" y="130" width="212" height="14" rx="0" fill="#dbeafe"/>
  <text x="122" y="141" font-size="7.5" fill="#1d4ed8" text-anchor="middle">∫ sec²x dx = tan x + C</text>
  <rect x="16" y="144" width="212" height="14" rx="0" fill="#f8fafc"/>
  <text x="122" y="155" font-size="7.5" fill="#374151" text-anchor="middle">∫ csc²x dx = −cot x + C</text>
  <rect x="16" y="158" width="212" height="14" rx="0" fill="#dbeafe"/>
  <text x="122" y="169" font-size="7.5" fill="#1d4ed8" text-anchor="middle">∫ sec x tan x dx = sec x + C</text>
  <rect x="16" y="172" width="212" height="16" rx="0" fill="#f8fafc"/>
  <text x="122" y="183" font-size="7.5" fill="#374151" text-anchor="middle">∫ csc x cot x dx = −csc x + C</text>
  <!-- Right panel: sin²x example -->
  <rect x="244" y="24" width="228" height="170" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="358" y="44" font-size="8.5" fill="#4338ca" text-anchor="middle" font-weight="700">Example: ∫ sin²x dx</text>
  <rect x="252" y="50" width="212" height="22" rx="4" fill="#dbeafe"/>
  <text x="358" y="65" font-size="8" fill="#1d4ed8" text-anchor="middle">sin²x = (1 − cos 2x)/2</text>
  <rect x="252" y="76" width="212" height="22" rx="4" fill="#dcfce7"/>
  <text x="358" y="91" font-size="8" fill="#166534" text-anchor="middle">= ½∫(1 − cos 2x) dx</text>
  <rect x="252" y="102" width="212" height="22" rx="4" fill="#fef3c7"/>
  <text x="358" y="117" font-size="8" fill="#92400e" text-anchor="middle">= ½[x − sin(2x)/2] + C</text>
  <rect x="252" y="128" width="212" height="22" rx="4" fill="#ede9fe"/>
  <text x="358" y="143" font-size="9" fill="#5b21b6" text-anchor="middle" font-weight="700">= x/2 − sin(2x)/4 + C</text>
  <text x="358" y="172" font-size="7.5" fill="#4338ca" text-anchor="middle">Half-angle identity = key tool</text>
  <text x="358" y="185" font-size="7.5" fill="#4338ca" text-anchor="middle">for even trig powers</text>
</svg>
