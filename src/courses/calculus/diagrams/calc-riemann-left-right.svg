<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" style="font-family: ui-monospace, monospace; border-radius: 12px;">
  <style>.bg{fill:rgb(var(--tw-custom-slate-50))}.dark .bg{fill:rgb(var(--tw-custom-slate-900))}</style>
  <rect width="480" height="200" rx="12" class="bg"/>
  <text x="240" y="16" font-size="11" fill="#4338ca" text-anchor="middle" font-weight="700">Riemann Sums — Left vs Right Endpoints</text>
  <!-- LEFT panel -->
  <rect x="8" y="24" width="228" height="170" rx="8" fill="#f8fafc" stroke="#3b82f6" stroke-width="2"/>
  <text x="122" y="42" font-size="8.5" fill="#1d4ed8" text-anchor="middle" font-weight="700">LEFT Endpoint Sum (Lₙ)</text>
  <line x1="20" y1="162" x2="228" y2="162" stroke="#64748b" stroke-width="1"/>
  <line x1="20" y1="42" x2="20" y2="166" stroke="#64748b" stroke-width="1"/>
  <!-- Left rectangles under curve -->
  <rect x="32" y="125" width="38" height="37" fill="#3b82f6" opacity="0.3" stroke="#3b82f6" stroke-width="1"/>
  <rect x="70" y="103" width="38" height="59" fill="#3b82f6" opacity="0.3" stroke="#3b82f6" stroke-width="1"/>
  <rect x="108" y="85" width="38" height="77" fill="#3b82f6" opacity="0.3" stroke="#3b82f6" stroke-width="1"/>
  <rect x="146" y="72" width="38" height="90" fill="#3b82f6" opacity="0.3" stroke="#3b82f6" stroke-width="1"/>
  <rect x="184" y="62" width="38" height="100" fill="#3b82f6" opacity="0.3" stroke="#3b82f6" stroke-width="1"/>
  <!-- Curve -->
  <path d="M 30,140 Q 55,115 80,95 Q 110,74 140,60 Q 165,50 195,44 Q 212,40 225,38" fill="none" stroke="#6366f1" stroke-width="2.5"/>
  <text x="122" y="178" font-size="7.5" fill="#1d4ed8" text-anchor="middle">height = f(left edge)</text>
  <text x="122" y="188" font-size="7.5" fill="#1d4ed8" text-anchor="middle">overestimates decreasing f</text>

  <!-- RIGHT panel -->
  <rect x="244" y="24" width="228" height="170" rx="8" fill="#f8fafc" stroke="#ef4444" stroke-width="2"/>
  <text x="358" y="42" font-size="8.5" fill="#991b1b" text-anchor="middle" font-weight="700">RIGHT Endpoint Sum (Rₙ)</text>
  <line x1="256" y1="162" x2="464" y2="162" stroke="#64748b" stroke-width="1"/>
  <line x1="256" y1="42" x2="256" y2="166" stroke="#64748b" stroke-width="1"/>
  <!-- Right rectangles under curve -->
  <rect x="268" y="103" width="38" height="59" fill="#ef4444" opacity="0.3" stroke="#ef4444" stroke-width="1"/>
  <rect x="306" y="85" width="38" height="77" fill="#ef4444" opacity="0.3" stroke="#ef4444" stroke-width="1"/>
  <rect x="344" y="72" width="38" height="90" fill="#ef4444" opacity="0.3" stroke="#ef4444" stroke-width="1"/>
  <rect x="382" y="62" width="38" height="100" fill="#ef4444" opacity="0.3" stroke="#ef4444" stroke-width="1"/>
  <rect x="420" y="55" width="38" height="107" fill="#ef4444" opacity="0.3" stroke="#ef4444" stroke-width="1"/>
  <!-- Curve -->
  <path d="M 266,140 Q 291,115 316,95 Q 346,74 376,60 Q 401,50 431,44 Q 448,40 461,38" fill="none" stroke="#6366f1" stroke-width="2.5"/>
  <text x="358" y="178" font-size="7.5" fill="#991b1b" text-anchor="middle">height = f(right edge)</text>
  <text x="358" y="188" font-size="7.5" fill="#991b1b" text-anchor="middle">underestimates decreasing f</text>
</svg>
