<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" style="font-family: ui-monospace, monospace; border-radius: 12px;">
  <style>.bg{fill:rgb(var(--tw-custom-slate-50))}.dark .bg{fill:rgb(var(--tw-custom-slate-900))}</style>
  <rect width="480" height="200" rx="12" class="bg"/>
  <text x="240" y="16" font-size="11" fill="#4338ca" text-anchor="middle" font-weight="700">FTC Part 2 — Evaluation Theorem</text>
  <!-- Formula box -->
  <rect x="8" y="24" width="464" height="60" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="240" y="48" font-size="11" fill="#4338ca" text-anchor="middle" font-weight="700">∫ₐᵇ f(x) dx = F(b) − F(a)</text>
  <text x="240" y="68" font-size="8.5" fill="#6366f1" text-anchor="middle">where F is any antiderivative of f  (F′ = f)</text>
  <!-- Step panels -->
  <rect x="8" y="92" width="140" height="102" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="78" y="110" font-size="8" fill="#1d4ed8" text-anchor="middle" font-weight="700">STEP 1</text>
  <text x="78" y="126" font-size="7.5" fill="#1e40af" text-anchor="middle">Find an antiderivative</text>
  <text x="78" y="140" font-size="7.5" fill="#1e40af" text-anchor="middle">F(x) of f(x)</text>
  <text x="78" y="160" font-size="7.5" fill="#3b82f6" text-anchor="middle">Example: f(x)=2x</text>
  <text x="78" y="174" font-size="7.5" fill="#3b82f6" text-anchor="middle">F(x) = x²</text>
  <text x="78" y="186" font-size="7" fill="#1e40af" text-anchor="middle">(skip +C — cancels out)</text>

  <rect x="156" y="92" width="140" height="102" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="226" y="110" font-size="8" fill="#166534" text-anchor="middle" font-weight="700">STEP 2</text>
  <text x="226" y="126" font-size="7.5" fill="#15803d" text-anchor="middle">Evaluate F at both</text>
  <text x="226" y="140" font-size="7.5" fill="#15803d" text-anchor="middle">limits: F(b) and F(a)</text>
  <text x="226" y="160" font-size="7.5" fill="#22c55e" text-anchor="middle">∫₀³ 2x dx:</text>
  <text x="226" y="174" font-size="7.5" fill="#22c55e" text-anchor="middle">F(3)=9, F(0)=0</text>
  <text x="226" y="186" font-size="7" fill="#166534" text-anchor="middle">using F(x) = x²</text>

  <rect x="304" y="92" width="168" height="102" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="388" y="110" font-size="8" fill="#92400e" text-anchor="middle" font-weight="700">STEP 3</text>
  <text x="388" y="126" font-size="7.5" fill="#78350f" text-anchor="middle">Subtract: F(b) − F(a)</text>
  <text x="388" y="140" font-size="7.5" fill="#78350f" text-anchor="middle">Write as F(x)]ₐᵇ</text>
  <text x="388" y="160" font-size="7.5" fill="#f59e0b" text-anchor="middle">= x²]₀³</text>
  <text x="388" y="174" font-size="9" fill="#92400e" text-anchor="middle" font-weight="700">= 9 − 0 = 9</text>
  <text x="388" y="186" font-size="7" fill="#78350f" text-anchor="middle">area under 2x from 0 to 3</text>
</svg>
