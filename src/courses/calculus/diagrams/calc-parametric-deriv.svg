<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" style="font-family: ui-monospace, monospace; border-radius: 12px;">
  <style>.bg{fill:rgb(var(--tw-custom-slate-50))}.dark .bg{fill:rgb(var(--tw-custom-slate-900))}</style>
  <rect width="480" height="200" rx="12" class="bg"/>
  <text x="240" y="16" font-size="11" fill="#4338ca" text-anchor="middle" font-weight="700">Parametric Derivatives</text>
  <rect x="8" y="24" width="464" height="36" rx="6" fill="#dbeafe" stroke="#6366f1" stroke-width="1.5"/>
  <text x="240" y="40" font-size="9" fill="#1d4ed8" text-anchor="middle" font-weight="700">dy/dx = (dy/dt) / (dx/dt)  and  d²y/dx² = (d/dt[dy/dx]) / (dx/dt)</text>
  <text x="240" y="56" font-size="8" fill="#374151" text-anchor="middle">Chain rule: dy/dx = (dy/dt)·(dt/dx) — the parameter t cancels</text>
  <!-- Left: curve with tangent -->
  <rect x="8" y="68" width="230" height="126" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="20" y1="160" x2="228" y2="160" stroke="#94a3b8" stroke-width="1"/>
  <line x1="20" y1="80" x2="20" y2="164" stroke="#94a3b8" stroke-width="1"/>
  <!-- Ellipse parametric curve -->
  <ellipse cx="124" cy="130" rx="80" ry="44" fill="none" stroke="#6366f1" stroke-width="2"/>
  <!-- Point on curve -->
  <circle cx="164" cy="90" r="5" fill="#ef4444"/>
  <!-- Tangent at point -->
  <line x1="130" y1="108" x2="200" y2="72" stroke="#ef4444" stroke-width="2"/>
  <text x="205" y="80" font-size="7.5" fill="#ef4444">slope = dy/dx</text>
  <!-- Labels -->
  <text x="124" y="156" font-size="7.5" fill="#6366f1" text-anchor="middle">x=a cos t, y=b sin t</text>
  <text x="124" y="170" font-size="7.5" fill="#374151" text-anchor="middle">dx/dt=−a sin t, dy/dt=b cos t</text>
  <text x="124" y="184" font-size="7.5" fill="#374151" text-anchor="middle">dy/dx = −(b/a) cot t</text>
  <!-- Right panel: second derivative -->
  <rect x="246" y="68" width="226" height="126" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="359" y="86" font-size="8.5" fill="#4338ca" text-anchor="middle" font-weight="700">Concavity via d²y/dx²</text>
  <rect x="254" y="92" width="210" height="22" rx="3" fill="#dbeafe"/>
  <text x="359" y="104" font-size="8" fill="#1d4ed8" text-anchor="middle">d²y/dx² = (d/dt[dy/dx]) / (dx/dt)</text>
  <text x="359" y="120" font-size="8" fill="#374151" text-anchor="middle">d²y/dx² &gt; 0 → concave up</text>
  <text x="359" y="134" font-size="8" fill="#374151" text-anchor="middle">d²y/dx² &lt; 0 → concave down</text>
  <rect x="254" y="142" width="210" height="46" rx="3" fill="#dcfce7"/>
  <text x="359" y="158" font-size="8" fill="#166534" text-anchor="middle">Horizontal tangent: dy/dt = 0</text>
  <text x="359" y="172" font-size="8" fill="#166534" text-anchor="middle">Vertical tangent: dx/dt = 0</text>
  <text x="359" y="186" font-size="7.5" fill="#374151" text-anchor="middle">(Check both simultaneously for cusps)</text>
</svg>
