<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" style="font-family: ui-monospace, monospace; border-radius: 12px;">
  <style>.bg{fill:rgb(var(--tw-custom-slate-50))}.dark .bg{fill:rgb(var(--tw-custom-slate-900))}</style>
  <rect width="480" height="200" rx="12" class="bg"/>
  <text x="240" y="16" font-size="11" fill="#4338ca" text-anchor="middle" font-weight="700">Absolute Value — Graph &amp; Definition</text>
  <!-- Left: graph panel -->
  <rect x="8" y="24" width="220" height="170" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <!-- Axes -->
  <line x1="118" y1="30" x2="118" y2="188" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="14" y1="145" x2="222" y2="145" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="220" y="148" font-size="8" fill="#94a3b8">x</text>
  <text x="122" y="35" font-size="8" fill="#94a3b8">y</text>
  <!-- y = |x|: V shape -->
  <polyline points="14,188 118,145 222,188" fill="none" stroke="#6366f1" stroke-width="2.5"/>
  <!-- vertex dot -->
  <circle cx="118" cy="145" r="5" fill="#ef4444"/>
  <text x="126" y="143" font-size="8" fill="#ef4444">corner (not differentiable)</text>
  <!-- Slope labels -->
  <text x="50" y="165" font-size="8" fill="#166534">slope = −1</text>
  <text x="155" y="165" font-size="8" fill="#166534">slope = +1</text>
  <!-- x labels -->
  <text x="63" y="155" font-size="8" fill="#374151">−3</text>
  <text x="170" y="155" font-size="8" fill="#374151">3</text>
  <text x="118" y="158" font-size="8" fill="#374151" text-anchor="middle">0</text>
  <text x="118" y="192" font-size="8" fill="#4338ca" text-anchor="middle">y = |x|</text>
  <!-- Right: definition panel -->
  <rect x="236" y="24" width="236" height="170" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="354" y="42" font-size="9" fill="#4338ca" text-anchor="middle" font-weight="700">Piecewise Definition</text>
  <rect x="244" y="50" width="220" height="50" rx="4" fill="#dbeafe"/>
  <text x="354" y="66" font-size="9" fill="#374151" text-anchor="middle">|x| = x    if x ≥ 0</text>
  <text x="354" y="84" font-size="9" fill="#374151" text-anchor="middle">|x| = −x   if x &lt; 0</text>
  <text x="354" y="118" font-size="8.5" fill="#374151" text-anchor="middle">|distance| from origin on number line</text>
  <text x="354" y="136" font-size="8.5" fill="#374151" text-anchor="middle">Always non-negative: |x| ≥ 0</text>
  <rect x="244" y="148" width="220" height="40" rx="4" fill="#fef3c7"/>
  <text x="354" y="164" font-size="8.5" fill="#92400e" text-anchor="middle" font-weight="700">Triangle inequality:</text>
  <text x="354" y="180" font-size="8.5" fill="#92400e" text-anchor="middle">|a + b| ≤ |a| + |b|</text>
</svg>
