<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" style="font-family: ui-monospace, monospace; border-radius: 12px;">
  <style>
    .bg  { fill: rgb(var(--tw-custom-slate-50)); }
    .mu  { fill: rgb(var(--tw-custom-slate-500)); }
    .tx  { fill: rgb(var(--tw-custom-slate-900)); }
    .dark .bg  { fill: rgb(var(--tw-custom-slate-900)); }
    .dark .mu  { fill: rgb(var(--tw-custom-slate-400)); }
    .dark .tx  { fill: rgb(var(--tw-custom-slate-200)); }
  </style>
  <rect width="480" height="200" rx="12" class="bg"/>

  <text x="240" y="17" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="700">(a+b)² ≠ a²+b²  —  The #1 Algebra Error</text>

  <!-- LEFT: WRONG -->
  <rect x="10" y="26" width="138" height="166" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="79" y="46" font-size="10" fill="#dc2626" text-anchor="middle" font-weight="800">✗ WRONG</text>

  <!-- Simple two squares -->
  <rect x="24" y="54" width="52" height="52" rx="3" fill="#fca5a5"/>
  <text x="50" y="85" font-size="13" fill="#991b1b" text-anchor="middle" font-weight="700">a²</text>

  <rect x="86" y="54" width="52" height="52" rx="3" fill="#fdba74"/>
  <text x="112" y="85" font-size="13" fill="#92400e" text-anchor="middle" font-weight="700">b²</text>

  <text x="79" y="124" font-size="18" fill="#dc2626" text-anchor="middle" font-weight="800">+</text>
  <text x="79" y="148" font-size="10" fill="#dc2626" text-anchor="middle" font-weight="700">a² + b²</text>
  <text x="79" y="164" font-size="8.5" fill="#dc2626" text-anchor="middle">Missing the 2ab term!</text>
  <rect x="20" y="168" width="118" height="18" rx="4" fill="#fca5a5"/>
  <text x="79" y="181" font-size="9" fill="#7f1d1d" text-anchor="middle" font-weight="700">(a+b)² ≠ a² + b²</text>

  <!-- CENTER DIVIDER -->
  <text x="163" y="110" font-size="22" fill="#94a3b8" text-anchor="middle">→</text>

  <!-- RIGHT: CORRECT — square diagram -->
  <rect x="182" y="26" width="290" height="166" rx="8" fill="#f0fdf4" stroke="#10b981" stroke-width="2"/>
  <text x="327" y="46" font-size="10" fill="#059669" text-anchor="middle" font-weight="800">✓ CORRECT — Area Model</text>

  <!-- Big square (a+b) × (a+b) -->
  <!-- Outer square: x=198 to 432, y=56 to 176 (W=234, H=120) -->
  <!-- Split at a-proportion: x=198+160=358, y=56+80=136 (a≈68%, b≈32%) -->

  <!-- Top-left: a² -->
  <rect x="198" y="56" width="152" height="88" rx="0" fill="#86efac"/>
  <text x="274" y="106" font-size="14" fill="#166534" text-anchor="middle" font-weight="700">a²</text>

  <!-- Top-right: ab -->
  <rect x="350" y="56" width="76" height="88" rx="0" fill="#fde68a"/>
  <text x="388" y="106" font-size="11" fill="#78350f" text-anchor="middle" font-weight="700">ab</text>

  <!-- Bottom-left: ab -->
  <rect x="198" y="144" width="152" height="38" rx="0" fill="#fde68a"/>
  <text x="274" y="167" font-size="11" fill="#78350f" text-anchor="middle" font-weight="700">ab</text>

  <!-- Bottom-right: b² -->
  <rect x="350" y="144" width="76" height="38" rx="0" fill="#fca5a5"/>
  <text x="388" y="167" font-size="10" fill="#991b1b" text-anchor="middle" font-weight="700">b²</text>

  <!-- Outer border -->
  <rect x="198" y="56" width="228" height="126" fill="none" stroke="#059669" stroke-width="2"/>
  <!-- Inner dividing lines -->
  <line x1="350" y1="56" x2="350" y2="182" stroke="#059669" stroke-width="1.5"/>
  <line x1="198" y1="144" x2="426" y2="144" stroke="#059669" stroke-width="1.5"/>

  <!-- Labels on edges -->
  <text x="274" y="52" font-size="8.5" fill="#166534" text-anchor="middle">a</text>
  <text x="388" y="52" font-size="8.5" fill="#78350f" text-anchor="middle">b</text>
  <text x="192" y="103" font-size="8.5" fill="#166534" text-anchor="end">a</text>
  <text x="192" y="165" font-size="8.5" fill="#78350f" text-anchor="end">b</text>

  <!-- Formula -->
  <rect x="190" y="150" width="236" height="0" rx="0" fill="none"/>
  <text x="327" y="192" font-size="10" fill="#059669" text-anchor="middle" font-weight="700">(a+b)² = a² + 2ab + b²</text>
</svg>
