<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" style="font-family: ui-monospace, monospace; border-radius: 12px;">
  <style>.bg{fill:rgb(var(--tw-custom-slate-50))}.dark .bg{fill:rgb(var(--tw-custom-slate-900))}</style>
  <rect width="480" height="200" rx="12" class="bg"/>
  <text x="240" y="16" font-size="11" fill="#4338ca" text-anchor="middle" font-weight="700">Problem-Solving Strategy — Universal Playbook</text>
  <!-- Steps flow -->
  <!-- Step 1 -->
  <rect x="8" y="24" width="95" height="54" rx="6" fill="#6366f1"/>
  <text x="55" y="44" font-size="8" fill="white" text-anchor="middle" font-weight="700">1. Read</text>
  <text x="55" y="56" font-size="7.5" fill="#c7d2fe" text-anchor="middle">What type of</text>
  <text x="55" y="66" font-size="7.5" fill="#c7d2fe" text-anchor="middle">problem is this?</text>
  <text x="55" y="76" font-size="7.5" fill="#c7d2fe" text-anchor="middle">Label knowns.</text>
  <!-- Arrow -->
  <polygon points="107,48 117,53 107,58" fill="#6366f1"/>
  <!-- Step 2 -->
  <rect x="118" y="24" width="95" height="54" rx="6" fill="#22c55e"/>
  <text x="165" y="44" font-size="8" fill="white" text-anchor="middle" font-weight="700">2. Plan</text>
  <text x="165" y="56" font-size="7.5" fill="white" text-anchor="middle">Which formula</text>
  <text x="165" y="66" font-size="7.5" fill="white" text-anchor="middle">or technique</text>
  <text x="165" y="76" font-size="7.5" fill="white" text-anchor="middle">applies here?</text>
  <!-- Arrow -->
  <polygon points="217,48 227,53 217,58" fill="#22c55e"/>
  <!-- Step 3 -->
  <rect x="228" y="24" width="95" height="54" rx="6" fill="#f59e0b"/>
  <text x="275" y="44" font-size="8" fill="white" text-anchor="middle" font-weight="700">3. Execute</text>
  <text x="275" y="56" font-size="7.5" fill="white" text-anchor="middle">Algebra first,</text>
  <text x="275" y="66" font-size="7.5" fill="white" text-anchor="middle">calculus second.</text>
  <text x="275" y="76" font-size="7.5" fill="white" text-anchor="middle">Show each step.</text>
  <!-- Arrow -->
  <polygon points="327,48 337,53 327,58" fill="#f59e0b"/>
  <!-- Step 4 -->
  <rect x="338" y="24" width="134" height="54" rx="6" fill="#ec4899"/>
  <text x="405" y="44" font-size="8" fill="white" text-anchor="middle" font-weight="700">4. Check</text>
  <text x="405" y="56" font-size="7.5" fill="white" text-anchor="middle">Units OK? Plug back in?</text>
  <text x="405" y="66" font-size="7.5" fill="white" text-anchor="middle">Does the sign make sense?</text>
  <text x="405" y="76" font-size="7.5" fill="white" text-anchor="middle">Is the domain respected?</text>
  <!-- Bottom panels -->
  <rect x="8" y="84" width="220" height="108" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="118" y="100" font-size="8.5" fill="#4338ca" text-anchor="middle" font-weight="700">Key Algebra Moves Before Calculus</text>
  <text x="118" y="116" font-size="8" fill="#374151" text-anchor="middle">Factor — simplify before differentiating</text>
  <text x="118" y="130" font-size="8" fill="#374151" text-anchor="middle">Rewrite roots as fractional exponents</text>
  <text x="118" y="144" font-size="8" fill="#374151" text-anchor="middle">√x = x^(1/2), ∛x = x^(1/3)</text>
  <text x="118" y="158" font-size="8" fill="#374151" text-anchor="middle">Split fractions: (x²+3)/x = x + 3/x</text>
  <text x="118" y="172" font-size="8" fill="#374151" text-anchor="middle">Expand before differentiating if needed</text>
  <text x="118" y="186" font-size="8" fill="#374151" text-anchor="middle">(x+1)³ → expand, then apply power rule</text>
  <rect x="236" y="84" width="236" height="108" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="354" y="100" font-size="8.5" fill="#166534" text-anchor="middle" font-weight="700">Common Calculus Problem Types</text>
  <text x="354" y="116" font-size="8" fill="#374151" text-anchor="middle">Find the derivative → power/chain/product rule</text>
  <text x="354" y="130" font-size="8" fill="#374151" text-anchor="middle">Find extrema → set f'(x)=0, test sign</text>
  <text x="354" y="144" font-size="8" fill="#374151" text-anchor="middle">Evaluate integral → find antiderivative</text>
  <text x="354" y="158" font-size="8" fill="#374151" text-anchor="middle">Find area → definite integral with limits</text>
  <text x="354" y="172" font-size="8" fill="#374151" text-anchor="middle">Related rates → implicit diff, chain rule</text>
  <text x="354" y="186" font-size="8" fill="#374151" text-anchor="middle">Limit → factor/cancel or L'Hôpital</text>
</svg>
