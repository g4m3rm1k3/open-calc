<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" style="font-family: ui-monospace, monospace; border-radius: 12px;">
  <style>
    .bg  { fill: rgb(var(--tw-custom-slate-50)); }
    .mu  { fill: rgb(var(--tw-custom-slate-500)); }
    .tx  { fill: rgb(var(--tw-custom-slate-900)); }
    .dark .bg  { fill: rgb(var(--tw-custom-slate-900)); }
    .dark .mu  { fill: rgb(var(--tw-custom-slate-400)); }
    .dark .tx  { fill: rgb(var(--tw-custom-slate-200)); }
  </style>
  <rect width="480" height="200" rx="12" class="bg"/>
  <text x="240" y="17" font-size="11" fill="#4338ca" text-anchor="middle" font-weight="700">How Limits and Continuity Connect</text>

  <!-- Implication chain: limit exists → continuity conditions -->

  <!-- Box 1: Limit exists -->
  <rect x="16" y="30" width="132" height="64" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="82" y="50" font-size="9" fill="#4338ca" text-anchor="middle" font-weight="700">Limit Exists</text>
  <text x="82" y="64" font-size="8" class="mu" text-anchor="middle">lim f(x) = L</text>
  <text x="82" y="77" font-size="7.5" fill="#6366f1" text-anchor="middle">x → c</text>
  <text x="82" y="89" font-size="7.5" class="mu" text-anchor="middle">lim⁻ = lim⁺</text>

  <!-- NOT implies f(c) exists -->
  <defs>
    <marker id="b1" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><polygon points="0,0 7,3.5 0,7" fill="#059669"/></marker>
    <marker id="b2" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><polygon points="0,0 7,3.5 0,7" fill="#ef4444"/></marker>
    <marker id="b3" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><polygon points="0,0 7,3.5 0,7" fill="#059669"/></marker>
  </defs>

  <!-- Arrow: limit exists ⊕ f(c) exists → check if equal → continuity -->
  <line x1="148" y1="62" x2="172" y2="62" stroke="#059669" stroke-width="2" marker-end="url(#b1)"/>
  <text x="160" y="56" font-size="7.5" fill="#059669" text-anchor="middle">+</text>

  <!-- Box 2: f(c) defined -->
  <rect x="174" y="30" width="132" height="64" rx="8" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="240" y="50" font-size="9" fill="#b45309" text-anchor="middle" font-weight="700">f(c) Defined</text>
  <text x="240" y="64" font-size="8" class="mu" text-anchor="middle">function value</text>
  <text x="240" y="77" font-size="8" class="mu" text-anchor="middle">exists at c</text>
  <text x="240" y="89" font-size="7.5" class="mu" text-anchor="middle">(no hole, no undef)</text>

  <!-- Arrow to equal check -->
  <line x1="306" y1="62" x2="330" y2="62" stroke="#059669" stroke-width="2" marker-end="url(#b3)"/>
  <text x="318" y="56" font-size="7.5" fill="#059669" text-anchor="middle">=</text>

  <!-- Box 3: Equal → continuous -->
  <rect x="332" y="30" width="132" height="64" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2.5"/>
  <text x="398" y="50" font-size="9" fill="#059669" text-anchor="middle" font-weight="700">CONTINUOUS</text>
  <text x="398" y="64" font-size="8" class="mu" text-anchor="middle">lim f(x) = f(c)</text>
  <text x="398" y="77" font-size="7.5" fill="#10b981" text-anchor="middle">x → c</text>
  <text x="398" y="89" font-size="7.5" fill="#10b981" text-anchor="middle">no break at c ✓</text>

  <!-- BOTTOM HALF: what can fail -->
  <rect x="16" y="108" width="440" height="82" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="236" y="124" font-size="9" fill="#64748b" text-anchor="middle" font-weight="700">What Breaks Continuity</text>

  <!-- Three failure columns -->
  <line x1="173" y1="110" x2="173" y2="188" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="310" y1="110" x2="310" y2="188" stroke="#e2e8f0" stroke-width="1"/>

  <text x="94" y="142" font-size="8.5" fill="#dc2626" text-anchor="middle" font-weight="700">Limit DNE</text>
  <text x="94" y="155" font-size="7.5" class="mu" text-anchor="middle">lim⁻ ≠ lim⁺</text>
  <text x="94" y="167" font-size="7.5" class="mu" text-anchor="middle">(jump, oscillation)</text>
  <text x="94" y="181" font-size="8" fill="#dc2626" text-anchor="middle">→ not cts</text>

  <text x="241" y="142" font-size="8.5" fill="#dc2626" text-anchor="middle" font-weight="700">f(c) Missing</text>
  <text x="241" y="155" font-size="7.5" class="mu" text-anchor="middle">lim exists but</text>
  <text x="241" y="167" font-size="7.5" class="mu" text-anchor="middle">f(c) undefined</text>
  <text x="241" y="181" font-size="8" fill="#dc2626" text-anchor="middle">→ removable disc.</text>

  <text x="378" y="142" font-size="8.5" fill="#dc2626" text-anchor="middle" font-weight="700">Values Differ</text>
  <text x="378" y="155" font-size="7.5" class="mu" text-anchor="middle">lim = L but</text>
  <text x="378" y="167" font-size="7.5" class="mu" text-anchor="middle">f(c) ≠ L</text>
  <text x="378" y="181" font-size="8" fill="#dc2626" text-anchor="middle">→ misplaced point</text>
</svg>
