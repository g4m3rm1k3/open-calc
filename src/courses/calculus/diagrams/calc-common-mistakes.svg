<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" style="font-family: ui-monospace, monospace; border-radius: 12px;">
  <style>.bg{fill:rgb(var(--tw-custom-slate-50))}.dark .bg{fill:rgb(var(--tw-custom-slate-900))}</style>
  <rect width="480" height="200" rx="12" class="bg"/>
  <text x="240" y="16" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="700">Common Mistakes — What to Watch Out For</text>
  <!-- Header -->
  <rect x="8" y="24" width="228" height="14" rx="0" fill="#dc2626"/>
  <text x="122" y="35" font-size="8" fill="white" text-anchor="middle" font-weight="700">Wrong</text>
  <rect x="244" y="24" width="228" height="14" rx="0" fill="#166534"/>
  <text x="358" y="35" font-size="8" fill="white" text-anchor="middle" font-weight="700">Correct</text>
  <!-- Row 1 -->
  <rect x="8" y="38" width="228" height="22" rx="0" fill="#fee2e2"/>
  <text x="122" y="53" font-size="8.5" fill="#dc2626" text-anchor="middle">√(a²+b²) = a+b ✗</text>
  <rect x="244" y="38" width="228" height="22" rx="0" fill="#dcfce7"/>
  <text x="358" y="53" font-size="8.5" fill="#166534" text-anchor="middle">√(a²+b²) ≠ a+b  (can't simplify)</text>
  <!-- Row 2 -->
  <rect x="8" y="60" width="228" height="22" rx="0" fill="#fee2e2"/>
  <text x="122" y="75" font-size="8.5" fill="#dc2626" text-anchor="middle">(a+b)² = a²+b² ✗</text>
  <rect x="244" y="60" width="228" height="22" rx="0" fill="#dcfce7"/>
  <text x="358" y="75" font-size="8.5" fill="#166534" text-anchor="middle">(a+b)² = a²+2ab+b² (FOIL!)</text>
  <!-- Row 3 -->
  <rect x="8" y="82" width="228" height="22" rx="0" fill="#fee2e2"/>
  <text x="122" y="97" font-size="8.5" fill="#dc2626" text-anchor="middle">1/(a+b) = 1/a + 1/b ✗</text>
  <rect x="244" y="82" width="228" height="22" rx="0" fill="#dcfce7"/>
  <text x="358" y="97" font-size="8.5" fill="#166534" text-anchor="middle">Never split denom across a sum</text>
  <!-- Row 4 -->
  <rect x="8" y="104" width="228" height="22" rx="0" fill="#fee2e2"/>
  <text x="122" y="119" font-size="8.5" fill="#dc2626" text-anchor="middle">d/dx[f(g)] = f'(g') ✗</text>
  <rect x="244" y="104" width="228" height="22" rx="0" fill="#dcfce7"/>
  <text x="358" y="119" font-size="8.5" fill="#166534" text-anchor="middle">d/dx[f(g)] = f'(g)·g' (chain rule)</text>
  <!-- Row 5 -->
  <rect x="8" y="126" width="228" height="22" rx="0" fill="#fee2e2"/>
  <text x="122" y="141" font-size="8.5" fill="#dc2626" text-anchor="middle">cancel: (x+3)/x = 3 ✗</text>
  <rect x="244" y="126" width="228" height="22" rx="0" fill="#dcfce7"/>
  <text x="358" y="141" font-size="8.5" fill="#166534" text-anchor="middle">(x+3)/x = 1 + 3/x  (split, don't cancel)</text>
  <!-- Row 6 -->
  <rect x="8" y="148" width="228" height="22" rx="0" fill="#fee2e2"/>
  <text x="122" y="163" font-size="8.5" fill="#dc2626" text-anchor="middle">log(a+b) = log a + log b ✗</text>
  <rect x="244" y="148" width="228" height="22" rx="0" fill="#dcfce7"/>
  <text x="358" y="163" font-size="8.5" fill="#166534" text-anchor="middle">log(ab) = log a + log b (product, not sum)</text>
  <!-- Footer -->
  <rect x="8" y="174" width="464" height="22" rx="4" fill="#fef3c7"/>
  <text x="240" y="189" font-size="8" fill="#92400e" text-anchor="middle">Pattern: mistakes happen when you try to "distribute" an operation that doesn't distribute — always verify with a number</text>
</svg>
