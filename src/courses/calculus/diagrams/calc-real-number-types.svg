<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" style="font-family: ui-monospace, monospace; border-radius: 12px;">
  <style>.bg{fill:rgb(var(--tw-custom-slate-50))}.dark .bg{fill:rgb(var(--tw-custom-slate-900))}</style>
  <rect width="480" height="200" rx="12" class="bg"/>
  <text x="240" y="16" font-size="11" fill="#4338ca" text-anchor="middle" font-weight="700">Real Number System — Nested Structure</text>
  <!-- Nested circles representing number sets -->
  <ellipse cx="240" cy="112" rx="220" ry="78" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="440" y="108" font-size="8.5" fill="#0369a1" text-anchor="middle">ℝ Real</text>
  <text x="440" y="120" font-size="8.5" fill="#0369a1" text-anchor="middle">numbers</text>
  <ellipse cx="220" cy="120" rx="162" ry="60" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="55" y="140" font-size="7.5" fill="#1d4ed8" text-anchor="middle">ℚ Rational</text>
  <ellipse cx="210" cy="124" rx="108" ry="46" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="88" y="150" font-size="7.5" fill="#166534" text-anchor="middle">ℤ Integer</text>
  <ellipse cx="200" cy="128" rx="60" ry="34" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="160" y="158" font-size="7.5" fill="#92400e" text-anchor="middle">ℕ Natural</text>
  <!-- Labels with examples -->
  <text x="240" y="36" font-size="8" fill="#374151" text-anchor="middle">ℕ (1,2,3…) ⊂ ℤ (…−2,−1,0,1,2…) ⊂ ℚ (½, 0.3̄) ⊂ ℝ (π, √2)</text>
  <!-- Irrational label -->
  <text x="400" y="148" font-size="7.5" fill="#0369a1">Irrational:</text>
  <text x="400" y="160" font-size="7.5" fill="#0369a1">π, e, √2, √5</text>
  <text x="400" y="172" font-size="7.5" fill="#0369a1">non-repeating</text>
  <!-- Key fact -->
  <rect x="8" y="170" width="250" height="24" rx="4" fill="#f1f5f9"/>
  <text x="133" y="186" font-size="7.5" fill="#374151" text-anchor="middle">Every integer is rational; not every rational is an integer</text>
</svg>
