<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" style="font-family: ui-monospace, monospace; border-radius: 12px;">
  <style>.bg{fill:rgb(var(--tw-custom-slate-50))}.dark .bg{fill:rgb(var(--tw-custom-slate-900))}</style>
  <rect width="480" height="200" rx="12" class="bg"/>
  <text x="240" y="16" font-size="11" fill="#4338ca" text-anchor="middle" font-weight="700">Arc Length — From Pythagoras to the Integral</text>
  <!-- Derivation steps -->
  <rect x="8" y="24" width="464" height="52" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="50" y="44" font-size="8" fill="#4338ca">ds = √(dx²+dy²)</text>
  <text x="220" y="44" font-size="10" fill="#94a3b8">→</text>
  <text x="260" y="44" font-size="8" fill="#4338ca">= √(1+(dy/dx)²) dx</text>
  <text x="420" y="44" font-size="10" fill="#94a3b8">→</text>
  <text x="50" y="68" font-size="8" fill="#4338ca">L = ∫ₐᵇ √(1+[f′(x)]²) dx</text>
  <text x="220" y="68" font-size="10" fill="#94a3b8">or</text>
  <text x="260" y="68" font-size="8" fill="#4338ca">L = ∫_c^d √(1+[g′(y)]²) dy  (when x=g(y))</text>
  <!-- Examples table -->
  <rect x="8" y="84" width="464" height="110" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="16" y="92" width="448" height="14" rx="0" fill="#e2e8f0"/>
  <text x="130" y="103" font-size="7.5" fill="#1e293b" text-anchor="middle" font-weight="700">Function</text>
  <text x="310" y="103" font-size="7.5" fill="#1e293b" text-anchor="middle" font-weight="700">f′(x)</text>
  <text x="420" y="103" font-size="7.5" fill="#1e293b" text-anchor="middle" font-weight="700">Integral to Evaluate</text>
  <rect x="16" y="106" width="448" height="18" rx="0" fill="#dbeafe"/>
  <text x="130" y="119" font-size="7.5" fill="#1d4ed8" text-anchor="middle">y = x^(3/2) on [0, 4]</text>
  <text x="310" y="119" font-size="7.5" fill="#1d4ed8" text-anchor="middle">(3/2)√x</text>
  <text x="420" y="119" font-size="7.5" fill="#1d4ed8" text-anchor="middle">∫₀⁴ √(1+9x/4) dx</text>
  <rect x="16" y="124" width="448" height="18" rx="0" fill="#f8fafc"/>
  <text x="130" y="137" font-size="7.5" fill="#374151" text-anchor="middle">y = ln(sec x) on [0, π/3]</text>
  <text x="310" y="137" font-size="7.5" fill="#374151" text-anchor="middle">tan x</text>
  <text x="420" y="137" font-size="7.5" fill="#374151" text-anchor="middle">∫₀^{π/3} sec x dx</text>
  <rect x="16" y="142" width="448" height="18" rx="0" fill="#dbeafe"/>
  <text x="130" y="155" font-size="7.5" fill="#1d4ed8" text-anchor="middle">y = (x²/4) − (ln x)/2</text>
  <text x="310" y="155" font-size="7.5" fill="#1d4ed8" text-anchor="middle">x/2 − 1/(2x)</text>
  <text x="420" y="155" font-size="7.5" fill="#1d4ed8" text-anchor="middle">∫₁⁴ (x/2+1/(2x)) dx</text>
  <rect x="16" y="160" width="448" height="28" rx="4" fill="#dcfce7"/>
  <text x="240" y="175" font-size="8" fill="#166534" text-anchor="middle" font-weight="700">Tip: Choose the variable (x or y) that simplifies 1+(derivative)² into a perfect square</text>
</svg>
