<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" style="font-family: ui-monospace, monospace; border-radius: 12px;">
  <style>.bg{fill:rgb(var(--tw-custom-slate-50))}.dark .bg{fill:rgb(var(--tw-custom-slate-900))}</style>
  <rect width="480" height="200" rx="12" class="bg"/>
  <text x="240" y="16" font-size="11" fill="#4338ca" text-anchor="middle" font-weight="700">Sigma Notation — Anatomy of a Sum</text>
  <!-- Big sigma anatomy -->
  <rect x="8" y="24" width="230" height="170" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="119" y="95" font-size="52" fill="#6366f1" text-anchor="middle" opacity="0.15">Σ</text>
  <text x="119" y="95" font-size="48" fill="#4338ca" text-anchor="middle" font-weight="700">Σ</text>
  <!-- i=1 below -->
  <text x="119" y="118" font-size="13" fill="#1d4ed8" text-anchor="middle">i=1</text>
  <!-- n above -->
  <text x="119" y="60" font-size="13" fill="#dc2626" text-anchor="middle">n</text>
  <!-- Body to the right -->
  <text x="152" y="92" font-size="18" fill="#059669">aᵢ</text>
  <!-- Annotations -->
  <rect x="16" y="130" width="94" height="26" rx="3" fill="#fef3c7"/>
  <text x="63" y="142" font-size="7.5" fill="#92400e" text-anchor="middle" font-weight="700">i = 1</text>
  <text x="63" y="153" font-size="7" fill="#78350f" text-anchor="middle">lower bound</text>
  <rect x="118" y="44" width="94" height="26" rx="3" fill="#fee2e2"/>
  <text x="165" y="56" font-size="7.5" fill="#991b1b" text-anchor="middle" font-weight="700">n</text>
  <text x="165" y="66" font-size="7" fill="#991b1b" text-anchor="middle">upper bound</text>
  <rect x="152" y="56" width="70" height="26" rx="3" fill="#dcfce7"/>
  <text x="187" y="68" font-size="7.5" fill="#166534" text-anchor="middle" font-weight="700">aᵢ</text>
  <text x="187" y="78" font-size="7" fill="#166534" text-anchor="middle">summand</text>
  <!-- Right panel: examples -->
  <rect x="246" y="24" width="226" height="170" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="359" y="44" font-size="8.5" fill="#1e293b" text-anchor="middle" font-weight="700">Examples</text>
  <rect x="254" y="50" width="210" height="32" rx="4" fill="#dbeafe"/>
  <text x="359" y="64" font-size="8" fill="#1d4ed8" text-anchor="middle">Σᵢ₌₁⁵ i = 1+2+3+4+5 = 15</text>
  <text x="359" y="78" font-size="7.5" fill="#1e40af" text-anchor="middle">(sum of first 5 integers)</text>
  <rect x="254" y="88" width="210" height="32" rx="4" fill="#dcfce7"/>
  <text x="359" y="102" font-size="8" fill="#166534" text-anchor="middle">Σᵢ₌₁⁴ i² = 1+4+9+16 = 30</text>
  <text x="359" y="116" font-size="7.5" fill="#15803d" text-anchor="middle">(sum of squares)</text>
  <rect x="254" y="126" width="210" height="32" rx="4" fill="#fef3c7"/>
  <text x="359" y="140" font-size="8" fill="#92400e" text-anchor="middle">Σᵢ₌₁ⁿ 1/i = 1 + ½ + ⅓ + … + 1/n</text>
  <text x="359" y="154" font-size="7.5" fill="#78350f" text-anchor="middle">(harmonic series)</text>
  <rect x="254" y="164" width="210" height="24" rx="4" fill="#ede9fe"/>
  <text x="359" y="180" font-size="8" fill="#5b21b6" text-anchor="middle">Σᵢ₌₁ⁿ f(xᵢ)·Δx → Riemann sum</text>
</svg>
