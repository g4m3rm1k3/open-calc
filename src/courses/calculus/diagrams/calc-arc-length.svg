<svg viewBox="0 0 480 215" xmlns="http://www.w3.org/2000/svg" style="font-family: ui-monospace, monospace; border-radius: 12px;">
  <style>
    .bg  { fill: #f8fafc; }
    .ax  { stroke: #94a3b8; }
    .axf { fill: #94a3b8; }
    .mu  { fill: #64748b; }
    .dark .bg  { fill: #0f172a; }
    .dark .ax  { stroke: #475569; }
    .dark .axf { fill: #475569; }
    .dark .mu  { fill: #64748b; }
  </style>
  <rect width="480" height="215" rx="12" class="bg"/>

  <text x="240" y="18" font-size="11" fill="#4338ca" text-anchor="middle" font-weight="700">Arc Length — Sum of Infinitely Many Tiny Hypotenuses</text>

  <!-- LEFT: Geometric diagram -->
  <!-- Axes -->
  <line x1="30" y1="170" x2="240" y2="170" class="ax" stroke-width="1.2"/>
  <line x1="30" y1="40"  x2="30"  y2="173" class="ax" stroke-width="1.2"/>
  <polygon points="238,166 246,170 238,174" class="axf"/>

  <!-- a and b marks -->
  <line x1="50"  y1="167" x2="50"  y2="173" class="ax" stroke-width="1"/>
  <line x1="210" y1="167" x2="210" y2="173" class="ax" stroke-width="1"/>
  <text x="50"  y="183" font-size="9" class="mu" text-anchor="middle">a</text>
  <text x="210" y="183" font-size="9" class="mu" text-anchor="middle">b</text>

  <!-- Smooth curve y=f(x) — a wave/parabola shape -->
  <path d="M 50,120 C 70,100 90,70 120,55 C 150,40 170,55 200,90 L 210,100"
        fill="none" stroke="#6366f1" stroke-width="2.5"/>

  <!-- Approximating segments (polygonal chain) with 5 segments -->
  <!-- Points roughly on the curve: -->
  <!-- (50,120), (82,72), (112,54), (143,50), (175,68), (210,100) -->
  <line x1="50"  y1="120" x2="82"  y2="72"  stroke="#ef4444" stroke-width="1.5"/>
  <line x1="82"  y1="72"  x2="112" y2="54"  stroke="#ef4444" stroke-width="1.5"/>
  <line x1="112" y1="54"  x2="143" y2="50"  stroke="#ef4444" stroke-width="1.5"/>
  <line x1="143" y1="50"  x2="175" y2="68"  stroke="#ef4444" stroke-width="1.5"/>
  <line x1="175" y1="68"  x2="210" y2="100" stroke="#ef4444" stroke-width="1.5"/>

  <!-- One zoomed segment showing Δx, Δy, ds -->
  <!-- Segment from (112,54) to (143,50), Δx=31, Δy=-4 -->
  <!-- Draw zoom: show Δx horizontal, Δy vertical, ds hypotenuse -->
  <line x1="112" y1="54"  x2="143" y2="54"  stroke="#10b981" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="143" y1="54"  x2="143" y2="50"  stroke="#10b981" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="127" y="64"  font-size="8.5" fill="#10b981">Δx</text>
  <text x="147" y="53"  font-size="8.5" fill="#10b981">Δy</text>
  <!-- ds label on the segment -->
  <text x="122" y="47"  font-size="9" fill="#ef4444" transform="rotate(-5,122,47)">ds</text>

  <!-- Dot markers on curve -->
  <circle cx="50"  cy="120" r="3" fill="#6366f1"/>
  <circle cx="82"  cy="72"  r="3" fill="#6366f1"/>
  <circle cx="112" cy="54"  r="3" fill="#6366f1"/>
  <circle cx="143" cy="50"  r="3" fill="#6366f1"/>
  <circle cx="175" cy="68"  r="3" fill="#6366f1"/>
  <circle cx="210" cy="100" r="3" fill="#6366f1"/>

  <!-- Bottom note on left -->
  <text x="130" y="200" font-size="8" fill="#ef4444" text-anchor="middle">ds = √(Δx²+Δy²) → √(1+[f′]²) dx</text>

  <!-- DIVIDER -->
  <line x1="258" y1="28" x2="258" y2="205" stroke="#e2e8f0" stroke-width="1"/>

  <!-- RIGHT: Derivation and formula -->
  <text x="368" y="34" font-size="9" fill="#4338ca" text-anchor="middle" font-weight="700">Derivation</text>

  <rect x="266" y="44" width="206" height="70" rx="5" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1"/>
  <text x="369" y="60" font-size="8.5" fill="#4338ca" text-anchor="middle">Each segment has length:</text>
  <text x="369" y="76" font-size="9"   fill="#4338ca" text-anchor="middle">ds = √(dx² + dy²)</text>
  <text x="369" y="90" font-size="9"   fill="#4338ca" text-anchor="middle">= √(1 + (dy/dx)²) dx</text>
  <text x="369" y="104" font-size="9"  fill="#4338ca" text-anchor="middle">= √(1 + [f′(x)]²) dx</text>

  <!-- Arc length formula -->
  <text x="369" y="126" font-size="9" fill="#4338ca" text-anchor="middle" font-weight="700">Arc Length Formula</text>
  <rect x="266" y="132" width="206" height="30" rx="5" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="369" y="152" font-size="11" fill="#059669" text-anchor="middle" font-weight="700">L = ∫ₐᵇ √(1 + [f′(x)]²) dx</text>

  <!-- Parametric version -->
  <text x="369" y="177" font-size="9" fill="#4338ca" text-anchor="middle" font-weight="700">Parametric Version</text>
  <rect x="266" y="182" width="206" height="26" rx="4" fill="#fef9c3" stroke="#fde68a" stroke-width="1"/>
  <text x="369" y="197" font-size="9" fill="#d97706" text-anchor="middle">L = ∫ √((dx/dt)²+(dy/dt)²) dt</text>
</svg>
