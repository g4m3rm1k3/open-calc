<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" style="font-family: ui-monospace, monospace; border-radius: 12px;">
  <style>
    .bg { fill: rgb(var(--tw-custom-slate-50)); }
    .dark .bg { fill: rgb(var(--tw-custom-slate-900)); }
  </style>
  <rect width="480" height="200" rx="12" class="bg"/>
  <text x="240" y="16" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="700">When Differentiability Fails — 4 Cases</text>

  <!-- 4 panels -->
  <!-- Panel 1: Corner -->
  <rect x="6" y="22" width="110" height="172" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="61" y="38" font-size="8.5" fill="#dc2626" text-anchor="middle" font-weight="700">Corner</text>
  <line x1="14" y1="148" x2="108" y2="148" stroke="#64748b" stroke-width="1"/>
  <line x1="61" y1="46" x2="61" y2="152" stroke="#64748b" stroke-width="1" stroke-dasharray="2,2"/>
  <!-- V shape for |x| -->
  <path d="M 16,148 L 61,90 L 106,148" fill="none" stroke="#dc2626" stroke-width="2.5"/>
  <circle cx="61" cy="90" r="3.5" fill="#dc2626"/>
  <text x="61" y="166" font-size="7.5" fill="#dc2626" text-anchor="middle">f(x) = |x|</text>
  <text x="61" y="178" font-size="7" fill="#94a3b8" text-anchor="middle">left ≠ right slope</text>
  <text x="61" y="189" font-size="7" fill="#94a3b8" text-anchor="middle">no unique tangent</text>

  <!-- Panel 2: Cusp -->
  <rect x="122" y="22" width="110" height="172" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="177" y="38" font-size="8.5" fill="#dc2626" text-anchor="middle" font-weight="700">Cusp</text>
  <line x1="130" y1="148" x2="224" y2="148" stroke="#64748b" stroke-width="1"/>
  <line x1="177" y1="46" x2="177" y2="152" stroke="#64748b" stroke-width="1" stroke-dasharray="2,2"/>
  <!-- x^(2/3) cusp shape -->
  <path d="M 132,148 Q 145,120 160,98 Q 168,86 177,78" fill="none" stroke="#dc2626" stroke-width="2.5"/>
  <path d="M 177,78 Q 186,86 194,98 Q 210,120 222,148" fill="none" stroke="#dc2626" stroke-width="2.5"/>
  <circle cx="177" cy="78" r="3.5" fill="#dc2626"/>
  <text x="177" y="166" font-size="7.5" fill="#dc2626" text-anchor="middle">f(x) = x^(2/3)</text>
  <text x="177" y="178" font-size="7" fill="#94a3b8" text-anchor="middle">slopes → ±∞</text>
  <text x="177" y="189" font-size="7" fill="#94a3b8" text-anchor="middle">vertical tangent at 0</text>

  <!-- Panel 3: Vertical Tangent -->
  <rect x="238" y="22" width="110" height="172" rx="6" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
  <text x="293" y="38" font-size="8.5" fill="#b45309" text-anchor="middle" font-weight="700">Vert. Tangent</text>
  <line x1="246" y1="148" x2="340" y2="148" stroke="#64748b" stroke-width="1"/>
  <line x1="293" y1="46" x2="293" y2="152" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,2"/>
  <!-- x^(1/3) shape -->
  <path d="M 248,148 Q 268,138 280,120 Q 288,106 293,90" fill="none" stroke="#b45309" stroke-width="2.5"/>
  <path d="M 293,90 Q 298,72 308,58 Q 318,46 336,42" fill="none" stroke="#b45309" stroke-width="2.5"/>
  <circle cx="293" cy="90" r="3.5" fill="#b45309"/>
  <text x="293" y="166" font-size="7.5" fill="#b45309" text-anchor="middle">f(x) = x^(1/3)</text>
  <text x="293" y="178" font-size="7" fill="#94a3b8" text-anchor="middle">slope → ∞ at 0</text>
  <text x="293" y="189" font-size="7" fill="#94a3b8" text-anchor="middle">f ′(0) undefined</text>

  <!-- Panel 4: Discontinuity -->
  <rect x="354" y="22" width="120" height="172" rx="6" fill="#fdf4ff" stroke="#d8b4fe" stroke-width="1.5"/>
  <text x="414" y="38" font-size="8.5" fill="#7c3aed" text-anchor="middle" font-weight="700">Discontinuity</text>
  <line x1="362" y1="130" x2="466" y2="130" stroke="#64748b" stroke-width="1"/>
  <line x1="414" y1="46" x2="414" y2="134" stroke="#64748b" stroke-width="1" stroke-dasharray="2,2"/>
  <!-- Jump discontinuity -->
  <path d="M 364,130 Q 390,128 412,126" fill="none" stroke="#7c3aed" stroke-width="2.5"/>
  <circle cx="414" cy="125" r="3.5" fill="white" stroke="#7c3aed" stroke-width="2"/>
  <circle cx="414" cy="80" r="3.5" fill="#7c3aed"/>
  <path d="M 414,80 Q 435,72 464,68" fill="none" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="414" y="150" font-size="7.5" fill="#7c3aed" text-anchor="middle">Jump disc.</text>
  <text x="414" y="162" font-size="7" fill="#94a3b8" text-anchor="middle">not continuous</text>
  <text x="414" y="173" font-size="7" fill="#94a3b8" text-anchor="middle">→ not differentiable</text>
  <text x="414" y="184" font-size="7" fill="#7c3aed" text-anchor="middle">cts ← diff (not ↔)</text>
</svg>
