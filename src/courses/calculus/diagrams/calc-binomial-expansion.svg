<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" style="font-family: ui-monospace, monospace; border-radius: 12px;">
  <style>.bg{fill:rgb(var(--tw-custom-slate-50))}.dark .bg{fill:rgb(var(--tw-custom-slate-900))}</style>
  <rect width="480" height="200" rx="12" class="bg"/>
  <text x="240" y="16" font-size="11" fill="#4338ca" text-anchor="middle" font-weight="700">Binomial Theorem — Expansion Formula</text>
  <!-- Main formula -->
  <rect x="8" y="24" width="464" height="36" rx="6" fill="#4338ca"/>
  <text x="240" y="40" font-size="9.5" fill="white" text-anchor="middle" font-weight="700">(a+b)ⁿ = Σ C(n,k) · aⁿ⁻ᵏ · bᵏ  (k = 0 to n)</text>
  <text x="240" y="54" font-size="8" fill="#c7d2fe" text-anchor="middle">C(n,k) = n!/(k!(n−k)!)  — the binomial coefficients from Pascal's Triangle</text>
  <!-- Examples -->
  <rect x="8" y="66" width="220" height="126" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="118" y="82" font-size="8.5" fill="#4338ca" text-anchor="middle" font-weight="700">Expanded Forms</text>
  <text x="118" y="98" font-size="8.5" fill="#374151" text-anchor="middle">(a+b)¹ = a + b</text>
  <text x="118" y="114" font-size="8.5" fill="#374151" text-anchor="middle">(a+b)² = a² + 2ab + b²</text>
  <text x="118" y="130" font-size="8.5" fill="#374151" text-anchor="middle">(a+b)³ = a³+3a²b+3ab²+b³</text>
  <text x="118" y="148" font-size="8" fill="#374151" text-anchor="middle">(a+b)⁴ = a⁴+4a³b+6a²b²+4ab³+b⁴</text>
  <text x="118" y="164" font-size="7.5" fill="#6366f1" text-anchor="middle">Coefficients: 1 1 | 1 2 1 | 1 3 3 1 | 1 4 6 4 1</text>
  <text x="118" y="180" font-size="7.5" fill="#374151" text-anchor="middle">(from Pascal's Triangle rows 1–4)</text>
  <!-- Calculus connection -->
  <rect x="236" y="66" width="236" height="126" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="354" y="82" font-size="8.5" fill="#166534" text-anchor="middle" font-weight="700">Calculus Applications</text>
  <text x="354" y="100" font-size="8" fill="#374151" text-anchor="middle">Derivative from definition:</text>
  <text x="354" y="116" font-size="8" fill="#374151" text-anchor="middle">(x+h)ⁿ = xⁿ+nxⁿ⁻¹h+O(h²)</text>
  <text x="354" y="132" font-size="8" fill="#374151" text-anchor="middle">→ d/dx[xⁿ] = nxⁿ⁻¹</text>
  <line x1="244" y1="140" x2="464" y2="140" stroke="#22c55e" stroke-width="1"/>
  <text x="354" y="158" font-size="8" fill="#374151" text-anchor="middle">Taylor series uses binomial</text>
  <text x="354" y="172" font-size="8" fill="#374151" text-anchor="middle">theorem for (1+x)ⁿ expansions</text>
  <text x="354" y="188" font-size="8" fill="#166534" text-anchor="middle">(1+x)^½ ≈ 1 + x/2 − x²/8 + …</text>
</svg>
