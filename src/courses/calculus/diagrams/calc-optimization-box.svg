<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" style="font-family: ui-monospace, monospace; border-radius: 12px;">
  <style>.bg{fill:rgb(var(--tw-custom-slate-50))}.dark .bg{fill:rgb(var(--tw-custom-slate-900))}</style>
  <rect width="480" height="200" rx="12" class="bg"/>
  <text x="240" y="16" font-size="11" fill="#4338ca" text-anchor="middle" font-weight="700">Optimization — Classic Box Problem</text>
  <!-- Box diagram panel -->
  <rect x="8" y="24" width="210" height="170" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="113" y="43" font-size="8.5" fill="#92400e" text-anchor="middle" font-weight="700">Square cut from corners</text>
  <!-- Flat sheet -->
  <rect x="22" y="52" width="184" height="130" rx="2" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
  <!-- Cut corner squares -->
  <rect x="22" y="52" width="26" height="26" rx="2" fill="#f8fafc" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="180" y="52" width="26" height="26" rx="2" fill="#f8fafc" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="22" y="156" width="26" height="26" rx="2" fill="#f8fafc" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="180" y="156" width="26" height="26" rx="2" fill="#f8fafc" stroke="#ef4444" stroke-width="1.5"/>
  <!-- x label on corners -->
  <text x="35" y="68" font-size="8" fill="#ef4444" text-anchor="middle" font-weight="700">x</text>
  <!-- Dimensions -->
  <text x="113" y="148" font-size="8" fill="#92400e" text-anchor="middle">(10−2x)</text>
  <text x="220" y="118" font-size="8" fill="#92400e" transform="rotate(90,220,118)">(8−2x)</text>

  <!-- Solution panel -->
  <rect x="226" y="24" width="246" height="170" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="349" y="43" font-size="8.5" fill="#4338ca" text-anchor="middle" font-weight="700">Solution</text>
  <rect x="234" y="50" width="230" height="26" rx="4" fill="#dbeafe"/>
  <text x="349" y="65" font-size="8" fill="#1d4ed8" text-anchor="middle" font-weight="700">V(x) = x(10−2x)(8−2x)</text>
  <text x="349" y="78" font-size="7.5" fill="#1e40af" text-anchor="middle">0 &lt; x &lt; 4   (constraint)</text>
  <rect x="234" y="84" width="230" height="26" rx="4" fill="#dcfce7"/>
  <text x="349" y="99" font-size="8" fill="#166534" text-anchor="middle">V ′(x) = (expand and diff)</text>
  <text x="349" y="112" font-size="7.5" fill="#166534" text-anchor="middle">= 12x² − 72x + 80</text>
  <rect x="234" y="116" width="230" height="26" rx="4" fill="#fef3c7"/>
  <text x="349" y="131" font-size="8" fill="#92400e" text-anchor="middle">Set V ′(x) = 0</text>
  <text x="349" y="144" font-size="7.5" fill="#78350f" text-anchor="middle">x = (72±√(72²−4·12·80))/(24)</text>
  <rect x="234" y="148" width="230" height="40" rx="4" fill="#ede9fe"/>
  <text x="349" y="163" font-size="8" fill="#5b21b6" text-anchor="middle">x ≈ 1.53 (valid) or 4.47 (out)</text>
  <text x="349" y="178" font-size="8.5" fill="#4c1d95" text-anchor="middle" font-weight="700">Max V ≈ 52.5 at x ≈ 1.53</text>
</svg>
