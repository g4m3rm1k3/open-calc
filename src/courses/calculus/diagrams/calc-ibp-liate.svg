<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" style="font-family: ui-monospace, monospace; border-radius: 12px;">
  <style>.bg{fill:rgb(var(--tw-custom-slate-50))}.dark .bg{fill:rgb(var(--tw-custom-slate-900))}</style>
  <rect width="480" height="200" rx="12" class="bg"/>
  <text x="240" y="16" font-size="11" fill="#4338ca" text-anchor="middle" font-weight="700">LIATE Rule — Choosing u in Integration by Parts</text>
  <!-- LIATE banner -->
  <rect x="8" y="24" width="464" height="32" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="50" y="44" font-size="11" fill="#6366f1" text-anchor="middle" font-weight="700">L</text>
  <text x="100" y="44" font-size="11" fill="#22c55e" text-anchor="middle" font-weight="700">I</text>
  <text x="152" y="44" font-size="11" fill="#f59e0b" text-anchor="middle" font-weight="700">A</text>
  <text x="204" y="44" font-size="11" fill="#ef4444" text-anchor="middle" font-weight="700">T</text>
  <text x="256" y="44" font-size="11" fill="#8b5cf6" text-anchor="middle" font-weight="700">E</text>
  <text x="380" y="44" font-size="8" fill="#64748b" text-anchor="middle">← pick u from HIGHEST priority</text>
  <!-- L box -->
  <rect x="8" y="64" width="84" height="132" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="50" y="86" font-size="11" fill="#6366f1" text-anchor="middle" font-weight="700">L</text>
  <text x="50" y="104" font-size="8" fill="#4338ca" text-anchor="middle" font-weight="700">Logarithm</text>
  <text x="50" y="120" font-size="7.5" fill="#4338ca" text-anchor="middle">ln x, logₐx</text>
  <text x="50" y="138" font-size="7.5" fill="#6366f1" text-anchor="middle">Priority 1</text>
  <text x="50" y="154" font-size="7" fill="#6366f1" text-anchor="middle">∫ ln x dx</text>
  <text x="50" y="168" font-size="7" fill="#6366f1" text-anchor="middle">u = ln x</text>
  <!-- I box -->
  <rect x="100" y="64" width="84" height="132" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="142" y="86" font-size="11" fill="#22c55e" text-anchor="middle" font-weight="700">I</text>
  <text x="142" y="104" font-size="8" fill="#166534" text-anchor="middle" font-weight="700">Inverse Trig</text>
  <text x="142" y="120" font-size="7.5" fill="#166534" text-anchor="middle">arcsin, arctan</text>
  <text x="142" y="138" font-size="7.5" fill="#22c55e" text-anchor="middle">Priority 2</text>
  <text x="142" y="154" font-size="7" fill="#22c55e" text-anchor="middle">∫ arctan x dx</text>
  <text x="142" y="168" font-size="7" fill="#22c55e" text-anchor="middle">u = arctan x</text>
  <!-- A box -->
  <rect x="192" y="64" width="84" height="132" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="234" y="86" font-size="11" fill="#f59e0b" text-anchor="middle" font-weight="700">A</text>
  <text x="234" y="104" font-size="8" fill="#92400e" text-anchor="middle" font-weight="700">Algebraic</text>
  <text x="234" y="120" font-size="7.5" fill="#92400e" text-anchor="middle">xⁿ, polynomials</text>
  <text x="234" y="138" font-size="7.5" fill="#f59e0b" text-anchor="middle">Priority 3</text>
  <text x="234" y="154" font-size="7" fill="#f59e0b" text-anchor="middle">∫ x·sin x dx</text>
  <text x="234" y="168" font-size="7" fill="#f59e0b" text-anchor="middle">u = x</text>
  <!-- T box -->
  <rect x="284" y="64" width="84" height="132" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="326" y="86" font-size="11" fill="#ef4444" text-anchor="middle" font-weight="700">T</text>
  <text x="326" y="104" font-size="8" fill="#991b1b" text-anchor="middle" font-weight="700">Trig</text>
  <text x="326" y="120" font-size="7.5" fill="#991b1b" text-anchor="middle">sin, cos, tan</text>
  <text x="326" y="138" font-size="7.5" fill="#ef4444" text-anchor="middle">Priority 4</text>
  <text x="326" y="154" font-size="7" fill="#ef4444" text-anchor="middle">∫ x·cos x dx</text>
  <text x="326" y="168" font-size="7" fill="#ef4444" text-anchor="middle">dv = cos x dx</text>
  <!-- E box -->
  <rect x="376" y="64" width="96" height="132" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  <text x="424" y="86" font-size="11" fill="#8b5cf6" text-anchor="middle" font-weight="700">E</text>
  <text x="424" y="104" font-size="8" fill="#4c1d95" text-anchor="middle" font-weight="700">Exponential</text>
  <text x="424" y="120" font-size="7.5" fill="#4c1d95" text-anchor="middle">eˣ, 2ˣ, aˣ</text>
  <text x="424" y="138" font-size="7.5" fill="#8b5cf6" text-anchor="middle">Priority 5</text>
  <text x="424" y="154" font-size="7" fill="#8b5cf6" text-anchor="middle">∫ x·eˣ dx</text>
  <text x="424" y="168" font-size="7" fill="#8b5cf6" text-anchor="middle">dv = eˣ dx</text>
</svg>
