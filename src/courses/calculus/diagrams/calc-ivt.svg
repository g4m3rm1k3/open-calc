<svg viewBox="0 0 480 215" xmlns="http://www.w3.org/2000/svg" style="font-family: ui-monospace, monospace; border-radius: 12px;">
  <style>
    .bg  { fill: #f8fafc; }
    .ax  { stroke: #94a3b8; }
    .axf { fill: #94a3b8; }
    .mu  { fill: #64748b; }
    .dark .bg  { fill: #0f172a; }
    .dark .ax  { stroke: #475569; }
    .dark .axf { fill: #475569; }
    .dark .mu  { fill: #64748b; }
  </style>
  <rect width="480" height="215" rx="12" class="bg"/>

  <text x="240" y="18" font-size="11" fill="#4338ca" text-anchor="middle" font-weight="700">Intermediate Value Theorem — Continuous Curves Cannot Jump</text>

  <!-- LEFT: IVT main diagram -->
  <!-- Axes: origin at (40, 170), scale 1 unit = 50px -->
  <line x1="36"  y1="170" x2="240" y2="170" class="ax" stroke-width="1.2"/>
  <line x1="36"  y1="40"  x2="36"  y2="173" class="ax" stroke-width="1.2"/>
  <polygon points="238,166 246,170 238,174" class="axf"/>

  <!-- y=0 dashed line -->
  <line x1="36" y1="120" x2="240" y2="120" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4" opacity="0.5"/>
  <text x="28" y="124" font-size="8" class="mu" text-anchor="end">0</text>

  <!-- Tick marks -->
  <line x1="86"  y1="167" x2="86"  y2="173" class="ax" stroke-width="1"/>
  <line x1="186" y1="167" x2="186" y2="173" class="ax" stroke-width="1"/>
  <text x="86"  y="183" font-size="9" class="mu" text-anchor="middle">a</text>
  <text x="186" y="183" font-size="9" class="mu" text-anchor="middle">b</text>

  <!-- f(a) < 0 marker -->
  <line x1="33" y1="148" x2="39" y2="148" class="ax" stroke-width="1"/>
  <text x="26" y="152" font-size="8" fill="#ef4444" text-anchor="end">f(a)</text>

  <!-- f(b) > 0 marker -->
  <line x1="33" y1="62" x2="39" y2="62" class="ax" stroke-width="1"/>
  <text x="26" y="66" font-size="8" fill="#059669" text-anchor="end">f(b)</text>

  <!-- Continuous curve from (86,148) to (186,62) — must cross y=0 -->
  <path d="M 86,148 C 106,144 118,134 130,120 C 142,106 160,78 186,62"
        fill="none" stroke="#6366f1" stroke-width="3"/>

  <!-- Crossing point at c -->
  <circle cx="130" cy="120" r="5" fill="#ef4444"/>
  <line x1="130" y1="120" x2="130" y2="170" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="130" y="183" font-size="9" fill="#ef4444" text-anchor="middle">c</text>
  <text x="136" y="115" font-size="8.5" fill="#ef4444">f(c) = 0</text>
  <text x="136" y="126" font-size="8" fill="#ef4444">guaranteed!</text>

  <!-- Start point dot -->
  <circle cx="86" cy="148" r="4" fill="#ef4444"/>
  <!-- End point dot -->
  <circle cx="186" cy="62" r="4" fill="#059669"/>

  <!-- "Can't jump" annotation: broken version -->
  <path d="M 86,148 C 100,148 108,170 118,170 M 125,80 C 135,62 155,62 186,62"
        fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.4"/>
  <text x="130" y="165" font-size="7.5" fill="#ef4444" text-anchor="middle" opacity="0.6">× jump not allowed</text>

  <!-- DIVIDER -->
  <line x1="252" y1="28" x2="252" y2="205" stroke="#e2e8f0" stroke-width="1"/>

  <!-- RIGHT: Statement + applications -->
  <text x="366" y="38" font-size="9" fill="#4338ca" text-anchor="middle" font-weight="700">IVT Statement</text>

  <rect x="260" y="44" width="212" height="56" rx="5" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1"/>
  <text x="366" y="60" font-size="8.5" fill="#4338ca" text-anchor="middle">If f is continuous on [a, b] and</text>
  <text x="366" y="74" font-size="8.5" fill="#4338ca" text-anchor="middle">N is any value between f(a) and f(b),</text>
  <text x="366" y="88" font-size="8.5" fill="#059669" text-anchor="middle">then ∃ c ∈ (a,b) such that f(c) = N</text>

  <!-- Root-finding use case -->
  <text x="366" y="116" font-size="9" fill="#4338ca" text-anchor="middle" font-weight="700">Root-Finding Corollary</text>
  <rect x="260" y="122" width="212" height="46" rx="5" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1"/>
  <text x="366" y="138" font-size="8.5" fill="#059669" text-anchor="middle">If f(a) and f(b) have opposite signs</text>
  <text x="366" y="152" font-size="8.5" fill="#059669" text-anchor="middle">→ f has at least one root in (a, b)</text>
  <text x="366" y="162" font-size="8" class="mu" text-anchor="middle">(sign change guarantees crossing)</text>

  <!-- Example -->
  <rect x="260" y="178" width="212" height="28" rx="5" fill="#fef9c3" stroke="#fde68a" stroke-width="1"/>
  <text x="366" y="192" font-size="8.5" fill="#d97706" text-anchor="middle">f(x) = x³ − x − 1</text>
  <text x="366" y="202" font-size="8" fill="#92400e" text-anchor="middle">f(1)=−1 &lt; 0, f(2)=5 &gt; 0 → root in (1,2)</text>
</svg>
