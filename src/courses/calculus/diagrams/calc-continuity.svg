<svg viewBox="0 0 480 220" xmlns="http://www.w3.org/2000/svg" style="font-family: ui-monospace, monospace; border-radius: 12px;">
  <style>
    .bg  { fill: #f8fafc; }
    .ax  { stroke: #94a3b8; }
    .axf { fill: #94a3b8; }
    .mu  { fill: #64748b; }
    .dark .bg  { fill: #0f172a; }
    .dark .ax  { stroke: #475569; }
    .dark .axf { fill: #475569; }
    .dark .mu  { fill: #64748b; }
  </style>
  <rect width="480" height="220" rx="12" class="bg"/>

  <text x="240" y="18" font-size="11" fill="#4338ca" text-anchor="middle" font-weight="700">Three Types of Discontinuity</text>

  <!-- ===== PANEL 1: Removable (hole) ===== -->
  <text x="80" y="35"  font-size="9" fill="#6366f1" text-anchor="middle" font-weight="700">Removable</text>
  <text x="80" y="47"  font-size="8" class="mu"     text-anchor="middle">"hole" — lim exists</text>
  <line x1="18"  y1="170" x2="150" y2="170" class="ax" stroke-width="1.2"/>
  <line x1="18"  y1="55"  x2="18"  y2="173" class="ax" stroke-width="1.2"/>
  <!-- line y = -x + 160, i.e. straight diagonal -->
  <line x1="18"  y1="150" x2="70"  y2="98"  stroke="#6366f1" stroke-width="2"/>
  <line x1="90"  y1="80"  x2="148" y2="50"  stroke="#6366f1" stroke-width="2"/>
  <!-- open circle at hole -->
  <circle cx="80" cy="88" r="5" fill="none" stroke="#6366f1" stroke-width="2"/>
  <!-- filled dot at wrong height -->
  <circle cx="80" cy="120" r="4" fill="#6366f1"/>
  <!-- x = c dashed -->
  <line x1="80" y1="55" x2="80" y2="175" stroke="#6366f1" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="80" y="185" font-size="9" fill="#6366f1" text-anchor="middle">c</text>
  <text x="80" y="205" font-size="8" fill="#6366f1" text-anchor="middle">lim ≠ f(c) — patch by redefining</text>

  <!-- ===== PANEL 2: Jump ===== -->
  <line x1="165" y1="30" x2="165" y2="210" stroke="#e2e8f0" stroke-width="1"/>
  <text x="245" y="35"  font-size="9" fill="#ef4444" text-anchor="middle" font-weight="700">Jump</text>
  <text x="245" y="47"  font-size="8" class="mu"    text-anchor="middle">lim⁻ ≠ lim⁺</text>
  <line x1="175" y1="170" x2="315" y2="170" class="ax" stroke-width="1.2"/>
  <line x1="175" y1="55"  x2="175" y2="173" class="ax" stroke-width="1.2"/>
  <!-- left piece: rises to y=90 -->
  <line x1="175" y1="155" x2="238" y2="90" stroke="#ef4444" stroke-width="2"/>
  <!-- right piece: starts lower at y=130 -->
  <line x1="252" y1="130" x2="313" y2="80" stroke="#ef4444" stroke-width="2"/>
  <!-- open dots on jump -->
  <circle cx="245" cy="90"  r="5" fill="none" stroke="#ef4444" stroke-width="2"/>
  <circle cx="245" cy="130" r="5" fill="none" stroke="#ef4444" stroke-width="2"/>
  <!-- x = c dashed -->
  <line x1="245" y1="55" x2="245" y2="175" stroke="#ef4444" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="245" y="185" font-size="9" fill="#ef4444" text-anchor="middle">c</text>
  <text x="245" y="205" font-size="8" fill="#ef4444" text-anchor="middle">Cannot be patched — genuine break</text>

  <!-- ===== PANEL 3: Infinite ===== -->
  <line x1="325" y1="30" x2="325" y2="210" stroke="#e2e8f0" stroke-width="1"/>
  <text x="405" y="35"  font-size="9" fill="#f59e0b" text-anchor="middle" font-weight="700">Infinite</text>
  <text x="405" y="47"  font-size="8" class="mu"    text-anchor="middle">f(x) → ±∞</text>
  <line x1="335" y1="170" x2="468" y2="170" class="ax" stroke-width="1.2"/>
  <line x1="335" y1="55"  x2="335" y2="173" class="ax" stroke-width="1.2"/>
  <!-- left: 1/x goes to -∞ as x→0⁻ -->
  <path d="M 335,155 C 355,155 360,170 370,170 C 375,170 378,172 380,175" fill="none" stroke="#f59e0b" stroke-width="2"/>
  <!-- right: 1/x from top -->
  <path d="M 400,55 C 402,60 405,70 410,90 C 420,120 440,155 465,168" fill="none" stroke="#f59e0b" stroke-width="2"/>
  <!-- vertical asymptote dashed -->
  <line x1="390" y1="55" x2="390" y2="175" stroke="#f59e0b" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="390" y="185" font-size="9" fill="#f59e0b" text-anchor="middle">c</text>
  <!-- arrows up/down -->
  <polygon points="386,62 390,55 394,62" fill="#f59e0b"/>
  <polygon points="386,178 390,185 394,178" fill="#f59e0b"/>
  <text x="405" y="205" font-size="8" fill="#f59e0b" text-anchor="middle">Vertical asymptote — lim = ±∞</text>
</svg>
