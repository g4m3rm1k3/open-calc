<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" style="font-family: ui-monospace, monospace; border-radius: 12px;">
  <style>.bg{fill:rgb(var(--tw-custom-slate-50))}.dark .bg{fill:rgb(var(--tw-custom-slate-900))}</style>
  <rect width="480" height="200" rx="12" class="bg"/>
  <text x="240" y="16" font-size="11" fill="#4338ca" text-anchor="middle" font-weight="700">Ratio Test and Root Test</text>
  <rect x="8" y="24" width="228" height="170" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="122" y="42" font-size="9" fill="#4338ca" text-anchor="middle" font-weight="700">Ratio Test</text>
  <rect x="16" y="48" width="212" height="22" rx="3" fill="#dbeafe"/>
  <text x="122" y="63" font-size="8" fill="#1d4ed8" text-anchor="middle">L = lim |aₙ₊₁/aₙ| as n→∞</text>
  <rect x="16" y="76" width="212" height="18" rx="3" fill="#dcfce7"/>
  <text x="122" y="89" font-size="8" fill="#166534" text-anchor="middle">L &lt; 1 → CONVERGES absolutely</text>
  <rect x="16" y="98" width="212" height="18" rx="3" fill="#fee2e2"/>
  <text x="122" y="111" font-size="8" fill="#dc2626" text-anchor="middle">L &gt; 1 → DIVERGES</text>
  <rect x="16" y="120" width="212" height="18" rx="3" fill="#fef3c7"/>
  <text x="122" y="133" font-size="8" fill="#92400e" text-anchor="middle">L = 1 → INCONCLUSIVE</text>
  <text x="122" y="154" font-size="8" fill="#374151" text-anchor="middle">Best for factorials + exponentials</text>
  <text x="122" y="168" font-size="8" fill="#374151" text-anchor="middle">Example: Σ n!/3ⁿ  L=∞ → diverges</text>
  <text x="122" y="182" font-size="8" fill="#374151" text-anchor="middle">Example: Σ 1/n!  L=0 → converges</text>
  <rect x="244" y="24" width="228" height="170" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="358" y="42" font-size="9" fill="#166534" text-anchor="middle" font-weight="700">Root Test</text>
  <rect x="252" y="48" width="212" height="22" rx="3" fill="#bbf7d0"/>
  <text x="358" y="63" font-size="8" fill="#14532d" text-anchor="middle">L = lim ⁿ√|aₙ| = lim |aₙ|^(1/n)</text>
  <rect x="252" y="76" width="212" height="18" rx="3" fill="#dcfce7"/>
  <text x="358" y="89" font-size="8" fill="#166534" text-anchor="middle">L &lt; 1 → CONVERGES absolutely</text>
  <rect x="252" y="98" width="212" height="18" rx="3" fill="#fee2e2"/>
  <text x="358" y="111" font-size="8" fill="#dc2626" text-anchor="middle">L &gt; 1 → DIVERGES</text>
  <rect x="252" y="120" width="212" height="18" rx="3" fill="#fef3c7"/>
  <text x="358" y="133" font-size="8" fill="#92400e" text-anchor="middle">L = 1 → INCONCLUSIVE</text>
  <text x="358" y="154" font-size="8" fill="#374151" text-anchor="middle">Best when aₙ = (f(n))ⁿ</text>
  <text x="358" y="168" font-size="8" fill="#374151" text-anchor="middle">Example: Σ (n/(n+1))ⁿ</text>
  <text x="358" y="182" font-size="8" fill="#374151" text-anchor="middle">L = 1/e &lt; 1 → converges</text>
</svg>
