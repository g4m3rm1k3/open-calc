<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" style="font-family: ui-monospace, monospace; border-radius: 12px;">
  <style>.bg{fill:rgb(var(--tw-custom-slate-50))}.dark .bg{fill:rgb(var(--tw-custom-slate-900))}</style>
  <rect width="480" height="200" rx="12" class="bg"/>
  <text x="240" y="16" font-size="11" fill="#4338ca" text-anchor="middle" font-weight="700">MVT for Integrals — Average Value Rectangle</text>
  <rect x="8" y="22" width="270" height="172" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="28" y1="166" x2="270" y2="166" stroke="#64748b" stroke-width="1"/>
  <line x1="28" y1="28" x2="28" y2="170" stroke="#64748b" stroke-width="1"/>
  <!-- Shaded integral area -->
  <path d="M 55,166 L 55,118 Q 80,88 110,68 Q 135,54 155,50 Q 175,46 200,46 Q 215,46 225,48 L 225,166 Z" fill="#6366f1" opacity="0.15"/>
  <!-- Curve -->
  <path d="M 35,148 Q 55,130 80,104 Q 110,76 140,60 Q 165,48 190,44 Q 210,42 235,44 Q 250,46 260,50" fill="none" stroke="#6366f1" stroke-width="2.5"/>
  <!-- Average value rectangle -->
  <rect x="55" y="88" width="170" height="78" fill="#f59e0b" opacity="0.2" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 2"/>
  <line x1="28" y1="88" x2="260" y2="88" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="24" y="88" font-size="8" fill="#b45309" text-anchor="end">f_avg</text>
  <!-- Point c where f(c) = average -->
  <circle cx="130" cy="64" r="5" fill="#ef4444"/>
  <line x1="130" y1="88" x2="130" y2="64" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3 2"/>
  <line x1="130" y1="161" x2="130" y2="170" stroke="#ef4444" stroke-width="1.5"/>
  <text x="130" y="182" font-size="8.5" fill="#ef4444" text-anchor="middle">c</text>
  <text x="148" y="60" font-size="8" fill="#ef4444">f(c)=f_avg</text>
  <!-- a, b markers -->
  <text x="55" y="182" font-size="8.5" fill="#4338ca" text-anchor="middle">a</text>
  <text x="225" y="182" font-size="8.5" fill="#4338ca" text-anchor="middle">b</text>
  <!-- Right panel -->
  <rect x="286" y="26" width="186" height="168" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="379" y="46" font-size="8.5" fill="#4338ca" text-anchor="middle" font-weight="700">MVT for Integrals</text>
  <rect x="294" y="52" width="170" height="30" rx="4" fill="#dbeafe"/>
  <text x="379" y="66" font-size="8.5" fill="#1d4ed8" text-anchor="middle" font-weight="700">f_avg = 1/(b−a) ∫ₐᵇ f dx</text>
  <text x="379" y="80" font-size="7.5" fill="#1e40af" text-anchor="middle">average value formula</text>
  <text x="379" y="100" font-size="8" fill="#4338ca" text-anchor="middle">∃ c in (a,b) where</text>
  <rect x="294" y="106" width="170" height="22" rx="4" fill="#dcfce7"/>
  <text x="379" y="121" font-size="8.5" fill="#166534" text-anchor="middle" font-weight="700">f(c) = f_avg</text>
  <text x="379" y="142" font-size="8" fill="#4338ca" text-anchor="middle">The average-value rectangle</text>
  <text x="379" y="156" font-size="8" fill="#4338ca" text-anchor="middle">has the same area as the</text>
  <text x="379" y="170" font-size="8" fill="#4338ca" text-anchor="middle">region under the curve</text>
  <text x="379" y="186" font-size="7.5" fill="#f59e0b" text-anchor="middle">orange rectangle = purple area</text>
</svg>
