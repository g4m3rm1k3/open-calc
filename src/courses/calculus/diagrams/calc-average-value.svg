<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" style="font-family: ui-monospace, monospace; border-radius: 12px;">
  <style>.bg{fill:rgb(var(--tw-custom-slate-50))}.dark .bg{fill:rgb(var(--tw-custom-slate-900))}</style>
  <rect width="480" height="200" rx="12" class="bg"/>
  <text x="240" y="16" font-size="11" fill="#4338ca" text-anchor="middle" font-weight="700">Average Value — Equal-Area Rectangle</text>
  <rect x="8" y="22" width="290" height="172" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="28" y1="165" x2="290" y2="165" stroke="#64748b" stroke-width="1"/>
  <line x1="28" y1="28" x2="28" y2="169" stroke="#64748b" stroke-width="1"/>
  <!-- Shaded integral area under wavy curve -->
  <path d="M 50,165 L 50,100 Q 70,72 95,60 Q 120,50 145,55 Q 165,62 180,80 Q 198,100 215,115 Q 235,130 255,135 L 255,165 Z" fill="#6366f1" opacity="0.15"/>
  <!-- Curve -->
  <path d="M 35,150 Q 55,125 80,100 Q 105,78 130,68 Q 155,58 175,64 Q 195,74 212,92 Q 232,110 252,128 Q 266,140 280,148" fill="none" stroke="#6366f1" stroke-width="2.5"/>
  <!-- Average value line -->
  <line x1="50" y1="97" x2="255" y2="97" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 2"/>
  <!-- Average height rectangle -->
  <rect x="50" y="97" width="205" height="68" fill="#f59e0b" opacity="0.15" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 2"/>
  <!-- Labels -->
  <text x="26" y="100" font-size="8" fill="#b45309" text-anchor="end">f_avg</text>
  <text x="50" y="182" font-size="9" fill="#4338ca" text-anchor="middle">a</text>
  <text x="255" y="182" font-size="9" fill="#4338ca" text-anchor="middle">b</text>
  <text x="152" y="140" font-size="9" fill="#f59e0b" text-anchor="middle">rectangle area = integral</text>
  <!-- Right panel -->
  <rect x="306" y="26" width="166" height="168" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="389" y="46" font-size="8.5" fill="#4338ca" text-anchor="middle" font-weight="700">Average Value Formula</text>
  <rect x="314" y="52" width="150" height="30" rx="4" fill="#dbeafe"/>
  <text x="389" y="66" font-size="8.5" fill="#1d4ed8" text-anchor="middle" font-weight="700">f_avg = 1/(b−a) ∫ₐᵇ f(x) dx</text>
  <text x="389" y="82" font-size="7.5" fill="#1e40af" text-anchor="middle">= integral ÷ interval length</text>
  <text x="389" y="102" font-size="8" fill="#4338ca" text-anchor="middle">Example: f(x) = x² on [0,3]</text>
  <text x="389" y="118" font-size="8" fill="#4338ca" text-anchor="middle">∫₀³ x² dx = 9</text>
  <text x="389" y="132" font-size="8" fill="#4338ca" text-anchor="middle">f_avg = 9/(3−0) = 3</text>
  <rect x="314" y="142" width="150" height="44" rx="4" fill="#dcfce7"/>
  <text x="389" y="158" font-size="8" fill="#166534" text-anchor="middle">MVT guarantees some c</text>
  <text x="389" y="172" font-size="8" fill="#166534" text-anchor="middle">in (a,b) where</text>
  <text x="389" y="186" font-size="8.5" fill="#059669" text-anchor="middle" font-weight="700">f(c) = f_avg</text>
</svg>
