<svg viewBox="0 0 480 220" xmlns="http://www.w3.org/2000/svg" style="font-family: ui-monospace, monospace; border-radius: 12px;">
  <style>
    .bg  { fill: rgb(var(--tw-custom-slate-50)); }
    .ax  { stroke: rgb(var(--tw-custom-slate-400)); }
    .axf { fill: rgb(var(--tw-custom-slate-400)); }
    .mu  { fill: rgb(var(--tw-custom-slate-500)); }
    .dark .bg  { fill: rgb(var(--tw-custom-slate-900)); }
    .dark .ax  { stroke: rgb(var(--tw-custom-slate-600)); }
    .dark .axf { fill: rgb(var(--tw-custom-slate-600)); }
    .dark .mu  { fill: rgb(var(--tw-custom-slate-400)); }
  </style>
  <rect width="480" height="220" rx="12" class="bg"/>

  <text x="240" y="18" font-size="11" fill="#4338ca" text-anchor="middle" font-weight="700">Limits at Infinity — Three Cases for Rational Functions</text>

  <!-- Common legend: degree comparison -->
  <rect x="16" y="24" width="448" height="20" rx="4" fill="#eef2ff"/>
  <text x="240" y="38" font-size="8.5" fill="#4338ca" text-anchor="middle">Compare the degree of numerator (n) vs. denominator (d) — this determines the limit as x → ∞</text>

  <!-- CASE 1: n < d → limit = 0 -->
  <text x="80"  y="58" font-size="9" fill="#059669" text-anchor="middle" font-weight="700">n &lt; d → limit = 0</text>
  <text x="80"  y="70" font-size="8" class="mu"    text-anchor="middle">denominator wins</text>

  <line x1="16"  y1="155" x2="155" y2="155" class="ax" stroke-width="1.2"/>
  <line x1="16"  y1="70"  x2="16"  y2="158" class="ax" stroke-width="1.2"/>

  <!-- y=1/x: starts high at small x, flattens to y=0 -->
  <path d="M 30,75 C 40,90 60,120 90,140 C 115,152 135,155 154,155"
        fill="none" stroke="#059669" stroke-width="2.5"/>
  <!-- Horizontal asymptote y=0 -->
  <line x1="16" y1="155" x2="155" y2="155" stroke="#059669" stroke-width="1" stroke-dasharray="5,4" opacity="0.5"/>
  <text x="80" y="175" font-size="9" fill="#059669" text-anchor="middle">y = 1/x → 0</text>
  <text x="80" y="186" font-size="8" fill="#059669" text-anchor="middle">H. asymptote y = 0</text>

  <!-- DIVIDER 1 -->
  <line x1="163" y1="48" x2="163" y2="200" stroke="#e2e8f0" stroke-width="1"/>

  <!-- CASE 2: n = d → limit = leading coeff ratio -->
  <text x="245" y="58" font-size="9" fill="#6366f1" text-anchor="middle" font-weight="700">n = d → limit = a/b</text>
  <text x="245" y="70" font-size="8" class="mu"    text-anchor="middle">leading coefficients win</text>

  <line x1="172" y1="155" x2="318" y2="155" class="ax" stroke-width="1.2"/>
  <line x1="172" y1="70"  x2="172" y2="158" class="ax" stroke-width="1.2"/>

  <!-- y = 3x/(x+1) → 3: starts low, rises to asymptote at y=3 -->
  <!-- At x=0: 0; x=1: 1.5; x=2: 2; x=5: 2.5; x=10: 2.73; x=∞: 3 -->
  <!-- SVGx = 172 + (x+0.5)*13, SVGy = 155 - y*26 -->
  <path d="M 172,155 C 182,148 195,138 210,130 C 225,124 240,119 265,114 C 285,111 305,108 316,107"
        fill="none" stroke="#6366f1" stroke-width="2.5"/>
  <!-- Horizontal asymptote y=3 → SVGy = 155-3*26 = 77 -->
  <line x1="172" y1="77" x2="316" y2="77" stroke="#6366f1" stroke-width="1" stroke-dasharray="5,4" opacity="0.5"/>
  <text x="245" y="175" font-size="9" fill="#6366f1" text-anchor="middle">y = 3x/(x+1) → 3</text>
  <text x="245" y="186" font-size="8" fill="#6366f1" text-anchor="middle">H. asymptote y = a/b = 3</text>

  <!-- DIVIDER 2 -->
  <line x1="325" y1="48" x2="325" y2="200" stroke="#e2e8f0" stroke-width="1"/>

  <!-- CASE 3: n > d → limit = ±∞ -->
  <text x="405" y="58" font-size="9" fill="#ef4444" text-anchor="middle" font-weight="700">n &gt; d → limit = ±∞</text>
  <text x="405" y="70" font-size="8" class="mu"    text-anchor="middle">numerator wins</text>

  <line x1="332" y1="155" x2="472" y2="155" class="ax" stroke-width="1.2"/>
  <line x1="332" y1="70"  x2="332" y2="158" class="ax" stroke-width="1.2"/>

  <!-- y = x²/(x+1) ≈ x for large x — parabolic growth -->
  <path d="M 332,155 C 342,148 355,138 370,124 C 388,107 408,85 428,68 C 445,55 462,48 472,46"
        fill="none" stroke="#ef4444" stroke-width="2.5"/>
  <!-- No asymptote arrow pointing up -->
  <polygon points="466,50 470,44 474,50" fill="#ef4444"/>

  <text x="405" y="175" font-size="9" fill="#ef4444" text-anchor="middle">y = x²/(x+1) → ∞</text>
  <text x="405" y="186" font-size="8" fill="#ef4444" text-anchor="middle">no H. asymptote</text>

  <!-- Technique reminder -->
  <rect x="16" y="196" width="448" height="18" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="240" y="209" font-size="8.5" class="mu" text-anchor="middle">Technique: divide ALL terms by x^d (highest power in denominator); terms with 1/x^k → 0 as x → ∞</text>
</svg>
