<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" style="font-family: ui-monospace, monospace; border-radius: 12px;">
  <style>.bg{fill:rgb(var(--tw-custom-slate-50))}.dark .bg{fill:rgb(var(--tw-custom-slate-900))}</style>
  <rect width="480" height="200" rx="12" class="bg"/>
  <text x="240" y="16" font-size="11" fill="#4338ca" text-anchor="middle" font-weight="700">Linear Approximation — Accuracy vs Distance</text>
  <rect x="8" y="22" width="464" height="172" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <!-- Axes -->
  <line x1="30" y1="170" x2="460" y2="170" stroke="#64748b" stroke-width="1"/>
  <line x1="30" y1="30" x2="30" y2="174" stroke="#64748b" stroke-width="1"/>
  <!-- Curve (parabola-ish) -->
  <path d="M 40,165 Q 100,145 160,115 Q 200,96 240,82 Q 280,70 320,62 Q 360,56 420,52" fill="none" stroke="#6366f1" stroke-width="2.5"/>
  <!-- Tangent line at a=240 -->
  <line x1="60" y1="120" x2="430" y2="52" stroke="#ef4444" stroke-width="2" stroke-dasharray="5 3"/>
  <!-- Contact point -->
  <circle cx="240" cy="82" r="7" fill="#059669"/>
  <line x1="240" y1="165" x2="240" y2="175" stroke="#059669" stroke-width="1.5"/>
  <text x="240" y="188" font-size="8.5" fill="#059669" text-anchor="middle">a</text>
  <!-- Zone annotations -->
  <rect x="160" y="30" width="160" height="16" rx="3" fill="#dcfce7" opacity="0.8"/>
  <text x="240" y="41" font-size="7.5" fill="#166534" text-anchor="middle">GOOD — close to a</text>
  <!-- Error arrows at x1 -->
  <circle cx="320" cy="62" r="4" fill="#6366f1"/>
  <circle cx="320" cy="56" r="4" fill="#ef4444"/>
  <line x1="314" y1="56" x2="314" y2="62" stroke="#f59e0b" stroke-width="2"/>
  <text x="328" y="52" font-size="7.5" fill="#ef4444">L(x₁)</text>
  <text x="328" y="66" font-size="7.5" fill="#6366f1">f(x₁)</text>
  <text x="292" y="80" font-size="7" fill="#b45309">small error</text>
  <!-- Error arrows at x2 -->
  <circle cx="420" cy="52" r="4" fill="#6366f1"/>
  <circle cx="420" cy="38" r="4" fill="#ef4444"/>
  <line x1="414" y1="38" x2="414" y2="52" stroke="#ef4444" stroke-width="2.5"/>
  <text x="428" y="38" font-size="7.5" fill="#ef4444">L(x₂)</text>
  <text x="428" y="56" font-size="7.5" fill="#6366f1">f(x₂)</text>
  <text x="392" y="78" font-size="7" fill="#dc2626">BIG error</text>
  <!-- Key insight box -->
  <rect x="38" y="100" width="148" height="60" rx="5" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="112" y="118" font-size="8" fill="#92400e" text-anchor="middle" font-weight="700">Key Insight</text>
  <text x="112" y="132" font-size="7.5" fill="#78350f" text-anchor="middle">Error grows as |x−a|</text>
  <text x="112" y="146" font-size="7.5" fill="#78350f" text-anchor="middle">increases — tangent line</text>
  <text x="112" y="158" font-size="7.5" fill="#78350f" text-anchor="middle">drifts from curve</text>
</svg>
