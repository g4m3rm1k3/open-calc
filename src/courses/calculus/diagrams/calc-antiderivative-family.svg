<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" style="font-family: ui-monospace, monospace; border-radius: 12px;">
  <style>.bg{fill:rgb(var(--tw-custom-slate-50))}.dark .bg{fill:rgb(var(--tw-custom-slate-900))}</style>
  <rect width="480" height="200" rx="12" class="bg"/>
  <text x="240" y="16" font-size="11" fill="#4338ca" text-anchor="middle" font-weight="700">Antiderivative Family — All Differ by a Constant</text>
  <rect x="8" y="22" width="290" height="172" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="28" y1="165" x2="290" y2="165" stroke="#64748b" stroke-width="1"/>
  <line x1="28" y1="28" x2="28" y2="168" stroke="#64748b" stroke-width="1"/>
  <!-- Family of curves: x^2 + C -->
  <path d="M 38,162 Q 80,140 130,100 Q 160,80 190,62 Q 220,46 250,38 Q 268,32 285,30" fill="none" stroke="#6366f1" stroke-width="2"/>
  <text x="284" y="30" font-size="8" fill="#6366f1">C=0</text>
  <path d="M 38,148 Q 80,126 130,86 Q 160,66 190,48 Q 210,36 230,28" fill="none" stroke="#3b82f6" stroke-width="2"/>
  <text x="234" y="28" font-size="8" fill="#3b82f6">C=−1</text>
  <path d="M 52,162 Q 90,148 130,120 Q 160,100 190,82 Q 220,66 250,58" fill="none" stroke="#8b5cf6" stroke-width="2"/>
  <text x="252" y="60" font-size="8" fill="#8b5cf6">C=+1</text>
  <path d="M 75,162 Q 110,155 130,146 Q 150,136 190,116 Q 220,100 255,90" fill="none" stroke="#ec4899" stroke-width="2"/>
  <text x="258" y="92" font-size="8" fill="#ec4899">C=+2</text>
  <path d="M 28,145 Q 55,130 80,104 Q 110,68 140,48 Q 165,32 190,26" fill="none" stroke="#ef4444" stroke-width="2"/>
  <text x="192" y="26" font-size="8" fill="#ef4444">C=−2</text>
  <text x="160" y="185" font-size="8" fill="#94a3b8" text-anchor="middle">x</text>
  <!-- Formula panel -->
  <rect x="306" y="22" width="166" height="172" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="389" y="44" font-size="8.5" fill="#4338ca" text-anchor="middle" font-weight="700">Antiderivative Family</text>
  <rect x="314" y="50" width="150" height="32" rx="4" fill="#dbeafe"/>
  <text x="389" y="66" font-size="8.5" fill="#1d4ed8" text-anchor="middle" font-weight="700">∫ f(x) dx = F(x) + C</text>
  <text x="389" y="80" font-size="7.5" fill="#1e40af" text-anchor="middle">C = arbitrary constant</text>
  <text x="389" y="100" font-size="8" fill="#4338ca" text-anchor="middle">Example: f(x) = 2x</text>
  <text x="389" y="116" font-size="8" fill="#4338ca" text-anchor="middle">F(x) = x² + C</text>
  <line x1="314" y1="128" x2="462" y2="128" stroke="#cbd5e1" stroke-width="1"/>
  <text x="389" y="146" font-size="8" fill="#4338ca" text-anchor="middle">All curves are vertical</text>
  <text x="389" y="160" font-size="8" fill="#4338ca" text-anchor="middle">shifts of each other</text>
  <text x="389" y="176" font-size="8" fill="#059669" text-anchor="middle">Same derivative: 2x</text>
</svg>
