<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" style="font-family: ui-monospace, monospace; border-radius: 12px;">
  <style>.bg{fill:rgb(var(--tw-custom-slate-50))}.dark .bg{fill:rgb(var(--tw-custom-slate-900))}</style>
  <rect width="480" height="200" rx="12" class="bg"/>
  <text x="240" y="16" font-size="11" fill="#4338ca" text-anchor="middle" font-weight="700">Pythagorean Identities — Three Forms</text>
  <!-- Unit circle diagram -->
  <rect x="8" y="24" width="180" height="170" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="98" y="40" font-size="8.5" fill="#4338ca" text-anchor="middle" font-weight="700">Unit Circle</text>
  <circle cx="98" cy="115" r="60" fill="none" stroke="#6366f1" stroke-width="2"/>
  <!-- Point at 60 degrees -->
  <line x1="98" y1="115" x2="128" y2="63" stroke="#374151" stroke-width="1.5"/>
  <!-- cos and sin legs -->
  <line x1="98" y1="115" x2="128" y2="115" stroke="#ef4444" stroke-width="2"/>
  <line x1="128" y1="115" x2="128" y2="63" stroke="#22c55e" stroke-width="2"/>
  <text x="113" y="128" font-size="8" fill="#ef4444">cos θ</text>
  <text x="132" y="92" font-size="8" fill="#22c55e">sin θ</text>
  <text x="108" y="90" font-size="8" fill="#374151">1</text>
  <!-- Angle arc -->
  <path d="M 118 115 A 20 20 0 0 1 110 98" fill="none" stroke="#6366f1" stroke-width="1.5"/>
  <text x="120" y="100" font-size="8" fill="#6366f1">θ</text>
  <text x="98" y="185" font-size="8" fill="#374151" text-anchor="middle">cos²θ + sin²θ = 1</text>
  <!-- Right panel: three forms -->
  <rect x="196" y="24" width="276" height="170" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="334" y="42" font-size="9" fill="#4338ca" text-anchor="middle" font-weight="700">All Three Pythagorean Identities</text>
  <rect x="204" y="50" width="260" height="34" rx="4" fill="#dbeafe"/>
  <text x="334" y="64" font-size="9" fill="#1d4ed8" text-anchor="middle" font-weight="700">sin²θ + cos²θ = 1</text>
  <text x="334" y="78" font-size="8" fill="#374151" text-anchor="middle">divide by cos²θ → tan²θ + 1 = sec²θ</text>
  <rect x="204" y="88" width="260" height="34" rx="4" fill="#dcfce7"/>
  <text x="334" y="102" font-size="9" fill="#166534" text-anchor="middle" font-weight="700">tan²θ + 1 = sec²θ</text>
  <text x="334" y="116" font-size="8" fill="#374151" text-anchor="middle">divide by sin²θ → 1 + cot²θ = csc²θ</text>
  <rect x="204" y="126" width="260" height="34" rx="4" fill="#fef3c7"/>
  <text x="334" y="140" font-size="9" fill="#92400e" text-anchor="middle" font-weight="700">1 + cot²θ = csc²θ</text>
  <text x="334" y="154" font-size="8" fill="#374151" text-anchor="middle">from dividing sin²+cos²=1 by sin²θ</text>
  <rect x="204" y="166" width="260" height="24" rx="4" fill="#fce7f3"/>
  <text x="334" y="180" font-size="8" fill="#be185d" text-anchor="middle">Calculus: used to simplify integrals involving trig powers</text>
</svg>
