<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" style="font-family: ui-monospace, monospace; border-radius: 12px;">
  <style>.bg{fill:rgb(var(--tw-custom-slate-50))}.dark .bg{fill:rgb(var(--tw-custom-slate-900))}</style>
  <rect width="480" height="200" rx="12" class="bg"/>
  <text x="240" y="16" font-size="11" fill="#4338ca" text-anchor="middle" font-weight="700">Geometric Series</text>
  <rect x="8" y="24" width="464" height="36" rx="6" fill="#dbeafe" stroke="#6366f1" stroke-width="1.5"/>
  <text x="240" y="40" font-size="9" fill="#1d4ed8" text-anchor="middle" font-weight="700">Σₙ₌₀^∞ arⁿ = a/(1−r)  if |r| &lt; 1  (diverges if |r| ≥ 1)</text>
  <text x="240" y="54" font-size="8" fill="#4338ca" text-anchor="middle">Partial sum: Sₙ = a(1−rⁿ)/(1−r) → a/(1−r) as n→∞</text>
  <!-- Visual: Bar areas halving -->
  <rect x="8" y="70" width="240" height="124" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="128" y="86" font-size="8" fill="#374151" text-anchor="middle">Unit square sliced: a=1, r=1/2</text>
  <rect x="20" y="92" width="100" height="90" fill="#6366f1" opacity="0.7"/>
  <rect x="120" y="92" width="50" height="90" fill="#6366f1" opacity="0.5"/>
  <rect x="170" y="92" width="25" height="90" fill="#6366f1" opacity="0.35"/>
  <rect x="195" y="92" width="12" height="90" fill="#6366f1" opacity="0.25"/>
  <rect x="207" y="92" width="6" height="90" fill="#6366f1" opacity="0.2"/>
  <text x="70" y="142" font-size="7" fill="white" text-anchor="middle">1</text>
  <text x="145" y="142" font-size="7" fill="white" text-anchor="middle">½</text>
  <text x="183" y="142" font-size="7" fill="white" text-anchor="middle">¼</text>
  <text x="128" y="178" font-size="7.5" fill="#4338ca" text-anchor="middle">Sum = 1+½+¼+⅛+… = 2</text>
  <!-- Formula examples -->
  <rect x="256" y="70" width="216" height="124" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="364" y="88" font-size="8" fill="#4338ca" text-anchor="middle" font-weight="700">Examples</text>
  <rect x="264" y="94" width="200" height="22" rx="3" fill="#dbeafe"/>
  <text x="364" y="109" font-size="8" fill="#1d4ed8" text-anchor="middle">Σ(1/3)ⁿ = 1/(1−1/3) = 3/2</text>
  <rect x="264" y="120" width="200" height="22" rx="3" fill="#dcfce7"/>
  <text x="364" y="135" font-size="8" fill="#166534" text-anchor="middle">Σ 2·(0.9)ⁿ = 2/(1−0.9) = 20</text>
  <rect x="264" y="146" width="200" height="22" rx="3" fill="#fef3c7"/>
  <text x="364" y="161" font-size="8" fill="#92400e" text-anchor="middle">Σ(−1/2)ⁿ = 1/(3/2) = 2/3</text>
  <text x="364" y="184" font-size="7.5" fill="#374151" text-anchor="middle">Key: |r| &lt; 1 is the ONLY requirement</text>
</svg>
