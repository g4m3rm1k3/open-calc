<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" style="font-family: ui-monospace, monospace; border-radius: 12px;">
  <style>.bg{fill:rgb(var(--tw-custom-slate-50))}.dark .bg{fill:rgb(var(--tw-custom-slate-900))}</style>
  <rect width="480" height="200" rx="12" class="bg"/>
  <text x="240" y="16" font-size="11" fill="#4338ca" text-anchor="middle" font-weight="700">Taylor Remainder — Error Bound</text>
  <rect x="8" y="24" width="464" height="38" rx="6" fill="#dbeafe" stroke="#6366f1" stroke-width="1.5"/>
  <text x="240" y="40" font-size="8.5" fill="#1d4ed8" text-anchor="middle" font-weight="700">|Rₙ(x)| ≤ M · |x−a|ⁿ⁺¹ / (n+1)!</text>
  <text x="240" y="56" font-size="8" fill="#374151" text-anchor="middle">where M = max |f⁽ⁿ⁺¹⁾(t)| for t between a and x</text>
  <!-- Diagram: function vs polynomial -->
  <rect x="8" y="70" width="250" height="124" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="20" y1="168" x2="248" y2="168" stroke="#94a3b8" stroke-width="1"/>
  <line x1="60" y1="80" x2="60" y2="172" stroke="#94a3b8" stroke-width="1"/>
  <text x="60" y="176" font-size="7.5" fill="#374151" text-anchor="middle">a</text>
  <!-- True function curve -->
  <path d="M 60,140 Q 90,120 130,100 Q 160,85 200,78 Q 220,76 245,75" fill="none" stroke="#6366f1" stroke-width="2"/>
  <!-- T₁ linear -->
  <line x1="60" y1="140" x2="245" y2="95" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 2"/>
  <!-- T₃ cubic -->
  <path d="M 60,140 Q 100,108 140,98 Q 180,88 245,84" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="3 2"/>
  <!-- Error gap at x=200 -->
  <line x1="200" y1="78" x2="200" y2="86" stroke="#ef4444" stroke-width="2"/>
  <text x="218" y="82" font-size="7" fill="#ef4444">Rₙ</text>
  <text x="134" y="184" font-size="7.5" fill="#374151" text-anchor="middle">Error shrinks as n↑ or |x−a|↓</text>
  <!-- Legend -->
  <text x="75" y="92" font-size="7" fill="#6366f1">f(x)</text>
  <text x="150" y="140" font-size="7" fill="#f59e0b">T₁</text>
  <text x="175" y="130" font-size="7" fill="#22c55e">T₃</text>
  <!-- Right panel -->
  <rect x="266" y="70" width="206" height="124" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="369" y="88" font-size="8.5" fill="#4338ca" text-anchor="middle" font-weight="700">Worked Example</text>
  <text x="369" y="104" font-size="8" fill="#374151" text-anchor="middle">Approximate eˣ with T₃ at x=0.5</text>
  <rect x="274" y="110" width="190" height="22" rx="3" fill="#dbeafe"/>
  <text x="369" y="122" font-size="8" fill="#1d4ed8" text-anchor="middle">T₃ = 1+0.5+0.125+0.0208≈1.6458</text>
  <text x="369" y="140" font-size="8" fill="#374151" text-anchor="middle">True: e^0.5 ≈ 1.6487</text>
  <rect x="274" y="148" width="190" height="22" rx="3" fill="#dcfce7"/>
  <text x="369" y="160" font-size="8" fill="#166534" text-anchor="middle">|R₃| ≤ e^0.5 · (0.5)⁴/4! ≈ 0.0027</text>
  <text x="369" y="182" font-size="8" fill="#374151" text-anchor="middle">Actual error ≈ 0.0029 ✓</text>
</svg>
