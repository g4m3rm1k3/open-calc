<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" style="font-family: ui-monospace, monospace; border-radius: 12px;">
  <style>
    .bg { fill: rgb(var(--tw-custom-slate-50)); }
    .dark .bg { fill: rgb(var(--tw-custom-slate-900)); }
  </style>
  <rect width="480" height="200" rx="12" class="bg"/>
  <text x="240" y="16" font-size="11" fill="#4338ca" text-anchor="middle" font-weight="700">Sign Chart of f ′ — Reading the Derivative</text>

  <!-- Sign chart -->
  <rect x="10" y="22" width="460" height="60" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Number line -->
  <line x1="30" y1="62" x2="460" y2="62" stroke="#64748b" stroke-width="1.5"/>

  <!-- Critical points at x=1 and x=3 -->
  <line x1="170" y1="56" x2="170" y2="68" stroke="#dc2626" stroke-width="2"/>
  <line x1="330" y1="56" x2="330" y2="68" stroke="#dc2626" stroke-width="2"/>
  <text x="170" y="50" font-size="8.5" fill="#dc2626" text-anchor="middle">x = 1</text>
  <text x="330" y="50" font-size="8.5" fill="#dc2626" text-anchor="middle">x = 3</text>
  <text x="30" y="50" font-size="7.5" fill="#94a3b8">−∞</text>
  <text x="455" y="50" font-size="7.5" fill="#94a3b8">+∞</text>

  <!-- Signs of f' in each interval -->
  <text x="100" y="48" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="700">−</text>
  <text x="250" y="48" font-size="11" fill="#059669" text-anchor="middle" font-weight="700">+</text>
  <text x="395" y="48" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="700">−</text>

  <text x="170" y="78" font-size="7.5" fill="#94a3b8" text-anchor="middle">f ′ = 0</text>
  <text x="330" y="78" font-size="7.5" fill="#94a3b8" text-anchor="middle">f ′ = 0</text>

  <!-- Translation table -->
  <rect x="10" y="90" width="460" height="104" rx="8" fill="#1e1b4b"/>

  <!-- Row headers -->
  <text x="80" y="108" font-size="8.5" fill="#a5b4fc" text-anchor="middle" font-weight="700">Region</text>
  <text x="200" y="108" font-size="8.5" fill="#a5b4fc" text-anchor="middle" font-weight="700">Sign of f ′</text>
  <text x="320" y="108" font-size="8.5" fill="#a5b4fc" text-anchor="middle" font-weight="700">f is …</text>
  <text x="430" y="108" font-size="8.5" fill="#a5b4fc" text-anchor="middle" font-weight="700">Graph goes …</text>
  <line x1="10" y1="112" x2="470" y2="112" stroke="#312e81" stroke-width="1"/>
  <line x1="140" y1="90" x2="140" y2="194" stroke="#312e81" stroke-width="0.5"/>
  <line x1="260" y1="90" x2="260" y2="194" stroke="#312e81" stroke-width="0.5"/>
  <line x1="380" y1="90" x2="380" y2="194" stroke="#312e81" stroke-width="0.5"/>

  <text x="80" y="128" font-size="8" fill="#94a3b8" text-anchor="middle">x &lt; 1</text>
  <text x="200" y="128" font-size="10" fill="#f87171" text-anchor="middle" font-weight="700">−</text>
  <text x="320" y="128" font-size="8.5" fill="#f87171" text-anchor="middle">Decreasing ↓</text>
  <text x="430" y="128" font-size="8" fill="#94a3b8" text-anchor="middle">downhill ↘</text>
  <line x1="10" y1="134" x2="470" y2="134" stroke="#312e81" stroke-width="0.5"/>

  <text x="80" y="150" font-size="8" fill="#94a3b8" text-anchor="middle">1 &lt; x &lt; 3</text>
  <text x="200" y="150" font-size="10" fill="#4ade80" text-anchor="middle" font-weight="700">+</text>
  <text x="320" y="150" font-size="8.5" fill="#4ade80" text-anchor="middle">Increasing ↑</text>
  <text x="430" y="150" font-size="8" fill="#94a3b8" text-anchor="middle">uphill ↗</text>
  <line x1="10" y1="156" x2="470" y2="156" stroke="#312e81" stroke-width="0.5"/>

  <text x="80" y="172" font-size="8" fill="#94a3b8" text-anchor="middle">x &gt; 3</text>
  <text x="200" y="172" font-size="10" fill="#f87171" text-anchor="middle" font-weight="700">−</text>
  <text x="320" y="172" font-size="8.5" fill="#f87171" text-anchor="middle">Decreasing ↓</text>
  <text x="430" y="172" font-size="8" fill="#94a3b8" text-anchor="middle">downhill ↘</text>
  <line x1="10" y1="178" x2="470" y2="178" stroke="#312e81" stroke-width="0.5"/>

  <text x="240" y="191" font-size="8" fill="#a5b4fc" text-anchor="middle">At x=1: − → + means LOCAL MIN. At x=3: + → − means LOCAL MAX.</text>
</svg>
