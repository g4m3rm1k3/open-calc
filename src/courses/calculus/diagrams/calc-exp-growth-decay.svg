<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" style="font-family: ui-monospace, monospace; border-radius: 12px;">
  <style>.bg{fill:rgb(var(--tw-custom-slate-50))}.dark .bg{fill:rgb(var(--tw-custom-slate-900))}</style>
  <rect width="480" height="200" rx="12" class="bg"/>
  <text x="240" y="16" font-size="11" fill="#4338ca" text-anchor="middle" font-weight="700">Exponentials — Growth, Decay &amp; e</text>
  <!-- Left: graph panel -->
  <rect x="8" y="24" width="220" height="170" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="118" y="40" font-size="8.5" fill="#4338ca" text-anchor="middle" font-weight="700">y = aˣ curves</text>
  <!-- Axes -->
  <line x1="50" y1="30" x2="50" y2="188" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="14" y1="145" x2="222" y2="145" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="220" y="148" font-size="8" fill="#94a3b8">x</text>
  <text x="54" y="35" font-size="8" fill="#94a3b8">y</text>
  <!-- Growth curve: y = 2^x, passes through (0,1) at y=145, x=50 -->
  <!-- (−3,1/8),(−2,1/4),(−1,1/2),(0,1),(1,2),(2,4),(3,8) -->
  <!-- Scale: x unit = 28px, y unit = 18px upward from 145 -->
  <path d="M 14,143 C 22,142 30,140 50,138 C 70,133 85,120 112,100 C 138,78 155,55 190,32" fill="none" stroke="#6366f1" stroke-width="2.5"/>
  <!-- Decay: y = (1/2)^x -->
  <path d="M 14,32 C 50,55 65,78 90,100 C 115,120 130,133 150,138 C 170,140 190,142 222,143" fill="none" stroke="#ef4444" stroke-width="2.5"/>
  <!-- Labels -->
  <text x="175" y="44" font-size="8" fill="#6366f1">2ˣ (growth)</text>
  <text x="155" y="136" font-size="8" fill="#ef4444">(1/2)ˣ decay</text>
  <!-- Asymptote -->
  <line x1="14" y1="145" x2="222" y2="145" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="55" y="157" font-size="7.5" fill="#94a3b8">y=0 horizontal asymptote</text>
  <!-- y-intercept -->
  <circle cx="50" cy="138" r="4" fill="#374151"/>
  <text x="55" y="132" font-size="7.5" fill="#374151">(0,1)</text>
  <!-- Right panel -->
  <rect x="236" y="24" width="236" height="170" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="354" y="40" font-size="8.5" fill="#4338ca" text-anchor="middle" font-weight="700">The Number e ≈ 2.71828</text>
  <rect x="244" y="48" width="220" height="32" rx="4" fill="#dbeafe"/>
  <text x="354" y="62" font-size="8.5" fill="#1d4ed8" text-anchor="middle">e = lim (1+1/n)ⁿ as n→∞</text>
  <text x="354" y="76" font-size="8" fill="#374151" text-anchor="middle">natural base for calculus</text>
  <rect x="244" y="84" width="220" height="32" rx="4" fill="#dcfce7"/>
  <text x="354" y="98" font-size="9" fill="#166534" text-anchor="middle" font-weight="700">d/dx[eˣ] = eˣ  ← unique!</text>
  <text x="354" y="112" font-size="8" fill="#374151" text-anchor="middle">only function equal to its own derivative</text>
  <rect x="244" y="120" width="220" height="32" rx="4" fill="#fef3c7"/>
  <text x="354" y="134" font-size="8.5" fill="#92400e" text-anchor="middle" font-weight="700">Growth/Decay Model</text>
  <text x="354" y="148" font-size="8" fill="#374151" text-anchor="middle">A(t) = A₀ · eᵏᵗ (k&gt;0: growth, k&lt;0: decay)</text>
  <rect x="244" y="156" width="220" height="34" rx="4" fill="#fce7f3"/>
  <text x="354" y="170" font-size="8" fill="#be185d" text-anchor="middle">∫eˣ dx = eˣ + C</text>
  <text x="354" y="184" font-size="8" fill="#be185d" text-anchor="middle">∫eᵏˣ dx = (1/k)eᵏˣ + C</text>
</svg>
