<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" style="font-family: ui-monospace, monospace; border-radius: 12px;">
  <style>
    .bg  { fill: rgb(var(--tw-custom-slate-50)); }
    .mu  { fill: rgb(var(--tw-custom-slate-500)); }
    .tx  { fill: rgb(var(--tw-custom-slate-900)); }
    .dark .bg  { fill: rgb(var(--tw-custom-slate-900)); }
    .dark .mu  { fill: rgb(var(--tw-custom-slate-400)); }
    .dark .tx  { fill: rgb(var(--tw-custom-slate-200)); }
  </style>
  <rect width="480" height="200" rx="12" class="bg"/>

  <text x="240" y="16" font-size="11" fill="#4338ca" text-anchor="middle" font-weight="700">Local Linearity — Zoom In Far Enough and Any Curve Looks Straight</text>

  <!-- PANEL 1: Far away — clearly curved -->
  <rect x="10" y="24" width="138" height="134" rx="8" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5"/>
  <text x="79" y="39" font-size="8.5" fill="#0369a1" text-anchor="middle" font-weight="700">Far Away</text>
  <text x="79" y="50" font-size="7.5" fill="#64748b" text-anchor="middle">clearly curved</text>

  <!-- S-curve (visibly curved) -->
  <path d="M 18,148 Q 30,148 55,112 Q 80,76 105,60 Q 125,48 140,44" fill="none" stroke="#0284c7" stroke-width="2.5"/>

  <!-- Red dot at inflection -->
  <circle cx="80" cy="86" r="4" fill="#ef4444"/>

  <!-- Zoom box indicator -->
  <rect x="64" y="70" width="32" height="32" rx="3" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="79" y="164" font-size="8" class="mu" text-anchor="middle">f(x) = full view</text>

  <!-- Arrow 1 -->
  <defs>
    <marker id="z1" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto">
      <polygon points="0,0 8,3.5 0,7" fill="#ef4444"/>
    </marker>
  </defs>
  <line x1="152" y1="91" x2="172" y2="91" stroke="#ef4444" stroke-width="1.5" marker-end="url(#z1)"/>
  <text x="162" y="83" font-size="7" fill="#ef4444" text-anchor="middle">zoom</text>

  <!-- PANEL 2: Closer — still slightly curved -->
  <rect x="175" y="24" width="130" height="134" rx="8" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="240" y="39" font-size="8.5" fill="#92400e" text-anchor="middle" font-weight="700">Closer</text>
  <text x="240" y="50" font-size="7.5" fill="#64748b" text-anchor="middle">slightly curved</text>

  <!-- Gently curved path -->
  <path d="M 183,148 Q 210,130 240,86 Q 258,62 297,44" fill="none" stroke="#ca8a04" stroke-width="2.5"/>

  <!-- Red dot -->
  <circle cx="240" cy="86" r="4" fill="#ef4444"/>
  <rect x="224" y="70" width="32" height="32" rx="3" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="240" y="164" font-size="8" class="mu" text-anchor="middle">zoomed ×10</text>

  <!-- Arrow 2 -->
  <defs>
    <marker id="z2" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto">
      <polygon points="0,0 8,3.5 0,7" fill="#ef4444"/>
    </marker>
  </defs>
  <line x1="309" y1="91" x2="328" y2="91" stroke="#ef4444" stroke-width="1.5" marker-end="url(#z2)"/>
  <text x="319" y="83" font-size="7" fill="#ef4444" text-anchor="middle">zoom</text>

  <!-- PANEL 3: Very close — looks linear -->
  <rect x="332" y="24" width="138" height="134" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="401" y="39" font-size="8.5" fill="#15803d" text-anchor="middle" font-weight="700">Very Close</text>
  <text x="401" y="50" font-size="7.5" fill="#64748b" text-anchor="middle">looks linear!</text>

  <!-- Almost straight line -->
  <path d="M 340,148 Q 370,120 401,86 Q 420,65 462,44" fill="none" stroke="#16a34a" stroke-width="2.5"/>

  <!-- Red dot -->
  <circle cx="401" cy="86" r="4" fill="#ef4444"/>
  <text x="401" y="164" font-size="8" class="mu" text-anchor="middle">zoomed ×100</text>

  <!-- Formula at bottom -->
  <rect x="100" y="162" width="280" height="30" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="240" y="174" font-size="8" fill="#166534" text-anchor="middle">At the zoomed-in point, the tangent line IS the curve:</text>
  <text x="240" y="187" font-size="9" fill="#15803d" text-anchor="middle" font-weight="700">f(x+h) ≈ f(x) + f′(x)·h  for small h</text>
</svg>
