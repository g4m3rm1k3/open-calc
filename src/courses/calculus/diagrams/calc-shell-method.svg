<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" style="font-family: ui-monospace, monospace; border-radius: 12px;">
  <style>.bg{fill:rgb(var(--tw-custom-slate-50))}.dark .bg{fill:rgb(var(--tw-custom-slate-900))}</style>
  <rect width="480" height="200" rx="12" class="bg"/>
  <text x="240" y="16" font-size="11" fill="#4338ca" text-anchor="middle" font-weight="700">Shell Method — Cylindrical Shells</text>
  <rect x="8" y="22" width="250" height="172" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="28" y1="165" x2="250" y2="165" stroke="#64748b" stroke-width="1"/>
  <line x1="28" y1="28" x2="28" y2="169" stroke="#64748b" stroke-width="1"/>
  <!-- y-axis (rotation axis) at x=28 -->
  <line x1="28" y1="28" x2="28" y2="168" stroke="#ef4444" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="36" y="35" font-size="7.5" fill="#ef4444">axis</text>
  <!-- Curve -->
  <path d="M 45,165 Q 70,145 100,120 Q 125,100 150,82 Q 170,68 195,58 Q 212,52 230,50" fill="none" stroke="#6366f1" stroke-width="2.5"/>
  <!-- Shell at x=110 -->
  <rect x="100" y="120" width="20" height="45" fill="#22c55e" opacity="0.3" stroke="#22c55e" stroke-width="1.5"/>
  <!-- Radius arrow -->
  <line x1="28" y1="143" x2="100" y2="143" stroke="#6366f1" stroke-width="2"/>
  <text x="64" y="138" font-size="8.5" fill="#6366f1">r=x</text>
  <!-- Height arrow -->
  <line x1="118" y1="120" x2="118" y2="165" stroke="#22c55e" stroke-width="2"/>
  <text x="128" y="145" font-size="8.5" fill="#22c55e">h=f(x)</text>
  <!-- Width dx -->
  <text x="110" y="180" font-size="7.5" fill="#22c55e" text-anchor="middle">dx</text>
  <!-- Right panel -->
  <rect x="266" y="26" width="206" height="168" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="369" y="46" font-size="8.5" fill="#166534" text-anchor="middle" font-weight="700">Shell Method Formula</text>
  <rect x="274" y="52" width="190" height="30" rx="4" fill="#bbf7d0"/>
  <text x="369" y="66" font-size="8.5" fill="#166534" text-anchor="middle" font-weight="700">V = 2π ∫ₐᵇ x·f(x) dx</text>
  <text x="369" y="80" font-size="7.5" fill="#15803d" text-anchor="middle">(rotating around y-axis)</text>
  <text x="369" y="100" font-size="8" fill="#166534" text-anchor="middle">Each shell has:</text>
  <text x="369" y="114" font-size="8" fill="#166534" text-anchor="middle">• radius = x</text>
  <text x="369" y="128" font-size="8" fill="#166534" text-anchor="middle">• height = f(x)</text>
  <text x="369" y="142" font-size="8" fill="#166534" text-anchor="middle">• circumference = 2πx</text>
  <text x="369" y="156" font-size="8" fill="#166534" text-anchor="middle">• volume ≈ 2πx·f(x)·dx</text>
  <rect x="274" y="164" width="190" height="24" rx="4" fill="#dcfce7" stroke="#22c55e" stroke-width="1"/>
  <text x="369" y="180" font-size="8" fill="#166534" text-anchor="middle">Best when disk/washer is hard</text>
</svg>
