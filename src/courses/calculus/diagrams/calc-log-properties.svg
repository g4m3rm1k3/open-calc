<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" style="font-family: ui-monospace, monospace; border-radius: 12px;">
  <style>.bg{fill:rgb(var(--tw-custom-slate-50))}.dark .bg{fill:rgb(var(--tw-custom-slate-900))}</style>
  <rect width="480" height="200" rx="12" class="bg"/>
  <text x="240" y="16" font-size="11" fill="#4338ca" text-anchor="middle" font-weight="700">Logarithm Properties &amp; Calculus Connections</text>
  <!-- Properties table -->
  <rect x="8" y="24" width="464" height="14" rx="0" fill="#6366f1"/>
  <text x="180" y="35" font-size="8" fill="white" text-anchor="middle" font-weight="700">Log Property</text>
  <text x="380" y="35" font-size="8" fill="white" text-anchor="middle" font-weight="700">Explanation / Example</text>
  <!-- Row 1 -->
  <rect x="8" y="38" width="464" height="20" rx="0" fill="#eef2ff"/>
  <text x="180" y="52" font-size="8.5" fill="#4338ca" text-anchor="middle">logₐ(MN) = logₐM + logₐN</text>
  <text x="380" y="52" font-size="8" fill="#374151" text-anchor="middle">log(6) = log(2) + log(3)</text>
  <!-- Row 2 -->
  <rect x="8" y="58" width="464" height="20" rx="0" fill="#f8fafc"/>
  <text x="180" y="72" font-size="8.5" fill="#4338ca" text-anchor="middle">logₐ(M/N) = logₐM − logₐN</text>
  <text x="380" y="72" font-size="8" fill="#374151" text-anchor="middle">ln(e²/e) = ln(e²) − ln(e) = 2−1 = 1</text>
  <!-- Row 3 -->
  <rect x="8" y="78" width="464" height="20" rx="0" fill="#eef2ff"/>
  <text x="180" y="92" font-size="8.5" fill="#4338ca" text-anchor="middle">logₐ(Mᵖ) = p · logₐM</text>
  <text x="380" y="92" font-size="8" fill="#374151" text-anchor="middle">ln(x³) = 3 ln(x) — power comes down!</text>
  <!-- Row 4 -->
  <rect x="8" y="98" width="464" height="20" rx="0" fill="#f8fafc"/>
  <text x="180" y="112" font-size="8.5" fill="#4338ca" text-anchor="middle">logₐ(1) = 0</text>
  <text x="380" y="112" font-size="8" fill="#374151" text-anchor="middle">because aº = 1</text>
  <!-- Row 5 -->
  <rect x="8" y="118" width="464" height="20" rx="0" fill="#eef2ff"/>
  <text x="180" y="132" font-size="8.5" fill="#4338ca" text-anchor="middle">logₐ(a) = 1</text>
  <text x="380" y="132" font-size="8" fill="#374151" text-anchor="middle">because a¹ = a; especially: ln(e) = 1</text>
  <!-- Row 6: change of base -->
  <rect x="8" y="138" width="464" height="20" rx="0" fill="#f8fafc"/>
  <text x="180" y="152" font-size="8.5" fill="#4338ca" text-anchor="middle">logₐ(b) = ln(b)/ln(a)</text>
  <text x="380" y="152" font-size="8" fill="#374151" text-anchor="middle">Change of base: log₂(8) = ln8/ln2 = 3</text>
  <!-- Calculus box -->
  <rect x="8" y="162" width="464" height="34" rx="4" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="240" y="176" font-size="8.5" fill="#166534" text-anchor="middle" font-weight="700">Calculus: d/dx[ln x] = 1/x    and    ∫(1/x) dx = ln|x| + C</text>
  <text x="240" y="190" font-size="8" fill="#374151" text-anchor="middle">Logarithmic differentiation: take ln of both sides to differentiate yˣ or complex products</text>
</svg>
