<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" style="font-family: ui-monospace, monospace; border-radius: 12px;">
  <style>.bg{fill:rgb(var(--tw-custom-slate-50))}.dark .bg{fill:rgb(var(--tw-custom-slate-900))}</style>
  <rect width="480" height="200" rx="12" class="bg"/>
  <text x="240" y="16" font-size="11" fill="#4338ca" text-anchor="middle" font-weight="700">L'Hôpital's Rule — Indeterminate Forms</text>
  <!-- Left panel: the rule -->
  <rect x="8" y="24" width="200" height="168" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="108" y="44" font-size="8.5" fill="#4338ca" text-anchor="middle" font-weight="700">The Rule</text>
  <rect x="16" y="50" width="184" height="40" rx="5" fill="#dbeafe"/>
  <text x="108" y="66" font-size="8" fill="#1d4ed8" text-anchor="middle">If lim f(x)/g(x) = 0/0 or ∞/∞</text>
  <text x="108" y="82" font-size="8" fill="#1d4ed8" text-anchor="middle">then lim f(x)/g(x) = lim f ′(x)/g′(x)</text>
  <text x="108" y="102" font-size="8" fill="#4338ca" text-anchor="middle" font-weight="700">Example: lim sin(x)/x as x→0</text>
  <text x="108" y="118" font-size="7.5" fill="#4338ca" text-anchor="middle">= lim cos(x)/1  [0/0 form]</text>
  <text x="108" y="132" font-size="7.5" fill="#4338ca" text-anchor="middle">= cos(0)/1 = 1  ✓</text>
  <rect x="16" y="144" width="184" height="40" rx="5" fill="#fee2e2"/>
  <text x="108" y="160" font-size="8" fill="#991b1b" text-anchor="middle" font-weight="700">⚠ Apply only to 0/0 or ∞/∞</text>
  <text x="108" y="176" font-size="7.5" fill="#991b1b" text-anchor="middle">Check form first! Re-check each step.</text>

  <!-- Right panel: indeterminate forms table -->
  <rect x="216" y="24" width="256" height="168" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="344" y="42" font-size="8.5" fill="#1e293b" text-anchor="middle" font-weight="700">Indeterminate Forms</text>
  <!-- Table header -->
  <rect x="224" y="48" width="240" height="16" rx="0" fill="#e2e8f0"/>
  <text x="284" y="60" font-size="7.5" fill="#1e293b" text-anchor="middle" font-weight="700">Form</text>
  <text x="404" y="60" font-size="7.5" fill="#1e293b" text-anchor="middle" font-weight="700">Strategy</text>
  <!-- Rows -->
  <rect x="224" y="64" width="240" height="16" rx="0" fill="#dbeafe"/>
  <text x="274" y="75" font-size="7.5" fill="#1d4ed8" text-anchor="middle">0/0</text>
  <text x="394" y="75" font-size="7.5" fill="#1d4ed8" text-anchor="middle">L'Hôpital directly</text>
  <rect x="224" y="80" width="240" height="16" rx="0" fill="#f8fafc"/>
  <text x="274" y="91" font-size="7.5" fill="#374151" text-anchor="middle">∞/∞</text>
  <text x="394" y="91" font-size="7.5" fill="#374151" text-anchor="middle">L'Hôpital directly</text>
  <rect x="224" y="96" width="240" height="16" rx="0" fill="#dbeafe"/>
  <text x="274" y="107" font-size="7.5" fill="#1d4ed8" text-anchor="middle">0 · ∞</text>
  <text x="394" y="107" font-size="7.5" fill="#1d4ed8" text-anchor="middle">rewrite as 0/0 or ∞/∞</text>
  <rect x="224" y="112" width="240" height="16" rx="0" fill="#f8fafc"/>
  <text x="274" y="123" font-size="7.5" fill="#374151" text-anchor="middle">∞ − ∞</text>
  <text x="394" y="123" font-size="7.5" fill="#374151" text-anchor="middle">algebraic manipulation</text>
  <rect x="224" y="128" width="240" height="16" rx="0" fill="#dbeafe"/>
  <text x="274" y="139" font-size="7.5" fill="#1d4ed8" text-anchor="middle">0⁰</text>
  <text x="394" y="139" font-size="7.5" fill="#1d4ed8" text-anchor="middle">take ln, then L'Hôpital</text>
  <rect x="224" y="144" width="240" height="16" rx="0" fill="#f8fafc"/>
  <text x="274" y="155" font-size="7.5" fill="#374151" text-anchor="middle">1^∞</text>
  <text x="394" y="155" font-size="7.5" fill="#374151" text-anchor="middle">take ln, then L'Hôpital</text>
  <rect x="224" y="160" width="240" height="16" rx="0" fill="#dbeafe"/>
  <text x="274" y="171" font-size="7.5" fill="#1d4ed8" text-anchor="middle">∞⁰</text>
  <text x="394" y="171" font-size="7.5" fill="#1d4ed8" text-anchor="middle">take ln, then L'Hôpital</text>
</svg>
