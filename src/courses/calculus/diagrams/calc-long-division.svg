<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" style="font-family: ui-monospace, monospace; border-radius: 12px;">
  <style>.bg{fill:rgb(var(--tw-custom-slate-50))}.dark .bg{fill:rgb(var(--tw-custom-slate-900))}</style>
  <rect width="480" height="200" rx="12" class="bg"/>
  <text x="240" y="16" font-size="11" fill="#4338ca" text-anchor="middle" font-weight="700">Polynomial Long Division — Step by Step</text>
  <!-- Example: (x³ + 2x² − x + 3) ÷ (x − 1) -->
  <text x="240" y="36" font-size="8.5" fill="#374151" text-anchor="middle">Example: (x³ + 2x² − x + 3) ÷ (x − 1)</text>
  <!-- Long division box -->
  <rect x="8" y="42" width="350" height="118" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <!-- Division symbol -->
  <text x="30" y="65" font-size="9" fill="#4338ca">x−1 )</text>
  <line x1="74" y1="68" x2="350" y2="68" stroke="#4338ca" stroke-width="1.5"/>
  <text x="78" y="65" font-size="9" fill="#374151">x³ + 2x² − x + 3</text>
  <!-- Step 1: x² -->
  <text x="78" y="85" font-size="9" fill="#166534">x²</text>
  <text x="14" y="85" font-size="8" fill="#166534">÷ step:</text>
  <!-- Subtract -->
  <text x="78" y="100" font-size="9" fill="#374151">x³ − x²</text>
  <line x1="74" y1="103" x2="200" y2="103" stroke="#374151" stroke-width="1"/>
  <text x="78" y="118" font-size="9" fill="#374151">3x² − x</text>
  <text x="78" y="133" font-size="9" fill="#374151">3x² − 3x</text>
  <line x1="74" y1="136" x2="230" y2="136" stroke="#374151" stroke-width="1"/>
  <text x="78" y="152" font-size="9" fill="#374151">2x + 3</text>
  <!-- Quotient built up -->
  <text x="200" y="65" font-size="9" fill="#6366f1" font-weight="700">x² + 3x + 2</text>
  <!-- Remainder note -->
  <text x="14" y="154" font-size="7.5" fill="#374151">... + 2x+3 → 2(x−1)+5 → R=5</text>
  <!-- Result box -->
  <rect x="366" y="42" width="106" height="118" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="419" y="62" font-size="8" fill="#166534" text-anchor="middle" font-weight="700">Result</text>
  <text x="419" y="80" font-size="8" fill="#374151" text-anchor="middle">Quotient:</text>
  <text x="419" y="96" font-size="8.5" fill="#1d4ed8" text-anchor="middle" font-weight="700">x² + 3x + 2</text>
  <text x="419" y="114" font-size="8" fill="#374151" text-anchor="middle">Remainder: 5</text>
  <text x="419" y="132" font-size="7.5" fill="#374151" text-anchor="middle">Full answer:</text>
  <text x="419" y="148" font-size="7.5" fill="#374151" text-anchor="middle">x²+3x+2 + 5/(x−1)</text>
  <!-- Note -->
  <rect x="8" y="166" width="464" height="28" rx="4" fill="#fef3c7"/>
  <text x="240" y="180" font-size="8" fill="#92400e" text-anchor="middle" font-weight="700">Calculus use: simplify before integrating — (x²+3x+2) is much easier to integrate than the original fraction</text>
</svg>
