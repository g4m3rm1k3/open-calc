<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" style="font-family: ui-monospace, monospace; border-radius: 12px;">
  <style>
    .bg { fill: rgb(var(--tw-custom-slate-50)); }
    .dark .bg { fill: rgb(var(--tw-custom-slate-900)); }
  </style>
  <rect width="480" height="200" rx="12" class="bg"/>
  <text x="240" y="16" font-size="11" fill="#4338ca" text-anchor="middle" font-weight="700">Polynomial Roots and Factored Form</text>

  <!-- Graph of factored polynomial -->
  <rect x="8" y="22" width="260" height="172" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="138" y="40" font-size="9" fill="#4338ca" text-anchor="middle" font-weight="700">p(x) = (x+2)(x−1)(x−3)</text>

  <!-- Axes -->
  <line x1="20" y1="116" x2="258" y2="116" stroke="#64748b" stroke-width="1"/>
  <line x1="86" y1="28" x2="86" y2="120" stroke="#64748b" stroke-width="1"/>

  <!-- x-intercepts: -2, 1, 3 mapped to SVG x positions -->
  <!-- Range x: -3 to 4, 7 units. Width = 238px → 34px/unit. x=-2 at 86-34=52, x=1 at 86+34=120, x=3 at 86+3*34=188 -->
  <!-- y scale: 10px/unit rough -->
  <!-- p(-3)=-5*(-4)*(-6)=-120, p(-2.5)=(-0.5)(-3.5)(-5.5)≈-9.625, p(0)=2*(-1)*(-3)=6, p(2)=4*1*(-1)=-4, p(4)=6*3*1=18 -->
  <!-- Let's use scale y: 20px/unit, y=116 at y=0 -->
  <path d="M 18,122 Q 38,122 52,116 Q 64,110 80,88 Q 86,80 92,68 Q 100,52 120,116 Q 140,176 162,148 Q 172,132 188,116 Q 205,98 230,58 Q 248,32 255,28" fill="none" stroke="#6366f1" stroke-width="2.5"/>

  <!-- Root dots -->
  <circle cx="52" cy="116" r="5" fill="#dc2626"/>
  <text x="52" y="134" font-size="8" fill="#dc2626" text-anchor="middle">x=−2</text>
  <circle cx="120" cy="116" r="5" fill="#dc2626"/>
  <text x="120" y="134" font-size="8" fill="#dc2626" text-anchor="middle">x=1</text>
  <circle cx="188" cy="116" r="5" fill="#dc2626"/>
  <text x="188" y="134" font-size="8" fill="#dc2626" text-anchor="middle">x=3</text>

  <!-- y-intercept -->
  <circle cx="86" cy="96" r="4" fill="#059669"/>
  <text x="72" y="90" font-size="7.5" fill="#059669">y-int=6</text>

  <text x="138" y="155" font-size="8" fill="#64748b" text-anchor="middle">n=3 roots, degree 3 → 3 x-intercepts</text>
  <text x="138" y="168" font-size="7.5" fill="#94a3b8" text-anchor="middle">sign changes at each root (simple zeros)</text>

  <!-- RIGHT: connection formulas -->
  <rect x="276" y="22" width="196" height="172" rx="8" fill="#1e1b4b"/>
  <text x="374" y="40" font-size="9" fill="#a5b4fc" text-anchor="middle" font-weight="700">Roots ↔ Factors</text>
  <line x1="284" y1="46" x2="464" y2="46" stroke="#312e81" stroke-width="1"/>

  <text x="284" y="62" font-size="8" fill="#94a3b8">Root at x = r:</text>
  <rect x="284" y="66" width="176" height="18" rx="4" fill="#312e81"/>
  <text x="372" y="78" font-size="9" fill="#4ade80" text-anchor="middle" font-weight="700">(x − r) is a factor</text>

  <text x="284" y="100" font-size="8" fill="#94a3b8">Factor theorem:</text>
  <text x="284" y="114" font-size="8" fill="#94a3b8">p(r) = 0 ⟺ (x−r) | p(x)</text>

  <line x1="284" y1="122" x2="464" y2="122" stroke="#312e81" stroke-width="1"/>

  <text x="284" y="138" font-size="8" fill="#94a3b8">Multiplicity matters:</text>
  <text x="284" y="152" font-size="8" fill="#c7d2fe">• Simple root: crosses axis</text>
  <text x="284" y="165" font-size="8" fill="#c7d2fe">• Double root: touches, bounces</text>
  <text x="284" y="178" font-size="8" fill="#c7d2fe">• Triple root: S-shaped cross</text>

  <rect x="284" y="183" width="176" height="10" rx="3" fill="#4338ca"/>
  <text x="372" y="191" font-size="7.5" fill="white" text-anchor="middle">degree = total root count (with mult.)</text>
</svg>
