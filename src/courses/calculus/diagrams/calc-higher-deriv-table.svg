<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" style="font-family: ui-monospace, monospace; border-radius: 12px;">
  <style>
    .bg { fill: rgb(var(--tw-custom-slate-50)); }
    .dark .bg { fill: rgb(var(--tw-custom-slate-900)); }
  </style>
  <rect width="480" height="200" rx="12" class="bg"/>
  <text x="240" y="16" font-size="11" fill="#4338ca" text-anchor="middle" font-weight="700">Higher-Order Derivatives — Notation and Meaning</text>

  <rect x="8" y="22" width="464" height="84" rx="8" fill="#1e1b4b"/>

  <!-- Table of notations -->
  <text x="30" y="40" font-size="8" fill="#94a3b8">Order</text>
  <text x="105" y="40" font-size="8" fill="#a5b4fc" text-anchor="middle">Leibniz</text>
  <text x="200" y="40" font-size="8" fill="#a5b4fc" text-anchor="middle">Prime</text>
  <text x="300" y="40" font-size="8" fill="#a5b4fc" text-anchor="middle">Meaning</text>
  <text x="420" y="40" font-size="8" fill="#a5b4fc" text-anchor="middle">Example (xⁿ)</text>
  <line x1="8" y1="44" x2="472" y2="44" stroke="#4338ca" stroke-width="1"/>
  <line x1="80" y1="22" x2="80" y2="106" stroke="#312e81" stroke-width="0.5"/>
  <line x1="155" y1="22" x2="155" y2="106" stroke="#312e81" stroke-width="0.5"/>
  <line x1="248" y1="22" x2="248" y2="106" stroke="#312e81" stroke-width="0.5"/>
  <line x1="372" y1="22" x2="372" y2="106" stroke="#312e81" stroke-width="0.5"/>

  <text x="44" y="60" font-size="8" fill="#c7d2fe" text-anchor="middle">1st</text>
  <text x="105" y="60" font-size="8.5" fill="#4ade80" text-anchor="middle">dy/dx</text>
  <text x="200" y="60" font-size="8.5" fill="#4ade80" text-anchor="middle">f ′(x)</text>
  <text x="300" y="60" font-size="8" fill="#94a3b8" text-anchor="middle">slope / velocity</text>
  <text x="420" y="60" font-size="8.5" fill="#c7d2fe" text-anchor="middle">nxⁿ⁻¹</text>
  <line x1="8" y1="65" x2="472" y2="65" stroke="#312e81" stroke-width="0.5"/>

  <text x="44" y="81" font-size="8" fill="#c7d2fe" text-anchor="middle">2nd</text>
  <text x="105" y="81" font-size="8.5" fill="#fbbf24" text-anchor="middle">d²y/dx²</text>
  <text x="200" y="81" font-size="8.5" fill="#fbbf24" text-anchor="middle">f ″(x)</text>
  <text x="300" y="81" font-size="8" fill="#94a3b8" text-anchor="middle">concavity / accel.</text>
  <text x="420" y="81" font-size="8.5" fill="#c7d2fe" text-anchor="middle">n(n-1)xⁿ⁻²</text>
  <line x1="8" y1="86" x2="472" y2="86" stroke="#312e81" stroke-width="0.5"/>

  <text x="44" y="102" font-size="8" fill="#c7d2fe" text-anchor="middle">nth</text>
  <text x="105" y="102" font-size="8.5" fill="#f87171" text-anchor="middle">dⁿy/dxⁿ</text>
  <text x="200" y="102" font-size="8.5" fill="#f87171" text-anchor="middle">f⁽ⁿ⁾(x)</text>
  <text x="300" y="102" font-size="8" fill="#94a3b8" text-anchor="middle">rate of rate of…</text>
  <text x="420" y="102" font-size="8.5" fill="#c7d2fe" text-anchor="middle">n! (for xⁿ)</text>

  <!-- Bottom: concrete example -->
  <rect x="8" y="114" width="464" height="80" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="240" y="132" font-size="9" fill="#4338ca" text-anchor="middle" font-weight="700">Example: f(x) = x⁴ − 3x³ + 2x</text>

  <text x="20" y="150" font-size="8.5" fill="#64748b">f ′(x)  = 4x³ − 9x² + 2</text>
  <text x="240" y="150" font-size="8.5" fill="#64748b" text-anchor="middle">slope of f</text>

  <text x="20" y="166" font-size="8.5" fill="#64748b">f ″(x)  = 12x² − 18x</text>
  <text x="240" y="166" font-size="8.5" fill="#64748b" text-anchor="middle">concavity of f</text>

  <text x="20" y="182" font-size="8.5" fill="#64748b">f ‴(x)  = 24x − 18</text>
  <text x="240" y="182" font-size="8.5" fill="#64748b" text-anchor="middle">rate of concavity change</text>

  <text x="20" y="188" font-size="8" fill="#94a3b8">f⁽⁴⁾ = 24,  f⁽⁵⁾ = 0  (and all higher = 0)</text>
</svg>
