<svg viewBox="0 0 480 215" xmlns="http://www.w3.org/2000/svg" style="font-family: ui-monospace, monospace; border-radius: 12px;">
  <style>
    .bg  { fill: rgb(var(--tw-custom-slate-50)); }
    .ax  { stroke: rgb(var(--tw-custom-slate-400)); }
    .axf { fill: rgb(var(--tw-custom-slate-400)); }
    .mu  { fill: rgb(var(--tw-custom-slate-500)); }
    .dark .bg  { fill: rgb(var(--tw-custom-slate-900)); }
    .dark .ax  { stroke: rgb(var(--tw-custom-slate-600)); }
    .dark .axf { fill: rgb(var(--tw-custom-slate-600)); }
    .dark .mu  { fill: rgb(var(--tw-custom-slate-400)); }
  </style>
  <rect width="480" height="215" rx="12" class="bg"/>

  <text x="240" y="18" font-size="11" fill="#4338ca" text-anchor="middle" font-weight="700">Fundamental Trig Limit — Geometric Proof that sin(θ)/θ → 1</text>

  <!-- LEFT: Unit circle geometric squeeze -->
  <!-- Circle center at (128, 128), r=90 -->
  <circle cx="128" cy="128" r="90" fill="none" stroke="#94a3b8" stroke-width="1"/>
  <!-- Axes -->
  <line x1="30" y1="128" x2="230" y2="128" class="ax" stroke-width="1.2"/>
  <line x1="128" y1="30" x2="128" y2="210" class="ax" stroke-width="1.2"/>

  <!-- Angle θ ≈ 40° -->
  <!-- Point on circle: cos40°≈0.766→128+69=197, sin40°≈0.643→128-58=70 -->
  <line x1="128" y1="128" x2="197" y2="70" stroke="#6366f1" stroke-width="2"/>
  <circle cx="197" cy="70" r="4" fill="#6366f1"/>

  <!-- sin θ: vertical drop from (197,70) to (197,128) -->
  <line x1="197" y1="70" x2="197" y2="128" stroke="#10b981" stroke-width="2.5"/>
  <text x="201" y="103" font-size="9" fill="#10b981">sin θ</text>

  <!-- cos θ: horizontal to (197, 128) -->
  <line x1="128" y1="128" x2="197" y2="128" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="160" y="142" font-size="9" fill="#f59e0b">cos θ</text>

  <!-- Arc from (218,128) to (197,70) — arc length = θ -->
  <path d="M 218,128 A 90,90 0 0,0 197,70" fill="none" stroke="#ef4444" stroke-width="2"/>
  <text x="215" y="105" font-size="9" fill="#ef4444">arc=θ</text>

  <!-- Tangent line at (218,128): vertical line x=218, clipped -->
  <line x1="218" y1="80" x2="218" y2="155" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="4,2"/>
  <!-- Tangent point -->
  <circle cx="218" cy="128" r="3" fill="#4338ca"/>
  <!-- tan line to intersection with radius extended -->
  <!-- Line from origin to (197,70), extended to x=218:
       slope = (70-128)/(197-128) = -58/69 ≈ -0.84;
       y = 128 + slope*(218-128) = 128 - 0.84*90 = 128-75.6 = 52.4 -->
  <line x1="128" y1="128" x2="218" y2="52" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="4,2"/>
  <!-- tan θ: vertical from 218,52 to 218,128 -->
  <line x1="218" y1="52" x2="218" y2="128" stroke="#6366f1" stroke-width="2.5"/>
  <text x="224" y="92" font-size="9" fill="#6366f1">tan θ</text>

  <!-- Angle arc -->
  <path d="M 148,128 A 20,20 0 0,0 143,113" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="150" y="118" font-size="9" class="mu">θ</text>

  <!-- DIVIDER -->
  <line x1="248" y1="28" x2="248" y2="205" stroke="#e2e8f0" stroke-width="1"/>

  <!-- RIGHT: Inequality chain and conclusion -->
  <text x="364" y="36" font-size="9" fill="#4338ca" text-anchor="middle" font-weight="700">The Area Squeeze</text>

  <rect x="256" y="44" width="216" height="78" rx="5" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1"/>
  <text x="364" y="60" font-size="8.5" fill="#4338ca" text-anchor="middle">Compare three areas (0 &lt; θ &lt; π/2):</text>
  <text x="262" y="76" font-size="8.5" fill="#10b981">Area △OAP</text>
  <text x="262" y="90" font-size="8.5" fill="#ef4444">Area sector OAP</text>
  <text x="262" y="104" font-size="8.5" fill="#6366f1">Area △OAT</text>
  <text x="380" y="76" font-size="8.5" fill="#10b981">= ½ sin θ</text>
  <text x="380" y="90" font-size="8.5" fill="#ef4444">= ½ θ</text>
  <text x="380" y="104" font-size="8.5" fill="#6366f1">= ½ tan θ</text>

  <rect x="256" y="130" width="216" height="32" rx="4" fill="#fef9c3"/>
  <text x="364" y="146" font-size="9" fill="#d97706" text-anchor="middle">½ sin θ ≤ ½ θ ≤ ½ tan θ</text>
  <text x="364" y="158" font-size="9" fill="#92400e" text-anchor="middle">÷ sin θ: 1 ≤ θ/sin θ ≤ 1/cos θ</text>

  <rect x="256" y="170" width="216" height="32" rx="5" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="364" y="185" font-size="9" fill="#059669" text-anchor="middle" font-weight="700">As θ → 0, 1/cos θ → 1</text>
  <text x="364" y="198" font-size="9" fill="#059669" text-anchor="middle">Squeeze: sin θ / θ → 1 ✓</text>
</svg>
