<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" style="font-family: ui-monospace, monospace; border-radius: 12px;">
  <style>
    .bg  { fill: rgb(var(--tw-custom-slate-50)); }
    .mu  { fill: rgb(var(--tw-custom-slate-500)); }
    .tx  { fill: rgb(var(--tw-custom-slate-900)); }
    .dark .bg  { fill: rgb(var(--tw-custom-slate-900)); }
    .dark .mu  { fill: rgb(var(--tw-custom-slate-400)); }
    .dark .tx  { fill: rgb(var(--tw-custom-slate-200)); }
  </style>
  <rect width="480" height="200" rx="12" class="bg"/>

  <text x="240" y="17" font-size="11" fill="#4338ca" text-anchor="middle" font-weight="700">Three Forms of a Linear Equation</text>

  <!-- FORM 1: Slope-Intercept -->
  <rect x="10" y="26" width="144" height="164" rx="9" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="82" y="44" font-size="9" fill="#4338ca" text-anchor="middle" font-weight="700">Slope-Intercept</text>
  <text x="82" y="68" font-size="20" fill="#6366f1" text-anchor="middle" font-weight="800">y = mx+b</text>
  <line x1="18" y1="78" x2="146" y2="78" stroke="#c7d2fe" stroke-width="1"/>
  <text x="82" y="93" font-size="7.5" class="mu" text-anchor="middle">m = slope (rise/run)</text>
  <text x="82" y="105" font-size="7.5" class="mu" text-anchor="middle">b = y-intercept (where</text>
  <text x="82" y="116" font-size="7.5" class="mu" text-anchor="middle">line crosses y-axis)</text>
  <rect x="18" y="126" width="128" height="26" rx="5" fill="#c7d2fe"/>
  <text x="82" y="137" font-size="7.5" fill="#4338ca" text-anchor="middle" font-weight="700">Example:</text>
  <text x="82" y="148" font-size="8" fill="#3730a3" text-anchor="middle">y = 2x + 3</text>
  <text x="82" y="162" font-size="7.5" class="mu" text-anchor="middle">Quick graphing</text>
  <text x="82" y="173" font-size="7.5" class="mu" text-anchor="middle">Easy for learners</text>
  <text x="82" y="184" font-size="7" fill="#059669" text-anchor="middle">★ most common form</text>

  <!-- FORM 2: Point-Slope (Calculus form) -->
  <rect x="162" y="26" width="156" height="164" rx="9" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="240" y="44" font-size="9" fill="#059669" text-anchor="middle" font-weight="700">Point-Slope</text>
  <text x="240" y="68" font-size="15" fill="#10b981" text-anchor="middle" font-weight="800">y−y₁ = m(x−x₁)</text>
  <line x1="170" y1="78" x2="310" y2="78" stroke="#a7f3d0" stroke-width="1"/>
  <text x="240" y="93" font-size="7.5" class="mu" text-anchor="middle">m = slope, (x₁,y₁) = known point</text>
  <text x="240" y="106" font-size="7.5" class="mu" text-anchor="middle">Built for: you know WHERE</text>
  <text x="240" y="117" font-size="7.5" class="mu" text-anchor="middle">you are and HOW FAST</text>
  <rect x="170" y="126" width="140" height="26" rx="5" fill="#a7f3d0"/>
  <text x="240" y="137" font-size="7.5" fill="#065f46" text-anchor="middle" font-weight="700">Example:</text>
  <text x="240" y="148" font-size="8" fill="#065f46" text-anchor="middle">y−5 = 2(x−3)</text>
  <text x="240" y="162" font-size="7.5" class="mu" text-anchor="middle">★ Calculus tangent lines</text>
  <text x="240" y="173" font-size="7.5" class="mu" text-anchor="middle">y−f(a) = f′(a)(x−a)</text>
  <text x="240" y="184" font-size="7" fill="#059669" text-anchor="middle">★★ preferred in calculus</text>

  <!-- FORM 3: Standard -->
  <rect x="326" y="26" width="144" height="164" rx="9" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="398" y="44" font-size="9" fill="#b45309" text-anchor="middle" font-weight="700">Standard Form</text>
  <text x="398" y="68" font-size="18" fill="#f59e0b" text-anchor="middle" font-weight="800">Ax+By=C</text>
  <line x1="334" y1="78" x2="462" y2="78" stroke="#fde68a" stroke-width="1"/>
  <text x="398" y="93" font-size="7.5" class="mu" text-anchor="middle">A, B, C are integers</text>
  <text x="398" y="105" font-size="7.5" class="mu" text-anchor="middle">A ≥ 0 by convention</text>
  <text x="398" y="117" font-size="7.5" class="mu" text-anchor="middle">Symmetric in x and y</text>
  <rect x="334" y="126" width="128" height="26" rx="5" fill="#fde68a"/>
  <text x="398" y="137" font-size="7.5" fill="#78350f" text-anchor="middle" font-weight="700">Example:</text>
  <text x="398" y="148" font-size="8" fill="#78350f" text-anchor="middle">2x − y = −3</text>
  <text x="398" y="162" font-size="7.5" class="mu" text-anchor="middle">Used in systems of</text>
  <text x="398" y="173" font-size="7.5" class="mu" text-anchor="middle">equations, some proofs</text>
  <text x="398" y="184" font-size="7" fill="#b45309" text-anchor="middle">rare in calc</text>
</svg>
