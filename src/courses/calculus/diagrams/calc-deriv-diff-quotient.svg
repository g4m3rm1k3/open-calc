<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" style="font-family: ui-monospace, monospace; border-radius: 12px;">
  <style>
    .bg  { fill: rgb(var(--tw-custom-slate-50)); }
    .mu  { fill: rgb(var(--tw-custom-slate-500)); }
    .tx  { fill: rgb(var(--tw-custom-slate-900)); }
    .dark .bg  { fill: rgb(var(--tw-custom-slate-900)); }
    .dark .mu  { fill: rgb(var(--tw-custom-slate-400)); }
    .dark .tx  { fill: rgb(var(--tw-custom-slate-200)); }
  </style>
  <rect width="480" height="200" rx="12" class="bg"/>

  <text x="240" y="17" font-size="11" fill="#4338ca" text-anchor="middle" font-weight="700">The Difference Quotient — Anatomy</text>

  <!-- Curve -->
  <path d="M 30,170 Q 120,155 200,110 Q 280,65 380,36" fill="none" stroke="#6366f1" stroke-width="2.5"/>

  <!-- x point -->
  <line x1="140" y1="130" x2="140" y2="185" stroke="#64748b" stroke-width="1" stroke-dasharray="3,2"/>
  <circle cx="140" cy="130" r="5" fill="#6366f1"/>
  <text x="133" y="196" font-size="8.5" fill="#4338ca" text-anchor="middle">x</text>

  <!-- x+h point -->
  <line x1="270" y1="72" x2="270" y2="185" stroke="#64748b" stroke-width="1" stroke-dasharray="3,2"/>
  <circle cx="270" cy="72" r="5" fill="#ef4444"/>
  <text x="263" y="196" font-size="8.5" fill="#dc2626" text-anchor="middle">x+h</text>

  <!-- Horizontal span: h -->
  <line x1="140" y1="182" x2="270" y2="182" stroke="#059669" stroke-width="1.5"/>
  <line x1="140" y1="178" x2="140" y2="186" stroke="#059669" stroke-width="1.5"/>
  <line x1="270" y1="178" x2="270" y2="186" stroke="#059669" stroke-width="1.5"/>
  <text x="205" y="196" font-size="8.5" fill="#059669" text-anchor="middle" font-weight="700">h (run)</text>

  <!-- Vertical span: f(x+h)-f(x) -->
  <line x1="280" y1="72" x2="280" y2="130" stroke="#dc2626" stroke-width="1.5"/>
  <line x1="276" y1="72" x2="284" y2="72" stroke="#dc2626" stroke-width="1.5"/>
  <line x1="276" y1="130" x2="284" y2="130" stroke="#dc2626" stroke-width="1.5"/>
  <text x="298" y="105" font-size="8" fill="#dc2626" font-weight="700">f(x+h)−f(x)</text>
  <text x="298" y="116" font-size="7.5" fill="#dc2626">(rise)</text>

  <!-- Secant line -->
  <line x1="70" y1="162" x2="370" y2="36" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5,3"/>

  <!-- f(x) label -->
  <text x="80" y="127" font-size="8" fill="#4338ca">f(x)</text>
  <!-- f(x+h) label -->
  <text x="208" y="68" font-size="8" fill="#dc2626">f(x+h)</text>

  <!-- Formula box at bottom -->
  <rect x="100" y="152" width="280" height="40" rx="8" fill="#1e1b4b" opacity="0.9"/>
  <text x="240" y="169" font-size="10" fill="#a5b4fc" text-anchor="middle" font-weight="700">Difference Quotient</text>
  <text x="240" y="185" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">f′(x) = lim  [f(x+h) − f(x)] / h</text>
  <text x="295" y="185" font-size="7.5" fill="#a5b4fc">h→0</text>
</svg>
