<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" style="font-family: ui-monospace, monospace; border-radius: 12px;">
  <style>
    .bg { fill: rgb(var(--tw-custom-slate-50)); }
    .dark .bg { fill: rgb(var(--tw-custom-slate-900)); }
  </style>
  <rect width="480" height="200" rx="12" class="bg"/>
  <text x="240" y="16" font-size="11" fill="#4338ca" text-anchor="middle" font-weight="700">Chain Rule — Function Composition Tree</text>

  <!-- LEFT: composition diagram -->
  <rect x="8" y="22" width="200" height="172" rx="8" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5"/>
  <text x="108" y="40" font-size="9" fill="#0284c7" text-anchor="middle" font-weight="700">h(x) = sin(x²)</text>

  <!-- Boxes and arrows -->
  <rect x="70" y="50" width="76" height="22" rx="5" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="108" y="65" font-size="8.5" fill="#1d4ed8" text-anchor="middle" font-weight="700">x  (input)</text>

  <line x1="108" y1="72" x2="108" y2="92" stroke="#64748b" stroke-width="1.5" marker-end="url(#downArrow)"/>
  <defs>
    <marker id="downArrow" markerWidth="7" markerHeight="7" refX="3.5" refY="6" orient="auto"><polygon points="0,0 7,0 3.5,6" fill="#64748b"/></marker>
    <marker id="rightArrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><polygon points="0,0 7,3.5 0,7" fill="#059669"/></marker>
  </defs>
  <text x="114" y="85" font-size="7" fill="#059669">g(x)=x²</text>

  <rect x="58" y="92" width="100" height="22" rx="5" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="108" y="107" font-size="8.5" fill="#166534" text-anchor="middle" font-weight="700">g(x) = x²</text>

  <line x1="108" y1="114" x2="108" y2="134" stroke="#64748b" stroke-width="1.5" marker-end="url(#downArrow)"/>
  <text x="114" y="127" font-size="7" fill="#7c3aed">f(u)=sin(u)</text>

  <rect x="58" y="134" width="100" height="22" rx="5" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="108" y="149" font-size="8.5" fill="#6d28d9" text-anchor="middle" font-weight="700">f(u) = sin(u)</text>

  <line x1="108" y1="156" x2="108" y2="176" stroke="#64748b" stroke-width="1.5" marker-end="url(#downArrow)"/>

  <rect x="50" y="176" width="116" height="16" rx="4" fill="#4338ca"/>
  <text x="108" y="187" font-size="8.5" fill="white" text-anchor="middle" font-weight="700">h(x) = sin(x²)</text>

  <!-- RIGHT: derivative computation -->
  <rect x="216" y="22" width="256" height="172" rx="8" fill="#1e1b4b"/>
  <text x="344" y="40" font-size="9" fill="#a5b4fc" text-anchor="middle" font-weight="700">Computing the Derivative</text>
  <line x1="224" y1="46" x2="464" y2="46" stroke="#312e81" stroke-width="1"/>

  <text x="226" y="62" font-size="8" fill="#94a3b8">Chain Rule formula:</text>
  <rect x="224" y="66" width="240" height="18" rx="4" fill="#312e81"/>
  <text x="344" y="78" font-size="9" fill="#c7d2fe" text-anchor="middle" font-weight="700">h′(x) = f ′(g(x)) · g′(x)</text>

  <text x="226" y="100" font-size="8" fill="#94a3b8">Step 1 — Outer derivative (at the inner):</text>
  <text x="226" y="116" font-size="9" fill="#a5b4fc" font-weight="700">f(u) = sin(u)  →  f ′(u) = cos(u)</text>
  <text x="226" y="130" font-size="8.5" fill="#c7d2fe">Substitute g(x) = x²:  f ′(g(x)) = cos(x²)</text>

  <text x="226" y="150" font-size="8" fill="#94a3b8">Step 2 — Inner derivative:</text>
  <text x="226" y="166" font-size="9" fill="#4ade80" font-weight="700">g(x) = x²  →  g′(x) = 2x</text>

  <line x1="224" y1="172" x2="464" y2="172" stroke="#312e81" stroke-width="1"/>
  <rect x="224" y="176" width="240" height="16" rx="4" fill="#4338ca"/>
  <text x="344" y="187" font-size="9" fill="white" text-anchor="middle" font-weight="700">h′(x) = cos(x²) · 2x</text>
</svg>
