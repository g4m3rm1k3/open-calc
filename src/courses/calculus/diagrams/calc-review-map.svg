<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" style="font-family: ui-monospace, monospace; border-radius: 12px;">
  <style>.bg{fill:rgb(var(--tw-custom-slate-50))}.dark .bg{fill:rgb(var(--tw-custom-slate-900))}</style>
  <rect width="480" height="200" rx="12" class="bg"/>
  <text x="240" y="16" font-size="11" fill="#4338ca" text-anchor="middle" font-weight="700">Prerequisites Map — What Feeds Into What</text>
  <!-- Central node: Calculus -->
  <rect x="188" y="82" width="104" height="36" rx="8" fill="#4338ca"/>
  <text x="240" y="97" font-size="9" fill="white" text-anchor="middle" font-weight="700">CALCULUS</text>
  <text x="240" y="111" font-size="7.5" fill="#c7d2fe" text-anchor="middle">Limits · Derivatives · Integrals</text>
  <!-- Algebra node -->
  <rect x="18" y="24" width="110" height="30" rx="6" fill="#6366f1"/>
  <text x="73" y="44" font-size="8.5" fill="white" text-anchor="middle" font-weight="700">Algebra</text>
  <line x1="128" y1="39" x2="188" y2="90" stroke="#6366f1" stroke-width="1.5"/>
  <!-- Trig node -->
  <rect x="352" y="24" width="110" height="30" rx="6" fill="#22c55e"/>
  <text x="407" y="44" font-size="8.5" fill="white" text-anchor="middle" font-weight="700">Trigonometry</text>
  <line x1="352" y1="39" x2="292" y2="90" stroke="#22c55e" stroke-width="1.5"/>
  <!-- Functions node -->
  <rect x="18" y="146" width="110" height="30" rx="6" fill="#f59e0b"/>
  <text x="73" y="166" font-size="8.5" fill="white" text-anchor="middle" font-weight="700">Functions</text>
  <line x1="128" y1="158" x2="188" y2="110" stroke="#f59e0b" stroke-width="1.5"/>
  <!-- Geometry node -->
  <rect x="352" y="146" width="110" height="30" rx="6" fill="#ec4899"/>
  <text x="407" y="166" font-size="8.5" fill="white" text-anchor="middle" font-weight="700">Geometry</text>
  <line x1="352" y1="158" x2="292" y2="110" stroke="#ec4899" stroke-width="1.5"/>
  <!-- Precalc above center -->
  <rect x="186" y="148" width="108" height="30" rx="6" fill="#7c3aed"/>
  <text x="240" y="168" font-size="8.5" fill="white" text-anchor="middle" font-weight="700">Precalc/Limits</text>
  <line x1="240" y1="148" x2="240" y2="118" stroke="#7c3aed" stroke-width="1.5"/>
  <!-- Sub-bullets inside each -->
  <text x="73" y="24" font-size="7" fill="#374151" text-anchor="middle">factor · solve · simplify</text>
  <text x="407" y="24" font-size="7" fill="#374151" text-anchor="middle">sin cos tan · identities</text>
  <text x="73" y="146" font-size="7" fill="#374151" text-anchor="middle">domain · range · composition</text>
  <text x="407" y="146" font-size="7" fill="#374151" text-anchor="middle">area · distance · circles</text>
  <text x="240" y="196" font-size="7.5" fill="#94a3b8" text-anchor="middle">All five areas feed directly into calculus — gaps in any one will slow you down</text>
</svg>
