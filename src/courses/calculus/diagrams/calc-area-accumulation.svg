<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" style="font-family: ui-monospace, monospace; border-radius: 12px;">
  <style>.bg{fill:rgb(var(--tw-custom-slate-50))}.dark .bg{fill:rgb(var(--tw-custom-slate-900))}</style>
  <rect width="480" height="200" rx="12" class="bg"/>
  <text x="240" y="16" font-size="11" fill="#4338ca" text-anchor="middle" font-weight="700">Area as Accumulation — Building the Integral</text>
  <rect x="8" y="22" width="300" height="172" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="28" y1="166" x2="300" y2="166" stroke="#64748b" stroke-width="1"/>
  <line x1="28" y1="28" x2="28" y2="170" stroke="#64748b" stroke-width="1"/>
  <!-- Shaded area under curve -->
  <path d="M 50,166 L 50,108 Q 80,82 110,66 Q 140,52 170,46 Q 200,42 230,46 Q 255,50 270,60 L 270,166 Z" fill="#6366f1" opacity="0.2"/>
  <!-- Curve on top -->
  <path d="M 35,140 Q 50,120 80,92 Q 110,66 140,52 Q 170,40 200,38 Q 230,38 260,48 Q 280,58 295,72" fill="none" stroke="#6366f1" stroke-width="2.5"/>
  <!-- Shading stripes for emphasis -->
  <line x1="50" y1="108" x2="50" y2="166" stroke="#6366f1" stroke-width="1.5" opacity="0.5"/>
  <line x1="270" y1="60" x2="270" y2="166" stroke="#6366f1" stroke-width="1.5" opacity="0.5"/>
  <!-- a and b markers -->
  <line x1="50" y1="161" x2="50" y2="170" stroke="#4338ca" stroke-width="2"/>
  <line x1="270" y1="161" x2="270" y2="170" stroke="#4338ca" stroke-width="2"/>
  <text x="50" y="182" font-size="9" fill="#4338ca" text-anchor="middle">a</text>
  <text x="270" y="182" font-size="9" fill="#4338ca" text-anchor="middle">b</text>
  <!-- Area label -->
  <text x="160" y="130" font-size="11" fill="#4338ca" text-anchor="middle" font-weight="700">A</text>
  <!-- Integral symbol -->
  <text x="160" y="150" font-size="9" fill="#6366f1" text-anchor="middle">= ∫ₐᵇ f(x) dx</text>
  <!-- Right panel: accumulation idea -->
  <rect x="315" y="26" width="157" height="168" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="393" y="46" font-size="8.5" fill="#4338ca" text-anchor="middle" font-weight="700">Accumulation Idea</text>
  <text x="393" y="64" font-size="8" fill="#4338ca" text-anchor="middle">Slice area into thin strips</text>
  <text x="393" y="78" font-size="8" fill="#4338ca" text-anchor="middle">Each strip ≈ f(x) · dx</text>
  <rect x="323" y="86" width="140" height="26" rx="4" fill="#dbeafe"/>
  <text x="393" y="103" font-size="9" fill="#1d4ed8" text-anchor="middle" font-weight="700">A = lim Σ f(xᵢ)·Δx</text>
  <text x="393" y="130" font-size="8" fill="#4338ca" text-anchor="middle">As Δx → 0,</text>
  <text x="393" y="144" font-size="8" fill="#4338ca" text-anchor="middle">sum → integral</text>
  <rect x="323" y="152" width="140" height="36" rx="4" fill="#dcfce7"/>
  <text x="393" y="168" font-size="8.5" fill="#166534" text-anchor="middle" font-weight="700">∫ₐᵇ f(x) dx</text>
  <text x="393" y="182" font-size="7.5" fill="#166534" text-anchor="middle">exact accumulated area</text>
</svg>
