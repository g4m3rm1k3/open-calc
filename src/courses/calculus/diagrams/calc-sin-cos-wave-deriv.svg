<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" style="font-family: ui-monospace, monospace; border-radius: 12px;">
  <style>
    .bg { fill: rgb(var(--tw-custom-slate-50)); }
    .dark .bg { fill: rgb(var(--tw-custom-slate-900)); }
  </style>
  <rect width="480" height="200" rx="12" class="bg"/>
  <text x="240" y="16" font-size="11" fill="#4338ca" text-anchor="middle" font-weight="700">Derivative of sin(x) is cos(x) — Geometric Proof</text>

  <!-- Axes -->
  <line x1="20" y1="100" x2="460" y2="100" stroke="#64748b" stroke-width="1"/>
  <line x1="20" y1="24" x2="20" y2="180" stroke="#64748b" stroke-width="1"/>
  <!-- x labels -->
  <text x="136" y="114" font-size="7.5" fill="#94a3b8" text-anchor="middle">π/2</text>
  <text x="252" y="114" font-size="7.5" fill="#94a3b8" text-anchor="middle">π</text>
  <text x="368" y="114" font-size="7.5" fill="#94a3b8" text-anchor="middle">3π/2</text>
  <text x="452" y="114" font-size="7.5" fill="#94a3b8" text-anchor="middle">2π</text>
  <text x="14" y="30" font-size="7.5" fill="#94a3b8" text-anchor="end">1</text>
  <text x="14" y="172" font-size="7.5" fill="#94a3b8" text-anchor="end">-1</text>

  <!-- sin(x) curve -->
  <!-- sin starts at 0, peaks at π/2 (x≈136), returns to 0 at π (x≈252), dips at 3π/2 (x≈368), back at 2π (x≈452) -->
  <path d="M 20,100 C 55,100 80,30 136,30 C 192,30 215,100 252,100 C 288,100 310,170 368,170 C 425,170 450,100 452,100" fill="none" stroke="#6366f1" stroke-width="2.5"/>
  <text x="30" y="90" font-size="8.5" fill="#6366f1" font-weight="700">y = sin(x)</text>

  <!-- cos(x) curve (shifted by π/2) -->
  <!-- cos starts at 1 (y=30), descends to 0 at π/2 (x=136), -1 at π (x=252), 0 at 3π/2 (x=368), 1 at 2π (x=452) -->
  <path d="M 20,30 C 55,30 80,100 136,100 C 192,100 215,170 252,170 C 288,170 310,100 368,100 C 425,100 450,30 452,30" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="6,3"/>
  <text x="60" y="46" font-size="8.5" fill="#b45309" font-weight="700">y = cos(x) = (sin x)′</text>

  <!-- Key annotations -->
  <!-- sin peak at x=136 → zero slope → cos=0 -->
  <line x1="136" y1="30" x2="136" y2="100" stroke="#64748b" stroke-width="1" stroke-dasharray="2,2"/>
  <circle cx="136" cy="30" r="3.5" fill="#6366f1"/>
  <circle cx="136" cy="100" r="3.5" fill="#f59e0b"/>
  <text x="140" y="70" font-size="7" fill="#64748b">sin max → cos=0</text>

  <!-- sin zero descent at x=252 → negative slope → cos<0 -->
  <line x1="252" y1="100" x2="252" y2="170" stroke="#64748b" stroke-width="1" stroke-dasharray="2,2"/>
  <circle cx="252" cy="100" r="3.5" fill="#6366f1"/>
  <circle cx="252" cy="170" r="3.5" fill="#f59e0b"/>
  <text x="256" y="140" font-size="7" fill="#64748b">sin↓ → cos min</text>

  <!-- Bottom legend -->
  <rect x="8" y="182" width="464" height="14" rx="4" fill="#eef2ff"/>
  <text x="240" y="192" font-size="7.5" fill="#4338ca" text-anchor="middle">At sin peaks/troughs → cos = 0 (horizontal tangent). When sin rises → cos > 0. When sin falls → cos &lt; 0.</text>
</svg>
