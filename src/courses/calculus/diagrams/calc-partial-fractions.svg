<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" style="font-family: ui-monospace, monospace; border-radius: 12px;">
  <style>.bg{fill:rgb(var(--tw-custom-slate-50))}.dark .bg{fill:rgb(var(--tw-custom-slate-900))}</style>
  <rect width="480" height="200" rx="12" class="bg"/>
  <text x="240" y="16" font-size="11" fill="#4338ca" text-anchor="middle" font-weight="700">Partial Fractions — Decomposing Rational Functions</text>
  <!-- Main idea -->
  <rect x="8" y="24" width="464" height="30" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="240" y="44" font-size="9" fill="#4338ca" text-anchor="middle" font-weight="700">1/(x²+x−2) = 1/[(x+2)(x−1)] = A/(x+2) + B/(x−1)</text>
  <!-- Steps -->
  <rect x="8" y="62" width="222" height="132" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="119" y="80" font-size="8.5" fill="#1e293b" text-anchor="middle" font-weight="700">Step-by-Step</text>
  <rect x="16" y="86" width="206" height="20" rx="3" fill="#dbeafe"/>
  <text x="119" y="100" font-size="7.5" fill="#1d4ed8" text-anchor="middle">① Factor denominator completely</text>
  <rect x="16" y="110" width="206" height="20" rx="3" fill="#dcfce7"/>
  <text x="119" y="124" font-size="7.5" fill="#166534" text-anchor="middle">② Set up partial fraction form</text>
  <rect x="16" y="134" width="206" height="20" rx="3" fill="#fef3c7"/>
  <text x="119" y="148" font-size="7.5" fill="#92400e" text-anchor="middle">③ Multiply both sides by denom</text>
  <rect x="16" y="158" width="206" height="30" rx="3" fill="#ede9fe"/>
  <text x="119" y="172" font-size="7.5" fill="#5b21b6" text-anchor="middle">④ Solve for A, B using</text>
  <text x="119" y="184" font-size="7.5" fill="#5b21b6" text-anchor="middle">strategic x values or matching</text>
  <!-- Example panel -->
  <rect x="238" y="62" width="234" height="132" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="355" y="80" font-size="8.5" fill="#92400e" text-anchor="middle" font-weight="700">Solving for A and B</text>
  <text x="355" y="96" font-size="8" fill="#78350f" text-anchor="middle">1 = A(x−1) + B(x+2)</text>
  <rect x="246" y="102" width="218" height="20" rx="3" fill="#fde68a"/>
  <text x="355" y="116" font-size="8" fill="#92400e" text-anchor="middle">x=1: 1 = A(0) + B(3) → B = 1/3</text>
  <rect x="246" y="126" width="218" height="20" rx="3" fill="#fde68a"/>
  <text x="355" y="140" font-size="8" fill="#92400e" text-anchor="middle">x=−2: 1 = A(−3)+B(0) → A = −1/3</text>
  <rect x="246" y="150" width="218" height="38" rx="3" fill="#dcfce7"/>
  <text x="355" y="164" font-size="8" fill="#166534" text-anchor="middle">∫ dx/(x²+x−2)</text>
  <text x="355" y="180" font-size="8" fill="#166534" text-anchor="middle">= −(1/3)ln|x+2| + (1/3)ln|x−1| + C</text>
</svg>
