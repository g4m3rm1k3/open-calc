<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" style="font-family: ui-monospace, monospace; border-radius: 12px;">
  <style>.bg{fill:rgb(var(--tw-custom-slate-50))}.dark .bg{fill:rgb(var(--tw-custom-slate-900))}</style>
  <rect width="480" height="200" rx="12" class="bg"/>
  <text x="240" y="16" font-size="11" fill="#4338ca" text-anchor="middle" font-weight="700">Why + C? — The Constant of Integration</text>
  <rect x="8" y="22" width="270" height="172" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="28" y1="165" x2="270" y2="165" stroke="#64748b" stroke-width="1"/>
  <line x1="28" y1="28" x2="28" y2="168" stroke="#64748b" stroke-width="1"/>
  <!-- Multiple parallel parabola curves (same derivative) -->
  <path d="M 45,158 Q 80,130 130,90 Q 165,65 200,50 Q 220,43 250,38" fill="none" stroke="#6366f1" stroke-width="2"/>
  <text x="252" y="38" font-size="7.5" fill="#6366f1">C=0</text>
  <path d="M 55,158 Q 90,138 130,108 Q 160,88 195,72 Q 215,64 245,58" fill="none" stroke="#3b82f6" stroke-width="2"/>
  <text x="248" y="60" font-size="7.5" fill="#3b82f6">C=+1</text>
  <path d="M 38,158 Q 72,122 115,80 Q 150,52 185,38 Q 205,30 230,26" fill="none" stroke="#ef4444" stroke-width="2"/>
  <text x="232" y="26" font-size="7.5" fill="#ef4444">C=−1</text>
  <!-- Same derivative tangent lines at x=130 -->
  <circle cx="130" cy="90" r="4" fill="#6366f1"/>
  <circle cx="130" cy="108" r="4" fill="#3b82f6"/>
  <circle cx="130" cy="80" r="4" fill="#ef4444"/>
  <line x1="100" y1="80" x2="160" y2="68" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 2"/>
  <!-- All parallel tangent lines -->
  <text x="150" y="140" font-size="8" fill="#64748b">All have f′(x) = same!</text>
  <!-- Right panel: why C matters -->
  <rect x="286" y="26" width="186" height="168" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="379" y="46" font-size="8.5" fill="#4338ca" text-anchor="middle" font-weight="700">Why + C is Necessary</text>
  <text x="379" y="64" font-size="8" fill="#4338ca" text-anchor="middle">d/dx[x² + 5] = 2x</text>
  <text x="379" y="78" font-size="8" fill="#4338ca" text-anchor="middle">d/dx[x² − 3] = 2x</text>
  <text x="379" y="92" font-size="8" fill="#4338ca" text-anchor="middle">d/dx[x² + π] = 2x</text>
  <text x="379" y="108" font-size="8" fill="#4338ca" text-anchor="middle">All the same derivative!</text>
  <line x1="294" y1="116" x2="462" y2="116" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="294" y="122" width="166" height="26" rx="4" fill="#dbeafe"/>
  <text x="379" y="136" font-size="8.5" fill="#1d4ed8" text-anchor="middle" font-weight="700">∫ 2x dx = x² + C</text>
  <text x="379" y="158" font-size="7.5" fill="#4338ca" text-anchor="middle">C is determined only when</text>
  <text x="379" y="172" font-size="7.5" fill="#4338ca" text-anchor="middle">you add an initial condition</text>
  <text x="379" y="186" font-size="7.5" fill="#ef4444" text-anchor="middle">e.g. F(0) = 3 → C = 3</text>
</svg>
