<svg viewBox="0 0 480 215" xmlns="http://www.w3.org/2000/svg" style="font-family: ui-monospace, monospace; border-radius: 12px;">
  <style>
    .bg  { fill: #f8fafc; }
    .ax  { stroke: #94a3b8; }
    .axf { fill: #94a3b8; }
    .mu  { fill: #64748b; }
    .dark .bg  { fill: #0f172a; }
    .dark .ax  { stroke: #475569; }
    .dark .axf { fill: #475569; }
    .dark .mu  { fill: #64748b; }
  </style>
  <rect width="480" height="215" rx="12" class="bg"/>

  <text x="240" y="18" font-size="11" fill="#4338ca" text-anchor="middle" font-weight="700">Mean Value Theorem for Integrals — The Equal-Area Rectangle</text>

  <!-- LEFT: Main visualization -->
  <!-- Axes: origin at (36, 165), scale = 50px per unit, x spans 0..3.5 -->
  <line x1="32"  y1="165" x2="230" y2="165" class="ax" stroke-width="1.2"/>
  <line x1="32"  y1="36"  x2="32"  y2="168" class="ax" stroke-width="1.2"/>
  <polygon points="228,161 236,165 228,169" class="axf"/>

  <!-- Bounds a=0.5 (x=61) and b=3 (x=186) -->
  <line x1="61"  y1="162" x2="61"  y2="168" class="ax" stroke-width="1"/>
  <line x1="186" y1="162" x2="186" y2="168" class="ax" stroke-width="1"/>
  <text x="61"  y="178" font-size="9" class="mu" text-anchor="middle">a</text>
  <text x="186" y="178" font-size="9" class="mu" text-anchor="middle">b</text>

  <!-- f(x): wavy curve (varying height) from a to b -->
  <path d="M 61,90 C 80,70 100,50 120,65 C 140,78 155,100 170,88 C 178,82 183,78 186,80"
        fill="none" stroke="#6366f1" stroke-width="2.5"/>
  <!-- Shade area under curve -->
  <path d="M 61,90 C 80,70 100,50 120,65 C 140,78 155,100 170,88 C 178,82 183,78 186,80 L 186,165 L 61,165 Z"
        fill="#6366f1" fill-opacity="0.1"/>

  <!-- Average value f_avg: horizontal line at some height — visually "levels out" the area -->
  <!-- f_avg ≈ 85 in SVG → y = 165 - 85 = 80? Let's pick y=95 as the average line -->
  <line x1="61" y1="105" x2="186" y2="105" stroke="#ef4444" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="30" y="109" font-size="9" fill="#ef4444" text-anchor="end">f_avg</text>

  <!-- Rectangle with same area -->
  <rect x="61" y="105" width="125" height="60" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- c point where f(c) = f_avg (intersection) -->
  <!-- f_avg line at y=105; curve goes through this around x=155 (svg) -->
  <circle cx="155" cy="105" r="5" fill="#f59e0b"/>
  <line x1="155" y1="105" x2="155" y2="165" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="155" y="180" font-size="9" fill="#f59e0b" text-anchor="middle">c</text>
  <text x="160" y="100" font-size="8.5" fill="#f59e0b">f(c) = f_avg</text>

  <!-- Equal area annotation -->
  <text x="123" y="140" font-size="9" fill="#ef4444" text-anchor="middle" opacity="0.8">same area</text>

  <!-- DIVIDER -->
  <line x1="248" y1="28" x2="248" y2="205" stroke="#e2e8f0" stroke-width="1"/>

  <!-- RIGHT: Theorem statement and formula -->
  <text x="364" y="34" font-size="9" fill="#4338ca" text-anchor="middle" font-weight="700">MVT for Integrals</text>

  <rect x="256" y="44" width="216" height="60" rx="5" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1"/>
  <text x="364" y="60" font-size="8.5" fill="#4338ca" text-anchor="middle">If f is continuous on [a, b], then</text>
  <text x="364" y="74" font-size="8.5" fill="#4338ca" text-anchor="middle">∃ c ∈ (a, b) such that:</text>
  <text x="364" y="94" font-size="12" fill="#6366f1" text-anchor="middle" font-weight="700">f(c) = 1/(b−a) ∫ f dx</text>

  <!-- Average value formula -->
  <text x="364" y="120" font-size="9" fill="#4338ca" text-anchor="middle" font-weight="700">Average Value Formula</text>
  <rect x="256" y="126" width="216" height="34" rx="4" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1"/>
  <text x="364" y="142" font-size="11" fill="#059669" text-anchor="middle" font-weight="700">f_avg = 1/(b−a) ∫ₐᵇ f(x) dx</text>
  <text x="364" y="155" font-size="8" class="mu" text-anchor="middle">(area ÷ width = average height)</text>

  <!-- Physical meaning -->
  <rect x="256" y="168" width="216" height="36" rx="5" fill="#fef9c3" stroke="#fde68a" stroke-width="1"/>
  <text x="364" y="183" font-size="9" fill="#d97706" text-anchor="middle">Physical reading: average speed</text>
  <text x="262" y="197" font-size="8.5" fill="#92400e">If d(t) = position, then ∫v dt / (b−a)</text>
  <text x="262" y="208" font-size="8.5" fill="#92400e">= average velocity over [a,b]</text>
</svg>
