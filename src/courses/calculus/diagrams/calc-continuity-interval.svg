<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" style="font-family: ui-monospace, monospace; border-radius: 12px;">
  <style>
    .bg  { fill: rgb(var(--tw-custom-slate-50)); }
    .mu  { fill: rgb(var(--tw-custom-slate-500)); }
    .tx  { fill: rgb(var(--tw-custom-slate-900)); }
    .dark .bg  { fill: rgb(var(--tw-custom-slate-900)); }
    .dark .mu  { fill: rgb(var(--tw-custom-slate-400)); }
    .dark .tx  { fill: rgb(var(--tw-custom-slate-200)); }
  </style>
  <rect width="480" height="200" rx="12" class="bg"/>
  <text x="240" y="17" font-size="11" fill="#4338ca" text-anchor="middle" font-weight="700">Continuity — Three Conditions at a Point</text>

  <!-- Three condition boxes across the top -->
  <rect x="10" y="26" width="140" height="54" rx="7" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="80" y="43" font-size="8.5" fill="#059669" text-anchor="middle" font-weight="700">① f(c) exists</text>
  <text x="80" y="56" font-size="7.5" class="mu" text-anchor="middle">the function is defined</text>
  <text x="80" y="68" font-size="7.5" class="mu" text-anchor="middle">at x = c (no hole/undef.)</text>

  <rect x="170" y="26" width="140" height="54" rx="7" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="240" y="43" font-size="8.5" fill="#059669" text-anchor="middle" font-weight="700">② lim f(x) exists</text>
  <text x="240" y="56" font-size="7.5" class="mu" text-anchor="middle">as x → c, left and right</text>
  <text x="240" y="68" font-size="7.5" class="mu" text-anchor="middle">limits agree</text>

  <rect x="330" y="26" width="140" height="54" rx="7" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="400" y="43" font-size="8.5" fill="#059669" text-anchor="middle" font-weight="700">③ lim = f(c)</text>
  <text x="400" y="56" font-size="7.5" class="mu" text-anchor="middle">where you're heading</text>
  <text x="400" y="68" font-size="7.5" class="mu" text-anchor="middle">is where you arrive</text>

  <!-- Plus signs and "and" -->
  <text x="158" y="56" font-size="16" fill="#94a3b8" text-anchor="middle">+</text>
  <text x="318" y="56" font-size="16" fill="#94a3b8" text-anchor="middle">+</text>

  <!-- Arrow down to result -->
  <line x1="240" y1="82" x2="240" y2="96" stroke="#059669" stroke-width="2"/>
  <polygon points="240,102 234,90 246,90" fill="#059669"/>
  <text x="240" y="116" font-size="10" fill="#059669" text-anchor="middle" font-weight="700">All three → f is CONTINUOUS at c</text>

  <!-- Bottom: three failure cases side by side -->
  <text x="240" y="132" font-size="8.5" class="mu" text-anchor="middle">Failures — one condition missing:</text>

  <!-- Failure 1: hole (f(c) missing) -->
  <rect x="10" y="138" width="140" height="54" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="80" y="154" font-size="8" fill="#dc2626" text-anchor="middle" font-weight="700">① fails: removable</text>
  <!-- Mini curve with hole -->
  <path d="M 18,178 Q 50,155 80,155 Q 110,155 140,175" fill="none" stroke="#dc2626" stroke-width="1.5"/>
  <circle cx="80" cy="155" r="3.5" fill="white" stroke="#dc2626" stroke-width="1.5"/>
  <text x="80" y="190" font-size="7" class="mu" text-anchor="middle">f(2) undefined</text>

  <!-- Failure 2: jump (limit DNE) -->
  <rect x="170" y="138" width="140" height="54" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="240" y="154" font-size="8" fill="#dc2626" text-anchor="middle" font-weight="700">② fails: jump</text>
  <line x1="178" y1="178" x2="232" y2="160" stroke="#dc2626" stroke-width="1.5"/>
  <circle cx="232" cy="160" r="3.5" fill="white" stroke="#dc2626" stroke-width="1.5"/>
  <line x1="248" y1="172" x2="302" y2="158" stroke="#dc2626" stroke-width="1.5"/>
  <circle cx="248" cy="172" r="3.5" fill="#dc2626" stroke="#dc2626" stroke-width="1.5"/>
  <text x="240" y="190" font-size="7" class="mu" text-anchor="middle">left ≠ right</text>

  <!-- Failure 3: limit ≠ f(c) -->
  <rect x="330" y="138" width="140" height="54" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="400" y="154" font-size="8" fill="#dc2626" text-anchor="middle" font-weight="700">③ fails: misplaced pt</text>
  <path d="M 338,178 Q 370,158 400,158 Q 430,158 462,175" fill="none" stroke="#dc2626" stroke-width="1.5"/>
  <circle cx="400" cy="158" r="3.5" fill="white" stroke="#dc2626" stroke-width="1.5"/>
  <circle cx="400" cy="145" r="3.5" fill="#dc2626" stroke="#dc2626" stroke-width="1.5"/>
  <text x="400" y="190" font-size="7" class="mu" text-anchor="middle">lim=L but f(c)≠L</text>
</svg>
