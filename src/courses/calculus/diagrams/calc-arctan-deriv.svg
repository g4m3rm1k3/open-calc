<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" style="font-family: ui-monospace, monospace; border-radius: 12px;">
  <style>
    .bg { fill: rgb(var(--tw-custom-slate-50)); }
    .dark .bg { fill: rgb(var(--tw-custom-slate-900)); }
  </style>
  <rect width="480" height="200" rx="12" class="bg"/>
  <text x="240" y="16" font-size="11" fill="#4338ca" text-anchor="middle" font-weight="700">Inverse Trig Derivatives — arcsin, arccos, arctan</text>

  <rect x="8" y="22" width="464" height="172" rx="8" fill="#1e1b4b"/>

  <!-- Three columns -->
  <line x1="164" y1="22" x2="164" y2="194" stroke="#312e81" stroke-width="1"/>
  <line x1="320" y1="22" x2="320" y2="194" stroke="#312e81" stroke-width="1"/>

  <!-- arcsin -->
  <text x="86" y="40" font-size="9" fill="#4ade80" text-anchor="middle" font-weight="700">arcsin(x)</text>
  <line x1="8" y1="44" x2="164" y2="44" stroke="#312e81" stroke-width="0.5"/>

  <rect x="16" y="48" width="140" height="22" rx="4" fill="#312e81"/>
  <text x="86" y="63" font-size="10" fill="#4ade80" text-anchor="middle" font-weight="700">1/√(1−x²)</text>

  <text x="86" y="82" font-size="8" fill="#94a3b8" text-anchor="middle">Domain: (−1, 1)</text>
  <text x="86" y="96" font-size="8" fill="#94a3b8" text-anchor="middle">Slope is always &gt; 0</text>

  <!-- Mini graph of arcsin -->
  <line x1="20" y1="152" x2="156" y2="152" stroke="#64748b" stroke-width="1"/>
  <line x1="88" y1="108" x2="88" y2="156" stroke="#64748b" stroke-width="1"/>
  <path d="M 26,152 Q 40,148 56,138 Q 72,126 88,118 Q 104,110 120,104 Q 136,100 150,98" fill="none" stroke="#4ade80" stroke-width="2"/>
  <text x="86" y="102" font-size="7.5" fill="#4ade80" text-anchor="middle">arcsin(x)</text>
  <text x="86" y="168" font-size="7.5" fill="#94a3b8" text-anchor="middle">flattens at ±1</text>
  <text x="86" y="180" font-size="7.5" fill="#4ade80" text-anchor="middle">slope → ∞ at ends</text>

  <!-- arccos -->
  <text x="242" y="40" font-size="9" fill="#f87171" text-anchor="middle" font-weight="700">arccos(x)</text>
  <line x1="164" y1="44" x2="320" y2="44" stroke="#312e81" stroke-width="0.5"/>

  <rect x="172" y="48" width="140" height="22" rx="4" fill="#312e81"/>
  <text x="242" y="63" font-size="10" fill="#f87171" text-anchor="middle" font-weight="700">−1/√(1−x²)</text>

  <text x="242" y="82" font-size="8" fill="#94a3b8" text-anchor="middle">Domain: (−1, 1)</text>
  <text x="242" y="96" font-size="8" fill="#94a3b8" text-anchor="middle">Negative: arccos decreases</text>

  <text x="242" y="120" font-size="8" fill="#94a3b8" text-anchor="middle">Key identity:</text>
  <rect x="172" y="126" width="140" height="20" rx="4" fill="#312e81"/>
  <text x="242" y="139" font-size="8.5" fill="#f87171" text-anchor="middle">arcsin + arccos = π/2</text>
  <text x="242" y="158" font-size="7.5" fill="#94a3b8" text-anchor="middle">So d/dx[arccos] = −d/dx[arcsin]</text>
  <text x="242" y="172" font-size="7.5" fill="#94a3b8" text-anchor="middle">derivatives are negatives</text>
  <text x="242" y="186" font-size="7.5" fill="#f87171" text-anchor="middle">of each other ✓</text>

  <!-- arctan -->
  <text x="396" y="40" font-size="9" fill="#fbbf24" text-anchor="middle" font-weight="700">arctan(x)</text>
  <line x1="320" y1="44" x2="472" y2="44" stroke="#312e81" stroke-width="0.5"/>

  <rect x="328" y="48" width="140" height="22" rx="4" fill="#312e81"/>
  <text x="398" y="63" font-size="10" fill="#fbbf24" text-anchor="middle" font-weight="700">1/(1+x²)</text>

  <text x="398" y="82" font-size="8" fill="#94a3b8" text-anchor="middle">Domain: all real x</text>
  <text x="398" y="96" font-size="8" fill="#94a3b8" text-anchor="middle">Most commonly used</text>

  <!-- Mini graph of arctan -->
  <line x1="328" y1="152" x2="464" y2="152" stroke="#64748b" stroke-width="1"/>
  <line x1="396" y1="108" x2="396" y2="156" stroke="#64748b" stroke-width="1"/>
  <path d="M 330,146 Q 350,144 368,140 Q 382,136 396,132 Q 410,128 426,124 Q 440,122 462,120" fill="none" stroke="#fbbf24" stroke-width="2"/>
  <text x="398" y="118" font-size="7.5" fill="#fbbf24" text-anchor="middle">arctan(x)</text>
  <text x="398" y="168" font-size="7.5" fill="#94a3b8" text-anchor="middle">→ π/2 as x→∞</text>
  <text x="398" y="180" font-size="7.5" fill="#fbbf24" text-anchor="middle">slope 1/(1+x²)→0</text>
</svg>
