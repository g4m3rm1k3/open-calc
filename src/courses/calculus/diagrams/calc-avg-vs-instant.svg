<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" style="font-family: ui-monospace, monospace; border-radius: 12px;">
  <style>
    .bg  { fill: rgb(var(--tw-custom-slate-50)); }
    .mu  { fill: rgb(var(--tw-custom-slate-500)); }
    .tx  { fill: rgb(var(--tw-custom-slate-900)); }
    .dark .bg  { fill: rgb(var(--tw-custom-slate-900)); }
    .dark .mu  { fill: rgb(var(--tw-custom-slate-400)); }
    .dark .tx  { fill: rgb(var(--tw-custom-slate-200)); }
  </style>
  <rect width="480" height="200" rx="12" class="bg"/>
  <text x="240" y="17" font-size="11" fill="#4338ca" text-anchor="middle" font-weight="700">Average vs Instantaneous Rate of Change</text>

  <!-- LEFT: Average rate -->
  <rect x="10" y="24" width="218" height="168" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="119" y="42" font-size="9" fill="#4338ca" text-anchor="middle" font-weight="700">AVERAGE Rate of Change</text>

  <!-- Mini axes -->
  <line x1="28" y1="170" x2="218" y2="170" stroke="#64748b" stroke-width="1"/>
  <line x1="28" y1="50" x2="28" y2="174" stroke="#64748b" stroke-width="1"/>

  <!-- Curve -->
  <path d="M 36,162 Q 80,148 120,118 Q 155,92 200,66" fill="none" stroke="#6366f1" stroke-width="2"/>

  <!-- Two points: A at (70,140) and B at (190,70) -->
  <circle cx="70" cy="140" r="4" fill="#6366f1"/>
  <circle cx="190" cy="70" r="4" fill="#6366f1"/>

  <!-- Secant line through A and B, extended -->
  <line x1="30" y1="156" x2="210" y2="56" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="5,3"/>

  <!-- Rise/run dashes -->
  <line x1="70" y1="140" x2="190" y2="140" stroke="#059669" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="190" y1="70" x2="190" y2="140" stroke="#059669" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Labels -->
  <text x="50" y="138" font-size="7.5" fill="#4338ca">a</text>
  <text x="192" y="138" font-size="7.5" fill="#4338ca">b</text>
  <text x="130" y="154" font-size="7.5" fill="#059669" text-anchor="middle">b−a</text>
  <text x="202" y="108" font-size="7.5" fill="#059669">f(b)−f(a)</text>

  <!-- Formula -->
  <rect x="18" y="152" width="202" height="20" rx="5" fill="#c7d2fe"/>
  <text x="119" y="165" font-size="9" fill="#3730a3" text-anchor="middle" font-weight="700">avg = [f(b)−f(a)] / (b−a)</text>

  <!-- RIGHT: Instantaneous rate -->
  <rect x="252" y="24" width="218" height="168" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="361" y="42" font-size="9" fill="#059669" text-anchor="middle" font-weight="700">INSTANTANEOUS Rate of Change</text>

  <!-- Mini axes -->
  <line x1="270" y1="170" x2="460" y2="170" stroke="#64748b" stroke-width="1"/>
  <line x1="270" y1="50" x2="270" y2="174" stroke="#64748b" stroke-width="1"/>

  <!-- Same curve, shifted -->
  <path d="M 278,162 Q 322,148 362,118 Q 397,92 442,66" fill="none" stroke="#10b981" stroke-width="2"/>

  <!-- Single point at c ≈ (362, 118) -->
  <circle cx="362" cy="118" r="4" fill="#10b981"/>
  <text x="370" y="116" font-size="7.5" fill="#10b981">c</text>

  <!-- Tangent line at the point -->
  <line x1="290" y1="156" x2="432" y2="68" stroke="#f59e0b" stroke-width="2"/>

  <!-- Tiny h arrow showing h→0 -->
  <circle cx="390" cy="96" r="2.5" fill="#6366f1" opacity="0.6"/>
  <line x1="390" y1="96" x2="364" y2="117" stroke="#6366f1" stroke-width="1" stroke-dasharray="2,2" opacity="0.6"/>
  <text x="394" y="88" font-size="6.5" fill="#6366f1" opacity="0.8">h → 0</text>

  <!-- Formula -->
  <rect x="260" y="152" width="202" height="20" rx="5" fill="#a7f3d0"/>
  <text x="361" y="165" font-size="9" fill="#065f46" text-anchor="middle" font-weight="700">inst = lim [f(c+h)−f(c)] / h</text>

  <!-- Connection note at very bottom -->
  <text x="240" y="198" font-size="0" fill="transparent">spacer</text>
</svg>
