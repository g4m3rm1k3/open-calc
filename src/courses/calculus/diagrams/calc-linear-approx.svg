<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" style="font-family: ui-monospace, monospace; border-radius: 12px;">
  <style>.bg{fill:rgb(var(--tw-custom-slate-50))}.dark .bg{fill:rgb(var(--tw-custom-slate-900))}</style>
  <rect width="480" height="200" rx="12" class="bg"/>
  <text x="240" y="16" font-size="11" fill="#4338ca" text-anchor="middle" font-weight="700">Linear Approximation — L(x) = f(a) + f ′(a)(x−a)</text>
  <rect x="8" y="22" width="270" height="172" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <!-- Axes -->
  <line x1="28" y1="172" x2="270" y2="172" stroke="#64748b" stroke-width="1"/>
  <line x1="28" y1="28" x2="28" y2="176" stroke="#64748b" stroke-width="1"/>
  <!-- Curve f(x) -->
  <path d="M 40,162 Q 70,148 100,128 Q 130,106 155,82 Q 175,62 200,45 Q 220,32 250,26" fill="none" stroke="#6366f1" stroke-width="2.5"/>
  <text x="252" y="28" font-size="8" fill="#6366f1">f(x)</text>
  <!-- Tangent line L(x) at a=155,y=82 -->
  <line x1="80" y1="122" x2="250" y2="42" stroke="#ef4444" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="252" y="46" font-size="8" fill="#ef4444">L(x)</text>
  <!-- Point a -->
  <circle cx="155" cy="82" r="6" fill="#059669"/>
  <line x1="155" y1="167" x2="155" y2="176" stroke="#059669" stroke-width="1.5"/>
  <text x="155" y="188" font-size="8.5" fill="#059669" text-anchor="middle">a</text>
  <!-- Point x near a -->
  <circle cx="200" cy="45" r="4" fill="#6366f1"/>
  <circle cx="200" cy="57" r="4" fill="#ef4444"/>
  <line x1="195" y1="45" x2="195" y2="57" stroke="#64748b" stroke-width="1.5"/>
  <text x="210" y="44" font-size="7.5" fill="#6366f1">f(x)</text>
  <text x="210" y="60" font-size="7.5" fill="#ef4444">L(x)</text>
  <text x="155" y="200" font-size="7.5" fill="#94a3b8" text-anchor="middle">near x = a</text>
  <!-- Formula panel -->
  <rect x="286" y="26" width="186" height="168" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="379" y="48" font-size="8.5" fill="#4338ca" text-anchor="middle" font-weight="700">Formula</text>
  <rect x="296" y="54" width="166" height="24" rx="4" fill="#dbeafe"/>
  <text x="379" y="70" font-size="9" fill="#1d4ed8" text-anchor="middle" font-weight="700">L(x) = f(a) + f ′(a)(x−a)</text>
  <text x="379" y="94" font-size="8" fill="#4338ca" text-anchor="middle">Example: f(x) = √x at a=9</text>
  <text x="379" y="110" font-size="8" fill="#4338ca" text-anchor="middle">f(9) = 3,  f ′(9) = 1/6</text>
  <text x="379" y="126" font-size="8" fill="#4338ca" text-anchor="middle">L(x) = 3 + (1/6)(x − 9)</text>
  <text x="379" y="146" font-size="8" fill="#059669" text-anchor="middle">Approx √9.1:</text>
  <text x="379" y="162" font-size="8" fill="#059669" text-anchor="middle">L(9.1) = 3 + (0.1)/6</text>
  <text x="379" y="178" font-size="8" fill="#059669" text-anchor="middle">≈ 3.01667  ✓</text>
</svg>
