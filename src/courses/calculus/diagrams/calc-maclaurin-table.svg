<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" style="font-family: ui-monospace, monospace; border-radius: 12px;">
  <style>.bg{fill:rgb(var(--tw-custom-slate-50))}.dark .bg{fill:rgb(var(--tw-custom-slate-900))}</style>
  <rect width="480" height="200" rx="12" class="bg"/>
  <text x="240" y="14" font-size="11" fill="#4338ca" text-anchor="middle" font-weight="700">Essential Maclaurin Series</text>
  <!-- Table -->
  <rect x="8" y="20" width="464" height="14" rx="0" fill="#6366f1"/>
  <text x="108" y="31" font-size="8" fill="white" text-anchor="middle" font-weight="700">f(x)</text>
  <text x="298" y="31" font-size="8" fill="white" text-anchor="middle" font-weight="700">Maclaurin Series</text>
  <text x="430" y="31" font-size="8" fill="white" text-anchor="middle" font-weight="700">Converges</text>
  <rect x="8" y="34" width="464" height="18" rx="0" fill="#eef2ff"/>
  <text x="108" y="47" font-size="8" fill="#1d4ed8" text-anchor="middle">eˣ</text>
  <text x="298" y="47" font-size="8" fill="#374151" text-anchor="middle">1 + x + x²/2! + x³/3! + … = Σ xⁿ/n!</text>
  <text x="430" y="47" font-size="8" fill="#374151" text-anchor="middle">all x</text>
  <rect x="8" y="52" width="464" height="18" rx="0" fill="#f8fafc"/>
  <text x="108" y="65" font-size="8" fill="#374151" text-anchor="middle">sin x</text>
  <text x="298" y="65" font-size="8" fill="#374151" text-anchor="middle">x − x³/3! + x⁵/5! − … = Σ(−1)ⁿx²ⁿ⁺¹/(2n+1)!</text>
  <text x="430" y="65" font-size="8" fill="#374151" text-anchor="middle">all x</text>
  <rect x="8" y="70" width="464" height="18" rx="0" fill="#eef2ff"/>
  <text x="108" y="83" font-size="8" fill="#1d4ed8" text-anchor="middle">cos x</text>
  <text x="298" y="83" font-size="8" fill="#374151" text-anchor="middle">1 − x²/2! + x⁴/4! − … = Σ(−1)ⁿx²ⁿ/(2n)!</text>
  <text x="430" y="83" font-size="8" fill="#374151" text-anchor="middle">all x</text>
  <rect x="8" y="88" width="464" height="18" rx="0" fill="#f8fafc"/>
  <text x="108" y="101" font-size="8" fill="#374151" text-anchor="middle">1/(1−x)</text>
  <text x="298" y="101" font-size="8" fill="#374151" text-anchor="middle">1 + x + x² + x³ + … = Σ xⁿ</text>
  <text x="430" y="101" font-size="8" fill="#374151" text-anchor="middle">|x| &lt; 1</text>
  <rect x="8" y="106" width="464" height="18" rx="0" fill="#eef2ff"/>
  <text x="108" y="119" font-size="8" fill="#1d4ed8" text-anchor="middle">ln(1+x)</text>
  <text x="298" y="119" font-size="8" fill="#374151" text-anchor="middle">x − x²/2 + x³/3 − … = Σ(−1)ⁿ⁺¹xⁿ/n</text>
  <text x="430" y="119" font-size="8" fill="#374151" text-anchor="middle">−1 &lt; x ≤ 1</text>
  <rect x="8" y="124" width="464" height="18" rx="0" fill="#f8fafc"/>
  <text x="108" y="137" font-size="8" fill="#374151" text-anchor="middle">arctan x</text>
  <text x="298" y="137" font-size="8" fill="#374151" text-anchor="middle">x − x³/3 + x⁵/5 − … = Σ(−1)ⁿx²ⁿ⁺¹/(2n+1)</text>
  <text x="430" y="137" font-size="8" fill="#374151" text-anchor="middle">|x| ≤ 1</text>
  <rect x="8" y="142" width="464" height="18" rx="0" fill="#eef2ff"/>
  <text x="108" y="155" font-size="8" fill="#1d4ed8" text-anchor="middle">(1+x)ᵏ</text>
  <text x="298" y="155" font-size="8" fill="#374151" text-anchor="middle">1 + kx + k(k−1)x²/2! + … (binomial)</text>
  <text x="430" y="155" font-size="8" fill="#374151" text-anchor="middle">|x| &lt; 1</text>
  <rect x="8" y="168" width="464" height="28" rx="4" fill="#dcfce7"/>
  <text x="240" y="183" font-size="8" fill="#166534" text-anchor="middle" font-weight="700">Tip: know these cold — derive others by substitution, differentiation, or integration</text>
</svg>
