<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" style="font-family: ui-monospace, monospace; border-radius: 12px;">
  <style>.bg{fill:rgb(var(--tw-custom-slate-50))}.dark .bg{fill:rgb(var(--tw-custom-slate-900))}</style>
  <rect width="480" height="200" rx="12" class="bg"/>
  <text x="240" y="16" font-size="11" fill="#4338ca" text-anchor="middle" font-weight="700">Asymptotes in Curve Sketching</text>
  <rect x="8" y="22" width="290" height="172" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <!-- Axes -->
  <line x1="28" y1="168" x2="290" y2="168" stroke="#64748b" stroke-width="1"/>
  <line x1="28" y1="28" x2="28" y2="172" stroke="#64748b" stroke-width="1"/>
  <!-- Vertical asymptote at x=160 -->
  <line x1="160" y1="28" x2="160" y2="168" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="168" y="38" font-size="8" fill="#ef4444">vertical</text>
  <text x="168" y="50" font-size="8" fill="#ef4444">asymptote</text>
  <!-- Horizontal asymptote at y=50 -->
  <line x1="28" y1="50" x2="290" y2="50" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="34" y="46" font-size="8" fill="#7c3aed">horiz asymptote y=L</text>
  <!-- Left branch: approaches vert asymp from left, and horiz from left -->
  <path d="M 40,52 Q 60,50 80,48 Q 100,46 115,44 Q 130,42 142,36 Q 148,30 150,28" fill="none" stroke="#6366f1" stroke-width="2.5"/>
  <!-- Right branch: comes from bottom, goes right approaching horizontal -->
  <path d="M 170,168 Q 174,158 178,148 Q 182,130 192,100 Q 205,70 220,56 Q 240,50 260,50 Q 275,50 285,50" fill="none" stroke="#6366f1" stroke-width="2.5"/>
  <!-- x-axis label -->
  <text x="290" y="174" font-size="8" fill="#64748b">x</text>
  <!-- Annotations -->
  <text x="90" y="36" font-size="7.5" fill="#6366f1" text-anchor="middle">f → L as x → −∞</text>
  <text x="230" y="62" font-size="7.5" fill="#6366f1">f → L as x → +∞</text>
  <text x="118" y="76" font-size="7.5" fill="#ef4444" text-anchor="middle">f → ∞ near VA</text>

  <!-- Side panel: types of asymptotes -->
  <rect x="306" y="26" width="166" height="168" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="389" y="44" font-size="8.5" fill="#4338ca" text-anchor="middle" font-weight="700">Asymptote Types</text>
  <rect x="314" y="52" width="150" height="32" rx="4" fill="#fee2e2"/>
  <text x="389" y="66" font-size="8" fill="#991b1b" text-anchor="middle" font-weight="700">Vertical: x = a</text>
  <text x="389" y="80" font-size="7.5" fill="#991b1b" text-anchor="middle">lim f(x) = ±∞ as x→a</text>
  <rect x="314" y="90" width="150" height="32" rx="4" fill="#ede9fe"/>
  <text x="389" y="104" font-size="8" fill="#5b21b6" text-anchor="middle" font-weight="700">Horizontal: y = L</text>
  <text x="389" y="118" font-size="7.5" fill="#5b21b6" text-anchor="middle">lim f(x) = L as x→±∞</text>
  <rect x="314" y="128" width="150" height="56" rx="4" fill="#fef3c7"/>
  <text x="389" y="144" font-size="8" fill="#92400e" text-anchor="middle" font-weight="700">Oblique: y = mx+b</text>
  <text x="389" y="158" font-size="7.5" fill="#78350f" text-anchor="middle">deg(num)=deg(denom)+1</text>
  <text x="389" y="172" font-size="7.5" fill="#78350f" text-anchor="middle">Use polynomial division</text>
</svg>
