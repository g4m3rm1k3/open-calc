<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" style="font-family: ui-monospace, monospace; border-radius: 12px;">
  <style>.bg{fill:rgb(var(--tw-custom-slate-50))}.dark .bg{fill:rgb(var(--tw-custom-slate-900))}</style>
  <rect width="480" height="200" rx="12" class="bg"/>
  <text x="240" y="16" font-size="11" fill="#4338ca" text-anchor="middle" font-weight="700">Set Operations — Venn Diagram</text>
  <!-- Three venn panels: union, intersection, difference -->
  <rect x="8" y="24" width="146" height="170" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="81" y="40" font-size="8.5" fill="#4338ca" text-anchor="middle" font-weight="700">A ∪ B (Union)</text>
  <circle cx="65" cy="110" r="42" fill="#6366f1" opacity="0.4"/>
  <circle cx="97" cy="110" r="42" fill="#6366f1" opacity="0.4"/>
  <text x="81" y="113" font-size="7.5" fill="#374151" text-anchor="middle" font-weight="700">A ∪ B</text>
  <text x="81" y="168" font-size="7.5" fill="#374151" text-anchor="middle">all x in A OR B</text>
  <rect x="162" y="24" width="156" height="170" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="240" y="40" font-size="8.5" fill="#166534" text-anchor="middle" font-weight="700">A ∩ B (Intersection)</text>
  <circle cx="218" cy="110" r="42" fill="#6366f1" opacity="0.2"/>
  <circle cx="262" cy="110" r="42" fill="#22c55e" opacity="0.2"/>
  <!-- overlap only highlighted -->
  <ellipse cx="240" cy="110" rx="20" ry="30" fill="#374151" opacity="0.5"/>
  <text x="240" y="113" font-size="7.5" fill="white" text-anchor="middle" font-weight="700">A∩B</text>
  <text x="240" y="168" font-size="7.5" fill="#374151" text-anchor="middle">all x in A AND B</text>
  <rect x="326" y="24" width="146" height="170" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="399" y="40" font-size="8.5" fill="#92400e" text-anchor="middle" font-weight="700">A \ B (Difference)</text>
  <circle cx="376" cy="110" r="42" fill="#f59e0b" opacity="0.4"/>
  <circle cx="420" cy="110" r="42" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <!-- Left-only part -->
  <text x="358" y="113" font-size="7.5" fill="#374151" text-anchor="middle" font-weight="700">A\B</text>
  <text x="399" y="168" font-size="7.5" fill="#374151" text-anchor="middle">x in A but not in B</text>
</svg>
