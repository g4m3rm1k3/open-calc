<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" style="font-family: ui-monospace, monospace; border-radius: 12px;">
  <style>.bg{fill:rgb(var(--tw-custom-slate-50))}.dark .bg{fill:rgb(var(--tw-custom-slate-900))}</style>
  <rect width="480" height="200" rx="12" class="bg"/>
  <text x="240" y="16" font-size="11" fill="#4338ca" text-anchor="middle" font-weight="700">First Derivative Test — Finding Local Extrema</text>
  <!-- Local MIN panel -->
  <rect x="8" y="26" width="224" height="168" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="120" y="46" font-size="9" fill="#166534" text-anchor="middle" font-weight="700">LOCAL MINIMUM</text>
  <text x="120" y="60" font-size="8" fill="#166534" text-anchor="middle">f ′ changes − → +</text>
  <!-- Number line -->
  <line x1="20" y1="78" x2="224" y2="78" stroke="#374151" stroke-width="1.5"/>
  <circle cx="120" cy="78" r="5" fill="#16a34a"/>
  <text x="120" y="96" font-size="9" fill="#166534" text-anchor="middle">c</text>
  <text x="65" y="73" font-size="9" fill="#ef4444" text-anchor="middle">f ′ &lt; 0</text>
  <text x="175" y="73" font-size="9" fill="#059669" text-anchor="middle">f ′ &gt; 0</text>
  <text x="55" y="88" font-size="8" fill="#ef4444" text-anchor="middle">decr ↓</text>
  <text x="178" y="88" font-size="8" fill="#059669" text-anchor="middle">incr ↑</text>
  <!-- U-shape curve -->
  <path d="M 30,165 Q 70,145 120,120 Q 145,108 165,120 Q 195,138 220,165" fill="none" stroke="#16a34a" stroke-width="2.5"/>
  <circle cx="120" cy="118" r="5" fill="#16a34a"/>
  <text x="120" y="112" font-size="7.5" fill="#166534" text-anchor="middle" dy="-2">min</text>

  <!-- Local MAX panel -->
  <rect x="248" y="26" width="224" height="168" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="360" y="46" font-size="9" fill="#991b1b" text-anchor="middle" font-weight="700">LOCAL MAXIMUM</text>
  <text x="360" y="60" font-size="8" fill="#991b1b" text-anchor="middle">f ′ changes + → −</text>
  <!-- Number line -->
  <line x1="258" y1="78" x2="462" y2="78" stroke="#374151" stroke-width="1.5"/>
  <circle cx="360" cy="78" r="5" fill="#dc2626"/>
  <text x="360" y="96" font-size="9" fill="#991b1b" text-anchor="middle">c</text>
  <text x="305" y="73" font-size="9" fill="#059669" text-anchor="middle">f ′ &gt; 0</text>
  <text x="415" y="73" font-size="9" fill="#ef4444" text-anchor="middle">f ′ &lt; 0</text>
  <text x="298" y="88" font-size="8" fill="#059669" text-anchor="middle">incr ↑</text>
  <text x="415" y="88" font-size="8" fill="#ef4444" text-anchor="middle">decr ↓</text>
  <!-- Hill curve -->
  <path d="M 268,165 Q 300,140 340,115 Q 360,102 380,115 Q 410,138 452,165" fill="none" stroke="#dc2626" stroke-width="2.5"/>
  <circle cx="360" cy="102" r="5" fill="#dc2626"/>
  <text x="360" y="96" font-size="7.5" fill="#991b1b" text-anchor="middle" dy="-2">max</text>
</svg>
