<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" style="font-family: ui-monospace, monospace; border-radius: 12px;">
  <style>
    .bg  { fill: rgb(var(--tw-custom-slate-50)); }
    .mu  { fill: rgb(var(--tw-custom-slate-500)); }
    .tx  { fill: rgb(var(--tw-custom-slate-900)); }
    .dark .bg  { fill: rgb(var(--tw-custom-slate-900)); }
    .dark .mu  { fill: rgb(var(--tw-custom-slate-400)); }
    .dark .tx  { fill: rgb(var(--tw-custom-slate-200)); }
  </style>
  <rect width="480" height="200" rx="12" class="bg"/>

  <text x="240" y="17" font-size="11" fill="#4338ca" text-anchor="middle" font-weight="700">The Four Types of Slope</text>

  <!-- PANEL 1: Positive slope -->
  <rect x="10" y="24" width="104" height="166" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="62" y="40" font-size="9" fill="#059669" text-anchor="middle" font-weight="700">Positive</text>
  <text x="62" y="53" font-size="13" fill="#059669" text-anchor="middle" font-weight="800">m &gt; 0</text>
  <!-- Line going up-right -->
  <line x1="18" y1="160" x2="106" y2="72" stroke="#10b981" stroke-width="2.5"/>
  <!-- Rise/run indicator -->
  <line x1="50" y1="134" x2="80" y2="134" stroke="#065f46" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="80" y1="102" x2="80" y2="134" stroke="#065f46" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="65" y="146" font-size="7" fill="#065f46" text-anchor="middle">run</text>
  <text x="87" y="121" font-size="7" fill="#065f46">rise</text>
  <text x="62" y="182" font-size="7.5" class="mu" text-anchor="middle">goes up as x↑</text>

  <!-- PANEL 2: Negative slope -->
  <rect x="122" y="24" width="104" height="166" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="174" y="40" font-size="9" fill="#dc2626" text-anchor="middle" font-weight="700">Negative</text>
  <text x="174" y="53" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="800">m &lt; 0</text>
  <!-- Line going down-right -->
  <line x1="130" y1="72" x2="218" y2="160" stroke="#ef4444" stroke-width="2.5"/>
  <!-- Rise/run indicator -->
  <line x1="150" y1="100" x2="190" y2="100" stroke="#991b1b" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="190" y1="100" x2="190" y2="140" stroke="#991b1b" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="170" y="94" font-size="7" fill="#991b1b" text-anchor="middle">run</text>
  <text x="196" y="124" font-size="7" fill="#991b1b">fall</text>
  <text x="174" y="182" font-size="7.5" class="mu" text-anchor="middle">goes down as x↑</text>

  <!-- PANEL 3: Zero slope -->
  <rect x="234" y="24" width="104" height="166" rx="8" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5"/>
  <text x="286" y="40" font-size="9" fill="#0369a1" text-anchor="middle" font-weight="700">Zero</text>
  <text x="286" y="53" font-size="13" fill="#0369a1" text-anchor="middle" font-weight="800">m = 0</text>
  <!-- Flat horizontal line -->
  <line x1="242" y1="116" x2="330" y2="116" stroke="#0284c7" stroke-width="2.5"/>
  <!-- Arrows showing horizontal -->
  <text x="262" y="106" font-size="7.5" fill="#0369a1" text-anchor="middle">Δy = 0</text>
  <line x1="250" y1="108" x2="320" y2="108" stroke="#7dd3fc" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="286" y="182" font-size="7.5" class="mu" text-anchor="middle">perfectly flat</text>

  <!-- PANEL 4: Undefined slope -->
  <rect x="346" y="24" width="124" height="166" rx="8" fill="#fdf4ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="408" y="40" font-size="9" fill="#7e22ce" text-anchor="middle" font-weight="700">Undefined</text>
  <text x="408" y="53" font-size="11" fill="#7e22ce" text-anchor="middle" font-weight="800">m = undef.</text>
  <!-- Vertical line -->
  <line x1="408" y1="62" x2="408" y2="168" stroke="#a855f7" stroke-width="2.5"/>
  <text x="382" y="116" font-size="7.5" fill="#7e22ce" text-anchor="middle">Δx = 0</text>
  <text x="424" y="116" font-size="7.5" fill="#7e22ce" text-anchor="middle">÷ 0 !</text>
  <text x="408" y="182" font-size="7.5" class="mu" text-anchor="middle">perfectly vertical</text>
</svg>
