<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" style="font-family: ui-monospace, monospace; border-radius: 12px;">
  <style>
    .bg { fill: rgb(var(--tw-custom-slate-50)); }
    .dark .bg { fill: rgb(var(--tw-custom-slate-900)); }
  </style>
  <rect width="480" height="200" rx="12" class="bg"/>
  <text x="240" y="16" font-size="11" fill="#4338ca" text-anchor="middle" font-weight="700">Absolute Value and Radical Derivatives</text>

  <!-- LEFT: |x| and related -->
  <rect x="8" y="22" width="224" height="172" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="120" y="40" font-size="9.5" fill="#dc2626" text-anchor="middle" font-weight="700">Absolute Value d/dx|x|</text>

  <rect x="18" y="46" width="204" height="24" rx="5" fill="#fee2e2"/>
  <text x="120" y="62" font-size="9.5" fill="#7f1d1d" text-anchor="middle" font-weight="700">d/dx|x| = x / |x| = sgn(x)</text>

  <!-- Mini graph -->
  <line x1="18" y1="138" x2="222" y2="138" stroke="#64748b" stroke-width="1"/>
  <line x1="120" y1="76" x2="120" y2="142" stroke="#64748b" stroke-width="1" stroke-dasharray="2,2"/>
  <!-- |x| graph -->
  <path d="M 22,138 L 120,76 L 218,138" fill="none" stroke="#dc2626" stroke-width="2.5"/>
  <circle cx="120" cy="76" r="4" fill="#dc2626"/>
  <!-- Derivative: +1 right, -1 left -->
  <line x1="22" y1="120" x2="118" y2="120" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5,3"/>
  <line x1="122" y1="120" x2="218" y2="120" stroke="#059669" stroke-width="2" stroke-dasharray="5,3"/>
  <circle cx="120" cy="120" r="3.5" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="70" y="117" font-size="8" fill="#b45309" text-anchor="middle">slope=−1</text>
  <text x="170" y="117" font-size="8" fill="#059669" text-anchor="middle">slope=+1</text>
  <text x="120" y="156" font-size="8" fill="#94a3b8" text-anchor="middle">derivative undefined at x=0</text>
  <text x="120" y="170" font-size="7.5" fill="#94a3b8" text-anchor="middle">(corner — left ≠ right slope)</text>

  <rect x="18" y="176" width="204" height="14" rx="4" fill="#fecaca"/>
  <text x="120" y="186" font-size="7.5" fill="#991b1b" text-anchor="middle">d/dx|g(x)| = g′(x) · sgn(g(x))</text>

  <!-- RIGHT: radicals -->
  <rect x="248" y="22" width="224" height="172" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="360" y="40" font-size="9.5" fill="#15803d" text-anchor="middle" font-weight="700">Radical Derivatives</text>

  <text x="258" y="60" font-size="8.5" fill="#166534" font-weight="700">√x = x^(1/2):</text>
  <text x="258" y="76" font-size="9" fill="#059669">d/dx [√x] = 1/(2√x)</text>
  <text x="258" y="90" font-size="7.5" fill="#94a3b8">Power rule: (1/2)x^(−1/2) = 1/(2x^(1/2))</text>

  <line x1="258" y1="97" x2="462" y2="97" stroke="#bbf7d0" stroke-width="1"/>

  <text x="258" y="113" font-size="8.5" fill="#166534" font-weight="700">∛x = x^(1/3):</text>
  <text x="258" y="129" font-size="9" fill="#059669">d/dx [∛x] = 1/(3x^(2/3))</text>
  <text x="258" y="143" font-size="7.5" fill="#94a3b8">Power rule: (1/3)x^(−2/3)</text>

  <line x1="258" y1="150" x2="462" y2="150" stroke="#bbf7d0" stroke-width="1"/>

  <text x="258" y="166" font-size="8.5" fill="#166534" font-weight="700">Chain Rule with radicals:</text>
  <text x="258" y="180" font-size="8.5" fill="#059669">d/dx [√(x²+1)] = x/√(x²+1)</text>
  <text x="258" y="192" font-size="7.5" fill="#94a3b8">= (2x)·(1/(2√(x²+1))) = x/√(x²+1)</text>
</svg>
