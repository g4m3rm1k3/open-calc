<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" style="font-family: ui-monospace, monospace; border-radius: 12px;">
  <style>.bg{fill:rgb(var(--tw-custom-slate-50))}.dark .bg{fill:rgb(var(--tw-custom-slate-900))}</style>
  <rect width="480" height="200" rx="12" class="bg"/>
  <text x="240" y="16" font-size="11" fill="#4338ca" text-anchor="middle" font-weight="700">Inverse Trig — Derivatives (Calculus Table)</text>
  <!-- Header -->
  <rect x="8" y="24" width="464" height="16" rx="0" fill="#6366f1"/>
  <text x="100" y="36" font-size="8" fill="white" text-anchor="middle" font-weight="700">Function</text>
  <text x="220" y="36" font-size="8" fill="white" text-anchor="middle" font-weight="700">Domain</text>
  <text x="340" y="36" font-size="8" fill="white" text-anchor="middle" font-weight="700">Range</text>
  <text x="440" y="36" font-size="8" fill="white" text-anchor="middle" font-weight="700">d/dx</text>
  <!-- Row 1 arcsin -->
  <rect x="8" y="40" width="464" height="22" rx="0" fill="#eef2ff"/>
  <text x="100" y="55" font-size="8.5" fill="#4338ca" text-anchor="middle">arcsin(x)</text>
  <text x="220" y="55" font-size="8.5" fill="#374151" text-anchor="middle">[−1, 1]</text>
  <text x="340" y="55" font-size="8.5" fill="#374151" text-anchor="middle">[−π/2, π/2]</text>
  <text x="440" y="55" font-size="8.5" fill="#166534" text-anchor="middle">1/√(1−x²)</text>
  <!-- Row 2 arccos -->
  <rect x="8" y="62" width="464" height="22" rx="0" fill="#f8fafc"/>
  <text x="100" y="77" font-size="8.5" fill="#4338ca" text-anchor="middle">arccos(x)</text>
  <text x="220" y="77" font-size="8.5" fill="#374151" text-anchor="middle">[−1, 1]</text>
  <text x="340" y="77" font-size="8.5" fill="#374151" text-anchor="middle">[0, π]</text>
  <text x="440" y="77" font-size="8.5" fill="#dc2626" text-anchor="middle">−1/√(1−x²)</text>
  <!-- Row 3 arctan -->
  <rect x="8" y="84" width="464" height="22" rx="0" fill="#eef2ff"/>
  <text x="100" y="99" font-size="8.5" fill="#4338ca" text-anchor="middle">arctan(x)</text>
  <text x="220" y="99" font-size="8.5" fill="#374151" text-anchor="middle">(−∞, ∞)</text>
  <text x="340" y="99" font-size="8.5" fill="#374151" text-anchor="middle">(−π/2, π/2)</text>
  <text x="440" y="99" font-size="8.5" fill="#166534" text-anchor="middle">1/(1+x²)</text>
  <!-- Row 4 arccsc -->
  <rect x="8" y="106" width="464" height="22" rx="0" fill="#f8fafc"/>
  <text x="100" y="121" font-size="8.5" fill="#4338ca" text-anchor="middle">arccsc(x)</text>
  <text x="220" y="121" font-size="8.5" fill="#374151" text-anchor="middle">|x| ≥ 1</text>
  <text x="340" y="121" font-size="8.5" fill="#374151" text-anchor="middle">[−π/2,π/2]\{0}</text>
  <text x="440" y="121" font-size="8.5" fill="#dc2626" text-anchor="middle">−1/(|x|√(x²−1))</text>
  <!-- Row 5 arcsec -->
  <rect x="8" y="128" width="464" height="22" rx="0" fill="#eef2ff"/>
  <text x="100" y="143" font-size="8.5" fill="#4338ca" text-anchor="middle">arcsec(x)</text>
  <text x="220" y="143" font-size="8.5" fill="#374151" text-anchor="middle">|x| ≥ 1</text>
  <text x="340" y="143" font-size="8.5" fill="#374151" text-anchor="middle">[0,π]\{π/2}</text>
  <text x="440" y="143" font-size="8.5" fill="#166534" text-anchor="middle">1/(|x|√(x²−1))</text>
  <!-- Row 6 arccot -->
  <rect x="8" y="150" width="464" height="22" rx="0" fill="#f8fafc"/>
  <text x="100" y="165" font-size="8.5" fill="#4338ca" text-anchor="middle">arccot(x)</text>
  <text x="220" y="165" font-size="8.5" fill="#374151" text-anchor="middle">(−∞, ∞)</text>
  <text x="340" y="165" font-size="8.5" fill="#374151" text-anchor="middle">(0, π)</text>
  <text x="440" y="165" font-size="8.5" fill="#dc2626" text-anchor="middle">−1/(1+x²)</text>
  <!-- Footer -->
  <rect x="8" y="176" width="464" height="20" rx="0" fill="#fef3c7"/>
  <text x="240" y="190" font-size="7.5" fill="#92400e" text-anchor="middle">Key pattern: d/dx[arcsin] = −d/dx[arccos] and d/dx[arctan] = −d/dx[arccot] (complementary pairs)</text>
</svg>
