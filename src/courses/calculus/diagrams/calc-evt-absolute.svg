<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" style="font-family: ui-monospace, monospace; border-radius: 12px;">
  <style>.bg{fill:rgb(var(--tw-custom-slate-50))}.dark .bg{fill:rgb(var(--tw-custom-slate-900))}</style>
  <rect width="480" height="200" rx="12" class="bg"/>
  <text x="240" y="16" font-size="11" fill="#4338ca" text-anchor="middle" font-weight="700">Extreme Value Theorem — Absolute vs Local Extrema</text>
  <rect x="8" y="22" width="464" height="172" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <!-- Axes -->
  <line x1="30" y1="170" x2="462" y2="170" stroke="#64748b" stroke-width="1"/>
  <line x1="30" y1="30" x2="30" y2="174" stroke="#64748b" stroke-width="1"/>
  <!-- Closed interval markers -->
  <line x1="60" y1="165" x2="60" y2="175" stroke="#4338ca" stroke-width="2"/>
  <line x1="440" y1="165" x2="440" y2="175" stroke="#4338ca" stroke-width="2"/>
  <text x="60" y="186" font-size="8.5" fill="#4338ca" text-anchor="middle">[a</text>
  <text x="440" y="186" font-size="8.5" fill="#4338ca" text-anchor="middle">b]</text>
  <text x="250" y="186" font-size="8" fill="#94a3b8" text-anchor="middle">closed interval [a, b]</text>
  <!-- Curve with bumps -->
  <path d="M 60,140 Q 90,120 120,90 Q 140,68 160,80 Q 180,92 200,120 Q 220,148 250,110 Q 270,80 300,60 Q 330,40 360,55 Q 390,70 420,110 Q 432,128 440,145" fill="none" stroke="#6366f1" stroke-width="2.5"/>
  <!-- Absolute max at x≈300, y≈60 -->
  <circle cx="300" cy="60" r="6" fill="#ef4444"/>
  <text x="306" y="50" font-size="8" fill="#ef4444" font-weight="700">ABS MAX</text>
  <!-- Absolute min at endpoint a: x=60, y=140 -->
  <circle cx="60" cy="140" r="6" fill="#059669"/>
  <text x="14" y="138" font-size="8" fill="#059669" font-weight="700">ABS MIN</text>
  <!-- Local max at x≈120, y≈90 -->
  <circle cx="120" cy="90" r="5" fill="#f59e0b"/>
  <text x="126" y="84" font-size="7.5" fill="#b45309">local max</text>
  <!-- Local min at x≈200, y≈120 -->
  <circle cx="200" cy="120" r="5" fill="#8b5cf6"/>
  <text x="204" y="130" font-size="7.5" fill="#7c3aed">local min</text>
  <!-- EVT box -->
  <rect x="340" y="110" width="116" height="54" rx="5" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="398" y="126" font-size="8" fill="#4338ca" text-anchor="middle" font-weight="700">EVT Guarantees:</text>
  <text x="398" y="140" font-size="7.5" fill="#4338ca" text-anchor="middle">f continuous on [a,b]</text>
  <text x="398" y="152" font-size="7.5" fill="#4338ca" text-anchor="middle">→ abs max AND abs min</text>
  <text x="398" y="162" font-size="7.5" fill="#4338ca" text-anchor="middle">both exist on [a,b]</text>
</svg>
