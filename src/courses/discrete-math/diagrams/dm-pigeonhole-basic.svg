<svg viewBox="0 0 520 280" xmlns="http://www.w3.org/2000/svg" style="font-family: ui-sans-serif, system-ui, sans-serif; border-radius: 10px;">
  <rect width="520" height="280" rx="10" fill="#f8fafc"/>

  <!-- Title -->
  <text x="260" y="30" font-size="13" font-weight="700" fill="#1e293b" text-anchor="middle">5 Pigeons, 4 Holes</text>
  <text x="260" y="48" font-size="11" fill="#64748b" text-anchor="middle">n + 1 items into n containers &#8594; some container must hold 2 or more</text>

  <!-- Four holes -->
  <g>
    <!-- Hole 1 -->
    <rect x="30" y="80" width="100" height="130" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="80" y="98" font-size="10" font-weight="700" fill="#1d4ed8" text-anchor="middle">Hole 1</text>
    <circle cx="80" cy="140" r="16" fill="#3b82f6"/>
    <text x="80" y="145" font-size="14" fill="#ffffff" text-anchor="middle">&#128330;</text>

    <!-- Hole 2 -->
    <rect x="145" y="80" width="100" height="130" rx="10" fill="#f0fdf4" stroke="#10b981" stroke-width="2"/>
    <text x="195" y="98" font-size="10" font-weight="700" fill="#065f46" text-anchor="middle">Hole 2</text>
    <circle cx="195" cy="140" r="16" fill="#10b981"/>
    <text x="195" y="145" font-size="14" fill="#ffffff" text-anchor="middle">&#128330;</text>

    <!-- Hole 3 -->
    <rect x="260" y="80" width="100" height="130" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="310" y="98" font-size="10" font-weight="700" fill="#92400e" text-anchor="middle">Hole 3</text>
    <circle cx="310" cy="140" r="16" fill="#f59e0b"/>
    <text x="310" y="145" font-size="14" fill="#ffffff" text-anchor="middle">&#128330;</text>

    <!-- Hole 4 - the pigeonhole with 2 -->
    <rect x="375" y="80" width="115" height="130" rx="10" fill="#fee2e2" stroke="#ef4444" stroke-width="3"/>
    <text x="432" y="98" font-size="10" font-weight="700" fill="#991b1b" text-anchor="middle">Hole 4</text>
    <circle cx="415" cy="140" r="16" fill="#ef4444"/>
    <text x="415" y="145" font-size="14" fill="#ffffff" text-anchor="middle">&#128330;</text>
    <circle cx="450" cy="140" r="16" fill="#ef4444"/>
    <text x="450" y="145" font-size="14" fill="#ffffff" text-anchor="middle">&#128330;</text>
    <text x="432" y="185" font-size="10" font-weight="700" fill="#991b1b" text-anchor="middle">2 pigeons!</text>
  </g>

  <!-- Callout arrow -->
  <path d="M432 235 L432 222" stroke="#991b1b" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="260" y="256" font-size="11" fill="#334155" text-anchor="middle">No matter how you distribute 5 pigeons among 4 holes, at least one hole gets &#8805; 2.</text>

  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#991b1b"/>
    </marker>
  </defs>
</svg>
