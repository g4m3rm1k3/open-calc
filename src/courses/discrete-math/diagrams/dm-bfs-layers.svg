<svg viewBox="0 0 420 220" xmlns="http://www.w3.org/2000/svg" style="font-family: ui-sans-serif, system-ui, sans-serif; border-radius: 10px;">
  <rect width="420" height="220" rx="10" fill="#f8fafc"/>
  <text x="210" y="20" font-size="12" font-weight="700" fill="#1e293b" text-anchor="middle">BFS Explores by Distance Layers from Source S</text>

  <!-- layer bands -->
  <rect x="20" y="40" width="70" height="150" fill="#eff6ff"/>
  <rect x="90" y="40" width="140" height="150" fill="#f0fdf4"/>
  <rect x="230" y="40" width="170" height="150" fill="#fef3c7"/>
  <text x="55" y="35" font-size="9" fill="#1d4ed8" text-anchor="middle">distance 0</text>
  <text x="160" y="35" font-size="9" fill="#065f46" text-anchor="middle">distance 1</text>
  <text x="315" y="35" font-size="9" fill="#92400e" text-anchor="middle">distance 2</text>

  <!-- edges -->
  <g stroke="#94a3b8" stroke-width="1.5">
    <line x1="55" y1="115" x2="140" y2="70"/>
    <line x1="55" y1="115" x2="140" y2="115"/>
    <line x1="55" y1="115" x2="140" y2="160"/>
    <line x1="140" y1="70" x2="290" y2="60"/>
    <line x1="140" y1="115" x2="290" y2="110"/>
    <line x1="140" y1="160" x2="290" y2="160"/>
    <line x1="140" y1="160" x2="290" y2="190"/>
  </g>

  <!-- vertices -->
  <circle cx="55" cy="115" r="14" fill="#3b82f6"/><text x="55" y="120" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">S</text>

  <circle cx="140" cy="70" r="12" fill="#10b981"/><text x="140" y="75" font-size="9" font-weight="700" fill="#fff" text-anchor="middle">A</text>
  <circle cx="140" cy="115" r="12" fill="#10b981"/><text x="140" y="120" font-size="9" font-weight="700" fill="#fff" text-anchor="middle">B</text>
  <circle cx="140" cy="160" r="12" fill="#10b981"/><text x="140" y="165" font-size="9" font-weight="700" fill="#fff" text-anchor="middle">C</text>

  <circle cx="290" cy="60" r="11" fill="#f59e0b"/><text x="290" y="65" font-size="8.5" font-weight="700" fill="#fff" text-anchor="middle">D</text>
  <circle cx="290" cy="110" r="11" fill="#f59e0b"/><text x="290" y="115" font-size="8.5" font-weight="700" fill="#fff" text-anchor="middle">E</text>
  <circle cx="290" cy="160" r="11" fill="#f59e0b"/><text x="290" y="165" font-size="8.5" font-weight="700" fill="#fff" text-anchor="middle">F</text>
  <circle cx="290" cy="190" r="11" fill="#f59e0b"/><text x="290" y="195" font-size="8.5" font-weight="700" fill="#fff" text-anchor="middle">G</text>

  <text x="210" y="207" font-size="9.5" fill="#334155" text-anchor="middle">Queue order: S, then A,B,C (all dist. 1), then D,E,F,G (all dist. 2) — every vertex finalized in non-decreasing distance order.</text>
</svg>
