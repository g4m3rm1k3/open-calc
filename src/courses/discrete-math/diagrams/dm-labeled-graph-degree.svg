<svg viewBox="0 0 380 220" xmlns="http://www.w3.org/2000/svg" style="font-family: ui-sans-serif, system-ui, sans-serif; border-radius: 10px;">
  <rect width="380" height="220" rx="10" fill="#f8fafc"/>
  <text x="190" y="20" font-size="12" font-weight="700" fill="#1e293b" text-anchor="middle">Handshaking Lemma: &#931; deg(v) = 2|E|</text>

  <!-- edges -->
  <g stroke="#94a3b8" stroke-width="1.8">
    <line x1="190" y1="60" x2="100" y2="120"/>
    <line x1="190" y1="60" x2="280" y2="120"/>
    <line x1="100" y1="120" x2="190" y2="170"/>
    <line x1="280" y1="120" x2="190" y2="170"/>
    <line x1="100" y1="120" x2="280" y2="120"/>
  </g>

  <!-- vertices -->
  <circle cx="190" cy="60" r="16" fill="#3b82f6"/><text x="190" y="65" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">A</text>
  <circle cx="100" cy="120" r="16" fill="#10b981"/><text x="100" y="125" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">B</text>
  <circle cx="280" cy="120" r="16" fill="#f59e0b"/><text x="280" y="125" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">C</text>
  <circle cx="190" cy="170" r="16" fill="#a855f7"/><text x="190" y="175" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">D</text>

  <!-- degree labels -->
  <text x="190" y="38" font-size="10" fill="#1e40af" text-anchor="middle">deg(A) = 2</text>
  <text x="65" y="120" font-size="10" fill="#065f46" text-anchor="middle">deg(B) = 3</text>
  <text x="315" y="120" font-size="10" fill="#92400e" text-anchor="middle">deg(C) = 3</text>
  <text x="190" y="200" font-size="10" fill="#6b21a8" text-anchor="middle">deg(D) = 2</text>

  <text x="190" y="215" font-size="10" fill="#334155" text-anchor="middle">Degrees: 2+3+3+2 = 10 = 2 &#215; 5 edges. Every edge contributes exactly 2 to the total.</text>
</svg>
