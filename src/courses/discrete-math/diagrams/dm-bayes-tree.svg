<svg viewBox="0 0 460 240" xmlns="http://www.w3.org/2000/svg" style="font-family: ui-sans-serif, system-ui, sans-serif; border-radius: 10px;">
  <rect width="460" height="240" rx="10" fill="#f8fafc"/>
  <text x="230" y="20" font-size="12" font-weight="700" fill="#1e293b" text-anchor="middle">Probability Tree: Prevalence 1%, Sensitivity 95%, Specificity 90%</text>

  <!-- Root -->
  <circle cx="40" cy="120" r="6" fill="#1e293b"/>

  <!-- Level 1: Disease / No Disease -->
  <line x1="40" y1="120" x2="150" y2="60" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="40" y1="120" x2="150" y2="180" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="90" y="82" font-size="9" fill="#475569">P(D)=0.01</text>
  <text x="90" y="164" font-size="9" fill="#475569">P(&#172;D)=0.99</text>

  <circle cx="150" cy="60" r="5" fill="#ef4444"/>
  <text x="150" y="46" font-size="9.5" font-weight="700" fill="#991b1b" text-anchor="middle">Disease</text>
  <circle cx="150" cy="180" r="5" fill="#3b82f6"/>
  <text x="150" y="200" font-size="9.5" font-weight="700" fill="#1e40af" text-anchor="middle">No Disease</text>

  <!-- Level 2 from Disease -->
  <line x1="150" y1="60" x2="280" y2="35" stroke="#94a3b8" stroke-width="1.3"/>
  <line x1="150" y1="60" x2="280" y2="80" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="205" y="32" font-size="8.5" fill="#475569">0.95</text>
  <text x="205" y="76" font-size="8.5" fill="#475569">0.05</text>
  <text x="290" y="38" font-size="9.5" fill="#065f46" font-weight="700">+ (true pos)</text>
  <text x="290" y="83" font-size="9.5" fill="#7f1d1d">&#8722; (false neg)</text>
  <text x="380" y="38" font-size="8.5" fill="#334155">0.0095</text>
  <text x="380" y="83" font-size="8.5" fill="#334155">0.0005</text>

  <!-- Level 2 from No Disease -->
  <line x1="150" y1="180" x2="280" y2="155" stroke="#94a3b8" stroke-width="1.3"/>
  <line x1="150" y1="180" x2="280" y2="205" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="205" y="152" font-size="8.5" fill="#475569">0.10</text>
  <text x="205" y="202" font-size="8.5" fill="#475569">0.90</text>
  <text x="290" y="158" font-size="9.5" fill="#7f1d1d" font-weight="700">+ (false pos)</text>
  <text x="290" y="208" font-size="9.5" fill="#065f46">&#8722; (true neg)</text>
  <text x="380" y="158" font-size="8.5" fill="#334155">0.0990</text>
  <text x="380" y="208" font-size="8.5" fill="#334155">0.8910</text>

  <text x="230" y="230" font-size="9.5" fill="#334155" text-anchor="middle">P(D | +) = 0.0095 / (0.0095 + 0.0990) &#8776; 0.0876 — under 9%, despite a "95% accurate" test.</text>
</svg>
