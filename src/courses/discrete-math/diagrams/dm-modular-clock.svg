<svg viewBox="0 0 260 260" xmlns="http://www.w3.org/2000/svg" style="font-family: ui-sans-serif, system-ui, sans-serif; border-radius: 10px;">
  <rect width="260" height="260" rx="10" fill="#f8fafc"/>
  <text x="130" y="22" font-size="12" font-weight="700" fill="#1e293b" text-anchor="middle">Mod 12: 10:00 + 15 Hours = 1:00</text>

  <circle cx="130" cy="140" r="95" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <!-- hour ticks/numbers 0..11 (using 12 at top) -->
  <g font-size="12" font-weight="700" fill="#475569" text-anchor="middle">
    <text x="130" y="55">12</text>
    <text x="177" y="66">1</text>
    <text x="210" y="99">2</text>
    <text x="222" y="145">3</text>
    <text x="210" y="191">4</text>
    <text x="177" y="224">5</text>
    <text x="130" y="235">6</text>
    <text x="83" y="224">7</text>
    <text x="50" y="191">8</text>
    <text x="38" y="145">9</text>
    <text x="50" y="99">10</text>
    <text x="83" y="66">11</text>
  </g>

  <!-- Arrow from 10 to 1, wrapping around (25 mod 12 = 1) -->
  <path d="M 63 91 A 95 95 0 1 1 177 66" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#clockArrow)"/>

  <circle cx="63" cy="91" r="5" fill="#3b82f6"/>
  <circle cx="177" cy="66" r="5" fill="#10b981"/>

  <text x="130" y="255" font-size="9.5" fill="#334155" text-anchor="middle">10 + 15 = 25, and 25 mod 12 = 1 — the clock wraps around exactly at 12.</text>

  <defs>
    <marker id="clockArrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#ef4444"/>
    </marker>
  </defs>
</svg>
