<svg viewBox="0 0 480 220" xmlns="http://www.w3.org/2000/svg" style="font-family: ui-sans-serif, system-ui, sans-serif; border-radius: 10px;">
  <rect width="480" height="220" rx="10" fill="#f8fafc"/>
  <text x="240" y="24" font-size="12" font-weight="700" fill="#1e293b" text-anchor="middle">The Induction Ladder: Two Facts, Infinitely Many Rungs</text>

  <!-- Base rung -->
  <rect x="30" y="160" width="90" height="40" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="75" y="184" font-size="11" font-weight="700" fill="#065f46" text-anchor="middle">P(1)</text>
  <text x="75" y="210" font-size="8.5" fill="#059669" text-anchor="middle">Base Case</text>

  <!-- Arrow up -->
  <path d="M120 175 L165 145" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow1)"/>

  <rect x="170" y="120" width="90" height="40" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="215" y="144" font-size="11" font-weight="700" fill="#1e3a8a" text-anchor="middle">P(2)</text>

  <path d="M260 135 L305 105" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow1)"/>

  <rect x="310" y="80" width="90" height="40" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="355" y="104" font-size="11" font-weight="700" fill="#1e3a8a" text-anchor="middle">P(3)</text>

  <path d="M400 95 L440 65" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow1)"/>
  <text x="450" y="55" font-size="18" fill="#64748b" text-anchor="middle">&#8734;</text>

  <!-- Step labels -->
  <text x="142" y="153" font-size="8" fill="#475569" text-anchor="middle" transform="rotate(-32 142 153)">P(k) &#8658; P(k+1)</text>
  <text x="282" y="113" font-size="8" fill="#475569" text-anchor="middle" transform="rotate(-32 282 113)">P(k) &#8658; P(k+1)</text>

  <text x="240" y="35" font-size="9" fill="#64748b" text-anchor="middle"></text>
  <rect x="240" y="30" width="0" height="0"/>

  <text x="80" y="60" font-size="9.5" fill="#334155" text-anchor="middle" width="140">Prove P(1) once, directly.</text>
  <text x="350" y="35" font-size="9.5" fill="#334155" text-anchor="middle">Prove "P(k) &#8658; P(k+1)" once, for an arbitrary k — then it applies at every rung, forever.</text>

  <defs>
    <marker id="arrow1" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
