<svg viewBox="0 0 380 260" xmlns="http://www.w3.org/2000/svg" style="font-family: ui-sans-serif, system-ui, sans-serif; border-radius: 10px;">
  <rect width="380" height="260" rx="10" fill="#f8fafc"/>
  <text x="190" y="20" font-size="12" font-weight="700" fill="#1e293b" text-anchor="middle">Growth Rates as Input Size n Increases</text>

  <!-- axes -->
  <line x1="45" y1="30" x2="45" y2="215" stroke="#334155" stroke-width="1.3"/>
  <line x1="45" y1="215" x2="355" y2="215" stroke="#334155" stroke-width="1.3"/>
  <text x="200" y="235" font-size="9.5" fill="#334155" text-anchor="middle">input size n &#8594;</text>
  <text x="20" y="120" font-size="9.5" fill="#334155" text-anchor="middle" transform="rotate(-90 20 120)">work done &#8594;</text>

  <!-- O(1): flat -->
  <path d="M45,205 L355,205" fill="none" stroke="#059669" stroke-width="2"/>
  <text x="358" y="208" font-size="9" font-weight="700" fill="#059669">O(1)</text>

  <!-- O(log n) -->
  <path d="M45,205 C 90,190 160,170 355,150" fill="none" stroke="#2563eb" stroke-width="2"/>
  <text x="358" y="152" font-size="9" font-weight="700" fill="#2563eb">O(log n)</text>

  <!-- O(n): straight diagonal -->
  <line x1="45" y1="205" x2="300" y2="35" stroke="#7c3aed" stroke-width="2"/>
  <text x="303" y="35" font-size="9" font-weight="700" fill="#7c3aed">O(n)</text>

  <!-- O(n log n) -->
  <path d="M45,205 C 120,190 200,110 260,32" fill="none" stroke="#d97706" stroke-width="2"/>
  <text x="240" y="26" font-size="9" font-weight="700" fill="#d97706">O(n log n)</text>

  <!-- O(n^2): parabola, exits early -->
  <path d="M45,205 C 100,200 150,140 190,32" fill="none" stroke="#db2777" stroke-width="2"/>
  <text x="170" y="26" font-size="9" font-weight="700" fill="#db2777">O(n&#178;)</text>

  <!-- O(2^n): explodes almost immediately -->
  <path d="M45,205 C 70,203 100,150 120,32" fill="none" stroke="#dc2626" stroke-width="2"/>
  <text x="97" y="26" font-size="9" font-weight="700" fill="#dc2626">O(2&#8319;)</text>

  <text x="190" y="252" font-size="9" fill="#334155" text-anchor="middle">Same n-axis, same origin — notice how quickly the exponential and quadratic curves leave the chart.</text>
</svg>
