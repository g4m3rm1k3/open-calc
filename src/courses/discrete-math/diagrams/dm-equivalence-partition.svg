<svg viewBox="0 0 480 220" xmlns="http://www.w3.org/2000/svg" style="font-family: ui-sans-serif, system-ui, sans-serif; border-radius: 10px;">
  <rect width="480" height="220" rx="10" fill="#f8fafc"/>
  <text x="240" y="24" font-size="12" font-weight="700" fill="#1e293b" text-anchor="middle">Congruence mod 3 Partitions &#8484; into 3 Classes</text>

  <!-- Outer universe box -->
  <rect x="20" y="40" width="440" height="150" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="30" y="56" font-size="9" fill="#94a3b8">&#8484; (all integers)</text>

  <!-- Class [0] -->
  <rect x="35" y="65" width="130" height="110" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="100" y="82" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">[0]</text>
  <text x="100" y="100" font-size="10" fill="#1e40af" text-anchor="middle">..., -3, 0,</text>
  <text x="100" y="115" font-size="10" fill="#1e40af" text-anchor="middle">3, 6, 9, ...</text>
  <text x="100" y="135" font-size="8.5" fill="#3b82f6" text-anchor="middle">remainder 0</text>

  <!-- Class [1] -->
  <rect x="175" y="65" width="130" height="110" rx="8" fill="#f0fdf4" stroke="#10b981" stroke-width="2"/>
  <text x="240" y="82" font-size="11" font-weight="700" fill="#065f46" text-anchor="middle">[1]</text>
  <text x="240" y="100" font-size="10" fill="#065f46" text-anchor="middle">..., -2, 1,</text>
  <text x="240" y="115" font-size="10" fill="#065f46" text-anchor="middle">4, 7, 10, ...</text>
  <text x="240" y="135" font-size="8.5" fill="#10b981" text-anchor="middle">remainder 1</text>

  <!-- Class [2] -->
  <rect x="315" y="65" width="130" height="110" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="380" y="82" font-size="11" font-weight="700" fill="#92400e" text-anchor="middle">[2]</text>
  <text x="380" y="100" font-size="10" fill="#92400e" text-anchor="middle">..., -1, 2,</text>
  <text x="380" y="115" font-size="10" fill="#92400e" text-anchor="middle">5, 8, 11, ...</text>
  <text x="380" y="135" font-size="8.5" fill="#f59e0b" text-anchor="middle">remainder 2</text>

  <text x="240" y="205" font-size="9" fill="#64748b" text-anchor="middle">Every integer falls into exactly one class — the classes are disjoint and their union is all of &#8484;.</text>
</svg>
