<svg viewBox="0 0 460 200" xmlns="http://www.w3.org/2000/svg" style="font-family: ui-sans-serif, system-ui, sans-serif; border-radius: 10px;">
  <rect width="460" height="200" rx="10" fill="#f8fafc"/>
  <text x="230" y="24" font-size="12" font-weight="700" fill="#1e293b" text-anchor="middle">Stars and Bars: 10 Sodas, 3 Flavors</text>

  <!-- symbol row -->
  <g font-size="20" font-family="monospace" text-anchor="middle">
    <text x="60" y="90" fill="#3b82f6">&#9733;</text>
    <text x="90" y="90" fill="#3b82f6">&#9733;</text>
    <text x="120" y="90" fill="#3b82f6">&#9733;</text>
    <text x="150" y="90" fill="#1e293b">|</text>
    <text x="180" y="90" fill="#10b981">&#9733;</text>
    <text x="210" y="90" fill="#10b981">&#9733;</text>
    <text x="240" y="90" fill="#10b981">&#9733;</text>
    <text x="270" y="90" fill="#10b981">&#9733;</text>
    <text x="300" y="90" fill="#10b981">&#9733;</text>
    <text x="330" y="90" fill="#1e293b">|</text>
    <text x="360" y="90" fill="#f59e0b">&#9733;</text>
    <text x="390" y="90" fill="#f59e0b">&#9733;</text>
  </g>

  <!-- Labels under each group -->
  <text x="90" y="115" font-size="9" fill="#1d4ed8" text-anchor="middle">3 Cokes</text>
  <text x="240" y="115" font-size="9" fill="#065f46" text-anchor="middle">5 Sprites</text>
  <text x="375" y="115" font-size="9" fill="#92400e" text-anchor="middle">2 Fantas</text>

  <text x="230" y="145" font-size="10" fill="#334155" text-anchor="middle">10 stars + 2 bars = 12 symbols. Choosing which 2 of the 12 positions hold bars</text>
  <text x="230" y="160" font-size="10" fill="#334155" text-anchor="middle">determines the whole distribution &#8594; C(12, 2) = 66 ways.</text>
</svg>
