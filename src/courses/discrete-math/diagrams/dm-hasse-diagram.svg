<svg viewBox="0 0 420 300" xmlns="http://www.w3.org/2000/svg" style="font-family: ui-sans-serif, system-ui, sans-serif; border-radius: 10px;">
  <rect width="420" height="300" rx="10" fill="#f8fafc"/>
  <text x="210" y="26" font-size="12" font-weight="700" fill="#1e293b" text-anchor="middle">Hasse Diagram: Divisibility on {1, 2, 3, 4, 6, 12}</text>

  <!-- Edges (only covering relations — no reflexive loops, no transitive shortcuts) -->
  <g stroke="#94a3b8" stroke-width="1.5">
    <line x1="210" y1="255" x2="130" y2="195"/> <!-- 1-2 -->
    <line x1="210" y1="255" x2="290" y2="195"/> <!-- 1-3 -->
    <line x1="130" y1="195" x2="130" y2="130"/> <!-- 2-4 -->
    <line x1="130" y1="195" x2="230" y2="130"/> <!-- 2-6 -->
    <line x1="290" y1="195" x2="230" y2="130"/> <!-- 3-6 -->
    <line x1="130" y1="130" x2="230" y2="65"/>  <!-- 4-12 -->
    <line x1="230" y1="130" x2="230" y2="65"/>  <!-- 6-12 -->
  </g>

  <!-- Nodes -->
  <g>
    <circle cx="210" cy="255" r="18" fill="#3b82f6"/><text x="210" y="260" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">1</text>
    <circle cx="130" cy="195" r="18" fill="#3b82f6"/><text x="130" y="200" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">2</text>
    <circle cx="290" cy="195" r="18" fill="#3b82f6"/><text x="290" y="200" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">3</text>
    <circle cx="130" cy="130" r="18" fill="#10b981"/><text x="130" y="135" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">4</text>
    <circle cx="230" cy="130" r="18" fill="#10b981"/><text x="230" y="135" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">6</text>
    <circle cx="230" cy="65" r="18" fill="#a855f7"/><text x="230" y="70" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">12</text>
  </g>

  <text x="210" y="285" font-size="9" fill="#64748b" text-anchor="middle">Higher = larger. An edge means "divides," with all reflexive loops and transitive shortcuts (e.g. 1&#8594;12, 2&#8594;12) removed.</text>
</svg>
