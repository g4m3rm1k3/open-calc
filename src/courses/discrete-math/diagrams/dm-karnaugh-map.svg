<svg viewBox="0 0 340 220" xmlns="http://www.w3.org/2000/svg" style="font-family: ui-sans-serif, system-ui, sans-serif; border-radius: 10px;">
  <rect width="340" height="220" rx="10" fill="#f8fafc"/>
  <text x="170" y="20" font-size="12" font-weight="700" fill="#1e293b" text-anchor="middle">Karnaugh Map: Simplifying P&#183;Q + P&#183;&#172;Q to Just P</text>

  <!-- grid: rows = P (0,1), cols = Q (0,1) -->
  <g font-size="10" fill="#475569">
    <text x="90" y="45" text-anchor="middle">Q=0</text>
    <text x="150" y="45" text-anchor="middle">Q=1</text>
    <text x="55" y="80" text-anchor="middle">P=0</text>
    <text x="55" y="130" text-anchor="middle">P=1</text>
  </g>

  <rect x="70" y="60" width="60" height="50" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
  <rect x="130" y="60" width="60" height="50" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
  <rect x="70" y="110" width="60" height="50" fill="#dbeafe" stroke="#334155" stroke-width="1.5"/>
  <rect x="130" y="110" width="60" height="50" fill="#dbeafe" stroke="#334155" stroke-width="1.5"/>

  <text x="100" y="90" font-size="13" text-anchor="middle" fill="#64748b">0</text>
  <text x="160" y="90" font-size="13" text-anchor="middle" fill="#64748b">0</text>
  <text x="100" y="140" font-size="13" font-weight="700" text-anchor="middle" fill="#1e40af">1</text>
  <text x="160" y="140" font-size="13" font-weight="700" text-anchor="middle" fill="#1e40af">1</text>

  <!-- highlight the P=1 row grouping -->
  <rect x="70" y="110" width="120" height="50" fill="none" stroke="#ef4444" stroke-width="2.5" rx="4"/>
  <text x="230" y="140" font-size="10" fill="#991b1b">grouped pair</text>

  <text x="170" y="195" font-size="10" fill="#334155" text-anchor="middle">Both cells in the P=1 row are 1, regardless of Q — Q doesn't matter there,</text>
  <text x="170" y="210" font-size="10" fill="#334155" text-anchor="middle">so the whole row collapses to the single term P.</text>
</svg>
