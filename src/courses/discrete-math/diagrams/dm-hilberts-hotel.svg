<svg viewBox="0 0 460 200" xmlns="http://www.w3.org/2000/svg" style="font-family: ui-sans-serif, system-ui, sans-serif; border-radius: 10px;">
  <rect width="460" height="200" rx="10" fill="#f8fafc"/>
  <text x="230" y="20" font-size="12" font-weight="700" fill="#1e293b" text-anchor="middle">Hilbert's Hotel: Every Room Full, Yet Room for One More</text>

  <!-- Before -->
  <text x="115" y="42" font-size="10" font-weight="700" fill="#475569" text-anchor="middle">Before: every room occupied</text>
  <g font-size="10" text-anchor="middle">
    <rect x="20" y="50" width="50" height="34" fill="#dbeafe" stroke="#3b82f6"/><text x="45" y="71" fill="#1e3a8a">Room 1</text>
    <rect x="75" y="50" width="50" height="34" fill="#dbeafe" stroke="#3b82f6"/><text x="100" y="71" fill="#1e3a8a">Room 2</text>
    <rect x="130" y="50" width="50" height="34" fill="#dbeafe" stroke="#3b82f6"/><text x="155" y="71" fill="#1e3a8a">Room 3</text>
    <rect x="185" y="50" width="45" height="34" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="2 2"/><text x="207" y="71" fill="#64748b">...</text>
  </g>

  <!-- Arrow -->
  <path d="M60 100 L60 118" stroke="#94a3b8" stroke-width="2" marker-end="url(#hArrow)"/>
  <text x="115" y="112" font-size="9.5" fill="#7f1d1d" text-anchor="middle">A new guest arrives. Every room shifts up by one: guest in Room n moves to Room n+1.</text>

  <!-- After -->
  <text x="115" y="140" font-size="10" font-weight="700" fill="#475569" text-anchor="middle">After: Room 1 is free, everyone still has a room</text>
  <g font-size="10" text-anchor="middle">
    <rect x="20" y="148" width="50" height="34" fill="#fef3c7" stroke="#f59e0b"/><text x="45" y="169" fill="#92400e">NEW</text>
    <rect x="75" y="148" width="50" height="34" fill="#dbeafe" stroke="#3b82f6"/><text x="100" y="169" fill="#1e3a8a">was 1</text>
    <rect x="130" y="148" width="50" height="34" fill="#dbeafe" stroke="#3b82f6"/><text x="155" y="169" fill="#1e3a8a">was 2</text>
    <rect x="185" y="148" width="45" height="34" fill="#dbeafe" stroke="#3b82f6"/><text x="207" y="169" fill="#1e3a8a">was 3</text>
  </g>

  <text x="345" y="90" font-size="10" fill="#334155" width="120">This works because &#8469; and &#8469; &#8746; {new guest} are the same size — a bijection n &#8594; n+1 proves it, no finite intuition applies.</text>

  <defs>
    <marker id="hArrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
