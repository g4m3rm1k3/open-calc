<svg viewBox="0 0 520 260" xmlns="http://www.w3.org/2000/svg" style="font-family: ui-sans-serif, system-ui, sans-serif; border-radius: 10px;">
  <rect width="520" height="260" rx="10" fill="#f8fafc"/>

  <!-- Universal: all must satisfy -->
  <rect x="20" y="20" width="230" height="220" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="135" y="44" font-size="14" font-weight="700" fill="#1d4ed8" text-anchor="middle">&#8704;x P(x) — For All</text>
  <text x="135" y="60" font-size="9" fill="#1e40af" text-anchor="middle">every single one must satisfy P</text>
  <g>
    <circle cx="60" cy="90" r="14" fill="#3b82f6"/><text x="60" y="95" font-size="12" fill="#fff" text-anchor="middle">&#10003;</text>
    <circle cx="105" cy="90" r="14" fill="#3b82f6"/><text x="105" y="95" font-size="12" fill="#fff" text-anchor="middle">&#10003;</text>
    <circle cx="150" cy="90" r="14" fill="#3b82f6"/><text x="150" y="95" font-size="12" fill="#fff" text-anchor="middle">&#10003;</text>
    <circle cx="195" cy="90" r="14" fill="#3b82f6"/><text x="195" y="95" font-size="12" fill="#fff" text-anchor="middle">&#10003;</text>
    <circle cx="60" cy="130" r="14" fill="#3b82f6"/><text x="60" y="135" font-size="12" fill="#fff" text-anchor="middle">&#10003;</text>
    <circle cx="105" cy="130" r="14" fill="#3b82f6"/><text x="105" y="135" font-size="12" fill="#fff" text-anchor="middle">&#10003;</text>
    <circle cx="150" cy="130" r="14" fill="#ef4444"/><text x="150" y="135" font-size="12" fill="#fff" text-anchor="middle">&#10007;</text>
    <circle cx="195" cy="130" r="14" fill="#3b82f6"/><text x="195" y="135" font-size="12" fill="#fff" text-anchor="middle">&#10003;</text>
  </g>
  <text x="135" y="165" font-size="10" font-weight="700" fill="#991b1b" text-anchor="middle">One &#10007; is enough to make</text>
  <text x="135" y="180" font-size="10" font-weight="700" fill="#991b1b" text-anchor="middle">&#8704;x P(x) FALSE.</text>
  <text x="135" y="205" font-size="9" fill="#1e40af" text-anchor="middle">To PROVE: argue for an</text>
  <text x="135" y="218" font-size="9" fill="#1e40af" text-anchor="middle">arbitrary, generic element.</text>
  <text x="135" y="231" font-size="9" fill="#1e40af" text-anchor="middle">To DISPROVE: find one counterexample.</text>

  <!-- Existential: one suffices -->
  <rect x="270" y="20" width="230" height="220" rx="10" fill="#f0fdf4" stroke="#10b981" stroke-width="2"/>
  <text x="385" y="44" font-size="14" font-weight="700" fill="#065f46" text-anchor="middle">&#8707;x P(x) — There Exists</text>
  <text x="385" y="60" font-size="9" fill="#065f46" text-anchor="middle">at least one must satisfy P</text>
  <g>
    <circle cx="310" cy="90" r="14" fill="#94a3b8"/><text x="310" y="95" font-size="12" fill="#fff" text-anchor="middle">&#10007;</text>
    <circle cx="355" cy="90" r="14" fill="#94a3b8"/><text x="355" y="95" font-size="12" fill="#fff" text-anchor="middle">&#10007;</text>
    <circle cx="400" cy="90" r="14" fill="#94a3b8"/><text x="400" y="95" font-size="12" fill="#fff" text-anchor="middle">&#10007;</text>
    <circle cx="445" cy="90" r="14" fill="#94a3b8"/><text x="445" y="95" font-size="12" fill="#fff" text-anchor="middle">&#10007;</text>
    <circle cx="310" cy="130" r="14" fill="#94a3b8"/><text x="310" y="135" font-size="12" fill="#fff" text-anchor="middle">&#10007;</text>
    <circle cx="355" cy="130" r="14" fill="#10b981"/><text x="355" y="135" font-size="12" fill="#fff" text-anchor="middle">&#10003;</text>
    <circle cx="400" cy="130" r="14" fill="#94a3b8"/><text x="400" y="135" font-size="12" fill="#fff" text-anchor="middle">&#10007;</text>
    <circle cx="445" cy="130" r="14" fill="#94a3b8"/><text x="445" y="135" font-size="12" fill="#fff" text-anchor="middle">&#10007;</text>
  </g>
  <text x="385" y="165" font-size="10" font-weight="700" fill="#065f46" text-anchor="middle">One &#10003; is enough to make</text>
  <text x="385" y="180" font-size="10" font-weight="700" fill="#065f46" text-anchor="middle">&#8707;x P(x) TRUE.</text>
  <text x="385" y="205" font-size="9" fill="#065f46" text-anchor="middle">To PROVE: produce one witness.</text>
  <text x="385" y="218" font-size="9" fill="#065f46" text-anchor="middle">To DISPROVE: show every single</text>
  <text x="385" y="231" font-size="9" fill="#065f46" text-anchor="middle">element fails — a universal proof.</text>
</svg>
