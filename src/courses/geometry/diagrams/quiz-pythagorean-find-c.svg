<svg viewBox="0 0 300 180" xmlns="http://www.w3.org/2000/svg" style="font-family: ui-sans-serif, system-ui, sans-serif; border-radius: 8px;">
  <style>
    .svg-bg    { fill: #f8fafc; }
    .svg-panel { fill: #ffffff; }
    .svg-text  { fill: #1e293b; }
    .svg-muted { fill: #64748b; }
    .svg-div   { stroke: #e2e8f0; fill: none; }
    .dark .svg-bg    { fill: #0f172a; }
    .dark .svg-panel { fill: #1e293b; }
    .dark .svg-text  { fill: #e2e8f0; }
    .dark .svg-muted { fill: #94a3b8; }
    .dark .svg-div   { stroke: #334155; }
  </style>
  <rect width="300" height="180" rx="8" class="svg-bg"/>

  <!-- Right triangle: A(60,140), B(220,140), C(60,40) -->
  <polygon points="60,140 220,140 60,40" fill="rgba(59,130,246,0.07)" stroke="#1e3a5f" stroke-width="2"/>

  <!-- Right angle marker at A -->
  <rect x="60" y="124" width="16" height="16" fill="none" stroke="#1e3a5f" stroke-width="1.5"/>

  <!-- Vertex labels -->
  <text x="40" y="154" font-size="11" class="svg-text" font-weight="700">A</text>
  <text x="226" y="154" font-size="11" class="svg-text" font-weight="700">B</text>
  <text x="40" y="38" font-size="11" class="svg-text" font-weight="700">C</text>

  <!-- Leg labels -->
  <!-- AC (vertical leg): 8 -->
  <text x="34" y="96" font-size="14" fill="#1e3a5f" font-weight="700" text-anchor="middle">8</text>
  <!-- AB (horizontal leg): 6 -->
  <text x="140" y="158" font-size="14" fill="#1e3a5f" font-weight="700" text-anchor="middle">6</text>
  <!-- BC (hypotenuse): x -->
  <text x="155" y="82" font-size="17" fill="#ef4444" font-weight="800" text-anchor="middle">x</text>

  <text x="150" y="172" font-size="9" class="svg-muted" text-anchor="middle">Find the hypotenuse x. Right angle at A.</text>
</svg>
