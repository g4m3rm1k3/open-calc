<svg viewBox="0 0 400 160" xmlns="http://www.w3.org/2000/svg" style="font-family: ui-sans-serif, system-ui, sans-serif; border-radius: 10px;">
  <style>
    .svg-bg   { fill: #f8fafc; }
    .svg-muted{ fill: #94a3b8; }
    .dark .svg-bg   { fill: #0f172a; }
    .dark .svg-muted{ fill: #64748b; }
  </style>
  <rect width="400" height="160" rx="10" class="svg-bg"/>
  <defs>
    <marker id="arrowL" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M1,1 L1,7 L7,4 z" fill="#0891b2"/>
    </marker>
    <marker id="arrowR" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M1,1 L1,7 L7,4 z" fill="#0891b2"/>
    </marker>
  </defs>
  <!-- The line -->
  <line x1="30" y1="70" x2="370" y2="70" stroke="#0891b2" stroke-width="2.5"
        marker-start="url(#arrowL)" marker-end="url(#arrowR)"/>
  <!-- Points B and C on the line -->
  <circle cx="120" cy="70" r="5.5" fill="#0891b2" stroke="white" stroke-width="2"/>
  <text x="120" y="56" font-size="15" fill="#0891b2" font-weight="700" font-style="italic" text-anchor="middle">B</text>
  <circle cx="270" cy="70" r="5.5" fill="#0891b2" stroke="white" stroke-width="2"/>
  <text x="270" y="56" font-size="15" fill="#0891b2" font-weight="700" font-style="italic" text-anchor="middle">C</text>
  <!-- Name of line -->
  <text x="390" y="66" font-size="13" fill="#0891b2" font-style="italic" font-weight="600">ℓ</text>
  <!-- Arrows indicate infinite extension -->
  <text x="30" y="100" font-size="11" class="svg-muted">extends forever →</text>
  <text x="280" y="100" font-size="11" class="svg-muted">extends forever →</text>
  <!-- Labels row -->
  <text x="200" y="132" font-size="12" fill="#0284c7" text-anchor="middle" font-weight="600">Named: line BC  (↔BC)  or  ℓ</text>
  <text x="200" y="150" font-size="11" class="svg-muted" text-anchor="middle">1 dimension — infinite length, zero width</text>
</svg>
