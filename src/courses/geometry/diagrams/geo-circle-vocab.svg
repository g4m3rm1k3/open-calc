<svg viewBox="0 0 480 240" xmlns="http://www.w3.org/2000/svg" style="font-family: ui-sans-serif, system-ui, sans-serif; border-radius: 10px;">
  <style>
    .svg-bg    { fill: #f8fafc; }
    .svg-panel { fill: #ffffff; }
    .svg-text  { fill: #1e293b; }
    .svg-muted { fill: #64748b; }
    .svg-div   { stroke: #e2e8f0; fill: none; }
    .dark .svg-bg    { fill: #0f172a; }
    .dark .svg-panel { fill: #1e293b; }
    .dark .svg-text  { fill: #e2e8f0; }
    .dark .svg-muted { fill: #94a3b8; }
    .dark .svg-div   { stroke: #334155; }
  </style>
  <rect width="480" height="240" rx="10" class="svg-bg"/>
  <text x="240" y="18" font-size="11" class="svg-text" text-anchor="middle" font-weight="700">Circle Vocabulary</text>

  <!-- Circle -->
  <circle cx="170" cy="125" r="90" fill="rgba(59,130,246,0.06)" stroke="#93c5fd" stroke-width="1.5"/>

  <!-- Center O -->
  <circle cx="170" cy="125" r="3" fill="#1e3a5f"/>
  <text x="175" y="120" font-size="10" fill="#1e3a5f" font-weight="700">O</text>

  <!-- Radius: O to right point (260,125) -->
  <line x1="170" y1="125" x2="257" y2="125" stroke="#1e3a5f" stroke-width="2"/>
  <text x="210" y="117" font-size="9" fill="#1e3a5f" font-weight="600">radius</text>

  <!-- Diameter: left to right (80,125) to (260,125) -->
  <line x1="80" y1="125" x2="257" y2="125" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="108" y="117" font-size="9" fill="#7c3aed" font-weight="600">diameter</text>

  <!-- Chord (not through center): from ~(110,58) to (230,185) -->
  <line x1="112" y1="62" x2="228" y2="186" stroke="#d97706" stroke-width="2"/>
  <text x="148" y="145" font-size="9" fill="#d97706" font-weight="600">chord</text>

  <!-- Tangent at top-right (~230,55): horizontal line -->
  <line x1="190" y1="42" x2="330" y2="42" stroke="#10b981" stroke-width="2"/>
  <!-- Touch point at circle top -->
  <circle cx="170" cy="35" r="3" fill="#10b981"/>
  <text x="320" y="38" font-size="9" fill="#10b981" font-weight="600">tangent</text>
  <!-- right angle mark at touch point -->
  <rect x="170" y="35" width="8" height="8" fill="none" stroke="#10b981" stroke-width="1.2"/>

  <!-- Arc label: minor arc between two points at ~50° and ~130° -->
  <path d="M 227 58 A 90 90 0 0 0 113 58" fill="none" stroke="#ef4444" stroke-width="3" stroke-dasharray="0"/>
  <text x="170" y="22" font-size="9" fill="#ef4444" font-weight="600" text-anchor="middle">arc</text>

  <!-- Point labels for chord endpoints -->
  <circle cx="112" cy="62" r="3" fill="#d97706"/>
  <circle cx="228" cy="186" r="3" fill="#d97706"/>
  <text x="98" y="58" font-size="9" fill="#d97706">A</text>
  <text x="232" y="197" font-size="9" fill="#d97706">B</text>

  <!-- Right panel: key facts -->
  <rect x="292" y="28" width="176" height="184" rx="8" class="svg-panel svg-div" stroke-width="1"/>
  <text x="380" y="46" font-size="10" class="svg-text" text-anchor="middle" font-weight="700">Key Relationships</text>

  <text x="304" y="65" font-size="9" class="svg-muted">Diameter = 2 × radius</text>
  <line x1="304" y1="69" x2="456" y2="69" stroke="#e2e8f0" stroke-width="0.5"/>

  <text x="304" y="82" font-size="9" fill="#7c3aed" font-weight="600">Central angle = arc (°)</text>
  <text x="304" y="94" font-size="8" class="svg-muted">Central angle at O, same # of degrees</text>
  <text x="304" y="105" font-size="8" class="svg-muted">as its intercepted arc.</text>
  <line x1="304" y1="109" x2="456" y2="109" stroke="#e2e8f0" stroke-width="0.5"/>

  <text x="304" y="122" font-size="9" fill="#ef4444" font-weight="600">Inscribed angle = ½ arc</text>
  <text x="304" y="134" font-size="8" class="svg-muted">Vertex on circle, angle = half</text>
  <text x="304" y="145" font-size="8" class="svg-muted">its intercepted arc.</text>
  <line x1="304" y1="149" x2="456" y2="149" stroke="#e2e8f0" stroke-width="0.5"/>

  <text x="304" y="162" font-size="9" fill="#10b981" font-weight="600">Tangent ⊥ radius</text>
  <text x="304" y="174" font-size="8" class="svg-muted">Tangent line is always</text>
  <text x="304" y="185" font-size="8" class="svg-muted">perpendicular to radius at</text>
  <text x="304" y="196" font-size="8" class="svg-muted">the point of tangency.</text>
</svg>
