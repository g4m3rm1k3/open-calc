<svg viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg" style="font-family: ui-sans-serif, system-ui, sans-serif; border-radius: 10px;">
  <style>
    .svg-bg   { fill: rgb(var(--tw-custom-slate-50)); }
    .svg-muted{ fill: rgb(var(--tw-custom-slate-400)); }
    .dark .svg-bg   { fill: rgb(var(--tw-custom-slate-900)); }
    .dark .svg-muted{ fill: rgb(var(--tw-custom-slate-500)); }
  </style>
  <rect width="400" height="200" rx="10" class="svg-bg"/>
  <!-- Plane parallelogram -->
  <polygon points="60,150 180,60 360,60 240,150" fill="#10b981" fill-opacity="0.10" stroke="#10b981" stroke-width="1.8"/>
  <!-- Three labeled non-collinear points -->
  <circle cx="90" cy="138" r="5.5" fill="#059669" stroke="white" stroke-width="2"/>
  <text x="78" y="130" font-size="15" fill="#059669" font-weight="700" font-style="italic">P</text>
  <circle cx="220" cy="68" r="5.5" fill="#059669" stroke="white" stroke-width="2"/>
  <text x="208" y="60" font-size="15" fill="#059669" font-weight="700" font-style="italic">Q</text>
  <circle cx="330" cy="125" r="5.5" fill="#059669" stroke="white" stroke-width="2"/>
  <text x="338" y="120" font-size="15" fill="#059669" font-weight="700" font-style="italic">R</text>
  <!-- Plane label -->
  <text x="175" y="145" font-size="16" fill="#059669" font-style="italic" font-weight="700" opacity="0.6">𝒫</text>
  <!-- "Extends infinitely" arrows at corners -->
  <line x1="60" y1="150" x2="35" y2="165" stroke="#10b981" stroke-width="1" stroke-dasharray="3 2" opacity="0.5"/>
  <line x1="360" y1="60" x2="378" y2="48" stroke="#10b981" stroke-width="1" stroke-dasharray="3 2" opacity="0.5"/>
  <!-- Caption row -->
  <text x="200" y="182" font-size="12" fill="#059669" text-anchor="middle" font-weight="600">Named: plane PQR  (3 non-collinear points)  or  𝒫</text>
  <text x="200" y="198" font-size="11" class="svg-muted" text-anchor="middle">2 dimensions — infinite flat surface, extends in all directions</text>
</svg>
