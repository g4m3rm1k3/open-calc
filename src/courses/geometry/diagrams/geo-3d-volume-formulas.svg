<svg viewBox="0 0 480 200" xmlns="http://www.w3.org/2000/svg" style="font-family: ui-sans-serif, system-ui, sans-serif; border-radius: 8px;">
  <style>
    .svg-bg    { fill: rgb(var(--tw-custom-slate-50)); }
    .svg-panel { fill: #ffffff; }
    .svg-text  { fill: rgb(var(--tw-custom-slate-800)); }
    .svg-muted { fill: rgb(var(--tw-custom-slate-500)); }
    .svg-div   { stroke: rgb(var(--tw-custom-slate-200)); fill: none; }
    .dark .svg-bg    { fill: rgb(var(--tw-custom-slate-900)); }
    .dark .svg-panel { fill: rgb(var(--tw-custom-slate-800)); }
    .dark .svg-text  { fill: rgb(var(--tw-custom-slate-200)); }
    .dark .svg-muted { fill: rgb(var(--tw-custom-slate-400)); }
    .dark .svg-div   { stroke: rgb(var(--tw-custom-slate-700)); }
  </style>
  <rect width="480" height="200" rx="8" class="svg-bg"/>
  <text x="240" y="16" font-size="10" class="svg-muted" text-anchor="middle" font-weight="600">3D Volume Formulas — V = (Base Area) × Height</text>

  <!-- PRISM / CYLINDER -->
  <rect x="8" y="25" width="105" height="170" rx="6" fill="rgba(30,58,95,0.05)" stroke="#1e3a5f" stroke-width="1.2"/>
  <text x="60" y="43" font-size="10" fill="#1e3a5f" font-weight="700" text-anchor="middle">Prism / Cylinder</text>
  <!-- Cylinder sketch -->
  <ellipse cx="60" cy="80" rx="30" ry="10" fill="rgba(30,58,95,0.15)" stroke="#1e3a5f" stroke-width="1.5"/>
  <rect x="30" y="80" width="60" height="55" fill="rgba(30,58,95,0.08)" stroke="#1e3a5f" stroke-width="1.5"/>
  <ellipse cx="60" cy="135" rx="30" ry="10" fill="rgba(30,58,95,0.15)" stroke="#1e3a5f" stroke-width="1.5"/>
  <!-- h label -->
  <line x1="96" y1="80" x2="96" y2="135" stroke="#dc2626" stroke-width="1.3"/>
  <text x="102" y="112" font-size="10" fill="#dc2626">h</text>
  <!-- r label -->
  <line x1="60" y1="135" x2="90" y2="135" stroke="#dc2626" stroke-width="1.3"/>
  <text x="73" y="148" font-size="10" fill="#dc2626">r</text>
  <text x="60" y="165" font-size="10" fill="#1e3a5f" font-weight="700" text-anchor="middle">V = Bh</text>
  <text x="60" y="179" font-size="9" class="svg-muted" text-anchor="middle">= πr²h (cylinder)</text>
  <text x="60" y="191" font-size="8" fill="#64748b" text-anchor="middle">B = base area</text>

  <!-- CONE -->
  <rect x="121" y="25" width="105" height="170" rx="6" fill="rgba(26,58,42,0.05)" stroke="#1a3a2a" stroke-width="1.2"/>
  <text x="173" y="43" font-size="10" fill="#1a3a2a" font-weight="700" text-anchor="middle">Cone</text>
  <!-- Cone sketch: apex at top, elliptical base at bottom -->
  <ellipse cx="173" cy="135" rx="30" ry="10" fill="rgba(26,58,42,0.12)" stroke="#1a3a2a" stroke-width="1.5"/>
  <line x1="143" y1="135" x2="173" y2="70" stroke="#1a3a2a" stroke-width="1.5"/>
  <line x1="203" y1="135" x2="173" y2="70" stroke="#1a3a2a" stroke-width="1.5"/>
  <circle cx="173" cy="70" r="3" fill="#1a3a2a"/>
  <!-- h label -->
  <line x1="173" y1="70" x2="173" y2="135" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="3,2"/>
  <text x="178" y="108" font-size="10" fill="#dc2626">h</text>
  <line x1="173" y1="135" x2="203" y2="135" stroke="#dc2626" stroke-width="1.2"/>
  <text x="187" y="148" font-size="10" fill="#dc2626">r</text>
  <text x="173" y="165" font-size="10" fill="#1a3a2a" font-weight="700" text-anchor="middle">V = ⅓πr²h</text>
  <text x="173" y="179" font-size="9" class="svg-muted" text-anchor="middle">= ⅓ × cylinder</text>
  <text x="173" y="192" font-size="8" fill="#64748b" text-anchor="middle">Cavalieri proves this</text>

  <!-- PYRAMID -->
  <rect x="234" y="25" width="105" height="170" rx="6" fill="rgba(124,58,237,0.04)" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="286" y="43" font-size="10" fill="#7c3aed" font-weight="700" text-anchor="middle">Pyramid</text>
  <!-- Square base -->
  <polygon points="258,138 314,138 306,118 266,118" fill="rgba(124,58,237,0.1)" stroke="#7c3aed" stroke-width="1.5"/>
  <!-- Apex -->
  <circle cx="286" cy="75" r="3" fill="#7c3aed"/>
  <!-- Slant edges -->
  <line x1="258" y1="138" x2="286" y2="75" stroke="#7c3aed" stroke-width="1.5"/>
  <line x1="314" y1="138" x2="286" y2="75" stroke="#7c3aed" stroke-width="1.5"/>
  <line x1="306" y1="118" x2="286" y2="75" stroke="#7c3aed" stroke-width="1.3" stroke-dasharray="3,2"/>
  <!-- h label -->
  <line x1="286" y1="75" x2="286" y2="128" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="3,2"/>
  <text x="290" y="108" font-size="10" fill="#dc2626">h</text>
  <text x="286" y="160" font-size="10" fill="#7c3aed" font-weight="700" text-anchor="middle">V = ⅓Bh</text>
  <text x="286" y="174" font-size="9" class="svg-muted" text-anchor="middle">= ⅓ × base × height</text>
  <text x="286" y="188" font-size="8" fill="#64748b" text-anchor="middle">B = base area</text>

  <!-- SPHERE -->
  <rect x="347" y="25" width="126" height="170" rx="6" fill="rgba(220,38,38,0.04)" stroke="#dc2626" stroke-width="1.2"/>
  <text x="410" y="43" font-size="10" fill="#dc2626" font-weight="700" text-anchor="middle">Sphere</text>
  <!-- Sphere sketch -->
  <circle cx="410" cy="105" r="45" fill="rgba(220,38,38,0.08)" stroke="#dc2626" stroke-width="1.8"/>
  <!-- Equatorial ellipse -->
  <ellipse cx="410" cy="105" rx="45" ry="12" fill="none" stroke="#dc2626" stroke-width="1" stroke-dasharray="4,3" opacity="0.5"/>
  <!-- Radius -->
  <line x1="410" y1="105" x2="455" y2="105" stroke="#dc2626" stroke-width="1.5"/>
  <text x="432" y="99" font-size="12" fill="#dc2626" font-weight="700">r</text>
  <text x="410" y="166" font-size="10" fill="#dc2626" font-weight="700" text-anchor="middle">V = ⁴⁄₃πr³</text>
  <text x="410" y="180" font-size="9" class="svg-muted" text-anchor="middle">SA = 4πr²</text>
  <text x="410" y="192" font-size="8" fill="#64748b" text-anchor="middle">Archimedes found both</text>
</svg>
