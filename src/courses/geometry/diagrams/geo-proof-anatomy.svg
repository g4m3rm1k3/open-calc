<svg viewBox="0 0 480 310" xmlns="http://www.w3.org/2000/svg" style="font-family: ui-sans-serif, system-ui, sans-serif; border-radius: 10px;">
  <style>
    .svg-bg    { fill: rgb(var(--tw-custom-slate-50)); }
    .svg-panel { fill: #ffffff; }
    .svg-text  { fill: rgb(var(--tw-custom-slate-800)); }
    .svg-muted { fill: rgb(var(--tw-custom-slate-500)); }
    .dark .svg-bg    { fill: rgb(var(--tw-custom-slate-900)); }
    .dark .svg-panel { fill: rgb(var(--tw-custom-slate-800)); }
    .dark .svg-text  { fill: rgb(var(--tw-custom-slate-200)); }
    .dark .svg-muted { fill: rgb(var(--tw-custom-slate-400)); }
  </style>

  <rect width="480" height="310" rx="10" class="svg-bg"/>

  <!-- Title -->
  <text x="240" y="24" font-size="13" font-weight="700" text-anchor="middle" class="svg-text">Anatomy of a Proof</text>

  <!-- Step 1: Claim -->
  <rect x="20" y="38" width="440" height="46" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="20" y="38" width="72" height="46" rx="8" fill="#3b82f6"/>
  <text x="56" y="66" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Claim</text>
  <text x="108" y="58" font-size="11" fill="#1d4ed8">A precisely stated proposition.</text>
  <text x="108" y="74" font-size="10" class="svg-muted">e.g. "Vertical angles are equal" — not "these look equal"</text>

  <!-- Connector -->
  <line x1="240" y1="84" x2="240" y2="96" stroke="#94a3b8" stroke-width="1.5"/>
  <polygon points="236,94 244,94 240,102" fill="#94a3b8"/>

  <!-- Step 2: Given -->
  <rect x="20" y="102" width="440" height="46" rx="8" fill="#f0fdf4" stroke="#10b981" stroke-width="1.5"/>
  <rect x="20" y="102" width="72" height="46" rx="8" fill="#10b981"/>
  <text x="56" y="130" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Given</text>
  <text x="108" y="122" font-size="11" fill="#065f46">The assumptions in force for this proof.</text>
  <text x="108" y="138" font-size="10" class="svg-muted">State explicitly what you are starting with.</text>

  <!-- Connector -->
  <line x1="240" y1="148" x2="240" y2="160" stroke="#94a3b8" stroke-width="1.5"/>
  <polygon points="236,158 244,158 240,164" fill="#94a3b8"/>

  <!-- Step 3: Proof body -->
  <rect x="20" y="164" width="440" height="64" rx="8" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="20" y="164" width="72" height="64" rx="8" fill="#f59e0b"/>
  <text x="56" y="192" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Proof</text>
  <text x="56" y="208" font-size="10" fill="#fff" text-anchor="middle">steps</text>
  <text x="108" y="184" font-size="11" fill="#92400e">Each step cites: postulate / definition / prior theorem.</text>
  <text x="108" y="200" font-size="10" class="svg-muted">Direct: given → conclusion via logic.</text>
  <text x="108" y="216" font-size="10" class="svg-muted">Contradiction: assume ¬P → contradiction → P is true.</text>

  <!-- Connector -->
  <line x1="240" y1="228" x2="240" y2="240" stroke="#94a3b8" stroke-width="1.5"/>
  <polygon points="236,238 244,238 240,244" fill="#94a3b8"/>

  <!-- Step 4: QED -->
  <rect x="20" y="244" width="440" height="46" rx="8" fill="#fdf4ff" stroke="#a855f7" stroke-width="1.5"/>
  <rect x="20" y="244" width="72" height="46" rx="8" fill="#a855f7"/>
  <text x="56" y="272" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">QED □</text>
  <text x="108" y="264" font-size="11" fill="#6b21a8">Proof complete. The claim is now a theorem.</text>
  <text x="108" y="280" font-size="10" class="svg-muted">□ = quod erat demonstrandum. Marks the end.</text>
</svg>
