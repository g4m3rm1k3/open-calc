<svg viewBox="0 0 480 240" xmlns="http://www.w3.org/2000/svg" style="font-family: ui-sans-serif, system-ui, sans-serif; border-radius: 10px;">
  <style>
    .svg-bg    { fill: rgb(var(--tw-custom-slate-50)); }
    .svg-panel { fill: #ffffff; }
    .svg-text  { fill: rgb(var(--tw-custom-slate-800)); }
    .svg-muted { fill: rgb(var(--tw-custom-slate-500)); }
    .svg-div   { stroke: rgb(var(--tw-custom-slate-200)); fill: none; }
    .dark .svg-bg    { fill: rgb(var(--tw-custom-slate-900)); }
    .dark .svg-panel { fill: rgb(var(--tw-custom-slate-800)); }
    .dark .svg-text  { fill: rgb(var(--tw-custom-slate-200)); }
    .dark .svg-muted { fill: rgb(var(--tw-custom-slate-400)); }
    .dark .svg-div   { stroke: rgb(var(--tw-custom-slate-700)); }
  </style>
  <rect width="480" height="240" rx="10" class="svg-bg"/>

  <!-- Title -->
  <text x="240" y="22" font-size="12" class="svg-text" text-anchor="middle" font-weight="700">Propositions vs Non-Propositions</text>

  <!-- Left column header: IS a proposition -->
  <rect x="12" y="30" width="220" height="200" rx="8" fill="rgba(16,185,129,0.08)" stroke="#10b981" stroke-width="1.5"/>
  <rect x="12" y="30" width="220" height="26" rx="8" fill="rgba(16,185,129,0.18)"/>
  <rect x="12" y="44" width="220" height="12" rx="0" fill="rgba(16,185,129,0.18)"/>
  <text x="122" y="47" font-size="11" fill="#065f46" text-anchor="middle" font-weight="700">✓  IS a Proposition</text>

  <!-- Right column header: NOT a proposition -->
  <rect x="248" y="30" width="220" height="200" rx="8" fill="rgba(239,68,68,0.07)" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="248" y="30" width="220" height="26" rx="8" fill="rgba(239,68,68,0.15)"/>
  <rect x="248" y="44" width="220" height="12" rx="0" fill="rgba(239,68,68,0.15)"/>
  <text x="358" y="47" font-size="11" fill="#991b1b" text-anchor="middle" font-weight="700">✗  NOT a Proposition</text>

  <!-- Left items -->
  <!-- Item 1 -->
  <rect x="20" y="62" width="204" height="38" rx="5" class="svg-panel svg-div" stroke-width="0.8"/>
  <text x="28" y="77" font-size="10" class="svg-text">"5 is an even number."</text>
  <text x="28" y="91" font-size="9" class="svg-muted">False, but has a definite truth value.</text>

  <!-- Item 2 -->
  <rect x="20" y="106" width="204" height="38" rx="5" class="svg-panel svg-div" stroke-width="0.8"/>
  <text x="28" y="121" font-size="10" class="svg-text">"∠A + ∠B + ∠C = 180°."</text>
  <text x="28" y="135" font-size="9" class="svg-muted">A geometric claim — true in Euclidean geometry.</text>

  <!-- Item 3 -->
  <rect x="20" y="150" width="204" height="38" rx="5" class="svg-panel svg-div" stroke-width="0.8"/>
  <text x="28" y="165" font-size="10" class="svg-text">"If AB ∥ CD, alt. int. angles are equal."</text>
  <text x="28" y="179" font-size="9" class="svg-muted">Conditional statement — definitely true or false.</text>

  <!-- Item 4 (truth value) tag -->
  <rect x="20" y="194" width="204" height="28" rx="5" fill="rgba(16,185,129,0.12)" stroke="#10b981" stroke-width="0.8"/>
  <text x="122" y="212" font-size="9" fill="#065f46" text-anchor="middle" font-weight="600">Every proposition has truth value T or F</text>

  <!-- Right items -->
  <!-- Item 1 -->
  <rect x="256" y="62" width="204" height="38" rx="5" class="svg-panel svg-div" stroke-width="0.8"/>
  <text x="264" y="77" font-size="10" class="svg-text">"Construct the midpoint of AB."</text>
  <text x="264" y="91" font-size="9" class="svg-muted">A command — cannot be true or false.</text>

  <!-- Item 2 -->
  <rect x="256" y="106" width="204" height="38" rx="5" class="svg-panel svg-div" stroke-width="0.8"/>
  <text x="264" y="121" font-size="10" class="svg-text">"Is AB parallel to CD?"</text>
  <text x="264" y="135" font-size="9" class="svg-muted">A question — invites answers, makes no claim.</text>

  <!-- Item 3 -->
  <rect x="256" y="150" width="204" height="38" rx="5" class="svg-panel svg-div" stroke-width="0.8"/>
  <text x="264" y="165" font-size="10" class="svg-text">"x &gt; 3."</text>
  <text x="264" y="179" font-size="9" class="svg-muted">A predicate — no truth value without knowing x.</text>

  <!-- Item 4 (non-prop types) tag -->
  <rect x="256" y="194" width="204" height="28" rx="5" fill="rgba(239,68,68,0.08)" stroke="#ef4444" stroke-width="0.8"/>
  <text x="358" y="212" font-size="9" fill="#991b1b" text-anchor="middle" font-weight="600">Commands · Questions · Predicates · Paradoxes</text>
</svg>
