<svg viewBox="0 0 480 250" xmlns="http://www.w3.org/2000/svg" style="font-family: ui-sans-serif, system-ui, sans-serif; border-radius: 10px;">
  <style>
    .svg-bg    { fill: #f8fafc; }
    .svg-panel { fill: #ffffff; }
    .svg-text  { fill: #1e293b; }
    .svg-muted { fill: #64748b; }
    .svg-div   { stroke: #e2e8f0; fill: none; }
    .dark .svg-bg    { fill: #0f172a; }
    .dark .svg-panel { fill: #1e293b; }
    .dark .svg-text  { fill: #e2e8f0; }
    .dark .svg-muted { fill: #94a3b8; }
    .dark .svg-div   { stroke: #334155; }
  </style>
  <rect width="480" height="250" rx="10" class="svg-bg"/>

  <text x="240" y="20" font-size="12" class="svg-text" text-anchor="middle" font-weight="700">The Four Forms of a Conditional</text>

  <!-- Box 1: Original (top-left) -->
  <rect x="16" y="30" width="210" height="90" rx="8" fill="rgba(30,58,95,0.08)" stroke="#1e3a5f" stroke-width="1.8"/>
  <text x="121" y="50" font-size="11" fill="#1e3a5f" text-anchor="middle" font-weight="700">Original</text>
  <text x="121" y="65" font-size="13" fill="#1e3a5f" text-anchor="middle" font-weight="800">P → Q</text>
  <text x="121" y="82" font-size="10" class="svg-muted" text-anchor="middle">"If P, then Q."</text>
  <rect x="80" y="90" width="82" height="18" rx="6" fill="rgba(16,185,129,0.2)" stroke="#10b981" stroke-width="1"/>
  <text x="121" y="103" font-size="9" fill="#065f46" text-anchor="middle" font-weight="700">May be true or false</text>

  <!-- Box 2: Contrapositive (top-right) -->
  <rect x="254" y="30" width="210" height="90" rx="8" fill="rgba(124,58,237,0.08)" stroke="#7c3aed" stroke-width="1.8"/>
  <text x="359" y="50" font-size="11" fill="#7c3aed" text-anchor="middle" font-weight="700">Contrapositive</text>
  <text x="359" y="65" font-size="13" fill="#7c3aed" text-anchor="middle" font-weight="800">¬Q → ¬P</text>
  <text x="359" y="82" font-size="10" class="svg-muted" text-anchor="middle">"If not Q, then not P."</text>
  <rect x="309" y="90" width="100" height="18" rx="6" fill="rgba(124,58,237,0.18)" stroke="#7c3aed" stroke-width="1"/>
  <text x="359" y="103" font-size="9" fill="#6d28d9" text-anchor="middle" font-weight="700">Always equivalent to Original</text>

  <!-- Box 3: Converse (bottom-left) -->
  <rect x="16" y="155" width="210" height="90" rx="8" fill="rgba(217,119,6,0.08)" stroke="#d97706" stroke-width="1.8"/>
  <text x="121" y="175" font-size="11" fill="#92400e" text-anchor="middle" font-weight="700">Converse</text>
  <text x="121" y="190" font-size="13" fill="#92400e" text-anchor="middle" font-weight="800">Q → P</text>
  <text x="121" y="207" font-size="10" class="svg-muted" text-anchor="middle">"If Q, then P."</text>
  <rect x="63" y="215" width="116" height="18" rx="6" fill="rgba(217,119,6,0.15)" stroke="#d97706" stroke-width="1"/>
  <text x="121" y="228" font-size="9" fill="#92400e" text-anchor="middle" font-weight="700">Needs a separate proof</text>

  <!-- Box 4: Inverse (bottom-right) -->
  <rect x="254" y="155" width="210" height="90" rx="8" fill="rgba(217,119,6,0.08)" stroke="#d97706" stroke-width="1.8"/>
  <text x="359" y="175" font-size="11" fill="#92400e" text-anchor="middle" font-weight="700">Inverse</text>
  <text x="359" y="190" font-size="13" fill="#92400e" text-anchor="middle" font-weight="800">¬P → ¬Q</text>
  <text x="359" y="207" font-size="10" class="svg-muted" text-anchor="middle">"If not P, then not Q."</text>
  <rect x="301" y="215" width="116" height="18" rx="6" fill="rgba(217,119,6,0.15)" stroke="#d97706" stroke-width="1"/>
  <text x="359" y="228" font-size="9" fill="#92400e" text-anchor="middle" font-weight="700">Always equivalent to Converse</text>

  <!-- Equivalence arrow: Original ↔ Contrapositive (top) -->
  <line x1="226" y1="75" x2="254" y2="75" stroke="#7c3aed" stroke-width="2" marker-start="url(#arrowL)" marker-end="url(#arrowR)"/>
  <rect x="222" y="63" width="36" height="12" rx="3" fill="#ede9fe"/>
  <text x="240" y="73" font-size="8" fill="#6d28d9" text-anchor="middle" font-weight="700">≡</text>

  <!-- Equivalence arrow: Converse ↔ Inverse (bottom) -->
  <line x1="226" y1="200" x2="254" y2="200" stroke="#d97706" stroke-width="2" marker-start="url(#arrowLO)" marker-end="url(#arrowRO)"/>
  <rect x="222" y="188" width="36" height="12" rx="3" fill="#fef3c7"/>
  <text x="240" y="198" font-size="8" fill="#92400e" text-anchor="middle" font-weight="700">≡</text>

  <!-- NOT-equivalent arrows: Original and Converse (left side, vertical) -->
  <line x1="121" y1="120" x2="121" y2="155" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="121" y="141" font-size="9" fill="#dc2626" text-anchor="middle" font-weight="700">≠</text>

  <!-- NOT-equivalent: Contrapositive and Inverse (right side, vertical) -->
  <line x1="359" y1="120" x2="359" y2="155" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="359" y="141" font-size="9" fill="#dc2626" text-anchor="middle" font-weight="700">≠</text>

  <defs>
    <marker id="arrowR" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrowL" markerWidth="6" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L0,6 L6,3 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrowRO" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#d97706"/>
    </marker>
    <marker id="arrowLO" markerWidth="6" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L0,6 L6,3 z" fill="#d97706"/>
    </marker>
  </defs>
</svg>
