<svg viewBox="0 0 520 340" xmlns="http://www.w3.org/2000/svg" style="font-family: ui-sans-serif, system-ui, sans-serif; border-radius: 12px;">
  <style>
    .svg-bg      { fill: #f8fafc; }
    .svg-grid    { stroke: #e2e8f0; fill: none; }
    .svg-axis    { stroke: #94a3b8; fill: none; }
    .svg-axis-fill { fill: #94a3b8; }
    .svg-muted   { fill: #94a3b8; }
    .svg-text    { fill: #64748b; }
    .svg-label   { fill: #4338ca; }
    .dark .svg-bg      { fill: #0f172a; }
    .dark .svg-grid    { stroke: #1e293b; }
    .dark .svg-axis    { stroke: #475569; }
    .dark .svg-axis-fill { fill: #475569; }
    .dark .svg-muted   { fill: #64748b; }
    .dark .svg-text    { fill: #94a3b8; }
    .dark .svg-label   { fill: #818cf8; }
  </style>
  <rect width="520" height="340" rx="12" class="svg-bg"/>

  <!-- Grid lines -->
  <line x1="80" y1="40" x2="80" y2="290" class="svg-grid" stroke-width="1"/>
  <line x1="130" y1="40" x2="130" y2="290" class="svg-grid" stroke-width="1"/>
  <line x1="180" y1="40" x2="180" y2="290" class="svg-grid" stroke-width="1"/>
  <line x1="230" y1="40" x2="230" y2="290" class="svg-grid" stroke-width="1"/>
  <line x1="280" y1="40" x2="280" y2="290" class="svg-grid" stroke-width="1"/>
  <line x1="330" y1="40" x2="330" y2="290" class="svg-grid" stroke-width="1"/>
  <line x1="380" y1="40" x2="380" y2="290" class="svg-grid" stroke-width="1"/>
  <line x1="430" y1="40" x2="430" y2="290" class="svg-grid" stroke-width="1"/>
  <line x1="480" y1="40" x2="480" y2="290" class="svg-grid" stroke-width="1"/>

  <line x1="80" y1="290" x2="490" y2="290" class="svg-grid" stroke-width="1"/>
  <line x1="80" y1="240" x2="490" y2="240" class="svg-grid" stroke-width="1"/>
  <line x1="80" y1="190" x2="490" y2="190" class="svg-grid" stroke-width="1"/>
  <line x1="80" y1="140" x2="490" y2="140" class="svg-grid" stroke-width="1"/>
  <line x1="80" y1="90" x2="490" y2="90" class="svg-grid" stroke-width="1"/>
  <line x1="80" y1="40" x2="490" y2="40" class="svg-grid" stroke-width="1"/>

  <!-- Axes -->
  <line x1="80" y1="290" x2="495" y2="290" class="svg-axis" stroke-width="2"/>
  <line x1="80" y1="40" x2="80" y2="295" class="svg-axis" stroke-width="2"/>
  <!-- Arrow heads -->
  <polygon points="495,287 495,293 503,290" class="svg-axis-fill"/>
  <polygon points="77,40 83,40 80,32" class="svg-axis-fill"/>

  <!-- Axis labels -->
  <text x="506" y="294" font-size="14" class="svg-text" font-style="italic">x</text>
  <text x="74" y="28" font-size="14" class="svg-text" font-style="italic">y</text>

  <!-- Axis tick labels -->
  <text x="130" y="306" font-size="11" class="svg-muted" text-anchor="middle">1</text>
  <text x="180" y="306" font-size="11" class="svg-muted" text-anchor="middle">2</text>
  <text x="230" y="306" font-size="11" class="svg-muted" text-anchor="middle">3</text>
  <text x="280" y="306" font-size="11" class="svg-muted" text-anchor="middle">4</text>
  <text x="330" y="306" font-size="11" class="svg-muted" text-anchor="middle">5</text>
  <text x="380" y="306" font-size="11" class="svg-muted" text-anchor="middle">6</text>
  <text x="430" y="306" font-size="11" class="svg-muted" text-anchor="middle">7</text>

  <text x="68" y="244" font-size="11" class="svg-muted" text-anchor="end">1</text>
  <text x="68" y="194" font-size="11" class="svg-muted" text-anchor="end">2</text>
  <text x="68" y="144" font-size="11" class="svg-muted" text-anchor="end">3</text>
  <text x="68" y="94" font-size="11" class="svg-muted" text-anchor="end">4</text>

  <!-- Right triangle legs (dashed) -->
  <line x1="180" y1="240" x2="380" y2="240" stroke="#6366f1" stroke-width="2" stroke-dasharray="6 3" opacity="0.8"/>
  <line x1="380" y1="240" x2="380" y2="90" stroke="#6366f1" stroke-width="2" stroke-dasharray="6 3" opacity="0.8"/>

  <!-- Right angle mark at (380, 240) -->
  <polyline points="370,240 370,230 380,230" fill="none" stroke="#6366f1" stroke-width="1.5" opacity="0.8"/>

  <!-- Hypotenuse — the distance d -->
  <line x1="180" y1="240" x2="380" y2="90" stroke="#f43f5e" stroke-width="2.5"/>

  <!-- Δx label -->
  <text x="280" y="258" font-size="13" fill="#6366f1" text-anchor="middle" font-weight="600">Δx = 4</text>

  <!-- Δy label -->
  <text x="400" y="168" font-size="13" fill="#6366f1" font-weight="600">Δy = 3</text>

  <!-- d label along hypotenuse -->
  <text x="260" y="155" font-size="13" fill="#f43f5e" font-weight="700" transform="rotate(-36.87, 260, 155)">d = 5</text>

  <!-- Point A at (2, 1) → screen (180, 240) -->
  <circle cx="180" cy="240" r="6" fill="#6366f1" stroke="white" stroke-width="2"/>
  <text x="155" y="260" font-size="13" class="svg-label" font-weight="600">A(2, 1)</text>

  <!-- Point B at (6, 4) → screen (380, 90) -->
  <circle cx="380" cy="90" r="6" fill="#6366f1" stroke="white" stroke-width="2"/>
  <text x="388" y="86" font-size="13" class="svg-label" font-weight="600">B(6, 4)</text>

  <!-- Bottom annotation -->
  <text x="260" y="328" font-size="12" class="svg-muted" text-anchor="middle">a² + b² = c²   →   4² + 3² = d²   →   d = √25 = 5</text>

</svg>
