<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="Georgia, serif">
  <style>
    .svg-bg    { fill: rgb(var(--tw-custom-slate-50)); }
    .svg-text  { fill: #1e3a5f; }
    .svg-sub   { fill: rgb(var(--tw-custom-slate-700)); }
    .svg-muted { fill: rgb(var(--tw-custom-slate-400)); }
    .svg-panel { fill: #eff6ff; stroke: #1e3a5f; }
    .svg-proof { fill: #fff7ed; stroke: #b45309; }
    .svg-use   { fill: #f0fdf4; stroke: #166534; }
    .dark .svg-bg    { fill: rgb(var(--tw-custom-slate-800)); }
    .dark .svg-text  { fill: #93c5fd; }
    .dark .svg-sub   { fill: rgb(var(--tw-custom-slate-300)); }
    .dark .svg-muted { fill: rgb(var(--tw-custom-slate-600)); }
    .dark .svg-panel { fill: #1e3a5f44; stroke: #93c5fd; }
    .dark .svg-proof { fill: #451a0322; stroke: #fbbf24; }
    .dark .svg-use   { fill: #14532d22; stroke: #4ade80; }
  </style>

  <rect width="720" height="380" class="svg-bg"/>

  <!-- ===== Left: Parallelogram on axes ===== -->
  <text x="178" y="22" font-size="15" class="svg-text" font-weight="bold" text-anchor="middle">Prove: ABCD is a Parallelogram</text>

  <!-- Axes -->
  <line x1="30"  y1="210" x2="345" y2="210" stroke="#94a3b8" stroke-width="1.5" style="fill:none"/>
  <line x1="50"  y1="330" x2="50"  y2="40"  stroke="#94a3b8" stroke-width="1.5" style="fill:none"/>
  <text x="348" y="214" font-size="11" class="svg-muted">x</text>
  <text x="52"  y="36"  font-size="11" class="svg-muted">y</text>

  <!-- Parallelogram: A=(0,0) B=(6,0) C=(8,4) D=(2,4) -->
  <!-- Scale: origin=(50,210), unit=32 -->
  <!-- A=(50,210) B=(242,210) C=(306,82) D=(114,82) -->
  <polygon points="50,210 242,210 306,82 114,82" fill="#1e3a5f11" stroke="#1e3a5f" stroke-width="2.5"/>
  <circle cx="50"  cy="210" r="5" fill="#dc2626"/>
  <circle cx="242" cy="210" r="5" fill="#166534"/>
  <circle cx="306" cy="82"  r="5" fill="#b45309"/>
  <circle cx="114" cy="82"  r="5" fill="#7c3aed"/>
  <text x="30"  y="226" font-size="13" fill="#dc2626"  font-weight="bold">A(0,0)</text>
  <text x="244" y="226" font-size="13" fill="#166534"  font-weight="bold">B(6,0)</text>
  <text x="308" y="78"  font-size="13" fill="#b45309"  font-weight="bold">C(8,4)</text>
  <text x="64"  y="78"  font-size="13" fill="#7c3aed"  font-weight="bold">D(2,4)</text>

  <!-- Midpoint of diagonals — prove both diagonals bisect each other -->
  <!-- AC: midpoint = (4,2) → (178,146); BD: midpoint = ((6+2)/2,(0+4)/2)=(4,2) ✓ -->
  <line x1="50"  cy="210" x1="50"  y1="210" x2="306" y2="82"  stroke="#dc2626" stroke-width="1.2" stroke-dasharray="5,4" style="fill:none"/>
  <line x1="242" y1="210" x2="114" y2="82"  stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="5,4" style="fill:none"/>
  <circle cx="178" cy="146" r="6" fill="#374151"/>
  <text x="182" y="142" font-size="12" class="svg-sub" font-weight="bold">M(4,2)</text>

  <!-- Proof steps box -->
  <rect x="20" y="260" width="330" height="108" rx="8" class="svg-proof" stroke-width="1.5"/>
  <text x="185" y="278" font-size="13" fill="#b45309" font-weight="bold" text-anchor="middle">Coordinate Proof Strategy</text>
  <text x="30"  y="297" font-size="12" class="svg-sub">1. Midpoints of both diagonals = (4,2) ✓</text>
  <text x="30"  y="313" font-size="12" class="svg-sub">   → diagonals bisect each other ⟹ ▱</text>
  <text x="30"  y="330" font-size="12" class="svg-sub">OR: slope AB = slope DC = 0 (parallel)</text>
  <text x="30"  y="346" font-size="12" class="svg-sub">    slope AD = slope BC = 2 (parallel)</text>
  <text x="30"  y="362" font-size="12" class="svg-sub">    |AB|=|DC|=6, |AD|=|BC|=√8 ✓</text>

  <!-- Divider -->
  <line x1="365" y1="30" x2="365" y2="375" stroke="#e2e8f0" stroke-width="1.5" style="fill:none"/>

  <!-- ===== Right: Rectangle / rhombus ===== -->
  <text x="544" y="22" font-size="15" class="svg-text" font-weight="bold" text-anchor="middle">Prove: Rectangle vs Rhombus</text>

  <!-- Axes -->
  <line x1="380" y1="230" x2="710" y2="230" stroke="#94a3b8" stroke-width="1.5" style="fill:none"/>
  <line x1="400" y1="360" x2="400" y2="40"  stroke="#94a3b8" stroke-width="1.5" style="fill:none"/>

  <!-- Rectangle: A=(0,0) B=(6,0) C=(6,4) D=(0,4) → scale: origin=(400,230),unit=28 -->
  <!-- A=(400,230) B=(568,230) C=(568,118) D=(400,118) -->
  <polygon points="400,230 568,230 568,118 400,118" fill="#166534" fill-opacity="0.08" stroke="#166534" stroke-width="2.5"/>
  <circle cx="400" cy="230" r="4" fill="#166534"/>
  <circle cx="568" cy="230" r="4" fill="#166534"/>
  <circle cx="568" cy="118" r="4" fill="#166534"/>
  <circle cx="400" cy="118" r="4" fill="#166534"/>
  <text x="376" y="246" font-size="12" fill="#166534">A</text>
  <text x="570" y="246" font-size="12" fill="#166534">B(6,0)</text>
  <text x="570" y="115" font-size="12" fill="#166534">C(6,4)</text>
  <text x="376" y="115" font-size="12" fill="#166534">D</text>
  <!-- Right angle marks -->
  <rect x="400" y="218" width="12" height="12" fill="none" stroke="#166534" stroke-width="1.5"/>
  <rect x="556" y="218" width="12" height="12" fill="none" stroke="#166534" stroke-width="1.5"/>
  <rect x="556" y="118" width="12" height="12" fill="none" stroke="#166534" stroke-width="1.5"/>
  <rect x="400" y="118" width="12" height="12" fill="none" stroke="#166534" stroke-width="1.5"/>
  <text x="481" y="250" font-size="12" fill="#166534" text-anchor="middle">slope AB=0</text>
  <text x="376" y="176" font-size="12" fill="#166534">slope AD=∞</text>
  <text x="381" y="194" font-size="12" fill="#166534">→ ⊥ ✓</text>

  <!-- Rhombus: A=(0,3) B=(4,0) C=(8,3) D=(4,6) → origin=(400,230),unit=28 -->
  <!-- A=(400,146) B=(512,230) C=(624,146) D=(512,62) -->
  <polygon points="400,146 512,230 624,146 512,62" fill="#7c3aed" fill-opacity="0.08" stroke="#7c3aed" stroke-width="2" stroke-dasharray="7,4"/>
  <circle cx="400" cy="146" r="4" fill="#7c3aed"/>
  <circle cx="512" cy="230" r="4" fill="#7c3aed"/>
  <circle cx="624" cy="146" r="4" fill="#7c3aed"/>
  <circle cx="512" cy="62"  r="4" fill="#7c3aed"/>
  <text x="376" y="142" font-size="12" fill="#7c3aed">A'</text>
  <text x="512" y="246" font-size="12" fill="#7c3aed" text-anchor="middle">B'(4,0)</text>
  <text x="626" y="142" font-size="12" fill="#7c3aed">C'(8,3)</text>
  <text x="512" y="55"  font-size="12" fill="#7c3aed" text-anchor="middle">D'(4,6)</text>
  <!-- All sides = 5 (3-4-5) -->
  <text x="440" y="198" font-size="12" fill="#7c3aed" text-anchor="middle">|A'B'|=5</text>
  <text x="584" y="198" font-size="12" fill="#7c3aed" text-anchor="middle">|B'C'|=5</text>

  <!-- Tool-tip strip -->
  <rect x="370" y="260" width="340" height="108" rx="8" class="svg-use" stroke-width="1.5"/>
  <text x="540" y="278" font-size="13" fill="#166534" font-weight="bold" text-anchor="middle">What to Use</text>
  <text x="380" y="296" font-size="12" class="svg-sub">Rectangle: slopes of adjacent sides are negative</text>
  <text x="380" y="312" font-size="12" class="svg-sub">  reciprocals (product = −1) → perpendicular</text>
  <text x="380" y="330" font-size="12" class="svg-sub">Rhombus: all four side lengths equal</text>
  <text x="380" y="348" font-size="12" class="svg-sub">Square: rectangle AND rhombus (both conditions)</text>
  <text x="380" y="366" font-size="12" class="svg-sub">Parallelogram: opp sides || and equal OR midpoints match</text>
</svg>
