<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="Georgia, serif">
  <style>
    .svg-bg   { fill: rgb(var(--tw-custom-slate-50)); }
    .svg-text { fill: #1e3a5f; }
    .svg-sub  { fill: rgb(var(--tw-custom-slate-700)); }
    .svg-muted{ fill: rgb(var(--tw-custom-slate-400)); }
    .svg-rule { fill: #eff6ff; stroke: #1e3a5f; }
    .dark .svg-bg   { fill: rgb(var(--tw-custom-slate-800)); }
    .dark .svg-text { fill: #93c5fd; }
    .dark .svg-sub  { fill: rgb(var(--tw-custom-slate-300)); }
    .dark .svg-muted{ fill: rgb(var(--tw-custom-slate-600)); }
    .dark .svg-rule { fill: #1e3a5f44; stroke: #93c5fd; }
  </style>

  <defs>
    <pattern id="qgrid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#e2e8f0" stroke-width="0.8"/>
    </pattern>
  </defs>

  <rect width="720" height="300" class="svg-bg"/>
  <rect width="720" height="300" fill="url(#qgrid)" opacity="0.5"/>

  <!-- Axes left panel (Q1–Q5) -->
  <text x="170" y="20" font-size="13" font-weight="bold" class="svg-sub" text-anchor="middle">Q1–Q5: Identify the transformation</text>
  <line x1="40" y1="160" x2="310" y2="160" stroke="#374151" stroke-width="1.5" style="fill:none"/>
  <line x1="170" y1="40"  x2="170" y2="280" stroke="#374151" stroke-width="1.5" style="fill:none"/>
  <text x="314" y="164" font-size="11" class="svg-sub">x</text>
  <text x="172" y="36"  font-size="11" class="svg-sub">y</text>
  <!-- Scale marks -->
  <text x="195" y="163" font-size="10" class="svg-muted">1</text>
  <text x="220" y="163" font-size="10" class="svg-muted">2</text>
  <text x="245" y="163" font-size="10" class="svg-muted">3</text>
  <text x="144" y="163" font-size="10" class="svg-muted">-1</text>
  <text x="166" y="138" font-size="10" class="svg-muted">1</text>
  <text x="166" y="113" font-size="10" class="svg-muted">2</text>
  <text x="166" y="188" font-size="10" class="svg-muted">-1</text>
  <text x="166" y="213" font-size="10" class="svg-muted">-2</text>

  <!-- Original PQR: (1,1)(3,1)(2,3) → 1unit=25px, origin=(170,160) -->
  <!-- (195,135)(245,135)(220,85) -->
  <polygon points="195,135 245,135 220,85" fill="#1e3a5f22" stroke="#1e3a5f" stroke-width="2"/>
  <text x="187" y="150" font-size="11" class="svg-text">P</text>
  <text x="247" y="132" font-size="11" class="svg-text">Q</text>
  <text x="222" y="82"  font-size="11" class="svg-text">R</text>

  <!-- Image A: reflection over y-axis → (145,135)(95,135)(120,85) -->
  <polygon points="145,135 95,135 120,85" fill="#dc262622" stroke="#dc2626" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="115" y="150" font-size="11" fill="#dc2626">P'</text>
  <text x="77"  y="132" font-size="11" fill="#dc2626">Q'</text>
  <text x="108" y="82"  font-size="11" fill="#dc2626">R'</text>
  <text x="72"  y="250" font-size="11" fill="#dc2626">Image A</text>

  <!-- Image B: translation (0,-3) → (195,210)(245,210)(220,160) -->
  <polygon points="195,210 245,210 220,160" fill="#16653422" stroke="#166534" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="183" y="225" font-size="11" fill="#166534">Image B</text>

  <!-- Image C: rotation 90° CW → (195,185)(195,235)(245,210) -->
  <polygon points="195,185 195,235 245,210" fill="#b4530922" stroke="#b45309" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="250" y="230" font-size="11" fill="#b45309">Image C</text>

  <!-- Divider -->
  <line x1="340" y1="20" x2="340" y2="290" stroke="#e2e8f0" stroke-width="1.5" style="fill:none"/>

  <!-- Right panel: Q6–Q10 Dilation -->
  <text x="530" y="20" font-size="13" font-weight="bold" class="svg-sub" text-anchor="middle">Q6–Q10: Dilation and composition</text>
  <line x1="370" y1="180" x2="700" y2="180" stroke="#374151" stroke-width="1.5" style="fill:none"/>
  <line x1="530" y1="40"  x2="530" y2="290" stroke="#374151" stroke-width="1.5" style="fill:none"/>
  <text x="703" y="184" font-size="11" class="svg-sub">x</text>
  <text x="532" y="36"  font-size="11" class="svg-sub">y</text>
  <text x="555" y="183" font-size="10" class="svg-muted">1</text>
  <text x="580" y="183" font-size="10" class="svg-muted">2</text>
  <text x="605" y="183" font-size="10" class="svg-muted">3</text>
  <text x="630" y="183" font-size="10" class="svg-muted">4</text>
  <text x="526" y="155" font-size="10" class="svg-muted">1</text>
  <text x="526" y="130" font-size="10" class="svg-muted">2</text>
  <text x="526" y="105" font-size="10" class="svg-muted">3</text>

  <!-- Original: (1,1)(2,1)(2,3) → (555,155)(580,155)(580,105) -->
  <polygon points="555,155 580,155 580,105" fill="#1e3a5f22" stroke="#1e3a5f" stroke-width="2"/>
  <text x="542" y="168" font-size="11" class="svg-text">(1,1)</text>
  <text x="582" y="168" font-size="11" class="svg-text">(2,1)</text>
  <text x="582" y="102" font-size="11" class="svg-text">(2,3)</text>

  <circle cx="530" cy="180" r="4" class="svg-sub" style="fill:#374151;stroke:none"/>
  <text x="518" y="195" font-size="11" class="svg-sub">O</text>

  <!-- Dilation k=2: (2,2)(4,2)(4,6) → (580,130)(630,130)(630,30) -->
  <polygon points="580,130 630,130 630,30" fill="#7c3aed22" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="5,3"/>
  <text x="632" y="128" font-size="11" fill="#7c3aed">(4,2)</text>
  <text x="632" y="28"  font-size="11" fill="#7c3aed">(4,6)</text>
  <text x="562" y="128" font-size="11" fill="#7c3aed">(2,2)</text>

  <!-- Ray lines -->
  <line x1="530" y1="180" x2="650" y2="118" stroke="#7c3aed" stroke-width="1" stroke-dasharray="3,3" style="fill:none"/>
  <line x1="530" y1="180" x2="650" y2="18"  stroke="#7c3aed" stroke-width="1" stroke-dasharray="3,3" style="fill:none"/>

  <!-- Formula strip -->
  <rect x="10" y="278" width="700" height="20" rx="4" class="svg-rule" stroke-width="1"/>
  <text x="360" y="292" font-size="12" class="svg-text" text-anchor="middle">Refl. over y-axis: (x,y)→(−x,y) · Rot. 90°CW: (x,y)→(y,−x) · Dilation k from O: (x,y)→(kx,ky)</text>
</svg>
