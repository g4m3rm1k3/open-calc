<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="Georgia, serif">
  <style>
    .svg-bg    { fill: #fafaf8; }
    .svg-text  { fill: #1e3a5f; }
    .svg-sub   { fill: #374151; }
    .svg-muted { fill: #94a3b8; }
    .svg-grid  { stroke: #e2e8f0; }
    .svg-panel { fill: #eff6ff; stroke: #1e3a5f; }
    .dark .svg-bg    { fill: #1e293b; }
    .dark .svg-text  { fill: #93c5fd; }
    .dark .svg-sub   { fill: #cbd5e1; }
    .dark .svg-muted { fill: #475569; }
    .dark .svg-grid  { stroke: #334155; }
    .dark .svg-panel { fill: #1e3a5f44; stroke: #93c5fd; }
  </style>

  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#e2e8f0" stroke-width="0.8" class="svg-grid"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect width="720" height="400" class="svg-bg"/>
  <rect width="720" height="400" fill="url(#grid)" opacity="0.6"/>

  <!-- ====== TRANSLATION (top-left) ====== -->
  <text x="90" y="22" font-size="14" class="svg-text" font-weight="bold" text-anchor="middle">Translation</text>
  <polygon points="30,80 90,80 60,40" fill="#1e3a5f22" stroke="#1e3a5f" stroke-width="2"/>
  <text x="55" y="75" font-size="11" class="svg-text">A</text>
  <text x="89" y="75" font-size="11" class="svg-text">B</text>
  <text x="57" y="38" font-size="11" class="svg-text">C</text>
  <line x1="60" y1="100" x2="120" y2="100" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)" style="fill:none"/>
  <text x="88" y="116" font-size="11" fill="#7c3aed">(+60, 0)</text>
  <polygon points="90,80 150,80 120,40" fill="#dc262622" stroke="#dc2626" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="114" y="75" font-size="11" fill="#dc2626">A'</text>
  <text x="149" y="75" font-size="11" fill="#dc2626">B'</text>
  <text x="117" y="38" font-size="11" fill="#dc2626">C'</text>
  <text x="90" y="138" font-size="11" class="svg-sub" text-anchor="middle">(x,y) → (x+60, y)</text>
  <text x="90" y="152" font-size="11" class="svg-sub" text-anchor="middle">Shape, size, orientation: same</text>

  <!-- ====== REFLECTION (top-right) ====== -->
  <text x="380" y="22" font-size="14" fill="#166534" font-weight="bold" text-anchor="middle">Reflection</text>
  <line x1="330" y1="30" x2="330" y2="160" stroke="#166534" stroke-width="2" stroke-dasharray="8,4" style="fill:none"/>
  <text x="334" y="20" font-size="11" fill="#166534">x=330</text>
  <polygon points="270,50 300,50 270,110" fill="#1e3a5f22" stroke="#1e3a5f" stroke-width="2"/>
  <text x="252" y="48" font-size="11" class="svg-text">A</text>
  <text x="304" y="48" font-size="11" class="svg-text">B</text>
  <text x="252" y="112" font-size="11" class="svg-text">C</text>
  <polygon points="390,50 360,50 390,110" fill="#dc262622" stroke="#dc2626" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="391" y="48" font-size="11" fill="#dc2626">A'</text>
  <text x="342" y="48" font-size="11" fill="#dc2626">B'</text>
  <text x="391" y="112" font-size="11" fill="#dc2626">C'</text>
  <line x1="270" y1="50" x2="390" y2="50" stroke="#7c3aed" stroke-width="1" stroke-dasharray="3,3" style="fill:none"/>
  <text x="380" y="138" font-size="11" class="svg-sub" text-anchor="middle">(x,y) → (2k−x, y) about x=k</text>
  <text x="380" y="152" font-size="11" class="svg-sub" text-anchor="middle">Orientation flips (mirror image)</text>

  <!-- ====== ROTATION (bottom-left) ====== -->
  <text x="120" y="190" font-size="14" fill="#b45309" font-weight="bold" text-anchor="middle">Rotation 90° CCW about O</text>
  <circle cx="120" cy="300" r="4" class="svg-sub" style="fill:#374151;stroke:none"/>
  <text x="108" y="315" font-size="11" class="svg-sub">O</text>
  <polygon points="180,300 180,260 150,260" fill="#1e3a5f22" stroke="#1e3a5f" stroke-width="2"/>
  <text x="182" y="306" font-size="11" class="svg-text">A</text>
  <text x="182" y="258" font-size="11" class="svg-text">B</text>
  <text x="130" y="258" font-size="11" class="svg-text">C</text>
  <polygon points="120,360 160,240 160,270" fill="#dc262622" stroke="#dc2626" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="106" y="368" font-size="11" fill="#dc2626">A'</text>
  <text x="162" y="238" font-size="11" fill="#dc2626">B'</text>
  <text x="162" y="278" font-size="11" fill="#dc2626">C'</text>
  <path d="M 175 300 A 55 55 0 0 0 120 245" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="148" y="256" font-size="11" fill="#7c3aed">90°</text>
  <text x="120" y="392" font-size="11" class="svg-sub" text-anchor="middle">(x,y) → (−y, x) about O (90° CCW)</text>

  <!-- ====== DILATION (bottom-right) ====== -->
  <text x="540" y="190" font-size="14" fill="#7c3aed" font-weight="bold" text-anchor="middle">Dilation (scale k=2)</text>
  <circle cx="450" cy="300" r="4" class="svg-sub" style="fill:#374151;stroke:none"/>
  <text x="436" y="315" font-size="11" class="svg-sub">O</text>
  <polygon points="480,270 510,270 480,300" fill="#1e3a5f22" stroke="#1e3a5f" stroke-width="2"/>
  <polygon points="510,240 570,240 510,300" fill="#7c3aed22" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="5,3"/>
  <line x1="450" y1="300" x2="530" y2="224" stroke="#7c3aed" stroke-width="1" stroke-dasharray="3,3" style="fill:none"/>
  <line x1="450" y1="300" x2="600" y2="220" stroke="#7c3aed" stroke-width="1" stroke-dasharray="3,3" style="fill:none"/>
  <line x1="450" y1="300" x2="540" y2="300" stroke="#7c3aed" stroke-width="1" stroke-dasharray="3,3" style="fill:none"/>
  <text x="476" y="268" font-size="11" class="svg-text">A</text>
  <text x="512" y="268" font-size="11" class="svg-text">B</text>
  <text x="466" y="308" font-size="11" class="svg-text">C</text>
  <text x="506" y="237" font-size="11" fill="#7c3aed">A'</text>
  <text x="572" y="237" font-size="11" fill="#7c3aed">B'</text>
  <text x="512" y="310" font-size="11" fill="#7c3aed">C'</text>
  <text x="540" y="358" font-size="11" class="svg-sub" text-anchor="middle">(x,y) → (kx, ky) from O: shape same, size×k</text>
  <text x="540" y="372" font-size="11" class="svg-sub" text-anchor="middle">Area scales by k² = 4</text>

  <!-- Summary strip -->
  <rect x="10" y="375" width="700" height="22" rx="5" class="svg-panel" stroke-width="1"/>
  <text x="360" y="391" font-size="12" class="svg-text" text-anchor="middle">Rigid motions (isometries): Translation, Reflection, Rotation — preserve distance and angle. Dilation: preserves shape, scales distances by k.</text>
</svg>
