<svg viewBox="0 0 560 380" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, sans-serif">
  <style>
    .svg-bg   { fill: rgb(var(--tw-custom-slate-50)); }
    .svg-sub  { fill: rgb(var(--tw-custom-slate-500)); }
    .svg-muted{ fill: rgb(var(--tw-custom-slate-400)); }
    .svg-div  { stroke: rgb(var(--tw-custom-slate-200)); }
    .dark .svg-bg   { fill: rgb(var(--tw-custom-slate-800)); }
    .dark .svg-sub  { fill: rgb(var(--tw-custom-slate-400)); }
    .dark .svg-muted{ fill: rgb(var(--tw-custom-slate-600)); }
    .dark .svg-div  { stroke: rgb(var(--tw-custom-slate-700)); }
  </style>

  <defs>
    <marker id="arr" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#0891b2"/>
    </marker>
    <marker id="arr2" markerWidth="5" markerHeight="5" refX="2.5" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L5,2.5 z" fill="#6366f1"/>
    </marker>
    <marker id="arr3" markerWidth="5" markerHeight="5" refX="2.5" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L5,2.5 z" fill="#0891b2"/>
    </marker>
  </defs>

  <rect width="560" height="380" rx="12" class="svg-bg"/>

  <!-- Section labels -->
  <text x="90"  y="26" font-size="11" class="svg-sub" text-anchor="middle" font-weight="700" letter-spacing="1">POINT</text>
  <text x="280" y="26" font-size="11" class="svg-sub" text-anchor="middle" font-weight="700" letter-spacing="1">LINE</text>
  <text x="460" y="26" font-size="11" class="svg-sub" text-anchor="middle" font-weight="700" letter-spacing="1">PLANE</text>

  <!-- Dividers -->
  <line x1="185" y1="10" x2="185" y2="180" class="svg-div" stroke-width="1" style="fill:none"/>
  <line x1="375" y1="10" x2="375" y2="180" class="svg-div" stroke-width="1" style="fill:none"/>

  <!-- POINT panel -->
  <circle cx="90" cy="95" r="7" fill="#6366f1" stroke="white" stroke-width="2"/>
  <text x="90" y="130" font-size="12" fill="#6366f1" text-anchor="middle" font-weight="600">0 dimensions</text>
  <text x="90" y="148" font-size="11" class="svg-muted" text-anchor="middle">Only position</text>
  <text x="90" y="164" font-size="11" class="svg-muted" text-anchor="middle">No size or length</text>
  <text x="104" y="90" font-size="13" fill="#6366f1" font-weight="700" font-style="italic">A</text>

  <!-- LINE panel -->
  <line x1="200" y1="95" x2="360" y2="95" stroke="#0891b2" stroke-width="2.5" marker-start="url(#arr)" marker-end="url(#arr)" style="fill:none"/>
  <circle cx="240" cy="95" r="5" fill="#0891b2" stroke="white" stroke-width="2"/>
  <text x="240" y="84" font-size="12" fill="#0891b2" text-anchor="middle" font-weight="700" font-style="italic">A</text>
  <circle cx="320" cy="95" r="5" fill="#0891b2" stroke="white" stroke-width="2"/>
  <text x="320" y="84" font-size="12" fill="#0891b2" text-anchor="middle" font-weight="700" font-style="italic">B</text>
  <text x="280" y="130" font-size="12" fill="#0891b2" text-anchor="middle" font-weight="600">1 dimension</text>
  <text x="280" y="148" font-size="11" class="svg-muted" text-anchor="middle">Infinite length</text>
  <text x="280" y="164" font-size="11" class="svg-muted" text-anchor="middle">Named ↔AB or ℓ</text>

  <!-- PLANE panel -->
  <polygon points="400,60 530,60 540,150 410,150" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-width="1.5"/>
  <circle cx="420" cy="78"  r="4.5" fill="#10b981" stroke="white" stroke-width="1.5"/>
  <text x="410" y="73" font-size="12" fill="#10b981" font-weight="700" font-style="italic">P</text>
  <circle cx="510" cy="80"  r="4.5" fill="#10b981" stroke="white" stroke-width="1.5"/>
  <text x="516" y="76" font-size="12" fill="#10b981" font-weight="700" font-style="italic">Q</text>
  <circle cx="455" cy="138" r="4.5" fill="#10b981" stroke="white" stroke-width="1.5"/>
  <text x="460" y="148" font-size="12" fill="#10b981" font-weight="700" font-style="italic">R</text>
  <text x="520" y="148" font-size="12" fill="#10b981" font-style="italic" font-weight="700">𝒫</text>
  <text x="460" y="172" font-size="12" fill="#10b981" text-anchor="middle" font-weight="600">2 dimensions</text>
  <text x="460" y="188" font-size="11" class="svg-muted" text-anchor="middle">Infinite flat surface</text>

  <!-- Separator -->
  <line x1="20" y1="210" x2="540" y2="210" class="svg-div" stroke-width="1.5" style="fill:none"/>
  <text x="280" y="228" font-size="11" class="svg-sub" text-anchor="middle" font-weight="700" letter-spacing="1">KEY RELATIONSHIPS</text>

  <!-- Collinear -->
  <line x1="35" y1="285" x2="160" y2="285" stroke="#6366f1" stroke-width="2" marker-start="url(#arr2)" marker-end="url(#arr2)" style="fill:none"/>
  <circle cx="60"  cy="285" r="4" fill="#6366f1" stroke="white" stroke-width="1.5"/>
  <circle cx="97"  cy="285" r="4" fill="#6366f1" stroke="white" stroke-width="1.5"/>
  <circle cx="135" cy="285" r="4" fill="#6366f1" stroke="white" stroke-width="1.5"/>
  <text x="97" y="305" font-size="11" fill="#6366f1" text-anchor="middle" font-weight="600">Collinear</text>
  <text x="97" y="320" font-size="10" class="svg-muted" text-anchor="middle">Points on one line</text>

  <!-- Parallel lines -->
  <line x1="195" y1="260" x2="325" y2="260" stroke="#0891b2" stroke-width="2" marker-start="url(#arr3)" marker-end="url(#arr3)" style="fill:none"/>
  <line x1="195" y1="295" x2="325" y2="295" stroke="#0891b2" stroke-width="2" marker-start="url(#arr3)" marker-end="url(#arr3)" style="fill:none"/>
  <text x="336" y="264" font-size="12" fill="#0891b2" font-style="italic">ℓ₁</text>
  <text x="336" y="299" font-size="12" fill="#0891b2" font-style="italic">ℓ₂</text>
  <text x="260" y="316" font-size="11" fill="#0891b2" text-anchor="middle" font-weight="600">Parallel Lines</text>
  <text x="260" y="331" font-size="10" class="svg-muted" text-anchor="middle">Same plane, never meet</text>

  <!-- Skew lines 3D box -->
  <rect x="385" y="245" width="85" height="60" fill="none" class="svg-div" stroke-width="1"/>
  <line x1="385" y1="245" x2="400" y2="235" class="svg-div" stroke-width="1" style="fill:none"/>
  <line x1="470" y1="245" x2="485" y2="235" class="svg-div" stroke-width="1" style="fill:none"/>
  <line x1="400" y1="235" x2="485" y2="235" class="svg-div" stroke-width="1" style="fill:none"/>
  <line x1="485" y1="235" x2="485" y2="295" class="svg-div" stroke-width="1" stroke-dasharray="3,2" style="fill:none"/>
  <line x1="400" y1="235" x2="400" y2="245" class="svg-div" stroke-width="1" style="fill:none"/>
  <line x1="400" y1="235" x2="485" y2="235" stroke="#f43f5e" stroke-width="2.5" style="fill:none"/>
  <line x1="470" y1="245" x2="470" y2="305" stroke="#f97316" stroke-width="2.5" style="fill:none"/>
  <text x="438" y="228" font-size="11" fill="#f43f5e" text-anchor="middle" font-weight="700">m</text>
  <text x="478" y="278" font-size="11" fill="#f97316" font-weight="700">n</text>
  <text x="438" y="325" font-size="11" fill="#f43f5e" text-anchor="middle" font-weight="600">Skew Lines</text>
  <text x="438" y="340" font-size="10" class="svg-muted" text-anchor="middle">Not parallel, don't intersect</text>
  <text x="438" y="354" font-size="10" class="svg-muted" text-anchor="middle">Only possible in 3D</text>
</svg>
