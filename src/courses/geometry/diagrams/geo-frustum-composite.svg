<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="Georgia, serif">
  <style>
    .svg-bg    { fill: #fafaf8; }
    .svg-text  { fill: #1e3a5f; }
    .svg-sub   { fill: #374151; }
    .svg-muted { fill: #94a3b8; }
    .svg-panel { fill: #eff6ff; stroke: #1e3a5f; }
    .svg-proof { fill: #fff7ed; stroke: #b45309; }
    .svg-use   { fill: #f0fdf4; stroke: #166534; }
    .dark .svg-bg    { fill: #1e293b; }
    .dark .svg-text  { fill: #93c5fd; }
    .dark .svg-sub   { fill: #cbd5e1; }
    .dark .svg-muted { fill: #475569; }
    .dark .svg-panel { fill: #1e3a5f44; stroke: #93c5fd; }
    .dark .svg-proof { fill: #451a0322; stroke: #fbbf24; }
    .dark .svg-use   { fill: #14532d22; stroke: #4ade80; }
  </style>

  <rect width="720" height="380" class="svg-bg"/>

  <!-- ===== Frustum (left) ===== -->
  <text x="175" y="22" font-size="15" class="svg-text" font-weight="bold" text-anchor="middle">Cone Frustum</text>

  <!-- Full cone phantom (dashed apex) -->
  <line x1="175" y1="40" x2="80"  y2="230" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4" style="fill:none"/>
  <line x1="175" y1="40" x2="270" y2="230" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4" style="fill:none"/>
  <text x="175" y="36" font-size="11" class="svg-muted" text-anchor="middle">apex (removed)</text>

  <!-- Frustum body -->
  <!-- Top ellipse: cx=175,cy=100, rx=40,ry=10 -->
  <!-- Bottom ellipse: cx=175,cy=230,rx=90,ry=22 -->
  <ellipse cx="175" cy="100" rx="40" ry="10" fill="#1e3a5f22" stroke="#1e3a5f" stroke-width="2"/>
  <ellipse cx="175" cy="230" rx="90" ry="22" fill="#1e3a5f11" stroke="#1e3a5f" stroke-width="2"/>
  <line x1="135" y1="100" x2="85"  y2="230" stroke="#1e3a5f" stroke-width="2" style="fill:none"/>
  <line x1="215" y1="100" x2="265" y2="230" stroke="#1e3a5f" stroke-width="2" style="fill:none"/>
  <!-- Hidden back of top ellipse dashed -->
  <ellipse cx="175" cy="100" rx="40" ry="10" fill="none" stroke="#1e3a5f88" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Labels -->
  <text x="220" y="98"  font-size="13" fill="#dc2626"  font-weight="bold" font-style="italic">r</text>
  <line x1="175" y1="100" x2="215" y2="100" stroke="#dc2626" stroke-width="1.5" style="fill:none"/>
  <text x="268" y="232" font-size="13" fill="#166534"  font-weight="bold" font-style="italic">R</text>
  <line x1="175" y1="230" x2="265" y2="230" stroke="#166534" stroke-width="1.5" style="fill:none"/>
  <text x="278" y="168" font-size="13" fill="#b45309"  font-weight="bold" font-style="italic">l</text>
  <text x="290" y="182" font-size="11" class="svg-muted">(slant)</text>
  <!-- Height arrow -->
  <line x1="310" y1="100" x2="310" y2="230" stroke="#7c3aed" stroke-width="1.5" style="fill:none"/>
  <line x1="303" y1="100" x2="317" y2="100" stroke="#7c3aed" stroke-width="1.5" style="fill:none"/>
  <line x1="303" y1="230" x2="317" y2="230" stroke="#7c3aed" stroke-width="1.5" style="fill:none"/>
  <text x="318" y="170" font-size="13" fill="#7c3aed" font-weight="bold" font-style="italic">h</text>

  <!-- Slant height l -->
  <line x1="215" y1="100" x2="265" y2="230" stroke="#b45309" stroke-width="2" stroke-dasharray="5,3" style="fill:none"/>

  <!-- Formula box -->
  <rect x="20" y="260" width="330" height="108" rx="8" class="svg-proof" stroke-width="1.5"/>
  <text x="185" y="280" font-size="13" fill="#b45309" font-weight="bold" text-anchor="middle">Frustum Formulas</text>
  <text x="30" y="300" font-size="13" class="svg-sub">Volume: V = (πh/3)(R²+Rr+r²)</text>
  <text x="30" y="318" font-size="13" class="svg-sub">Slant: l = √(h²+(R−r)²)</text>
  <text x="30" y="336" font-size="13" class="svg-sub">Lateral SA = π(R+r)·l</text>
  <text x="30" y="354" font-size="13" class="svg-sub">Total SA = π(R+r)l + πR² + πr²</text>

  <!-- Divider -->
  <line x1="370" y1="30" x2="370" y2="375" stroke="#e2e8f0" stroke-width="1.5" style="fill:none"/>

  <!-- ===== Composite solid (right): cylinder + hemisphere ===== -->
  <text x="548" y="22" font-size="15" class="svg-text" font-weight="bold" text-anchor="middle">Composite Solid</text>
  <text x="548" y="40" font-size="13" class="svg-muted" text-anchor="middle">Cylinder + Hemisphere</text>

  <!-- Cylinder: cx=548,cy=210, r=80,ht=120 -->
  <ellipse cx="548" cy="330" rx="80" ry="18" fill="#1e3a5f11" stroke="#1e3a5f" stroke-width="2"/>
  <line x1="468" y1="210" x2="468" y2="330" stroke="#1e3a5f" stroke-width="2" style="fill:none"/>
  <line x1="628" y1="210" x2="628" y2="330" stroke="#1e3a5f" stroke-width="2" style="fill:none"/>
  <!-- Join line (shared face between cylinder top and hemisphere base) -->
  <ellipse cx="548" cy="210" rx="80" ry="18" fill="#1e3a5f22" stroke="#1e3a5f88" stroke-width="1.5" stroke-dasharray="4,3"/>
  <!-- Hemisphere (upper half of sphere): arc -->
  <path d="M 468 210 A 80 80 0 0 1 628 210" fill="#dc262614" stroke="#dc2626" stroke-width="2"/>
  <!-- Hemisphere top mark -->
  <circle cx="548" cy="130" r="5" fill="#dc2626"/>
  <text x="556" y="128" font-size="11" fill="#dc2626">top</text>

  <!-- Labels -->
  <line x1="548" y1="210" x2="628" y2="210" stroke="#166534" stroke-width="1.5" style="fill:none"/>
  <text x="590" y="205" font-size="13" fill="#166534" font-weight="bold" font-style="italic">r</text>
  <line x1="640" y1="210" x2="640" y2="330" stroke="#7c3aed" stroke-width="1.5" style="fill:none"/>
  <line x1="632" y1="210" x2="648" y2="210" stroke="#7c3aed" stroke-width="1.5" style="fill:none"/>
  <line x1="632" y1="330" x2="648" y2="330" stroke="#7c3aed" stroke-width="1.5" style="fill:none"/>
  <text x="650" y="275" font-size="13" fill="#7c3aed" font-weight="bold" font-style="italic">h</text>

  <!-- Composite formula box -->
  <rect x="375" y="258" width="335" height="108" rx="8" class="svg-use" stroke-width="1.5"/>
  <text x="542" y="278" font-size="13" fill="#166534" font-weight="bold" text-anchor="middle">Composite Volume</text>
  <text x="385" y="298" font-size="13" class="svg-sub">Volume = V_cylinder + V_hemisphere</text>
  <text x="385" y="316" font-size="13" class="svg-sub">       = πr²h + (2/3)πr³</text>
  <text x="385" y="334" font-size="13" class="svg-sub">       = πr²(h + 2r/3)</text>
  <text x="385" y="352" font-size="13" class="svg-sub">SA = curved cylinder + hemisphere + base</text>
  <text x="385" y="368" font-size="13" class="svg-sub">   = 2πrh + 2πr² + πr²</text>
</svg>
