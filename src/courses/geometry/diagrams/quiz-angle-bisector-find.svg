<svg viewBox="0 0 320 180" xmlns="http://www.w3.org/2000/svg" style="font-family: ui-sans-serif, system-ui, sans-serif; border-radius: 8px;">
  <style>
    .svg-bg    { fill: rgb(var(--tw-custom-slate-50)); }
    .svg-panel { fill: #ffffff; }
    .svg-text  { fill: rgb(var(--tw-custom-slate-800)); }
    .svg-muted { fill: rgb(var(--tw-custom-slate-500)); }
    .svg-div   { stroke: rgb(var(--tw-custom-slate-200)); fill: none; }
    .dark .svg-bg    { fill: rgb(var(--tw-custom-slate-900)); }
    .dark .svg-panel { fill: rgb(var(--tw-custom-slate-800)); }
    .dark .svg-text  { fill: rgb(var(--tw-custom-slate-200)); }
    .dark .svg-muted { fill: rgb(var(--tw-custom-slate-400)); }
    .dark .svg-div   { stroke: rgb(var(--tw-custom-slate-700)); }
  </style>
  <rect width="320" height="180" rx="8" class="svg-bg"/>

  <!-- Vertex V at (60, 130) -->
  <circle cx="60" cy="130" r="5" fill="#1e3a5f"/>
  <text x="44" y="134" font-size="13" fill="#1e3a5f" font-weight="700">V</text>

  <!-- Ray 1: V → (280, 40) upper -->
  <line x1="60" y1="130" x2="280" y2="40" stroke="#1e3a5f" stroke-width="2.2"/>
  <polygon points="280,40 266,50 269,58" fill="#1e3a5f"/>

  <!-- Ray 2: V → (280, 160) lower -->
  <line x1="60" y1="130" x2="280" y2="160" stroke="#1e3a5f" stroke-width="2.2"/>
  <polygon points="280,160 265,153 267,161" fill="#1e3a5f"/>

  <!-- Bisector VF (dashed green) -->
  <line x1="60" y1="130" x2="280" y2="100" stroke="#1a3a2a" stroke-width="2" stroke-dasharray="6,3"/>
  <polygon points="280,100 266,107 267,99" fill="#1a3a2a"/>

  <!-- Angle arcs -->
  <!-- Total arc: 84° total = from upper to lower, split into two 42° arcs by bisector -->
  <path d="M 140 79 A 84 84 0 0 1 153 158" fill="none" stroke="#1e3a5f" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5"/>
  <!-- Bisector splits it -->
  <path d="M 140 79 A 84 84 0 0 1 147 118" fill="none" stroke="#1a3a2a" stroke-width="2" opacity="0.8"/>
  <path d="M 147 118 A 84 84 0 0 1 153 158" fill="none" stroke="#1a3a2a" stroke-width="2" opacity="0.8"/>

  <!-- Total angle label -->
  <text x="172" y="102" font-size="13" fill="#1e3a5f" font-weight="700" text-anchor="middle">84°</text>

  <!-- Half-angle labels -->
  <text x="132" y="96" font-size="11" fill="#1a3a2a" font-weight="700">x</text>
  <text x="132" y="137" font-size="11" fill="#1a3a2a" font-weight="700">x</text>

  <!-- VF label -->
  <text x="290" y="100" font-size="11" fill="#1a3a2a" font-weight="700">bisector</text>

  <text x="160" y="174" font-size="10" class="svg-muted" text-anchor="middle">VF bisects ∠ = 84°. Find each half-angle x.</text>
</svg>
