<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="Georgia, serif">
  <style>
    .svg-bg    { fill: #fafaf8; }
    .svg-text  { fill: #1e3a5f; }
    .svg-sub   { fill: #374151; }
    .svg-muted { fill: #94a3b8; }
    .svg-panel { fill: #eff6ff; stroke: #1e3a5f; }
    .svg-proof { fill: #fff7ed; stroke: #b45309; }
    .svg-use   { fill: #f0fdf4; stroke: #166534; }
    .dark .svg-bg    { fill: #1e293b; }
    .dark .svg-text  { fill: #93c5fd; }
    .dark .svg-sub   { fill: #cbd5e1; }
    .dark .svg-muted { fill: #475569; }
    .dark .svg-panel { fill: #1e3a5f44; stroke: #93c5fd; }
    .dark .svg-proof { fill: #451a0322; stroke: #fbbf24; }
    .dark .svg-use   { fill: #14532d22; stroke: #4ade80; }
  </style>

  <rect width="720" height="380" class="svg-bg"/>

  <!-- Title -->
  <text x="360" y="28" font-size="17" class="svg-text" font-weight="bold" text-anchor="middle">Euler's Formula: V − E + F = 2</text>

  <!-- ===== Tetrahedron (left) ===== -->
  <text x="100" y="56" font-size="14" fill="#dc2626" font-weight="bold" text-anchor="middle">Tetrahedron</text>
  <!-- Vertices: front-bottom=(60,250), right-bottom=(170,280), left-back=(80,180), top=(130,100) -->
  <!-- Edges: 6 edges -->
  <!-- Visible faces -->
  <polygon points="60,250 170,280 130,100" fill="#dc262614" stroke="#dc2626" stroke-width="2"/>
  <polygon points="60,250 80,180 130,100" fill="#dc262620" stroke="#dc2626" stroke-width="1.5"/>
  <!-- Hidden edge dashed -->
  <line x1="80"  y1="180" x2="170" y2="280" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5,3" style="fill:none"/>
  <line x1="60"  y1="250" x2="170" y2="280" stroke="#dc2626" stroke-width="2" style="fill:none"/>
  <line x1="60"  y1="250" x2="80"  y2="180" stroke="#dc2626" stroke-width="2" style="fill:none"/>
  <line x1="60"  y1="250" x2="130" y2="100" stroke="#dc2626" stroke-width="2" style="fill:none"/>
  <line x1="80"  y1="180" x2="130" y2="100" stroke="#dc2626" stroke-width="2" style="fill:none"/>
  <line x1="170" y1="280" x2="130" y2="100" stroke="#dc2626" stroke-width="2" style="fill:none"/>
  <!-- Vertices -->
  <circle cx="60"  cy="250" r="5" fill="#dc2626"/>
  <circle cx="170" cy="280" r="5" fill="#dc2626"/>
  <circle cx="80"  cy="180" r="5" fill="#dc2626"/>
  <circle cx="130" cy="100" r="5" fill="#dc2626"/>
  <!-- Count box -->
  <rect x="20" y="305" width="175" height="60" rx="6" class="svg-proof" stroke-width="1"/>
  <text x="107" y="323" font-size="12" fill="#b45309" font-weight="bold" text-anchor="middle">V=4  E=6  F=4</text>
  <text x="107" y="340" font-size="14" fill="#dc2626" font-weight="bold" text-anchor="middle">4 − 6 + 4 = 2 ✓</text>
  <text x="107" y="357" font-size="11" class="svg-muted" text-anchor="middle">simplest convex solid</text>

  <!-- ===== Cube (center) ===== -->
  <text x="310" y="56" font-size="14" fill="#1e3a5f" font-weight="bold" text-anchor="middle">Cube</text>
  <!-- Front face: (230,160)(390,160)(390,280)(230,280) -->
  <polygon points="230,280 390,280 390,160 230,160" fill="#1e3a5f14" stroke="#1e3a5f" stroke-width="2"/>
  <!-- Top face: (230,160)(390,160)(415,135)(255,135) -->
  <polygon points="230,160 390,160 415,135 255,135" fill="#1e3a5f22" stroke="#1e3a5f" stroke-width="2"/>
  <!-- Right face: (390,160)(415,135)(415,255)(390,280) -->
  <polygon points="390,160 415,135 415,255 390,280" fill="#1e3a5f18" stroke="#1e3a5f" stroke-width="2"/>
  <!-- Hidden edges dashed -->
  <line x1="230" y1="280" x2="255" y2="255" stroke="#1e3a5f" stroke-width="1.5" stroke-dasharray="4,3" style="fill:none"/>
  <line x1="255" y1="255" x2="415" y2="255" stroke="#1e3a5f" stroke-width="1.5" stroke-dasharray="4,3" style="fill:none"/>
  <line x1="255" y1="255" x2="255" y2="135" stroke="#1e3a5f" stroke-width="1.5" stroke-dasharray="4,3" style="fill:none"/>
  <!-- Vertex dots -->
  [[230,280],[390,280],[390,160],[230,160],[415,255],[415,135],[255,135],[255,255]].forEach(([x,y])=>{});
  <circle cx="230" cy="280" r="4" fill="#1e3a5f"/>
  <circle cx="390" cy="280" r="4" fill="#1e3a5f"/>
  <circle cx="390" cy="160" r="4" fill="#1e3a5f"/>
  <circle cx="230" cy="160" r="4" fill="#1e3a5f"/>
  <circle cx="415" cy="255" r="4" fill="#1e3a5f"/>
  <circle cx="415" cy="135" r="4" fill="#1e3a5f"/>
  <circle cx="255" cy="135" r="4" fill="#1e3a5f"/>
  <circle cx="255" cy="255" r="4" fill="#1e3a5f" stroke-dasharray="none"/>
  <!-- Count box -->
  <rect x="218" y="305" width="215" height="60" rx="6" class="svg-proof" stroke-width="1"/>
  <text x="325" y="323" font-size="12" fill="#b45309" font-weight="bold" text-anchor="middle">V=8  E=12  F=6</text>
  <text x="325" y="340" font-size="14" class="svg-text" font-weight="bold" text-anchor="middle">8 − 12 + 6 = 2 ✓</text>
  <text x="325" y="357" font-size="11" class="svg-muted" text-anchor="middle">6 square faces</text>

  <!-- ===== Octahedron (right) ===== -->
  <text x="615" y="56" font-size="14" fill="#7c3aed" font-weight="bold" text-anchor="middle">Octahedron</text>
  <!-- 6 vertices: top=(615,90), bottom=(615,290), left=(540,190), right=(690,190), front=(575,210), back=(655,170) -->
  <!-- 8 triangular faces, 12 edges -->
  <polygon points="615,90 540,190 615,290" fill="#7c3aed14" stroke="#7c3aed" stroke-width="1.5"/>
  <polygon points="615,90 690,190 615,290" fill="#7c3aed20" stroke="#7c3aed" stroke-width="1.5"/>
  <polygon points="615,90 540,190 690,190" fill="#7c3aed18" stroke="#7c3aed" stroke-width="2"/>
  <line x1="540" y1="190" x2="615" y2="290" stroke="#7c3aed" stroke-width="1.5" style="fill:none"/>
  <line x1="690" y1="190" x2="615" y2="290" stroke="#7c3aed" stroke-width="1.5" style="fill:none"/>
  <line x1="540" y1="190" x2="690" y2="190" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4,3" style="fill:none"/>
  <!-- Vertices -->
  <circle cx="615" cy="90"  r="5" fill="#7c3aed"/>
  <circle cx="615" cy="290" r="5" fill="#7c3aed"/>
  <circle cx="540" cy="190" r="5" fill="#7c3aed"/>
  <circle cx="690" cy="190" r="5" fill="#7c3aed"/>
  <!-- Count box -->
  <rect x="530" y="305" width="180" height="60" rx="6" class="svg-proof" stroke-width="1"/>
  <text x="620" y="323" font-size="12" fill="#b45309" font-weight="bold" text-anchor="middle">V=6  E=12  F=8</text>
  <text x="620" y="340" font-size="14" fill="#7c3aed" font-weight="bold" text-anchor="middle">6 − 12 + 8 = 2 ✓</text>
  <text x="620" y="357" font-size="11" class="svg-muted" text-anchor="middle">dual of cube</text>

  <!-- Euler formula centre box -->
  <rect x="10" y="368" width="700" height="10" rx="5" class="svg-use" stroke-width="1"/>

  <!-- Formula band -->
  <rect x="200" y="60" width="320" height="80" rx="10" class="svg-panel" stroke-width="2"/>
  <text x="360" y="84"  font-size="13" class="svg-text" font-weight="bold" text-anchor="middle">Euler's Polyhedral Formula</text>
  <text x="360" y="108" font-size="22" fill="#7c3aed" font-weight="bold" text-anchor="middle">V  −  E  +  F  =  2</text>
  <text x="360" y="130" font-size="12" class="svg-muted" text-anchor="middle">Holds for all convex polyhedra</text>
</svg>
