<svg viewBox="0 0 320 170" xmlns="http://www.w3.org/2000/svg" style="font-family: ui-sans-serif, system-ui, sans-serif; border-radius: 8px;">
  <style>
    .svg-bg    { fill: rgb(var(--tw-custom-slate-50)); }
    .svg-panel { fill: #ffffff; }
    .svg-text  { fill: rgb(var(--tw-custom-slate-800)); }
    .svg-muted { fill: rgb(var(--tw-custom-slate-500)); }
    .svg-div   { stroke: rgb(var(--tw-custom-slate-200)); fill: none; }
    .dark .svg-bg    { fill: rgb(var(--tw-custom-slate-900)); }
    .dark .svg-panel { fill: rgb(var(--tw-custom-slate-800)); }
    .dark .svg-text  { fill: rgb(var(--tw-custom-slate-200)); }
    .dark .svg-muted { fill: rgb(var(--tw-custom-slate-400)); }
    .dark .svg-div   { stroke: rgb(var(--tw-custom-slate-700)); }
  </style>
  <rect width="320" height="170" rx="8" class="svg-bg"/>

  <!-- Axes -->
  <line x1="20" y1="90" x2="230" y2="90" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="115" y1="14" x2="115" y2="165" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="233" y="94" font-size="10" class="svg-muted">x</text>
  <text x="118" y="12" font-size="10" class="svg-muted">y</text>

  <!-- Grid ticks -->
  <text x="143" y="100" font-size="9" class="svg-muted">2</text>
  <text x="143" y="72" font-size="9" class="svg-muted">2</text>
  <text x="86" y="100" font-size="9" class="svg-muted">−2</text>

  <!-- Circle: center (-2, 2) in pixel = (115-40, 90-40)=(75,50), r=3 = 48px -->
  <circle cx="75" cy="50" r="48" fill="rgba(30,58,95,0.07)" stroke="#1e3a5f" stroke-width="2.2"/>

  <!-- Center point -->
  <circle cx="75" cy="50" r="4" fill="#dc2626"/>
  <text x="80" y="47" font-size="11" fill="#dc2626" font-weight="700">(−2, 2)</text>

  <!-- Radius -->
  <line x1="75" y1="50" x2="75" y2="2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="80" y="30" font-size="12" fill="#dc2626" font-weight="700">r = ?</text>

  <!-- Arrow showing r = 48px = 3 units -->
  <line x1="75" y1="50" x2="123" y2="50" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="95" y="44" font-size="10" fill="#dc2626">3</text>

  <!-- Equation to identify -->
  <rect x="240" y="30" width="72" height="100" rx="6" fill="rgba(30,58,95,0.06)" stroke="#1e3a5f" stroke-width="1.2"/>
  <text x="276" y="50" font-size="10" fill="#1e3a5f" font-weight="700" text-anchor="middle">Equation?</text>
  <text x="276" y="78" font-size="10" fill="#374151" text-anchor="middle">center</text>
  <text x="276" y="93" font-size="11" fill="#dc2626" font-weight="700" text-anchor="middle">(−2, 2)</text>
  <text x="276" y="110" font-size="10" fill="#374151" text-anchor="middle">radius = 3</text>

  <text x="160" y="158" font-size="10" class="svg-muted" text-anchor="middle">Write the standard-form equation for this circle.</text>
</svg>
