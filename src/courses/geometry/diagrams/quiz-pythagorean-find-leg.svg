<svg viewBox="0 0 300 180" xmlns="http://www.w3.org/2000/svg" style="font-family: ui-sans-serif, system-ui, sans-serif; border-radius: 8px;">
  <style>
    .svg-bg    { fill: rgb(var(--tw-custom-slate-50)); }
    .svg-panel { fill: #ffffff; }
    .svg-text  { fill: rgb(var(--tw-custom-slate-800)); }
    .svg-muted { fill: rgb(var(--tw-custom-slate-500)); }
    .svg-div   { stroke: rgb(var(--tw-custom-slate-200)); fill: none; }
    .dark .svg-bg    { fill: rgb(var(--tw-custom-slate-900)); }
    .dark .svg-panel { fill: rgb(var(--tw-custom-slate-800)); }
    .dark .svg-text  { fill: rgb(var(--tw-custom-slate-200)); }
    .dark .svg-muted { fill: rgb(var(--tw-custom-slate-400)); }
    .dark .svg-div   { stroke: rgb(var(--tw-custom-slate-700)); }
  </style>
  <rect width="300" height="180" rx="8" class="svg-bg"/>

  <!-- Right triangle: A(60,140), B(220,140), C(60,40) -->
  <polygon points="60,140 220,140 60,40" fill="rgba(59,130,246,0.07)" stroke="#1e3a5f" stroke-width="2"/>

  <!-- Right angle marker at A -->
  <rect x="60" y="124" width="16" height="16" fill="none" stroke="#1e3a5f" stroke-width="1.5"/>

  <!-- Vertex labels -->
  <text x="40" y="154" font-size="11" class="svg-text" font-weight="700">A</text>
  <text x="226" y="154" font-size="11" class="svg-text" font-weight="700">B</text>
  <text x="40" y="38" font-size="11" class="svg-text" font-weight="700">C</text>

  <!-- Leg labels -->
  <!-- AC (vertical leg): x (unknown) -->
  <text x="32" y="96" font-size="17" fill="#ef4444" font-weight="800" text-anchor="middle">x</text>
  <!-- AB (horizontal leg): 5 -->
  <text x="140" y="158" font-size="14" fill="#1e3a5f" font-weight="700" text-anchor="middle">5</text>
  <!-- BC (hypotenuse): 13 -->
  <text x="155" y="82" font-size="14" fill="#1e3a5f" font-weight="700" text-anchor="middle">13</text>

  <text x="150" y="172" font-size="9" class="svg-muted" text-anchor="middle">Find leg x. Right angle at A. Hypotenuse = 13.</text>
</svg>
