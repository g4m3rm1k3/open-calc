<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" font-family="Georgia, serif">
  <style>
    .svg-bg   { fill: rgb(var(--tw-custom-slate-50)); }
    .svg-text { fill: #1e3a5f; }
    .svg-sub  { fill: rgb(var(--tw-custom-slate-700)); }
    .svg-muted{ fill: rgb(var(--tw-custom-slate-400)); }
    .svg-rule { fill: #eff6ff; stroke: #1e3a5f; }
    .dark .svg-bg   { fill: rgb(var(--tw-custom-slate-800)); }
    .dark .svg-text { fill: #93c5fd; }
    .dark .svg-sub  { fill: rgb(var(--tw-custom-slate-300)); }
    .dark .svg-muted{ fill: rgb(var(--tw-custom-slate-600)); }
    .dark .svg-rule { fill: #1e3a5f44; stroke: #93c5fd; }
  </style>

  <rect width="720" height="280" class="svg-bg"/>

  <!-- Summary table of all 5 -->
  <text x="360" y="20" font-size="14" font-weight="bold" class="svg-sub" text-anchor="middle">The Five Platonic Solids — Key Facts</text>

  <!-- Table header -->
  <rect x="10" y="28" width="700" height="220" rx="8" class="svg-rule" stroke-width="1"/>
  <text x="70"  y="48" font-size="12" class="svg-text" font-weight="bold" text-anchor="middle">Name</text>
  <text x="200" y="48" font-size="12" class="svg-text" font-weight="bold" text-anchor="middle">Face</text>
  <text x="300" y="48" font-size="12" class="svg-text" font-weight="bold" text-anchor="middle">V</text>
  <text x="360" y="48" font-size="12" class="svg-text" font-weight="bold" text-anchor="middle">E</text>
  <text x="420" y="48" font-size="12" class="svg-text" font-weight="bold" text-anchor="middle">F</text>
  <text x="510" y="48" font-size="12" class="svg-text" font-weight="bold" text-anchor="middle">per vertex</text>
  <text x="640" y="48" font-size="12" class="svg-text" font-weight="bold" text-anchor="middle">Dual</text>
  <line x1="12" y1="54" x2="708" y2="54" stroke="#94a3b8" stroke-width="1" style="fill:none"/>

  <!-- Rows -->
  <!-- Tetrahedron -->
  <text x="70"  y="72" font-size="12" fill="#dc2626" text-anchor="middle">Tetrahedron</text>
  <text x="200" y="72" font-size="12" class="svg-sub" text-anchor="middle">△ (equil.)</text>
  <text x="300" y="72" font-size="12" class="svg-sub" text-anchor="middle">4</text>
  <text x="360" y="72" font-size="12" class="svg-sub" text-anchor="middle">6</text>
  <text x="420" y="72" font-size="12" class="svg-sub" text-anchor="middle">4</text>
  <text x="510" y="72" font-size="12" class="svg-sub" text-anchor="middle">3 triangles</text>
  <text x="640" y="72" font-size="12" fill="#dc2626" text-anchor="middle">itself</text>

  <text x="70"  y="95" font-size="12" class="svg-text" text-anchor="middle">Cube</text>
  <text x="200" y="95" font-size="12" class="svg-sub" text-anchor="middle">□ (square)</text>
  <text x="300" y="95" font-size="12" class="svg-sub" text-anchor="middle">8</text>
  <text x="360" y="95" font-size="12" class="svg-sub" text-anchor="middle">12</text>
  <text x="420" y="95" font-size="12" class="svg-sub" text-anchor="middle">6</text>
  <text x="510" y="95" font-size="12" class="svg-sub" text-anchor="middle">3 squares</text>
  <text x="640" y="95" font-size="12" fill="#166534" text-anchor="middle">Octahedron</text>

  <text x="70"  y="118" font-size="12" fill="#166534" text-anchor="middle">Octahedron</text>
  <text x="200" y="118" font-size="12" class="svg-sub" text-anchor="middle">△ (equil.)</text>
  <text x="300" y="118" font-size="12" class="svg-sub" text-anchor="middle">6</text>
  <text x="360" y="118" font-size="12" class="svg-sub" text-anchor="middle">12</text>
  <text x="420" y="118" font-size="12" class="svg-sub" text-anchor="middle">8</text>
  <text x="510" y="118" font-size="12" class="svg-sub" text-anchor="middle">4 triangles</text>
  <text x="640" y="118" font-size="12" class="svg-text" text-anchor="middle">Cube</text>

  <text x="70"  y="141" font-size="12" fill="#b45309" text-anchor="middle">Dodecahedron</text>
  <text x="200" y="141" font-size="12" class="svg-sub" text-anchor="middle">⬠ (pentagon)</text>
  <text x="300" y="141" font-size="12" class="svg-sub" text-anchor="middle">20</text>
  <text x="360" y="141" font-size="12" class="svg-sub" text-anchor="middle">30</text>
  <text x="420" y="141" font-size="12" class="svg-sub" text-anchor="middle">12</text>
  <text x="510" y="141" font-size="12" class="svg-sub" text-anchor="middle">3 pentagons</text>
  <text x="640" y="141" font-size="12" fill="#7c3aed" text-anchor="middle">Icosahedron</text>

  <text x="70"  y="164" font-size="12" fill="#7c3aed" text-anchor="middle">Icosahedron</text>
  <text x="200" y="164" font-size="12" class="svg-sub" text-anchor="middle">△ (equil.)</text>
  <text x="300" y="164" font-size="12" class="svg-sub" text-anchor="middle">12</text>
  <text x="360" y="164" font-size="12" class="svg-sub" text-anchor="middle">30</text>
  <text x="420" y="164" font-size="12" class="svg-sub" text-anchor="middle">20</text>
  <text x="510" y="164" font-size="12" class="svg-sub" text-anchor="middle">5 triangles</text>
  <text x="640" y="164" font-size="12" fill="#b45309" text-anchor="middle">Dodecahedron</text>

  <line x1="12" y1="172" x2="708" y2="172" stroke="#94a3b8" stroke-width="1" style="fill:none"/>
  <text x="360" y="192" font-size="12" class="svg-text" font-weight="bold" text-anchor="middle">All satisfy V − E + F = 2</text>
  <text x="360" y="210" font-size="12" class="svg-sub" text-anchor="middle">Dual: swap V and F — cube(8V,6F)↔octahedron(6V,8F); dodecahedron(20V,12F)↔icosahedron(12V,20F)</text>
  <text x="360" y="228" font-size="11" class="svg-muted" text-anchor="middle">Only 5 Platonic solids exist: proved by the angle-sum-at-vertex argument</text>

  <!-- Formula strip -->
  <rect x="10" y="252" width="700" height="22" rx="5" class="svg-rule" stroke-width="1"/>
  <text x="360" y="267" font-size="12" class="svg-text" text-anchor="middle">Platonic = all faces congruent regular polygons, same number meeting at every vertex</text>
</svg>
