<svg viewBox="0 0 540 200" xmlns="http://www.w3.org/2000/svg" style="font-family: ui-sans-serif, system-ui, sans-serif; border-radius: 10px;">
  <style>
    .svg-bg     { fill: rgb(var(--tw-custom-slate-50)); }
    .svg-panel  { fill: #ffffff; }
    .svg-text   { fill: rgb(var(--tw-custom-slate-800)); }
    .svg-muted  { fill: rgb(var(--tw-custom-slate-500)); }
    .svg-border { stroke: rgb(var(--tw-custom-slate-200)); fill: none; }
    .dark .svg-bg     { fill: rgb(var(--tw-custom-slate-900)); }
    .dark .svg-panel  { fill: rgb(var(--tw-custom-slate-800)); }
    .dark .svg-text   { fill: rgb(var(--tw-custom-slate-200)); }
    .dark .svg-muted  { fill: rgb(var(--tw-custom-slate-400)); }
    .dark .svg-border { stroke: rgb(var(--tw-custom-slate-700)); }
  </style>
  <rect width="540" height="200" rx="10" class="svg-bg"/>

  <!-- Panel 1: Acute -->
  <rect x="8" y="8" width="120" height="184" rx="8" class="svg-panel svg-border" stroke-width="1"/>
  <text x="68" y="26" font-size="11" fill="#6366f1" text-anchor="middle" font-weight="700">Acute</text>
  <text x="68" y="38" font-size="10" class="svg-muted" text-anchor="middle">0° &lt; θ &lt; 90°</text>
  <!-- Vertex at 68,130 -->
  <path d="M 28,130 L 108,130" stroke="#6366f1" stroke-width="1.5" fill="none" stroke-dasharray="4 2" opacity="0.4"/>
  <line x1="68" y1="130" x2="105" y2="130" stroke="#6366f1" stroke-width="2.5"/>
  <line x1="68" y1="130" x2="88" y2="75" stroke="#6366f1" stroke-width="2.5"/>
  <path d="M 88,130 A 20,20 0 0,0 78,103" fill="none" stroke="#6366f1" stroke-width="1.8"/>
  <circle cx="68" cy="130" r="3.5" fill="#6366f1"/>
  <text x="92" y="120" font-size="12" fill="#6366f1" font-weight="700">45°</text>
  <text x="68" y="178" font-size="10" class="svg-muted" text-anchor="middle">sharp corner</text>

  <!-- Panel 2: Right -->
  <rect x="136" y="8" width="120" height="184" rx="8" class="svg-panel svg-border" stroke-width="1"/>
  <text x="196" y="26" font-size="11" fill="#10b981" text-anchor="middle" font-weight="700">Right</text>
  <text x="196" y="38" font-size="10" class="svg-muted" text-anchor="middle">θ = 90°</text>
  <line x1="196" y1="130" x2="235" y2="130" stroke="#10b981" stroke-width="2.5"/>
  <line x1="196" y1="130" x2="196" y2="73" stroke="#10b981" stroke-width="2.5"/>
  <!-- Right angle square -->
  <rect x="196" y="114" width="16" height="16" class="svg-border" stroke="#10b981" stroke-width="1.8"/>
  <circle cx="196" cy="130" r="3.5" fill="#10b981"/>
  <text x="218" y="112" font-size="12" fill="#10b981" font-weight="700">90°</text>
  <text x="196" y="178" font-size="10" class="svg-muted" text-anchor="middle">perpendicular</text>

  <!-- Panel 3: Obtuse -->
  <rect x="264" y="8" width="120" height="184" rx="8" class="svg-panel svg-border" stroke-width="1"/>
  <text x="324" y="26" font-size="11" fill="#f97316" text-anchor="middle" font-weight="700">Obtuse</text>
  <text x="324" y="38" font-size="10" class="svg-muted" text-anchor="middle">90° &lt; θ &lt; 180°</text>
  <line x1="324" y1="130" x2="363" y2="130" stroke="#f97316" stroke-width="2.5"/>
  <line x1="324" y1="130" x2="288" y2="80" stroke="#f97316" stroke-width="2.5"/>
  <path d="M 364,130 A 40,40 0 0,0 294,97" fill="none" stroke="#f97316" stroke-width="1.8"/>
  <circle cx="324" cy="130" r="3.5" fill="#f97316"/>
  <text x="302" y="120" font-size="12" fill="#f97316" font-weight="700">130°</text>
  <text x="324" y="178" font-size="10" class="svg-muted" text-anchor="middle">wide angle</text>

  <!-- Panel 4: Straight -->
  <rect x="392" y="8" width="140" height="184" rx="8" class="svg-panel svg-border" stroke-width="1"/>
  <text x="462" y="26" font-size="11" fill="#ef4444" text-anchor="middle" font-weight="700">Straight</text>
  <text x="462" y="38" font-size="10" class="svg-muted" text-anchor="middle">θ = 180°</text>
  <line x1="404" y1="110" x2="522" y2="110" stroke="#ef4444" stroke-width="2.5"/>
  <!-- Arrow markers -->
  <polygon points="404,107 404,113 396,110" fill="#ef4444"/>
  <polygon points="522,107 522,113 530,110" fill="#ef4444"/>
  <circle cx="462" cy="110" r="3.5" fill="#ef4444"/>
  <text x="462" y="100" font-size="12" fill="#ef4444" font-weight="700" text-anchor="middle">180°</text>
  <text x="462" y="140" font-size="10" class="svg-muted" text-anchor="middle">= straight line</text>
  <text x="462" y="178" font-size="10" class="svg-muted" text-anchor="middle">the basis for all proofs</text>
</svg>
