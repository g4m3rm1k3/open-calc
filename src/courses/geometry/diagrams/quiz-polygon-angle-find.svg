<svg viewBox="0 0 320 160" xmlns="http://www.w3.org/2000/svg" style="font-family: ui-sans-serif, system-ui, sans-serif; border-radius: 8px;">
  <style>
    .svg-bg    { fill: rgb(var(--tw-custom-slate-50)); }
    .svg-panel { fill: #ffffff; }
    .svg-text  { fill: rgb(var(--tw-custom-slate-800)); }
    .svg-muted { fill: rgb(var(--tw-custom-slate-500)); }
    .svg-div   { stroke: rgb(var(--tw-custom-slate-200)); fill: none; }
    .dark .svg-bg    { fill: rgb(var(--tw-custom-slate-900)); }
    .dark .svg-panel { fill: rgb(var(--tw-custom-slate-800)); }
    .dark .svg-text  { fill: rgb(var(--tw-custom-slate-200)); }
    .dark .svg-muted { fill: rgb(var(--tw-custom-slate-400)); }
    .dark .svg-div   { stroke: rgb(var(--tw-custom-slate-700)); }
  </style>
  <rect width="320" height="160" rx="8" class="svg-bg"/>

  <!-- Pentagon with one unknown angle x, others labelled -->
  <!-- Pentagon vertices approx: top=160,24 upper-right=260,86 lower-right=220,150 lower-left=100,150 upper-left=60,86 -->
  <polygon points="160,24 260,86 220,148 100,148 60,86" fill="rgba(30,58,95,0.08)" stroke="#1e3a5f" stroke-width="2"/>

  <!-- Angle labels -->
  <text x="160" y="46" font-size="11" fill="#1e3a5f" font-weight="700" text-anchor="middle">100°</text>
  <text x="244" y="96" font-size="11" fill="#1e3a5f" font-weight="700" text-anchor="end">115°</text>
  <text x="220" y="142" font-size="11" fill="#1e3a5f" font-weight="700" text-anchor="middle">120°</text>
  <text x="100" y="142" font-size="11" fill="#1e3a5f" font-weight="700" text-anchor="middle">110°</text>
  <text x="76" y="96" font-size="13" fill="#dc2626" font-weight="700" text-anchor="start">x</text>

  <text x="160" y="155" font-size="10" class="svg-muted" text-anchor="middle">Find the missing interior angle x in this pentagon.</text>
</svg>
