<svg viewBox="0 0 520 300" xmlns="http://www.w3.org/2000/svg" style="font-family: ui-sans-serif, system-ui, sans-serif; border-radius: 10px;">
  <style>
    .svg-bg    { fill: rgb(var(--tw-custom-slate-50)); }
    .svg-panel { fill: #ffffff; }
    .svg-text  { fill: rgb(var(--tw-custom-slate-800)); }
    .svg-muted { fill: rgb(var(--tw-custom-slate-500)); }
    .svg-border { stroke: rgb(var(--tw-custom-slate-200)); fill: none; }
    .dark .svg-bg    { fill: rgb(var(--tw-custom-slate-900)); }
    .dark .svg-panel { fill: rgb(var(--tw-custom-slate-800)); }
    .dark .svg-text  { fill: rgb(var(--tw-custom-slate-200)); }
    .dark .svg-muted { fill: rgb(var(--tw-custom-slate-400)); }
    .dark .svg-border { stroke: rgb(var(--tw-custom-slate-700)); }
  </style>

  <!-- Background -->
  <rect width="520" height="300" rx="10" class="svg-bg"/>

  <!-- Undefined Terms box -->
  <rect x="30" y="200" width="180" height="72" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="120" y="226" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="middle">Undefined Terms</text>
  <text x="120" y="244" font-size="10" fill="#3b82f6" text-anchor="middle">point · line · plane</text>
  <text x="120" y="260" font-size="10" text-anchor="middle" class="svg-muted">Accepted intuitively</text>

  <!-- Postulates box -->
  <rect x="230" y="200" width="180" height="72" rx="10" fill="#f0fdf4" stroke="#10b981" stroke-width="2"/>
  <text x="320" y="226" font-size="12" font-weight="700" fill="#065f46" text-anchor="middle">Postulates</text>
  <text x="320" y="244" font-size="10" fill="#10b981" text-anchor="middle">5 axioms of Euclid</text>
  <text x="320" y="260" font-size="10" text-anchor="middle" class="svg-muted">Accepted without proof</text>

  <!-- Dashed arrows up from both to Definitions -->
  <line x1="120" y1="200" x2="200" y2="150" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 3"/>
  <line x1="320" y1="200" x2="280" y2="150" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 3"/>
  <polygon points="198,146 193,156 203,154" fill="#94a3b8"/>
  <polygon points="282,146 277,156 287,154" fill="#94a3b8"/>

  <!-- Definitions box -->
  <rect x="155" y="110" width="170" height="58" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="240" y="134" font-size="12" font-weight="700" fill="#92400e" text-anchor="middle">Definitions</text>
  <text x="240" y="152" font-size="10" fill="#b45309" text-anchor="middle">Built from prior concepts</text>

  <!-- Arrow up to Theorems -->
  <line x1="240" y1="110" x2="240" y2="78" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 3"/>
  <polygon points="237,74 243,74 240,66" fill="#94a3b8"/>

  <!-- Theorems box -->
  <rect x="130" y="22" width="220" height="54" rx="10" fill="#fdf4ff" stroke="#a855f7" stroke-width="2"/>
  <text x="240" y="46" font-size="13" font-weight="700" fill="#6b21a8" text-anchor="middle">Theorems</text>
  <text x="240" y="63" font-size="10" fill="#9333ea" text-anchor="middle">Proved by logic — all of geometry</text>

  <!-- Logic badge -->
  <rect x="420" y="110" width="80" height="58" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="460" y="136" font-size="11" font-weight="700" fill="#c2410c" text-anchor="middle">Logic</text>
  <text x="460" y="152" font-size="10" fill="#ea580c" text-anchor="middle">Deduction</text>
  <line x1="420" y1="139" x2="328" y2="139" stroke="#f97316" stroke-width="1.5" stroke-dasharray="4 2"/>
  <polygon points="332,136 323,139 332,142" fill="#f97316"/>

  <!-- Caption -->
  <text x="260" y="290" font-size="10" text-anchor="middle" font-style="italic" class="svg-muted">The Axiomatic Method: build everything from the smallest possible set of assumptions</text>
</svg>
