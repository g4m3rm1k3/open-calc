<svg viewBox="0 0 480 200" xmlns="http://www.w3.org/2000/svg" style="font-family: ui-sans-serif, system-ui, sans-serif; border-radius: 8px;">
  <style>
    .svg-bg    { fill: rgb(var(--tw-custom-slate-50)); }
    .svg-panel { fill: #ffffff; }
    .svg-text  { fill: rgb(var(--tw-custom-slate-800)); }
    .svg-muted { fill: rgb(var(--tw-custom-slate-500)); }
    .svg-div   { stroke: rgb(var(--tw-custom-slate-200)); fill: none; }
    .dark .svg-bg    { fill: rgb(var(--tw-custom-slate-900)); }
    .dark .svg-panel { fill: rgb(var(--tw-custom-slate-800)); }
    .dark .svg-text  { fill: rgb(var(--tw-custom-slate-200)); }
    .dark .svg-muted { fill: rgb(var(--tw-custom-slate-400)); }
    .dark .svg-div   { stroke: rgb(var(--tw-custom-slate-700)); }
  </style>
  <rect width="480" height="200" rx="8" class="svg-bg"/>
  <text x="240" y="16" font-size="10" class="svg-muted" text-anchor="middle" font-weight="600">All Polygon Areas Trace Back to A = b × h (Rectangle)</text>

  <!-- Rectangle -->
  <rect x="8" y="28" width="80" height="50" rx="3" fill="rgba(30,58,95,0.1)" stroke="#1e3a5f" stroke-width="1.8"/>
  <text x="48" y="58" font-size="10" fill="#1e3a5f" font-weight="700" text-anchor="middle">b × h</text>
  <text x="48" y="88" font-size="9" class="svg-muted" text-anchor="middle">Rectangle</text>
  <text x="48" y="100" font-size="10" fill="#1e3a5f" text-anchor="middle" font-weight="700">A = bh</text>

  <!-- Arrow -->
  <text x="100" y="58" font-size="14" fill="#94a3b8">→</text>

  <!-- Parallelogram (shear of rectangle) -->
  <polygon points="118,78 200,78 190,28 108,28" fill="rgba(30,58,95,0.1)" stroke="#1e3a5f" stroke-width="1.8"/>
  <!-- Height line -->
  <line x1="118" y1="28" x2="118" y2="78" stroke="#dc2626" stroke-width="1.3" stroke-dasharray="4,2"/>
  <text x="108" y="56" font-size="9" fill="#dc2626">h</text>
  <text x="154" y="72" font-size="9" fill="#64748b">b (base)</text>
  <text x="154" y="90" font-size="9" class="svg-muted" text-anchor="middle">Parallelogram</text>
  <text x="154" y="102" font-size="10" fill="#1e3a5f" text-anchor="middle" font-weight="700">A = bh</text>
  <text x="120" y="12" font-size="8" fill="#dc2626" text-anchor="middle">← cut here</text>
  <text x="200" y="12" font-size="8" fill="#dc2626" text-anchor="middle">→ paste here</text>

  <!-- Arrow -->
  <text x="210" y="58" font-size="14" fill="#94a3b8">→</text>

  <!-- Triangle (half parallelogram) -->
  <polygon points="225,78 305,78 305,28" fill="rgba(30,58,95,0.1)" stroke="#1e3a5f" stroke-width="1.8"/>
  <!-- Mirror triangle dashed -->
  <polygon points="225,28 225,78 305,28" fill="none" stroke="#1e3a5f" stroke-width="1.2" stroke-dasharray="4,2" opacity="0.5"/>
  <!-- Height -->
  <line x1="305" y1="28" x2="305" y2="78" stroke="#dc2626" stroke-width="1.3" stroke-dasharray="4,2"/>
  <text x="310" y="56" font-size="9" fill="#dc2626">h</text>
  <text x="265" y="86" font-size="9" fill="#64748b">b</text>
  <text x="265" y="98" font-size="9" class="svg-muted" text-anchor="middle">Triangle</text>
  <text x="265" y="110" font-size="10" fill="#1e3a5f" text-anchor="middle" font-weight="700">A = ½bh</text>

  <!-- Arrow -->
  <text x="315" y="58" font-size="14" fill="#94a3b8">→</text>

  <!-- Circle (limit of regular polygon) -->
  <circle cx="377" cy="53" r="30" fill="rgba(30,58,95,0.1)" stroke="#1e3a5f" stroke-width="1.8"/>
  <!-- Radius line -->
  <line x1="377" y1="53" x2="407" y2="53" stroke="#dc2626" stroke-width="1.5"/>
  <text x="392" y="48" font-size="10" fill="#dc2626">r</text>
  <!-- Apothem label -->
  <text x="377" y="100" font-size="9" class="svg-muted" text-anchor="middle">Circle (n→∞)</text>
  <text x="377" y="112" font-size="10" fill="#1e3a5f" text-anchor="middle" font-weight="700">A = πr²</text>
  <text x="377" y="125" font-size="8" fill="#94a3b8" text-anchor="middle">= ½ · 2πr · r</text>

  <!-- Bottom: Trapezoid -->
  <polygon points="26,155 110,155 90,135 46,135" fill="rgba(26,58,42,0.1)" stroke="#1a3a2a" stroke-width="1.8"/>
  <text x="20" y="147" font-size="9" fill="#1a3a2a">a</text>
  <text x="68" y="130" font-size="9" fill="#1a3a2a" text-anchor="middle">b</text>
  <line x1="46" y1="135" x2="46" y2="155" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="3,2"/>
  <text x="36" y="148" font-size="9" fill="#dc2626">h</text>
  <text x="68" y="170" font-size="9" class="svg-muted" text-anchor="middle">Trapezoid</text>
  <text x="68" y="182" font-size="10" fill="#1a3a2a" text-anchor="middle" font-weight="700">A = ½(a+b)h</text>

  <!-- Sector -->
  <path d="M 220 175 L 220 130 A 45 45 0 0 1 262 158 Z" fill="rgba(124,58,237,0.1)" stroke="#7c3aed" stroke-width="1.8"/>
  <text x="237" y="152" font-size="10" fill="#7c3aed">θ</text>
  <text x="224" y="148" font-size="9" fill="#dc2626">r</text>
  <text x="238" y="185" font-size="9" class="svg-muted" text-anchor="middle">Sector (θ in rad)</text>
  <text x="238" y="197" font-size="10" fill="#7c3aed" text-anchor="middle" font-weight="700">A = ½r²θ</text>

  <!-- Heron's -->
  <rect x="330" y="128" width="140" height="60" rx="6" fill="rgba(30,58,95,0.06)" stroke="#1e3a5f" stroke-width="1.2"/>
  <text x="400" y="147" font-size="10" fill="#1e3a5f" font-weight="700" text-anchor="middle">Heron's Formula</text>
  <text x="400" y="163" font-size="10" fill="#374151" text-anchor="middle">s = (a+b+c)/2</text>
  <text x="400" y="178" font-size="10" fill="#374151" text-anchor="middle">A = √(s(s−a)(s−b)(s−c))</text>
</svg>
