<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="Georgia, serif">
  <style>
    .svg-bg   { fill: rgb(var(--tw-custom-slate-50)); }
    .svg-text { fill: #1e3a5f; }
    .svg-sub  { fill: rgb(var(--tw-custom-slate-700)); }
    .svg-muted{ fill: rgb(var(--tw-custom-slate-400)); }
    .svg-rule { fill: #eff6ff; stroke: #1e3a5f; }
    .dark .svg-bg   { fill: rgb(var(--tw-custom-slate-800)); }
    .dark .svg-text { fill: #93c5fd; }
    .dark .svg-sub  { fill: rgb(var(--tw-custom-slate-300)); }
    .dark .svg-muted{ fill: rgb(var(--tw-custom-slate-600)); }
    .dark .svg-rule { fill: #1e3a5f44; stroke: #93c5fd; }
  </style>

  <rect width="720" height="320" class="svg-bg"/>

  <!-- Triangle 1: 3-4-5, angle θ at A -->
  <text x="140" y="24" font-size="14" font-weight="bold" class="svg-sub" text-anchor="middle">Triangle 1</text>
  <line x1="60"  y1="260" x2="220" y2="260" stroke="#166534" stroke-width="2.5" style="fill:none"/>
  <line x1="220" y1="260" x2="220" y2="100" stroke="#dc2626" stroke-width="2.5" style="fill:none"/>
  <line x1="60"  y1="260" x2="220" y2="100" stroke="#1e3a5f" stroke-width="2.5" style="fill:none"/>
  <rect x="200" y="240" width="20" height="20" fill="none" stroke="#374151" stroke-width="1.8" class="svg-sub" style="fill:none"/>
  <text x="140" y="278" font-size="15" fill="#166534" font-weight="bold" text-anchor="middle">4</text>
  <text x="232" y="185" font-size="15" fill="#dc2626" font-weight="bold">3</text>
  <text x="122" y="163" font-size="15" font-weight="bold" class="svg-text">5</text>
  <path d="M 105 260 A 45 45 0 0 0 78 226" fill="none" stroke="#7c3aed" stroke-width="2"/>
  <text x="118" y="253" font-size="14" fill="#7c3aed" font-style="italic">θ</text>
  <text x="44"  y="272" font-size="13" class="svg-sub">A</text>
  <text x="225" y="272" font-size="13" class="svg-sub">B</text>
  <text x="225" y="97"  font-size="13" class="svg-sub">C</text>

  <!-- Dividers -->
  <line x1="260" y1="20" x2="260" y2="290" stroke="#e2e8f0" stroke-width="1.5" style="fill:none"/>
  <line x1="500" y1="20" x2="500" y2="290" stroke="#e2e8f0" stroke-width="1.5" style="fill:none"/>

  <!-- Triangle 2: angle=40°, adj=10, find opp=x -->
  <text x="390" y="24" font-size="14" font-weight="bold" class="svg-sub" text-anchor="middle">Triangle 2</text>
  <line x1="290" y1="260" x2="490" y2="260" stroke="#166534" stroke-width="2.5" style="fill:none"/>
  <line x1="490" y1="260" x2="490" y2="80"  stroke="#dc2626" stroke-width="2.5" style="fill:none"/>
  <line x1="290" y1="260" x2="490" y2="80"  stroke="#1e3a5f" stroke-width="2.5" style="fill:none"/>
  <rect x="470" y="240" width="20" height="20" fill="none" stroke="#374151" stroke-width="1.8" class="svg-sub" style="fill:none"/>
  <text x="390" y="278" font-size="15" fill="#166534" font-weight="bold" text-anchor="middle">10</text>
  <text x="500" y="175" font-size="15" fill="#dc2626" font-weight="bold">x</text>
  <path d="M 335 260 A 45 45 0 0 0 308 226" fill="none" stroke="#7c3aed" stroke-width="2"/>
  <text x="344" y="251" font-size="14" fill="#7c3aed">40°</text>

  <!-- Triangle 3: find angle, opp=7, hyp=12 -->
  <text x="620" y="24" font-size="14" font-weight="bold" class="svg-sub" text-anchor="middle">Triangle 3</text>
  <line x1="520" y1="260" x2="700" y2="260" stroke="#166534" stroke-width="2.5" style="fill:none"/>
  <line x1="700" y1="260" x2="700" y2="100" stroke="#dc2626" stroke-width="2.5" style="fill:none"/>
  <line x1="520" y1="260" x2="700" y2="100" stroke="#1e3a5f" stroke-width="2.5" style="fill:none"/>
  <rect x="680" y="240" width="20" height="20" fill="none" stroke="#374151" stroke-width="1.8" class="svg-sub" style="fill:none"/>
  <text x="700" y="185" font-size="15" fill="#dc2626" font-weight="bold">7</text>
  <text x="594" y="163" font-size="15" font-weight="bold" class="svg-text">12</text>
  <path d="M 566 260 A 36 36 0 0 0 543 236" fill="none" stroke="#7c3aed" stroke-width="2"/>
  <text x="572" y="252" font-size="14" fill="#7c3aed">θ=?</text>

  <!-- Key reminder strip -->
  <rect x="10" y="293" width="700" height="24" rx="5" class="svg-rule" stroke-width="1"/>
  <text x="360" y="309" font-size="12" class="svg-text" text-anchor="middle">sin θ = opp/hyp · cos θ = adj/hyp · tan θ = opp/adj · To find θ: use sin⁻¹, cos⁻¹, or tan⁻¹</text>
</svg>
