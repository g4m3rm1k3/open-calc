<svg viewBox="0 0 340 140" xmlns="http://www.w3.org/2000/svg" style="font-family: ui-sans-serif, system-ui, sans-serif; border-radius: 8px;">
  <style>
    .svg-bg    { fill: #f8fafc; }
    .svg-panel { fill: #ffffff; }
    .svg-text  { fill: #1e293b; }
    .svg-muted { fill: #64748b; }
    .svg-div   { stroke: #e2e8f0; fill: none; }
    .dark .svg-bg    { fill: #0f172a; }
    .dark .svg-panel { fill: #1e293b; }
    .dark .svg-text  { fill: #e2e8f0; }
    .dark .svg-muted { fill: #94a3b8; }
    .dark .svg-div   { stroke: #334155; }
  </style>
  <rect width="340" height="140" rx="8" class="svg-bg"/>

  <!-- Segment AB -->
  <line x1="30" y1="78" x2="310" y2="78" stroke="#1e3a5f" stroke-width="2.5"/>
  <circle cx="30" cy="78" r="4.5" fill="#1e3a5f"/>
  <circle cx="310" cy="78" r="4.5" fill="#1e3a5f"/>
  <text x="28" y="96" font-size="12" fill="#1e3a5f" font-weight="700" text-anchor="middle">A</text>
  <text x="312" y="96" font-size="12" fill="#1e3a5f" font-weight="700">B</text>

  <!-- Midpoint M with bisector -->
  <circle cx="170" cy="78" r="4" fill="#dc2626"/>
  <text x="170" y="97" font-size="11" fill="#dc2626" font-weight="700" text-anchor="middle">M</text>
  <line x1="170" y1="20" x2="170" y2="120" stroke="#1a3a2a" stroke-width="1.8" stroke-dasharray="5,3"/>
  <!-- Right angle marker -->
  <rect x="170" y="66" width="12" height="12" fill="none" stroke="#dc2626" stroke-width="1.5"/>

  <!-- Expressions on AM and MB -->
  <text x="100" y="66" font-size="12" fill="#1e3a5f" font-weight="700" text-anchor="middle">3x + 1</text>
  <text x="240" y="66" font-size="12" fill="#1e3a5f" font-weight="700" text-anchor="middle">5x − 7</text>

  <!-- Arcs (faint) -->
  <path d="M 30 40 A 95 95 0 0 1 30 116" fill="none" stroke="#1e3a5f" stroke-width="1.2" stroke-dasharray="4,3" opacity="0.35"/>
  <path d="M 310 40 A 95 95 0 0 0 310 116" fill="none" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4,3" opacity="0.35"/>

  <text x="170" y="133" font-size="10" class="svg-muted" text-anchor="middle">M is the midpoint of AB. Find x and AB.</text>
</svg>
