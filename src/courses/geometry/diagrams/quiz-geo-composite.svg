<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" font-family="Georgia, serif">
  <style>
    .svg-bg   { fill: #fafaf8; }
    .svg-text { fill: #1e3a5f; }
    .svg-sub  { fill: #374151; }
    .svg-muted{ fill: #94a3b8; }
    .svg-rule { fill: #eff6ff; stroke: #1e3a5f; }
    .dark .svg-bg   { fill: #1e293b; }
    .dark .svg-text { fill: #93c5fd; }
    .dark .svg-sub  { fill: #cbd5e1; }
    .dark .svg-muted{ fill: #475569; }
    .dark .svg-rule { fill: #1e3a5f44; stroke: #93c5fd; }
  </style>

  <rect width="720" height="280" class="svg-bg"/>

  <!-- Left: T-shape and cut-out figures -->
  <text x="178" y="18" font-size="13" font-weight="bold" class="svg-sub" text-anchor="middle">Q1–Q5: Find the area</text>

  <!-- T-shape -->
  <polygon points="20,40 200,40 200,90 130,90 130,200 90,200 90,90 20,90" fill="#eff6ff" stroke="#1e3a5f" stroke-width="2"/>
  <line x1="20" y1="90" x2="90" y2="90" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4,3" style="fill:none"/>
  <line x1="130" y1="90" x2="200" y2="90" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4,3" style="fill:none"/>
  <text x="110" y="68" font-size="11" class="svg-text" text-anchor="middle">180×50</text>
  <text x="56" y="150" font-size="11" class="svg-text" text-anchor="middle">40×110</text>
  <text x="110" y="215" font-size="11" class="svg-sub" text-anchor="middle">T-shape: Area = ?</text>

  <!-- Rectangle with triangle on top -->
  <rect x="220" y="100" width="100" height="80" fill="#f0fdf4" stroke="#166534" stroke-width="2"/>
  <polygon points="270,38 220,100 320,100" fill="#f0fdf4" stroke="#166534" stroke-width="2"/>
  <text x="270" y="148" font-size="11" fill="#166534" text-anchor="middle">100×80</text>
  <text x="270" y="68" font-size="11" fill="#166534" text-anchor="middle">base=100</text>
  <text x="326" y="68" font-size="11" fill="#166534">h=62</text>
  <text x="270" y="198" font-size="11" class="svg-sub" text-anchor="middle">House: Area=?</text>

  <!-- Divider -->
  <line x1="360" y1="10" x2="360" y2="268" stroke="#e2e8f0" stroke-width="1.5" style="fill:none"/>

  <!-- Right: subtraction and perimeter problems -->
  <text x="540" y="18" font-size="13" font-weight="bold" class="svg-sub" text-anchor="middle">Q6–Q10: Subtract and perimeter</text>

  <!-- Large rectangle with circular hole -->
  <rect x="375" y="40" width="180" height="120" fill="#fff7ed" stroke="#b45309" stroke-width="2"/>
  <circle cx="465" cy="100" r="40" fill="#fafaf8" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="5,3"/>
  <text x="465" y="178" font-size="11" class="svg-sub" text-anchor="middle">180×120 rect, r=40 hole</text>
  <text x="465" y="192" font-size="11" class="svg-sub" text-anchor="middle">Shaded area = ?</text>

  <!-- Perimeter question: stadium shape outline -->
  <rect x="410" y="215" width="120" height="48" fill="none" stroke="#7c3aed" stroke-width="2"/>
  <path d="M 410 215 A 24 24 0 0 0 410 263" fill="none" stroke="#7c3aed" stroke-width="2"/>
  <path d="M 530 215 A 24 24 0 0 1 530 263" fill="none" stroke="#7c3aed" stroke-width="2"/>
  <text x="470" y="237" font-size="10" fill="#7c3aed" text-anchor="middle">rect 120×48</text>
  <text x="470" y="250" font-size="10" fill="#7c3aed" text-anchor="middle">r=24 semicircles</text>
  <text x="470" y="272" font-size="11" class="svg-sub" text-anchor="middle">Perimeter = ?</text>

  <!-- Formula strip -->
  <rect x="10" y="252" width="340" height="22" rx="4" class="svg-rule" stroke-width="1"/>
  <text x="185" y="267" font-size="11" class="svg-text" text-anchor="middle">Composite: ΣA (add) − ΣA (subtract); perimeter = outer boundary only</text>
</svg>
