<svg viewBox="0 0 320 160" xmlns="http://www.w3.org/2000/svg" style="font-family: ui-sans-serif, system-ui, sans-serif; border-radius: 8px;">
  <style>
    .svg-bg    { fill: rgb(var(--tw-custom-slate-50)); }
    .svg-panel { fill: #ffffff; }
    .svg-text  { fill: rgb(var(--tw-custom-slate-800)); }
    .svg-muted { fill: rgb(var(--tw-custom-slate-500)); }
    .svg-div   { stroke: rgb(var(--tw-custom-slate-200)); fill: none; }
    .dark .svg-bg    { fill: rgb(var(--tw-custom-slate-900)); }
    .dark .svg-panel { fill: rgb(var(--tw-custom-slate-800)); }
    .dark .svg-text  { fill: rgb(var(--tw-custom-slate-200)); }
    .dark .svg-muted { fill: rgb(var(--tw-custom-slate-400)); }
    .dark .svg-div   { stroke: rgb(var(--tw-custom-slate-700)); }
  </style>
  <rect width="320" height="160" rx="8" class="svg-bg"/>

  <!-- Triangle: A(60,125), B(210,125), C(130,40) -->
  <polygon points="60,125 210,125 130,40" fill="rgba(59,130,246,0.07)" stroke="#1e3a5f" stroke-width="2"/>

  <!-- Extend side AB past B to D(280,125) -->
  <line x1="210" y1="125" x2="280" y2="125" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="278" y="120" font-size="10" class="svg-muted">D</text>

  <!-- Vertex labels -->
  <text x="46" y="138" font-size="11" class="svg-text" font-weight="700">A</text>
  <text x="213" y="138" font-size="11" class="svg-text" font-weight="700">B</text>
  <text x="124" y="30" font-size="11" class="svg-text" font-weight="700">C</text>

  <!-- Angle at A: 48° -->
  <path d="M 82 125 A 22 22 0 0 1 72 106" fill="rgba(30,58,95,0.12)" stroke="#1e3a5f" stroke-width="1.5"/>
  <text x="88" y="115" font-size="11" fill="#1e3a5f" font-weight="700">48°</text>

  <!-- Angle at C: 73° -->
  <path d="M 119 57 A 18 18 0 0 1 142 57" fill="rgba(30,58,95,0.12)" stroke="#1e3a5f" stroke-width="1.5"/>
  <text x="130" y="78" font-size="11" fill="#1e3a5f" font-weight="700" text-anchor="middle">73°</text>

  <!-- Exterior angle at B (∠CBD = x) -->
  <path d="M 210 103 A 22 22 0 0 1 232 125" fill="rgba(239,68,68,0.12)" stroke="#ef4444" stroke-width="1.8"/>
  <text x="248" y="112" font-size="15" fill="#ef4444" font-weight="800" text-anchor="middle">x</text>

  <text x="160" y="152" font-size="9" class="svg-muted" text-anchor="middle">Find exterior angle x at B.</text>
</svg>
