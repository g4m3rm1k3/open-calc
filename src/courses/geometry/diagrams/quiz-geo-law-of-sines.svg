<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="Georgia, serif">
  <style>
    .svg-bg   { fill: #fafaf8; }
    .svg-text { fill: #1e3a5f; }
    .svg-sub  { fill: #374151; }
    .svg-muted{ fill: #94a3b8; }
    .svg-rule { fill: #eff6ff; stroke: #1e3a5f; }
    .dark .svg-bg   { fill: #1e293b; }
    .dark .svg-text { fill: #93c5fd; }
    .dark .svg-sub  { fill: #cbd5e1; }
    .dark .svg-muted{ fill: #475569; }
    .dark .svg-rule { fill: #1e3a5f44; stroke: #93c5fd; }
  </style>

  <rect width="720" height="320" class="svg-bg"/>

  <!-- AAS triangle: A=50°, B=70°, a=8, find b -->
  <text x="165" y="22" font-size="14" font-weight="bold" class="svg-sub" text-anchor="middle">Q1–Q4: AAS triangle</text>
  <line x1="40"  y1="270" x2="290" y2="270" stroke="#166534" stroke-width="2.5" style="fill:none"/>
  <line x1="40"  y1="270" x2="190" y2="80"  stroke="#1e3a5f" stroke-width="2.5" style="fill:none"/>
  <line x1="290" y1="270" x2="190" y2="80"  stroke="#dc2626" stroke-width="2.5" style="fill:none"/>
  <path d="M 88 270 A 48 48 0 0 0 63 236" fill="none" stroke="#dc2626" stroke-width="2"/>
  <text x="92"  y="258" font-size="13" fill="#dc2626">50°</text>
  <text x="30"  y="283" font-size="12" class="svg-sub">A</text>
  <path d="M 242 270 A 48 48 0 0 1 266 235" fill="none" stroke="#1e3a5f" stroke-width="2"/>
  <text x="210" y="258" font-size="13" class="svg-text">70°</text>
  <text x="293" y="283" font-size="12" class="svg-sub">B</text>
  <text x="184" y="72"  font-size="12" class="svg-sub">C</text>
  <text x="238" y="190" font-size="14" fill="#dc2626" font-weight="bold" font-style="italic">a = 8</text>
  <text x="96"  y="188" font-size="14" font-weight="bold" font-style="italic" class="svg-text">b = ?</text>
  <text x="155" y="292" font-size="13" fill="#166534" font-style="italic">c</text>

  <!-- Divider -->
  <line x1="365" y1="20" x2="365" y2="305" stroke="#e2e8f0" stroke-width="1.5" style="fill:none"/>

  <!-- SSA ambiguous case: A=30°, a=6, b=10 -->
  <text x="545" y="22" font-size="14" fill="#dc2626" font-weight="bold" text-anchor="middle">Q5–Q7: SSA (ambiguous case)</text>

  <!-- Base horizontal reference -->
  <line x1="385" y1="265" x2="710" y2="265" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3" style="fill:none"/>

  <!-- Point A -->
  <circle cx="390" cy="265" r="4" fill="#374151" class="svg-sub" style="stroke:none"/>
  <text x="376" y="280" font-size="12" class="svg-sub">A</text>
  <path d="M 438 265 A 48 48 0 0 0 431 228" fill="none" stroke="#374151" stroke-width="1.8"/>
  <text x="443" y="253" font-size="12" class="svg-sub">30°</text>

  <!-- Triangle 1 (acute B1) -->
  <line x1="390" y1="265" x2="570" y2="105" stroke="#1e3a5f" stroke-width="2.5" style="fill:none"/>
  <line x1="570" y1="105" x2="640" y2="265" stroke="#dc2626" stroke-width="2.5" style="fill:none"/>
  <line x1="390" y1="265" x2="640" y2="265" stroke="#166534" stroke-width="1.5" stroke-dasharray="4,3" style="fill:none"/>

  <!-- Triangle 2 (obtuse B2, dashed) -->
  <line x1="390" y1="265" x2="490" y2="105" stroke="#1e3a5f"  stroke-width="1.8" stroke-dasharray="6,3" style="fill:none" opacity="0.65"/>
  <line x1="490" y1="105" x2="640" y2="265" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="6,3" style="fill:none" opacity="0.65"/>

  <!-- Labels -->
  <text x="398" y="198" font-size="13" font-weight="bold" class="svg-text">b=10</text>
  <text x="614" y="202" font-size="13" fill="#dc2626" font-weight="bold">a=6</text>
  <text x="566" y="99"  font-size="11" class="svg-text">B₁ (~56°)</text>
  <text x="478" y="99"  font-size="11" class="svg-muted" opacity="0.85">B₂ (~124°)</text>

  <!-- Formula strip -->
  <rect x="10" y="290" width="700" height="26" rx="5" class="svg-rule" stroke-width="1"/>
  <text x="360" y="307" font-size="12" class="svg-text" text-anchor="middle">a/sin A = b/sin B = c/sin C  ·  SSA: sin B = b·sinA/a — may give 1 or 2 solutions</text>
</svg>
