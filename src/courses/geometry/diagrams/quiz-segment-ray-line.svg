<svg viewBox="0 0 340 160" xmlns="http://www.w3.org/2000/svg" style="font-family: ui-sans-serif, system-ui, sans-serif; border-radius: 8px;">
  <style>
    .svg-bg    { fill: rgb(var(--tw-custom-slate-50)); }
    .svg-panel { fill: #ffffff; }
    .svg-text  { fill: rgb(var(--tw-custom-slate-800)); }
    .svg-muted { fill: rgb(var(--tw-custom-slate-500)); }
    .svg-div   { stroke: rgb(var(--tw-custom-slate-200)); fill: none; }
    .dark .svg-bg    { fill: rgb(var(--tw-custom-slate-900)); }
    .dark .svg-panel { fill: rgb(var(--tw-custom-slate-800)); }
    .dark .svg-text  { fill: rgb(var(--tw-custom-slate-200)); }
    .dark .svg-muted { fill: rgb(var(--tw-custom-slate-400)); }
    .dark .svg-div   { stroke: rgb(var(--tw-custom-slate-700)); }
  </style>
  <rect width="340" height="160" rx="8" class="svg-bg"/>
  <text x="170" y="18" font-size="10" class="svg-muted" text-anchor="middle" font-weight="600">Which is a segment, which is a ray, which is a line?</text>

  <!-- Object A: segment (two endpoints) -->
  <text x="25" y="42" font-size="11" class="svg-text" font-weight="700">A</text>
  <circle cx="60" cy="55" r="4" fill="#1e3a5f"/>
  <line x1="60" y1="55" x2="200" y2="55" stroke="#1e3a5f" stroke-width="2.5"/>
  <circle cx="200" cy="55" r="4" fill="#1e3a5f"/>
  <text x="60" y="45" font-size="10" fill="#1e3a5f" text-anchor="middle">A</text>
  <text x="200" y="45" font-size="10" fill="#1e3a5f" text-anchor="middle">B</text>

  <!-- Object B: ray (one endpoint, one arrow) -->
  <text x="25" y="88" font-size="11" class="svg-text" font-weight="700">B</text>
  <circle cx="60" cy="100" r="4" fill="#7c3aed"/>
  <line x1="60" y1="100" x2="290" y2="100" stroke="#7c3aed" stroke-width="2.5"/>
  <!-- Arrow head -->
  <polygon points="290,100 278,94 278,106" fill="#7c3aed"/>
  <text x="60" y="90" font-size="10" fill="#7c3aed" text-anchor="middle">C</text>
  <text x="160" y="90" font-size="10" fill="#7c3aed" text-anchor="middle">D</text>

  <!-- Object C: line (two arrows) -->
  <text x="25" y="133" font-size="11" class="svg-text" font-weight="700">C</text>
  <line x1="45" y1="145" x2="300" y2="145" stroke="#d97706" stroke-width="2.5"/>
  <!-- Left arrow -->
  <polygon points="45,145 57,139 57,151" fill="#d97706"/>
  <!-- Right arrow -->
  <polygon points="300,145 288,139 288,151" fill="#d97706"/>
  <circle cx="130" cy="145" r="3.5" fill="#d97706"/>
  <circle cx="215" cy="145" r="3.5" fill="#d97706"/>
  <text x="130" y="135" font-size="10" fill="#d97706" text-anchor="middle">E</text>
  <text x="215" y="135" font-size="10" fill="#d97706" text-anchor="middle">F</text>
</svg>
