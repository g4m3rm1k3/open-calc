<svg viewBox="0 0 480 310" xmlns="http://www.w3.org/2000/svg" style="font-family: ui-sans-serif, system-ui, sans-serif; border-radius: 10px;">
  <style>
    .svg-bg    { fill: rgb(var(--tw-custom-slate-50)); }
    .svg-text  { fill: rgb(var(--tw-custom-slate-800)); }
    .svg-muted { fill: rgb(var(--tw-custom-slate-500)); }
    .dark .svg-bg    { fill: rgb(var(--tw-custom-slate-900)); }
    .dark .svg-text  { fill: rgb(var(--tw-custom-slate-200)); }
    .dark .svg-muted { fill: rgb(var(--tw-custom-slate-400)); }
  </style>
  <rect width="480" height="310" rx="10" class="svg-bg"/>

  <!-- Line ℓ₁ -->
  <line x1="30" y1="105" x2="450" y2="105" stroke="#1e3a8a" stroke-width="2.5"/>
  <!-- Parallel tick marks on ℓ₁ -->
  <line x1="218" y1="98" x2="222" y2="112" stroke="#1e3a8a" stroke-width="2"/>
  <line x1="224" y1="98" x2="228" y2="112" stroke="#1e3a8a" stroke-width="2"/>
  <text x="38" y="97" font-size="12" fill="#1e3a8a" font-style="italic" font-weight="700">ℓ₁</text>

  <!-- Line ℓ₂ -->
  <line x1="30" y1="205" x2="450" y2="205" stroke="#1e3a8a" stroke-width="2.5"/>
  <!-- Parallel tick marks on ℓ₂ -->
  <line x1="268" y1="198" x2="272" y2="212" stroke="#1e3a8a" stroke-width="2"/>
  <line x1="274" y1="198" x2="278" y2="212" stroke="#1e3a8a" stroke-width="2"/>
  <text x="38" y="198" font-size="12" fill="#1e3a8a" font-style="italic" font-weight="700">ℓ₂</text>

  <!-- Transversal t (angled) -->
  <line x1="170" y1="30" x2="350" y2="285" stroke="#374151" stroke-width="2.5"/>
  <text x="360" y="280" font-size="12" class="svg-text" font-style="italic">t</text>

  <!-- Intersection 1 at approx (225, 105) -->
  <circle cx="225" cy="105" r="4.5" fill="#374151"/>

  <!-- Intersection 2 at approx (274, 205) -->
  <circle cx="274" cy="205" r="4.5" fill="#374151"/>

  <!-- Angles at intersection 1 -->
  <!-- ∠1 upper-left: supplementary to t-angle -->
  <text x="181" y="94" font-size="12" fill="#f43f5e" font-weight="700">∠1</text>
  <text x="181" y="107" font-size="10" fill="#f43f5e">125°</text>
  <!-- ∠2 upper-right -->
  <text x="237" y="94" font-size="12" fill="#6366f1" font-weight="700">∠2</text>
  <text x="237" y="107" font-size="10" fill="#6366f1">55°</text>
  <!-- ∠3 lower-right -->
  <text x="237" y="122" font-size="12" fill="#f43f5e" font-weight="700">∠3</text>
  <text x="237" y="134" font-size="10" fill="#f43f5e">125°</text>
  <!-- ∠4 lower-left -->
  <text x="181" y="122" font-size="12" fill="#6366f1" font-weight="700">∠4</text>
  <text x="181" y="134" font-size="10" fill="#6366f1">55°</text>

  <!-- Angles at intersection 2 -->
  <!-- ∠5 upper-left -->
  <text x="232" y="194" font-size="12" fill="#f43f5e" font-weight="700">∠5</text>
  <text x="232" y="206" font-size="10" fill="#f43f5e">125°</text>
  <!-- ∠6 upper-right -->
  <text x="286" y="194" font-size="12" fill="#6366f1" font-weight="700">∠6</text>
  <text x="286" y="206" font-size="10" fill="#6366f1">55°</text>
  <!-- ∠7 lower-right -->
  <text x="286" y="220" font-size="12" fill="#f43f5e" font-weight="700">∠7</text>
  <text x="286" y="232" font-size="10" fill="#f43f5e">125°</text>
  <!-- ∠8 lower-left -->
  <text x="232" y="220" font-size="12" fill="#6366f1" font-weight="700">∠8</text>
  <text x="232" y="232" font-size="10" fill="#6366f1">55°</text>

  <!-- Legend -->
  <rect x="30" y="256" width="420" height="44" rx="6" fill="none" stroke="#e2e8f0" stroke-width="1" class=""/>
  <text x="240" y="272" font-size="11" class="svg-text" text-anchor="middle">Corresponding: ∠2 = ∠6 = 55°  |  Alt. Interior: ∠4 = ∠6 = 55°</text>
  <text x="240" y="289" font-size="11" class="svg-muted" text-anchor="middle">Co-interior: ∠4 + ∠5 = 55° + 125° = 180°</text>
</svg>
