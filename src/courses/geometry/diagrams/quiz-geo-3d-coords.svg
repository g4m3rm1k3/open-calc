<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" font-family="Georgia, serif">
  <style>
    .svg-bg   { fill: rgb(var(--tw-custom-slate-50)); }
    .svg-text { fill: #1e3a5f; }
    .svg-sub  { fill: rgb(var(--tw-custom-slate-700)); }
    .svg-muted{ fill: rgb(var(--tw-custom-slate-400)); }
    .svg-rule { fill: #eff6ff; stroke: #1e3a5f; }
    .dark .svg-bg   { fill: rgb(var(--tw-custom-slate-800)); }
    .dark .svg-text { fill: #93c5fd; }
    .dark .svg-sub  { fill: rgb(var(--tw-custom-slate-300)); }
    .dark .svg-muted{ fill: rgb(var(--tw-custom-slate-600)); }
    .dark .svg-rule { fill: #1e3a5f44; stroke: #93c5fd; }
  </style>

  <rect width="720" height="280" class="svg-bg"/>

  <!-- Q1-Q5: Distance and midpoint in 3D -->
  <text x="178" y="20" font-size="13" font-weight="bold" class="svg-sub" text-anchor="middle">Q1–Q5: Distance and midpoint</text>

  <!-- 3D axes at (100,160) -->
  <line x1="100" y1="160" x2="220" y2="160" stroke="#166534" stroke-width="1.5" style="fill:none"/>
  <line x1="100" y1="160" x2="100" y2="50"  stroke="#1e3a5f" stroke-width="1.5" style="fill:none"/>
  <line x1="100" y1="160" x2="42"  y2="196" stroke="#dc2626" stroke-width="1.5" style="fill:none"/>
  <text x="224" y="164" font-size="11" fill="#166534" font-style="italic">x</text>
  <text x="102" y="44"  font-size="11" class="svg-text" font-style="italic">y</text>
  <text x="32"  y="202" font-size="11" fill="#dc2626" font-style="italic">z</text>

  <!-- P=(1,2,3) Q=(5,6,7) on the diagram -->
  <!-- isometric: x→+29,0; y→0,-29; z→-15,+12 -->
  <!-- P: (100+29-15*3,160-29*2+12*3) = (100+29-45,160-58+36) = (84,138) -->
  <!-- Q: (100+29*5-15*7,160-29*6+12*7) = (100+145-105,160-174+84) = (140,70) -->
  <circle cx="84"  cy="138" r="5" fill="#dc2626"/>
  <circle cx="140" cy="70"  r="5" fill="#166534"/>
  <line x1="84" y1="138" x2="140" y2="70" stroke="#b45309" stroke-width="2" style="fill:none"/>
  <text x="60"  y="133" font-size="12" fill="#dc2626" font-weight="bold">P(1,2,3)</text>
  <text x="143" y="68"  font-size="12" fill="#166534" font-weight="bold">Q(5,6,7)</text>
  <text x="108" y="100" font-size="12" fill="#b45309" font-weight="bold" font-style="italic">d=?</text>

  <!-- Midpoint M -->
  <circle cx="112" cy="104" r="4" fill="#7c3aed"/>
  <text x="115" y="103" font-size="11" fill="#7c3aed">M=?</text>

  <text x="130" y="200" font-size="12" class="svg-sub">Find d=|PQ| and M</text>
  <text x="130" y="216" font-size="12" class="svg-sub">d=√(Δx²+Δy²+Δz²)</text>
  <text x="130" y="232" font-size="12" class="svg-sub">M=(avg of each coord)</text>

  <!-- Divider -->
  <line x1="340" y1="15" x2="340" y2="265" stroke="#e2e8f0" stroke-width="1.5" style="fill:none"/>

  <!-- Q6-Q10: 3D section and centroid of tetrahedron -->
  <text x="530" y="20" font-size="13" font-weight="bold" class="svg-sub" text-anchor="middle">Q6–Q10: 3D Section &amp; centroid</text>

  <!-- Tetrahedron with labelled vertices -->
  <polygon points="440,230 590,230 515,100" fill="#7c3aed11" stroke="#7c3aed" stroke-width="2"/>
  <line x1="515" y1="100" x2="540" y2="200" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4,3" style="fill:none"/>
  <line x1="440" y1="230" x2="540" y2="200" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4,3" style="fill:none"/>
  <line x1="590" y1="230" x2="540" y2="200" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4,3" style="fill:none"/>

  <circle cx="440" cy="230" r="5" fill="#dc2626"/>
  <circle cx="590" cy="230" r="5" fill="#166534"/>
  <circle cx="515" cy="100" r="5" fill="#b45309"/>
  <circle cx="540" cy="200" r="5" fill="#1e3a5f"/>
  <circle cx="521" cy="190" r="4" fill="#7c3aed"/>

  <text x="420" y="246" font-size="12" fill="#dc2626">A(0,0,0)</text>
  <text x="593" y="246" font-size="12" fill="#166534">B(6,0,0)</text>
  <text x="518" y="94" font-size="12" fill="#b45309">C(3,0,6)</text>
  <text x="542" y="198" font-size="12" class="svg-text">D(3,4,2)</text>
  <text x="524" y="186" font-size="11" fill="#7c3aed">G=?</text>
  <text x="430" y="258" font-size="12" class="svg-sub" text-anchor="middle">G = average of all 4 vertices</text>

  <!-- Formula strip -->
  <rect x="10" y="252" width="700" height="22" rx="5" class="svg-rule" stroke-width="1"/>
  <text x="360" y="267" font-size="12" class="svg-text" text-anchor="middle">3D distance: √(Δx²+Δy²+Δz²) · midpoint: avg each coord · centroid of tetrahedron: avg of 4 vertices</text>
</svg>
