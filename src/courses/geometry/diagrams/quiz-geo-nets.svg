<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="Georgia, serif">
  <style>
    .svg-bg   { fill: #fafaf8; }
    .svg-text { fill: #1e3a5f; }
    .svg-sub  { fill: #374151; }
    .svg-muted{ fill: #94a3b8; }
    .svg-rule { fill: #eff6ff; stroke: #1e3a5f; }
    .dark .svg-bg   { fill: #1e293b; }
    .dark .svg-text { fill: #93c5fd; }
    .dark .svg-sub  { fill: #cbd5e1; }
    .dark .svg-muted{ fill: #475569; }
    .dark .svg-rule { fill: #1e3a5f44; stroke: #93c5fd; }
  </style>

  <rect width="720" height="300" class="svg-bg"/>

  <!-- Q1–Q5: Net identification -->
  <text x="178" y="20" font-size="13" font-weight="bold" class="svg-sub" text-anchor="middle">Q1–Q5: What solid does this net form?</text>

  <!-- Net 1: T-shape for a rectangular prism -->
  <!-- Base rect (front): (30,60)(130,60)(130,120)(30,120) -->
  <rect x="30"  y="60"  width="100" height="60" fill="#1e3a5f22" stroke="#1e3a5f" stroke-width="2"/>
  <rect x="30"  y="0"   width="100" height="60" fill="#dc262622" stroke="#dc2626" stroke-width="2"/>
  <rect x="30"  y="120" width="100" height="60" fill="#16653422" stroke="#166534" stroke-width="2"/>
  <rect x="130" y="60"  width="60"  height="60" fill="#b4530922" stroke="#b45309" stroke-width="2"/>
  <rect x="30"  y="180" width="100" height="60" fill="#7c3aed22" stroke="#7c3aed" stroke-width="2"/>
  <text x="80" y="96"  font-size="12" class="svg-text" text-anchor="middle">front</text>
  <text x="80" y="34"  font-size="12" fill="#dc2626" text-anchor="middle">top</text>
  <text x="80" y="156" font-size="12" fill="#166534" text-anchor="middle">bottom</text>
  <text x="160" y="96" font-size="12" fill="#b45309" text-anchor="middle">side</text>
  <text x="80" y="216" font-size="12" fill="#7c3aed" text-anchor="middle">back</text>
  <text x="80" y="264" font-size="12" class="svg-muted" text-anchor="middle">Net A: forms a ___?</text>

  <!-- Divider -->
  <line x1="250" y1="10" x2="250" y2="290" stroke="#e2e8f0" stroke-width="1.5" style="fill:none"/>

  <!-- Q6: Cone cross-section -->
  <text x="480" y="20" font-size="13" font-weight="bold" class="svg-sub" text-anchor="middle">Q6–Q10: Cross-sections</text>
  <!-- Cone -->
  <ellipse cx="480" cy="230" rx="110" ry="26" fill="#1e3a5f11" stroke="#1e3a5f" stroke-width="1.5"/>
  <line x1="370" y1="230" x2="480" y2="50" stroke="#1e3a5f" stroke-width="2" style="fill:none"/>
  <line x1="590" y1="230" x2="480" y2="50" stroke="#1e3a5f" stroke-width="2" style="fill:none"/>
  <!-- Horizontal cut = circle -->
  <ellipse cx="480" cy="160" rx="68" ry="16" fill="#dc262622" stroke="#dc2626" stroke-width="2"/>
  <text x="560" y="158" font-size="12" fill="#dc2626">Cut A</text>
  <!-- Parallel-to-slant cut = parabola -->
  <path d="M 432 50 Q 480 200 530 50" fill="none" stroke="#7c3aed" stroke-width="2"/>
  <text x="534" y="55" font-size="12" fill="#7c3aed">Cut B</text>
  <!-- Angled cut = ellipse -->
  <ellipse cx="460" cy="120" rx="78" ry="13" fill="#b4530922" stroke="#b45309" stroke-width="1.5" transform="rotate(-15 460 120)"/>
  <text x="542" y="105" font-size="12" fill="#b45309">Cut C</text>

  <text x="480" y="264" font-size="12" class="svg-sub" text-anchor="middle">Name the cross-section for each cut</text>

  <!-- Formula strip -->
  <rect x="10" y="272" width="700" height="22" rx="5" class="svg-rule" stroke-width="1"/>
  <text x="360" y="287" font-size="12" class="svg-text" text-anchor="middle">Net SA = sum of face areas · Horiz cone cut→circle · Angled→ellipse · Parallel to slant→parabola · Steep→hyperbola</text>
</svg>
