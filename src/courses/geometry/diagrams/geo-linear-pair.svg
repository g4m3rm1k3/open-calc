<svg viewBox="0 0 480 200" xmlns="http://www.w3.org/2000/svg" style="font-family: ui-sans-serif, system-ui, sans-serif; border-radius: 10px;">
  <style>
    .svg-bg    { fill: rgb(var(--tw-custom-slate-50)); }
    .svg-text  { fill: rgb(var(--tw-custom-slate-800)); }
    .svg-muted { fill: rgb(var(--tw-custom-slate-500)); }
    .dark .svg-bg    { fill: rgb(var(--tw-custom-slate-900)); }
    .dark .svg-text  { fill: rgb(var(--tw-custom-slate-200)); }
    .dark .svg-muted { fill: rgb(var(--tw-custom-slate-400)); }
  </style>
  <rect width="480" height="200" rx="10" class="svg-bg"/>
  <defs>
    <marker id="la" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto">
      <path d="M1,1 L1,6 L6,3.5 z" fill="#94a3b8"/>
    </marker>
    <marker id="lb" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto">
      <path d="M1,1 L1,6 L6,3.5 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Straight base line -->
  <line x1="30" y1="130" x2="420" y2="130" stroke="#94a3b8" stroke-width="2"
        marker-start="url(#la)" marker-end="url(#lb)"/>

  <!-- The ray going up from vertex at x=200 -->
  <line x1="200" y1="130" x2="260" y2="38" stroke="#374151" stroke-width="2.5"/>
  <!-- Arrow on ray -->
  <polygon points="262,35 255,42 268,45" fill="#374151"/>

  <!-- Vertex dot -->
  <circle cx="200" cy="130" r="5" fill="#374151"/>
  <text x="200" y="152" font-size="12" class="svg-muted" text-anchor="middle">P</text>

  <!-- Arc for ∠1 (left angle) -->
  <path d="M 170,130 A 30,30 0 0,1 187,107" fill="none" stroke="#6366f1" stroke-width="2"/>
  <text x="155" y="116" font-size="14" fill="#6366f1" font-weight="700">∠1</text>
  <text x="140" y="132" font-size="13" fill="#6366f1" font-weight="600">123°</text>

  <!-- Arc for ∠2 (right angle) -->
  <path d="M 213,107 A 30,30 0 0,1 232,130" fill="none" stroke="#f43f5e" stroke-width="2"/>
  <text x="240" y="116" font-size="14" fill="#f43f5e" font-weight="700">∠2</text>
  <text x="238" y="132" font-size="13" fill="#f43f5e" font-weight="600">57°</text>

  <!-- Equation at bottom -->
  <text x="240" y="170" font-size="13" class="svg-text" text-anchor="middle">
    <tspan fill="#6366f1" font-weight="700">∠1</tspan>
    <tspan class="svg-text"> + </tspan>
    <tspan fill="#f43f5e" font-weight="700">∠2</tspan>
    <tspan class="svg-text"> = </tspan>
    <tspan fill="#6366f1" font-weight="700">123°</tspan>
    <tspan class="svg-text"> + </tspan>
    <tspan fill="#f43f5e" font-weight="700">57°</tspan>
    <tspan class="svg-text"> = 180°</tspan>
  </text>
  <text x="240" y="188" font-size="11" class="svg-muted" text-anchor="middle">Linear Pair Theorem: adjacent angles on a straight line sum to 180°</text>
</svg>
