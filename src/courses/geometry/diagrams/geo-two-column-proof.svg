<svg viewBox="0 0 480 220" xmlns="http://www.w3.org/2000/svg" style="font-family: ui-sans-serif, system-ui, sans-serif; border-radius: 8px;">
  <style>
    .svg-bg    { fill: #f8fafc; }
    .svg-panel { fill: #ffffff; }
    .svg-text  { fill: #1e293b; }
    .svg-muted { fill: #64748b; }
    .svg-div   { stroke: #e2e8f0; fill: none; }
    .dark .svg-bg    { fill: #0f172a; }
    .dark .svg-panel { fill: #1e293b; }
    .dark .svg-text  { fill: #e2e8f0; }
    .dark .svg-muted { fill: #94a3b8; }
    .dark .svg-div   { stroke: #334155; }
  </style>
  <rect width="480" height="220" rx="8" class="svg-bg"/>

  <!-- Header row -->
  <rect x="10" y="10" width="460" height="30" rx="4" fill="#1e3a5f"/>
  <text x="130" y="30" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">Statement</text>
  <text x="360" y="30" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">Reason</text>
  <line x1="245" y1="10" x2="245" y2="210" stroke="#e2e8f0" stroke-width="1.2"/>

  <!-- Row backgrounds alternating -->
  <rect x="10" y="40" width="460" height="30" rx="0" fill="rgba(30,58,95,0.04)"/>
  <rect x="10" y="100" width="460" height="30" rx="0" fill="rgba(30,58,95,0.04)"/>
  <rect x="10" y="160" width="460" height="30" rx="0" fill="rgba(30,58,95,0.04)"/>

  <!-- Row 1 -->
  <text x="20" y="61" font-size="11" class="svg-text">1. AB ≅ CD</text>
  <text x="255" y="61" font-size="11" class="svg-muted">Given</text>

  <!-- Row 2 -->
  <text x="20" y="91" font-size="11" class="svg-text">2. ∠1 ≅ ∠2</text>
  <text x="255" y="91" font-size="11" class="svg-muted">Vertical Angles Theorem</text>

  <!-- Row 3 -->
  <text x="20" y="121" font-size="11" class="svg-text">3. BC ≅ BC</text>
  <text x="255" y="121" font-size="11" class="svg-muted">Reflexive Property</text>

  <!-- Row 4 -->
  <text x="20" y="151" font-size="11" class="svg-text">4. △ABC ≅ △DCB</text>
  <text x="255" y="151" font-size="11" class="svg-muted">SAS Congruence (steps 1–3)</text>

  <!-- Row 5 -->
  <text x="20" y="181" font-size="11" class="svg-text">5. AC ≅ DB</text>
  <text x="255" y="181" font-size="11" class="svg-muted">CPCTC</text>

  <!-- QED box -->
  <rect x="440" y="196" width="26" height="16" rx="2" fill="#1e3a5f"/>
  <text x="453" y="208" font-size="10" fill="#fff" font-weight="700" text-anchor="middle">□</text>

  <!-- Border -->
  <rect x="10" y="10" width="460" height="200" rx="4" fill="none" stroke="#e2e8f0" stroke-width="1.2"/>

  <!-- Row dividers -->
  <line x1="10" y1="70" x2="470" y2="70" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="10" y1="100" x2="470" y2="100" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="10" y1="130" x2="470" y2="130" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="10" y1="160" x2="470" y2="160" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="10" y1="190" x2="470" y2="190" stroke="#e2e8f0" stroke-width="1"/>
</svg>
