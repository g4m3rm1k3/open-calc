<svg viewBox="0 0 320 170" xmlns="http://www.w3.org/2000/svg" style="font-family: ui-sans-serif, system-ui, sans-serif; border-radius: 8px;">
  <style>
    .svg-bg    { fill: #f8fafc; }
    .svg-panel { fill: #ffffff; }
    .svg-text  { fill: #1e293b; }
    .svg-muted { fill: #64748b; }
    .svg-div   { stroke: #e2e8f0; fill: none; }
    .dark .svg-bg    { fill: #0f172a; }
    .dark .svg-panel { fill: #1e293b; }
    .dark .svg-text  { fill: #e2e8f0; }
    .dark .svg-muted { fill: #94a3b8; }
    .dark .svg-div   { stroke: #334155; }
  </style>
  <rect width="320" height="170" rx="8" class="svg-bg"/>

  <!-- Circle at center (160, 90), r=70 -->
  <circle cx="160" cy="90" r="70" fill="rgba(30,58,95,0.04)" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,3"/>

  <!-- Sector: center (160,90), angle from 0 to 2π/3 (120°) -->
  <!-- Start at (160+70, 90) = (230, 90), end at (160+70cos(120°), 90+70sin(120°)) ≈ (160-35, 90+60.6) = (125, 151) -->
  <path d="M 160 90 L 230 90 A 70 70 0 0 1 125 150.6 Z" fill="rgba(30,58,95,0.12)" stroke="#1e3a5f" stroke-width="2"/>

  <!-- Center dot -->
  <circle cx="160" cy="90" r="3.5" fill="#1e3a5f"/>

  <!-- Radius labels -->
  <line x1="160" y1="90" x2="230" y2="90" stroke="#dc2626" stroke-width="1.8"/>
  <text x="195" y="84" font-size="11" fill="#dc2626" font-weight="700">r = 6</text>

  <line x1="160" y1="90" x2="125" y2="151" stroke="#dc2626" stroke-width="1.8"/>
  <text x="128" y="118" font-size="11" fill="#dc2626" font-weight="700">r = 6</text>

  <!-- Angle label -->
  <path d="M 200 90 A 40 40 0 0 1 180 124" fill="none" stroke="#1a3a2a" stroke-width="1.8"/>
  <text x="208" y="115" font-size="12" fill="#1a3a2a" font-weight="700">2π/3 rad</text>
  <text x="208" y="130" font-size="10" fill="#64748b">(= 120°)</text>

  <!-- Unknown area -->
  <text x="165" y="106" font-size="13" fill="#7c3aed" font-weight="700">x</text>
  <text x="160" y="160" font-size="10" class="svg-muted" text-anchor="middle">Find the shaded sector area x. Use A = ½r²θ (θ in radians).</text>
</svg>
