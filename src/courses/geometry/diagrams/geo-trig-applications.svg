<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="Georgia, serif">
  <style>
    .svg-bg    { fill: #fafaf8; }
    .svg-text  { fill: #1e3a5f; }
    .svg-sub   { fill: #374151; }
    .svg-muted { fill: #94a3b8; }
    .svg-panel { fill: #eff6ff; stroke: #1e3a5f; }
    .svg-use   { fill: #f0fdf4; stroke: #166534; }
    .dark .svg-bg    { fill: #1e293b; }
    .dark .svg-text  { fill: #93c5fd; }
    .dark .svg-sub   { fill: #cbd5e1; }
    .dark .svg-muted { fill: #475569; }
    .dark .svg-panel { fill: #1e3a5f44; stroke: #93c5fd; }
    .dark .svg-use   { fill: #14532d22; stroke: #4ade80; }
  </style>

  <rect width="720" height="400" class="svg-bg"/>

  <!-- ===== Section 1: Bearing (left) ===== -->
  <text x="180" y="26" font-size="15" class="svg-text" font-weight="bold" text-anchor="middle">Navigation Bearing</text>

  <!-- Compass rose at (180,150) -->
  <circle cx="180" cy="150" r="80" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>
  <line x1="180" y1="70"  x2="180" y2="230" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3" style="fill:none"/>
  <line x1="100" y1="150" x2="260" y2="150" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3" style="fill:none"/>
  <!-- N E S W labels -->
  <text x="180" y="62"  font-size="14" class="svg-sub" font-weight="bold" text-anchor="middle">N</text>
  <text x="268" y="155" font-size="14" class="svg-sub" font-weight="bold">E</text>
  <text x="180" y="246" font-size="14" class="svg-sub" font-weight="bold" text-anchor="middle">S</text>
  <text x="82"  y="155" font-size="14" class="svg-sub" font-weight="bold">W</text>

  <!-- Bearing direction: 040° -->
  <line x1="180" y1="150" x2="231" y2="86" stroke="#dc2626" stroke-width="2.5" style="fill:none"/>
  <circle cx="231" cy="86" r="5" fill="#dc2626"/>
  <text x="244" y="84" font-size="13" fill="#dc2626" font-weight="bold">B</text>

  <!-- Bearing arc -->
  <path d="M 180 80 A 70 70 0 0 1 231 86" fill="none" stroke="#7c3aed" stroke-width="2"/>
  <text x="196" y="104" font-size="13" fill="#7c3aed">40°</text>
  <text x="108" y="182" font-size="12" class="svg-sub">Bearing = 040°</text>
  <text x="108" y="197" font-size="11" class="svg-muted">(measured CW from N)</text>

  <!-- Back bearing -->
  <line x1="180" y1="150" x2="129" y2="214" stroke="#166534" stroke-width="1.5" stroke-dasharray="5,4" style="fill:none"/>
  <text x="30" y="228" font-size="11" fill="#166534">Back bearing</text>
  <text x="30" y="242" font-size="11" fill="#166534">= 040+180 = 220°</text>

  <!-- Bearing rules box -->
  <rect x="20" y="265" width="320" height="125" rx="8" class="svg-panel" stroke-width="1.5"/>
  <text x="180" y="285" font-size="13" class="svg-text" font-weight="bold" text-anchor="middle">Bearing Rules</text>
  <text x="30" y="303" font-size="12" class="svg-sub">• Always 3 digits (e.g. 005°, not 5°)</text>
  <text x="30" y="319" font-size="12" class="svg-sub">• Measured clockwise from North</text>
  <text x="30" y="335" font-size="12" class="svg-sub">• N=000°  E=090°  S=180°  W=270°</text>
  <text x="30" y="351" font-size="12" class="svg-sub">• Back bearing = bearing + 180° (mod 360°)</text>
  <text x="30" y="367" font-size="12" class="svg-sub">• N·α·E: α° clockwise from N toward E</text>

  <!-- ===== Section 2: Two-Building Problem (right) ===== -->
  <line x1="360" y1="30" x2="360" y2="395" stroke="#e2e8f0" stroke-width="1.5" style="fill:none"/>
  <text x="540" y="26" font-size="15" class="svg-text" font-weight="bold" text-anchor="middle">Two-Building Height Problem</text>

  <!-- Ground line -->
  <line x1="380" y1="320" x2="710" y2="320" stroke="#374151" stroke-width="2" style="fill:none"/>

  <!-- Building 1 (left, shorter) -->
  <rect x="395" y="200" width="30" height="120" fill="#1e3a5f33" stroke="#1e3a5f" stroke-width="2"/>
  <text x="410" y="196" font-size="12" class="svg-text" text-anchor="middle">h₁=?</text>

  <!-- Building 2 (right, taller) -->
  <rect x="610" y="140" width="30" height="180" fill="#dc262633" stroke="#dc2626" stroke-width="2"/>
  <text x="625" y="136" font-size="12" fill="#dc2626" text-anchor="middle">h₂</text>

  <!-- Observer at P -->
  <circle cx="460" cy="320" r="5" fill="#166534"/>
  <text x="456" y="338" font-size="11" fill="#166534">P</text>

  <!-- Line of sight -->
  <line x1="460" y1="320" x2="610" y2="140" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="6,4" style="fill:none"/>
  <path d="M 510 320 A 50 50 0 0 0 484 289" fill="none" stroke="#dc2626" stroke-width="1.8"/>
  <text x="515" y="310" font-size="12" fill="#dc2626">α</text>

  <!-- Horizontal distance -->
  <text x="530" y="340" font-size="13" class="svg-sub" text-anchor="middle">d</text>

  <!-- Height bracket for building 2 -->
  <line x1="645" y1="140" x2="660" y2="140" stroke="#dc2626" stroke-width="1.5" style="fill:none"/>
  <line x1="645" y1="320" x2="660" y2="320" stroke="#dc2626" stroke-width="1.5" style="fill:none"/>
  <line x1="653" y1="140" x2="653" y2="320" stroke="#dc2626" stroke-width="1.5" style="fill:none"/>
  <text x="665" y="235" font-size="13" fill="#dc2626">h₂</text>

  <!-- Steps -->
  <rect x="375" y="348" width="330" height="46" rx="5" class="svg-use" stroke-width="1"/>
  <text x="387" y="363" font-size="11.5" class="svg-sub">Step 1: tan α = h₂/d  →  h₂ = d·tan α</text>
  <text x="387" y="380" font-size="11.5" class="svg-sub">Step 2: tan β (depr. from roof) = (h₂−h₁)/d</text>
  <text x="387" y="393" font-size="11.5" class="svg-sub">→  h₁ = h₂ − d·tan β</text>
</svg>
