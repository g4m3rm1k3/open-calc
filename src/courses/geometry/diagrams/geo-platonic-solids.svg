<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="Georgia, serif">
  <style>
    .svg-bg    { fill: rgb(var(--tw-custom-slate-50)); }
    .svg-text  { fill: #1e3a5f; }
    .svg-sub   { fill: rgb(var(--tw-custom-slate-700)); }
    .svg-muted { fill: rgb(var(--tw-custom-slate-400)); }
    .svg-panel { fill: #eff6ff; stroke: #1e3a5f; }
    .svg-use   { fill: #f0fdf4; stroke: #166534; }
    .dark .svg-bg    { fill: rgb(var(--tw-custom-slate-800)); }
    .dark .svg-text  { fill: #93c5fd; }
    .dark .svg-sub   { fill: rgb(var(--tw-custom-slate-300)); }
    .dark .svg-muted { fill: rgb(var(--tw-custom-slate-600)); }
    .dark .svg-panel { fill: #1e3a5f44; stroke: #93c5fd; }
    .dark .svg-use   { fill: #14532d22; stroke: #4ade80; }
  </style>

  <rect width="720" height="380" class="svg-bg"/>

  <!-- Title -->
  <text x="360" y="24" font-size="16" class="svg-text" font-weight="bold" text-anchor="middle">The Five Platonic Solids</text>

  <!-- ===== 1. Tetrahedron ===== -->
  <polygon points="90,130 150,230 30,230" fill="#dc262618" stroke="#dc2626" stroke-width="2.5"/>
  <line x1="90" y1="130" x2="120" y2="205" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,3" style="fill:none"/>
  <circle cx="90"  cy="130" r="4" fill="#dc2626"/>
  <circle cx="150" cy="230" r="4" fill="#dc2626"/>
  <circle cx="30"  cy="230" r="4" fill="#dc2626"/>
  <circle cx="120" cy="205" r="4" fill="#dc2626" fill-opacity="0.6"/>
  <text x="90"  y="260" font-size="13" fill="#dc2626" font-weight="bold" text-anchor="middle">Tetrahedron</text>
  <text x="90"  y="276" font-size="11" class="svg-muted" text-anchor="middle">4 △  V=4 E=6 F=4</text>
  <text x="90"  y="290" font-size="11" class="svg-muted" text-anchor="middle">3 triangles/vertex</text>

  <!-- ===== 2. Cube ===== -->
  <!-- Front face: (210,140)(310,140)(310,230)(210,230) -->
  <polygon points="210,230 310,230 310,140 210,140" fill="#1e3a5f18" stroke="#1e3a5f" stroke-width="2.5"/>
  <polygon points="210,140 310,140 330,120 230,120" fill="#1e3a5f22" stroke="#1e3a5f" stroke-width="2.5"/>
  <polygon points="310,140 330,120 330,210 310,230" fill="#1e3a5f14" stroke="#1e3a5f" stroke-width="2.5"/>
  <line x1="210" y1="230" x2="230" y2="210" stroke="#1e3a5f" stroke-width="1.5" stroke-dasharray="4,3" style="fill:none"/>
  <line x1="230" y1="210" x2="330" y2="210" stroke="#1e3a5f" stroke-width="1.5" stroke-dasharray="4,3" style="fill:none"/>
  <line x1="230" y1="210" x2="230" y2="120" stroke="#1e3a5f" stroke-width="1.5" stroke-dasharray="4,3" style="fill:none"/>
  [[210,230],[310,230],[310,140],[210,140],[330,210],[330,120],[230,120]].map(([x,y])=>{});
  <circle cx="210" cy="230" r="3.5" fill="#1e3a5f"/>
  <circle cx="310" cy="230" r="3.5" fill="#1e3a5f"/>
  <circle cx="310" cy="140" r="3.5" fill="#1e3a5f"/>
  <circle cx="210" cy="140" r="3.5" fill="#1e3a5f"/>
  <circle cx="330" cy="210" r="3.5" fill="#1e3a5f"/>
  <circle cx="330" cy="120" r="3.5" fill="#1e3a5f"/>
  <circle cx="230" cy="120" r="3.5" fill="#1e3a5f"/>
  <text x="270" y="260" font-size="13" class="svg-text" font-weight="bold" text-anchor="middle">Cube</text>
  <text x="270" y="276" font-size="11" class="svg-muted" text-anchor="middle">6 □  V=8 E=12 F=6</text>
  <text x="270" y="290" font-size="11" class="svg-muted" text-anchor="middle">3 squares/vertex</text>

  <!-- ===== 3. Octahedron ===== -->
  <!-- top=(430,100) bottom=(430,250) left=(380,175) right=(480,175) front=(410,195) -->
  <polygon points="430,100 380,175 430,250" fill="#16653414" stroke="#166534" stroke-width="2.5"/>
  <polygon points="430,100 480,175 430,250" fill="#16653420" stroke="#166534" stroke-width="2.5"/>
  <polygon points="430,100 380,175 480,175" fill="#16653418" stroke="#166534" stroke-width="2"/>
  <line x1="380" y1="175" x2="430" y2="250" stroke="#166534" stroke-width="1.5" style="fill:none"/>
  <line x1="480" y1="175" x2="430" y2="250" stroke="#166534" stroke-width="1.5" style="fill:none"/>
  <line x1="380" y1="175" x2="480" y2="175" stroke="#166534" stroke-width="1.5" stroke-dasharray="4,3" style="fill:none"/>
  <circle cx="430" cy="100" r="3.5" fill="#166534"/>
  <circle cx="430" cy="250" r="3.5" fill="#166534"/>
  <circle cx="380" cy="175" r="3.5" fill="#166534"/>
  <circle cx="480" cy="175" r="3.5" fill="#166534"/>
  <text x="430" y="270" font-size="13" fill="#166534" font-weight="bold" text-anchor="middle">Octahedron</text>
  <text x="430" y="286" font-size="11" class="svg-muted" text-anchor="middle">8 △  V=6 E=12 F=8</text>
  <text x="430" y="302" font-size="11" class="svg-muted" text-anchor="middle">4 triangles/vertex</text>

  <!-- ===== 4. Dodecahedron (sketch) ===== -->
  <!-- Simplified: pentagon + edges hinting at 3D -->
  <polygon points="570,110 615,145 600,200 540,200 525,145" fill="#b4530918" stroke="#b45309" stroke-width="2.5"/>
  <polygon points="555,130 585,130 597,158 570,176 543,158" fill="#b4530922" stroke="#b45309" stroke-width="1.5"/>
  <line x1="570" y1="110" x2="555" y2="130" stroke="#b45309" stroke-width="1.5" stroke-dasharray="3,2" style="fill:none"/>
  <line x1="615" y1="145" x2="597" y2="158" stroke="#b45309" stroke-width="1.5" stroke-dasharray="3,2" style="fill:none"/>
  <line x1="600" y1="200" x2="570" y2="176" stroke="#b45309" stroke-width="1.5" stroke-dasharray="3,2" style="fill:none"/>
  <line x1="540" y1="200" x2="543" y2="158" stroke="#b45309" stroke-width="1.5" stroke-dasharray="3,2" style="fill:none"/>
  <line x1="525" y1="145" x2="585" y2="130" stroke="#b45309" stroke-width="1.5" stroke-dasharray="3,2" style="fill:none"/>
  <text x="570" y="225" font-size="13" fill="#b45309" font-weight="bold" text-anchor="middle">Dodecahedron</text>
  <text x="570" y="241" font-size="11" class="svg-muted" text-anchor="middle">12 ⬠  V=20 E=30 F=12</text>
  <text x="570" y="257" font-size="11" class="svg-muted" text-anchor="middle">3 pentagons/vertex</text>

  <!-- ===== 5. Icosahedron (sketch) ===== -->
  <!-- Simplified triangular frame hinting 20 faces -->
  <polygon points="665,108 710,178 620,178" fill="#7c3aed18" stroke="#7c3aed" stroke-width="2.5"/>
  <line x1="665" y1="108" x2="688" y2="178" stroke="#7c3aed" stroke-width="1.5" style="fill:none"/>
  <polygon points="620,178 710,178 665,240" fill="#7c3aed22" stroke="#7c3aed" stroke-width="2.5"/>
  <line x1="665" y1="108" x2="642" y2="178" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4,3" style="fill:none"/>
  <line x1="642" y1="178" x2="665" y2="240" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4,3" style="fill:none"/>
  <circle cx="665" cy="108" r="4" fill="#7c3aed"/>
  <circle cx="710" cy="178" r="4" fill="#7c3aed"/>
  <circle cx="620" cy="178" r="4" fill="#7c3aed"/>
  <circle cx="665" cy="240" r="4" fill="#7c3aed"/>
  <text x="665" y="265" font-size="13" fill="#7c3aed" font-weight="bold" text-anchor="middle">Icosahedron</text>
  <text x="665" y="281" font-size="11" class="svg-muted" text-anchor="middle">20 △  V=12 E=30 F=20</text>
  <text x="665" y="297" font-size="11" class="svg-muted" text-anchor="middle">5 triangles/vertex</text>

  <!-- Summary table -->
  <rect x="10" y="318" width="700" height="56" rx="8" class="svg-panel" stroke-width="1.5"/>
  <text x="360" y="336" font-size="13" class="svg-text" font-weight="bold" text-anchor="middle">Why only 5? — Angle Sum at Each Vertex must be &lt; 360°</text>
  <text x="18"  y="354" font-size="12" class="svg-sub">Equilateral triangles: 60°/face → 3, 4 or 5 fit (&lt;360°); 6 would give 360° (flat, not solid)</text>
  <text x="18"  y="370" font-size="12" class="svg-sub">Squares: 90°/face → only 3 fit. Pentagons: 108°/face → only 3 fit. Hexagons: 120° → 3 gives 360° (flat) — no more Platonic solids possible.</text>
</svg>
