<svg viewBox="0 0 480 220" xmlns="http://www.w3.org/2000/svg" style="font-family: ui-sans-serif, system-ui, sans-serif; border-radius: 8px;">
  <style>
    .svg-bg    { fill: #f8fafc; }
    .svg-panel { fill: #ffffff; }
    .svg-text  { fill: #1e293b; }
    .svg-muted { fill: #64748b; }
    .svg-div   { stroke: #e2e8f0; fill: none; }
    .dark .svg-bg    { fill: #0f172a; }
    .dark .svg-panel { fill: #1e293b; }
    .dark .svg-text  { fill: #e2e8f0; }
    .dark .svg-muted { fill: #94a3b8; }
    .dark .svg-div   { stroke: #334155; }
  </style>
  <rect width="480" height="220" rx="8" class="svg-bg"/>

  <!-- Segment AB -->
  <line x1="100" y1="120" x2="380" y2="120" stroke="#1e3a5f" stroke-width="2.5"/>
  <circle cx="100" cy="120" r="5" fill="#1e3a5f"/>
  <circle cx="380" cy="120" r="5" fill="#1e3a5f"/>
  <text x="96" y="140" font-size="13" fill="#1e3a5f" text-anchor="middle" font-weight="700">A</text>
  <text x="384" y="140" font-size="13" fill="#1e3a5f" text-anchor="middle" font-weight="700">B</text>

  <!-- Arc from A (blue, dashed upper + lower) -->
  <path d="M 100 35 A 108 108 0 0 1 100 205" fill="none" stroke="#1e3a5f" stroke-width="1.8" stroke-dasharray="5,3" opacity="0.5"/>

  <!-- Arc from B (red, dashed) -->
  <path d="M 380 35 A 108 108 0 0 0 380 205" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="5,3" opacity="0.5"/>

  <!-- Bisector line PQ (green) -->
  <line x1="240" y1="18" x2="240" y2="202" stroke="#1a3a2a" stroke-width="2.2"/>

  <!-- Intersection points P (top) and Q (bottom) -->
  <circle cx="240" cy="35" r="5" fill="#1a3a2a"/>
  <text x="252" y="35" font-size="12" fill="#1a3a2a" font-weight="700" dominant-baseline="middle">P</text>
  <circle cx="240" cy="200" r="5" fill="#1a3a2a"/>
  <text x="252" y="200" font-size="12" fill="#1a3a2a" font-weight="700" dominant-baseline="middle">Q</text>

  <!-- Midpoint M with right-angle marker -->
  <circle cx="240" cy="120" r="4" fill="#dc2626"/>
  <text x="250" y="138" font-size="11" fill="#dc2626" font-weight="700">M</text>
  <rect x="240" y="108" width="12" height="12" fill="none" stroke="#dc2626" stroke-width="1.8"/>

  <!-- Equal tick marks on AM and MB -->
  <line x1="165" y1="112" x2="165" y2="128" stroke="#1e3a5f" stroke-width="2"/>
  <line x1="315" y1="112" x2="315" y2="128" stroke="#1e3a5f" stroke-width="2"/>

  <!-- Labels -->
  <text x="164" y="108" font-size="10" fill="#1e3a5f" text-anchor="middle">AM = BM</text>
  <text x="240" y="212" font-size="10" class="svg-muted" text-anchor="middle">PQ ⊥ AB at M    ·    AM = MB</text>

  <!-- arc labels -->
  <text x="72" y="56" font-size="10" fill="#1e3a5f" opacity="0.8">arc from A</text>
  <text x="350" y="56" font-size="10" fill="#dc2626" opacity="0.8" text-anchor="end">arc from B</text>
</svg>
