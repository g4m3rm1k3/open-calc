number: "M4.5"
title: "Why Windows Has a Path Length Limit at All"
path_note: >
  This lesson is about the operating system, not mastercam-app code -
  triggered by a real, live failure installing PySide6-Addons for
  Lesson M4.6's browser-embedding work. Every command below was actually
  run on this real machine (Windows-11-10.0.26200-SP0, Python 3.13.14),
  not simulated.

what_you_will_build: >
  Nothing added to the app - real, verified understanding of why
  `pip install PySide6-Addons` failed, what MAX_PATH actually is, what
  the `\\?\` prefix does at the Win32 API level (demonstrated for real
  on this machine), and exactly what the LongPathsEnabled registry
  setting changes and why it needs admin rights and a fresh process.

what_you_need_to_know_first: >
  Nothing from earlier lessons - this is a standalone systems topic,
  triggered by Phase M4's real install failure, not a continuation of
  ta_search_panel.py.

terms:
  - name: "MAX_PATH"
    definition: >
      A real, historical constant (260 characters) baked into many
      Win32 file APIs decades ago, when path buffers were fixed-size.
      It counts the whole path - drive letter, every folder, the
      filename - not just the filename.
  - name: "Win32 API"
    definition: >
      The real, low-level set of functions (CreateFileW, and similar)
      Windows programs actually call to touch the filesystem - Python's
      own os/shutil/open() calls go through this layer eventually, on
      Windows, whether or not that's visible from Python code.
  - name: "\\\\?\\ prefix (extended-length path)"
    definition: >
      A real, documented escape hatch - prefixing a path with \\?\ tells
      the Win32 API to skip MAX_PATH checking and most path
      normalization, allowing paths up to roughly 32,767 characters.
      It has existed since Windows NT; it doesn't require any setting to
      be enabled - it's a per-call opt-in, not a machine policy.
  - name: "LongPathsEnabled"
    definition: >
      A real registry value (Windows 10 version 1607+) that makes
      MAX_PATH-limited Win32 calls behave as if every path they receive
      already had the \\?\ prefix, but only for processes whose own
      executable manifest declares longPathAware - it is a machine-wide
      policy, not a per-path workaround.

objects_and_methods:
  - name: "CreateFileW (conceptually - not called directly from Python)"
    what_it_is: "The real Win32 function that ultimately opens/creates files and directories on Windows"
    implementation: "Windows kernel32.dll - Python's os/shutil call into this indirectly via the C runtime"
    its_use: "Every real Python file operation on Windows eventually reaches this layer"
    type: "OS API function"
    responsibility: "Translate a path string into a real filesystem operation, applying MAX_PATH rules unless told not to"
    depends_on: "the calling process's manifest (longPathAware) and the machine's LongPathsEnabled policy"
    connects_to: "pip's internal shutil.copytree calls during wheel installation"
    shape: "one function, two very different behaviors depending on process/machine opt-in state"

concept_units:
  - title: "The Real Failure Was a 281-Character Path, Not a Broken Package"
    problem: >
      pip's error named one specific, real file inside PySide6-Addons'
      wheel and said "No such file or directory" for a path that
      objectively exists in the package - the real question is why
      Windows would report a real file as missing.
    socratic_prompt:
      - "The failing path is 281 characters long, measured for real below. MAX_PATH is 260. What does that gap alone already predict about whether this specific file could ever install unmodified, regardless of what's wrong or right with the package?"
      - "PySide6-Addons ships QtWebEngine, QtQuick3D, and several other large Qt modules in one wheel - why would a package this size be far more likely to hit a 260-character ceiling than a small, pure-Python package?"
    project_change:
      reference_source: >
        No reference counterpart - this is real, live system behavior,
        not app code. The real, actual pip error this lesson is grounded
        in:

        ERROR: Could not install packages due to an OSError: [Errno 2]
        No such file or directory: 'C:\Users\g4m3r\AppData\Local\Packages\
        PythonSoftwareFoundation.Python.3.13_qbz5n2kfra8p0\LocalCache\
        local-packages\Python313\site-packages\PySide6\qml\Qt\labs\
        assetdownloader\objects-Debug\QmlAssetDownloaderPrivate_resources_1\
        .qt\rcc\qrc_qmake_Qt_labs_assetdownloader_init.cpp.obj'
      files_affected:
        - path: "none"
          status: none
      change_type: none
      location: "n/a - a real OS/tooling investigation, not a code change"
      dependencies: "none"
    new_code:
      applicable: false
    updated_project:
      applicable: false
    mechanical_walkthrough:
      applicable: true
      items:
        - element: "len(the failing path) == 281"
          explanation: >
            Measured for real, this session, on this exact path string.
            281 > 260 (MAX_PATH) - the file genuinely exists inside the
            downloaded wheel; Windows' own path-length ceiling is what
            refused to let Python's file-copy operation open it during
            install, and Python/pip surfaced that refusal as a plain
            FileNotFoundError, which reads as "the file is missing" even
            though the real cause is "the path is too long to open."
        - element: "PySide6-Addons contains QtWebEngine, QtQuick3D, and other large modules in deeply nested per-object build directories"
          explanation: >
            The specific failing path shows why: nested QML module
            folders (Qt/labs/assetdownloader/...), a Debug object
            directory, a resource sub-id, and a real, long generated
            filename (qrc_qmake_Qt_labs_assetdownloader_init.cpp.obj) all
            stack on top of the already-long install destination under
            AppData\Local\Packages\...\site-packages. A small, flat
            pure-Python package almost never accumulates this much real
            nesting.
    mental_model:
      applicable: false
    execution_trace:
      applicable: false
    cs_lens: >
      This is a real, concrete case of a **fixed-size buffer assumption**
      leaking into visible behavior decades after it was made - MAX_PATH
      exists because early Windows path-handling code used fixed 260-
      character buffers; that choice, made once, still constrains real
      installs on a 2026 machine with a 281-character generated build
      path.
    se_lens: >
      The real alternative Windows itself provides - the \\?\ prefix,
      covered in the next unit - has existed the whole time; the actual
      gap is that pip's own internal file-copy code doesn't add that
      prefix itself, so it stays fully subject to MAX_PATH unless the
      machine-wide LongPathsEnabled policy is on and Python's own
      executable manifest opts in too.
    commands:
      - command: "python -c \"p = r'C:\\Users\\g4m3r\\AppData\\Local\\Packages\\PythonSoftwareFoundation.Python.3.13_qbz5n2kfra8p0\\LocalCache\\local-packages\\Python313\\site-packages\\PySide6\\qml\\Qt\\labs\\assetdownloader\\objects-Debug\\QmlAssetDownloaderPrivate_resources_1\\.qt\\rcc\\qrc_qmake_Qt_labs_assetdownloader_init.cpp.obj'; print(len(p))\""
        explanation: "Run anywhere - measures the exact real failing path's length"
    verification:
      applicable: true
      real_output: |
        281
      output_file: "verification/mastercam-phase-04/lab_long_path_length_output.txt"
      exemption_reason: ""
    connection_to_previous: >
      This is a new, standalone systems lesson - nothing precedes it.

  - title: "The \\?\ Prefix Bypasses MAX_PATH Right Now - LongPathsEnabled Is What Makes That the Default"
    problem: >
      If \\?\ already bypasses MAX_PATH without any setting, why does
      fixing pip's install require a registry change at all, instead of
      just using that prefix directly?
    socratic_prompt:
      - "The test below creates the identical directory twice - once as a plain path, once with \\?\\ prepended. Predict which one fails before running it, then explain why prepending four characters would change the real outcome."
      - "LongPathsEnabled lives under HKLM (machine-wide), not HKCU (per-user) - given that it changes how the Win32 API itself behaves for every opted-in process on the machine, why would Windows require that to be an admin-level, not per-user, setting?"
    project_change:
      reference_source: >
        No reference counterpart - real, live Win32 filesystem behavior,
        verified directly against this machine's real C: drive.
      files_affected:
        - path: "none"
          status: none
      change_type: none
      location: "n/a"
      dependencies: "none"
    new_code:
      applicable: false
    updated_project:
      applicable: false
    mechanical_walkthrough:
      applicable: true
      items:
        - element: "long_dir = 284 real characters under C:\\Users\\...\\Temp\\; os.makedirs(long_dir) fails with WinError 3"
          explanation: >
            WinError 3 is literally "The system cannot find the path
            specified" - the exact same category of misleading error
            pip's FileNotFoundError was, for the identical underlying
            reason: the plain path exceeds 260 characters, so Windows
            refuses to resolve it at all, rather than reporting a length
            problem specifically.
        - element: "extended = '\\\\\\\\?\\\\' + long_dir; os.makedirs(extended) succeeds"
          explanation: >
            The identical real directory, on the identical real drive,
            succeeds the moment the \\?\ prefix is added - proving the
            filesystem itself has no problem with a 288-character path;
            only the MAX_PATH-checked code path Windows uses for plain
            paths does. This is the real, mechanical fact LongPathsEnabled
            exists to change: it makes the plain-path code path behave
            like the \\?\ code path, machine-wide, for manifest-opted-in
            processes - which is why turning it on fixes pip (pip never
            adds \\?\ itself) without needing pip's own source code
            changed.
    mental_model:
      applicable: true
      diagram: |
        Plain path, LongPathsEnabled=0 (this machine, right now):
          Win32 API checks length -> over 260 -> refuses -> "not found"

        \\?\-prefixed path, any LongPathsEnabled setting:
          Win32 API skips the check entirely -> succeeds (up to ~32,767 chars)

        Plain path, LongPathsEnabled=1, on a longPathAware process (python.exe is one):
          Win32 API treats it like the \\?\ case -> succeeds
    execution_trace:
      applicable: false
    cs_lens: >
      This is a real, visible case of an **opt-in compatibility flag** -
      the same shape as a language's own "strict mode": old behavior
      stays the default for compatibility with everything already
      written assuming 260-character paths, and code that wants the new
      behavior has to explicitly ask for it, at both the OS-policy level
      and the individual process's own manifest level.
    se_lens: >
      The real alternative - just changing the Win32 API's default
      behavior everywhere, always - would have silently broken decades
      of real software that has its own, sometimes-load-bearing
      assumptions about paths never exceeding 260 characters. Requiring
      both a machine-wide opt-in AND a per-process manifest declaration
      is real, deliberate belt-and-suspenders compatibility engineering,
      not bureaucracy for its own sake - and it's exactly why a plain
      \\?\ prefix, usable by any single call site right now, doesn't
      need any of that ceremony: it only affects the one call using it.
    commands:
      - command: "python C:\\Users\\g4m3r\\AppData\\Local\\Temp\\claude\\c--Users-g4m3r-Documents-manufacturing-platform\\15f4b418-cd73-4206-ada3-a87483a444b6\\scratchpad\\long_path_check.py"
        explanation: "Real script, run on this machine - creates a 284-char plain path (fails) and the same path with \\?\\ (succeeds), cleaning up both"
      - command: "Get-ItemProperty -Path \"HKLM:\\SYSTEM\\CurrentControlSet\\Control\\FileSystem\" -Name \"LongPathsEnabled\""
        explanation: "PowerShell, run as Administrator to check (no admin needed to read); run as Administrator with New-ItemProperty ... -Value 1 to actually change it"
    verification:
      applicable: true
      real_output: |
        plain path length: 284
        plain path failed: [WinError 3] The system cannot find the path specified: 'C:\Users\g4m3r\AppData\Local\Temp\xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx'
        extended path length: 288
        extended-prefix path succeeded
      output_file: "verification/mastercam-phase-04/lab_long_path_check_output.txt"
      exemption_reason: ""
    connection_to_previous: >
      The unit above showed a real 281-character path failing during a
      real pip install; this unit reproduces the identical failure mode
      directly, on demand, and proves exactly which real mechanism
      (LongPathsEnabled + manifest opt-in) would have prevented it.

closing:
  connect_the_pieces: >
    Trace one real fact through both units: a 281-character path (unit
    one) failed for the exact same structural reason a deliberately
    constructed 284-character path fails right now on this machine (unit
    two) - and the exact same fix that makes the second one succeed with
    a \\?\ prefix is what LongPathsEnabled=1 makes automatic, machine-wide,
    for every longPathAware process, including the python.exe pip runs
    under.
  next_lesson_pointer: >
    Once LongPathsEnabled is actually set to 1 (verified via the same
    PowerShell check used throughout this lesson) and a fresh terminal
    session started, retrying `pip install PySide6-Addons` is the real
    next step before Lesson M4.6's browser-embedding work can begin.
