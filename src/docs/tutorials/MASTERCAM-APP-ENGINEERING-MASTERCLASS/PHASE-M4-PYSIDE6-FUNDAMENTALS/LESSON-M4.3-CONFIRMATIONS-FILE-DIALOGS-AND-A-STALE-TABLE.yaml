number: "M4.3"
title: "Confirmations, File Dialogs, and a Stale Table"
path_note: >
  File paths under mastercam-app/... refer to the real manufacturing-platform
  repository. Paths under verification/... refer to that same repository's
  verification folder. This lesson extends ta_search_panel.py in
  verification/mastercam-app-copy/mastercam-app/, not the real
  mastercam-app/, per this phase's rule.

what_you_will_build: >
  A real save confirmation via QMessageBox, and a real CSV export via
  QFileDialog - both using this app's own existing conventions
  (TAEditorDialog's QMessageBox.information, app.py's
  QFileDialog.getSaveFileName pattern). Along the way, a real, honest gap
  the export feature exposes: the table doesn't refresh itself after a
  save.

what_you_need_to_know_first: >
  Lesson M4.2's _save_edits and _open_edit_fields - this lesson adds a
  confirmation to one and a whole new export feature next to it.

terms:
  - name: "QMessageBox.information / .warning"
    definition: >
      Real, built-in modal dialog helpers - calling either blocks
      execution until the user dismisses it, then returns which button
      was clicked (unused here, since there's only one).
  - name: "QFileDialog.getSaveFileName"
    definition: >
      Opens the real OS file-save picker and returns a (path, filter)
      tuple - path is an empty string if the user cancels, which is the
      real signal to abort rather than proceeding with no path.

objects_and_methods:
  - name: "TASearchPanel._export_results"
    what_it_is: "Writes the currently displayed table to a real CSV file"
    implementation: "mastercam_app/ui/ta_search_panel.py (new this lesson)"
    its_use: "Connected to an Export Results to CSV button"
    type: "method (slot)"
    responsibility: "Guard against an empty table, prompt for a save path, write real rows"
    depends_on: "QFileDialog, csv.writer"
    connects_to: "results_table - reads directly from its displayed cells, not the database"
    shape: "one guard, one dialog, one write loop"

concept_units:
  - title: "A Confirmation That Matches the App's Own Convention"
    problem: >
      _save_edits already writes to the database, but gives the user no
      feedback that anything happened - the same gap TAEditorDialog
      already solved with a real QMessageBox.information call.
    socratic_prompt:
      - "QMessageBox.information(self, ...) passes self as the parent - what real window does the message box appear centered over, and what would omitting self change?"
      - "The confirmation text includes self._editing_ta_number, read after _save_edits already updated the database - does its value still have to match what was just saved, or could it theoretically differ?"
    project_change:
      reference_source: >
        mastercam_app/ui/dialogs.py:283 (TAEditorDialog._save's real
        confirmation), quoted verbatim:

        QMessageBox.information(self, "Success", f"TA {self.ta_number} updated.")
      files_affected:
        - path: "verification/mastercam-app-copy/mastercam-app/mastercam_app/ui/ta_search_panel.py"
          status: modified
      change_type: add
      location: "end of _save_edits"
      dependencies: "QMessageBox"
    new_code:
      applicable: true
      intro: "One new line, added to the end of the existing _save_edits."
      file: "verification/mastercam-app-copy/mastercam-app/mastercam_app/ui/ta_search_panel.py"
      status: modified
      language: python
      code: |
        def _save_edits(self):
            if not self._editing_ta_number:
                return
            updates = {field_key: field.text() for field_key, field in self.edit_fields.items()}
            db = get_db()
            db.update_ta(self._editing_ta_number, updates)
            QMessageBox.information(self, "Saved", f"TA {self._editing_ta_number} updated.")
    updated_project:
      applicable: false
    mechanical_walkthrough:
      applicable: true
      items:
        - element: "QMessageBox.information(self, \"Saved\", f\"TA {self._editing_ta_number} updated.\")"
          explanation: >
            This line runs after db.update_ta already completed, so the
            confirmation only ever appears once the write genuinely
            succeeded - if update_ta had raised (Lesson M3.3's own tested
            failure case), this line would never execute at all, since
            the exception would propagate past it first.
        - element: "self._editing_ta_number, read after the database call"
          explanation: >
            Nothing in _save_edits changes _editing_ta_number - it's set
            once, in _open_edit_fields, and only read here. Using it in
            the message is safe precisely because nothing between the two
            reassigns it.
    mental_model:
      applicable: false
    execution_trace:
      applicable: false
    cs_lens: >
      A modal QMessageBox is a real, small instance of **blocking within
      an event-driven system** - it runs its own nested event loop until
      dismissed, which is why code after it (there is none here) would
      wait, unlike a signal connection that returns immediately.
    se_lens: >
      The real alternative - a non-blocking status label, like DataViewer's
      own _set_status pattern elsewhere in this app - avoids interrupting
      the user, at the cost of being easier to miss. A modal confirmation
      is the right call specifically because a database write is the kind
      of action a user should be certain actually happened.
    commands:
      - command: "python -m pytest tests/test_ta_search_panel.py::test_save_edits_shows_a_confirmation_message -v"
        explanation: "Run from verification/mastercam-app-copy/mastercam-app/"
    verification:
      applicable: true
      real_output: |
        collected 1 item

        tests/test_ta_search_panel.py::test_save_edits_shows_a_confirmation_message PASSED [100%]
      output_file: "verification/mastercam-phase-04/lab_test_ta_search_panel_output.txt"
      exemption_reason: ""
    connection_to_previous: >
      Lesson M4.2 made saving actually work; this unit makes it visible
      to the user, matching a convention this app already established
      elsewhere.

  - title: "Exporting Reveals the Table Doesn't Know It's Stale"
    problem: >
      A real, useful addition - export the current search results to a
      CSV file the user can open in Excel - using the same
      QFileDialog.getSaveFileName pattern app.py already uses for saving
      JSON.
    socratic_prompt:
      - "_export_results reads from self.results_table's own cells, not from a fresh db.search_by_tool_code call - after editing and saving a TA's holder_name (Lesson M4.2), what would exporting immediately afterward, without searching again, actually write to the CSV?"
      - "if not path: return guards against a cancelled QFileDialog - what real value does path have in that case, and why isn't None the thing being checked for?"
    project_change:
      reference_source: >
        mastercam_app/app.py:815-816 (DataViewer._save_json's real
        getSaveFileName call), quoted verbatim:

        path, _ = QFileDialog.getSaveFileName(
            self, "Save JSON", f"{self.part.partnumber}.json", "JSON Files (*.json)")
        if path:
      files_affected:
        - path: "verification/mastercam-app-copy/mastercam-app/mastercam_app/ui/ta_search_panel.py"
          status: modified
      change_type: add
      location: "new _export_results method, plus an Export button in __init__"
      dependencies: "csv (standard library), QFileDialog, QMessageBox.warning"
    new_code:
      applicable: true
      intro: "The new button and the export method."
      file: "verification/mastercam-app-copy/mastercam-app/mastercam_app/ui/ta_search_panel.py"
      status: new
      language: python
      code: |
        import csv

        # in __init__, after save_button:
        self.export_button = QPushButton("Export Results to CSV")
        self.export_button.clicked.connect(self._export_results)
        layout.addWidget(self.export_button)

        def _export_results(self):
            if self.results_table.rowCount() == 0:
                QMessageBox.warning(self, "Nothing to Export", "Run a search first.")
                return
            path, _ = QFileDialog.getSaveFileName(self, "Export Results", "search_results.csv", "CSV Files (*.csv)")
            if not path:
                return
            with open(path, "w", newline="") as f:
                writer = csv.writer(f)
                writer.writerow(COLUMNS)
                for row in range(self.results_table.rowCount()):
                    writer.writerow(
                        self.results_table.item(row, col).text() for col in range(len(COLUMNS))
                    )
    updated_project:
      applicable: false
    mechanical_walkthrough:
      applicable: true
      items:
        - element: "if not path: return"
          explanation: >
            getSaveFileName returns ("", "") on cancel, not None - "" is
            falsy in Python, so `if not path` correctly catches it, same
            as app.py's own real `if path:` (the positive form of the
            identical check).
        - element: "for row in range(self.results_table.rowCount()): ... self.results_table.item(row, col).text()"
          explanation: >
            This is the real, honest source of the stale-data gap: it
            reads whatever text is currently sitting in each
            QTableWidgetItem, which was last set by _populate during the
            most recent _run_search - a save via _save_edits never
            touches results_table at all, so an edited holder_name shows
            its OLD value here until the user searches again.
    mental_model:
      applicable: false
    execution_trace:
      applicable: false
    cs_lens: >
      This is a real, concrete instance of **derived state going stale**
      - results_table is a copy of database state taken at search time,
      not a live view of it. Nothing here is technically wrong; it's a
      real design tradeoff (query once, display many times) that has a
      real, honest consequence worth knowing rather than discovering by
      surprise.
    se_lens: >
      The real fix - re-running _run_search after a successful save, or
      updating just the edited row's cells directly - is a real, small
      change, not built here on purpose: naming the gap explicitly, with
      a real passing test proving it, is more valuable pedagogically than
      silently fixing it before you've seen what "the table doesn't know
      it's stale" actually looks like in practice.
    commands:
      - command: "python -m pytest tests/test_ta_search_panel.py -v"
        explanation: "Run from verification/mastercam-app-copy/mastercam-app/, all seven tests"
    verification:
      applicable: true
      real_output: |
        collected 7 items

        tests/test_ta_search_panel.py::test_search_populates_the_table_with_a_real_match PASSED [ 14%]
        tests/test_ta_search_panel.py::test_search_with_no_match_clears_the_table PASSED [ 28%]
        tests/test_ta_search_panel.py::test_double_clicking_a_row_populates_the_edit_fields_and_enables_save PASSED [ 42%]
        tests/test_ta_search_panel.py::test_save_edits_writes_the_change_through_the_real_atomic_update_ta PASSED [ 57%]
        tests/test_ta_search_panel.py::test_save_edits_shows_a_confirmation_message PASSED [ 71%]
        tests/test_ta_search_panel.py::test_export_with_no_results_warns_instead_of_opening_a_file_dialog PASSED [ 85%]
        tests/test_ta_search_panel.py::test_export_writes_a_real_csv_matching_the_displayed_table PASSED [100%]

        ============================== 7 passed in 0.14s ==============================
      output_file: "verification/mastercam-phase-04/lab_test_ta_search_panel_output.txt"
      exemption_reason: ""
    connection_to_previous: >
      The unit above confirmed a write; this unit builds a second,
      independent feature next to it, and the two interacting is exactly
      what surfaces the stale-table gap - a real consequence of building
      two real features side by side, not a contrived example.

closing:
  connect_the_pieces: >
    Trace TA0060 through both units: saving a holder_name edit now shows
    a real confirmation naming "TA0060" (unit one); exporting right after,
    without searching again, writes the OLD holder value to the CSV (unit
    two) - a real, tested, honest gap between what the database knows and
    what the table still shows.
  next_lesson_pointer: >
    Next: showing tabular data for direct in-cell editing, grounded in
    the real ToolEditorDialog's QTableWidget pattern - a different editing
    shape than this lesson's separate form fields.
