number: "M2.4"
title: "A Test That Passes Only When Code Fails Correctly"
path_note: >
  File paths under mastercam-app/... refer to the real
  manufacturing-platform repository's mastercam-app folder. Paths under
  verification/... refer to that same repository's verification folder.
  As in Lessons M2.1-M2.3, nothing under mastercam-app/ is applied to
  the real app by this lesson - the real, concrete addition shown here
  is something you type into the real app yourself.

what_you_will_build: >
  Three small, real, throwaway pytest files, each proving a different
  real, possible outcome of `pytest.raises` - the real exception you
  expected actually happens, the wrong real exception happens instead,
  or nothing raises at all. Then a real, concrete proposal wiring
  Lesson M2.1's own `sys.excepthook`, Lesson M2.2's own `sys.stdout`
  redirect, and Lesson M2.3's own `ErrorTerminalDialog` into one, real,
  working whole - and a real, proposed test proving that whole mechanism
  actually works, not just reads correctly. The transferable problem:
  Lesson M1's own real tests all proved "given this input, this exact
  real output comes back" - this phase needs a genuinely different real
  claim: "given this input, this specific real failure happens, on
  purpose, and nothing else" - and mastercam-app/tests/test_sequence.py
  already used exactly this once, in Lesson M1.4's own real
  `test_add_operation_raises_when_both_program_key_and_op_number_are_none`,
  without this phase ever having explained it yet.

what_you_need_to_know_first: >
  Lesson M0.2's own real pytest test-function/discovery basics; Lessons
  M2.1-M2.3's own real `sys.excepthook`/`sys.stdout`/`ErrorTerminalDialog`
  mechanism, all three of which this lesson's own second unit wires
  together for the first time.

terms:
  - name: context manager
    definition: >
      A real object usable directly after Python's own real `with`
      keyword, defining what real setup happens the moment the `with`
      block begins, and what real teardown or checking happens the
      moment it ends - regardless of whether the code inside the block
      finished normally or raised. `pytest.raises(SomeError)` (Objects
      and methods, below) is a real, concrete example: its own real
      teardown is what actually decides whether the test passes.
  - name: "PySide6 basics (this lesson)"
    definition: >
      Per this project's own project_overrides (prompts.yaml), these
      PySide6 names are used here only for their ordinary, documented
      role, with no Lens or walkthrough in this lesson depending on how
      any of them actually works internally: `PySide6`, `QTextEdit`,
      `QVBoxLayout`, `QtCore`, `QtWidgets`.

objects_and_methods:
  - name: pytest.raises
    what_it_is: >
      A real, callable function from the real `pytest` package, used
      directly after `with` - not to catch and discard a real exception,
      but to make "a specific real exception happens here" the actual,
      real thing being tested.
    implementation: >
      `with pytest.raises(SomeExceptionType): <code expected to raise
      SomeExceptionType>`. Real, internally: enters a real context
      manager (Terms, above) that suppresses exactly the given real
      exception type if it's raised inside the block, and separately
      fails the test - loudly, with a real, specific message - if
      either the wrong real exception type is raised instead, or if
      nothing raises at all.
    its_use: >
      This lesson's own first unit, below, proves all three of those
      real outcomes directly, before this app's own real
      `test_add_operation_raises_when_both_program_key_and_op_number_are_none`
      (already written, already passing, Lesson M1.4) gets its own real,
      full explanation for the first time.
    type: A real function from the `pytest` package, used as a context manager.
    responsibility: >
      Turn "this real code is supposed to fail, this specific way" into
      a real, checkable, automated claim - the identical real spirit as
      an ordinary `assert` (Lesson M0.2), applied to failure itself
      instead of to a returned value.
    depends_on: >
      A real exception type (or tuple of types) to expect, and a real
      block of code, indented under it, that's supposed to raise
      exactly that.
    connects_to: >
      Wraps real, ordinary code the same way any other real `with` block
      does - the real code inside it is unaware it's being tested at
      all; `pytest.raises` observes what happens to it from the outside.
    shape: >
      When the expected real exception happens, the `with` block exits
      normally and the test proceeds - real, additional access to the
      caught exception (its message, its attributes) is available via
      `as exc_info`, not needed by any real test in this phase's own
      suite.

concept_units:
  - title: "pytest.raises Passes on the Right Failure and Fails on Anything Else"
    problem: >
      This phase's own real, upcoming test - proving `sys.excepthook`
      genuinely gets called - needs a real way to say "this specific
      code is supposed to raise `ValueError`, and if it doesn't, or
      raises something else instead, that itself is a real test
      failure." Before any real tool is shown: if a real test just did
      `try: divide(1, 0) \n except ZeroDivisionError: pass` to check for
      an expected real failure, what real, concrete case would that
      *not* actually catch as a real problem, that a genuinely careful
      test should?
    socratic_prompt:
      - "If a real test only checks \"did *some* exception happen,\" without checking *which* one, what real, wrong code could still make that test pass?"
      - "If a real test expects an exception but the real code being tested doesn't actually raise one at all - succeeding instead - should that count as the test passing, or failing?"
      - "Given both of those, what real, minimum two pieces of information would a genuinely careful \"this should fail\" test need to check?"
    project_change:
      reference_source: >
        No reference counterpart - three from-scratch, throwaway test
        files, each proving one real, distinct outcome of
        `pytest.raises`, before this app's own real, already-written use
        of it (Lesson M1.4) gets explained.
      files_affected:
        - path: verification/mastercam-phase-02/lab_pytest_raises.py
          status: new
        - path: verification/mastercam-phase-02/lab_pytest_raises_no_exception.py
          status: new
      change_type: add
      location: New files, no existing project to place them within.
      dependencies: pytest, already installed and used throughout this curriculum.
    new_code:
      applicable: true
      intro: >
        Two small, real, throwaway test files, typed fresh - the first
        with one real test that correctly expects `ZeroDivisionError`,
        and one that deliberately expects the wrong real type; the
        second with a real test expecting a real failure that never
        actually happens:
      files:
        - file: verification/mastercam-phase-02/lab_pytest_raises.py
          status: new
          code: |
            import pytest


            def divide(a, b):
                return a / b


            def test_dividing_by_zero_raises_zero_division_error():
                with pytest.raises(ZeroDivisionError):
                    divide(1, 0)


            def test_this_one_is_deliberately_wrong_to_show_a_real_failure():
                with pytest.raises(ValueError):
                    divide(1, 0)
        - file: verification/mastercam-phase-02/lab_pytest_raises_no_exception.py
          status: new
          code: |
            import pytest


            def divide(a, b):
                return a / b


            def test_expects_a_crash_that_never_happens():
                with pytest.raises(ZeroDivisionError):
                    divide(4, 2)
      language: python
    updated_project:
      applicable: false
    mechanical_walkthrough:
      applicable: true
      items:
        - element: "with pytest.raises(ZeroDivisionError): divide(1, 0)"
          explanation: >
            Full treatment above (Objects and methods) - `divide(1, 0)`
            really does raise a real `ZeroDivisionError` (dividing by
            zero is never valid), and this real exception type matches
            exactly what was expected, so this real test passes,
            confirmed directly in Verification, below.
        - element: "with pytest.raises(ValueError): divide(1, 0)"
          explanation: >
            The identical real code, `divide(1, 0)`, still raises the
            identical real `ZeroDivisionError` - but this real test
            expected `ValueError` instead. Confirmed in Verification,
            below, `pytest.raises` treats a *mismatched* real exception
            type as a genuine test failure, reporting the real exception
            that actually happened (`ZeroDivisionError`) rather than
            silently accepting "well, something raised."
        - element: "with pytest.raises(ZeroDivisionError): divide(4, 2)"
          explanation: >
            `divide(4, 2)` succeeds normally, returning `2.0` - no real
            exception happens inside this `with` block at all. Confirmed
            in Verification, below, `pytest.raises` fails this real test
            too, with a real, specific message: `DID NOT RAISE`.
    mental_model:
      applicable: false
    execution_trace:
      applicable: false
    cs_lens: >
      This is testing a real **negative space** claim - not "this
      returns the right value," but "this specific, real failure mode is
      the one that happens, and only that one." Also recognized in: a
      real fire-alarm test deliberately setting off smoke, then checking
      that specifically the alarm (not, say, the sprinklers) is what
      responds, a real, structural stress test proving a beam fails at
      the *predicted* real load and in the predicted real way, not just
      "eventually," and a real security audit proving a login attempt
      with a wrong real password is *rejected*, specifically, rather
      than merely "not accepted."
    se_lens: >
      The real design principle: **a test expecting failure has to be
      exactly as specific about which failure as a test expecting
      success is about which value**. The real alternative not chosen:
      a bare `try`/`except Exception: pass` around the code under test,
      treating any real exception at all as "good enough." That
      alternative's real, honest cost, made concrete by this unit's own
      second file: it would have let `divide(1, 0)` pass a test written
      to check for `ValueError`, even though the real code actually
      raises something completely different - silently hiding a real
      mismatch between what a test *says* it's checking and what it
      *actually* checks.
    commands:
      - command: "python -m pytest verification/mastercam-phase-02/lab_pytest_raises.py -v"
        explanation: >
          Runs the real, throwaway file containing both the correct and
          the deliberately wrong real test, from inside
          manufacturing-platform's own repo root.
      - command: "python -m pytest verification/mastercam-phase-02/lab_pytest_raises_no_exception.py -v"
        explanation: >
          Runs the second real, throwaway file, whose one real test
          expects a failure that never actually happens.
    verification:
      applicable: true
      real_output: |
