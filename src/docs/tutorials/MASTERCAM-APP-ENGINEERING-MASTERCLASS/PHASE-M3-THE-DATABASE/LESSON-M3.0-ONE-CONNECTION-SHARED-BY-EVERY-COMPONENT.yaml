number: "M3.0"
title: "One Connection, Shared by Every Component"
path_note: >
  File paths under mastercam-app/... refer to the real manufacturing-platform
  repository. Paths under verification/... refer to that same repository's
  verification folder. All code in this lesson is added to
  verification/mastercam-app-copy/mastercam-app/ only - never to the real
  mastercam-app/, per this phase's own rule: the real app is yours to type
  into once you understand a piece, not somewhere Claude writes to.

what_you_will_build: >
  Nothing new yet - this lesson is orientation. You'll read the real,
  already-existing database layer (mastercam_app/db/) closely enough to
  predict its behavior before touching it, and pick up the basic SQL
  vocabulary this whole phase leans on, taught directly against the real
  schema instead of a generic textbook example.

what_you_need_to_know_first: >
  What a dataclass is and how a real XML file becomes one (Phase M1). No
  SQL knowledge assumed beyond having seen a SELECT statement before.

terms:
  - name: "Table"
    definition: >
      A named, fixed-shape collection of rows - each row has the same
      columns. `tas` is a table; each row in it is one tool assembly.
  - name: "PRIMARY KEY"
    definition: >
      The column (or columns) that uniquely identifies a row - no two
      rows can share one, and SQLite uses it to look rows up fast. Not
      decorative: it's what makes "the row for TA0042" a well-defined
      question.
  - name: "FOREIGN KEY"
    definition: >
      A column whose value is required to match a PRIMARY KEY in another
      table - a real, enforced link between two tables, not just a
      naming convention. SQLite only enforces this when
      `PRAGMA foreign_keys=ON` has actually been run on that connection.
  - name: "INDEX"
    definition: >
      A separate, maintained lookup structure over one or more columns,
      built so a query filtering on those columns doesn't have to scan
      every row. A table works without one; the query is just slower.
  - name: "Upsert (ON CONFLICT ... DO UPDATE)"
    definition: >
      One statement that inserts a new row, or updates an existing row
      if the primary key already exists - avoiding a separate "does this
      already exist?" check before every write.

objects_and_methods:
  - name: "Database"
    what_it_is: "A thin wrapper class around one sqlite3 connection"
    implementation: "mastercam_app/db/database.py:111"
    its_use: "Every real read/write to mastercam.db goes through an instance of this"
    type: "class"
    responsibility: "Own the schema, and expose one method per real query/write the app needs"
    depends_on: "sqlite3, mastercam_app/db/balloons.py"
    connects_to: "get_db() in connection.py, which owns the one real instance"
    shape: "one connection, many narrow public methods"
  - name: "get_db"
    what_it_is: "The function every UI component calls to get the database"
    implementation: "mastercam_app/db/connection.py:157"
    its_use: "Returns the same Database instance every time, opening it only once"
    type: "function"
    responsibility: "Guarantee there is exactly one open connection for the whole app's lifetime"
    depends_on: "_open_db(), a module-level global"
    connects_to: "Database.__init__"
    shape: "lazy singleton"

concept_units:
  - title: "The Database Is Opened Once, Not Once Per Query"
    problem: >
      If every part of the UI that needs data opened its own
      sqlite3.connect(), you'd have dozens of open connections to the
      same file, no shared cache, and no single place to reason about
      the connection's PRAGMAs (WAL mode, foreign keys). Something has
      to own exactly one connection and hand it out.
    socratic_prompt:
      - "If get_db() is called from three different windows in the UI, how many real sqlite3 connections actually get opened?"
      - "What real problem would you have if the answer were 'three' instead of 'one'?"
    project_change:
      reference_source: >
        mastercam_app/db/connection.py:157-167 (get_db), quoted verbatim:

        def get_db() -> Optional[Database]:
            global _DB, _DB_ERROR
            if _DB is not None:
                return _DB
            try:
                _DB = _open_db()
                _DB_ERROR = None
            except Exception as e:
                _DB_ERROR = str(e)
                _DB = None
            return _DB
      files_affected:
        - path: "mastercam-app/mastercam_app/db/connection.py"
          status: existing
      change_type: none
      location: "module level, connection.py"
      dependencies: "none - reading only, this unit adds no code"
    new_code:
      applicable: false
    updated_project:
      applicable: false
    mechanical_walkthrough:
      applicable: true
      items:
        - element: "global _DB, _DB_ERROR"
          explanation: >
            Without this, assigning to _DB inside the function would create
            a new *local* variable named _DB instead of changing the
            module-level one - the cache would never actually take effect,
            and get_db() would silently reopen the database every single
            call. This line is the entire reason the caching works at all.
        - element: "if _DB is not None: return _DB"
          explanation: >
            The whole singleton guarantee is this one check. First call:
            _DB is None, so it falls through and opens a real connection.
            Every call after that: _DB is already set, so it returns
            immediately without touching sqlite3 again.
        - element: "except Exception as e: _DB_ERROR = str(e); _DB = None"
          explanation: >
            A failed open doesn't raise up into the caller and crash the
            UI - it's recorded as a string the UI can display, and _DB
            stays None so the *next* call to get_db() will try to open
            again instead of being stuck on a failure forever.
    mental_model:
      applicable: true
      diagram: |
        First call to get_db():
          _DB is None  -->  _open_db() runs for real  -->  _DB = the real Database
          returns the real Database

        Every call after that:
          _DB is not None  -->  return _DB immediately
          (sqlite3.connect is never called again)
    execution_trace:
      applicable: false
    cs_lens: >
      This is the **singleton pattern** - exactly one instance of
      something, created lazily on first use and reused after that. It
      shows up anywhere opening the real resource is expensive or must
      be shared: a database connection here, but the same shape appears
      for a logging handler, a thread pool, or a hardware device handle.
    se_lens: >
      The real alternative is dependency injection - create the Database
      once in main() and pass it explicitly to every window that needs
      it. That's more testable (no hidden global state, an isolated test
      can pass in its own instance) but means threading a `db` parameter
      through every constructor in the UI. This codebase chose the
      global-singleton shape instead - simpler call sites, at the real
      cost of hidden coupling: any code, anywhere, can call get_db() and
      you can't see that dependency from a function's signature.
    commands:
      - command: "python -c \"from mastercam_app.db.database import Database; db = Database(':memory:'); print(type(db._conn))\""
        explanation: "Confirms Database wraps a real sqlite3.Connection, run in isolation with no real file involved"
    verification:
      applicable: true
      real_output: |
        <class 'sqlite3.Connection'>
      output_file: "verification/mastercam-phase-03/lab_database_wraps_sqlite3_connection_output.txt"
      exemption_reason: ""
    connection_to_previous: >
      Phase M1 tested Part/Sequence/Operation - real Python objects built
      from parsed XML. This phase starts on what those objects turn into
      once they're saved: real rows, in a real, shared database.

  - title: "Reading the Real Schema Teaches the SQL Vocabulary"
    problem: >
      You know basic SQL, but "basic" and "read this real, 250-line
      CREATE TABLE script correctly" are different skills. Before writing
      a single test against this database, you need to be able to read
      its actual schema and say what each real constraint means.
    socratic_prompt:
      - "In the tas table below, what real column is the PRIMARY KEY, and what does that guarantee about ta_number that no other column has?"
      - "ta_parts has a FOREIGN KEY on ta_number pointing at tas.ta_number - what real row would SQLite refuse to insert into ta_parts, and why?"
    project_change:
      reference_source: >
        mastercam_app/db/database.py:132-163 (Database._create_schema,
        first two tables), quoted verbatim:

        CREATE TABLE IF NOT EXISTS parts (
            partnumber   TEXT PRIMARY KEY,
            rev          TEXT,
            description  TEXT,
            programnumber TEXT,
            programmer   TEXT,
            machine      TEXT,
            uploaded_at  TEXT
        );

        CREATE TABLE IF NOT EXISTS tas (
            ta_number    TEXT PRIMARY KEY,
            holder_name  TEXT,
            holder_catalog TEXT,
            holder_manufacturer TEXT,
            tool_code    TEXT,
            tool_comment TEXT,
            tool_diameter TEXT,
            tool_type    TEXT,
            tool_oal     TEXT,
            tool_flutes  TEXT,
            stick_out    TEXT,
            first_seen   TEXT,
            last_seen    TEXT
        );

        -- fingerprint index for fast duplicate detection
        CREATE INDEX IF NOT EXISTS idx_tas_fingerprint
            ON tas (holder_name, tool_code, stick_out);
      files_affected:
        - path: "mastercam-app/mastercam_app/db/database.py"
          status: existing
      change_type: none
      location: "Database._create_schema"
      dependencies: "none - reading only, this unit adds no code"
    new_code:
      applicable: false
    updated_project:
      applicable: false
    mechanical_walkthrough:
      applicable: true
      items:
        - element: "partnumber TEXT PRIMARY KEY"
          explanation: >
            partnumber is the whole identity of a row in parts - two rows
            can never share one, and SQLite will reject a second INSERT
            with the same partnumber unless it's an explicit upsert (the
            next lesson covers save_part's ON CONFLICT clause that relies
            on exactly this).
        - element: "CREATE INDEX IF NOT EXISTS idx_tas_fingerprint ON tas (holder_name, tool_code, stick_out)"
          explanation: >
            This index doesn't change what queries are *allowed* - a query
            filtering on holder_name/tool_code/stick_out would still work
            without it. It changes how fast: without it, checking whether
            a fingerprint already exists means scanning every row in tas;
            with it, SQLite can jump straight to matching rows. This one
            exists specifically because that fingerprint check happens on
            every real save (Lesson M3.3).
    mental_model:
      applicable: false
    execution_trace:
      applicable: false
    cs_lens: >
      An index is the same idea as a book's index versus reading every
      page to find a topic - a small, separately-maintained structure
      that trades write cost (every insert must also update the index)
      for read speed. This tradeoff - build once, benefit on every
      future lookup - is the same shape as memoization or a hash table's
      internal bucket structure.
    se_lens: >
      The real alternative to a real, enforced PRIMARY KEY/FOREIGN KEY is
      "just be careful in application code" - trust that every INSERT
      already checked for duplicates and valid references by hand. The
      real cost of the enforced version: SQLite will raise a real
      exception the moment code tries to violate it, which means bugs
      surface immediately at the write, not later as silently corrupted
      data discovered during some unrelated query.
    commands:
      - command: "python -c \"from mastercam_app.db.database import Database; db = Database(':memory:'); print([r['name'] for r in db._conn.execute(\\\"SELECT name FROM sqlite_master WHERE type='table' ORDER BY name\\\")])\""
        explanation: "Lists every real table this schema actually creates, run against an in-memory database so no real file is touched"
    verification:
      applicable: true
      real_output: |
        ['balloon_changes', 'balloons', 'parsed_parts', 'part_changes', 'part_edits', 'part_versions', 'parts', 'pdf_paths', 'sqlite_sequence', 'ta_changes', 'ta_parts', 'tas']
      output_file: "verification/mastercam-phase-03/lab_real_table_list_output.txt"
      exemption_reason: ""
    connection_to_previous: >
      The singleton from the unit above hands out one Database instance;
      this unit is what that instance's schema actually looks like -
      twelve real tables, two of them (balloons, balloon_changes) owned
      by a second migration this phase gets to later.

closing:
  connect_the_pieces: >
    Trace ta_number "TA0042" through both units: get_db() would hand you
    the one real Database instance holding it; inside that instance,
    tas.ta_number PRIMARY KEY is what guarantees "TA0042" identifies
    exactly one row, and idx_tas_fingerprint is what makes checking
    whether some (holder, code, stickout) combination already resolves
    to it fast instead of a full table scan.
  next_lesson_pointer: >
    Next: writing the first real, permanent tests against this schema -
    starting with save_part, the method that turns a parsed XML part into
    real rows.
