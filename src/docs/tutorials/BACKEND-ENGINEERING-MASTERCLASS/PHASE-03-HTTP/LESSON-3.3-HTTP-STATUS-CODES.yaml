number: "3.3"
title: "HTTP Status Codes"
path_note: >
  File paths under backend/... refer to the real manufacturing-platform
  repository. Paths under verification/... refer to that same
  repository's verification folder.

what_you_will_build: >
  Five real, run checks against this project's own real
  `backend/app/routes/machines.py` routes, each isolating one real
  family of HTTP status code (`2xx`, `400` vs `422`, `401` vs `403`,
  `404` vs `409`, and a real `5xx`) - and, along the way, two genuine,
  previously-undocumented findings: this project's own real code never
  returns a `204`, and collapses both a genuinely missing field and a
  genuinely invalid one into the identical real `400`, and a real
  duplicate-resource conflict that HTTP's own `409` exists for into that
  same `400` too. The lesson closes by actually triggering, for the
  first time in this curriculum, the real, already-documented `500`
  crash in `get_machines`'s own `?type=` filter.

what_you_need_to_know_first: >
  What a client, server, request, and response are; what the five real
  HTTP methods this project's own backend supports actually do; what a
  decorator wrapping a view function can do before that function's own
  body runs.

terms:
  - name: 2xx (success)
    definition: >
      The real family of status codes whose first digit tells a caller,
      without reading anything else, that a request genuinely succeeded.
      It exists so a caller can branch on "did this work at all" using
      one digit, before ever inspecting a real response body.
  - name: 4xx (client error)
    definition: >
      The real family of status codes whose first digit tells a caller
      the real problem is with the request itself - a malformed body, a
      missing credential, a resource that doesn't exist - not with the
      server. It exists so a caller knows retrying the identical real
      request, unchanged, will fail again every time.
  - name: 5xx (server error)
    definition: >
      The real family of status codes whose first digit tells a caller
      the server itself failed to handle an otherwise valid real
      request - this lesson's own last unit triggers a genuine one. It
      exists so a caller knows the problem isn't necessarily its own
      request; retrying later, or reporting a bug, may be the right real
      response, unlike a `4xx`.
  - name: "200 (OK)"
    definition: >
      The real, generic success status: the request worked, and the
      real response body carries what was asked for. It exists as the
      default, unmarked "it worked" - used when nothing more specific
      (like a new resource being created) needs to be said.
  - name: "201 (Created)"
    definition: >
      The real success status specifically for "a new real resource now
      exists because of this request" - this lesson's own real
      `create_machine` call returns it. It exists as a more specific
      real claim than a bare `200`: not just "this worked," but "this
      worked, and it made something new."
  - name: "204 (No Content)"
    definition: >
      The real success status for "this worked, and there is genuinely
      nothing to send back" - a real response with this code carries no
      real body at all. It exists for exactly the case a `200`'s own
      real body would otherwise be empty or pointless, and this
      project's own real `DELETE` route, checked directly in this
      lesson, never actually uses it.
  - name: "400 (Bad Request)"
    definition: >
      The real status for "this request's own body or shape is wrong" -
      this lesson's own real `update_machine_status` calls return it for
      two genuinely different real reasons. It exists as the general,
      real catch-all for "I can't even process what you sent," whether
      that's a missing field or a value that doesn't parse.
  - name: "401 (Unauthorized)"
    definition: >
      The real status for "I don't know who you are" - no real
      credentials were presented at all, or the ones presented don't
      verify. It exists as a distinct real claim from `403`: the server
      genuinely cannot establish an identity to check permissions
      against yet.
  - name: "403 (Forbidden)"
    definition: >
      The real status for "I know exactly who you are, and the answer is
      still no" - a real, verified identity that simply isn't allowed to
      do this. It exists as the real, distinct case from `401` where
      authentication already succeeded and authorization is what failed.
  - name: "404 (Not Found)"
    definition: >
      The real status for "the specific resource this URL names genuinely
      doesn't exist." It exists as a claim about one specific real
      resource's real absence, distinct from a `400`'s claim about a
      malformed request.
  - name: "409 (Conflict)"
    definition: >
      The real status for "this request conflicts with the current real
      state of the resource" - the standard, real code for a duplicate
      creation attempt. It exists as its own real category, distinct
      from a generic `400`, and this lesson's own real
      `create_machine` call, checked directly, shows this project's code
      never actually uses it, even where a real conflict genuinely
      exists.
  - name: "422 (Unprocessable Entity)"
    definition: >
      The real status for "this request is syntactically valid, but its
      real content doesn't make sense" - a well-formed real JSON body
      carrying a semantically invalid value. It exists as a more
      specific real claim than `400`'s generic "malformed," and this
      lesson's own real `update_machine_status` call, checked directly,
      shows this project's code never actually distinguishes the two.
  - name: "500 (Internal Server Error)"
    definition: >
      The real, generic status for "the server itself hit an error it
      never anticipated" while handling an otherwise valid real request
      - this lesson's own last unit triggers a genuine one. It exists as
      the real catch-all for a server-side failure a client had no way
      to predict or avoid, unlike any `4xx`.

objects_and_methods:
  - name: FlaskClient (.get / .post / .put / .delete)
    what_it_is: >
      The real test client this project's own `app.test_client()`
      returns - the same real class this curriculum has already used,
      here sending real requests specifically to observe which real
      status code each one gets back.
    implementation: >
      `.get(path)`, `.post(path, json=...)`, `.put(path, json=...)`, and
      `.delete(path)` are real methods on `FlaskClient`, each simulating
      a real HTTP request of that method; every real call in this lesson
      reads the resulting `Response`'s own real `.status_code`.
    its_use: >
      This lesson calls whichever of these four real methods a given
      unit's own real route actually requires, always reading the real
      status code that comes back as the unit's own central specimen.
    type: Four real instance methods on `FlaskClient`.
    responsibility: >
      Simulating a real, complete HTTP request and handing back the real
      `Response` a genuine caller would receive, status code included.
    depends_on: >
      A fully-built `Flask` app instance; a real path; an optional real
      JSON body and headers dict.
    connects_to: >
      Every real request in this lesson goes through one of these four
      methods; each one's own real `Response.status_code` is what every
      unit in this lesson actually inspects.
    shape: >
      Takes a real path (and optional body/headers) in; returns one real
      `Response` object out, whose `.status_code` is a real `int`.

  - name: get_machine
    what_it_is: >
      A real, existing Flask view function retrieving one machine by ID.
    implementation: >
      `@machines_bp.route('/<string:machine_id>', methods=['GET'])`
      `def get_machine(current_user, machine_id: str): ...`
      (`backend/app/routes/machines.py:48-61`) - returns a real `404`
      with an error dict if the machine doesn't exist, or a real `200`
      with the machine's own real data.
    its_use: >
      This lesson calls it once, against a real, existing machine,
      specifically to name its real `200` as the baseline "this worked,
      here's the data" success case.
    type: A Flask view function, decorated with `@token_required`.
    responsibility: >
      Reading exactly one real machine's current data by ID, with no
      real side effect of its own.
    depends_on: A real `machine_id` matched from the request URL.
    connects_to: >
      Also wrapped by `token_required`; its real `200`/`404` pair is the
      first real contrast this lesson's own first unit draws on.
    shape: >
      Takes a `machine_id` string in; returns a real dict, wrapped in
      `jsonify`, with an implicit `200`, or a real error dict with an
      explicit `404`.

  - name: create_machine
    what_it_is: >
      A real, existing Flask view function creating a new machine.
    implementation: >
      `@machines_bp.route('', methods=['POST'])`
      `def create_machine(current_user): ...`
      (`backend/app/routes/machines.py:118-169`) - validates required
      fields (returning a real `400` if any are missing,
      `machines.py:130-132`), checks for a real, already-existing ID
      (returning a real `400` again, `machines.py:135-137`, rather than
      a real `409`), and otherwise commits a real new `Machine` row,
      returning `201`.
    its_use: >
      This lesson calls it against a genuinely new ID (to name its real
      `201`) and again against an ID that already exists (to show its
      real duplicate-conflict branch returning `400` instead of `409`).
    type: A Flask view function, decorated with `@token_required`.
    responsibility: >
      Validating a real new-machine request and creating exactly one
      real `Machine` row, or reporting a specific real reason it
      couldn't.
    depends_on: >
      A real, valid JSON body; `token_required`'s own real decision about
      whether this specific request is allowed through at all.
    connects_to: >
      Wrapped by `token_required(allowed_roles=['programming', 'admin'])`;
      its two real `400` branches (missing field, duplicate ID) are what
      this lesson's own `400`-vs-`422` and `404`-vs-`409` units each draw
      evidence from.
    shape: >
      Reads a real dict in; returns a real, `jsonify`-wrapped dict with
      an explicit `201` on success, or a real `400` error dict.

  - name: delete_machine
    what_it_is: >
      A real, existing Flask view function deleting a machine.
    implementation: >
      `@machines_bp.route('/<string:machine_id>', methods=['DELETE'])`
      `def delete_machine(current_user, machine_id: str): ...`
      (`backend/app/routes/machines.py:274-297`) - returns a real `404`
      if the machine doesn't exist, otherwise deletes the real row and
      returns a real `200` carrying a real `{'success': True, 'message': ...}`
      body - never a real `204`.
    its_use: >
      This lesson calls it once, against a real, existing machine,
      specifically to check what status code a successful delete
      actually gets, given that `204` exists for exactly this kind of
      case.
    type: A Flask view function, decorated with `@token_required`.
    responsibility: >
      Removing exactly one real `Machine` row, if it still exists, and
      reporting plainly if it doesn't.
    depends_on: >
      A real `machine_id` matched from the request URL; the real row's
      current existence in the database.
    connects_to: >
      Wrapped by `token_required(allowed_roles=['admin'])`; its own real
      choice of `200` over `204` is this lesson's own first unit's real
      closing specimen.
    shape: >
      Takes a real `machine_id` string in; returns a real, `jsonify`-wrapped
      `{'success': bool, ...}` dict, with an implicit `200` or an explicit
      `404`.

  - name: update_machine_status
    what_it_is: >
      A real, existing Flask view function updating a machine's status.
    implementation: >
      `@machines_bp.route('/<string:machine_id>/status', methods=['PUT'])`
      `def update_machine_status(current_user, machine_id: str): ...`
      (`backend/app/routes/machines.py:80-115`) - returns a real `400`
      if `'status'` is missing from the body at all (`machines.py:95-96`),
      and a second, real `400` - the identical status code - if
      `'status'` is present but not one of four real allowed values
      (`machines.py:98-100`).
    its_use: >
      This lesson calls it twice - once with a body missing `'status'`
      entirely, once with a body carrying a real but invalid value -
      specifically to check whether this route's own real code treats
      those two genuinely different problems any differently.
    type: A Flask view function, decorated with `@token_required`.
    responsibility: >
      Validating a real status-change request and applying it, or
      reporting a specific real reason it couldn't.
    depends_on: >
      A real, existing `Machine` row; a real JSON body.
    connects_to: >
      Its own two, separately-coded but identically-numbered real `400`
      branches are the entire real specimen this lesson's own `400`-vs-`422`
      unit is built around.
    shape: >
      Reads a real dict in; returns a real, `jsonify`-wrapped dict with
      an implicit `200` on success, or a real `400`/`404` error dict.

  - name: get_machines
    what_it_is: >
      A real, existing Flask view function listing every machine,
      with optional real query-string filters.
    implementation: >
      `@machines_bp.route('', methods=['GET'])`
      `def get_machines(current_user): ...`
      (`backend/app/routes/machines.py:14-45`) - its own real `type`
      filter (`machines.py:35-36`,
      `query.filter(Machine.type == machine_type)`) references a real
      column, `Machine.type`, that does not exist on the real `Machine`
      model at all.
    its_use: >
      This lesson calls it with a real `?type=` query parameter,
      specifically to trigger this route's own real, uncaught
      `AttributeError` and observe the genuine real `500` it produces.
    type: A Flask view function, decorated with `@token_required`.
    responsibility: >
      Reading and returning every real machine, filtered if the request
      asks - and, for this one real filter, crashing instead.
    depends_on: >
      Zero or more real query-string filters; the real `Machine` model's
      actual, real column set.
    connects_to: >
      Wrapped by `token_required`, which runs first and succeeds - the
      real crash happens entirely inside this function's own body,
      afterward.
    shape: >
      Reads real, optional query parameters in; returns a real,
      `jsonify`-wrapped dict with an implicit `200` - or, for `?type=`,
      raises a real, uncaught `AttributeError` instead of returning
      anything at all.

concept_units:
  - title: "2xx - Success, But Not All the Same Kind"
    problem: >
      Three different real requests against this project's own backend
      all succeed. Does "it worked" mean the same real thing every time,
      or does the specific real number matter?
    socratic_prompt:
      - >
        `get_machine`'s own real code returns data that already existed;
        `create_machine`'s own real code makes something that didn't
        exist a moment ago. Should a caller be able to tell those two
        real outcomes apart from the status code alone, without reading
        the body?
      - >
        `delete_machine`'s own real code (`machines.py:274-297`) returns
        a real body - `{'success': True, 'message': ...}` - on a
        successful delete. Given that HTTP has a real status code
        specifically for "it worked, and there is nothing to send back,"
        what would you expect this route to use instead, if it did?
    project_change:
      reference_source: >
        Real specimens: `backend/app/routes/machines.py:48-61`
        (`get_machine`), `:118-169` (`create_machine`), and `:274-297`
        (`delete_machine`), all read again this session.
      files_affected: []
      change_type: none
      location: >
        N/A - a new, standalone script; no existing project structure to
        place it within.
      dependencies: >
        A real `Machine` row; a real `User` row with a `programming`
        role, and a second with an `admin` role.
    new_code:
      applicable: true
      intro: >
        Three real requests, three real successes:
      file: verification/phase-03/lab_status_2xx.py
      status: new
      language: python
      code: |
        import sys
        sys.path.insert(0, "backend")

        from app import create_app, db
        from app.models.machine import Machine
        from app.models.user import User
        from app.utils.auth_utils import encode_auth_token

        app = create_app("testing")
        with app.app_context():
            machine = Machine(id="M-TEST-001", name="Test Mill", category="mill", sub_type="3_axis", status="available")
            prog_user = User(id="U-TEST-001", email="test-prog@example.com", name="Test Programmer", role="programming")
            admin_user = User(id="U-TEST-002", email="test-admin@example.com", name="Test Admin", role="admin")
            db.session.add(machine)
            db.session.add(prog_user)
            db.session.add(admin_user)
            db.session.commit()

            token = encode_auth_token("U-TEST-001", "programming")
            headers = {"Authorization": f"Bearer {token}"}
            client = app.test_client()

            r_get = client.get("/api/machines/M-TEST-001")
            print("GET existing machine -> status:", r_get.status_code)

            r_create = client.post(
                "/api/machines",
                json={"id": "M-TEST-002", "name": "Test Lathe", "category": "lathe", "subType": "2_axis", "manufacturer": "Haas", "model": "ST-10"},
                headers=headers,
            )
            print("POST new machine -> status:", r_create.status_code, "body has 'data':", "data" in r_create.get_json())

            admin_token = encode_auth_token("U-TEST-002", "admin")
            r_delete = client.delete("/api/machines/M-TEST-002", headers={"Authorization": f"Bearer {admin_token}"})
            print("DELETE machine -> status:", r_delete.status_code, "body:", r_delete.get_json())

            assert r_get.status_code == 200
            assert r_create.status_code == 201
            assert r_delete.status_code == 200
            print("three real successes, three real different codes: 200 (here is the data), 201 (a new resource now exists), and 200 again for DELETE - this project never returns a real 204")
    updated_project:
      applicable: false
    mechanical_walkthrough:
      applicable: true
      items:
        - element: 'prog_user = User(...); admin_user = User(...); client = app.test_client()'
          explanation: >
            Builds two real `User` rows with two different real roles,
            and one real `FlaskClient` - this lesson's own first
            construction of either; every later unit in this lesson
            builds its own fresh copies the same way.
        - element: 'r_get = client.get("/api/machines/M-TEST-001")'
          explanation: >
            Sends a real `GET` for a real, existing machine -
            `get_machine`'s own real code returns exactly what's there,
            with the generic, real `200`.
        - element: 'r_create = client.post("/api/machines", json={...}, headers=headers)'
          explanation: >
            Sends a real `POST` creating a genuinely new machine -
            `create_machine`'s own real code returns the more specific
            real `201`, not a bare `200`, because a real resource now
            exists that didn't a moment ago.
        - element: 'r_delete = client.delete("/api/machines/M-TEST-002", headers={"Authorization": f"Bearer {admin_token}"})'
          explanation: >
            Sends a real `DELETE` for the machine just created -
            `delete_machine`'s own real code returns `200` with a real
            body, the same generic success code `get_machine` used, even
            though there's nothing left to actually show for it.
        - element: 'assert r_get.status_code == 200 / assert r_create.status_code == 201 / assert r_delete.status_code == 200'
          explanation: >
            Confirms all three real outcomes together - two different
            real codes for genuinely different kinds of success, and one
            real case (`DELETE`) that reuses `200` where `204` exists for
            exactly this.
    mental_model:
      applicable: false
    execution_trace:
      applicable: false
    cs_lens: >
      This is **differentiated success signaling**: a real family of
      codes sharing "it worked" while still distinguishing genuinely
      different kinds of "worked." Also recognized in: a build tool's own
      real exit code `0` meaning success in general, while a more
      specific tool might separately report "0 changes" versus "N files
      rebuilt"; a shell command's own real distinction between silent
      success and success-with-output; and, in this project's own
      domain, a machine control reporting "cycle complete" differently
      from "cycle complete, new part flagged for inspection."
    se_lens: >
      The design principle is that a more specific real success code
      (`201`) lets a caller react differently - a client might redirect
      to a newly-created resource's own real page on `201` without doing
      that on a bare `200`. The real alternative not chosen for
      `delete_machine`: returning a real `204` with no body at all, which
      this project's own real code, checked directly by this unit, never
      does - the honest cost of the `200`-with-body choice this project's
      own code actually makes: a caller has to parse a real, unnecessary
      body just to learn what a bare status code already told it.
    commands:
      - command: backend/.venv/Scripts/python.exe verification/phase-03/lab_status_2xx.py
        explanation: >
          Runs this as a plain script, from the repository root.
    verification:
      applicable: true
      real_output: |
        Seeding default users...
        GET existing machine -> status: 200
        POST new machine -> status: 201 body has 'data': True
        DELETE machine -> status: 200 body: {'message': 'Machine Test Lathe deleted', 'success': True}
        three real successes, three real different codes: 200 (here is the data), 201 (a new resource now exists), and 200 again for DELETE - this project never returns a real 204
      output_file: verification/phase-03/lab_status_2xx_output.txt
    connection_to_previous: >
      This is the lesson's first unit - it establishes that "success" is
      not one single real code, before the rest of the lesson does the
      same for "failure."

  - title: "400 vs 422 - Malformed vs Semantically Wrong"
    problem: >
      `update_machine_status`'s own real code has two separate, real
      `if` checks that each return `400` (`machines.py:95-96` and
      `:98-100`) - one for a missing field, one for a present-but-invalid
      value. Are those genuinely the same kind of real problem?
    socratic_prompt:
      - >
        A body of `{}` fails `update_machine_status`'s own first real
        check, `if 'status' not in data`. A body of
        `{"status": "orbiting"}` passes that same check, but fails its
        second real one. Which of the two would you call "the request
        itself is broken," and which would you call "the request is
        fine, but this specific value doesn't make sense"?
      - >
        HTTP has a real, distinct status code, `422`, specifically for
        the second kind of problem. Before reading below, would you
        expect this route's own real code to use it?
    project_change:
      reference_source: >
        Real specimen: `backend/app/routes/machines.py:80-115`
        (`update_machine_status`), read again this session.
      files_affected: []
      change_type: none
      location: >
        N/A - a new, standalone script; no existing project structure to
        place it within.
      dependencies: >
        A real `Machine` row; a real `User` row with a `programming`
        role and token.
    new_code:
      applicable: true
      intro: >
        Two real requests, two genuinely different real problems:
      file: verification/phase-03/lab_status_400_422.py
      status: new
      language: python
      code: |
        import sys
        sys.path.insert(0, "backend")

        from app import create_app, db
        from app.models.machine import Machine
        from app.models.user import User
        from app.utils.auth_utils import encode_auth_token

        app = create_app("testing")
        with app.app_context():
            machine = Machine(id="M-TEST-001", name="Test Mill", category="mill", sub_type="3_axis", status="available")
            user = User(id="U-TEST-001", email="test-prog@example.com", name="Test Programmer", role="programming")
            db.session.add(machine)
            db.session.add(user)
            db.session.commit()

            token = encode_auth_token("U-TEST-001", "programming")
            headers = {"Authorization": f"Bearer {token}"}
            client = app.test_client()

            r_missing = client.put("/api/machines/M-TEST-001/status", json={}, headers=headers)
            print("body {} (missing 'status' entirely - malformed) -> status:", r_missing.status_code, "body:", r_missing.get_json())

            r_invalid = client.put("/api/machines/M-TEST-001/status", json={"status": "orbiting"}, headers=headers)
            print("body {'status': 'orbiting'} (present, valid JSON, semantically wrong) -> status:", r_invalid.status_code, "body:", r_invalid.get_json())

            assert r_missing.status_code == 400
            assert r_invalid.status_code == 400
            print("two genuinely different real problems - a missing field, and a present-but-invalid value - and this project's own code returns the identical real 400 for both")
    updated_project:
      applicable: false
    mechanical_walkthrough:
      applicable: true
      items:
        - element: 'r_missing = client.put("/api/machines/M-TEST-001/status", json={}, headers=headers)'
          explanation: >
            Sends a real body with no `'status'` key at all -
            `'status' not in data` is `True`, so the route's own first
            real check fails before it ever looks at any actual value.
        - element: 'r_invalid = client.put(..., json={"status": "orbiting"}, ...)'
          explanation: >
            Sends a real body that DOES have a `'status'` key - the first
            check passes - but `"orbiting"` isn't one of the four real
            allowed values, so the route's own second real check fails
            instead.
        - element: 'assert r_missing.status_code == 400 / assert r_invalid.status_code == 400'
          explanation: >
            Confirms both real, genuinely different problems produced the
            identical real status code - the honest finding this unit
            exists to surface.
    mental_model:
      applicable: false
    execution_trace:
      applicable: false
    cs_lens: >
      This is **error specificity**: whether a real system distinguishes
      "this input's shape is wrong" from "this input's shape is fine, but
      its content isn't." Also recognized in: a compiler's own real
      distinction between a syntax error (malformed) and a type error
      (well-formed, wrong meaning); a JSON Schema validator's own real
      "required property missing" versus "enum value not permitted"
      error categories; and, in this project's own domain, a quality
      inspection's own real distinction between a missing dimension on a
      routing sheet and a dimension that's present but out of tolerance.
    se_lens: >
      The design principle real `422` exists for is letting a caller's
      own error-handling code react differently to "you sent me garbage"
      versus "you sent me something real, but wrong" - useful, for
      instance, for a UI deciding whether to highlight a specific real
      form field. The real alternative not chosen here, in this
      project's own code: distinguishing the two with genuinely different
      real status codes, the way `422` was designed for; the honest cost
      of the single-`400` choice this project's own code actually makes,
      proven directly by this unit's own two real calls: a caller can't
      tell, from the status code alone, whether their request was
      malformed or just semantically wrong - it has to parse the real
