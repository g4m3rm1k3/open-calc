    One real machine, followed through every real JSON concept this
    lesson studies. A real Python `datetime`, converted by
    `Machine.to_dict()` into a real, JSON-safe string, its real key
    renamed from `sub_type` to `subType` along the way (serialization).
    A real JSON string, `"running"`, deserialized by
