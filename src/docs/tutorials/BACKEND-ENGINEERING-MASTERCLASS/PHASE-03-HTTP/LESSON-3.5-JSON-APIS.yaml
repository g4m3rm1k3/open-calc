        `get_machine` have any real, meaningful value to put there?
      - >
        `add_favorite`'s own real response carries both `'success'` AND
        `'data'` together - genuinely different from both of
        `get_machines`'s and `get_machine`'s own shapes. Is there a real,
        principled reason for a THIRD shape to exist, or is it simply a
        different real author's own convention?
