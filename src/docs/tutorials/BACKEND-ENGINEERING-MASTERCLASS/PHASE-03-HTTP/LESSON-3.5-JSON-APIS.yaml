number: "3.5"
title: "JSON APIs"
path_note: >
  File paths under backend/... refer to the real manufacturing-platform
  repository. Paths under verification/... refer to that same
  repository's verification folder.

what_you_will_build: >
  Five real, run checks against this project's own real backend, one per
  real JSON-API concept - serialization, deserialization, JSON's own
  limited type system, API contracts, and response envelopes - and,
  along the way, a genuine, previously-undocumented finding more severe
  than anything this curriculum has surfaced so far: sending a real,
  non-numeric string as `axes` to `create_machine` is silently accepted,
  producing a real `Machine` row whose `axes` column - declared
  `db.Integer` - actually holds the real Python string `'five'`, because
  neither this project's own code nor SQLite itself ever checks.

what_you_need_to_know_first: >
  What the real HTTP methods, status codes, and headers this project's
  own backend uses actually do; what a Flask view function is; what a
  SQLAlchemy model and its own real columns are.

terms:
  - name: serialization
    definition: >
      The real process of converting an in-memory Python object into a
      real, JSON-safe shape - this lesson's own first unit watches a
      real `datetime` become a real string. It exists because JSON's own
      real type system is smaller than Python's; a real value has to be
      converted to something JSON can actually represent before it can
      be sent anywhere.
  - name: deserialization
    definition: >
      The real, reverse process - turning the real bytes of a JSON
      request body back into real Python values a route can use. It
      exists as the necessary first step before any of this project's
      own real route logic can act on what a client actually sent.
  - name: JSON types
    definition: >
      The real, fixed set of value shapes JSON itself defines - object,
      array, string, number, boolean, and `null` - nothing else, and
      critically, only one real number type, with no distinction between
      a real integer and a real decimal. It exists as the actual,
      complete vocabulary a JSON body can ever be built from, regardless
      of what a receiving language's own type system supports.
  - name: API contract
    definition: >
      A real, implicit promise about what a response will contain - not
      merely what it happens to contain once. It exists so a caller can
      write real code against an endpoint's own shape with confidence -
      though, as this lesson's own fourth unit shows directly, nothing
      forces a real backend to actually keep that promise consistently.
  - name: response envelope
    definition: >
      The real, outer JSON structure wrapping a response's own actual
      content - `{'data': ...}`, `{'success': ..., 'data': ...}`, or any
      other real shape a route happens to choose. It exists to carry
      real metadata (like a `total` count, or a `success` flag) alongside
      a response's own real payload, separate from the payload itself.

objects_and_methods:
  - name: Machine.to_dict
    what_it_is: >
      A real, existing instance method on this project's own `Machine`
      model, converting a real database row into a real, JSON-safe dict.
    implementation: >
      `def to_dict(self) -> dict: return {...}`
      (`backend/app/models/machine.py:88-113`) - maps each real column to
      a real, camelCase JSON key (`sub_type` becomes `'subType'`,
      `x_travel` becomes `'xTravel'`), and explicitly calls
      `.isoformat()` on every real `datetime` column
      (`created_at`, `updated_at`,
      `operator_last_heartbeat_at`), each guarded by a real
      `if ... else None` for a column that might not be set.
    its_use: >
      This lesson calls it directly, before any HTTP request is even
      involved, specifically to compare a real machine's own in-memory
      Python values against what this method actually hands back.
    type: A real instance method on the `Machine` SQLAlchemy model.
    responsibility: >
      Producing a real, complete, JSON-safe representation of one
      `Machine` row - every real value converted to a shape `jsonify`
      can actually serialize, nothing left as a raw Python object JSON
      itself has no representation for.
    depends_on: >
      A real, already-loaded `Machine` instance, with its own real
      column values already set.
    connects_to: >
      Called by every real route in this project that returns machine
      data - `get_machine`, `get_machines`, `create_machine`, and
      `update_machine` alike all return its real output, wrapped in
      `jsonify`.
    shape: >
      Takes no arguments beyond `self`; returns a real, plain Python
      `dict` whose every real value is already JSON-safe - a `str`, an
      `int`, a `float`, a `bool`, or `None`.

  - name: update_machine_status
    what_it_is: >
      A real, existing Flask view function updating a machine's status.
    implementation: >
      `@machines_bp.route('/<string:machine_id>/status', methods=['PUT'])`
      `def update_machine_status(current_user, machine_id: str): ...`
      (`backend/app/routes/machines.py:80-115`) - reads
      `request.get_json()`'s own real, deserialized dict directly, and
      assigns `data['status']` straight onto `machine.status`
      (`:102`) with no real type check of any kind.
    its_use: >
      This lesson calls it once, specifically to trace one real string
      value from the request body's own real JSON, through
      deserialization, into the database, and back out again unchanged.
    type: A Flask view function, decorated with `@token_required`.
    responsibility: >
      Applying a real, deserialized value directly to a real database
      column, trusting `request.get_json()`'s own real output completely.
    depends_on: >
      A real, existing `Machine` row; a real JSON body.
    connects_to: >
      `request.get_json()`'s own real return value is exactly what this
      function's own body reads and stores, with nothing in between.
    shape: >
      Reads a real dict in; returns a real, `jsonify`-wrapped dict with
      an implicit `200` on success.

  - name: create_machine
    what_it_is: >
      A real, existing Flask view function creating a new machine.
    implementation: >
      `@machines_bp.route('', methods=['POST'])`
      `def create_machine(current_user): ...`
      (`backend/app/routes/machines.py:118-169`) - passes
      `data.get('axes', 3)` (`:149`) directly into `Machine`'s own real
      constructor, with no real check that the real value is even a
      number at all, before SQLAlchemy hands it to SQLite.
    its_use: >
      This lesson calls it with `axes` sent as a real numeric JSON
      string and, separately, as a real non-numeric JSON string,
      specifically to observe what this project's own real code - and
      SQLite underneath it - actually does with each.
    type: A Flask view function, decorated with `@token_required`.
    responsibility: >
      Creating exactly one real `Machine` row from whatever real values
      a request body happens to contain, with no real validation of
      their types.
    depends_on: >
      A real, valid JSON body; SQLite's own real, permissive handling of
      a mismatched real value.
    connects_to: >
      This lesson's own `create_machine_group` (contracts unit) and
      `delete_machine` (contracts unit) are the two real routes its own
      `{'data': ...}` shape is compared against.
    shape: >
      Reads a real dict in; returns a real, `jsonify`-wrapped dict with
      an explicit `201` on success.

  - name: get_machine / get_machines
    what_it_is: >
      Two real, existing Flask view functions - one returning a single
      real machine, one returning every real machine.
    implementation: >
      `def get_machine(current_user, machine_id: str): ...`
      (`backend/app/routes/machines.py:48-61`) returns
      `jsonify({'data': machine.to_dict()})`; `def
      get_machines(current_user): ...` (`:14-45`) returns
      `jsonify({'data': [...], 'total': len(machines)})` - a real,
      genuinely different set of real top-level keys for a single
      resource versus a real collection.
    its_use: >
      This lesson calls both, specifically to compare their real,
      top-level response keys directly against each other and against a
      third, real route's own shape.
    type: Two Flask view functions, both decorated with
      `@token_required`.
    responsibility: >
      Reading and returning real machine data, in two genuinely
      different real real shapes depending on whether one or many are
      being returned.
    depends_on: >
      A real `machine_id` (for `get_machine`); the real rows already in
      the database (for `get_machines`).
    connects_to: >
      Both call `Machine.to_dict()`; their own real, differing top-level
      keys (`'total'` present only on the list route) are the entire
      real specimen this lesson's own envelopes unit is built around.
    shape: >
      `get_machine` returns `{'data': dict}`; `get_machines` returns
      `{'data': list, 'total': int}` - two real, different shapes for
      the identical underlying real serialized machine data.

  - name: delete_machine
    what_it_is: >
      A real, existing Flask view function deleting a machine.
    implementation: >
      `@machines_bp.route('/<string:machine_id>', methods=['DELETE'])`
      `def delete_machine(current_user, machine_id: str): ...`
      (`backend/app/routes/machines.py:274-297`) - returns
      `jsonify({'success': True, 'message': f'Machine {machine_name} deleted'})`
      on success (`:294`) - a real response with no `'data'` key at all,
      genuinely unlike every other real route this lesson studies.
    its_use: >
      This lesson calls it specifically to check whether its own real
      response shape matches the real `{'data': ...}` convention
      `get_machine` and `create_machine` both follow.
    type: A Flask view function, decorated with `@token_required`.
    responsibility: >
      Removing a real `Machine` row and reporting a real, human-readable
      confirmation - never a real, structured copy of what was deleted.
    depends_on: A real `machine_id` matched from the request URL.
    connects_to: >
      Its own real, `'data'`-less shape is the entire specimen this
      lesson's own API-contracts unit is built around.
    shape: >
      Returns a real, `jsonify`-wrapped `{'success': bool, 'message': str}`
      dict - no `'data'` key, genuinely unlike `get_machine`'s or
      `create_machine`'s own real shape.

  - name: add_favorite
    what_it_is: >
      A real, existing Flask view function creating a favorite record.
    implementation: >
      `@favorites_bp.route('/', methods=['POST']) def add_favorite():
      ...` (`backend/app/routes/favorites.py:33-58`) - returns
      `jsonify({'success': True, 'data': favorite.to_dict()}), 201`
      (`:58`) - a real, third top-level shape, carrying BOTH a
      `'success'` key AND a `'data'` key together.
    its_use: >
      This lesson calls it specifically to add a third, genuinely
      distinct real envelope shape to the two `get_machines`/`get_machine`
      already show.
    type: A Flask view function, with no `@token_required` decorator.
    responsibility: >
      Creating a real `UserFavorite` row and returning both a real
      success flag and the real, created record together.
    depends_on: >
      A real, valid JSON body naming a real, existing `pairingId`.
    connects_to: >
      Its own real, `{'success', 'data'}` shape is this lesson's own
      third, distinct real envelope specimen.
    shape: >
      Returns a real, `jsonify`-wrapped `{'success': bool, 'data': dict}`
      dict with an explicit `201`.

concept_units:
  - title: "Serialization - Turning a Real Python Object Into Real JSON"
    problem: >
      `Machine.to_dict()`'s own real code
      (`backend/app/models/machine.py:88-113`) calls `.isoformat()` on
      every real `datetime` column it touches. What real problem does
      that solve - what would happen without it?
    socratic_prompt:
      - >
        A real `Machine` row's own `created_at` attribute is a real
        Python `datetime` object. Does JSON, as a real format, have any
        native way to represent a `datetime` at all?
      - >
        `to_dict()`'s own real code renames `self.sub_type` to
        `'subType'` in its returned dict. Is that change necessary for
        JSON serialization itself to work, or is it a real, separate
        design choice about what the JSON API's own keys should look
        like?
    project_change:
      reference_source: >
        Real specimen: `backend/app/models/machine.py:88-113`
        (`Machine.to_dict`), read again this session.
      files_affected: []
      change_type: none
      location: >
        N/A - a new, standalone script; no existing project structure to
        place it within.
      dependencies: A real `Machine` row.
    new_code:
      applicable: true
      intro: >
        A real machine's own real Python attributes, next to what
        `to_dict()` actually turns them into:
      file: verification/phase-03/lab_json_serialization.py
      status: new
      language: python
      code: |
        import sys
        sys.path.insert(0, "backend")

        from datetime import datetime
        from app import create_app, db
        from app.models.machine import Machine

        app = create_app("testing")
        with app.app_context():
            machine = Machine(id="M-TEST-001", name="Test Mill", category="mill", sub_type="3_axis", status="available")
            db.session.add(machine)
            db.session.commit()

            print("real Python attribute:", "machine.created_at ->", type(machine.created_at), repr(machine.created_at))
            print("real Python attribute:", "machine.axes ->", type(machine.axes), repr(machine.axes))
            print("real Python attribute:", "machine.has_tool_changer ->", type(machine.has_tool_changer), repr(machine.has_tool_changer))

            serialized = machine.to_dict()
            print("real serialized value:", "serialized['createdAt'] ->", type(serialized["createdAt"]), repr(serialized["createdAt"]))
            print("real serialized value:", "serialized['axes'] ->", type(serialized["axes"]), repr(serialized["axes"]))
            print("real serialized value:", "serialized['subType'] (was machine.sub_type) ->", serialized["subType"])

            assert isinstance(machine.created_at, datetime)
            assert isinstance(serialized["createdAt"], str)
            assert isinstance(serialized["axes"], int)
            print("a real Python datetime became a real JSON-safe string; a real Python int stayed a real int; snake_case became camelCase")
    updated_project:
      applicable: false
    mechanical_walkthrough:
      applicable: true
      items:
        - element: 'machine.created_at'
          explanation: >
            Reads the real, in-memory attribute directly - a genuine
            Python `datetime` object, set by the column's own real
            `default=datetime.utcnow` (`machine.py:85`), not yet touched
            by `to_dict()` at all.
        - element: 'serialized = machine.to_dict()'
          explanation: >
            Calls the real method under study - produces a real, plain
            dict where every value is already something JSON itself can
            represent.
        - element: 'serialized["createdAt"]'
          explanation: >
            The real, converted value - a plain `str`, produced by
            `to_dict()`'s own real `.isoformat()` call, not the raw
            `datetime` object anymore.
        - element: 'assert isinstance(machine.created_at, datetime) / assert isinstance(serialized["createdAt"], str)'
          explanation: >
            Confirms both real facts together - the same real moment in
            time, represented two genuinely different real ways, before
            and after serialization.
    mental_model:
      applicable: false
    execution_trace:
      applicable: false
    cs_lens: >
      This is **serialization**: converting an in-memory real value into
      a real, transportable representation whose own format is agreed on
      by both sides. Also recognized in: `pickle`'s own real byte
      encoding of an arbitrary Python object; a database driver's own
      real conversion of a `datetime` column into whatever wire format
      the underlying protocol actually supports; and, in this project's
      own domain, a G-code post-processor converting an internal,
      real toolpath data structure into the real, flat text format a
      machine control can actually read.
    se_lens: >
      The design principle is that a real API's own boundary is where
      internal representation ends and a real, agreed external format
      begins - `to_dict()` is exactly that boundary for this project's
      own `Machine` model. The real alternative not chosen: returning
      Python objects directly and letting `jsonify` attempt to serialize
      them itself, which would genuinely fail on a raw `datetime`
      (`jsonify` has no real, built-in rule for it); the honest cost of
      the explicit `to_dict()` approach this project's own code actually
      takes: every new real column added to `Machine` needs a
      matching, real, hand-written line in `to_dict()`, or it silently
      never appears in the JSON API at all.
    commands:
      - command: backend/.venv/Scripts/python.exe verification/phase-03/lab_json_serialization.py
        explanation: >
          Runs this as a plain script, from the repository root.
    verification:
      applicable: true
      real_output: |
        Seeding default users...
        real Python attribute: machine.created_at -> <class 'datetime.datetime'> datetime.datetime(2026, 8, 31, 9, 18, 23, 169785)
        real Python attribute: machine.axes -> <class 'int'> 3
        real Python attribute: machine.has_tool_changer -> <class 'bool'> False
        real serialized value: serialized['createdAt'] -> <class 'str'> '2026-08-31T09:18:23.169785'
        real serialized value: serialized['axes'] -> <class 'int'> 3
        real serialized value: serialized['subType'] (was machine.sub_type) -> 3_axis
        a real Python datetime became a real JSON-safe string; a real Python int stayed a real int; snake_case became camelCase
      output_file: verification/phase-03/lab_json_serialization_output.txt
    connection_to_previous: >
      This is the lesson's first unit - it establishes the real,
      outbound half of every JSON exchange this lesson studies.

  - title: "Deserialization - Turning Real JSON Back Into a Real Python Value"
    problem: >
      `update_machine_status`'s own real code
      (`machines.py:93-102`) reads `request.get_json()` and assigns
      `data['status']` straight onto `machine.status`. What real journey
      does one real string value take, from the request's own real bytes
      to the database and back?
    socratic_prompt:
      - >
        A real request body of `{"status": "running"}` arrives as real,
        raw bytes over the wire. What real Python value does
        `request.get_json()` actually hand back for the `"status"` key -
        and is there any real check, anywhere in this route's own code,
        that the value is one of the four real allowed strings before
        it's assigned to `machine.status`?
      - >
        If deserialization just means "turn real JSON text into a real
        Python value," is `update_machine_status`'s own separate,
        earlier check
        (`machines.py:98-100`, `if data['status'] not in valid_statuses`)
        part of deserialization itself, or something that happens after
        it?
    project_change:
      reference_source: >
        Real specimen: `backend/app/routes/machines.py:80-115`
        (`update_machine_status`), read again this session.
      files_affected: []
      change_type: none
      location: >
        N/A - a new, standalone script; no existing project structure to
        place it within.
      dependencies: >
        A real `Machine` row; a real `User` row with a `programming`
        role and token.
    new_code:
      applicable: true
      intro: >
        One real string, traced from a real JSON request body through to
        the database and back:
      file: verification/phase-03/lab_json_deserialization.py
      status: new
      language: python
      code: |
        import sys
        sys.path.insert(0, "backend")

        from app import create_app, db
        from app.models.machine import Machine
        from app.models.user import User
        from app.utils.auth_utils import encode_auth_token

        app = create_app("testing")
        with app.app_context():
            machine = Machine(id="M-TEST-001", name="Test Mill", category="mill", sub_type="3_axis", status="available")
            user = User(id="U-TEST-001", email="test-prog@example.com", name="Test Programmer", role="programming")
            db.session.add(machine)
            db.session.add(user)
            db.session.commit()

            token = encode_auth_token("U-TEST-001", "programming")
            headers = {"Authorization": f"Bearer {token}"}
            client = app.test_client()

            r = client.put("/api/machines/M-TEST-001/status", json={"status": "running"}, headers=headers)
            print("real request body sent as a real Python dict:", {"status": "running"})
            print("real, deserialized value inside update_machine_status:", "data['status'] ->", type(r.get_json()["data"]["status"]), repr(r.get_json()["data"]["status"]))

            r_check = client.get("/api/machines/M-TEST-001")
            print("real, re-fetched value from the database:", "status ->", r_check.get_json()["data"]["status"])

            assert r.status_code == 200
            assert r_check.get_json()["data"]["status"] == "running"
            print("the real string in the JSON request body became the real string stored in the database, with nothing in between actually checking its real type")
    updated_project:
      applicable: false
    mechanical_walkthrough:
      applicable: true
      items:
        - element: 'client = app.test_client()'
          explanation: >
            Builds one real `FlaskClient` - this lesson's own first
            construction of it; every later unit in this lesson builds
            its own fresh copy the same way.
        - element: 'r = client.put("/api/machines/M-TEST-001/status", json={"status": "running"}, headers=headers)'
          explanation: >
            `FlaskClient`'s own `json=` argument serializes the real
            Python dict into real JSON bytes on the way out; on the
            server side, `request.get_json()` deserializes those same
            real bytes back into a real Python dict, which is what
            `update_machine_status`'s own code actually reads.
        - element: 'r_check = client.get("/api/machines/M-TEST-001")'
          explanation: >
            A real, separate, independent fetch - confirms the real
            deserialized value didn't just appear correct in the
            immediate response, but was genuinely persisted.
        - element: 'assert r_check.get_json()["data"]["status"] == "running"'
          explanation: >
            Confirms the real string survived the entire real round
            trip - serialized out, deserialized in, stored, re-read, and
            serialized out again - unchanged.
    mental_model:
      applicable: false
    execution_trace:
      applicable: false
    cs_lens: >
      This is **deserialization**: reconstructing a real, usable
      in-memory value from a real, transportable representation. Also
      recognized in: `pickle.loads`, the real reverse of `pickle.dumps`;
      a database driver parsing a real wire-protocol response back into
      real Python objects; and, in this project's own domain, a CAM
      import service reading a real, exported XML file back into real
      Python objects this project's own code can actually work with.
    se_lens: >
      The design principle is that deserialization and validation are
      two genuinely separate real steps - `request.get_json()` only
      answers "is this real text valid JSON," never "is this real value
      the right kind of value for what I'm about to do with it."
      `update_machine_status`'s own real, separate `if data['status'] not
      in valid_statuses` check (`machines.py:98-100`) is validation,
      running strictly after deserialization already succeeded. The real
      alternative not chosen: a single combined step that deserializes
      and validates together (a real JSON Schema validator, for
      instance); the honest cost of keeping them separate, the way this
      project's own code does: every route has to remember to add its
      own real validation after deserializing, by hand, and nothing
      forces it to - exactly the real gap this lesson's own next unit
      shows going unenforced.
    commands:
      - command: backend/.venv/Scripts/python.exe verification/phase-03/lab_json_deserialization.py
        explanation: >
          Runs this as a plain script, from the repository root.
    verification:
      applicable: true
      real_output: |
        Seeding default users...
        real request body sent as a real Python dict: {'status': 'running'}
        real, deserialized value inside update_machine_status: data['status'] -> <class 'str'> 'running'
        real, re-fetched value from the database: status -> running
        the real string in the JSON request body became the real string stored in the database, with nothing in between actually checking its real type
      output_file: verification/phase-03/lab_json_deserialization_output.txt
    connection_to_previous: >
      The previous unit watched a real Python value become real JSON;
      this unit watches the identical real journey run in reverse.

  - title: "JSON Types - A Real, Smaller Vocabulary Than Python's Own"
    problem: >
      JSON's own real type system has exactly one real number type - no
      distinction between an integer and a decimal. `create_machine`'s
      own real code (`machines.py:149`) passes `data.get('axes', 3)`
      straight into a column declared `db.Integer`, with no real check
      at all. What happens when the real JSON value isn't even a number?
    socratic_prompt:
      - >
        A JSON body can send `"axes": 5` (a real JSON number) or
        `"axes": "5"` (a real JSON string that happens to look
        numeric). Does `create_machine`'s own real code, or SQLite
        itself, distinguish between the two before storing either one?
      - >
        If a real client sent `"axes": "five"` - a real JSON string with
        no numeric meaning at all - what real, structural fact about
        `create_machine`'s own code (or lack of one) would determine
        whether that request succeeds or fails?
    project_change:
      reference_source: >
        Real specimen: `backend/app/routes/machines.py:118-169`
        (`create_machine`), read again this session.
      files_affected: []
      change_type: none
      location: >
        N/A - a new, standalone script; no existing project structure to
        place it within.
      dependencies: >
        A real `User` row with a `programming` role and token.
    new_code:
      applicable: true
      intro: >
        Two real requests, two real JSON strings for `axes` - one
        numeric-looking, one not:
      file: verification/phase-03/lab_json_types.py
      status: new
      language: python
      code: |
        import sys
        sys.path.insert(0, "backend")

        from app import create_app, db
        from app.models.user import User
        from app.utils.auth_utils import encode_auth_token

        app = create_app("testing")
        with app.app_context():
            user = User(id="U-TEST-001", email="test-prog@example.com", name="Test Programmer", role="programming")
            db.session.add(user)
            db.session.commit()

            token = encode_auth_token("U-TEST-001", "programming")
            headers = {"Authorization": f"Bearer {token}"}
            client = app.test_client()

            body_numeric_string = {"id": "M-TEST-001", "name": "Test Mill", "category": "mill", "subType": "3_axis", "manufacturer": "Haas", "model": "VF-2", "axes": "5"}
            r1 = client.post("/api/machines", json=body_numeric_string, headers=headers)
            print("real JSON body sent axes as the real JSON string \"5\" -> stored real Python type:", type(r1.get_json()["data"]["axes"]), "value:", r1.get_json()["data"]["axes"])

