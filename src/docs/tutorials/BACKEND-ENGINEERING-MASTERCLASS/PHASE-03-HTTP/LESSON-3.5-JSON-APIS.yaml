    real check in between (deserialization) - which, pushed one step
    further, let a genuinely non-numeric real string, `"five"`, land in
    a column declared `db.Integer`, because nothing in this project's
    own real code, or SQLite itself, actually enforces the type JSON
    only loosely suggests (JSON types). Three real routes touching the
    identical real machine resource, two of them sharing a real `'data'`
    contract, one of them - `delete_machine` - breaking it outright (API
    contracts). And, last, three real, independently-evolved response
    shapes - list, single, and mixed - all coexisting in this same real
    API at once, each locally sensible, none of them the one real
    contract every caller could actually depend on (response envelopes).
