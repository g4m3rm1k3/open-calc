number: "3.6"
title: "REST"
path_note: >
  File paths under backend/... refer to the real manufacturing-platform
  repository. Paths under verification/... refer to that same
  repository's verification folder.

what_you_will_build: >
  Five real, run checks against this project's own real backend, naming
  the architectural pattern every earlier lesson in this phase has
  already been using without naming it - resources, representations,
  resource identifiers, CRUD, and idempotency - and, along the way, a
  genuine real finding: this project's own `NCFile` resource has two
  real, different representations (a JSON metadata object and a raw
  `text/plain` file download), selected not by the real `Accept` header
  this curriculum already found this API ignores, but by two entirely
  separate real URLs.

what_you_need_to_know_first: >
  What the real HTTP methods, status codes, headers, and JSON shapes
  this project's own backend actually uses mean; what a Flask view
  function and blueprint are.

terms:
  - name: resource
    definition: >
      A real, named thing an API exposes - identified by a real URL,
      independent of any one specific representation of it. It exists as
      REST's own central noun: everything a real API does is framed as
      an operation on a resource, not a remote function call.
  - name: representation
    definition: >
      A real, concrete format a resource can be rendered as - JSON
      metadata, or a real, raw file download, for the identical
      underlying resource, in this lesson's own second unit. It exists
      because a resource itself is an abstract, real thing; a client
      only ever actually receives one of its possible representations.
  - name: resource identifier
    definition: >
      The real, unique string (usually embedded in a URL) naming exactly
      one resource - a machine's own `id`, or a group's own
      server-generated `id`. It exists so a real URL alone, without any
      other context, can name one specific real thing unambiguously.
  - name: CRUD
    definition: >
      The real, standard shorthand for the four basic real operations a
      resource supports - Create, Read, Update, Delete - mapped in this
      project onto real `POST`, `GET`, `PATCH`/`PUT`, and `DELETE`. It
      exists as a real, common vocabulary for describing a resource's
      entire real lifecycle in four words.
  - name: idempotency
    definition: >
      The real property that repeating an identical request leaves a
      resource in the same real end state as making it once - checked in
      this lesson's own last unit specifically from a real client's own
      point of view: which real methods are safe to blindly retry after
      an uncertain failure, and which aren't. It exists because a real
      network is unreliable, and a real client needs to know which
      requests it can resend without fear of a second, unintended real
      effect.

objects_and_methods:
  - name: get_machine / get_machines
    what_it_is: >
      Two real, existing Flask view functions - one returning a single
      real machine resource, one returning the real collection.
    implementation: >
      `def get_machine(current_user, machine_id: str): ...`
      (`backend/app/routes/machines.py:48-61`) is reached at
      `/api/machines/<machine_id>`; `def get_machines(current_user): ...`
      (`:14-45`) is reached at `/api/machines` - the identical real URL
      prefix, distinguished only by whether a real identifier is present
      in the path.
    its_use: >
      This lesson calls both, specifically to contrast a real,
      individually-identified resource against the real collection it
      belongs to.
    type: Two Flask view functions, both decorated with
      `@token_required`.
    responsibility: >
      Reading either exactly one real machine, or every real machine -
      genuinely different real scopes, reached through genuinely
      different real URLs built from the same real prefix.
    depends_on: >
      A real `machine_id` (for `get_machine`); the real rows already in
      the database (for `get_machines`).
    connects_to: >
      Both call `Machine.to_dict()`; their own real, differing URL
      shapes are the entire specimen this lesson's own resources unit is
      built around.
    shape: >
      `get_machine` returns `{'data': dict}`; `get_machines` returns
      `{'data': list, 'total': int}`.

  - name: get_nc_file / download_nc_file
    what_it_is: >
      Two real, existing Flask view functions returning two genuinely
      different real representations of the identical `NCFile` resource.
    implementation: >
      `def get_nc_file(nc_file_id: str): ...`
      (`backend/app/routes/nc_files.py:50-62`) returns
      `jsonify({'data': nc_file.to_dict()})`; `def
      download_nc_file(nc_file_id: str): ...` (`:394-420`) reads the real
      `file_content` column, wraps it in a real `io.BytesIO`, and returns
      it via `send_file(..., mimetype='text/plain', as_attachment=True)`
      (`:415-420`) - the real, raw G-code text, not a JSON description
      of it.
    its_use: >
      This lesson calls both against the identical real NC file,
      specifically to observe two genuinely different real response
      bodies and `Content-Type` values for the same underlying resource.
    type: Two Flask view functions, neither wrapped by `@token_required`.
    responsibility: >
      Serving the identical underlying `NCFile` resource two genuinely
      different real ways - as data describing it, and as the real file
      itself.
    depends_on: >
      A real, existing `NCFile` row; for `download_nc_file`, a real,
      non-empty `file_content` value.
    connects_to: >
      Their own real, separate URLs (`/<id>` versus `/<id>/download`)
      are the entire specimen this lesson's own representations unit is
      built around.
    shape: >
      `get_nc_file` returns a real, `jsonify`-wrapped dict with
      `Content-Type: application/json`; `download_nc_file` returns a
      real, raw byte stream with `Content-Type: text/plain`.

  - name: create_machine / create_machine_group
    what_it_is: >
      Two real, existing Flask view functions creating two different
      kinds of resource, using two different real identifier strategies.
    implementation: >
      `def create_machine(current_user): ...`
      (`backend/app/routes/machines.py:118-169`) reads a real, required
      `data['id']` (`:141`) straight from the request body; `def
      create_machine_group(current_user): ...` (`:214-254`) never reads
      an `id` from the body at all, instead building one from
      `data['name']` (`:230`) with a real collision-avoidance loop
      (`:235-237`).
    its_use: >
      This lesson calls both, specifically to contrast a real,
      client-chosen identifier against a real, server-generated one.
    type: Two Flask view functions, both decorated with
      `@token_required`.
    responsibility: >
      Creating a real new resource, each trusting a genuinely different
      real party (the client, or the server itself) to decide that
      resource's own real identity.
    depends_on: >
      For `create_machine`, a real, client-supplied `id`; for
      `create_machine_group`, only a real `name`.
    connects_to: >
      Their own real, opposite identifier strategies are the entire
      specimen this lesson's own resource-identifiers unit is built
      around.
    shape: >
      Both return a real, `jsonify`-wrapped `{'data': dict}` with an
      explicit `201`.

  - name: update_machine (PATCH) / delete_machine
    what_it_is: >
      Two real, existing Flask view functions completing the real CRUD
      cycle this lesson's own fourth unit traces end to end.
    implementation: >
      `def update_machine(current_user, machine_id: str): ...`
      (`backend/app/routes/machines.py:172-211`) applies whichever real
      fields a `PATCH` body names; `def delete_machine(current_user,
      machine_id: str): ...` (`:274-297`) removes the real row entirely.
    its_use: >
      This lesson calls both, immediately after `create_machine` and
      `get_machine`, to trace one real resource through its entire real
      lifecycle in a single, continuous script.
    type: Two Flask view functions, both decorated with
      `@token_required`.
    responsibility: >
      Changing, and then ending, one real resource's own real existence.
    depends_on: >
      A real, existing `Machine` row.
    connects_to: >
      Together with `create_machine` and `get_machine`, these four real
      functions are the entire real specimen this lesson's own CRUD unit
      is built around.
    shape: >
      `update_machine` returns a real, `jsonify`-wrapped `{'data': dict}`
      with an implicit `200`; `delete_machine` returns a real
      `{'success': bool, 'message': str}` with an implicit `200`, or a
      real `404` on a second call.

  - name: update_machine_status (PUT) / create_machine_group (POST)
    what_it_is: >
      The same two real functions this lesson's own earlier units
      already used, revisited here specifically for their real
      retry-safety, from a real client's own point of view.
    implementation: >
      `update_machine_status` (`machines.py:80-115`) is idempotent by
      real, verified end state; `create_machine_group`
      (`:214-254`) is not, by its own real, verified ID-collision
      behavior.
    its_use: >
      This lesson calls each one twice in immediate succession,
      simulating a real client that can't tell whether its first real
      call actually reached the server, specifically to check which real
      method that client could safely resend.
    type: Two Flask view functions, both decorated with
      `@token_required`.
    responsibility: >
      Behaving, under an identical real retry, in two genuinely
      different real ways - one real method leaves the resource
      unchanged on a repeat; the other creates a real second one.
    depends_on: >
      A real, existing `Machine` row (for `update_machine_status`); a
      real `name` in the body (for `create_machine_group`).
    connects_to: >
      Their own real, opposite retry behavior is the entire specimen
      this lesson's own closing idempotency unit is built around.
    shape: >
      Both return a real, `jsonify`-wrapped `{'data': dict}`.

concept_units:
  - title: "Resources - What a Real URL Actually Names"
    problem: >
      `/api/machines/M-TEST-001` and `/api/machines` share the identical
      real prefix. What real, different thing does each one actually
      name?
    socratic_prompt:
      - >
        `get_machine`'s own real code returns one real dict; `get_machines`'s
        own real code returns a real list. Does the URL alone - before
        any real code even runs - already tell you which shape to
        expect?
      - >
        If a resource is "a real, named thing an API exposes,"
        is the real COLLECTION of all machines itself a resource too, or
        only each individual real machine?
    project_change:
      reference_source: >
        Real specimen: `backend/app/routes/machines.py:14-45`
        (`get_machines`) and `:48-61` (`get_machine`), both read again
        this session.
      files_affected: []
      change_type: none
      location: >
        N/A - a new, standalone script; no existing project structure to
        place it within.
      dependencies: Two real `Machine` rows.
    new_code:
      applicable: true
      intro: >
        The identical real URL prefix, with and without a real
        identifier:
      file: verification/phase-03/lab_rest_resources.py
      status: new
      language: python
      code: |
        import sys
        sys.path.insert(0, "backend")

        from app import create_app, db
        from app.models.machine import Machine

        app = create_app("testing")
        with app.app_context():
            m1 = Machine(id="M-TEST-001", name="Test Mill", category="mill", sub_type="3_axis", status="available")
            m2 = Machine(id="M-TEST-002", name="Test Lathe", category="lathe", sub_type="2_axis", status="available")
            db.session.add(m1)
            db.session.add(m2)
            db.session.commit()

            client = app.test_client()

            r_one = client.get("/api/machines/M-TEST-001")
            print("GET /api/machines/M-TEST-001 (one real resource)   -> real data:", r_one.get_json()["data"]["id"])

            r_collection = client.get("/api/machines")
            print("GET /api/machines          (the real collection)   -> real ids:", [m["id"] for m in r_collection.get_json()["data"]])

            assert r_one.status_code == 200
            assert isinstance(r_one.get_json()["data"], dict)
            assert isinstance(r_collection.get_json()["data"], list)
            print("the identical real URL prefix names two genuinely different real things - one specific machine, and the real set of every machine")
    updated_project:
      applicable: false
    mechanical_walkthrough:
      applicable: true
      items:
        - element: 'client = app.test_client()'
          explanation: >
            Builds one real `FlaskClient` - this lesson's own first
            construction of it; every later unit in this lesson builds
            its own fresh copy the same way.
        - element: 'r_one = client.get("/api/machines/M-TEST-001")'
          explanation: >
            Names one specific real resource by its own real identifier
            - Werkzeug's own real routing matches this against
            `get_machine`'s real route pattern.
        - element: 'r_collection = client.get("/api/machines")'
          explanation: >
            Names the real collection resource - no identifier at all in
            the path, matched instead against `get_machines`'s own real,
            shorter route pattern.
        - element: 'assert isinstance(r_one.get_json()["data"], dict) / assert isinstance(r_collection.get_json()["data"], list)'
          explanation: >
            Confirms, for real, the structural difference this unit
            exists to name - a single resource's own real shape, versus
            a real collection's shape, decided entirely by which real
            URL was requested.
    mental_model:
      applicable: false
    execution_trace:
      applicable: false
    cs_lens: >
      This is **resource-oriented addressing**: every real, meaningful
      thing an API exposes gets its own real URL, rather than one fixed
      URL taking a real operation name as a parameter. Also recognized
      in: a filesystem's own real path hierarchy (`/machines/M-001` reads
      like a real file inside a real folder); a database's own real
      table-versus-row distinction; and, in this project's own domain, a
      real machine's own tool table addressed as a whole versus one
      specific real tool slot within it.
    se_lens: >
      The design principle is that a resource's own real identity lives
      in the URL, not in a request body or a query parameter - `GET
      /api/machines/M-TEST-001` names the same real thing no matter what
      real method is used against it. The real alternative not chosen -
      a single real endpoint like `/api/getMachine?id=M-TEST-001`,
      naming an operation rather than a resource - would work, but
      loses the real, consistent pattern this project's own routes
      already follow: the same real URL shape, varying only by real
      method, for every resource this curriculum has studied; the honest
      cost of the resource-oriented shape this project's own code
      actually uses: a caller has to construct a genuinely different
      real URL per resource type, rather than one flexible endpoint
      taking real parameters.
    commands:
      - command: backend/.venv/Scripts/python.exe verification/phase-03/lab_rest_resources.py
        explanation: >
          Runs this as a plain script, from the repository root.
    verification:
      applicable: true
      real_output: |
        Seeding default users...
        GET /api/machines/M-TEST-001 (one real resource)   -> real data: M-TEST-001
        GET /api/machines          (the real collection)   -> real ids: ['M-TEST-002', 'M-TEST-001']
        the identical real URL prefix names two genuinely different real things - one specific machine, and the real set of every machine
      output_file: verification/phase-03/lab_rest_resources_output.txt
    connection_to_previous: >
      This is the lesson's first unit - it names the real pattern every
      earlier lesson in this phase has already been using without
      calling it by name.

  - title: "Representations - One Resource, Two Real Real Formats"
    problem: >
      `get_nc_file` and `download_nc_file`
      (`backend/app/routes/nc_files.py:50-62`, `:394-420`) both operate
      on the identical real `NCFile` resource. Do they return the same
      real thing?
    socratic_prompt:
      - >
        `get_nc_file`'s own real code calls `nc_file.to_dict()`;
        `download_nc_file`'s own real code reads `nc_file.file_content`
        directly and wraps it in `send_file(...)`. Are those two real
        code paths describing the resource, or delivering it?
      - >
        This curriculum already found this project's own real routes
        never honor a real `Accept` header. Given that, how does a real
        client actually choose between these two representations, if
        not by content negotiation?
    project_change:
      reference_source: >
        Real specimen: `backend/app/routes/nc_files.py:50-62`
        (`get_nc_file`) and `:394-420` (`download_nc_file`), both read
        again this session.
      files_affected: []
      change_type: none
      location: >
        N/A - a new, standalone script; no existing project structure to
        place it within.
      dependencies: A real `NCFile` row with real `file_content`.
    new_code:
      applicable: true
      intro: >
        The identical real NC file, requested two real ways:
      file: verification/phase-03/lab_rest_representations.py
      status: new
      language: python
      code: |
        import sys
        sys.path.insert(0, "backend")

        from app import create_app, db
        from app.models.nc_file import NCFile

        app = create_app("testing")
        with app.app_context():
            nc_file = NCFile(id="NC-TEST-001", cam_file_id="CAM-FAKE", program_number="O1000001", file_name="O1000001.nc", file_content="O1000001\nG00 X0 Y0\nM30\n")
            db.session.add(nc_file)
            db.session.commit()

            client = app.test_client()

            r_json = client.get("/api/nc-files/NC-TEST-001")
            print("GET /api/nc-files/NC-TEST-001           -> real Content-Type:", r_json.content_type, "body:", r_json.get_json())

            r_download = client.get("/api/nc-files/NC-TEST-001/download")
            print("GET /api/nc-files/NC-TEST-001/download  -> real Content-Type:", r_download.content_type, "body:", r_download.get_data(as_text=True))

            assert r_json.content_type == "application/json"
            assert r_download.content_type.startswith("text/plain")
            assert r_json.get_json()["data"]["id"] == "NC-TEST-001"
            assert r_download.get_data(as_text=True) == "O1000001\nG00 X0 Y0\nM30\n"
            print("the identical real underlying NC file, two genuinely different real representations - metadata as JSON, real content as plain text - selected by a different real URL, not a real Accept header")
    updated_project:
      applicable: false
    mechanical_walkthrough:
      applicable: true
      items:
        - element: 'r_json = client.get("/api/nc-files/NC-TEST-001")'
          explanation: >
            Requests the real, JSON metadata representation -
            `get_nc_file`'s own real `to_dict()` call describes the
            resource without delivering its real content.
        - element: 'r_download = client.get("/api/nc-files/NC-TEST-001/download")'
          explanation: >
            Requests the real, raw-content representation, at a
            genuinely separate real URL - `download_nc_file`'s own real
            `send_file(...)` call delivers the real G-code text itself.
        - element: 'assert r_json.content_type == "application/json" / assert r_download.content_type.startswith("text/plain")'
          explanation: >
            Confirms both real, distinct `Content-Type` values - the
            direct, verified proof these are genuinely different real
            representations, not just different real field selections
            of the same shape.
    mental_model:
      applicable: false
    execution_trace:
      applicable: false
    cs_lens: >
      This is **multiple representations of one resource**: the real
      underlying thing (an NC program) stays singular, while what a
      client can actually receive about it varies by real format. Also
      recognized in: a Wikipedia article's own real HTML page versus its
      real, separate REST API JSON representation of the identical real
      content; a PDF document's own real text-extraction API alongside
      its real, original binary download; and, in this project's own
      domain, a machine's own real tool table represented both as a real
      JSON object for the UI and as a real, raw offset file a control
      actually loads.
    se_lens: >
      The design principle real content negotiation would follow is one
      real URL, varying its real representation based on a real `Accept`
      header. The real alternative this project's own code actually
      takes: two entirely separate real URLs, one per representation -
      simpler to implement (no real negotiation logic needed at all),
      but the honest cost, proven directly by this unit's own two real
      calls: a caller has to already know, in advance, which of two real
      URLs to hit for which real format - there's no real, single
      "give me this resource" request that adapts to what the caller
      actually wants.
    commands:
      - command: backend/.venv/Scripts/python.exe verification/phase-03/lab_rest_representations.py
        explanation: >
          Runs this as a plain script, from the repository root.
