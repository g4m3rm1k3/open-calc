  - title: "Resource Identifiers - Who Decides a Real Name"
    problem: >
      `create_machine` reads a real, required `id` from the request
      body; `create_machine_group` never does. What real, different
      strategy does each one use to decide a new resource's own name?
    socratic_prompt:
      - >
        If a client sends `create_machine` a real `id` that already
        belongs to another machine, this curriculum already found the
        real result: a `400`. What would happen if `create_machine_group`
        tried to reuse an already-taken real `group_id` the identical
        way?
      - >
        Given `create_machine_group`'s own real
        `while MachineGroup.query.get(group_id): ...` loop
        (`machines.py:235-237`), could that same real collision ever
        actually reach a caller as an error at all?
    project_change:
      reference_source: >
        Real specimen: `backend/app/routes/machines.py:118-169`
        (`create_machine`) and `:214-254` (`create_machine_group`), both
        read again this session.
      files_affected: []
      change_type: none
      location: >
        N/A - a new, standalone script; no existing project structure to
        place it within.
      dependencies: >
        A real `User` row with a `programming` role and token.
    new_code:
      applicable: true
      intro: >
        Two real creations, two real identifier strategies:
      file: verification/phase-03/lab_rest_identifiers.py
      status: new
      language: python
      code: |
        import sys
        sys.path.insert(0, "backend")

        from app import create_app, db
        from app.models.user import User
        from app.utils.auth_utils import encode_auth_token

        app = create_app("testing")
        with app.app_context():
            user = User(id="U-TEST-001", email="test-prog@example.com", name="Test Programmer", role="programming")
            db.session.add(user)
            db.session.commit()

            token = encode_auth_token("U-TEST-001", "programming")
            headers = {"Authorization": f"Bearer {token}"}
            client = app.test_client()

            r_machine = client.post(
                "/api/machines",
                json={"id": "M-WHATEVER-I-WANT", "name": "Test Mill", "category": "mill", "subType": "3_axis", "manufacturer": "Haas", "model": "VF-2"},
                headers=headers,
            )
            print("POST /api/machines, client-chosen id 'M-WHATEVER-I-WANT' -> real, actual stored id:", r_machine.get_json()["data"]["id"])

            r_group = client.post("/api/machines/groups", json={"name": "CNC Mills"}, headers=headers)
            print("POST /api/machines/groups, no id in the real request body -> real, server-assigned id:", r_group.get_json()["data"]["id"])

            assert r_machine.get_json()["data"]["id"] == "M-WHATEVER-I-WANT"
            assert r_group.get_json()["data"]["id"] == "GRP-CNC-MILLS"
            print("two real, genuinely different identifier strategies, live in the same API: the client picks a machine's real id; the server derives a group's real id from data it was never asked to name directly")
    updated_project:
      applicable: false
    mechanical_walkthrough:
      applicable: true
      items:
        - element: 'r_machine = client.post("/api/machines", json={"id": "M-WHATEVER-I-WANT", ...}, headers=headers)'
          explanation: >
            Sends a real, arbitrary string as the machine's own real
            `id` - `create_machine`'s own code stores it exactly as
            given, with no real derivation of its own.
        - element: 'r_group = client.post("/api/machines/groups", json={"name": "CNC Mills"}, headers=headers)'
          explanation: >
            Sends no real `id` at all - `create_machine_group`'s own
            real code has to derive one itself, from `data['name']`.
        - element: 'assert r_machine.get_json()["data"]["id"] == "M-WHATEVER-I-WANT"'
          explanation: >
            Confirms, for real, that the client's own arbitrary real
            choice survived unchanged.
    mental_model:
      applicable: false
    execution_trace:
      applicable: false
    cs_lens: >
      This is **identifier assignment strategy**: whether the party
      creating a resource, or the system storing it, decides that
      resource's own real name. Also recognized in: a Git commit's own
      real, content-derived SHA hash (the system decides) versus a
      branch's own real, human-chosen name (the client decides); a
      database's own real choice between a natural key (client-supplied)
      and a surrogate key (system-generated); and, in this project's own
      domain, a real part number a programmer assigns by hand versus a
      real, auto-incrementing revision number the system tracks on its
      own.
    se_lens: >
