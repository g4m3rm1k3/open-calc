        GET /api/nc-files/NC-TEST-001/download  -> real Content-Type: text/plain; charset=utf-8 body: O1000001
        G00 X0 Y0
        M30

        the identical real underlying NC file, two genuinely different real representations - metadata as JSON, real content as plain text - selected by a different real URL, not a real Accept header
