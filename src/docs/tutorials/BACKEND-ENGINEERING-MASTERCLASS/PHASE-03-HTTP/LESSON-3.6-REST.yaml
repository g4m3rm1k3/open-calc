      language: python
      code: |
        import sys
        sys.path.insert(0, "backend")

        from app import create_app, db
        from app.models.user import User
        from app.utils.auth_utils import encode_auth_token

        app = create_app("testing")
        with app.app_context():
            prog_user = User(id="U-TEST-001", email="test-prog@example.com", name="Test Programmer", role="programming")
            admin_user = User(id="U-TEST-002", email="test-admin@example.com", name="Test Admin", role="admin")
            db.session.add(prog_user)
            db.session.add(admin_user)
            db.session.commit()

            prog_token = encode_auth_token("U-TEST-001", "programming")
            admin_token = encode_auth_token("U-TEST-002", "admin")
            prog_headers = {"Authorization": f"Bearer {prog_token}"}
            admin_headers = {"Authorization": f"Bearer {admin_token}"}
            client = app.test_client()

            r_create = client.post(
                "/api/machines",
                json={"id": "M-TEST-001", "name": "Test Mill", "category": "mill", "subType": "3_axis", "manufacturer": "Haas", "model": "VF-2"},
                headers=prog_headers,
            )
            print("CREATE (POST)         -> status:", r_create.status_code, "name:", r_create.get_json()["data"]["name"])

            r_read = client.get("/api/machines/M-TEST-001")
            print("READ   (GET)          -> status:", r_read.status_code, "name:", r_read.get_json()["data"]["name"])

            r_update = client.patch("/api/machines/M-TEST-001", json={"name": "Renamed Mill"}, headers=prog_headers)
            print("UPDATE (PATCH)        -> status:", r_update.status_code, "name:", r_update.get_json()["data"]["name"])

            r_delete = client.delete("/api/machines/M-TEST-001", headers=admin_headers)
            print("DELETE (DELETE)       -> status:", r_delete.status_code, "body:", r_delete.get_json())

            r_read_again = client.get("/api/machines/M-TEST-001")
            print("READ again (GET)      -> status:", r_read_again.status_code)

            assert r_create.status_code == 201
            assert r_read.status_code == 200
            assert r_update.get_json()["data"]["name"] == "Renamed Mill"
            assert r_delete.status_code == 200
            assert r_read_again.status_code == 404
            print("one real resource, through its entire real lifecycle: created, read, updated, deleted, and genuinely gone")
