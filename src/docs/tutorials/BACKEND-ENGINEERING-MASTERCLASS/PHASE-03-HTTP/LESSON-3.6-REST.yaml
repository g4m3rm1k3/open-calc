  - title: "Idempotency - Which Real Retries Are Actually Safe"
    problem: >
      A real client, unsure whether its first real request actually
      reached the server (a real, dropped connection, a real timeout),
      has to decide whether resending it is safe. Does that decision
      depend on which real method it used?
    socratic_prompt:
      - >
        This curriculum already found `update_machine_status`'s own real
        `PUT` idempotent by end state, and `create_machine_group`'s own
        real `POST` genuinely not. If a real client auto-retries both
        the identical way after an uncertain failure, what real,
        different consequence would each one actually have?
      - >
        Is there anything in `create_machine_group`'s own real code that
        could tell a legitimate retry apart from a real, second,
        intentional request for a different group with the same real
        name?
    project_change:
      reference_source: >
        Real specimens: `backend/app/routes/machines.py:80-115`
        (`update_machine_status`) and `:214-254` (`create_machine_group`),
        both read again this session.
      files_affected: []
      change_type: none
      location: >
        N/A - a new, standalone script; no existing project structure to
        place it within.
      dependencies: >
        A real `Machine` row; a real `User` row with a `programming`
        role and token.
    new_code:
      applicable: true
      intro: >
        A real, simulated client retry - the identical request, sent
        twice in immediate succession - run against one idempotent
        method and one that isn't:
      file: verification/phase-03/lab_rest_idempotency.py
      status: new
      language: python
      code: |
        import sys
        sys.path.insert(0, "backend")

        from app import create_app, db
        from app.models.machine import Machine
        from app.models.user import User
        from app.utils.auth_utils import encode_auth_token

        app = create_app("testing")
        with app.app_context():
            machine = Machine(id="M-TEST-001", name="Test Mill", category="mill", sub_type="3_axis", status="available")
            user = User(id="U-TEST-001", email="test-prog@example.com", name="Test Programmer", role="programming")
            db.session.add(machine)
            db.session.add(user)
            db.session.commit()

            token = encode_auth_token("U-TEST-001", "programming")
            headers = {"Authorization": f"Bearer {token}"}
            client = app.test_client()

            def real_retry_is_safe(method_name, call):
                real_response = call()
                simulated_retry = call()
                return real_response, simulated_retry

            put_body = {"status": "running"}
            r1, r2 = real_retry_is_safe(
                "PUT",
                lambda: client.put("/api/machines/M-TEST-001/status", json=put_body, headers=headers),
            )
            print("PUT, called twice as a real client retry would  -> real end states match:", r1.get_json()["data"]["status"] == r2.get_json()["data"]["status"] == "running")

            post_body = {"name": "CNC Mills"}
            r3, r4 = real_retry_is_safe(
                "POST",
                lambda: client.post("/api/machines/groups", json=post_body, headers=headers),
            )
            print("POST, called twice as a real client retry would -> real ids created:", r3.get_json()["data"]["id"], "and", r4.get_json()["data"]["id"])

            assert r1.get_json()["data"] == r2.get_json()["data"]
            assert r3.get_json()["data"]["id"] != r4.get_json()["data"]["id"]
            print("a real client that auto-retries a PUT after an uncertain timeout is safe; a real client that auto-retries a POST the identical way just created a second, real, unwanted resource")
    updated_project:
      applicable: false
    mechanical_walkthrough:
      applicable: true
      items:
        - element: 'def real_retry_is_safe(method_name, call): real_response = call(); simulated_retry = call(); return real_response, simulated_retry'
          explanation: >
            A small, real helper simulating exactly what a real client
            does when it can't tell whether its first request landed -
            it just sends the identical real request again.
        - element: 'r1, r2 = real_retry_is_safe("PUT", lambda: client.put(...))'
          explanation: >
            Runs the real simulated retry against `update_machine_status` -
            two real calls, identical real body.
        - element: 'r3, r4 = real_retry_is_safe("POST", lambda: client.post(...))'
          explanation: >
            Runs the identical real simulated-retry pattern against
            `create_machine_group` - the same real helper, a genuinely
            different real method underneath it.
        - element: 'assert r1.get_json()["data"] == r2.get_json()["data"] / assert r3.get_json()["data"]["id"] != r4.get_json()["data"]["id"]'
          explanation: >
            Confirms both real, opposite outcomes from the identical real
            retry pattern - proof the safety of a retry depends entirely
            on which real method was retried, not on how the retry
            itself was performed.
    mental_model:
      applicable: false
    execution_trace:
      applicable: false
    cs_lens: >
      This is **retry safety as a real consequence of idempotency**: a
      real client's own decision about whether to auto-retry a failed
      request can be made purely from the real HTTP method, without
      knowing anything about what a specific route actually does
      internally. Also recognized in: a real distributed system's own
      "at-least-once delivery" guarantee, which only stays safe for real,
      idempotent operations; a real shell script's own `mkdir -p`
      (idempotent - safe to rerun) versus a bare `mkdir` (fails the
      second real time, in its own different way); and, in this
      project's own domain, re-sending a real "set spindle speed to
      2000" command safely, versus re-sending a real "advance tool
      offset by 0.001" command, which would apply the real offset twice.
    se_lens: >
      The design principle is that idempotency isn't just an internal
      implementation detail - it's a real, load-bearing promise a client
      depends on to make its own real retry decisions safely. The real
      alternative some real APIs use instead: a client-supplied real
      idempotency key, letting even a `POST` be safely retried by having
      the server recognize a repeated real key and return the original
      real result instead of creating a second one; the honest cost of
      not having that here, proven directly by this unit's own real run:
      a real client talking to `create_machine_group` has no real, safe
      way to retry after an uncertain failure at all - it has to either
      risk a real duplicate, or manually check whether the first real
      attempt actually succeeded before ever resending.
    commands:
      - command: backend/.venv/Scripts/python.exe verification/phase-03/lab_rest_idempotency.py
        explanation: >
          Runs this as a plain script, from the repository root.
    verification:
      applicable: true
      real_output: |
        Seeding default users...
        PUT, called twice as a real client retry would  -> real end states match: True
        POST, called twice as a real client retry would -> real ids created: GRP-CNC-MILLS and GRP-CNC-MILLS-1
        a real client that auto-retries a PUT after an uncertain timeout is safe; a real client that auto-retries a POST the identical way just created a second, real, unwanted resource
      output_file: verification/phase-03/lab_rest_idempotency_output.txt
    connection_to_previous: >
      The previous unit traced one resource through every real
      operation; this unit closes the lesson by asking which of those
      real operations a real, uncertain client could ever safely repeat
