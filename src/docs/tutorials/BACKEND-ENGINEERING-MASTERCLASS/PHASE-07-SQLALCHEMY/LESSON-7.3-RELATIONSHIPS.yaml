    cs_lens: >
      This is **referential cleanup on deletion** - deciding what a
      dependent reference should become once the thing it referred to
      is gone. Also recognized in: a raw pointer in a language like C
      left dangling after the memory it pointed at is freed, with
      nothing automatically clearing it (the real absence of this
      behavior, useful as a contrast - SQLAlchemy's own real default
      here is the opposite: it actively nulls the reference rather than
      leaving it dangling); a filesystem symbolic link left pointing at
      a path after the real file it named is deleted; and, in this
      project's own domain, this project's own real
      `CAMDocument.pairing = db.relationship('MachineCAMPairing',
      backref='documents')` (`backend/app/models/machine_pairing.py:137`),
      which - like `MachineGroup.machines` - also sets no `cascade=` at
      all.
    se_lens: >
      The design principle at play is SQLAlchemy's own real default:
      with no `cascade=` set, deleting a parent nulls the foreign key on
      any real, already-loaded related row rather than deleting it or
      leaving it dangling - proven directly by this unit's own real
      output. The real alternative, already chosen elsewhere in this
      exact project - `CAMFile.nc_files`/`CAMFile.sequences`
      (`backend/app/models/cam_file.py:72-73`), both real
      `cascade='all, delete-orphan'` - deletes the real children along
      with their parent instead; the honest cost of the default this
      project's own `Machine`/`MachineGroup` relationship actually
      relies on: a `Machine` row can end up with a real, `NULL`
      `group_id` silently, with nothing forcing a caller to notice or
      handle a machine that used to belong to a group and now belongs to
      none.
