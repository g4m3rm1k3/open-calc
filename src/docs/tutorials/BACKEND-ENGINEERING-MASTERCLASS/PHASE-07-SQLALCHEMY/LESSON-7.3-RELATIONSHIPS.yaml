      one moment those earlier units never tested - when part of it is
      deleted.

closing:
  connect_the_pieces: >
    One real relationship, `MachineGroup.machines = db.relationship(
    'Machine', backref='group', lazy='dynamic')`, traced through every
    real thing it actually does: it adds a real `.machines` attribute to
    `MachineGroup` and, via `backref='group'`, a real `.group` attribute
    directly onto `Machine`, with nothing in `Machine`'s own class body
    declaring it. Accessing `group.machines` doesn't return a plain
    list - `type()` shows it's a real `AppenderQuery`, which is exactly
    why calling `.filter(Machine.sub_type == '5_axis')` directly on it,
    after already calling `.all()` on the same object, works at all.
    And with no `cascade=` set anywhere on this real declaration,
    deleting the real `MachineGroup` row leaves the real `Machine` row
    fully intact - `machine still exists: True` - with its own real
    `group_id` set to `None`, not deleted alongside it and not left
    dangling either.
  next_lesson_pointer: >
    This lesson examined a relationship already fully declared. Next,
    this curriculum looks at how to actually query through the ORM
    directly, comparing what it produces against the real, raw SQL
    doing the identical job.
