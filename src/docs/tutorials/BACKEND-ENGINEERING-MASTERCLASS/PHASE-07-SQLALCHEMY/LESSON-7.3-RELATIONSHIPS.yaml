      code: |
        import sys
        sys.path.insert(0, "backend")

        from app import create_app, db
        from app.models.machine import Machine, MachineGroup

        app = create_app("testing")

        with app.app_context():
            group = MachineGroup(id="G-LATHES", name="Lathe Room", type="location")
            db.session.add(group)
            db.session.commit()

            machine = Machine(id="M-CASC-001", name="Okuma Genos", category="lathe", sub_type="single_turret", group_id="G-LATHES")
            db.session.add(machine)
            db.session.commit()

            print("before delete:")
            print("  machine.group_id:", repr(machine.group_id))

            db.session.delete(group)
            db.session.commit()

            db.session.expire_all()
            reloaded = Machine.query.get("M-CASC-001")
            print()
            print("after deleting the group, with no cascade= set on the relationship:")
            print("  machine still exists:", reloaded is not None)
            print("  reloaded.group_id:", repr(reloaded.group_id))
