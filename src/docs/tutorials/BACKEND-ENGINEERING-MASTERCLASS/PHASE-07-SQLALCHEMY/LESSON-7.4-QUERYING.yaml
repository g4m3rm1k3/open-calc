number: "7.4"
title: "Querying"
path_note: >
  File paths under backend/... refer to the real manufacturing-platform
  repository. Paths under verification/... refer to that same
  repository's verification folder.

what_you_will_build: >
  Three real, run labs comparing SQLAlchemy's own real query methods
  against the real SQL they actually compile into, using this project's
  own real, already-shipped `GET /api/machines` route
  (`backend/app/routes/machines.py:14-45`) as the evidence: its real,
  working `.filter(Machine.status == status)` call; its real,
  already-shipped, genuinely broken `.filter(Machine.type ==
  machine_type)` call, triggered for real against this project's own
  real, running app; and the real difference between `.count()` and
  `len(query.all())` - the exact real choice this route's own code
  already made. The transferable problem: an ORM query can fail at
  three different, real points - building the Python query object,
  compiling it to SQL, or running that SQL against the database - and
  which point a given failure happens at changes what kind of error you
  actually get.

what_you_need_to_know_first: >
  What a SQL `WHERE` clause does; what a real Python `AttributeError`
  is and when it's raised; what a real SQL aggregate function (like
  `COUNT`) computes, and where; what a class attribute is versus an
  instance attribute.

terms:
  - name: query object
    definition: >
      A real, structured Python object (SQLAlchemy's own `Query` class,
      or a further-narrowed version of one) representing a real,
      not-yet-executed database read - built up by chaining real
      methods (`.filter(...)`, `.order_by(...)`) that each return a new,
      real query object, rather than executing anything immediately. It
      exists so a query can be assembled conditionally, piece by piece
      (exactly the way this project's own real `get_machines` route
      already does, adding a real `.filter(...)` only when a given query
      parameter is actually present), with the real SQL compiled only
      once, at the end, from whatever pieces actually got added.
  - name: aggregate
    definition: >
      A real SQL function (`COUNT`, `SUM`, `AVG`, `MAX`, `MIN`) that
      computes one real value across many real rows, inside the
      database itself, rather than handing every real row back to the
      caller to compute the same value in application code. It exists
      so a question like "how many" can be answered by the database
      doing the real counting internally, without every matching row's
      own full, real data ever needing to leave the database at all.

objects_and_methods:
  - name: Machine.query (.filter / .order_by / .count / .all)
    what_it_is: >
      `Machine.query` is the real, class-bound query interface Flask-
      SQLAlchemy attaches to every real model, already used by this
      project's own real `get_machines` route; `.filter`, `.order_by`,
      `.count`, and `.all` are four of its real, chainable methods.
    implementation: >
      `Machine.query` starts a real, unfiltered query object.
      `.filter(Machine.status == status)` returns a new real query
      object with a real `WHERE` condition added - this project's own
      real code (`backend/app/routes/machines.py:31-38`) chains up to
      three of these conditionally, one per real query parameter
      actually present. `.order_by(Machine.name)` returns a new real
      query object with a real `ORDER BY` added. `.count()` compiles
      and runs a real `SELECT count(*)` immediately, returning a real
      `int`. `.all()` compiles and runs the real, full `SELECT`
      immediately, returning a real, already-fetched list of `Machine`
      instances.
    its_use: >
      This lesson's own three labs each exercise a different real
      combination of these methods, directly reusing the exact real
      filter/order pattern this project's own `get_machines` route
      already runs in production.
    type: A real class-bound query attribute (`Machine.query`), and four real chainable/terminal methods on the query object it returns.
    responsibility: >
      Assembling a real, structured description of what rows to select
      and how to order them, deferring the real SQL compilation and
      execution until a real terminal method (`.all()`, `.count()`,
      `.first()`, ...) is actually called.
    depends_on: >
      A real, live SQLAlchemy `db` extension instance already bound to
      this app's own configured database; real, valid column
      expressions (`Machine.status`, not an attribute `Machine` doesn't
      actually have).
    connects_to: >
      This project's own real `get_machines` route
      (`backend/app/routes/machines.py:14-45`) builds a real query this
      exact way, conditionally, from real, incoming query-string
      parameters.
    shape: >
      `.filter`/`.order_by` take a real column expression in, return a
      new real query object out; `.count` takes nothing, returns a real
      `int`; `.all` takes nothing, returns a real, already-fetched list
      of real model instances.

  - name: Session (.add_all / .commit)
    what_it_is: >
      The real, live session object this project's own `db` extension
      exposes as `db.session`, and two of its real methods this
      lesson's own labs use to set up real rows before querying them.
    implementation: >
      `db.session.add_all([a, b, ...])` registers every real object in
      the given list as pending, one at a time; `db.session.commit()`
      flushes every real pending change into real SQL and finalizes the
      real transaction.
    its_use: >
      Every one of this lesson's own three labs uses this identical
      real pair to build the real `Machine` rows each lab then queries.
    type: A real instance of SQLAlchemy's `Session` class (`db.session`).
    responsibility: >
      Staging every real, new object as pending, then, on `commit`,
      compiling and sending the real SQL that actually persists them.
    depends_on: >
      A real, open connection from this app's own real `Engine`.
    connects_to: >
      Every real query this lesson's own labs then run reads back
      exactly the rows these two calls just committed.
    shape: >
      `.add_all` takes a real list of objects in, returns nothing;
      `.commit` takes nothing, returns nothing, but has the real,
      observable side effect of persisting every pending change.

  - name: sqlalchemy.event.listens_for
    what_it_is: >
      A real, top-level function from SQLAlchemy's own `sqlalchemy.event`
      module, used here as a decorator, registering a real callback
      against one specific real event a given real object (here, an
      `Engine`) can fire.
    implementation: >
      `@event.listens_for(engine, "before_cursor_execute") def
      capture_sql(conn, cursor, statement, parameters, context,
      executemany): captured.append((statement, parameters))` -
      registers `capture_sql` to run immediately before the real
      `Engine`'s underlying DBAPI cursor actually executes any real SQL,
      receiving the real, exact statement text and real bound
      parameters as arguments.
    its_use: >
      Two of this lesson's own three labs use this identical, real
      mechanism as the one direct way to observe the literal real SQL
      each query method actually compiles into.
    type: A real function from SQLAlchemy's own `sqlalchemy.event` module, used as a decorator.
    responsibility: >
      Firing a real, user-supplied callback at one specific real, named
      moment in the real `Engine`'s own execution - the instant before
      real SQL is sent, not before or after.
    depends_on: >
      A real `Engine` instance (`db.engine`) and a real, named, valid
      event string (`"before_cursor_execute"`).
    connects_to: >
      The real, module-level `captured` list each lab defines - every
      real statement/parameters pair this callback observes gets
      appended there.
    shape: >
      Takes a real target object and a real event name string in (plus
      the function it decorates); the decorated callback itself takes
      six real, fixed positional arguments SQLAlchemy always supplies
      for this specific event.

  - name: app.test_client (.get / .status_code)
    what_it_is: >
      `app.test_client()` is a real method on this project's own real
      `Flask` app instance, returning a real `FlaskClient` - the same
      real class already used to test HTTP routes throughout this
      curriculum; `.get` is a real method on it, and `.status_code` a
      real attribute on the `Response` object it returns.
    implementation: >
      `client = app.test_client()` builds one real, reusable client,
      in-process, with no real network socket involved.
      `client.get(path)` simulates a real HTTP `GET` request against
      the given real path, running this app's own real routing and view
      function exactly as a real deployed request would, and returns a
      real `Response` object whose `.status_code` is a real `int`.
    its_use: >
      This lesson's own second unit calls this twice, on the identical
      real client, against the identical real route
      (`GET /api/machines`) - once with a real, working query
      parameter, once with the real, broken one.
    type: A real method (`app.test_client`) returning a real `FlaskClient` instance; `.get` a real instance method on it.
    responsibility: >
      Running a real HTTP request through this app's own real routing
      and view-function code, in-process, without a real, separate
      server process or socket.
    depends_on: >
      A fully-built, real `Flask` app instance (`create_app("testing")`).
    connects_to: >
      Each real `client.get(...)` call reaches this project's own real
      `get_machines` view function directly, running its real,
      unmodified code.
    shape: >
      `app.test_client()` takes nothing in, returns one real
      `FlaskClient`; `.get(path)` takes a real path string in, returns
      one real `Response` object whose `.status_code` is a real `int`.

concept_units:
  - title: "Filtering - .filter() and What Real SQL It Actually Compiles Into"
    problem: >
      This project's own real `get_machines` route builds a query
      conditionally: `query = query.filter(Machine.status == status)`,
      only when a real `status` query parameter is present. What real
      SQL does that one real line actually produce, and does it match
      what a hand-written `WHERE` clause for the identical filter would
      look like?
    socratic_prompt:
      - >
        `Machine.status == status` looks like an ordinary Python
        equality check, evaluating to `True` or `False`. Given that
        `.filter(...)` clearly doesn't receive a bare `True`/`False` at
        all - it receives something it can compile into real SQL later -
        what would `Machine.status == status` actually have to return
        instead, for that to be possible?
      - >
        This project's own real `get_machines` route chains up to three
        real `.filter(...)` calls, one per parameter, only when each is
        present. If two real filters both apply, what real SQL keyword
        would you expect to join their two real conditions together?
    project_change:
      reference_source: >
        Real specimen: `backend/app/routes/machines.py:27-40`
        (`get_machines`), read again this session - the exact real
        route this lesson's own lab mirrors.
      files_affected:
        - path: verification/phase-07/lab_query_filter_vs_sql.py
          status: new
      change_type: add
      location: N/A - a new, standalone script; no existing project structure to place it within.
      dependencies: >
        This project's own real `Machine` model; the real
        `sqlalchemy.event.listens_for` SQL-capture mechanism.
    new_code:
      applicable: true
      intro: >
        The identical real filter-then-order pattern this project's own
        `get_machines` route already runs, with the real, generated SQL
        captured the instant it's sent:
      file: verification/phase-07/lab_query_filter_vs_sql.py
      status: new
      language: python
      code: |
        import sys
        sys.path.insert(0, "backend")

        from sqlalchemy import event

        from app import create_app, db
        from app.models.machine import Machine

        app = create_app("testing")

        captured = []

        with app.app_context():
            engine = db.engine

            db.session.add_all([
                Machine(id="M-Q-001", name="Haas VF-2", category="mill", sub_type="3_axis", status="available"),
                Machine(id="M-Q-002", name="Haas UMC-750", category="mill", sub_type="5_axis", status="running"),
            ])
            db.session.commit()

            @event.listens_for(engine, "before_cursor_execute")
            def capture_sql(conn, cursor, statement, parameters, context, executemany):
                captured.append((statement, parameters))

            status = "available"
            query = Machine.query
            query = query.filter(Machine.status == status)
            results = query.order_by(Machine.name).all()

            for statement, parameters in captured:
                print("statement:", " ".join(statement.split()))
                print("parameters:", parameters)

            print()
            print("results:")
            for m in results:
                print(" ", m.id, m.name, m.status)
    updated_project:
      applicable: false
    mechanical_walkthrough:
      applicable: true
      items:
        - element: 'query = Machine.query'
          explanation: >
            Starts a real, unfiltered query object - no real SQL has
            run yet; this line alone touches no database connection at
            all, the same real deferred-execution behavior a
            `db.relationship`'s own dynamic query object already has.
        - element: 'query = query.filter(Machine.status == status)'
          explanation: >
            `Machine.status` is a real SQLAlchemy `InstrumentedAttribute`,
            not a plain Python string - `== status` doesn't evaluate to
            a real `bool` here; it produces a real, compilable SQL
            expression object `.filter` can actually use, exactly the
            real mechanism this project's own `get_machines` route
            already relies on.
        - element: 'results = query.order_by(Machine.name).all()'
          explanation: >
            Adds a real `ORDER BY`, then `.all()` is the real, terminal
            call that finally compiles and runs the real, complete SQL -
            everything built up across the two lines above happens in
            one real round trip here, not one per `.filter`/`.order_by`
            call.
        - element: 'for statement, parameters in captured: print(...)'
          explanation: >
            Prints the real, literal SQL text and real bound parameter
            this call actually sent - direct proof of what the real
            `.filter(Machine.status == status)` call compiled into,
            rather than an assumption about what it "probably" produces.
    mental_model:
      applicable: false
    execution_trace:
      applicable: false
    cs_lens: >
      This is the **builder pattern**: each real method call
      (`.filter`, `.order_by`) returns a new, real, still-incomplete
      object representing the request so far, rather than mutating
      something in place or executing immediately - the same real
      pattern letting `Machine.query`, `.filter(...)`, and
      `.order_by(...)` be chained in any real combination the caller
      actually needs. Also recognized in: a real HTTP client library's
      own request builder, chaining `.header(...).body(...).send()`; a
      real GUI layout builder, chaining `.add(...).align(...)`; and, in
      this project's own domain, this project's own real
      `get_machines` route conditionally chaining up to three real
      `.filter(...)` calls, one per query parameter actually present.
    se_lens: >
      The design principle is that assembling a real query and running
      it are two separate, real steps - a real query object can be
      built up conditionally, across several real lines, or even
      several real function calls, before anything is actually sent.
      The real alternative not chosen here - building a raw SQL string
      by hand, concatenating a real `WHERE` clause onto it only when
      each real filter applies - is exactly as flexible, but the honest
      cost of that real alternative is real, direct exposure to SQL
      injection if any piece of that string ever includes unescaped
      user input, a risk the query-object approach this project's real
      route actually uses avoids entirely by never building SQL text by
      hand at all.
    commands:
      - command: backend/.venv/Scripts/python.exe verification/phase-07/lab_query_filter_vs_sql.py
        explanation: >
          Runs this as a plain script, from the repository root; uses
          this app's own real `"testing"` config, so it leaves no real
          file behind.
    verification:
      applicable: true
      real_output: |
        Seeding default users...
        statement: SELECT machines.id AS machines_id, machines.name AS machines_name, machines.category AS machines_category, machines.sub_type AS machines_sub_type, machines.manufacturer AS machines_manufacturer, machines.model AS machines_model, machines.serial_number AS machines_serial_number, machines.location AS machines_location, machines.axes AS machines_axes, machines.x_travel AS machines_x_travel, machines.y_travel AS machines_y_travel, machines.z_travel AS machines_z_travel, machines.max_spindle_speed AS machines_max_spindle_speed, machines.spindle_taper AS machines_spindle_taper, machines.has_tool_changer AS machines_has_tool_changer, machines.tool_changer_capacity AS machines_tool_changer_capacity, machines.status AS machines_status, machines.current_part_id AS machines_current_part_id, machines.current_operator_client_id AS machines_current_operator_client_id, machines.operator_last_heartbeat_at AS machines_operator_last_heartbeat_at, machines.group_id AS machines_group_id, machines.created_at AS machines_created_at, machines.updated_at AS machines_updated_at FROM machines WHERE machines.status = ? ORDER BY machines.name
        parameters: ('available',)

        results:
          M-Q-001 Haas VF-2 available
      output_file: verification/phase-07/lab_query_filter_vs_sql_output.txt
    connection_to_previous: >
      This lesson's own first unit; it establishes the real, working
      half of this project's own `get_machines` route - the next unit
      examines the identical route's other real filter, which does not
      work at all.

  - title: "Where a Query Can Actually Fail - the Real, Live ?type= Crash"
    problem: >
      This project's own real `get_machines` route also has
      `query = query.filter(Machine.type == machine_type)`, guarded the
      identical real way as the working `status` filter the previous
      unit just proved works. Given `Machine`'s own real columns are
      `id`, `name`, `category`, `sub_type`, and 19 others - never
      `type` - what actually happens when a real request supplies
      `?type=mill`?
    socratic_prompt:
      - >
        A SQL `WHERE` clause naming a column that doesn't exist in a
        real table fails at the real database, as a real SQL error,
        once that SQL is actually sent. Given `Machine.type` is
        evaluated in Python, one real line before any SQL gets built at
        all, would you expect this specific bug to fail the identical
        way, or somewhere earlier?
      - >
        This project's own real `get_machines` route never wraps this
        line in a real `try`/`except`. Before running it, what real,
        concrete error would you predict - both its real Python
        exception type and what real message it names?
    project_change:
      reference_source: >
        Real specimen: `backend/app/routes/machines.py:14-45`
        (`get_machines`), specifically line 36
        (`query = query.filter(Machine.type == machine_type)`), read
        again this session - this project's own real, already-shipped,
        unguarded code, not a constructed example.
      files_affected:
        - path: verification/phase-07/lab_query_attribute_error.py
          status: new
      change_type: add
      location: N/A - a new, standalone script; no existing project structure to place it within.
      dependencies: >
        This project's own real, running Flask app (`create_app`,
        `app.test_client()`) - this unit calls the real route directly,
        not a standalone query built by hand.
    new_code:
      applicable: true
      intro: >
        The real, live route, called twice - once with the real,
        working `status` filter, once with the real, broken `type`
        filter:
      file: verification/phase-07/lab_query_attribute_error.py
