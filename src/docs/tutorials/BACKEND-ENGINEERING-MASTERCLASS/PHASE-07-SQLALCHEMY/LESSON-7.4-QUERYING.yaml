closing:
  connect_the_pieces: >
    One real route, `get_machines`, traced through every real way its
    own query construction actually behaves: `.filter(Machine.status ==
    status)` compiles into a real `WHERE machines.status = ?`, proven by
    capturing the exact real SQL sent; the identical real pattern with
    `Machine.type` instead never reaches SQL at all, failing as a real
    Python `AttributeError` the instant the class attribute is looked
    up - a genuinely different real failure, one layer earlier in the
    same real pipeline; and the route's own real choice, `len(machines)`
    after a real `.all()`, is shown against the real alternative,
    `.count()`, which compiles into an entirely different, real
    `SELECT count(*)` statement that never transfers a single full row.
  next_lesson_pointer: >
    Every real query this lesson built returned real ORM objects
    directly. Next, this curriculum looks at why those real objects
    still aren't what actually gets sent back to a real API caller.
