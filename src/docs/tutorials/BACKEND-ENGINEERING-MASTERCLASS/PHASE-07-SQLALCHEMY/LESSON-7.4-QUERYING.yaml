  - title: "Aggregates - .count() vs len(), and What This Route Already Chose"
    problem: >
      This project's own real `get_machines` route computes
      `'total': len(machines)` - counting a real, already-fetched
      Python list, after every real column of every matching row has
      already been transferred out of the database. Does SQL itself
      offer a way to answer "how many," without fetching the rows at
      all - and, if so, why didn't this route use it?
    socratic_prompt:
      - >
        `len(machines)` can only run after `machines = query.all()` has
        already completed. Given `.all()` fetches every real column of
        every real matching row, what real, wasted work happens here if
        a caller only ever wanted the real count, never the actual rows?
      - >
        SQL has a real, built-in `COUNT(*)` function, computed entirely
        inside the database. Given SQLAlchemy already compiles
        `.filter(...)` into a real `WHERE` clause, what would you expect
        a hypothetical `.count()` method to do with that same, real
        `WHERE` clause?
    project_change:
      reference_source: >
        Real specimen: `backend/app/routes/machines.py:40-45`
        (`machines = query.order_by(Machine.name).all()` ... `'total':
        len(machines)`), read again this session - this project's own
        real, already-shipped choice, not a hypothetical.
      files_affected:
        - path: verification/phase-07/lab_query_aggregate_vs_sql.py
          status: new
      change_type: add
      location: N/A - a new, standalone script; no existing project structure to place it within.
      dependencies: >
        This project's own real `Machine` model; the real, already-used
        `event.listens_for` SQL-capture mechanism.
    new_code:
      applicable: true
      intro: >
        The real, generated SQL for both real approaches, run back to
        back against the identical real filter:
      file: verification/phase-07/lab_query_aggregate_vs_sql.py
      status: new
      language: python
      code: |
        import sys
        sys.path.insert(0, "backend")

        from sqlalchemy import event

        from app import create_app, db
        from app.models.machine import Machine

        app = create_app("testing")

        captured = []

        with app.app_context():
            engine = db.engine

            db.session.add_all([
                Machine(id="M-AGG-001", name="Haas VF-2", category="mill", sub_type="3_axis"),
                Machine(id="M-AGG-002", name="Haas UMC-750", category="mill", sub_type="5_axis"),
                Machine(id="M-AGG-003", name="Okuma Genos", category="lathe", sub_type="single_turret"),
            ])
            db.session.commit()

            @event.listens_for(engine, "before_cursor_execute")
            def capture_sql(conn, cursor, statement, parameters, context, executemany):
                captured.append((statement, parameters))

            real_count = Machine.query.filter(Machine.category == "mill").count()

            captured_count_sql = list(captured)
            captured.clear()

            fetched = Machine.query.filter(Machine.category == "mill").all()
            python_len = len(fetched)

            print("Machine.query.filter(...).count() real SQL:")
            for statement, parameters in captured_count_sql:
                print("  statement:", " ".join(statement.split()))
            print("  real_count:", real_count)

            print()
            print("len(query.filter(...).all()) real SQL - what this project's own real get_machines route actually does:")
            for statement, parameters in captured:
