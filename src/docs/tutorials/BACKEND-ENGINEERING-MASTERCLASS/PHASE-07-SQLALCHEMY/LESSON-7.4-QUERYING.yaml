      applicable: false
    mechanical_walkthrough:
      applicable: true
      items:
        - element: 'r1 = client.get("/api/machines?status=available")'
          explanation: >
            Confirms the real, working path still succeeds - the
            identical real route, the identical real filtering
            mechanism the previous unit already proved compiles to real
            SQL correctly.
        - element: 'client.get("/api/machines?type=mill")'
          explanation: >
            Calls the identical real route with the real query
            parameter its own code path never actually protects -
            `machine_type = request.args.get('type')` reads the real
            string `"mill"`, then `Machine.type` is evaluated as a real
            Python attribute access on the `Machine` class itself,
            before any SQL is built at all.
        - element: 'except AttributeError as e: print(repr(e))'
          explanation: >
            Catches and prints the real, exact exception this project's
            own real code actually raises - proof this fails as a
