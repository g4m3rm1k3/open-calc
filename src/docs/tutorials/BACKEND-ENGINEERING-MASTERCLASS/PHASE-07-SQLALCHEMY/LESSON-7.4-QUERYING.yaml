    cs_lens: >
      This is a **failure at the wrong layer of abstraction**: a bug
      that looks, from the route's own code, like it should be a
      data-filtering problem (a machine type that doesn't match
      anything) is actually a real, static naming error, caught the
      moment Python tries to resolve `Machine.type` at all - one layer
      below where SQL, or the database, ever gets involved. Also
      recognized in: a typo'd dictionary key raising `KeyError` before
      any real business logic runs; a JavaScript `undefined.property`
