      The design principle is that the cheapest real place to answer
      "how many" is wherever the real data already sits - inside the
      database - not after paying to move every real row somewhere
      else first. The real alternative this project's own
      `get_machines` route actually chose - `len(machines)`, after a
      real `.all()` - is simpler when the real rows were going to be
      fetched and returned to the caller anyway (which `get_machines`
      genuinely does, in its own `'data'` field, so no real row-transfer
      cost is wasted here); the honest cost of reaching for `len()` as a
      default habit instead of `.count()`: it stops being free the
      moment a caller wants only a real count and not the real rows
      themselves - real work this exact pattern would then be doing for
      no reason.
