      real alternative not chosen here - `Machine.__table__.columns` or
      a small, explicit allow-list of real, valid filter names, checked
      before ever reaching `Machine.type` - would turn this into a
      real, handled `400` instead of an unhandled crash; the honest
      cost already paid by this project's own real, shipped code: every
      real client that has ever sent `?type=...` to this exact route
