            the way back to a real, usable Python object.
    mental_model:
      applicable: true
      diagram: |
        real row in this app's own real database
                |
                | Machine.query.get("M-ORM-002")
                v
          SELECT machines.id, machines.name, ... FROM machines WHERE machines.id = ?   <- real SQL, captured
                |
                v
          Machine(id='M-ORM-002', name='ORM Test Lathe', ...)   <- real Python object, real named attributes
    execution_trace:
      applicable: false
    cs_lens: >
      This is **marshalling**: translating a real, flat, positional data
      shape (a database row - a plain tuple of raw values, no names, as
      this curriculum's own earlier SQL work already proved directly)
      into a real, structured representation
      a program can address by name (`result.manufacturer`, not "the
      fifth value"). Also recognized in: this project's own real JSON
      responses, where a Python `dict` becomes a real, named-field JSON
      body a frontend reads by key; a CSV reader turning one flat,
      comma-separated line into a real, named-field record; and, in this
      project's own domain, a G-code parser turning one flat text line
      into a real, structured command object with named fields (a motion
      type, real coordinate values) rather than an unlabeled string.
    se_lens: >
      The design principle is that the ORM acts as a real translation
      boundary - code on either side of `Machine.query.get` only ever
      deals with real Python objects, never raw rows. The real
      alternative not chosen anywhere in this project - hand-writing raw
      SQL and manually mapping each real tuple back to named values, the
      way this curriculum's own earlier, direct SQL labs did - gives
      full, explicit control over exactly what SQL runs; the honest cost
      of the convenience this project's real code chose instead is
      exactly what this curriculum's own real, counted N+1 finding and
      its own real missing-index finding already proved, both against
      this same real schema: the ORM decides what SQL to generate, and
      that real, generated SQL is not always the real SQL a hand-written
      query would have chosen.
