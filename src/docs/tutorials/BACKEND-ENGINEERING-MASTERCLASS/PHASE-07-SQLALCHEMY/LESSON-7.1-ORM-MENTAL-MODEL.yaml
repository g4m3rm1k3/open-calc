closing:
  connect_the_pieces: >
    One real round trip, traced through both real directions: a plain
    Python `Machine(id="M-ORM-001", ...)` object, staged by
    `db.session.add()` with zero real SQL sent (`captured` still `0`),
    becomes a real, literal `INSERT INTO machines (...) VALUES (...)`
    statement - with `machine.id` and every other real attribute as real
    bound parameters - the instant `db.session.flush()` runs, then made
    durable by `db.session.commit()`, which sends no further real SQL of
    its own. Then, the identical real translation in reverse: a second
    real row, already committed, read back through
    `Machine.query.get("M-ORM-002")` - this project's own real,
    already-shipped call - becomes a real, literal `SELECT ... WHERE
    machines.id = ?` statement, captured the same way, and comes back as
    a genuine `Machine` instance whose `.manufacturer` is real Python
    attribute access, not a raw tuple position. Every `db.session`/
    `.query` call this curriculum's own database work has ever made has
    been running exactly this same real translation, in one direction or
    the other - only now made visible.
  next_lesson_pointer: >
    This lesson treated `Machine` as already fully built. Next, this
    curriculum looks at exactly how a class like `Machine` gets mapped to
    a real table in the first place - the real columns, types, and keys
    the declarative model itself is built from.
