    se_lens: >
      The design principle is that untested code is a real, unverified
      liability, so the honest goal of this step is passing the real
      test that exists, not anticipating tests that don't. The real
      alternative not chosen - writing a more "complete" real
      implementation up front (validating the input's real type,
