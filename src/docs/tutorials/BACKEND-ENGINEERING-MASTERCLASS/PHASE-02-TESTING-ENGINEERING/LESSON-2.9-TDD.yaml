            handling for `None`) added in anticipation of a case the
            current real test never asks about.
    mental_model:
      applicable: false
    execution_trace:
      applicable: false
    cs_lens: >
      This is **GREEN**, TDD's own second real step - and specifically
      an instance of **YAGNI** ("You Aren't Gonna Need It"), a real,
      named principle against building capability a currently-known
      requirement doesn't actually call for. Also recognized in: the
      broader real engineering habit of shipping the minimum real,
      working slice of a feature before its full, generalized version;
      a scientific experiment's own minimal apparatus, built only
      capable of testing the specific real hypothesis at hand; a
      prototype circuit built to prove one real signal path before a
      production board is designed around it; and, in this project's
      own domain, a first-article setup proving one specific real cut
