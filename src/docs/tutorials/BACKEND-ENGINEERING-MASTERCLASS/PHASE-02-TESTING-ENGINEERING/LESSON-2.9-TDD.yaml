    connection_to_previous: >
      The previous three units completed one full, real TDD cycle; this
      unit places that entire cycle side by side with this phase's own
      earlier characterization work, closing the lesson - and this
      phase - by naming exactly what separates them.

closing:
  connect_the_pieces: >
    One real test, importing a function that exists nowhere yet,
    failing with a real `ModuleNotFoundError` before a single one of its
    six parametrized cases ever runs (RED). The smallest real function
    that satisfies all six - a bare, literal list of four real strings -
    turning that same real failure into `6 passed` (GREEN). That same
    real function, restructured into a named `frozenset` constant, run
    against the identical, unedited real test suite, still `6 passed` -
    real proof its internal shape changed while its real, external
    behavior did not (REFACTOR). And, last, that same real cycle held up
    next to this phase's own earlier characterization test on
    `_extract_operation_num`: one test whose real, expected values were
    decided before any code existed to check them against, the other
    whose real, expected values - including a genuinely surprising one -
    were only ever discoverable by running code that was already there
    (TDD vs. characterization). Two real, complementary disciplines,
    each answering a different real question, and this whole phase's own
    real argument for asking either one in a form a machine actually
    checks, rather than trusting either answer from memory.
  next_lesson_pointer: >
    Every real check this phase built - correctness, isolation, doubles,
    HTTP behavior, golden behavior, and now two complete, real testing
    disciplines - has been in service of one goal: knowing exactly what
    this project's real backend does before anything about it changes.
    That is the real foundation the next phase of this curriculum builds
    its first real rebuild on top of.
