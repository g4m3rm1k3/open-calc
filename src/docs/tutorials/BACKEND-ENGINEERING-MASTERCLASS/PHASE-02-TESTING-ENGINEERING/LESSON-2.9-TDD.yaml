    mental_model:
      applicable: true
      diagram: |
        TDD (this lesson's own Units 1-3)          Characterization (this phase's own earlier lesson)
               |                                            |
               v                                            v
        no implementation exists yet                real implementation already exists, untested
               |                                            |
               v                                            v
        author DECIDES expected values              author RUNS the real code to OBSERVE actual values
               |                                            |
               v                                            v
        RED: test fails - code is missing            test passes immediately - it only records what's real
               |                                            |
               v                                            v
        GREEN: write code to match the test           (nothing to write - the test already matches reality)
               |                                            |
               v                                            v
        REFACTOR: restructure, same test stays green   REFACTOR: only safe once real callers are known
    execution_trace:
      applicable: false
    cs_lens: >
      This is the real, structural difference between **specification-
      first** and **observation-first** testing - both are real
      disciplines that put a test before a code change, but they answer
      two genuinely different questions: "what should this do" versus
      "what does this actually do." Also recognized in: a formal
      specification written before an implementation (specification-
      first) versus reverse-engineering a spec from an already-shipped,
      undocumented binary (observation-first); a new API designed
      test-first against a not-yet-built service, versus a contract test
      written against an already-live one; and, in this project's own
      domain, a new part designed to a print's own stated tolerances
      before it exists, versus measuring an already-manufactured
      part with unknown provenance to find out what it actually is.
    se_lens: >
      The design principle is that the right real discipline depends
      entirely on whether the code already exists and already has real
      callers. TDD's own real alternative - writing
      `is_valid_machine_status` first, then testing it - was
      specifically rejected by this lesson's own Unit 1, for genuinely
      new code with no real behavior yet to observe. The
      characterization alternative - deciding what
      `_extract_operation_num` *should* do and writing a test asserting
      that, ignoring its real, current behavior - would have been
      actively dangerous for that specimen: this phase's own earlier
      lesson showed a "should" test would have silently conflicted with
      real, existing behavior nobody had confirmed was safe to change,
      with no real caller's assumptions accounted for. The honest,
      combined cost: a real project needs both disciplines, applied to
      the right real code - using TDD on already-existing, unowned
      behavior risks quietly overwriting something a real caller depends
      on; using characterization on brand-new code makes no sense at
      all, since there is nothing yet to observe.
    commands: []
    verification:
      applicable: false
      exemption_reason: >
        This unit draws only on two real test files' own already-run,
