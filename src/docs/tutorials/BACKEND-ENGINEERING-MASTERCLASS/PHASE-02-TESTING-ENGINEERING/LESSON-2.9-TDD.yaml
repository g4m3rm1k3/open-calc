number: "2.9"
title: "TDD"
path_note: >
  File paths under backend/... refer to the real manufacturing-platform
  repository. Paths under verification/... refer to that same
  repository's verification folder.

what_you_will_build: >
  One real, complete RED-GREEN-REFACTOR cycle, from scratch - a real
  test that fails because the code it checks doesn't exist yet, a real,
  minimal implementation that makes it pass, and a real internal rewrite
  that changes nothing the test can see - building a small, genuinely
  new, reusable version of validation logic this project's own real
  `update_machine_status` route already has to satisfy the exact same
  real requirement. Then, a direct comparison against this phase's own
  characterization testing, to settle when each real discipline actually
  applies.

what_you_need_to_know_first: >
  What a characterization test is, and why it records observed behavior
  instead of intended behavior; what refactoring safety means and how a
  test proves it; what pytest's own test discovery and parametrization
  do.

terms:
  - name: test-driven development (TDD)
    definition: >
      A real development discipline where a failing test for a specific,
      wanted behavior is written *before* the code that satisfies it,
      and that test is what drives what gets built next - never the
      reverse. It exists to keep every real line of production code
      traceable to a specific, already-stated requirement, rather than
      writing code first and hoping tests catch up to it afterward.
  - name: RED
    definition: >
      The first real step of one TDD cycle: writing a test for behavior
      that doesn't exist yet, and confirming, by actually running it,
      that it fails - not skipped, not silently wrong, a real, observed
      failure. It exists to prove the test itself is genuinely capable
      of failing, before it's ever trusted to prove anything passing.
  - name: GREEN
    definition: >
      The second real step of one TDD cycle: writing the smallest real
      amount of production code that makes the currently-failing test
      pass, and nothing more. It exists to keep every real line of code
      justified by a specific, already-failing test, rather than
      building more than what's actually required right now.
  - name: REFACTOR
    definition: >
      The third real step of one TDD cycle: improving the real,
      already-passing code's own internal structure, with the exact
      same test suite, unedited, confirming nothing about its external
      behavior moved. It exists as the identical real discipline an
      earlier lesson already proved under the name refactoring safety,
      now scheduled as a deliberate, required step in every single TDD
      cycle, not an occasional afterthought.

objects_and_methods:
  - name: is_valid_machine_status
    what_it_is: >
      A new, real, small function this lesson builds from nothing,
      through a real RED-GREEN-REFACTOR cycle - not a real, existing
      part of this project's backend, and never wired into it.
    implementation: >
      Its first, GREEN real form:
      `def is_valid_machine_status(status): return status in ["available", "running", "offline", "maintenance"]`;
      its final, REFACTORED real form:
      `VALID_MACHINE_STATUSES = frozenset({"available", "running", "offline", "maintenance"})`
      followed by
      `def is_valid_machine_status(status): return status in VALID_MACHINE_STATUSES`
      - both real forms pass the identical real test suite.
    its_use: >
      This lesson builds it to do exactly what this project's own real
      `update_machine_status` route already checks inline
      (`backend/app/routes/machines.py:98-100`) - whether a given status
      string is one of four real allowed values - as a reusable,
      independently testable function.
    type: A module-level function, defined in a new, standalone module.
    responsibility: >
      Answering one real, narrow question - is this string one of the
      four real, allowed machine statuses - with no side effects and no
      dependency on a database, an app, or any other real collaborator.
    depends_on: Only its own `status` argument - a plain string.
    connects_to: >
      Not called from anywhere in the real backend - this lesson builds
      it as a genuinely new, standalone piece of logic, never wired into
      `update_machine_status` itself.
    shape: >
      Takes one string in, returns one real `bool` out - `True` for
      exactly the same four real values this project's own route
      already treats as valid, `False` for anything else.

  - name: ModuleNotFoundError
    what_it_is: >
      A real, built-in Python exception, raised when an `import`
      statement names a module Python cannot find anywhere on its
      search path.
    implementation: >
      A subclass of Python's built-in `ImportError`; raised
      automatically by Python's own import machinery, carrying the real,
      missing module's name in its message.
    its_use: >
      This lesson's own first, RED run raises this real exception -
      confirmed this session - the moment pytest tries to import a test
      module that itself imports a function from a file that doesn't
      exist yet.
    type: A built-in exception class.
    responsibility: >
      Reporting, specifically, that an entire named module could not be
      located - a more precise real signal than a generic `ImportError`,
      which also covers a module that *was* found but failed partway
      through importing.
    depends_on: >
      An `import` statement (or `from ... import ...`) naming a module
      Python's own import system genuinely cannot find.
    connects_to: >
      Raised while pytest is collecting
      `test_tdd_valid_status.py`, before a single real test in it ever
      runs - this lesson's own real RED state.
    shape: >
      A single exception object, carrying a real message naming the
      missing module - not a return value; its presence is what stops
      collection entirely.

concept_units:
  - title: "RED - A Failing Test for Something That Doesn't Exist Yet"
    problem: >
      This project's own real `update_machine_status` route checks a
      status string against four real allowed values, inline, every
      time it runs (`backend/app/routes/machines.py:98-100`). That same
      real check, worth reusing and testing on its own, doesn't exist as
      its own function anywhere yet. What does starting from a real test
      for code that isn't written yet actually look like?
    socratic_prompt:
      - >
        A test importing `is_valid_machine_status` from a module named
        `valid_status` is about to run, but no file named `valid_status.py`
        exists yet anywhere this test can find it. What real kind of
        failure do you expect - a normal test failure, reported per
        case, or something that happens before any test case even runs?
      - >
        This unit's own real test already lists six real cases -
        four real, valid statuses and two real, invalid ones - before
        any implementation exists at all. What does writing the cases
        first, this way, force the test's own author to decide about
        the function's real behavior before writing a single line of it?
    project_change:
      reference_source: >
        No reference counterpart - this is a genuinely new, from-scratch
        function, not a port of anything already in `backend/`. Real
        motivating evidence: `backend/app/routes/machines.py:98-100`,
        read again this session - the real, inline check this new
        function is meant to reusably replace, never itself edited by
        this lesson.
      files_affected: []
      change_type: none
      location: >
        N/A - a new, standalone test file; no existing project structure
        to place it within.
      dependencies: >
        pytest, already installed in this project's backend virtual
        environment; deliberately, no real `valid_status` module yet.
    new_code:
      applicable: true
      intro: >
        A real test, for a real function that doesn't exist yet
        anywhere on disk:
      file: verification/phase-02/lab_pytest_demo/test_tdd_valid_status.py
      status: new
      language: python
      code: |
        import pytest
        from valid_status import is_valid_machine_status


        @pytest.mark.parametrize("status, expected", [
            ("available", True),
            ("running", True),
            ("offline", True),
            ("maintenance", True),
            ("not_a_real_status", False),
            ("", False),
        ])
        def test_is_valid_machine_status(status, expected):
            assert is_valid_machine_status(status) == expected
    updated_project:
      applicable: false
    mechanical_walkthrough:
      applicable: true
      items:
        - element: 'from valid_status import is_valid_machine_status'
          explanation: >
            An ordinary import statement - except, deliberately, at the
            moment this file is first written, no `valid_status.py`
            exists anywhere pytest can find it; this line is written
            first anyway, stating exactly what the not-yet-written code
            will be named and where it will live.
        - element: '@pytest.mark.parametrize("status, expected", [("available", True), ..., ("", False)])'
          explanation: >
            The same real pytest construct reused from earlier lessons,
            now carrying six real cases decided *before* any real
            implementation exists - four of this project's own real,
            valid status strings, plus two real invalid ones, including
            a real, deliberately empty string.
        - element: 'def test_is_valid_machine_status(status, expected): assert is_valid_machine_status(status) == expected'
          explanation: >
            One real test function, calling a real function that
            doesn't exist yet - not a mistake, the entire real point of
            this step: the test states what's wanted before anything
            satisfies it.
    mental_model:
      applicable: false
    execution_trace:
      applicable: false
    cs_lens: >
      This is **RED**, TDD's own first real step - and specifically a
      real *collection* failure, not a *test* failure: pytest never gets
      as far as running any of the six real parametrized cases, because
      the module they depend on doesn't exist at all yet. Also
      recognized in: a compiler's own "undefined reference" error for a
      function declared but not yet implemented; an interface defined in
      a strongly-typed language before any class implements it; a
      project management practice of writing a ticket's acceptance
      criteria before any code against it exists; and, in this project's
      own domain, a part print's own dimensional tolerances specified
      before the first article is ever machined to check against them.
    se_lens: >
      The design principle is that a test's own real ability to fail is
      itself something worth proving, not assumed. The real alternative
      not chosen - writing `is_valid_machine_status` first, then writing
      a test against it afterward - risks a real, specific failure mode
      this step exists to rule out: a test that would pass regardless of
      whether the code under it is actually correct, because it was
      written to match whatever the code already did, rather than
      stating a real requirement independently first. The honest cost
      of RED: this step, by itself, produces nothing runnable yet - only
      a real, confirmed absence, which only pays off once the next two
      steps follow it.
    commands:
      - command: backend/.venv/Scripts/python.exe -m pytest verification/phase-02/lab_pytest_demo/test_tdd_valid_status.py -v
        explanation: >
          Runs this test under pytest, from the repository root, before
