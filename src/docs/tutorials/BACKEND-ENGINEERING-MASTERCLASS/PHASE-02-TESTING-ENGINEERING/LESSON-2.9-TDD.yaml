  - title: "TDD vs. Characterization - Two Different Real Starting Points"
    problem: >
      This lesson's own three units and this phase's own characterization
      testing both start by writing a real test before touching the code
      it concerns. Given that surface similarity, what actually tells
      them apart?
    socratic_prompt:
      - >
        This lesson's own RED test named exactly six cases, decided
