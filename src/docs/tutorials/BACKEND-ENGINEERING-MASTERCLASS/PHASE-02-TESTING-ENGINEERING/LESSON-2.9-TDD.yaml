    socratic_prompt:
      - >
        The previous unit's own six real cases are already fully known.
        Given that, what is the smallest real Python expression you can
        think of that would make all six pass, without writing more
        logic than those six cases actually require?
      - >
        "The smallest real change that passes" is a real constraint on
        this step, not just a matter of style. What real problem would
        writing much more code than necessary here - handling cases the
        current test never asks about - actually risk?
    project_change:
      reference_source: >
