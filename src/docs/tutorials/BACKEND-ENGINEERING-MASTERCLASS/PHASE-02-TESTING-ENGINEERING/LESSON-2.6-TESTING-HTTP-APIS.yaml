            state.
        - element: 'assert refreshed.status == "running" / assert refreshed.current_part_id == "P-TEST-001"'
          explanation: >
            The real proof this unit exists to demonstrate: checking the
            database directly confirms the same two real values the
            response body already claimed - if `update_machine_status`
            had returned a fabricated success without actually
            committing, these two lines, not the response check above
            them, are what would have caught it.
    mental_model:
      applicable: false
    execution_trace:
      applicable: false
    cs_lens: >
      This is verifying a **side effect** independently of its own
      reported result - the same discipline an earlier lesson's own
      integration test first established, now applied specifically
      through a real HTTP request instead of a direct function call.
      Also recognized in: a bank transfer's own real ledger balance
      checked after an API call reports "success," not merely trusted;
