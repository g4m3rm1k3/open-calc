  - title: "Response and Status - What Comes Back, and What It Means"
    problem: >
      A response carries more than a bare status code - real headers of
      its own, and a real body. What real, separate facts does
      inspecting a full `Response` object actually let a test check?
    socratic_prompt:
      - >
        `response.status_code` is `200`, an `int`; `response.status` is
        `'200 OK'`, a string. What real, different job does each one
        actually do for a reader or a piece of code checking it?
      - >
        If a route only ever returned a bare `200` with no real content
        at all, would checking `response.content_type` still tell you
        anything real about what came back?
    project_change:
      reference_source: >
        Real specimen: `backend/app/routes/machines.py:48-61`
        (`get_machine`), reused from this lesson's first unit, now
        inspected against both a real, existing machine and a real,
        nonexistent one.
      files_affected: []
      change_type: none
      location: >
        N/A - a new, standalone script; no existing project structure to
        place it within.
      dependencies: >
        A real `Machine` row, the same as this lesson's first unit.
    new_code:
      applicable: true
      intro: >
        One real, successful request, inspected across four separate
        real facts, next to one real, failing request:
      file: verification/phase-02/lab_pytest_demo/lab_http_response_status.py
      status: new
      language: python
      code: |
        import sys
        sys.path.insert(0, "backend")

        from app import create_app, db
        from app.models.machine import Machine

        app = create_app("testing")
        with app.app_context():
            machine = Machine(id="M-TEST-001", name="Test Mill", category="mill", sub_type="3_axis", status="available")
            db.session.add(machine)
            db.session.commit()

            client = app.test_client()
            response = client.get("/api/machines/M-TEST-001")

            print("response.status_code:", response.status_code)
            print("response.status:", response.status)
            print("response.content_type:", response.content_type)
            print("response.get_json():", response.get_json())

            r_missing = client.get("/api/machines/DOES-NOT-EXIST")
            print("missing machine -> response.status_code:", r_missing.status_code)
            print("missing machine -> response.get_json():", r_missing.get_json())

            assert response.status_code == 200
            assert response.content_type == "application/json"
            assert r_missing.status_code == 404
            print("status code and body inspected separately - two different real facts about the same response")
