        - element: 'r_ok = client.put(..., json={"status": "running", "currentPartId": "P-TEST-001"}, headers={"Authorization": f"Bearer {token}"})'
          explanation: >
            One real request, combining every real ingredient this
            lesson's earlier units isolated separately: a real method
            and URL, a real header, and a real, valid body.
        - element: 'refreshed = db.session.get(Machine, "M-TEST-001")'
          explanation: >
            A fresh, real, independent query against the database -
            deliberately not reusing the `machine` variable already in
            scope, so this really re-reads whatever the request actually
