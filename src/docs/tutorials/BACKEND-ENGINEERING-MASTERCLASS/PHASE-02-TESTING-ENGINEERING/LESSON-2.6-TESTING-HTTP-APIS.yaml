  - title: "Database Effects - Proving the Request Actually Changed Something"
    problem: >
      A successful response's own body claims a machine's status
      changed - but a response body is only what the route *says*
      happened. What real, independent evidence would actually confirm
      the database itself changed?
    socratic_prompt:
      - >
        If `update_machine_status`'s own real code returned a fabricated,
        hard-coded success response without ever calling
        `db.session.commit()`, would a test checking only
        `response.get_json()` catch that?
      - >
        What real, separate query, run *after* the request completes,
        would settle the question of whether the database itself
        actually changed?
    project_change:
      reference_source: >
        No reference counterpart for this unit's own throwaway code.
        Real specimen: the same `update_machine_status`
        (`backend/app/routes/machines.py:80-115`) this lesson's headers
        and body units already exercised, now checked against the
        database directly, not just its own response.
      files_affected: []
      change_type: none
      location: >
        N/A - a new, standalone script; no existing project structure to
        place it within.
      dependencies: >
        Real `Machine`, `Part`, and `User` rows.
    new_code:
      applicable: true
      intro: >
        Every real part of this lesson at once - method, URL, headers,
        body, response, status - ending in a direct, independent
        database query:
      file: verification/phase-02/lab_pytest_demo/lab_http_full_check.py
      status: new
      language: python
      code: |
        import sys
        sys.path.insert(0, "backend")

        from app import create_app, db
        from app.models.machine import Machine
        from app.models.part import Part
        from app.models.user import User
        from app.utils.auth_utils import encode_auth_token

        app = create_app("testing")
        with app.app_context():
            machine = Machine(id="M-TEST-001", name="Test Mill", category="mill", sub_type="3_axis", status="available")
            part = Part(id="P-TEST-001", part_number="1234567", description="Test Part")
            user = User(id="U-TEST-001", email="test-admin@example.com", name="Test Admin", role="admin")
            db.session.add(machine)
            db.session.add(part)
            db.session.add(user)
            db.session.commit()

            token = encode_auth_token("U-TEST-001", "admin")
            print("real token generated (truncated):", token[:40], "...")

            client = app.test_client()

            r_ok = client.put(
                "/api/machines/M-TEST-001/status",
                json={"status": "running", "currentPartId": "P-TEST-001"},
                headers={"Authorization": f"Bearer {token}"},
            )
            print("valid request -> status:", r_ok.status_code, "body:", r_ok.get_json())

            refreshed = db.session.get(Machine, "M-TEST-001")
            print("real row after the request -> status:", refreshed.status, "current_part_id:", refreshed.current_part_id)

            assert r_ok.status_code == 200
            assert refreshed.status == "running"
            assert refreshed.current_part_id == "P-TEST-001"
            print("response AND database agree - the request really did what it claimed")
    updated_project:
      applicable: false
    mechanical_walkthrough:
      applicable: true
      items:
        - element: 'part = Part(id="P-TEST-001", ...)'
          explanation: >
            Builds a real `Part` row, needed here because this unit's
            real request body includes a real `currentPartId` -
            `update_machine_status`'s own code
            (`backend/app/routes/machines.py:105-106`) writes that value
