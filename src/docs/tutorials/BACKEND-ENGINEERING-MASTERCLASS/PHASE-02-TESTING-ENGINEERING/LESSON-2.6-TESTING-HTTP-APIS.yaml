number: "2.6"
title: "Testing HTTP APIs"
path_note: >
  File paths under backend/... refer to the real manufacturing-platform
  repository. Paths under verification/... refer to that same
  repository's verification folder.

what_you_will_build: >
  Five real, run checks against this project's own real
  `PUT /api/machines/<id>/status` and `GET /api/machines/<id>` routes,
  each isolating one real part of an HTTP exchange - method and URL,
  headers, body, response and status, and real database effects - and
  along the way, independently reproducing a real, already-documented
  security gap in this project's own authentication: a request with no
  credentials at all still succeeds.

what_you_need_to_know_first: >
  What a system test checks, and how Flask's test client sends a real
  request without a real network socket; what a fixture is; what a mock
  is and why this lesson deliberately uses none.

terms:
  - name: request method
    definition: >
      The real HTTP verb naming which kind of operation a request is
      asking for - `GET` to read, `PUT` to replace, among several this
      lesson does not cover. It exists because the same URL can mean
      genuinely different things depending on which method is used
      against it - this lesson's own `/api/machines/<id>/status` only
      ever runs its real update logic for a `PUT`, never a `GET`.
  - name: URL path parameter
    definition: >
      A real, named segment of a route's own URL pattern -
      `<string:machine_id>`, for instance - that Flask matches against
      the actual request URL and hands to the view function as a real
      argument. It exists so one route definition can serve every real
      machine ID, rather than a route being written once per machine.
  - name: request header
    definition: >
      Real key-value metadata sent alongside a request, separate from
      its body - information *about* the request, not the request's own
      payload. It exists because some real information (who's asking,
      what format they want back) belongs with every request regardless
      of what that request's own body happens to contain.
  - name: Authorization header
    definition: >
      A specific, real request header - `Authorization: Bearer <token>`
      - carrying real credentials. It exists as the real, standard place
      a client puts proof of who it is, so a server can check that proof
      before deciding what a request is even allowed to do.
  - name: request body
    definition: >
      The real data a request carries beyond its URL and headers -
      here, real JSON - read by the server via
      `request.get_json()`. It exists so an operation like "update this
      machine's status" can carry the actual new value along with it,
      not just identify which machine to act on.
  - name: response body
    definition: >
      The actual data an HTTP response carries back, written in JSON in
      this project - readable directly through `response.get_json()`.
      It exists as the real answer to whatever the request asked,
      separate from whether the request even succeeded at all.
  - name: HTTP status code
    definition: >
      The real three-digit number every HTTP response carries, stating
      in one compact, standardized value whether the request succeeded
      and, if not, roughly why - `200` for success, `400` for a real,
      invalid request body, `404` for a real, nonexistent resource. It
      exists so a caller, or a test, can tell success from a specific
      kind of failure without first parsing the response body at all.
  - name: database effect
    definition: >
      A real, persisted change to the database that happened as a
      result of handling one request - the actual, independent proof an
      operation really did what its own response body merely claims. It
      exists because a response body is only what the route *says*
      happened; only a separate, real query against the database
      afterward can confirm it actually did.

objects_and_methods:
  - name: FlaskClient (.get / .put)
    what_it_is: >
      The real test client Flask's own `app.test_client()` returns,
      used throughout this lesson to send real, simulated requests.
    implementation: >
      `.get(path, headers=...)` and `.put(path, json=..., headers=...)`
      are both real methods on `FlaskClient` - each simulates a real
      HTTP request of that method against the given path, with an
      optional real `json` argument (automatically serialized and given
      a real `Content-Type: application/json` header) and an optional
      real `headers` dict.
    its_use: >
      This lesson uses `.get` to exercise the read-only
      `GET /api/machines/<id>` route, and `.put` to exercise the
      real, state-changing `PUT /api/machines/<id>/status` route -
      the same client object, two different real methods.
    type: >
      Real instance methods on `FlaskClient`, one per real HTTP method
      Flask itself supports.
    responsibility: >
      Simulating a real HTTP request of a specific method, with a real
      body and real headers, against this app's own real routing - the
      same real mechanism an earlier lesson's own system test first
      used.
    depends_on: >
      A fully-built `Flask` app instance (via `app.test_client()`); a
      real path string; optionally, a real JSON-serializable body and a
      real headers dict.
    connects_to: >
      Every real request in this lesson goes through one of these two
      methods; each one returns a real `Response` object this lesson's
      own labs inspect directly afterward.
    shape: >
      Takes a real path (and optional real body/headers) in; returns one
      real `Response` object out - never a plain dict, never `None`.

  - name: Response (.status_code / .status / .content_type / .get_json())
    what_it_is: >
      The real response object Flask's test client returns from a
      simulated request.
    implementation: >
      `.status_code` is a plain `int` (`200`, `400`, `404`, ...);
      `.status` is a real string combining the code and its standard
      reason phrase (`"200 OK"`); `.content_type` is a real string
      naming the response body's actual format (`"application/json"`
      for every route in this lesson); `.get_json()` parses the real
      body as JSON, returning a plain Python dict.
    its_use: >
      This lesson reads all four of these real members, across its five
      units, to fully characterize what a real response actually
      carries - not just whether it "worked."
    type: >
      An object returned by a `FlaskClient` call - the same real class
      an earlier lesson's own system test first inspected, now examined
      more fully.
    responsibility: >
      Carrying everything a real HTTP response would carry - status,
      headers, and body - in one object a test can inspect directly.
    depends_on: The route function that handled the request.
    connects_to: >
      Produced by every real `.get`/`.put` call in this lesson; all four
      of its real members are read directly in this lesson's own labs.
    shape: >
      `.status_code` is an `int`; `.status` and `.content_type` are
      plain strings; `.get_json()` is a plain `dict` (or `None`) - four
      genuinely different real facts about one response object.

  - name: update_machine_status
    what_it_is: >
      A real, existing Flask view function updating a machine's real
      status in the database.
    implementation: >
      `@machines_bp.route('/<string:machine_id>/status', methods=['PUT'])`
      `def update_machine_status(current_user, machine_id: str): ...`
      (`backend/app/routes/machines.py:80-115`) - looks up a real
      `Machine` by `machine_id`, returns `404` if it doesn't exist,
      reads `request.get_json()`, returns `400` if `'status'` is
      missing or not one of four real allowed values, then sets
      `machine.status` (and conditionally `machine.current_part_id`)
      and commits.
    its_use: >
      This lesson calls it, unmodified, in every unit but the first -
      the real, central specimen for headers, body, response/status, and
      database effects alike.
    type: A Flask view function, decorated with `@token_required`.
    responsibility: >
      Validating a real status change request, applying it to a real
      `Machine` row, and reporting back the real, updated row - or a
      specific real error if the request was invalid.
    depends_on: >
      A real `Machine` row already existing; a real JSON body containing
      a valid `'status'` value; `@token_required`'s own real decision
      about whether this specific request is allowed through at all.
    connects_to: >
      Wrapped by `@token_required(allowed_roles=[...])`, which runs
      first, on every real request, before this function's own body
      ever executes.
    shape: >
      Reads a real dict in (from `request.get_json()`), returns a real
      `(dict, int)` tuple out on an error path, or a real `Flask`
      response (via `jsonify`) with an implicit `200` on success.

  - name: get_machine
    what_it_is: >
      A real, existing Flask view function retrieving one machine by ID.
    implementation: >
      `@machines_bp.route('/<string:machine_id>', methods=['GET'])`
      `def get_machine(current_user, machine_id: str): ...`
      (`backend/app/routes/machines.py:48-61`) - looks up a real
      `Machine` by `machine_id`, returning `404` with a real error dict
      if it isn't found, or `200` with the real machine's own data.
    its_use: >
      This lesson calls it to demonstrate real method/URL mechanics and
      real response/status inspection, deliberately separate from the
      write-side complexity `update_machine_status` carries.
    type: A Flask view function, decorated with `@token_required`.
    responsibility: >
      Reading exactly one real machine's current, real data by its ID,
      with no side effects of its own.
    depends_on: A real `machine_id` matched from the request URL.
    connects_to: >
      Also wrapped by `@token_required`; called with both a real,
      existing ID and a real, nonexistent one across this lesson's own
      labs.
    shape: >
      Takes a `machine_id` string (from the URL, not the body); returns
      a real dict, wrapped in `jsonify`, with an implicit `200`, or a
      real error dict with an explicit `404`.

  - name: token_required
    what_it_is: >
      A real, existing decorator factory in this project's own backend,
      wrapping a view function with authentication and role-checking
      logic.
    implementation: >
      `def token_required(allowed_roles: list = None): ...`
      (`backend/app/utils/auth_utils.py:308-479`) - reads a real
      `Authorization` header if present; if none is present *and*
      `'operator'` is in `allowed_roles`, its own real code (explicitly
      commented `# OPERATOR BYPASS`) lets the request through anyway,
      calling the wrapped view with `current_user=None`; otherwise it
      decodes and verifies a real token, looks up a real `User` row by
      the token's own `sub` claim, and checks that user's role against
      `allowed_roles`.
    its_use: >
      This lesson never calls it directly - it wraps both
      `get_machine` and `update_machine_status` automatically, and this
      lesson's own headers unit exists specifically to observe its real
      bypass branch firing.
    type: A decorator factory - a function that returns a real decorator.
    responsibility: >
      Deciding, for every real request to a route it wraps, whether that
      request is allowed to proceed at all, and as which real user (or
      `None`).
    depends_on: >
      `allowed_roles`, a real list this project passes differently per
      route; the real `Authorization` header, if the request sent one.
    connects_to: >
      Wraps both real view functions this lesson calls; its own real
      decision runs before either view function's own body ever
      executes.
    shape: >
      Takes a real list of role strings in; returns a real decorator
      that, applied to a view function, produces a new function Flask
      actually registers as the route.

  - name: encode_auth_token
    what_it_is: >
      A real, existing function in this project's backend, producing a
      real, signed JWT for a given user.
    implementation: >
      `def encode_auth_token(user_id: str, role: str) -> str:`
      (`backend/app/utils/auth_utils.py:163-247`) - builds a real
      payload with `sub` (the user ID), `role`, `exp` (a real 7-day
      expiry), and `iat`, then signs it with `jwt.encode(...)` using
      this app's own real `SECRET_KEY`.
    its_use: >
      This lesson calls it to generate a real, valid token for a real
      `User` row it creates itself, specifically to exercise the
      *authenticated* path through `token_required`, not just its
      bypass.
    type: A module-level function.
    responsibility: >
      Producing one real, cryptographically signed token string, from a
      real user ID and role, that `token_required` can later decode and
      trust.
    depends_on: >
      A real user ID and role string; the real Flask app's own
      configured `SECRET_KEY`, read from `current_app.config`.
    connects_to: >
      Its real output is passed straight into this lesson's own
      `Authorization: Bearer <token>` headers, later decoded by
      `token_required` on the receiving end.
    shape: >
      Takes two real strings in, returns one real, signed token string
      out.

concept_units:
  - title: "Request Method and URL - Which Operation, Which Resource"
    problem: >
      This project's real `GET /api/machines/<id>` route
      (`backend/app/routes/machines.py:48-61`) only runs for a specific
      real method against a specific real URL shape. What exactly
      identifies which of this project's many real routes a given
      request actually reaches?
    socratic_prompt:
      - >
        If a real `POST` request were sent to the exact URL
        `/api/machines/M-TEST-001`, would `get_machine` run at all?
        What does `@machines_bp.route('/<string:machine_id>', methods=['GET'])`'s
        own real `methods` argument say about that?
      - >
        `<string:machine_id>` sits inside the route's own URL pattern,
        not in a query string. What does that suggest about the real
        difference between a URL path segment and something like
        `?status=running`?
    project_change:
      reference_source: >
        No reference counterpart for this unit's own throwaway code.
        Real specimen: `backend/app/routes/machines.py:48-61`
        (`get_machine`), read again this session.
      files_affected: []
      change_type: none
      location: >
        N/A - a new, standalone script; no existing project structure to
        place it within.
      dependencies: >
        A real `Machine` row, built the same way an earlier lesson's own
        integration test already built one.
    new_code:
      applicable: true
      intro: >
        One real machine, one real `GET` request, no headers or body
        involved yet:
      file: verification/phase-02/lab_pytest_demo/lab_http_method_url.py
      status: new
      language: python
      code: |
        import sys
        sys.path.insert(0, "backend")

        from app import create_app, db
        from app.models.machine import Machine

        app = create_app("testing")
        with app.app_context():
            machine = Machine(id="M-TEST-001", name="Test Mill", category="mill", sub_type="3_axis", status="available")
            db.session.add(machine)
            db.session.commit()

            client = app.test_client()
            response = client.get("/api/machines/M-TEST-001")
            print("status:", response.status_code)
            print("body:", response.get_json())
    updated_project:
      applicable: false
    mechanical_walkthrough:
      applicable: true
      items:
        - element: 'client = app.test_client()'
          explanation: >
            Builds a real test client bound to this app - the same real
            mechanism an earlier lesson's own system test first used.
        - element: 'client.get("/api/machines/M-TEST-001")'
          explanation: >
            Sends a real, simulated `GET` request to this exact URL.
            Werkzeug's own real routing matches it against
            `get_machine`'s route pattern, extracting `"M-TEST-001"` as
            the real value for that route's own `machine_id` URL path
            parameter.
        - element: 'print("status:", response.status_code)'
          explanation: >
            Prints the real integer status this specific request
            actually received.
        - element: 'print("body:", response.get_json())'
          explanation: >
            Prints the real parsed JSON body - the exact machine row
            just created, echoed back by `get_machine`'s own real logic.
    mental_model:
      applicable: false
    execution_trace:
      applicable: false
    cs_lens: >
      This is **request routing**: matching a real method and URL
      against a table of real, registered handlers, and extracting real
      path parameters along the way. Also recognized in: every web
      framework's own URL router (Django's `urlpatterns`, Express's own
      route table); a CPU's own instruction dispatch, matching an
      opcode against the one real handler that executes it; a phone
      switchboard's own number-to-line routing; and, in this project's
      own domain, a G-code modal group determining which real, already-
      active command a bare parameter line actually belongs to.
    se_lens: >
      The design principle is that method and URL together, not either
      alone, identify one specific real operation - REST's own core
      idea. The real alternative not chosen - one URL per operation,
      regardless of method (`/api/machines/get/<id>`,
      `/api/machines/update-status/<id>`) - would work, but loses the
      real convention this project's own routes already follow
      consistently: the same resource URL, `/api/machines/<id>`,
      already serves both `GET` (this unit) and `PUT`/`PATCH` (the next
      unit's own specimen), differing only in method. The honest cost of
      that convention: a reader has to check a route's own `methods`
      list to know what a given URL actually does - the URL alone isn't
      enough.
    commands:
      - command: backend/.venv/Scripts/python.exe verification/phase-02/lab_pytest_demo/lab_http_method_url.py
        explanation: >
          Runs this as a plain script, from the repository root.
    verification:
      applicable: true
      real_output: |
        Seeding default users...
        status: 200
        body: {'data': {'axes': 3, 'category': 'mill', 'createdAt': '2026-08-31T00:03:25.615406', 'currentOperatorClientId': None, 'currentPartId': None, 'groupId': None, 'hasToolChanger': False, 'id': 'M-TEST-001', 'location': None, 'manufacturer': None, 'maxSpindleSpeed': None, 'model': None, 'name': 'Test Mill', 'operatorLastHeartbeatAt': None, 'serialNumber': None, 'spindleTaper': None, 'status': 'available', 'subType': '3_axis', 'toolChangerCapacity': None, 'updatedAt': '2026-08-31T00:03:25.615408', 'xTravel': None, 'yTravel': None, 'zTravel': None}}
      output_file: verification/phase-02/lab_pytest_demo/lab_http_method_url_output.txt
    connection_to_previous: >
      This is the lesson's first unit - it establishes the real machine
      specimen and the real client every later unit reuses, on the
      simplest possible request shape.

  - title: "Headers - Real Metadata Riding Along with the Request"
    problem: >
      This project's real `token_required` decorator
      (`backend/app/utils/auth_utils.py:414-424`) has a branch its own
      code explicitly comments `# OPERATOR BYPASS`. Given
      `update_machine_status`'s own real `allowed_roles=['operator', 'quality', 'programming', 'admin']`,
      what actually happens to a real request with no `Authorization`
      header at all?
    socratic_prompt:
      - >
        Given that comment, and that `'operator'` is in this route's own
        `allowed_roles`, what do you predict happens to a real `PUT`
        request to this route with no `Authorization` header at all -
        before reading the real output below?
      - >
        If a route's own `allowed_roles` did *not* include `'operator'`,
        would you expect the same no-header request to behave the same
        way?
    project_change:
      reference_source: >
        Real specimen: `backend/app/utils/auth_utils.py:411-436`, read
        again this session - the exact real branch deciding what happens
        when no token is present.
      files_affected: []
      change_type: none
      location: >
        N/A - a new, standalone script; no existing project structure to
        place it within.
      dependencies: >
        A real `Machine` and a real `User` row, plus a real token from
        `encode_auth_token`.
    new_code:
      applicable: true
      intro: >
        The identical real `PUT` request, sent twice - once with no
        `Authorization` header, once with a real, valid one:
      file: verification/phase-02/lab_pytest_demo/lab_http_headers.py
      status: new
      language: python
      code: |
        import sys
        sys.path.insert(0, "backend")

        from app import create_app, db
        from app.models.machine import Machine
        from app.models.user import User
        from app.utils.auth_utils import encode_auth_token

        app = create_app("testing")
        with app.app_context():
            machine = Machine(id="M-TEST-001", name="Test Mill", category="mill", sub_type="3_axis", status="available")
            user = User(id="U-TEST-001", email="test-admin@example.com", name="Test Admin", role="admin")
            db.session.add(machine)
            db.session.add(user)
            db.session.commit()

            token = encode_auth_token("U-TEST-001", "admin")
            client = app.test_client()

            r_no_headers = client.put("/api/machines/M-TEST-001/status", json={"status": "running"})
            print("no Authorization header -> status:", r_no_headers.status_code)

            r_with_headers = client.put(
                "/api/machines/M-TEST-001/status",
                json={"status": "offline"},
                headers={"Authorization": f"Bearer {token}"},
            )
            print("real Authorization header -> status:", r_with_headers.status_code)

            assert r_no_headers.status_code == 200, "real, documented operator bypass: no header still succeeds"
            assert r_with_headers.status_code == 200
            print("both requests succeeded - the header changed nothing about whether this specific route allowed the request through")
    updated_project:
      applicable: false
    mechanical_walkthrough:
      applicable: true
      items:
        - element: 'user = User(id="U-TEST-001", email=..., name=..., role="admin")'
          explanation: >
            Builds one real `User` row - required so a real token's own
            `sub` claim resolves to a genuine user during the
            authenticated request; `token_required`'s own real code
            looks this row up and returns `401 USER_NOT_FOUND` if it
            doesn't exist.
        - element: 'token = encode_auth_token("U-TEST-001", "admin")'
          explanation: >
            Produces one real, valid, signed token for that real user -
            used only in the second of this unit's two requests.
        - element: 'r_no_headers = client.put(..., json={"status": "running"}) (no headers argument)'
          explanation: >
            Sends a real `PUT` request with a real, valid body, but
            explicitly no `headers` argument at all - no
            `Authorization` header is sent.
        - element: 'r_with_headers = client.put(..., headers={"Authorization": f"Bearer {token}"})'
          explanation: >
            Sends a second, separate real request to the identical URL
            and method, this time with a real `Authorization` header
            carrying the real token built above.
        - element: 'assert r_no_headers.status_code == 200, "real, documented operator bypass: ..."'
          explanation: >
            Confirms, for real, that the header-less request succeeded -
            this project's own real code, run directly, reproducing the
            exact bypass its own comment names.
    mental_model:
      applicable: false
    execution_trace:
      applicable: false
    cs_lens: >
      This is **request metadata** used for authentication - a header
      carrying information *about* the request (who's asking) rather
      than the request's own payload. Also recognized in: an API key
      passed in an `X-API-Key` header; a `Content-Type` header telling a
      server how to parse the body that follows it; an HTTP `If-None-Match`
      header enabling conditional caching without touching the body at
      all; and, in this project's own domain, a job traveler card riding
      alongside a physical part through the shop, carrying who
      authorized it without being part of the part itself.
    se_lens: >
      The design principle at stake - checking credentials before a
      state-changing operation runs - is sound; the real, honest problem
      this unit's own run output proves is that this specific route's
      implementation of it has a real gap. The real alternative this
      project's own code chose - `'operator'` role implies anonymous
      access is fine - has a real, defensible use case named directly in
      `token_required`'s own comments (a public operator dashboard); the
      honest cost, proven by this exact unit: that same bypass also
      applies to `update_machine_status`, a real, state-changing write
      endpoint, not a read-only dashboard - the same permissive rule,
      applied somewhere its own stated justification never covered.
    commands:
      - command: backend/.venv/Scripts/python.exe verification/phase-02/lab_pytest_demo/lab_http_headers.py
        explanation: >
          Runs this as a plain script, from the repository root.
    verification:
      applicable: true
      real_output: |
        Seeding default users...
        no Authorization header -> status: 200
        real Authorization header -> status: 200
        both requests succeeded - the header changed nothing about whether this specific route allowed the request through
      output_file: verification/phase-02/lab_pytest_demo/lab_http_headers_output.txt
    connection_to_previous: >
      The previous unit sent a request with no headers at all, without
      remarking on it; this unit makes that choice deliberate, and shows
      this project's own real code treating it as meaningful in a way
      its own comments admit is a real, named tradeoff.

  - title: "Body - What the Request Actually Carries"
    problem: >
      The same real URL, the same real method, three different real
      JSON bodies - and three different real outcomes. What real code
      actually inspects the body, and what does it check first?
    socratic_prompt:
      - >
        `update_machine_status`'s own real code
        (`backend/app/routes/machines.py:93-100`) checks whether
        `'status'` is even present in the body before checking whether
        its value is one of four real allowed ones. What real body would
        trigger the first check without ever reaching the second?
      - >
        If the same `"status": "running"` value were sent as a URL query
        string (`?status=running`) instead of as JSON, would
        `request.get_json()` see it at all?
    project_change:
      reference_source: >
        Real specimen: `backend/app/routes/machines.py:93-100`, read
        again this session - the exact real validation this unit's own
        three requests are designed to exercise.
      files_affected: []
      change_type: none
      location: >
        N/A - a new, standalone script; no existing project structure to
        place it within.
      dependencies: >
        A real `Machine` row, the same as this lesson's first unit.
    new_code:
      applicable: true
      intro: >
        Three real requests, identical except for their body:
      file: verification/phase-02/lab_pytest_demo/lab_http_body.py
      status: new
      language: python
      code: |
        import sys
        sys.path.insert(0, "backend")

        from app import create_app, db
        from app.models.machine import Machine

        app = create_app("testing")
        with app.app_context():
            machine = Machine(id="M-TEST-001", name="Test Mill", category="mill", sub_type="3_axis", status="available")
            db.session.add(machine)
            db.session.commit()

            client = app.test_client()

            r_no_status_key = client.put("/api/machines/M-TEST-001/status", json={})
            print("body {} (missing 'status') -> status:", r_no_status_key.status_code, r_no_status_key.get_json())

            r_invalid_value = client.put("/api/machines/M-TEST-001/status", json={"status": "not_a_real_status"})
            print("body with an invalid status value -> status:", r_invalid_value.status_code, r_invalid_value.get_json())

            r_valid = client.put("/api/machines/M-TEST-001/status", json={"status": "maintenance"})
            print("body with a real, valid status value -> status:", r_valid.status_code)

            assert r_no_status_key.status_code == 400
            assert r_invalid_value.status_code == 400
            assert r_valid.status_code == 200
            print("the same URL, the same method, three different real bodies, three different real outcomes")
