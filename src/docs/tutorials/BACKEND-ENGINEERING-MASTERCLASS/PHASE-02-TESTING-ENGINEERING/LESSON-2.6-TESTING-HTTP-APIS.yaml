closing:
  connect_the_pieces: >
    One real machine, one real `GET` request, matched by a real method
    and URL to exactly one real route (method and URL). The identical
    real `PUT` request, sent with and without a real `Authorization`
    header, both succeeding - a real, independently reproduced security
    gap, not a hypothetical one (headers). The same real URL and method,
    three different real JSON bodies, producing two different real kinds
    of `400` and one real `200` (body). One real response, inspected
    across four separate real facts - `status_code`, `status`,
    `content_type`, and a real JSON body - next to a second, real `404`
    for a machine that was never created (response and status). And,
    last, a real write request whose response claims success, checked
    against a second, independent, real database query that confirms it
    - the one real check this lesson's every earlier unit skipped, on
    purpose, until the moment a write operation made it actually matter
    (database effects). Six real parts of one real HTTP exchange, each
    checked on its own, against this project's own real, running code.
  next_lesson_pointer: >
    Every check built in this lesson assumed the real code being tested
    was already correct, or was checking new code as it was written.
    Next, this curriculum turns to the opposite, harder case: a real,
    already-existing implementation nobody fully trusts yet, and how to
    pin down exactly what it currently does - correctly or not - before
    anyone is allowed to change a single line of it.
