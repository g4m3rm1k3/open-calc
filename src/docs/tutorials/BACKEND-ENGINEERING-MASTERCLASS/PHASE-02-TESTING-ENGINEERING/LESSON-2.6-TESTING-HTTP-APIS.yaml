            own code returns its result through `jsonify(...)`, which
            sets this header automatically.
        - element: 'r_missing = client.get("/api/machines/DOES-NOT-EXIST")'
          explanation: >
            A second, separate real request, to an ID that was never
            created - exercising `get_machine`'s own real `if not machine:`
            branch instead of its success path.
        - element: 'assert r_missing.status_code == 404'
          explanation: >
            Confirms the real, specific failure code this project's own
