      applicable: false
    cs_lens: >
      This is treating a **response as a real, structured object**, not
      a single pass/fail bit - status, headers, and body are three
      genuinely separate real facts, checkable independently. Also
      recognized in: an HTTP client library's own typed response object
      (`requests.Response` in Python, `fetch`'s own `Response` in
