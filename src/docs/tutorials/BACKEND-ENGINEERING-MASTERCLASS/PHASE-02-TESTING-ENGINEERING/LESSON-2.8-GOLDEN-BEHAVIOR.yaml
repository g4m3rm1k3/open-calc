  - title: "Error Behavior - Characterizing Failure as Carefully as Success"
    problem: >
      Two genuinely different real reasons a `POST` to `create_machine`
      can fail - both return the identical real status code, `400`.
      What does characterizing failure "as carefully as success"
      actually demand, beyond confirming both requests failed?
    socratic_prompt:
      - >
        Both of this unit's own two failing requests return the exact
        same real status code. What real, additional fact would a
        caller actually need in order to tell the two failures apart?
      - >
        Neither of these two failed requests leaves any real trace in
        the database. Is that itself something worth explicitly
        characterizing with its own real assertion, or does it not need
        saying?
    project_change:
      reference_source: >
        Real specimen: the same `create_machine`
        (`backend/app/routes/machines.py:118-169`) as the previous unit,
        now exercised along its two real, distinct `400` paths instead
        of its success path.
      files_affected: []
      change_type: none
      location: >
        N/A - a new, standalone script; no existing project structure to
        place it within.
      dependencies: >
        A real `Machine` row (to collide with), a real `User`, and a
        real token.
    new_code:
      applicable: true
      intro: >
        Two real, separately broken requests against the same real
        route:
      file: verification/phase-02/lab_pytest_demo/lab_golden_error_behavior.py
      status: new
      language: python
      code: |
        import sys
        sys.path.insert(0, "backend")

        from app import create_app, db
        from app.models.machine import Machine
        from app.models.user import User
        from app.utils.auth_utils import encode_auth_token

        app = create_app("testing")
        with app.app_context():
            db.session.add(Machine(id="M-EXISTING", name="Existing Mill", category="mill", sub_type="3_axis", status="available"))
            user = User(id="U-PROG-001", email="programmer@example.com", name="Test Programmer", role="programming")
            db.session.add(user)
            db.session.commit()
            token = encode_auth_token("U-PROG-001", "programming")
            auth = {"Authorization": f"Bearer {token}"}

            client = app.test_client()

            # Missing a real, required field.
            r_missing_field = client.post("/api/machines", json={"id": "M-A", "name": "A Mill"}, headers=auth)
            print("missing required fields -> status:", r_missing_field.status_code, "body:", r_missing_field.get_json())

            # A real, valid body, but an id that already exists.
            r_duplicate_id = client.post(
                "/api/machines",
                json={"id": "M-EXISTING", "name": "Dup Mill", "category": "mill", "subType": "3_axis", "manufacturer": "Haas", "model": "VF-2"},
                headers=auth,
            )
            print("duplicate id -> status:", r_duplicate_id.status_code, "body:", r_duplicate_id.get_json())

            assert r_missing_field.status_code == 400
            assert "Missing required field" in r_missing_field.get_json()["error"]
            assert r_duplicate_id.status_code == 400
            assert r_duplicate_id.get_json()["error"] == "Machine ID already exists"

            real_count = Machine.query.count()
            print("real Machine rows after both failed requests:", real_count)
            assert real_count == 1
            print("two real, distinct 400s, with two real, distinct messages - and neither one left a real side effect behind")
    updated_project:
      applicable: false
    mechanical_walkthrough:
      applicable: true
      items:
        - element: 'r_missing_field = client.post("/api/machines", json={"id": "M-A", "name": "A Mill"}, headers=auth)'
          explanation: >
            Sends a real, authenticated request missing four of the
            route's six real required fields; `create_machine`'s own
            code checks them in a fixed real order and reports the
            first one it finds missing - `"category"`, confirmed by this
            unit's own real, saved output.
        - element: 'assert "Missing required field" in r_missing_field.get_json()["error"]'
          explanation: >
            Checks for a real, stable substring rather than the exact
            full message - deliberately, since the *specific* missing
            field named depends on which real fields this unit's own
            body happened to include, while the general shape of the
            message is the real, stable fact worth pinning down.
        - element: 'r_duplicate_id = client.post("/api/machines", json={"id": "M-EXISTING", ...}, headers=auth)'
          explanation: >
            Sends a second, separately real request - this time with
            every real required field present and valid, but reusing
            `"M-EXISTING"`, an ID this unit already inserted directly
            into the database beforehand.
        - element: 'assert r_duplicate_id.get_json()["error"] == "Machine ID already exists"'
          explanation: >
            Checks the *exact* real message this time, since this
            unit's own input is fixed and known - a genuinely different,
            real, distinguishable failure reason from the first request,
            even though both share the identical real `400` status code.
        - element: 'real_count = Machine.query.count() / assert real_count == 1'
          explanation: >
            A real, independent database check confirming neither failed
            request left any real trace behind - the count stays at `1`
            (the one machine this unit inserted directly), proving both
            real failures were genuinely rejected before any write ever
            happened.
    mental_model:
      applicable: false
    execution_trace:
      applicable: false
    cs_lens: >
      This is characterizing **error taxonomy**: distinguishing genuinely
      different real failure reasons that happen to share a status code,
      rather than treating "not 200" as one undifferentiated bucket.
      Also recognized in: a compiler's own distinct diagnostic codes for
      different real syntax errors, all still "compilation failed"; an
      HTTP API's own machine-readable `error.code` field alongside a
      shared status code (this project's own real
      `'code': 'TOKEN_MISSING'`, seen in an earlier lesson, is exactly
      this pattern); a database's own distinct constraint-violation error
      codes, all reported under one broad "insert failed" outcome; and,
      in this project's own domain, two different real alarm conditions
      that both halt a machine, distinguished only by which specific
      alarm code actually fired.
    se_lens: >
      The design principle is that "it failed" is rarely the complete
      real answer a caller - or a test - actually needs; *why* it failed
      is a separate, real fact worth characterizing on its own. The real
      alternative not chosen - checking only `status_code == 400` for
      both requests and calling the error path "characterized" - would
      pass today, but would fail to notice a real, future change that
      swapped these two messages, or merged them into one generic
      string, since neither would change the shared status code at all.
      The honest cost of characterizing both messages separately, as
      this unit does: two real, distinct assertions instead of one
      shared one, for two real failure reasons this project's own code
      already, deliberately, tells apart.
    commands:
      - command: backend/.venv/Scripts/python.exe verification/phase-02/lab_pytest_demo/lab_golden_error_behavior.py
        explanation: >
          Runs this as a plain script, from the repository root.
    verification:
      applicable: true
      real_output: |
        Seeding default users...
        missing required fields -> status: 400 body: {'error': 'Missing required field: category'}
        duplicate id -> status: 400 body: {'error': 'Machine ID already exists'}
        real Machine rows after both failed requests: 1
        two real, distinct 400s, with two real, distinct messages - and neither one left a real side effect behind
      output_file: verification/phase-02/lab_pytest_demo/lab_golden_error_behavior_output.txt
    connection_to_previous: >
      The previous unit characterized what a real success looks like,
      status code and side effect together; this unit closes the lesson
      by characterizing failure with the same real care - two distinct
      real reasons, one shared code, and a real, confirmed absence of
      any side effect either way.

closing:
  connect_the_pieces: >
    One real list endpoint, characterized across every real dimension
    this lesson set out to cover: its exact real response shape (`data`
    and `total`, nothing else), its real, deliberate alphabetical
    ordering (proven against machines inserted out of that order), its
    real default of excluding nothing when no filter is given, and two
    real edge cases - one an ordinary empty result, the other a genuine,
    previously undiscovered `AttributeError` this project's own
    `?type=` filter has been shipping with the whole time. And one real
    write endpoint, characterized just as fully: a real `201`, backed by
    a real, independently-queried database row proving the claim true,
    and two real, distinct `400` failures, sharing one status code but
    carrying two genuinely different real messages, both confirmed to
    leave the database exactly as they found it. This is what "golden
    behavior" actually means: not one field checked once, but the whole
    real, observable shape of what a system does - success, failure, and
    the edges in between - recorded precisely enough that nothing about
    it can change again without a real test noticing.
  next_lesson_pointer: >
    Every real behavior this lesson characterized already existed,
    unplanned, in code nobody set out to write a certain way on purpose.
    Next, this curriculum reverses the order completely: writing a real
    test *first*, for behavior that doesn't exist yet, and letting that
    test drive the real code that makes it pass - the real discipline
    this whole phase has been building toward.
