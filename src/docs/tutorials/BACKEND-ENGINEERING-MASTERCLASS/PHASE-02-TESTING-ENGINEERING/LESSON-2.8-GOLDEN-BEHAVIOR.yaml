  - title: "Status Codes and Side Effects - What Changed, and How You'd Know"
    problem: >
      This project's real `POST /api/machines` claims, through its own
      response, that a new machine was created. What real, independent
      evidence would actually confirm that - and what specific real
      status code does this route use to signal it, rather than a bare
      success?
    socratic_prompt:
      - >
        `create_machine`'s own real code returns `201`, not `200`, on
        success. What real, standard HTTP convention does that specific
        choice communicate that a bare `200` would not?
      - >
        If `create_machine`'s own code returned a real `201` but never
        actually called `db.session.commit()`, would checking only the
        response's status code catch that mistake?
    project_change:
      reference_source: >
        Real specimen: `backend/app/routes/machines.py:118-169`
        (`create_machine`), read again this session.
      files_affected: []
      change_type: none
      location: >
        N/A - a new, standalone script; no existing project structure to
        place it within.
      dependencies: >
        A real `User` row and a real token, since this route's own
        `allowed_roles` does not include `'operator'` - the real bypass
        an earlier lesson found does not apply here.
    new_code:
      applicable: true
      intro: >
        One real, valid creation request, checked against both its own
        response and a completely separate, real database query:
      file: verification/phase-02/lab_pytest_demo/lab_golden_status_side_effects.py
      status: new
      language: python
      code: |
        import sys
        sys.path.insert(0, "backend")

        from app import create_app, db
        from app.models.machine import Machine
        from app.models.user import User
        from app.utils.auth_utils import encode_auth_token

        app = create_app("testing")
        with app.app_context():
            user = User(id="U-PROG-001", email="programmer@example.com", name="Test Programmer", role="programming")
            db.session.add(user)
            db.session.commit()
            token = encode_auth_token("U-PROG-001", "programming")

            client = app.test_client()

            real_count_before = Machine.query.count()
            print("real Machine rows before the request:", real_count_before)

            response = client.post(
                "/api/machines",
                json={
                    "id": "M-NEW-001",
                    "name": "New Mill",
                    "category": "mill",
                    "subType": "3_axis",
                    "manufacturer": "Haas",
                    "model": "VF-2",
                },
                headers={"Authorization": f"Bearer {token}"},
            )
            print("POST /api/machines -> status:", response.status_code)
            print("response body:", response.get_json())

            real_count_after = Machine.query.count()
            persisted = db.session.get(Machine, "M-NEW-001")
            print("real Machine rows after the request:", real_count_after)
            print("real, independently-queried row:", persisted.name if persisted else None)

            assert response.status_code == 201
            assert real_count_before == 0
            assert real_count_after == 1
            assert persisted is not None
            assert persisted.name == "New Mill"
            print("status code AND a real database row both confirm the same real creation")
    updated_project:
      applicable: false
    mechanical_walkthrough:
      applicable: true
      items:
        - element: 'user = User(id="U-PROG-001", ..., role="programming") / token = encode_auth_token(...)'
          explanation: >
            Builds a real user with the `"programming"` role and a real,
            valid token for them - required here because
            `create_machine`'s own `allowed_roles=['programming', 'admin']`
            never includes `'operator'`, so the header-optional bypass an
            earlier lesson found does not apply to this specific route.
        - element: 'real_count_before = Machine.query.count()'
          explanation: >
            A real, independent baseline query, run *before* the request
            - establishing a real fact (zero rows) this unit can later
            compare against, the same discipline an earlier lesson's own
            integration test first used.
        - element: 'response = client.post("/api/machines", json={...}, headers={...})'
          explanation: >
            One real, complete request - a real body with all six
            required real fields, and a real `Authorization` header.
        - element: 'assert response.status_code == 201'
          explanation: >
            Confirms the real, specific success code this route's own
            code chose - `201 Created`, the standard real HTTP
            convention for "a new resource now exists," distinct from
            the plain `200` every read-only route in this lesson has
            used so far.
        - element: 'persisted = db.session.get(Machine, "M-NEW-001")'
          explanation: >
            A second, real, independent query, run *after* the request -
            not reusing anything the response itself returned, so this
            genuinely re-confirms what's actually in the database.
        - element: 'assert real_count_after == 1 / assert persisted is not None / assert persisted.name == "New Mill"'
          explanation: >
            Three separate real assertions, all against the independent
            query above, none of them trusting the response body alone -
            the real proof this unit exists to demonstrate.
    mental_model:
      applicable: false
    execution_trace:
      applicable: false
    cs_lens: >
      This is characterizing **status code semantics**, not just status
      code values - `201` specifically means "a new resource was
      created," a real, narrower claim than `200`'s "this succeeded."
      Also recognized in: REST's own broader status code conventions
      (`204` for a real success with no body, `202` for real, accepted-
      but-not-yet-complete work); a compiler's own distinct exit codes
      for "succeeded," "warned," and "failed" instead of one pass/fail
      bit; a shipping carrier's own separate real tracking states for
      "label created" versus "package received"; and, in this project's
      own domain, a machine alarm code distinguishing "operation
      complete" from "operation complete with warnings."
    se_lens: >
      The design principle is that a specific status code is itself part
      of a route's real, characterized contract - not an arbitrary
      choice interchangeable with any other "it worked" code. The real
      alternative this project's own code did not choose - returning a
      bare `200` for every real success, write or read alike - would
      still be caller-usable, but would throw away real, standard
      information a caller could otherwise rely on without even parsing
      the body. The honest cost of checking a real database row on top
      of the status code, as this unit does: real, extra setup and a
      real, second query, paid specifically because a status code alone
      is a claim, not proof - this lesson's own database-effects work,
      repeated here on a fresh, real specimen.
    commands:
