number: "2.8"
title: "Golden Behavior"
path_note: >
  File paths under backend/... refer to the real manufacturing-platform
  repository. Paths under verification/... refer to that same
  repository's verification folder.

what_you_will_build: >
  Five real, run checks fully characterizing this project's own real
  `GET /api/machines` and `POST /api/machines` routes - response shape,
  real ordering, real defaults, and two real edge cases with completely
  different outcomes, one of them a genuine, previously undiscovered
  crash in this project's own real code - plus real status codes and
  database side effects on both the success and failure paths of a real
  write.

what_you_need_to_know_first: >
  What a characterization test is and why it records observed behavior,
  not intended behavior; what a request's method, URL, headers, body,
  response, and status each are; what a database effect is and why a
  response body alone can't prove one happened.

terms:
  - name: golden behavior (golden master)
    definition: >
      The complete, real, characterized record of everything a piece of
      software actually does for a given input - not one field, one
      status code, or one path through it, but the full, real picture,
      precise enough that any future run can be compared against it
      directly. It exists as the fully-characterized end state a
      characterization test only starts toward - a name for "done
      recording what this does," not partial notes.
  - name: response shape
    definition: >
      The complete, real structure of a response body - every top-level
      key, every nested field, not just the ones a particular check
      happens to look at. It exists because a caller depending on a
      field a test never checked can be broken by a real change nobody
      noticed, precisely because nothing ever characterized that field
      existed at all.
  - name: side effect
    definition: >
      A real, observable change a request causes somewhere other than
      its own direct response - a row written to a database, a file
      created, an event emitted. It exists as a distinct thing to
      characterize because a response can claim success while a real
      side effect silently failed, or vice versa - the two are
      genuinely separate real facts.
  - name: ordering
    definition: >
      Whether a collection of real results comes back in a specific,
      guaranteed sequence, or in whatever order happens to fall out of
      how the underlying system stores or retrieves them. It exists
      because "the same items, different order" can silently break a
      caller relying on position, even though every individual item is
      still, technically, correct.
  - name: default
    definition: >
      The real value or behavior a system falls back to when a caller
      specifies nothing. It exists because "optional" only fully means
      something once the real, specific fallback behavior is actually
      known - "optional, defaults to nothing" and "optional, defaults to
      everything" are two completely different real systems.
  - name: edge case
    definition: >
      A real, valid-looking input that sits at or past the boundary of
      what a system's own logic was actually built to expect - not
      necessarily wrong on its face, but exactly where real behavior
      most often reveals a gap nobody planned for. It exists as its own
      category because the "normal" cases of a system are usually the
      ones already well understood; the edge cases are where a
      characterization actually earns its keep.
  - name: unhandled exception
    definition: >
      A real, genuine error that propagates past a system's own
      intended error handling entirely - not a deliberate `400` or
      `404` a route's own code chose to return, but a real crash. In
      production, Flask normally turns this into a real `500` response;
      under this app's own `"testing"` config, Flask's real
      `PROPAGATE_EXCEPTIONS` behavior (on by default whenever `TESTING`
      is `True`) instead lets the real Python exception itself surface
      directly, specifically so a test can see the real traceback rather
      than only a generic status code.

objects_and_methods:
  - name: get_machines
    what_it_is: >
      A real, existing Flask view function listing this project's real
      machines, with optional real filtering.
    implementation: >
      `def get_machines(current_user): ...`
      (`backend/app/routes/machines.py:14-45`) - reads three optional
      real query parameters (`status`, `type`, `groupId`) off
      `request.args`, applies a real `.filter(...)` to `Machine.query`
      for each one that's present, orders the real result with
      `.order_by(Machine.name)`, and returns
      `{'data': [...], 'total': len(machines)}`.
    its_use: >
      This lesson calls it, unmodified, in three of its five units - to
      characterize its real response shape, its real ordering, its real
      defaults, and two real edge cases in how it filters.
    type: A Flask view function, decorated with `@token_required`.
    responsibility: >
      Returning every real machine matching whichever real filters were
      actually given, in a consistent, real order.
    depends_on: >
      Zero or more real query parameters; a real, connected database.
    connects_to: >
      Builds its query from `Machine.query`, applying real `.filter`
      calls conditionally before a real `.order_by`.
    shape: >
      Returns a real dict with exactly two keys, `data` (a list of real
      machine dicts) and `total` (an int) - confirmed this session,
      never a bare list, never additional top-level keys.

  - name: create_machine
    what_it_is: >
      A real, existing Flask view function creating a new machine in
      this project's own database.
    implementation: >
      `def create_machine(current_user): ...`
      (`backend/app/routes/machines.py:118-169`) - reads a real JSON
      body, returns `400` if any of six real required fields
      (`id`, `name`, `category`, `subType`, `manufacturer`, `model`) is
      missing, checked in that real order, returns `400` if the given
      `id` already exists, otherwise constructs and commits a real
      `Machine` row and returns it with a real `201`.
    its_use: >
      This lesson calls it, unmodified, to characterize both its real
      success path (a real `201` and a real, persisted row) and two real
      distinct failure paths.
    type: A Flask view function, decorated with `@token_required` -
      unlike `get_machines`, its own `allowed_roles` does not include
      `'operator'`, so no real bypass applies here.
    responsibility: >
      Validating a new machine's real, required fields, rejecting a
      duplicate real ID, and persisting exactly one new real row when
      both checks pass.
    depends_on: >
      A real, valid JSON body; a real, currently-unused machine ID; a
      real, authenticated caller with an allowed role.
    connects_to: >
      Constructs a real `Machine` object from the request body, then
      calls `db.session.add` and `db.session.commit` - the same real
      methods an earlier lesson's own integration test first used.
    shape: >
      Returns a real `(dict, int)` tuple on any failure path, or a real
      `Flask` response with an explicit `201` on success - never a bare
      `200` for a successful creation.

  - name: Query.filter (Machine.query.filter)
    what_it_is: >
      A real SQLAlchemy method, narrowing a query to rows matching a
      real condition.
    implementation: >
      `query.filter(Model.column == value)` - returns a new, real
      `Query` object representing the original query narrowed by the
      given real condition; `Model.column` must be a real, declared
      column (or other mapped attribute) on that model, or Python itself
      raises a real `AttributeError` before any SQL is ever built.
    its_use: >
      This lesson's own edge-case unit relies on exactly that real
      requirement - `get_machines`'s own code calls
      `.filter(Machine.type == machine_type)`, and `Machine` has no real
      `type` column, confirmed this session to raise a genuine,
      unhandled `AttributeError`.
    type: A real instance method on SQLAlchemy's `Query` class.
    responsibility: >
      Narrowing a query's real result set to only rows matching a given,
      real condition - and, just as importantly, failing loudly and
      immediately if that condition references something that isn't
      real.
    depends_on: >
      A real, existing `Query` object to narrow; a real, valid column
      reference on the model it queries.
    connects_to: >
      Called up to three times inside `get_machines`, once per real,
      present query parameter; this lesson's own edge-case unit exercises
      the one call (`Machine.type`) that references a column that was
      never actually declared.
    shape: >
      Takes a real boolean-like SQLAlchemy expression in, returns a new,
      real `Query` object out - or raises, before returning anything at
      all, if the expression itself couldn't even be built.

concept_units:
  - title: "Response Shape and Ordering - What Comes Back, and In What Order"
    problem: >
      This project's real `GET /api/machines` route returns real
      machines in some real shape and some real order. Is either one an
      accident of however the database happens to store rows, or a real,
      deliberate guarantee this project's own code actually makes?
    socratic_prompt:
      - >
        If three real machines are inserted in the order Zeta, Alpha,
        Mid, what real order would you predict the API returns them in -
        and what, specifically, in `get_machines`'s own real code would
        you point to as evidence either way?
      - >
        `get_machines`'s own real response has exactly two top-level
        keys. If a caller depended on a third key existing, whose real
        mistake would that be - the route's, or the caller's, for
        assuming something this response never actually promised?
    project_change:
      reference_source: >
        No reference counterpart for this unit's own throwaway code.
        Real specimen: `backend/app/routes/machines.py:14-45`
        (`get_machines`), read again this session.
      files_affected: []
      change_type: none
      location: >
        N/A - a new, standalone script; no existing project structure to
        place it within.
      dependencies: >
        Real `Machine` rows, inserted deliberately out of alphabetical
        order.
    new_code:
      applicable: true
      intro: >
        Three real machines, inserted Zeta, Alpha, Mid - deliberately
        not in the order the real response should return them:
      file: verification/phase-02/lab_pytest_demo/lab_golden_shape_ordering.py
      status: new
      language: python
      code: |
        import sys
        sys.path.insert(0, "backend")

        from app import create_app, db
        from app.models.machine import Machine

        app = create_app("testing")
        with app.app_context():
            db.session.add(Machine(id="M-3", name="Zeta Mill", category="mill", sub_type="3_axis", status="available"))
            db.session.add(Machine(id="M-1", name="Alpha Mill", category="mill", sub_type="3_axis", status="available"))
            db.session.add(Machine(id="M-2", name="Mid Mill", category="mill", sub_type="3_axis", status="available"))
            db.session.commit()

            client = app.test_client()
            response = client.get("/api/machines")
            body = response.get_json()

            print("status:", response.status_code)
            print("top-level keys:", sorted(body.keys()))
            print("total:", body["total"])
            print("names, in real response order:", [m["name"] for m in body["data"]])
            print("one real machine's own real field keys:", sorted(body["data"][0].keys()))

            assert response.status_code == 200
            assert sorted(body.keys()) == ["data", "total"]
            assert body["total"] == 3
            assert [m["name"] for m in body["data"]] == ["Alpha Mill", "Mid Mill", "Zeta Mill"]
            print("response shape confirmed, and real ordering is alphabetical by name - not insertion order")
    updated_project:
      applicable: false
    mechanical_walkthrough:
      applicable: true
      items:
        - element: 'db.session.add(Machine(id="M-3", name="Zeta Mill", ...)) (inserted first)'
          explanation: >
            Deliberately inserts the alphabetically-*last* machine
            *first* - if the real API response simply reflected
            insertion order, `"Zeta Mill"` would appear first in it.
        - element: 'sorted(body.keys())'
          explanation: >
            Sorts the response's own real top-level keys before
            comparing them - a defensive habit ensuring this check
            doesn't depend on Python dict key order, which is itself not
            something this unit is trying to characterize.
        - element: '[m["name"] for m in body["data"]]'
          explanation: >
            A list comprehension (already familiar from earlier in this
            curriculum) extracting just the real `name` field, in
            response order, from every real machine dict in `body["data"]`
            - the exact real sequence this unit exists to check.
        - element: 'assert [m["name"] for m in body["data"]] == ["Alpha Mill", "Mid Mill", "Zeta Mill"]'
          explanation: >
            Confirms the real response order is alphabetical -
            `"Alpha Mill"` first, `"Zeta Mill"` last - directly
            contradicting the insertion order, and matching
            `get_machines`'s own real `.order_by(Machine.name)` call
            exactly.
    mental_model:
      applicable: false
    execution_trace:
      applicable: false
    cs_lens: >
      This is characterizing a **contract**, not just a value - what a
      caller can actually rely on, versus what merely happens to be true
      today. Also recognized in: an API's own published response schema,
      distinct from any one example response; a database index's own
      guaranteed sort order versus an unindexed table's genuinely
      undefined one; a function's documented return-type contract versus
      one specific observed return value; and, in this project's own
      domain, a part traveler's defined field layout, which every
      station on the floor can rely on staying the same, regardless of
      which specific part is on it.
    se_lens: >
      The design principle is that a contract worth relying on has to be
      characterized explicitly, not inferred from one lucky observation.
      The real alternative not chosen - leaving ordering unspecified and
      letting callers discover it empirically - would still "work" today,
      since `.order_by(Machine.name)` is real, deliberate code; the
      honest risk is that nothing currently *proves* that guarantee is
      real, so a future edit removing that one real line, for what looks
      like an unrelated reason, would silently change caller-visible
      behavior with no test anywhere to catch it. The cost paid here:
      real, deliberate setup (three machines, inserted out of order) to
      make sure this check couldn't pass by accident.
    commands:
      - command: backend/.venv/Scripts/python.exe verification/phase-02/lab_pytest_demo/lab_golden_shape_ordering.py
        explanation: >
          Runs this as a plain script, from the repository root.
    verification:
      applicable: true
      real_output: |
        Seeding default users...
        status: 200
        top-level keys: ['data', 'total']
        total: 3
        names, in real response order: ['Alpha Mill', 'Mid Mill', 'Zeta Mill']
        one real machine's own real field keys: ['axes', 'category', 'createdAt', 'currentOperatorClientId', 'currentPartId', 'groupId', 'hasToolChanger', 'id', 'location', 'manufacturer', 'maxSpindleSpeed', 'model', 'name', 'operatorLastHeartbeatAt', 'serialNumber', 'spindleTaper', 'status', 'subType', 'toolChangerCapacity', 'updatedAt', 'xTravel', 'yTravel', 'zTravel']
        response shape confirmed, and real ordering is alphabetical by name - not insertion order
      output_file: verification/phase-02/lab_pytest_demo/lab_golden_shape_ordering_output.txt
    connection_to_previous: >
      This is the lesson's first unit - it establishes the real list
      endpoint every later unit in this lesson reuses, characterized
      across its first two real dimensions.

  - title: "Defaults - What Happens When Nothing Is Specified"
    problem: >
      `get_machines` accepts three real, optional query parameters. What
      does "optional" actually mean, in terms of real behavior, when
      none of them are given at all?
    socratic_prompt:
      - >
        If none of `status`, `type`, or `groupId` are present in a real
        request, what does `get_machines`'s own real code
        (`if status: ... if machine_type: ... if group_id: ...`)
        predict happens to the base `Machine.query`, before
        `.order_by` even runs?
      - >
        Is "return every real machine" the only reasonable real default
        a list endpoint could have chosen? What real alternative default
        can you name?
    project_change:
      reference_source: >
        Real specimen: `backend/app/routes/machines.py:27-38`, read
        again this session - the three real conditional filters, none of
        which apply when their own query parameter is absent.
      files_affected: []
      change_type: none
      location: >
        N/A - a new, standalone script; no existing project structure to
        place it within.
      dependencies: >
        Three real `Machine` rows, with three different real, distinct
        status values.
    new_code:
      applicable: true
      intro: >
        Three real machines, three different real statuses, one real
        request with no filters at all:
      file: verification/phase-02/lab_pytest_demo/lab_golden_defaults.py
      status: new
      language: python
      code: |
        import sys
        sys.path.insert(0, "backend")

        from app import create_app, db
        from app.models.machine import Machine

        app = create_app("testing")
        with app.app_context():
            db.session.add(Machine(id="M-1", name="Available Mill", category="mill", sub_type="3_axis", status="available"))
            db.session.add(Machine(id="M-2", name="Running Mill", category="mill", sub_type="3_axis", status="running"))
            db.session.add(Machine(id="M-3", name="Offline Mill", category="mill", sub_type="3_axis", status="offline"))
            db.session.commit()

            client = app.test_client()
            response = client.get("/api/machines")
            body = response.get_json()

            print("no query params at all -> total:", body["total"])
            print("statuses returned:", sorted(m["status"] for m in body["data"]))

            assert body["total"] == 3
            assert sorted(m["status"] for m in body["data"]) == ["available", "offline", "running"]
            print("the real default, with no filter arguments given, is every real machine - nothing excluded")
    updated_project:
      applicable: false
    mechanical_walkthrough:
      applicable: true
      items:
        - element: 'Machine(id="M-1", ..., status="available") / Machine(..., status="running") / Machine(..., status="offline")'
          explanation: >
            Three real machines with three deliberately different real
            `status` values - chosen specifically so a real filter, if
            one had been applied, would visibly exclude at least one of
            them.
        - element: 'client.get("/api/machines") (no query string at all)'
          explanation: >
            A real request to the bare route, with no `?status=...` or
            any other query parameter present - `request.args.get(...)`
            on the receiving end returns `None` for each of the three,
            so all three of `get_machines`'s own `if` conditions are
            `False`.
        - element: 'sorted(m["status"] for m in body["data"])'
          explanation: >
            A generator expression (already familiar from earlier in
            this curriculum) extracting each real machine's `status`
            field, sorted for a stable, order-independent comparison -
            deliberately not reusing the ordering check from the
            previous unit, since this unit is characterizing inclusion,
            not sequence.
        - element: 'assert sorted(...) == ["available", "offline", "running"]'
          explanation: >
            Confirms all three real, differently-statused machines came
            back - the real, concrete meaning of this route's own
            default: no filter given means no exclusion at all.
    mental_model:
      applicable: false
    execution_trace:
      applicable: false
    cs_lens: >
      This is characterizing an **implicit default**: behavior that
      exists only because of what a caller *didn't* say. Also recognized
      in: a function parameter's own default value, only observable by
      actually calling it without that argument; a config system falling
      back to a base config when no environment-specific override
      exists; a database column's own `DEFAULT` value, only visible on
      an insert that omits it; and, in this project's own domain, a
      machine left at its own default cutting feed rate whenever a
      program doesn't explicitly override it.
    se_lens: >
      The design principle is that "no filter" is itself a real,
      specific choice worth naming and checking, not an unremarkable
      absence. The real alternative this project's own code did not
      choose - requiring at least one real filter, or defaulting to an
      empty result with none given - would be an equally valid, real
      design; the honest cost of the one actually chosen here is that a
      caller who forgets to add a filter gets everything, silently,
      which could matter for a large real fleet of machines in a way it
      doesn't for this lesson's own three.
    commands:
      - command: backend/.venv/Scripts/python.exe verification/phase-02/lab_pytest_demo/lab_golden_defaults.py
        explanation: >
          Runs this as a plain script, from the repository root.
    verification:
      applicable: true
      real_output: |
        Seeding default users...
        no query params at all -> total: 3
        statuses returned: ['available', 'offline', 'running']
        the real default, with no filter arguments given, is every real machine - nothing excluded
      output_file: verification/phase-02/lab_pytest_demo/lab_golden_defaults_output.txt
    connection_to_previous: >
      The previous unit characterized what a response looks like and
      what order it comes in; this unit characterizes what's included in
      it by default, before this lesson's next unit starts deliberately
      excluding things.

  - title: "Edge Cases - The Inputs Nobody Thinks to Try First"
    problem: >
      `?status=maintenance` and `?type=mill` are both real, plausible
      query strings a caller might reasonably send. This session's own
      real evidence shows they produce two completely different real
      outcomes - what actually explains the difference?
    socratic_prompt:
      - >
        `Machine.status` is a real, declared column on `Machine`. Is
        `Machine.type`? Read `backend/app/models/machine.py` again if
        you're not sure, then predict what
        `query.filter(Machine.type == machine_type)` does if the answer
        is no.
      - >
        Two different "no real machine matches this filter" cases - one
        for a genuinely empty result, one for a query parameter that
        references a column that doesn't exist. Should a full
        characterization of this endpoint expect the same real outcome
        for both, or two different ones?
    project_change:
      reference_source: >
        Real specimen: `backend/app/routes/machines.py:27-38`, read
        again this session, alongside `backend/app/models/machine.py:41-80`
        - confirming, by reading it directly, that `Machine` declares no
        real `type` column (`type` belongs to the separate
        `MachineGroup` class in the same file).
      files_affected: []
      change_type: none
      location: >
        N/A - a new, standalone script; no existing project structure to
        place it within.
      dependencies: >
        One real `Machine` row.
    new_code:
      applicable: true
      intro: >
        Two real, plausible filters, tried one after another:
      file: verification/phase-02/lab_pytest_demo/lab_golden_edge_cases.py
      status: new
      language: python
      code: |
        import sys
        sys.path.insert(0, "backend")

        from app import create_app, db
        from app.models.machine import Machine

        app = create_app("testing")
        with app.app_context():
            db.session.add(Machine(id="M-1", name="Available Mill", category="mill", sub_type="3_axis", status="available"))
            db.session.commit()

            client = app.test_client()

            # Edge case 1: filtering by a real, but currently-unmatched, status value.
            r_no_match = client.get("/api/machines?status=maintenance")
            print("status=maintenance (no real machine has this) -> status:", r_no_match.status_code, "total:", r_no_match.get_json()["total"])
            assert r_no_match.status_code == 200
            assert r_no_match.get_json()["total"] == 0

            # Edge case 2: filtering by 'type' - a real query param this route's own
            # docstring documents, against a column Machine does not actually have.
            try:
                r_type_filter = client.get("/api/machines?type=mill")
                print("type=mill -> status:", r_type_filter.status_code, "body:", r_type_filter.get_json())
            except AttributeError as e:
                print("type=mill -> raised AttributeError:", e)

            print("two real 'unmatched filter' cases, two completely different real outcomes")
    updated_project:
      applicable: false
    mechanical_walkthrough:
      applicable: true
      items:
        - element: 'client.get("/api/machines?status=maintenance")'
          explanation: >
            Sends a real, well-formed request with a query value that's
            genuinely valid (`"maintenance"` is one of the four values
            this route's own docstring names) but matches zero real rows
            in this unit's own tiny dataset.
        - element: 'assert r_no_match.status_code == 200 / assert ...["total"] == 0'
          explanation: >
            Confirms this first edge case is handled gracefully - a real
            `200`, with a real, empty `data` list and `total: 0` - the
            unmatched filter is a completely ordinary, well-behaved
            outcome.
        - element: 'try: r_type_filter = client.get("/api/machines?type=mill") except AttributeError as e:'
          explanation: >
            Wraps the second real request in a real `try`/`except`,
            deliberately, because this specific call is known, from this
            session's own earlier probing, to raise rather than return a
            normal response - a real, necessary adjustment to actually
            observe what happens instead of the script simply crashing.
        - element: 'except AttributeError as e: print("type=mill -> raised AttributeError:", e)'
          explanation: >
            Catches the real, genuine `AttributeError` `Machine.type`
            raises the moment `get_machines`'s own code tries to build a
            filter on it, and prints its real message -
            `"type object 'Machine' has no attribute 'type'"` - proof
            this is a real Python-level crash, not a handled `400` or
            `404` the route's own code chose to return.
    mental_model:
      applicable: false
    execution_trace:
      applicable: true
      shape: timing
      lines:
        - >
          `client.get("/api/machines?status=maintenance")` - real
          request reaches `get_machines`; `status` is truthy, so
          `query = query.filter(Machine.status == "maintenance")` runs
          successfully, since `Machine.status` is a real column;
          `machine_type` and `group_id` are both `None`, so neither of
          the next two `if` blocks runs.
        - >
          The narrowed query, run against this unit's one real machine
          (whose own status is `"available"`, not `"maintenance"`),
          returns zero real rows - a completely ordinary, successful
          empty result.
        - >
          `client.get("/api/machines?type=mill")` - real request reaches
          `get_machines` again; `machine_type` is truthy, so
          `query.filter(Machine.type == "mill")` is attempted.
        - >
          Building that expression requires Python to first resolve
          `Machine.type` - and because no such real attribute exists on
          the class, Python raises `AttributeError` immediately, before
          any real SQL is ever built or run - the request never reaches
          `.order_by`, `jsonify`, or any of this route's own later real
          code at all.
    cs_lens: >
      This is the real difference between a **handled failure** and an
      **unhandled exception** - `get_machines` was clearly written with
      *some* failure cases in mind (an unmatched filter, handled
      gracefully), but not this one. Also recognized in: a stack trace
      surfacing in production because an input path nobody anticipated
      slipped past every `try`/`except` in the code; a compiler's own
      distinction between a caught, reported error and an internal
      compiler crash; a fuzz tester's own real job being specifically to
      find inputs that trigger the second kind, not the first; and, in
      this project's own domain, a machine alarm the control software
