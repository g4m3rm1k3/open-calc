      - >
        If you rewrote `total_minutes`'s internals - same inputs, same
        outputs, different code - without re-running anything, how would
        you actually know your rewrite did not quietly change what it
        returns?
      - >
        Given this lesson's own regression unit, what is the real
        difference between "a change that was meant to add a new
        behavior" and "a change that was meant to restructure the code
        without changing behavior at all," from the point of view of an
        `assert` that only checks the final result?
