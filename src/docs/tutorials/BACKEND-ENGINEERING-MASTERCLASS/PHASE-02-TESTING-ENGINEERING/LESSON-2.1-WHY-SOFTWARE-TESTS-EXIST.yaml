        - element: 'assert total_minutes(ops) == 10 (second occurrence) / print("after safe refactor: ...")'
          explanation: >
            The exact same assert expression, unedited, re-run against
            the exact same `ops`, now calling the explicit-loop version;
            it still passes, which is the concrete proof this
            restructuring did not change what the function returns.
        - element: 'ops[:-1]'
          explanation: >
            A list slice with an omitted start (meaning "from the
            beginning") and a negative stop index `-1` (meaning "up to,
            but not including, the last element"), returning a new list
            with the final operation silently dropped.
        - element: 'for op in ops[:-1]: (third def)'
          explanation: >
            The same loop shape as the "safe" refactor, but now
            iterating over the sliced list instead of the full one - the
            accumulation logic itself (`total = 0`, `+=`, `return total`)
            is unchanged, which is exactly why this looks like a
            similarly small, safe edit.
        - element: 'print(f"total_minutes(ops) = {total_minutes(ops)}") / assert total_minutes(ops) == 10, "refactor silently changed behavior"'
          explanation: >
            Calls the third, now-rebound version, gets `4` instead of
            `10`, and the same unedited assert expression this unit has
            been re-running the whole time catches it immediately -
            proof this particular "refactor" was never actually safe.
