          `def total_minutes(ops): return sum(op["minutes"] for op in ops)`
          - the baseline; `assert ... == 10` passes, confirming it before
          anything is restructured.
        - >
          `def total_minutes(ops): total = 0; for op in ops: total += op["minutes"]; return total`
          - a genuine refactor: different internal shape, same external
          behavior; rebinds the name `total_minutes` to this new
          function object.
        - >
          `assert total_minutes(ops) == 10` (re-run, unedited) - calls
          the refactored version against the same `ops`; still passes,
          which is the actual proof the refactor was safe.
        - >
          `def total_minutes(ops): total = 0; for op in ops[:-1]: total += op["minutes"]; return total`
          - a second edit that looks the same shape as the first, but
          silently drops the last operation; rebinds the name again.
        - >
          `assert total_minutes(ops) == 10, "refactor silently changed behavior"`
          (re-run, still unedited) - calls the third version against the
          same `ops`; returns `4` instead of `10`; the condition is
          `False`, so Python raises `AssertionError`, catching a change
          that "looked" just as safe as the previous one.
    cs_lens: >
      This is **refactoring**: restructuring a program's internal
      structure without changing its observable behavior - a change to
      how, never to what. Also recognized in: a database migration that
      changes a schema's internal representation while preserving every
      query's results; an API's internal implementation being rewritten
      while its versioned external contract stays identical; a compiler
      optimization pass that must, by definition, preserve a program's
      exact semantics while changing the instructions it produces; and a
      manufacturing retrofit that changes a machine's internal tooling
      or control hardware while its certified working envelope must stay
      provably the same.
    se_lens: >
      The design principle is this curriculum's own stated method: test
      the existing behavior first, then rebuild, so the rebuild can be
      checked against the exact same standard the original had to meet.
      The real alternative not chosen is restructuring first and
      checking afterward, by inspection - exactly the temptation this
      lesson's own second "refactor" shows failing: a change that
      *looked* just as small and safe as the first one, caught only
      because a check that already existed, unedited, was still there to
      catch it. The honest cost of testing first: it is real, extra work
      done before any visible improvement exists yet. The honest cost on
      the other side, stated plainly: a passing `assert` only proves
      behavior stayed the same for the exact inputs it actually checks -
      `ops` here, and nothing else - so it is real protection, not a
      complete guarantee against every possible behavior change.
    commands:
      - command: python verification/phase-02/lab_refactor_safety.py
        explanation: >
          Runs the lab script from the repository root; no flags needed.
    verification:
      applicable: true
      real_output: |
        before refactor: assert passed, total_minutes(ops) == 10
        after safe refactor: assert still passed, total_minutes(ops) == 10
        total_minutes(ops) = 4
        Traceback (most recent call last):
          File "C:\Users\g4m3r\Documents\manufacturing-platform\verification\phase-02\lab_refactor_safety.py", line 34, in <module>
            assert total_minutes(ops) == 10, "refactor silently changed behavior"
                   ^^^^^^^^^^^^^^^^^^^^^^^^
        AssertionError: refactor silently changed behavior
      output_file: verification/phase-02/lab_refactor_safety_output.txt
    connection_to_previous: >
      The previous unit showed what it feels like to get a checked
      answer instead of an eyeballed one; this unit shows why that
      matters most exactly when code is being restructured - a
      "safe-looking" change is exactly where an eyeball check is weakest
      and a real `assert` is strongest.

closing:
  connect_the_pieces: >
    Follow `total_minutes(ops)`, for `ops = [{"minutes": 4}, {"minutes": 6}]`,
    expected total `10`, through every unit in this lesson. First it has
    no defined right answer at all - a buggy slice quietly returns `6`,
    and only a written-down `assert total_minutes(ops) == 10` reveals
    that `6` was wrong (correctness). Once fixed and passing, a later,
    unrelated-looking edit reintroduces the same wrongness, and the
    exact same, unedited `assert` catches it a second time (regression).
    The whole time, a docstring sitting right above the code claims
    "total minutes across ops" - true or false, it never once checks
    itself; only the `assert`, stating the identical claim as real code,
    ever does (executable specification). Reading printed numbers alone
    never answers whether `10` (or `6`) is right; the same `assert`
    answers it in one line - `OK`, or a traceback - instead of asking a
    human to decide (confidence). And restructuring the correct
    implementation from a generator expression to an explicit loop
    leaves that same `assert` green, proving the restructuring was safe;
    a different restructuring that drops the last operation turns the
    same `assert` red on the same `ops`, proving it was not - and the
    `assert` is what tells the two apart (refactoring safety). Every
    single one of these five ideas is a different answer to the same
    question this lesson opened with: what does `backend/test_xml_parser.py`'s
    own real, already-existing "test" script actually prove today? The
    honest answer, after this lesson, is: none of them.
  next_lesson_pointer: >
    Next, this same vocabulary - what a test actually checks, and how
    confidently it checks it - gets sorted into a precise taxonomy: unit
    tests, integration tests, and system tests, each answering a
    different question about correctness at a different scope, so
    "write a test" stops being one vague instruction and starts meaning
    a specific, deliberate choice.
