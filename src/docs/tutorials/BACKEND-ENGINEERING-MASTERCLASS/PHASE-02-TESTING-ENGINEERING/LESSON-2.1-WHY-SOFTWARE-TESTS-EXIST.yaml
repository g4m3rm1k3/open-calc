number: "2.1"
title: "Why Software Tests Exist"
path_note: >
  File paths under backend/... refer to the real manufacturing-platform
  repository. Paths under verification/... refer to that same
  repository's verification folder.

what_you_will_build: >
  Five small, real, throwaway `assert`-based checks against a single
  tiny function - used to directly observe, one at a time, what
  correctness, regression, an executable specification, confidence, and
  refactoring safety actually mean in practice - and why this project's
  own real, already-existing "test" script for its Mastercam XML parser
  provides none of them today, before this curriculum starts writing
  real tests against the real backend.

what_you_need_to_know_first: >
  Defining and calling plain Python functions; reading a raised
  exception's traceback back to the line that raised it; list and dict
  literals, dict key access, and list slicing; generator expressions
  passed to an aggregating call like `sum`.

terms:
  - name: correctness
    definition: >
      The property of a piece of code producing the output its author
      actually intended for a given input - not "ran without crashing"
      or "looks plausible," but matches a specific, statable
      expectation. It exists as a concept because "the code executed"
      and "the code did the right thing" are two entirely different
      claims, and a program can satisfy the first while completely
      failing the second.
  - name: regression
    definition: >
      A previously-working piece of behavior that quietly stops working
      because of a later, often unrelated-looking, change elsewhere in
      the code. It exists as a named failure mode because software
      rarely breaks all at once - it breaks one small, later edit at a
      time - and without something re-checking the old behavior every
      time, nobody notices until the broken version has already
      shipped.
  - name: executable specification
    definition: >
      A statement of what code is supposed to do, expressed in a form
      the computer itself runs and checks against the real
      implementation, rather than prose a human has to read and
      separately re-verify by eye. It exists because a prose description
      (a comment, a docstring) can silently drift out of sync with the
      code it describes, and nothing about running the code ever
      re-checks it - while a specification written as real code gets
      re-checked, automatically, every single time it runs. This does
      not mean an executable specification is automatically correct: the
      expected value written into it can itself be the wrong one, the
      same as a prose claim can. What it guarantees is narrower and
      still real - it cannot silently stop matching the code without
      saying so, the way a comment or docstring can.
  - name: confidence
    definition: >
      In the sense this lesson uses it, the concrete, checkable
      knowledge that a change did not break existing behavior - as
      opposed to a personal hope or guess based on reading code or
      output. It exists as a distinct idea because "I think this still
      works" and "something just verified this still works" are
      different states, and only the second one is a safe basis for
      deciding to ship a change.
  - name: refactoring safety
    definition: >
      The guarantee that restructuring code's internal shape (how it is
      written) without changing its external behavior (what it does)
      can actually be verified, not just assumed. It exists because a
      "refactor" that quietly changes behavior is not a refactor at all
      - it is an undetected bug - and only a check run both before and
      after the restructuring can tell the two apart.
  - name: assert statement
    definition: >
      Python's own built-in `assert <condition>, <message>` statement:
      it evaluates `<condition>`; if that is `True`, execution continues
      as though the line were not there; if it is `False`, Python
      raises `AssertionError` immediately, carrying `<message>`. It
      exists as the smallest possible way to write "I expect this to be
      true" in a form Python itself checks every time the line runs,
      rather than a comment a human has to re-verify by eye. It is a
      primitive language mechanism, not a testing framework - Python can
      be told to skip every `assert` in a program entirely (running it
      with the `-O` flag strips them out), which is exactly why real
      test suites are normally built on a dedicated framework instead of
      bare `assert` statements left in production code; this lesson uses
      bare `assert` deliberately, to teach the underlying idea before a
      framework is introduced.
  - name: generator expression
    definition: >
      A compact expression of the shape `EXPR for NAME in ITERABLE`,
      producing values one at a time, on demand, rather than building a
      whole list in memory up front. It exists so an aggregating call
      like `sum(...)` can consume items one at a time without a
      separate, fully-built intermediate list ever needing to exist.
  - name: list slicing
    definition: >
      The `sequence[start:stop]` syntax, returning a new, separate
      sequence containing the elements from index `start` up to (but
      not including) index `stop`; omitting either side means "from the
      beginning" or "through the end." It exists as a compact way to
      select a contiguous sub-range of a sequence without writing an
      explicit loop.
  - name: dictionary key access
    definition: >
      The `some_dict["key"]` syntax, which looks up and returns the
      value stored under the literal key `"key"`, raising `KeyError` if
      that exact key is not present. It exists as the direct, ordinary
      way to read one named field out of a dict, used throughout this
      lesson's own `op["minutes"]`.
  - name: f-string
    definition: >
      A string literal written as `f"...{expression}..."`, where
      anything inside `{}` is evaluated as real Python and inserted into
      the string at the point the f-string itself runs. It exists so a
      value does not have to be manually converted to text and
      concatenated by hand to appear inside a message.
  - name: docstring
    definition: >
      A string literal written as the very first statement inside a
      function's (or class's, or module's) body, conventionally
      describing what that function does; Python stores it on the
      function object itself but never executes or checks it against
      anything. It exists as a place to write human-readable
      documentation directly next to the code it documents - but, as
      this lesson's own executable-specification unit shows, being
      written does not make it true.
  - name: traceback
    definition: >
      The block of text Python prints when an exception propagates all
      the way up without being caught: which line raised it, which
      function called which function to get there, and the exception's
      own type and message. It exists so a failure is not just "the
      program stopped" - it is a specific, readable record of exactly
      where and why.
  - name: name rebinding
    definition: >
      What happens when a name - like a function's own name,
      `total_minutes` - is assigned to again: Python does not modify
      whatever the name previously pointed to; it simply makes the name
      point at the new object from that point in the code onward, and
      any later use of that name reaches the new object. It exists as a
      real mechanism (not just a phrase) because Python names are labels
      pointing at objects, not fixed slots holding one unchangeable
      value - writing `def total_minutes(ops):` a second time in the
      same scope produces a second, brand-new function object and
      re-points the name at it.

objects_and_methods:
  - name: sum
    what_it_is: >
      A built-in Python function that adds together every item in an
      iterable and returns the total.
    implementation: >
      `sum(iterable, start=0)`, defined among Python's builtins; iterates
      once over `iterable`, adding each item to a running total that
      begins at `start` (`0` by default), and returns that total once
      the iterable is exhausted.
    its_use: >
      This lesson uses it to compute one number, `total_minutes`, from
      the `"minutes"` field of a list of operation-like dicts, so that a
      bug, a fix, or a regression in that number has exactly one
      obvious place it happens.
    type: A builtin function - called as a bare name, `sum(...)`, never as a method on an object.
    responsibility: >
      Reducing any iterable of numbers down to one running total,
      without the caller having to write the accumulation loop by hand.
    depends_on: >
      An iterable whose items support `+` with `start`'s own type -
      here, plain `int`s produced by `op["minutes"]`, added to the
      default `start=0`.
    connects_to: >
      Called directly by `total_minutes` in this lesson's generator-based
      versions; receives a generator expression as its sole argument and
      consumes it lazily, one `op["minutes"]` value at a time, never
      holding the whole sequence of values at once.
    shape: >
      Takes any iterable of numbers in, returns a single plain number
      out - never a list, never `None` (an empty iterable with the
      default `start=0` returns `0`, not an error).
  - name: AssertionError
    what_it_is: >
      A built-in exception class that Python raises automatically when
      an `assert` statement's condition evaluates to `False`.
    implementation: >
      A subclass of Python's built-in `Exception`, defined inside the
      interpreter itself; carries whatever optional message string was
      written after the comma in the `assert` statement that raised it.
    its_use: >
      Every lab in this lesson relies on `AssertionError` being the
      concrete, visible signal that a stated expectation did not hold -
      it is what turns a silently-wrong number into a loud, unmissable
      failure with a real traceback.
    type: >
      A builtin exception class - an object the interpreter instantiates
      automatically when an `assert` fails, never constructed by hand in
      this lesson's own code.
    responsibility: >
      Representing, as a real Python object carrying a traceback, the
      specific fact that some `assert`ed condition was false at a
      specific line.
    depends_on: >
      An `assert` statement whose condition evaluated to `False`;
      optionally, the message string written after the comma becomes
      this exception's own stored arguments.
    connects_to: >
      Raised by the Python interpreter itself at the exact point an
      `assert`'s condition fails; propagates upward exactly like any
      other exception, printing a traceback and stopping the script
      whenever nothing catches it - as every failing lab in this lesson
      demonstrates.
    shape: >
      A single exception object carrying one optional message string;
      never a return value - its presence or absence is itself the
      signal a caller reacts to.
  - name: test_parser
    what_it_is: >
      A real, already-existing function in this project's own backend,
      named as though it tests the Mastercam XML parser.
    implementation: >
      `def test_parser():` - takes no arguments, loops over two real
      sample XML files, calls `parse_mastercam_xml` on each, and calls
      `print()` repeatedly to show the parsed metadata, sequences, and
      tool assemblies in the terminal.
    its_use: >
      This lesson uses it as real, existing evidence for what "testing"
      currently means in this codebase - it is read and cited, never
      called or modified by this lesson's own code.
    type: >
      A standalone module-level function, not a method on any class,
      defined at `backend/test_xml_parser.py:16`.
    responsibility: >
      As written, its real responsibility is only to print information
      for a human to read - nothing in its own body compares any printed
      value against an expected one.
    depends_on: >
      The real sample XML files under `sample-data/`, and the real
      `parse_mastercam_xml` function it imports and calls.
    connects_to: >
      Called only from this file's own `if __name__ == '__main__':`
      guard; it calls `parse_mastercam_xml` and, on a successful parse,
      writes the parsed result out to a JSON file for later inspection.
    shape: >
      Its real, declared shape returns nothing (`None`, implicitly) and
      contains no `assert` anywhere across its 67 real lines - every
      line that reports information does so through `print()`.

concept_units:
  - title: "Correctness - What \"Right\" Even Means"
    problem: >
      `backend/test_xml_parser.py` calls itself a test script for this
      project's Mastercam XML parser. Its own `test_parser` function,
      read in full this session, prints the parser's output - file
      names, tool counts, operation times - for a human sitting at a
      terminal to look at. Nowhere in that function, or anywhere else in
      this project, is there a single line stating what the *correct*
      parsed result for either sample file actually is. If the parser
      started returning a slightly wrong number tomorrow, what in this
      project would notice?
    socratic_prompt:
      - >
        The lab below prints `total_minutes(ops) = 6` for
        `ops = [{"minutes": 4}, {"minutes": 6}]`. Before reading
        further: is `6` the right answer? What would you actually need,
        beyond that printed line, to answer that question at all?
      - >
        If you had to teach a computer - not a person reading a
        terminal - how to decide whether `6` is right or wrong, what is
        the smallest true-or-false statement you would write down?
      - >
        `backend/test_xml_parser.py`'s own `test_parser` function prints
        results the exact same way. What happens inside that file if the
        real parser it calls starts returning a slightly wrong number
        next month?
    project_change:
      reference_source: >
        No reference counterpart for this unit's own throwaway code.
        Real specimen motivating this unit: `backend/test_xml_parser.py:16-82`
        (`test_parser`), read in full this session. Its own docstring at
        line 17 reads `"""Test parser with sample files."""`; nowhere in
        its 67 lines does it state what a correct parse actually looks
        like beyond whatever gets printed.
      files_affected: []
      change_type: none
      location: >
        N/A - a new, standalone throwaway script; no existing project
        structure to place it within.
      dependencies: >
        None beyond Python 3 itself - no imports from the project.
    new_code:
      applicable: true
      intro: >
        The smallest possible version of this problem: one function, one
        expected total, one implementation that has a real bug in it.
      file: verification/phase-02/lab_correctness.py
      status: new
      language: python
      code: |
        def total_minutes(ops):
            return sum(op["minutes"] for op in ops[1:])  # bug: skips the first operation


        ops = [{"minutes": 4}, {"minutes": 6}]
        print(f"total_minutes(ops) = {total_minutes(ops)}")

        assert total_minutes(ops) == 10, "expected 10 total minutes"
    updated_project:
      applicable: false
    mechanical_walkthrough:
      applicable: true
      items:
        - element: 'def total_minutes(ops):'
          explanation: >
            Defines a plain function named `total_minutes`, taking one
            parameter, `ops`, meant to stand for a list of
            operation-like dicts. The `def` statement does not run the
            body at all - it only creates a function object and binds
            the name `total_minutes` to it in the current scope, ready
            to be called later.
        - element: 'ops[1:]'
          explanation: >
            A list slice. `ops[1:]` builds a brand-new list containing
            every element of `ops` from index `1` onward, dropping index
            `0` entirely - it does not modify `ops` itself. This is the
            actual bug: the intent was to sum every operation's minutes,
            but this slice silently throws away the first operation
            before the sum ever sees it.
        - element: 'op["minutes"] for op in ops[1:]'
          explanation: >
            A generator expression. For each `op` produced by iterating
            over the sliced list, it evaluates `op["minutes"]` and
            yields that one value, on demand, without ever building a
            separate list of those values in memory first.
        - element: 'op["minutes"]'
          explanation: >
            A dictionary key access. Each `op` is a dict like
            `{"minutes": 6}`; this reads the value stored under the
            literal string key `"minutes"`. If a dict in `ops` were
            missing that key, this would raise `KeyError` instead of
            silently returning anything - there is no default here.
        - element: 'sum(...)'
          explanation: >
            Calls the built-in `sum` on the generator expression,
            consuming every value it yields and adding them together,
            starting from `sum`'s own default `start` of `0`. Because
            the generator already dropped the first operation's minutes,
            `sum` genuinely has no way to know that - it only ever sees
            what the generator hands it.
        - element: return
          explanation: >
            Ends `total_minutes` and hands the value `sum(...)` computed
            back to whatever called the function - here, `6`, not the
            `10` a reader would expect from two operations of `4` and
            `6` minutes.
        - element: 'ops = [{"minutes": 4}, {"minutes": 6}]'
          explanation: >
            Builds a real list containing two real dicts, each with one
            key, `"minutes"`, and assigns it to the name `ops` at module
            scope - the concrete input every version of `total_minutes`
            in this lesson gets called with.
        - element: 'print(f"total_minutes(ops) = {total_minutes(ops)}")'
          explanation: >
            An f-string that calls `total_minutes(ops)` once and embeds
            the returned value directly into the printed message. This
            line is exactly the same shape as `backend/test_xml_parser.py`'s
            own prints - a computed value shown to a human, with nothing
            here saying whether `6` is the right answer.
        - element: 'assert total_minutes(ops) == 10, "expected 10 total minutes"'
          explanation: >
            An `assert` statement. It calls `total_minutes(ops)` a
            second time (a fresh call, not reusing the printed value
            above), compares the result to `10` with `==`, and, because
            `6 == 10` is `False`, raises
            `AssertionError("expected 10 total minutes")` immediately -
            exactly the real traceback shown in this unit's own saved
            verification output below.
    mental_model:
      applicable: false
    execution_trace:
      applicable: true
      shape: values
      lines:
        - 'slice: ops[1:] -> [{"minutes": 6}]  (index 0, {"minutes": 4}, dropped by the slice)'
        - 'generator: yields op["minutes"] for the one remaining op -> yields 6'
        - 'sum(...): running total starts at 0 (sum''s own default start), adds the single yielded value -> 0 + 6 = 6'
    cs_lens: >
      This is the gap between an **implementation** and a **specification**:
      code that runs is only an implementation; correctness is always
      relative to some separately-stated specification of what the
      output should be. Also recognized in: a compiler's type checker
      (checking code against declared types, a partial specification); a
      database's own `CHECK` constraint (rejecting a row that violates a
      stated rule); contract-based programming's preconditions and
      postconditions; and, in this project's own domain, a machine's
      first-article proveout - the real database schema this project
      already has includes a `status` field, on a machine/CAM-file
      pairing, defaulting to `'untested'` (`machine_cam_pairings`, read
      this session), precisely because "the program ran" and "this
      pairing is actually proven correct on this machine" are recognized
      as two separate questions on the shop floor, too.
    se_lens: >
      The design principle at stake is stating a definition of
      correctness explicitly, in a checkable form, instead of leaving it
      implicit in whoever happens to be reading the output. The real
      alternative already in use in this project is exactly what
      `backend/test_xml_parser.py`'s `test_parser` does: print
      everything and let a human decide whether it looks right. That
      alternative is cheap to write - no expected value ever has to be
      pinned down - but it does not scale (every future run needs a
      human's attention again), is inconsistent between different
      readers, and can regress silently, because nothing about it
      changes when the underlying numbers do. Writing a real `assert`
      instead costs real, honest work up front: someone has to decide,
      and write down, what the *actual* correct total is - work this
      project has never done for its own parser.
    commands:
      - command: python verification/phase-02/lab_correctness.py
        explanation: >
          Runs the lab script directly from the manufacturing-platform
          repository root. No flags are needed - the script has no
          project imports, only the standard library's own `sum` and the
          `assert` statement.
    verification:
      applicable: true
      real_output: |
        total_minutes(ops) = 6
        Traceback (most recent call last):
          File "C:\Users\g4m3r\Documents\manufacturing-platform\verification\phase-02\lab_correctness.py", line 8, in <module>
            assert total_minutes(ops) == 10, "expected 10 total minutes"
                   ^^^^^^^^^^^^^^^^^^^^^^^^
        AssertionError: expected 10 total minutes
      output_file: verification/phase-02/lab_correctness_output.txt
    connection_to_previous: >
      This is the lesson's first unit - it establishes the running
      example, `total_minutes(ops)`, and the gap between "printed" and
      "correct" that every later unit in this lesson builds on.

  - title: "Regression - When Working Code Quietly Breaks"
    problem: >
      Suppose `total_minutes` gets fixed and is passing today. Months
      from now, someone edits it again for a completely different,
      plausible-sounding reason - unrelated, in their mind, to the case
      that already worked. Nothing in this project as it exists right
      now would notice if that edit also broke the case that used to
      pass. `backend/test_xml_parser.py`'s own approach - print
      everything, let a human judge it - has no memory of what "used to
      be right" even means.
    socratic_prompt:
      - >
        Given what an `assert` statement already does, would the exact
        same `assert total_minutes(ops) == 10` line, left in place and
        re-run later, catch a completely different bug introduced by a
        future, unrelated edit - or only the specific bug it was
        originally written against?
      - >
        If the previous unit's `assert` had been deleted right after it
        passed once, what would be left in this project to notice a
        later change breaking the same case again?
    project_change:
      reference_source: >
        No reference counterpart for this unit's own throwaway code.
        Same real specimen as the previous unit: `backend/test_xml_parser.py:16-82`,
        read in full this session. Nothing in that function connects a
        change to `app/services/mastercam_xml_parser.py` to this file
        being re-run automatically at all - there is no mechanism in
        this project linking the two.
      files_affected: []
      change_type: none
      location: >
        N/A - a new, standalone throwaway script; no existing project
        structure to place it within.
      dependencies: >
        None beyond Python 3 itself - no imports from the project.
    new_code:
      applicable: true
      intro: >
        Starting from the fixed version of `total_minutes`, then editing
        it again for a reason that has nothing to do with the case that
        already passed:
      file: verification/phase-02/lab_regression.py
      status: new
      language: python
      code: |
        def total_minutes(ops):
            return sum(op["minutes"] for op in ops)


        ops = [{"minutes": 4}, {"minutes": 6}]
        assert total_minutes(ops) == 10
        print("before the change: assert passed, total_minutes(ops) == 10")


        # Someone later edits total_minutes for an unrelated-sounding reason:
        # skip any operation under 5 minutes, treating it as noise not worth
        # counting.
        def total_minutes(ops):
            return sum(op["minutes"] for op in ops if op["minutes"] >= 5)


        print(f"after the change: total_minutes(ops) = {total_minutes(ops)}")
        assert total_minutes(ops) == 10, "regression: total_minutes(ops) no longer == 10"
    updated_project:
      applicable: false
    mechanical_walkthrough:
      applicable: true
      items:
        - element: 'def total_minutes(ops): return sum(op["minutes"] for op in ops)'
          explanation: >
            The corrected version of `total_minutes` from the previous
            unit's bug, now summing every operation with no slice
            dropping anything; this `def` binds the name
            `total_minutes` to this first function object.
        - element: 'ops = [{"minutes": 4}, {"minutes": 6}]'
          explanation: >
            The same two-operation list as the previous unit, reused
            unchanged as this unit's fixed input, so any difference in
            outcome traces back to the code, not the data.
        - element: 'assert total_minutes(ops) == 10'
          explanation: >
            Calls the current `total_minutes` (still the first version),
            gets `10`, and the condition is `True`, so nothing happens.
            This `assert` carries no message argument - it still works
            exactly the same way on success; it would only matter if it
            ever failed, in which case it would raise a bare
            `AssertionError` with no text.
        - element: 'print("before the change: assert passed, ...")'
          explanation: >
            Only reached because the assert above did not raise; a plain
            string, not an f-string, since nothing here needs to be
            computed.
        - element: 'if op["minutes"] >= 5'
          explanation: >
            A conditional filter added inside the second `def`'s
            generator expression: only operations whose `"minutes"`
            value is `5` or greater get included in the sum at all;
            `>=` is a comparison operator, evaluated once per `op`.
        - element: 'def total_minutes(ops): return sum(op["minutes"] for op in ops if op["minutes"] >= 5)'
          explanation: >
            A brand-new function object, created by a second `def` using
            the identical name `total_minutes`. Per name rebinding, the
            module-level name `total_minutes` now points at this second
            function instead of the first; the first function object
            still exists in memory, but nothing refers to it anymore.
        - element: 'total_minutes(ops) inside the "after the change" f-string'
          explanation: >
            Calls whatever `total_minutes` currently names, which after
            the second `def` is the filtered version. The `4`-minute
            operation fails the `>= 5` filter and gets dropped, so this
            call returns `6`.
        - element: 'assert total_minutes(ops) == 10, "regression: ..."'
          explanation: >
            Calls the rebound name a second time, compares `6 == 10`,
            gets `False`, and raises
            `AssertionError("regression: total_minutes(ops) no longer == 10")`
            - the identical assert *expression* as the earlier one in
            this same file, unedited, now catching a completely
            different bug than the one from the previous unit.
    mental_model:
      applicable: false
    execution_trace:
      applicable: true
      shape: timing
      lines:
        - >
          `def total_minutes(ops): return sum(op["minutes"] for op in ops)`
          - defines the first version and binds the name `total_minutes`
          to it.
        - >
          `assert total_minutes(ops) == 10` - calls the name, which still
          points at the first version; returns `10`; condition `True`;
          nothing happens.
        - >
          `print("before the change: ...")` - only reached because the
          previous step's assert did not raise, confirming the first
          version really did pass.
        - >
          `def total_minutes(ops): return sum(op["minutes"] for op in ops if op["minutes"] >= 5)`
          - a second, brand-new function object is created, and the name
          `total_minutes` is rebound to point at it; the first version's
          object still exists but is no longer reachable by name.
        - >
          `total_minutes(ops)` inside the f-string - calls whatever
          `total_minutes` currently points to, which is now the second
          version; returns `6`, since the `4`-minute operation fails the
          `>= 5` filter.
        - >
          `assert total_minutes(ops) == 10, "regression: ..."` - calls the
          same rebound name again; `6 == 10` is `False`; Python raises
          `AssertionError("regression: total_minutes(ops) no longer == 10")`,
          which is the exact traceback this unit's saved verification
          output shows.
    cs_lens: >
      This is **regression testing**: re-running an old, already-passing
      check against new code to confirm old behavior survived. Also
      recognized in: `git bisect`, which finds exactly which commit
      broke a previously-working case by re-running the same check
      across a range of commits; a continuous-integration pipeline
      blocking a merge because a previously-green check turned red; a
      web browser engine's own regression suite, re-run on every change
      to catch a previously-fixed bug quietly coming back; and, in this
      project's own domain, a First Article Inspection being re-run
      after a process change, specifically to catch a part that used to
      pass inspection quietly failing to anymore.
    se_lens: >
      The design principle is treating a passing check as a permanent
      asset that keeps earning its value on every future change, not a
      one-time box ticked off and forgotten. The real alternative
      already in use in this project is relying on someone downstream -
      a CAM programmer, a machine operator - to notice a wrong number
      after the fact. The honest cost of that alternative: by the time a
      human notices, the broken version has already shipped, and tracing
      the wrong number back to the specific edit that caused it takes far
      longer than an `assert` failing immediately, at the exact line, the
      moment it happens. The honest cost on the other side: keeping the
      `assert` around forever only pays off if it keeps getting re-run -
      a check nobody ever runs again provides exactly the same protection
      as no check at all.
