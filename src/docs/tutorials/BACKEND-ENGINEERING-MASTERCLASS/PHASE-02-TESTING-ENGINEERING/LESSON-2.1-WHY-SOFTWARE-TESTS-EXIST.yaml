        across three different implementations of `total_minutes` - one
        baseline, one genuine refactor, and one that only looks safe:
      file: verification/phase-02/lab_refactor_safety.py
      status: new
      language: python
      code: |
        def total_minutes(ops):
            return sum(op["minutes"] for op in ops)


        ops = [{"minutes": 4}, {"minutes": 6}]
        assert total_minutes(ops) == 10
        print("before refactor: assert passed, total_minutes(ops) == 10")


        # Refactor 1: same behavior, different internal shape (explicit loop
        # instead of sum() over a generator expression) - a real restructuring,
        # not a rewrite of what it does.
        def total_minutes(ops):
            total = 0
            for op in ops:
                total += op["minutes"]
            return total


        assert total_minutes(ops) == 10
        print("after safe refactor: assert still passed, total_minutes(ops) == 10")


        # Refactor 2: looks like a similarly small, safe-looking change, but
        # actually changes behavior - drops the last operation.
        def total_minutes(ops):
            total = 0
            for op in ops[:-1]:
                total += op["minutes"]
            return total


        print(f"total_minutes(ops) = {total_minutes(ops)}")
        assert total_minutes(ops) == 10, "refactor silently changed behavior"
    updated_project:
      applicable: false
    mechanical_walkthrough:
      applicable: true
      items:
        - element: 'def total_minutes(ops): return sum(op["minutes"] for op in ops)'
          explanation: >
            The original, already-correct baseline this unit starts
            from, identical in behavior to the fixed version used in the
            earlier units.
        - element: 'assert total_minutes(ops) == 10 / print("before refactor: ...")'
          explanation: >
            Establishes that the baseline genuinely passes before any
            restructuring begins - the same before-confirmation pattern
            used in the regression unit.
        - element: 'total = 0'
          explanation: >
            A plain variable assignment, initializing an accumulator to
            the integer `0` - standing in for what `sum`'s own hidden
            `start=0` was doing implicitly in the generator-based
            version.
        - element: 'for op in ops:'
          explanation: >
            An ordinary `for` loop over the full `ops` list, with no
            slice this time, binding `op` to each dict in turn.
        - element: 'total += op["minutes"]'
          explanation: >
            An augmented-assignment operator, `+=`, equivalent to
            `total = total + op["minutes"]`: reads this `op`'s
            `"minutes"` value and adds it into the running `total`.
        - element: 'return total (second def)'
          explanation: >
            Hands back the accumulated value once the loop finishes; the
            second `def total_minutes` rebinds the name again - the same
            name-rebinding mechanism from the regression unit, here used
            to model a genuine, behavior-preserving refactor instead of
