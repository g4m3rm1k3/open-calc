  - title: "Refactoring Safety - Restructuring Without Guessing"
    problem: >
      This curriculum's own stated method is to characterize an
      existing implementation with a real test first, then build a
      better version that passes that same test. Given everything shown
      so far in this lesson, why does the test have to come first - why
      not restructure the code first and check the result afterward?
