number: "2.4"
title: "Test Isolation"
path_note: >
  File paths under backend/... refer to the real manufacturing-platform
  repository. Paths under verification/... refer to that same
  repository's verification folder.

what_you_will_build: >
  A real, deliberately broken pair of tests that interfere with each
  other through one shared database, fixed by changing nothing but a
  fixture's own scope; a real, six-times-run demonstration of a
  genuinely flaky test next to a real, seeded fix that stays consistent
  across the same number of real runs; and a real proof that this
  project's own safe-for-testing app config still leaves file storage
  pointed at a real, permanent, already-populated directory in the real
  repository.

what_you_need_to_know_first: >
  What a fixture is and how pytest injects one into a test by name; what
  a unit test, an integration test, and a system test each check; what
  pytest's own assertion rewriting shows on a real failure.

terms:
  - name: shared state
    definition: >
      Data or a resource more than one test can read or write, where a
      value one test leaves behind can affect another test's own
      outcome. It exists to name exactly the property that makes two
      tests fail to be independent - not shared *code* (which is fine),
      but a shared, mutable, persisted resource sitting between them.
  - name: independent tests
    definition: >
      Tests whose outcome does not depend on whether, or in what order,
      any other test has already run. It exists because a suite where
      tests quietly depend on each other's side effects can pass or fail
      differently purely based on run order - a property invisible from
      reading any single test's own body in isolation.
  - name: deterministic test
    definition: >
      A test that, given the same real code, produces the same real
      result every single time it runs - regardless of when, how many
      times, or in what order it runs. It exists because a test whose
      result depends on something outside anyone's control (the current
      time, an unseeded random number, unordered iteration) cannot
      reliably distinguish "this broke" from "this was never guaranteed
      to begin with."
  - name: flaky test
    definition: >
      A real test that sometimes passes and sometimes fails against the
      exact same, completely unchanged code - the directly observable
      symptom of a test that isn't deterministic. It exists as the
      practical, felt cost of non-determinism: once a team stops
      trusting one test's own failure to mean something real, trust in
      the whole suite erodes with it.
  - name: temporary resource
    definition: >
      A real file, directory, or other durable resource created
      specifically for one test's own use and safely removed afterward,
      so nothing the test needed to run leaves anything permanent
      behind. It exists so tests that must do real I/O can still avoid
      the two real risks permanent test resources create: polluting
      real, permanent state, and leftover files quietly affecting a
      later run.
  - name: fixture scope
    definition: >
      How many times, and shared across how many tests, a fixture's own
      setup actually runs before being torn down - `function` (the
      default: fresh for every single test), `module` (once per file),
      `session` (once for a whole real run), among others. It exists
      because a fixture's own scope is the exact, real lever deciding
      whether two tests sharing it stay isolated from each other or not.
  - name: random seed
    definition: >
      A starting value handed to a pseudo-random number generator that
      makes its entire future sequence of "random" values fully
      reproducible - the same seed always produces the same sequence. It
      exists so code that genuinely needs randomness can still be tested
      deterministically, by controlling the one input that would
      otherwise make its output different every time.

objects_and_methods:
  - name: pytest.fixture(scope=...)
    what_it_is: >
      The same real `pytest.fixture` decorator from an earlier lesson,
      now used with its real `scope` keyword argument.
    implementation: >
      `@pytest.fixture(scope="module")` - accepts a real string
      (`"function"`, the default; `"module"`; `"class"`; `"session"`,
      among others) controlling how many real tests share one call to
      the fixture function before pytest tears it down and calls it
      again.
    its_use: >
      This lesson uses `scope="module"` first, deliberately, to make two
      tests share one real app and one real database - then removes it,
      returning to the bare `@pytest.fixture` default, to fix the exact
      same two tests.
    type: A decorator, called with a keyword argument, from the `pytest` package.
    responsibility: >
      Controlling a fixture's own real lifetime - how long its setup
      stays valid, and how many real tests reuse that same setup before
      pytest builds a fresh one.
    depends_on: A function definition to decorate; an optional `scope` string.
    connects_to: >
      Applied to this lesson's own `shared_app` fixture in its first,
      broken form; the second, fixed form drops the argument entirely,
      returning to the same bare `@pytest.fixture` an earlier lesson
      already used.
    shape: >
      Decorates one function; the real difference `scope` makes is
      entirely in *when* pytest calls that function again, never in
      what the function itself returns or yields.

  - name: Query (Machine.query / .count())
    what_it_is: >
      SQLAlchemy's real query interface, reached through a model class's
      own `.query` attribute.
    implementation: >
      `Machine.query` returns a real SQLAlchemy `Query` object scoped to
      the `machines` table; `.count()` is a real method on that object,
      issuing a real `SELECT COUNT(*)`-shaped query and returning a
      plain integer.
    its_use: >
      This lesson uses `Machine.query.count()` to check, directly and
      numerically, exactly how many real rows exist in the database at a
      given moment - the precise question shared state either answers
      correctly or doesn't.
    type: >
      A class-level attribute (`Machine.query`) returning an object
      (`Query`), with `.count()` as a real instance method on that
      object.
    responsibility: >
      Letting real Python code ask real questions about a table's real
      current contents without writing raw SQL by hand.
    depends_on: >
      A live database connection and an active `app.app_context()`
      - the same real requirements every database-touching lab in this
      curriculum has needed since it was first introduced.
    connects_to: >
      Called directly inside both of this unit's real test functions,
      in both the broken and fixed versions - the only thing that
      differs between the two versions is what value it actually
      returns.
    shape: >
      Takes nothing in beyond the query already built; returns one plain
      `int` out - never a list of rows, never `None`.

  - name: create_app
    what_it_is: This project's real Flask application factory function.
    implementation: >
      `def create_app(config_name: str = None) -> Flask:`
      (`backend/app/__init__.py:172`) - builds a `Flask` instance, loads
      one of `config.py`'s real config classes by name, and initializes
      SQLAlchemy, among other real setup steps.
    its_use: >
      This lesson calls it with `"testing"` inside every fixture it
      builds, and separately uses it to prove a real gap in what that
      config name actually isolates.
    type: A module-level factory function (the Factory design pattern).
    responsibility: >
      Producing one fully-configured, ready-to-use `Flask` application
      object from a bare config name.
    depends_on: >
      A config name string; with `"testing"`, real evidence in this
      lesson's own last unit shows it overrides
      `SQLALCHEMY_DATABASE_URI` but leaves `UPLOAD_FOLDER` completely
      untouched.
    connects_to: >
      Called inside every fixture this lesson defines; its real,
      returned `app.config` is inspected directly in this lesson's own
      temporary-resources unit.
    shape: >
      Takes one optional string in, returns one fully-built `Flask`
      object out.

  - name: random (seed / random)
    what_it_is: >
      Python's own standard library `random` module, providing a real
      pseudo-random number generator.
    implementation: >
      `random.random() -> float` returns a real pseudo-random value in
      `[0.0, 1.0)`, drawing from the module's own internal, shared
      generator state; `random.seed(value)` resets that shared state so
      every subsequent call to `random.random()` (or any other function
      in the module) produces a fully reproducible sequence from that
      point on.
    its_use: >
      This lesson calls `random.random()` with no seed to build a
      genuinely, really flaky test, then calls `random.seed(42)` twice
      in a row, immediately before two separate calls to
      `random.random()`, to prove the exact same value comes back both
      times.
    type: A standard library module; `random` and `seed` are both real functions inside it.
    responsibility: >
      Providing real pseudo-randomness by default, while still allowing
      that randomness to be made fully reproducible on demand.
    depends_on: >
      Nothing, for `random()`; one real seed value (any hashable
      object), for `seed()`.
    connects_to: >
      `random.random()` alone drives this lesson's flaky-test
      demonstration; `random.seed()` immediately before it is what turns
      the same underlying call deterministic in the fix that follows.
    shape: >
      `random.random()` takes nothing in, returns one `float` out;
      `random.seed()` takes one value in, returns nothing (`None`).

  - name: tempfile.TemporaryDirectory
    what_it_is: >
      A real class from Python's standard library `tempfile` module,
      used as a context manager to create and automatically remove a
      real, temporary directory on disk.
    implementation: >
      `tempfile.TemporaryDirectory()` creates one real, uniquely-named
      directory (this session, under this machine's own real temp
      folder) the moment it's constructed; used in a `with` block, it
      yields that real directory's path as a string, and deletes the
      entire directory - and everything written into it - the moment
      the `with` block exits, even if an exception occurred inside it.
    its_use: >
      This lesson uses it to give a real file-writing check somewhere
      real to write to, without ever touching this project's own real,
      permanent `backend/uploads` directory.
    type: A class, used as a context manager (via Python's `with` statement).
    responsibility: >
      Guaranteeing that a real, temporary directory used for exactly one
      block of code is genuinely gone afterward - not "probably cleaned
      up by a script remembering to delete it," but automatic, even on
      an error.
    depends_on: >
      A real, writable filesystem location for temporary files (this
      session, resolved to a path under this machine's own
      `AppData\Local\Temp`).
    connects_to: >
      Entered with `with tempfile.TemporaryDirectory() as tmp_dir:` in
      this lesson's own lab; `tmp_dir` is then assigned directly onto
      `app.config["UPLOAD_FOLDER"]`, real
      code this project already has (`cam_import_service.py:65`) reads
      from.
    shape: >
      Yields one real directory path (a string) inside its `with` block;
      returns nothing once that block exits - the directory itself is
      gone, not just the reference to it.

concept_units:
  - title: "Shared State - When Tests Quietly Interfere"
    problem: >
      This project already has a real, existing example of this problem
      at its most serious: `backend/test_schema.py`'s `test_xml_import`
      deletes and inserts real rows against whatever real database
      `create_app()`'s default happens to point at, every single time it
      runs. Two tests sharing one real database, without either one
      cleaning up after itself, is exactly this failure - built here at
      a small, safe scale to see precisely how it happens.
    socratic_prompt:
      - >
        If two tests share the exact same real database connection, and
        the first one inserts a row, what should the second one see when
        it queries that same table - and does the honest answer depend
        on which one happens to run first?
      - >
        Given `@pytest.fixture(scope="module")` versus the bare
        `@pytest.fixture` an earlier lesson already used, what real
        difference do you expect in how many times the fixture function
        itself actually runs, across two tests that both request it?
    project_change:
      reference_source: >
        No reference counterpart for this unit's own throwaway code.
        Real, already-existing evidence of this exact failure, at full
        scale: `backend/test_schema.py:15-30` (`test_xml_import`), read
        again this session - it deletes from `Operation`, `Sequence`,
        `CAMFile`, `Part`, and `Machine` before inserting new rows, with
        no isolation between one run and the next at all.
      files_affected: []
      change_type: none
      location: >
        N/A - a new, standalone file; no existing project structure to
        place it within.
      dependencies: >
        pytest, already installed in this project's backend virtual
        environment.
    new_code:
      applicable: true
      intro: >
        One real database, shared across two tests on purpose, via a
        module-scoped fixture:
      file: verification/phase-02/lab_pytest_demo/shared_state_problem_lab.py
      status: new
      language: python
      code: |
        import sys
        sys.path.insert(0, "backend")

        import pytest
        from app import create_app, db
        from app.models.machine import Machine


        @pytest.fixture(scope="module")
        def shared_app():
            app = create_app("testing")
            with app.app_context():
                yield app


        def test_a_inserts_a_machine(shared_app):
            machine = Machine(id="M-SHARED-001", name="Shared Mill", category="mill", sub_type="3_axis")
            db.session.add(machine)
            db.session.commit()
            assert Machine.query.count() == 1


        def test_b_expects_a_clean_database(shared_app):
            assert Machine.query.count() == 0
    updated_project:
      applicable: false
    mechanical_walkthrough:
      applicable: true
      items:
        - element: '@pytest.fixture(scope="module")'
          explanation: >
            Registers `shared_app` as a fixture, but with its scope set
            to `"module"` instead of the default - pytest will call this
            function only *once* for every test in this file that
            requests it, not once per test.
        - element: 'def shared_app(): app = create_app("testing") ... yield app'
          explanation: >
            The identical real setup an earlier lesson's own fixture
            used - a real app, a real in-memory database, entered inside
            `app.app_context()` - but because of `scope="module"` above,
            this whole block runs exactly once for this entire file, not
            once per test.
        - element: 'def test_a_inserts_a_machine(shared_app): ... assert Machine.query.count() == 1'
          explanation: >
            Inserts one real `Machine` row and confirms, via
            `Machine.query.count()`, that exactly one row exists - true,
            and passes, because this is the first test to touch this
            shared database.
        - element: 'def test_b_expects_a_clean_database(shared_app): assert Machine.query.count() == 0'
          explanation: >
            A second, separate test, also requesting `shared_app` -
            because the fixture is module-scoped, pytest hands it the
            *same* app and database `test_a_inserts_a_machine` already
            used, not a fresh one; this test's own expectation of a
            clean, empty database is honest, but wrong, given what the
            fixture's own real scope actually guarantees.
    mental_model:
      applicable: false
    execution_trace:
      applicable: true
      shape: timing
      lines:
        - >
          pytest collects both tests in this file, sees both name
          `shared_app`, and calls the fixture function once, because its
          scope is `"module"`.
        - >
          `test_a_inserts_a_machine` runs first (real, in-file order),
          inserts a real `Machine` row into the one shared database, and
          its own `assert Machine.query.count() == 1` passes.
        - >
          `test_b_expects_a_clean_database` runs next, requests
          `shared_app` again - pytest does **not** call the fixture
          function a second time; it hands back the exact same app and
          database from the first test, row and all.
        - >
          `assert Machine.query.count() == 0` runs against that same,
          already-populated database, finds one real row, and fails -
          not because anything about `test_b_expects_a_clean_database`'s
          own code is wrong, but because the database it was handed was
          never actually clean.
    cs_lens: >
      This is **shared mutable state**, one of the oldest, most general
      sources of bugs in all of software - two things reading and
      writing the same resource with no coordination between them. Also
      recognized in: race conditions between threads sharing a variable
      with no lock; two browser tabs both writing to the same
      `localStorage` key; a CI pipeline's cache directory carrying stale
      artifacts from a previous, unrelated build into the current one;
      and, in this project's own domain, two operators editing the same
      real `Machine` row's status from two different terminals with no
      coordination, each unaware of the other's change.
    se_lens: >
      The design principle is that a fixture's own scope is a real,
      deliberate decision about isolation, not a default to leave
      unexamined. The real alternative this unit deliberately used first
      - a module-scoped fixture, sharing one real database across every
      test in the file - has an honest upside: it only pays the real
      cost of building an app and a database once per file, not once per
      test, which matters when that cost is real and measured (an
      earlier lesson's own numbers put it at several hundred
      milliseconds). The honest cost, proven directly by this unit's own
      real, failing run: any test sharing that scope can see every
      earlier test's own leftover state, whether either author intended
      that or not - exactly the same shape of problem
      `test_xml_import`'s own real, unisolated deletes and inserts
      already have, at a scale this project actually runs against.
    commands:
      - command: backend/.venv/Scripts/python.exe -m pytest verification/phase-02/lab_pytest_demo/shared_state_problem_lab.py -v
        explanation: >
          Runs this one file under pytest explicitly, by its real path -
          named without a `test_` prefix on purpose, so this
          deliberately-failing demonstration is never picked up by a
          directory-wide discovery run.
    verification:
      applicable: true
      real_output: |
