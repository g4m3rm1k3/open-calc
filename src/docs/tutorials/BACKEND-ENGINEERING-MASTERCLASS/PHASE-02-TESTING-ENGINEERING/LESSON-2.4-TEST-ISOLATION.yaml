      `test_xml_import` already has at full, destructive scale.

  - title: "Independent Tests - Real Isolation, Proven"
    problem: >
      The previous unit's own two tests are not wrong in what they
      check - only in what they were handed to check it against. What
      happens if neither test's own body changes at all, and only the
      fixture's real scope changes back?
    socratic_prompt:
      - >
        Before reading the real output below: if the only change from
        the previous unit is removing `scope="module"` from the fixture
        decorator, do you expect both tests to pass, both to fail, or
        one of each?
      - >
        What does the previous unit's failure, combined with this unit's
        real fix, actually prove about where the bug lived - in the
        tests' own logic, or somewhere else entirely?
    project_change:
      reference_source: >
        No reference counterpart - this unit's own code is the previous
        unit's identical two test bodies, unedited, with only the
        fixture's own decorator changed.
      files_affected: []
      change_type: none
      location: >
        N/A - a new, standalone file; no existing project structure to
        place it within.
      dependencies: >
        pytest, already installed in this project's backend virtual
        environment.
    new_code:
      applicable: true
      intro: >
        The identical two tests, with the fixture's scope removed -
        back to the default:
      file: verification/phase-02/lab_pytest_demo/test_independent_tests_fix.py
      status: new
      language: python
      code: |
        import sys
        sys.path.insert(0, "backend")

        import pytest
        from app import create_app, db
        from app.models.machine import Machine


        @pytest.fixture
        def app():
            app = create_app("testing")
            with app.app_context():
                yield app


        def test_a_inserts_a_machine(app):
            machine = Machine(id="M-SHARED-001", name="Shared Mill", category="mill", sub_type="3_axis")
            db.session.add(machine)
            db.session.commit()
            assert Machine.query.count() == 1


        def test_b_expects_a_clean_database(app):
            assert Machine.query.count() == 0
    updated_project:
      applicable: false
    mechanical_walkthrough:
      applicable: true
      items:
        - element: '@pytest.fixture (no scope argument)'
          explanation: >
            The bare decorator, with no `scope` at all - by pytest's own
            default, this means `scope="function"`: a fresh call to this
            fixture function for every single test that requests it,
            with nothing shared between them.
        - element: 'def app(): app = create_app("testing") ... yield app'
          explanation: >
            The exact same setup code as the previous unit's
            `shared_app`, only renamed back to `app` - the real behavior
            difference here comes entirely from the missing `scope`
            argument above, not from anything in this function's own
            body.
        - element: 'def test_a_inserts_a_machine(app): ... assert Machine.query.count() == 1'
          explanation: >
            Identical to the previous unit's version, word for word;
            inserts one real row into its own fresh, private database
            and confirms it, and passes for the same reason as before.
        - element: 'def test_b_expects_a_clean_database(app): assert Machine.query.count() == 0'
          explanation: >
            Also identical to the previous unit's version, word for
            word - but this time, because `app` is function-scoped,
            pytest calls the fixture fresh for this test, handing it a
            brand-new, genuinely empty in-memory database that has never
            seen `test_a_inserts_a_machine`'s row at all. The exact same
            assertion that failed before now passes, honestly.
    mental_model:
      applicable: false
    execution_trace:
      applicable: true
      shape: timing
      lines:
        - >
          pytest collects both tests, sees both name `app`, and - because
          this fixture carries no `scope` argument - calls the fixture
          function fresh, separately, for each one.
        - >
          `test_a_inserts_a_machine` runs against its own private,
          fresh database, inserts a row, and passes.
        - >
          `test_b_expects_a_clean_database` runs against a *second*,
          completely separate fresh database, built by a second, real
          call to the `app` fixture - one that has never heard of the
          first test's row.
        - >
          Both tests report PASSED - the same two `assert` statements,
          unedited, now both honestly true, because each one is finally
          being checked against what it always assumed it would get: a
          clean database of its own.
    cs_lens: >
      This is **test isolation** demonstrated directly, not just
      defined: the exact same assertions, the exact same data, with only
      the *boundary* around what's shared changed. Also recognized in:
      a database transaction rolled back after every test instead of
      committed; a container spun up fresh per CI job instead of reused
      across builds; a virtual machine snapshot restored before every
      automated run; and, in this project's own domain, every real
      machine on the shop floor running its own program from its own
      controller's own memory, with no shared state between one
      machine's run and another's.
    se_lens: >
      The design principle is that isolation should be the default an
      author has to deliberately opt out of, not something they have to
      remember to opt into. pytest's own real default - `scope="function"`
      - embodies exactly that: writing a fixture with no scope argument
      at all, as an earlier lesson already did without even naming the
      concept, already gets this right by default. The real alternative
      this lesson's own previous unit chose on purpose -
      `scope="module"` - is not wrong in general; it is a real, honest
      tradeoff between real speed (paying setup cost once per file
      instead of once per test) and real safety (one test's own leftover
      state becoming another test's problem). Choosing it requires
      knowing, and accepting, exactly that tradeoff - not reaching for
      it as a default and discovering the cost later, the way this
      lesson's own previous unit did on purpose to prove the point.
    commands:
      - command: backend/.venv/Scripts/python.exe -m pytest verification/phase-02/lab_pytest_demo/test_independent_tests_fix.py -v
        explanation: >
          Runs both tests under pytest, from the repository root.
