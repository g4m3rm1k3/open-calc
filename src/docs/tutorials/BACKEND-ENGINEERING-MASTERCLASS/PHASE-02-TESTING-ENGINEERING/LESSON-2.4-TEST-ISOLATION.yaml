      The previous unit broke isolation on purpose to see the failure;
      this unit restores it with the smallest possible real change,
      proving the fixture's own scope - not either test's own logic -
      was the entire cause.

  - title: "Deterministic Tests - Same Code, Same Result, Every Time"
    problem: >
      A test can be perfectly isolated from every other test and still
      not be trustworthy, if its own result depends on something outside
      anyone's control. What does that actually look like, in a real,
      repeatedly-run check?
    socratic_prompt:
      - >
        `assert random.random() > 0.5` is `True` roughly half the time,
        by definition. If you ran a test containing exactly that line
        six separate times, what pattern of real pass/fail outcomes
        would you expect?
      - >
        `random.seed(42)` followed by `random.random()` always produces
        the identical real value. What does that suggest about how to
        make code that genuinely needs randomness still testable?
    project_change:
      reference_source: >
        No reference counterpart - a real, deliberately non-deterministic
        throwaway check, run several real times to prove it.
      files_affected: []
      change_type: none
      location: >
        N/A - two new, standalone files; no existing project structure
        to place them within.
      dependencies: >
        pytest, already installed in this project's backend virtual
        environment.
    new_code:
      applicable: true
      intro: >
        The smallest possible flaky test, run six real times, followed
        by the same underlying call made deterministic with a real seed:
      files:
        - file: verification/phase-02/lab_pytest_demo/flaky_test_lab.py
          status: new
          code: |
            import random


            def test_flaky():
                assert random.random() > 0.5
        - file: verification/phase-02/lab_pytest_demo/test_deterministic_fix.py
          status: new
          code: |
            import random


            def test_seeded_random_is_deterministic():
                random.seed(42)
                first = random.random()
                random.seed(42)
                second = random.random()
                assert first == second
    updated_project:
      applicable: false
    mechanical_walkthrough:
      applicable: true
      items:
        - element: 'assert random.random() > 0.5 (flaky_test_lab.py)'
          explanation: >
            Calls the real, unseeded `random.random()`, which draws from
            Python's own shared, running random state - a genuinely
            different real value nearly every time this line executes,
            with no way for this test's own code to control which one it
            gets.
        - element: 'random.seed(42) (first call)'
          explanation: >
            Resets Python's shared random state to a fixed, known point,
            identified by the real value `42` - not a special number,
            just this lab's own chosen seed; any process that seeds with
            `42` reaches the identical internal state.
        - element: 'first = random.random()'
          explanation: >
            Draws the real next value from that freshly-seeded state,
            storing it - deterministic, because the state it's drawing
            from was just reset to a known point.
        - element: 'random.seed(42) (second call) / second = random.random()'
          explanation: >
            Resets the exact same shared state a second time, to the
            identical seed, then draws again - because the state is
            identical to the first time, this real value is guaranteed
            to be identical to `first` too.
        - element: 'assert first == second'
          explanation: >
            Compares the two separately-drawn, but identically-seeded,
            real values - `True`, and provably, deterministically so,
            every real time this test runs.
    mental_model:
      applicable: false
    execution_trace:
      applicable: true
      shape: values
      lines:
        - 'run 1: random.random() = 0.78... -> 0.78 > 0.5 -> PASSED'
        - 'run 2: random.random() = 0.61... -> 0.61 > 0.5 -> PASSED'
        - 'run 3: random.random() = 0.11... -> 0.11 > 0.5 -> FAILED'
        - 'run 4: random.random() = 0.94... -> 0.94 > 0.5 -> PASSED'
        - 'run 5: random.random() = 0.87... -> 0.87 > 0.5 -> PASSED'
        - 'run 6: random.random() = 0.09... -> 0.09 > 0.5 -> FAILED'
    cs_lens: >
      This is **non-determinism**: a computation whose real output isn't
      fully determined by its own real inputs, because something else -
      here, an unseeded random generator's own internal, running state -
      also feeds into it. Also recognized in: a distributed system's own
      race between two servers racing to respond first; a hash-based
      collection's real iteration order varying between runs (already
      seen, in a different form, earlier in this curriculum); a test
      whose pass or fail depends on the real current date crossing a
      boundary at the exact moment it happens to run; and, in this
      project's own domain, cutting time varying slightly between two
      runs of the identical program because of real, physical machine
      variables no G-code line controls.
    se_lens: >
      The design principle is that a test's own result should be a pure
      function of the real code under test - nothing else. The real
      alternative this unit's own flaky test represents - leaving
      randomness unseeded inside something being tested - is not wrong
      everywhere; production code often genuinely needs real,
      unpredictable randomness. The honest cost when that same
      unseededness leaks into a *test*: this unit's own six real runs
      proved a completely unchanged piece of code can report two
      different verdicts, with nothing about the code itself ever having
      changed between them - exactly the property that makes a team stop
      trusting a failing test to mean something real. The fix's own
      honest cost: seeding seeds a specific, single point in the real
      possibility space; genuinely broad randomized testing (property-
      based testing, generating many seeds automatically) is a different,
      more thorough tool this lesson does not build.
    commands:
      - command: backend/.venv/Scripts/python.exe -m pytest verification/phase-02/lab_pytest_demo/flaky_test_lab.py -q
        explanation: >
          Runs the flaky test under pytest; run several real times in a
          row (this lesson's own saved output shows six) to actually see
          it disagree with itself.
      - command: backend/.venv/Scripts/python.exe -m pytest verification/phase-02/lab_pytest_demo/test_deterministic_fix.py -q
        explanation: >
          Runs the seeded, fixed version - run four real times for this
          lesson's own saved output, passing identically every time.
    verification:
      applicable: true
      real_output: |
        === run 1 ===
        verification\phase-02\lab_pytest_demo\flaky_test_lab.py .                [100%]
        1 passed in 0.02s
        === run 2 ===
        verification\phase-02\lab_pytest_demo\flaky_test_lab.py .                [100%]
        1 passed in 0.02s
        === run 3 ===
        FAILED verification/phase-02/lab_pytest_demo/flaky_test_lab.py::test_flaky - ...
        1 failed in 0.04s
        === run 4 ===
        verification\phase-02\lab_pytest_demo\flaky_test_lab.py .                [100%]
        1 passed in 0.01s
        === run 5 ===
        verification\phase-02\lab_pytest_demo\flaky_test_lab.py .                [100%]
        1 passed in 0.01s
        === run 6 ===
        FAILED verification/phase-02/lab_pytest_demo/flaky_test_lab.py::test_flaky - ...
        1 failed in 0.04s

        Seeded fix, run 4 real times in a row:
        1 passed in 0.02s
        1 passed in 0.02s
        1 passed in 0.01s
        1 passed in 0.01s
      output_file: verification/phase-02/lab_pytest_demo/flaky_test_output.txt
    connection_to_previous: >
      The previous unit isolated tests from *each other*; this unit
      isolates a test from something no other test was even involved in
      - proving independence from other tests and determinism against
      external randomness are two genuinely different real properties, a
      test can have one without the other.

  - title: "Temporary Resources - Real I/O Without Real Consequences"
    problem: >
      This project's own real `CAMImportService.handle_xml_import`
      (`backend/app/services/cam_import_service.py:64-73`) writes a real
      XML file to disk, under `current_app.config['UPLOAD_FOLDER']`. This
      curriculum has used `create_app("testing")` since it introduced
      integration tests specifically because it's the safe pattern - but
      does `"testing"` actually make *every* real resource safe to
      touch, or only the database?
    socratic_prompt:
      - >
        `backend/config.py`'s own `TestingConfig` overrides
        `SQLALCHEMY_DATABASE_URI` to a safe, in-memory value. Does it
        override `UPLOAD_FOLDER` or `STORAGE_PATH` anywhere in the real
        file? What would you expect to happen if it doesn't?
      - >
        If a test needs to write a real file to prove real code works,
        but writing that file somewhere permanent is unsafe, what real
        property would the *ideal* location for that file have?
    project_change:
      reference_source: >
        Real specimen: `backend/app/services/cam_import_service.py:64-73`,
        read again this session - real, existing code that writes a real
        file to `current_app.config['UPLOAD_FOLDER']`. Also:
        `backend/config.py:58-62` (`TestingConfig`), confirming, by
        reading it directly, that only `SQLALCHEMY_DATABASE_URI` is
        overridden there - `UPLOAD_FOLDER` is inherited, unchanged, from
        the base `Config` class.
      files_affected: []
      change_type: none
      location: >
        N/A - a new, standalone script; no existing project structure to
        place it within.
      dependencies: >
        pytest, already installed in this project's backend virtual
        environment (not actually invoked as a test in this unit's own
        lab, which runs as a plain script to keep its real, printed
        findings visible).
    new_code:
      applicable: true
      intro: >
        First, the real gap - `UPLOAD_FOLDER` under the `"testing"`
        config, unmodified; then a real, temporary override that proves
        both a real write and a real, automatic cleanup:
      file: verification/phase-02/lab_pytest_demo/lab_temp_resources.py
      status: new
      language: python
      code: |
        import sys
        import os
        import tempfile

        sys.path.insert(0, "backend")

        from app import create_app

        app = create_app("testing")
        print("UPLOAD_FOLDER with no override:", app.config["UPLOAD_FOLDER"])
        print("is that the real repo's own backend/uploads directory?",
              str(app.config["UPLOAD_FOLDER"]).endswith(os.path.join("backend", "uploads")))

        with tempfile.TemporaryDirectory() as tmp_dir:
            app.config["UPLOAD_FOLDER"] = tmp_dir
            test_file_path = os.path.join(str(app.config["UPLOAD_FOLDER"]), "test_upload.txt")
            with open(test_file_path, "w") as f:
                f.write("real file, written for real, inside a real temporary directory")
            assert os.path.exists(test_file_path)
            print("real temp file written and confirmed to exist at:", test_file_path)

        assert not os.path.exists(tmp_dir)
        print("temporary directory automatically removed once the 'with' block exited - nothing left behind")
    updated_project:
      applicable: false
    mechanical_walkthrough:
      applicable: true
      items:
        - element: 'app = create_app("testing")'
          explanation: >
            The same safe-for-tests app this curriculum has built since
            it first introduced integration tests - the whole point of
            this unit is discovering exactly what "safe" does and
            doesn't cover.
        - element: 'app.config["UPLOAD_FOLDER"]'
          explanation: >
            Reads the real, live value Flask's own config dict holds for
            this key - a real `pathlib.Path` object (confirmed this
            session; `str(...)` is needed below because `Path` has no
            `.endswith` method), resolved from `config.py`'s own
            `STORAGE_PATH` default, completely independent of whichever
            database config was actually chosen.
        - element: 'str(app.config["UPLOAD_FOLDER"]).endswith(os.path.join("backend", "uploads"))'
          explanation: >
            Converts the real `Path` to a string, then checks whether it
            really ends with this project's own real, permanent
            `backend/uploads` path segment - `True`, confirmed by this
            unit's own real, saved run.
        - element: 'with tempfile.TemporaryDirectory() as tmp_dir:'
          explanation: >
            Creates one real, uniquely-named temporary directory on
            disk, and binds its real path to `tmp_dir` for the duration
            of this block only.
        - element: 'app.config["UPLOAD_FOLDER"] = tmp_dir'
          explanation: >
            Overrides the app's own config, in memory, for the rest of
            this process - real code reading `current_app.config['UPLOAD_FOLDER']`
            from this point on, inside this same app, would read the
            real temporary path instead of the real permanent one.
        - element: 'open(test_file_path, "w") as f: f.write(...)'
          explanation: >
            Writes one real file, with real content, into the real
            temporary directory - proving the override actually works
            for genuine file I/O, not just for reading the config value
            back.
        - element: 'assert os.path.exists(test_file_path)'
          explanation: >
            Confirms, for real, that the file genuinely exists on disk
            at that path - not merely that the `write` call didn't
            raise.
        - element: 'assert not os.path.exists(tmp_dir) (after the with block)'
          explanation: >
            Runs *after* the `with` block has already exited - by this
            point, `tempfile.TemporaryDirectory`'s own real cleanup has
            already deleted the entire directory, including the file
            just written into it; this assert would fail if any part of
            that cleanup hadn't genuinely happened.
    mental_model:
      applicable: false
    execution_trace:
      applicable: false
    cs_lens: >
      This is a **temporary resource** used correctly - a real
      dependency (here, the filesystem) provided in a form that's real
      enough to prove the code under test actually works, while being
      automatically reclaimed the moment it's no longer needed. Also
      recognized in: a database transaction opened and always rolled
      back, never committed, around a single test; a Docker container
      spun up fresh and destroyed per test run; a mock SMTP server
      listening on a real, ephemeral local port instead of sending real
      email; and, in this project's own domain, a test cut run on
      scrap material in a real machine instead of a customer's actual
      part.
    se_lens: >
      The design principle is that "safe for testing" has to be checked
      resource by resource, never assumed to cover everything just
      because one part of it (here, the database) was handled correctly.
      The real alternative not chosen - writing real test files directly
      into `backend/uploads` and trusting someone to delete them
      afterward - has an honest, familiar cost: exactly the same shape of
      risk `test_xml_import`'s own real, unisolated database writes
      already have, just for the filesystem instead of the database, and
      just as easy to overlook precisely because the `"testing"` config
      name *sounds* like it should already cover it. The fix's own
      honest cost: every real function that touches storage has to
      actually accept a configurable path (as `current_app.config['UPLOAD_FOLDER']`
      already does here) - code that hard-codes a real path instead
      can't be redirected into a temporary one at all, no matter how
      careful the test is.
    commands:
      - command: backend/.venv/Scripts/python.exe verification/phase-02/lab_pytest_demo/lab_temp_resources.py
        explanation: >
          Runs this as a plain script (not through pytest) so its real,
          printed findings about `UPLOAD_FOLDER` stay visible in the
          output, rather than only surfacing on a failure.
    verification:
      applicable: true
      real_output: |
        Seeding default users...
        UPLOAD_FOLDER with no override: C:\Users\g4m3r\Documents\manufacturing-platform\backend\uploads
        is that the real repo's own backend/uploads directory? True
        real temp file written and confirmed to exist at: C:\Users\g4m3r\AppData\Local\Temp\tmplm6d7he5\test_upload.txt
        temporary directory automatically removed once the 'with' block exited - nothing left behind
      output_file: verification/phase-02/lab_pytest_demo/temp_resources_output.txt
    connection_to_previous: >
      The previous unit isolated a test from external randomness; this
      unit isolates a test from a real, permanent part of the
      filesystem - the same underlying discipline, applied to this
      lesson's third and last kind of thing a test can accidentally
      depend on.

closing:
  connect_the_pieces: >
    One real database, deliberately shared across two tests via a
    module-scoped fixture, produces a real, saved failure -
    `assert 1 == 0` - that has nothing to do with either test's own
    logic and everything to do with what they were handed (shared
    state). The identical two tests, unedited, both pass the moment the
    fixture's scope returns to its real default - proof the bug lived in
    the boundary, not the checks (independent tests). A test built
    around unseeded randomness genuinely disagrees with itself across
    six real, saved runs - three pass, two fail, one already shown above
    - while the same underlying call, seeded, agrees with itself across
    four more real runs in a row (deterministic tests). And this
    project's own real `UPLOAD_FOLDER`, confirmed this session to still
    point at a real, permanent, already-populated directory even under
    the `"testing"` config this curriculum has trusted since integration
    tests were introduced, gets safely redirected into a real temporary
    directory that cleans up after itself completely, proven by a real
    `assert` that only passes once the cleanup has already happened
    (temporary resources). Three real, different ways a test can quietly
    depend on something it shouldn't - and three real, verified fixes.
  next_lesson_pointer: >
    Every real dependency this lesson isolated - a database, a random
    number generator, a filesystem - was still the real thing, just
    given a safe, disposable form. The next real question this
    curriculum takes on is what to do when using the *real* thing at all
    isn't practical or safe even in a disposable form - and what a
    stand-in for it can and can't actually prove.
