closing:
  connect_the_pieces: >
    One real `CAMFile`, deleted directly, taking its real, related
    `Sequence` and `NCFile` rows down with it - not because anything in
    this lesson changed that behavior, but because
    `cascade='all, delete-orphan'` was already, correctly declared,
    proven by two real, permanent tests querying the real database
    directly afterward and finding `None`. And `CAMFile.machine_id`,
    the one real foreign key on this table that wasn't already indexed
    like its sibling `part_id`, now is - proven by a real `EXPLAIN QUERY
    PLAN` changing from `SCAN cam_files` to a real `SEARCH`. The full,
    real backend suite - 44 tests - still passes.
  next_lesson_pointer: >
    This lesson proved one real parent-child cascade already works
    correctly. Next, this curriculum goes one level deeper into the
    real aggregate this lesson only touched the top of -
    `CAMFile` → `Sequence` → `Operation`, and `CAMFile` → `NCFile`, all
    together.
