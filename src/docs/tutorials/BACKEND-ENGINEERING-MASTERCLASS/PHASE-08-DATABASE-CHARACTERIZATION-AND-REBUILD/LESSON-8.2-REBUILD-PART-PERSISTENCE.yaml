number: "8.2"
title: "Rebuild Part Persistence"
path_note: >
  File paths under backend/... refer to the real manufacturing-platform
  repository. Paths under verification/... refer to that same
  repository's verification folder.

what_you_will_build: >
  A real, permanent characterization test file,
  `backend/tests/test_parts_characterization.py`, pinning the real,
  current behavior of all five `/api/parts` CRUD routes
  (`backend/app/routes/parts.py`) - then a real, permanent rebuild of
  this project's own persistence boundary: deleting
  `backend/app/services/part_service.py` (`PartService`) entirely, a
  real class already proven, in this curriculum's own earlier work, to
  be complete, self-documented as replacing `Part.from_dict`/
  `Part.to_dict`, and imported by zero real routes anywhere. The
  transferable problem: rebuilding a persistence boundary doesn't
  always mean adding structure - sometimes the real, correct rebuild is
  removing a structure that was already never load-bearing, and proving
  that removal changes nothing by running the identical, already-passing
  characterization suite against the app both before and after.

what_you_need_to_know_first: >
  What a characterization test is - a permanent test pinning real,
  current behavior, not a specification; what the five standard CRUD
  HTTP methods (`POST`/`GET`/`PUT`/`DELETE`) conventionally mean; that a
  dead, unused class can still be imported and pass its own unit tests
  while never being called by anything the real application actually
  runs.

terms:
  - name: soft delete
    definition: >
      A real deletion that doesn't remove a row at all - it changes a
      real status field (here, `Part.status` to `'archived'`) so the
      row still genuinely exists and is still genuinely queryable, just
      excluded from whatever real logic treats `'archived'` as
      effectively gone. It exists so real, historical data - past
      parts, their real revisions, whatever real rows reference them -
      isn't actually destroyed by a real delete request, and can be
      restored or audited later.

objects_and_methods:
  - name: "GET/POST/PUT/DELETE /api/parts (routes)"
    what_it_is: >
      Five real, existing Flask view functions in this project's own
      backend (`backend/app/routes/parts.py:18-200`), together forming
      the complete real CRUD surface for `Part` rows.
    implementation: >
      `get_parts` (`:18-55`) lists/filters via real `.filter(...)`
      calls; `get_part` (`:58-75`) fetches one real row by id;
      `create_part` (`:78-133`) validates required fields, checks for a
      real duplicate `part_number`, and calls `Part.from_dict(data)`;
      `update_part` (`:136-175`) mutates real, allowed fields directly
