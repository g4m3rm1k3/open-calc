    cs_lens: >
      This is **dead code elimination**: removing a real, reachable-by-
      name-but-never-called structure entirely, rather than leaving it
      present "in case," once real evidence confirms nothing calls it.
      Also recognized in: a real compiler's own dead-code-elimination
      pass, stripping functions no real call graph path reaches; a real
      linter flagging an unused real import for removal; and, in this
