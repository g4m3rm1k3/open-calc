    se_lens: >
      The design principle is that a rebuild's own real job includes
      removing structure that isn't earning its keep, not only adding
      structure that's missing - and that the real basis for trusting a
      removal like this is exhaustive, static evidence (a real,
      repo-wide search confirming zero importers), not a test suite's
      own pass/fail, since a 32-test suite covering a fraction of an
