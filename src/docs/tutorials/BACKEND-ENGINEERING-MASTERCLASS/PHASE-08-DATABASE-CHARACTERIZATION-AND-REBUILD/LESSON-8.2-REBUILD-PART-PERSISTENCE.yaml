  - title: "Rebuilding the Persistence Boundary - Removing a Real, Dead Layer"
    problem: >
      This project's own real `PartService`
      (`backend/app/services/part_service.py`) already exists, complete,
      and its own docstrings claim to replace `Part.from_dict`/
      `Part.to_dict` - confirmed, in this curriculum's own earlier work,
      to be imported by zero real routes anywhere. What does "rebuild
      the persistence/application boundary" actually mean here, given
      the real routes already work correctly without it?
    socratic_prompt:
      - >
        If a real class has zero real callers anywhere in the
        application, what real, observable difference would deleting it
        entirely make to any real request this lesson's own
        characterization suite just proved works?
      - >
        A real, exhaustive, repo-wide search for `PartService`/
        `part_service` is one real kind of evidence that nothing calls
        it; this lesson's own ten-test characterization suite passing
        afterward is a different, real kind of evidence. Which one
        actually proves nothing in the *entire* application depends on
        this file, and which one only proves these ten, specific,
        already-characterized behaviors still work?
    project_change:
      reference_source: >
        Real specimen: `backend/app/services/part_service.py:1-65`
        (`PartService`, in full) and `backend/app/routes/parts.py:53,
        72,123,130,170,172` (every real `to_dict`/`from_dict` call site
        in that file, calling the model directly), both read again this
        session, and reconfirmed by a fresh, repo-wide search this
        session for `PartService`/`part_service` returning exactly one
        real match: the file's own definition.
      files_affected:
        - path: backend/app/services/part_service.py
          status: new
      change_type: remove
      location: N/A - the entire real file is removed.
      dependencies: >
        The real, exhaustive, repo-wide search already run confirming
        zero real importers - the actual, deterministic basis for this
        removal being safe; this lesson's own first unit's
        already-passing characterization suite, re-run afterward as a
        real, secondary check on the specific behavior it covers, not
        as proof about the rest of the application.
    new_code:
      applicable: false
    updated_project:
      applicable: false
    mechanical_walkthrough:
      applicable: true
      items:
        - element: 'rm backend/app/services/part_service.py'
          explanation: >
            Removes the real file entirely - not commented out, not
            deprecated with a warning, genuinely deleted, since a fresh,
            repo-wide search this session already confirmed nothing
            real depends on it.
        - element: 'python -m pytest backend/tests/ -v (every real file under backend/tests/, not just this lesson''s own new one)'
          explanation: >
            Re-runs every real, permanent test this project currently
            has - 32 total, across `test_health.py`,
            `test_operation_manager.py`, `test_part_model.py`,
            `test_schema_characterization.py`, and this lesson's own
