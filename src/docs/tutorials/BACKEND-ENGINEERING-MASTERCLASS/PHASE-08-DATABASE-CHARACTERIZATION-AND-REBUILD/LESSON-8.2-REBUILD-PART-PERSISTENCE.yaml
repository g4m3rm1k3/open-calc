closing:
  connect_the_pieces: >
    Ten real, permanent tests, `backend/tests/test_parts_characterization.py`,
    pin every one of `/api/parts`'s five real CRUD routes' current
    behavior - a real `201` on create, a real `409` on a duplicate part
    number, a real `404` on a missing id, and, specifically, that
    `DELETE` archives rather than removes a row, confirmed by a real,
    follow-up `GET` still returning `200`. Then, `PartService` - a
    real, complete, self-documented class this curriculum's own earlier
    work already proved has zero real callers - is deleted entirely.
    The real basis for trusting that removal is the exhaustive,
    repo-wide search confirming zero importers - deterministic evidence
    a test suite covering only a fraction of this application's 18
    route files could never provide on its own. The 32-test suite
    passing afterward, all still passing right after the deletion, is a
    real, secondary confirmation that the specific, already-
    characterized behavior it covers is unaffected - not a claim that
    the whole application was verified.
  next_lesson_pointer: >
    This lesson rebuilt a persistence boundary by removing an unused
    layer. Next, this curriculum rebuilds `Machine`'s own persistence,
    where real validation, real relationships, real transactions, and
    real indexes all actually matter to what gets built.
