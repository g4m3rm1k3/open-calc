      `part.status = 'archived'` rather than calling a real `DELETE`.
    its_use: >
      This lesson's own first unit characterizes all five of these real
      routes directly, with real HTTP requests through this project's
      own real `FlaskClient`.
    type: Five real Flask view functions, registered on the real `parts_bp` blueprint.
    responsibility: >
      Together, providing the complete real create/read/update/delete
      surface for `Part` rows over real HTTP - each one independently
      responsible for its own real validation and real response shape.
    depends_on: >
      This project's own real `Part` model; a real, valid `Authorization`
      token, since every one of these five real routes is wrapped in
      `token_required`.
    connects_to: >
      Every one of them calls `Part.from_dict`/`.to_dict()` or real
      `Part.query` methods directly - none of them, confirmed this
      session, ever calls the now-deleted `PartService`.
    shape: >
      Each real route takes a real HTTP request in, returns a real JSON
      response - `{'data': {...}}` or `{'data': [...], 'total': n}` on
      success, `{'error': '...'}` with a real, specific status code on
      failure.

  - name: FlaskClient (.post / .get / .put / .delete)
    what_it_is: >
      This project's own real `app.test_client()` return value, already
      used throughout this curriculum, and four of its real HTTP-verb
      methods used together for the first time in this lesson.
    implementation: >
      `client.post(path, json=..., headers=...)`,
      `client.get(path, headers=...)`, `client.put(path, json=...,
      headers=...)`, and `client.delete(path, headers=...)` each
      simulate one real HTTP request of that real method against this
      app's own real routing, in-process, returning a real `Response`.
    its_use: >
      This lesson's own first unit calls all four, across ten real test
      functions, to exercise every one of the five real CRUD routes
      through real, complete HTTP request/response cycles.
    type: Four real instance methods on `FlaskClient`.
    responsibility: >
      Simulating a real, complete HTTP request of a specific real
      method - path, headers, and body together - against this app's
      own real routing.
    depends_on: >
      A fully-built real `Flask` app instance; a real, valid
      `Authorization` header - required outright for three of these
      five routes (`create_part`/`update_part`/`delete_part`, whose own
      real `allowed_roles=['programming', 'admin']` excludes
      `'operator'`, so `token_required`'s own bypass never fires), and
      sent consistently for the other two (`get_parts`/`get_part`, whose
      own real `allowed_roles` does include `'operator'`) so every real
      test in this lesson exercises the identical, authenticated path.
    connects_to: >
      Each real call reaches exactly one of the five real view functions
      named above, running its real, unmodified code.
    shape: >
      Takes a real path (and optional body/headers) in; returns one
      real `Response` object, whose `.status_code` is a real `int` and
      `.get_json()` a real, parsed `dict`.

  - name: User and encode_auth_token
    what_it_is: >
      `User` is this project's own real, existing SQLAlchemy model
      class; `encode_auth_token` is this project's own real, existing
      function producing a real, signed JWT for a given real user - both
      required to build the real, valid `Authorization` header this
      lesson's own tests send on every request, so every real request
      exercises the identical, authenticated path regardless of which
      of the five routes happens to also permit the real
      operator-bypass.
    implementation: >
      `User(id=..., email=..., name=..., role=...)`
      (`backend/app/models/user.py`) builds one real, in-memory row;
      `encode_auth_token(user_id: str, role: str) -> str`
      (`backend/app/utils/auth_utils.py:163-247`) builds a real payload
      with a `sub` (the user id) and `role` claim, then signs it with
      this app's own real, configured `SECRET_KEY`.
    its_use: >
      This lesson's own shared `auth_headers` fixture builds one real
      `User`, commits it, and calls this real function once, to produce
      the real token every one of this lesson's own ten test functions
      sends.
    type: A real SQLAlchemy model class, and a real, module-level function.
    responsibility: >
      `User` declares the real mapping for the `users` table;
      `encode_auth_token` produces one real, cryptographically signed
      token string that `token_required` can later decode and trust.
    depends_on: >
      A real, live SQLAlchemy `db` extension instance; a real user id
      and role string.
    connects_to: >
      Its real output goes directly into every one of this lesson's own
      ten real requests, via the shared `auth_headers` fixture.
    shape: >
      `User(...)` takes real keyword arguments in, produces one real,
      unpersisted instance; `encode_auth_token` takes two real strings
      in, returns one real, signed token string.

  - name: Session (.add / .commit)
    what_it_is: >
      The real, live session object this project's own `db` extension
      exposes as `db.session`, and two of its real methods this
      lesson's own `auth_headers` fixture uses to persist the real
      `User` row every request needs.
    implementation: >
      `db.session.add(instance)` registers one real, new object as
      pending; `db.session.commit()` flushes every real pending change
      into real SQL and finalizes the real transaction.
    its_use: >
      Called once, in the shared `auth_headers` fixture, to persist the
      real `User` row before `encode_auth_token` is called against its
      real id.
    type: A real instance of SQLAlchemy's `Session` class (`db.session`).
    responsibility: >
      Staging a real, new object as pending, then, on `commit`,
      compiling and sending the real SQL that actually persists it.
    depends_on: >
      A real, open connection from this app's own real `Engine`.
    connects_to: >
      The real `User` row this lesson's own ten real requests all
      authenticate as.
    shape: >
      `.add` takes a real object in, returns nothing; `.commit` takes
      nothing, returns nothing, but has the real, observable side
      effect of persisting the pending change.

concept_units:
  - title: "Characterizing the Five Real /api/parts CRUD Routes"
    problem: >
      `backend/app/routes/parts.py`'s own five real routes already have
      real, current behavior - `create_part` returns a real `409` on a
      duplicate part number, `delete_part` archives rather than removes
      a row. None of this is pinned anywhere as a real, permanent test.
      What real, concrete contract does this lesson's own later rebuild
      unit have to keep satisfying?
    socratic_prompt:
      - >
        `delete_part`'s own real code never calls a real `DELETE` SQL
        statement - it sets `part.status = 'archived'` and commits.
        Given that, what would a real, permanent test actually need to
        check after calling this route, to correctly prove it's a soft
        delete rather than a hard one?
      - >
        `create_part`'s own real code checks
        `Part.query.filter_by(part_number=data['partNumber']).first()`
        before creating anything. What real, two-request test sequence
        would prove that check actually works, rather than merely
        existing in the source?
    project_change:
      reference_source: >
        Real specimen: `backend/app/routes/parts.py:18-200` (every one
        of the five real CRUD routes), read again this session.
      files_affected:
        - path: backend/tests/test_parts_characterization.py
          status: new
      change_type: add
      location: N/A - a new, permanent test file; no existing project structure to place it within.
      dependencies: >
        This project's own real `Part`/`User` models; the real
        `encode_auth_token` function, since every one of these five real
        routes requires a real, valid token.
    new_code:
      applicable: true
      intro: >
        The real, complete, permanent test file - ten real test
        functions across five real test classes, one per CRUD route:
      file: backend/tests/test_parts_characterization.py
      status: new
      language: python
      code: |
        """
        Characterization tests for this project's own real, existing /api/parts
        CRUD routes (backend/app/routes/parts.py), pinning current, real
        behavior before Lesson 8.2's own rebuild of the persistence/application
        boundary touches it - not what these routes should do, what they
        actually do, verified against a real, running Flask app.

        Covers all five real routes named in this lesson's own scope:
        POST /api/parts, GET /api/parts, GET /api/parts/<id>, PUT /api/parts/<id>,
        DELETE /api/parts/<id>.
        """
        import pytest

        from app import create_app, db
        from app.models.part import Part
        from app.utils.auth_utils import encode_auth_token
        from app.models.user import User


        @pytest.fixture
        def app():
            application = create_app("testing")
            with application.app_context():
                yield application


        @pytest.fixture
        def client(app):
            return app.test_client()


        @pytest.fixture
        def auth_headers(app):
            user = User(id="U-PARTS-TEST", email="parts-test@example.com", name="Parts Tester", role="programming")
            db.session.add(user)
            db.session.commit()
            token = encode_auth_token("U-PARTS-TEST", "programming")
            return {"Authorization": f"Bearer {token}"}


        class TestCreatePart:
            """POST /api/parts"""

            def test_create_part_returns_201_and_real_data(self, client, auth_headers):
                resp = client.post(
                    "/api/parts",
                    json={"partNumber": "1112223", "description": "Test Bracket"},
                    headers=auth_headers,
                )
                assert resp.status_code == 201
                body = resp.get_json()
                assert body["data"]["partNumber"] == "1112223"
                assert body["data"]["id"].startswith("P-")

            def test_create_part_missing_required_field_returns_400(self, client, auth_headers):
                resp = client.post("/api/parts", json={"partNumber": "1112223"}, headers=auth_headers)
                assert resp.status_code == 400

            def test_create_part_duplicate_part_number_returns_409(self, client, auth_headers):
                client.post("/api/parts", json={"partNumber": "9998887", "description": "First"}, headers=auth_headers)
                resp = client.post("/api/parts", json={"partNumber": "9998887", "description": "Second"}, headers=auth_headers)
                assert resp.status_code == 409


        class TestListParts:
            """GET /api/parts"""

            def test_list_parts_returns_real_created_part(self, client, auth_headers):
                client.post("/api/parts", json={"partNumber": "5556667", "description": "Listed Part"}, headers=auth_headers)
                resp = client.get("/api/parts", headers=auth_headers)
                assert resp.status_code == 200
                numbers = [p["partNumber"] for p in resp.get_json()["data"]]
                assert "5556667" in numbers

            def test_list_parts_status_filter(self, client, auth_headers):
                create = client.post("/api/parts", json={"partNumber": "4443332", "description": "Filtered"}, headers=auth_headers)
                part_id = create.get_json()["data"]["id"]
                client.put(f"/api/parts/{part_id}", json={"status": "released"}, headers=auth_headers)
                resp = client.get("/api/parts?status=released", headers=auth_headers)
                numbers = [p["partNumber"] for p in resp.get_json()["data"]]
                assert "4443332" in numbers


        class TestGetPart:
            """GET /api/parts/<id>"""

            def test_get_existing_part_returns_200(self, client, auth_headers):
                create = client.post("/api/parts", json={"partNumber": "1231234", "description": "Gettable"}, headers=auth_headers)
                part_id = create.get_json()["data"]["id"]
                resp = client.get(f"/api/parts/{part_id}", headers=auth_headers)
                assert resp.status_code == 200
                assert resp.get_json()["data"]["partNumber"] == "1231234"

            def test_get_nonexistent_part_returns_404(self, client, auth_headers):
                resp = client.get("/api/parts/P-DOES-NOT-EXIST", headers=auth_headers)
                assert resp.status_code == 404


        class TestUpdatePart:
            """PUT /api/parts/<id>"""

            def test_update_part_description(self, client, auth_headers):
                create = client.post("/api/parts", json={"partNumber": "7778889", "description": "Original"}, headers=auth_headers)
                part_id = create.get_json()["data"]["id"]
                resp = client.put(f"/api/parts/{part_id}", json={"description": "Updated"}, headers=auth_headers)
                assert resp.status_code == 200
                assert resp.get_json()["data"]["description"] == "Updated"

            def test_update_nonexistent_part_returns_404(self, client, auth_headers):
                resp = client.put("/api/parts/P-DOES-NOT-EXIST", json={"description": "x"}, headers=auth_headers)
                assert resp.status_code == 404


        class TestDeletePart:
            """DELETE /api/parts/<id> - real, current behavior is a soft delete."""

            def test_delete_part_soft_archives_rather_than_removing_the_row(self, client, auth_headers):
                create = client.post("/api/parts", json={"partNumber": "6665554", "description": "Deletable"}, headers=auth_headers)
                part_id = create.get_json()["data"]["id"]
                resp = client.delete(f"/api/parts/{part_id}", headers=auth_headers)
                assert resp.status_code == 200

                reloaded = client.get(f"/api/parts/{part_id}", headers=auth_headers)
                assert reloaded.status_code == 200
                assert reloaded.get_json()["data"]["status"] == "archived"
    updated_project:
      applicable: false
    mechanical_walkthrough:
      applicable: true
      items:
        - element: '@pytest.fixture def auth_headers(app): ... return {"Authorization": f"Bearer {token}"}'
          explanation: >
            A real, shared fixture producing a real, valid `Authorization`
            header - outright required for three of these five real
            routes (`create_part`/`update_part`/`delete_part`, whose own
            real `allowed_roles=['programming', 'admin']` excludes
            `'operator'`, so `token_required`'s own real bypass never
            fires), and sent the identical way for the other two
            (`get_parts`/`get_part`, whose own real `allowed_roles` does
            include `'operator'`) so every real test here exercises the
            same, authenticated path consistently.
        - element: 'test_create_part_duplicate_part_number_returns_409'
          explanation: >
            Sends the identical real `partNumber` twice - the second
            real request is what actually exercises `create_part`'s own
            real duplicate check, proving the real `409` fires, not
            just that the checking code exists in the source.
        - element: 'test_delete_part_soft_archives_rather_than_removing_the_row'
          explanation: >
            Calls the real `DELETE` route, then immediately makes a
            second, real `GET` request for the identical id - proof the
            row still genuinely exists and is still genuinely
            queryable, with only its real `status` changed, rather than
            trusting the delete route's own `200` response alone.
        - element: 'test_list_parts_status_filter'
          explanation: >
            Creates a real part, updates its real status via the
            real `PUT` route, then filters for it via `GET
            /api/parts?status=released` - proving the real filter
            actually reads the current, committed database state, not
            a value cached anywhere in the request.
    mental_model:
      applicable: false
    execution_trace:
      applicable: false
    cs_lens: >
      This is a **golden master**: real, current request/response
      behavior captured as a real, permanent assertion, so this
      lesson's own next unit can prove its rebuild changed nothing
      observable. Also recognized in: a real API gateway's own contract
      tests, recorded from actual, live traffic;
      a real UI snapshot test, comparing a rendered component against a
      previously-approved render; and, in this project's own domain,
      this project's own real `verification/` folder's own saved
      output files, the identical kind of pinning, just outside the
      permanent test suite.
    se_lens: >
      The design principle is that these tests go through the real
      HTTP layer (`client.post`, not calling `create_part` directly),
      because the rebuild this lesson is about to perform touches the
      persistence *layer beneath* the routes, not the routes
      themselves - characterizing at the HTTP boundary is what lets the
      internal implementation change freely underneath, as long as
      these real requests keep producing the identical real responses.
      The real alternative not chosen here - characterizing by calling
      `Part.from_dict`/`.to_dict()` and the route functions directly, in
      Python, skipping real HTTP - would run faster; the honest cost of
      that real alternative: it would miss any real behavior that lives
      in `token_required`, in Flask's own real routing, or in
      `jsonify`'s own real response construction, none of which this
      lesson's own actual rebuild is about, but all of which a real
      client actually depends on.
    commands:
      - command: backend/.venv/Scripts/python.exe -m pytest backend/tests/test_parts_characterization.py -v
        explanation: >
          Runs this real, permanent test file with pytest, from the
          repository root.
