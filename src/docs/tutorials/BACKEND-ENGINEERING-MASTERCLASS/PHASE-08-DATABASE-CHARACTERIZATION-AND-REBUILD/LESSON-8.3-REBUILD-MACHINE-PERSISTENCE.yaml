  - title: "Transactions - a Rejected Group Leaves No Real, Partial Row"
    problem: >
      The previous unit's own new check runs *before* `db.session.add`/
      `.commit()`. What real, concrete difference does that ordering
      make to what ends up in the real database when a `groupId` is
      rejected?
    socratic_prompt:
      - >
        If the new `groupId` check instead ran *after*
