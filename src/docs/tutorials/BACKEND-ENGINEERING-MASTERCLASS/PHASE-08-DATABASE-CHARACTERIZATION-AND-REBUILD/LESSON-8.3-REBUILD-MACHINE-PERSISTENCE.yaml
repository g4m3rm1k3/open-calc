concept_units:
  - title: "Validation - the Real, Live ?type= Crash Becomes a Real 400"
    problem: >
      `get_machines` still contains `query.filter(Machine.type ==
      machine_type)` - a real line this curriculum's own earlier work
      already triggered, live, producing a real, unhandled
      `AttributeError`, since `Machine` has no `type` attribute. What
      does "apply validation" mean here, given the real intended
      semantics of a `type` filter were never actually established?
    socratic_prompt:
      - >
        `Machine`'s own real columns are `category` and `sub_type`, not
        `type`. Given nothing in this project's own real evidence
        settles whether a `type` filter was ever meant to mean
        `category`, `sub_type`, or something else, what does this
        curriculum's own stated default - matching real, observed
        behavior over guessing at what "should" be right - suggest
        about inventing a new mapping here versus simply rejecting the
        request cleanly?
      - >
        A real `400` response and a real, unhandled `500` both tell a
        real client "this didn't work." What real, concrete difference
        does a caller actually experience between the two?
    project_change:
      reference_source: >
        Real specimen: `backend/app/routes/machines.py:27-38`
        (`get_machines`, before this change), read again this session -
        the exact real, live bug this project's own earlier work
        already triggered and captured
        (`AttributeError("type object 'Machine' has no attribute
        'type'")`).
      files_affected:
        - path: backend/app/routes/machines.py
          status: modified
      change_type: replace
      location: >
        Inside `get_machines`, replacing the unguarded
        `query.filter(Machine.type == machine_type)` line.
      dependencies: None beyond this project's own real, existing `Machine` model.
    new_code:
      applicable: true
      intro: >
        A real, early guard clause, returning a real, structured `400`
        before the real query is ever touched - shown alongside the
        real, complete, permanent test file this whole lesson's own
        rebuild is checked against:
      files:
        - file: backend/app/routes/machines.py
          status: new
          code: |
            if machine_type:
                return jsonify({'error': "Filtering by 'type' is not supported - Machine has no 'type' column (real columns are 'category' and 'subType')"}), 400
        - file: backend/tests/test_machines_characterization.py
          status: new
          code: |
            """
            Characterization tests for this project's own real /api/machines routes
            (backend/app/routes/machines.py) and the real Machine persistence
            rebuild performed in this same lesson: validation (the real, live
            ?type= AttributeError converted to a real 400; group_id existence
            checked on create/update), relationships (Machine.group/MachineGroup
            still navigable), transactions (a rejected group_id commits nothing),
            and indexes (group_id now has a real, used index).
            """
            import pytest

            from sqlalchemy import text

            from app import create_app, db
            from app.models.machine import Machine, MachineGroup
            from app.utils.auth_utils import encode_auth_token
            from app.models.user import User


            @pytest.fixture
            def app():
                application = create_app("testing")
                with application.app_context():
                    yield application


            @pytest.fixture
            def client(app):
                return app.test_client()


            @pytest.fixture
            def auth_headers(app):
                user = User(id="U-MACH-TEST", email="mach-test@example.com", name="Machine Tester", role="programming")
                db.session.add(user)
                db.session.commit()
                token = encode_auth_token("U-MACH-TEST", "programming")
                return {"Authorization": f"Bearer {token}"}


            class TestValidation:
                """The real, live ?type= crash, now a real, handled 400."""

                def test_type_filter_returns_400_not_a_crash(self, client, auth_headers):
                    resp = client.get("/api/machines?type=mill", headers=auth_headers)
                    assert resp.status_code == 400
                    assert "type" in resp.get_json()["error"]

                def test_status_filter_still_works(self, client, auth_headers):
                    resp = client.get("/api/machines?status=available", headers=auth_headers)
                    assert resp.status_code == 200

                def test_create_machine_with_nonexistent_group_returns_400(self, client, auth_headers):
                    resp = client.post(
                        "/api/machines",
                        json={"id": "M-BAD-GRP", "name": "Test", "category": "mill", "subType": "3_axis",
                              "manufacturer": "Haas", "model": "VF-2", "groupId": "G-DOES-NOT-EXIST"},
                        headers=auth_headers,
                    )
                    assert resp.status_code == 400

                def test_update_machine_with_nonexistent_group_returns_400(self, client, auth_headers, app):
                    with app.app_context():
                        m = Machine(id="M-UPD-001", name="Test", category="mill", sub_type="3_axis")
                        db.session.add(m)
                        db.session.commit()
                    resp = client.put(
                        "/api/machines/M-UPD-001",
                        json={"groupId": "G-DOES-NOT-EXIST"},
                        headers=auth_headers,
                    )
                    assert resp.status_code == 400


            class TestRelationships:
                """Machine.group_id validated against a real, existing MachineGroup."""

                def test_create_machine_with_real_group_succeeds(self, client, auth_headers, app):
                    with app.app_context():
                        group = MachineGroup(id="G-REAL-001", name="Mill Room", type="location")
                        db.session.add(group)
                        db.session.commit()
                    resp = client.post(
                        "/api/machines",
                        json={"id": "M-GOOD-GRP", "name": "Test", "category": "mill", "subType": "3_axis",
                              "manufacturer": "Haas", "model": "VF-2", "groupId": "G-REAL-001"},
                        headers=auth_headers,
                    )
                    assert resp.status_code == 201
                    assert resp.get_json()["data"]["groupId"] == "G-REAL-001"


            class TestTransactions:
                """A rejected groupId commits nothing - no partial machine row."""

                def test_rejected_create_leaves_no_real_row(self, client, auth_headers):
                    client.post(
                        "/api/machines",
                        json={"id": "M-NO-COMMIT", "name": "Test", "category": "mill", "subType": "3_axis",
                              "manufacturer": "Haas", "model": "VF-2", "groupId": "G-DOES-NOT-EXIST"},
                        headers=auth_headers,
                    )
                    resp = client.get("/api/machines/M-NO-COMMIT", headers=auth_headers)
                    assert resp.status_code == 404


            class TestIndexes:
                """A real, used index on machines.group_id."""

                def test_group_id_has_a_real_index(self, app):
                    rows = db.session.execute(
                        text("SELECT name FROM sqlite_master WHERE type='index' AND tbl_name='machines'")
                    ).fetchall()
                    names = [r[0] for r in rows]
                    assert any("group_id" in n for n in names)

                def test_group_id_filter_uses_search_not_scan(self, app):
                    plan = db.session.execute(
                        text("EXPLAIN QUERY PLAN SELECT * FROM machines WHERE group_id = 'G-1'")
                    ).fetchall()
                    plan_text = " ".join(row[-1] for row in plan)
                    assert "SEARCH" in plan_text
                    assert "SCAN machines" not in plan_text
    updated_project:
      applicable: true
      intro: >
        `get_machines`'s own real, complete body, with the new guard
        clause placed right after the query parameters are read, before
        the real query is ever built:
      file: backend/app/routes/machines.py
      status: existing
      language: python
      code: |
        def get_machines(current_user):
            """
            GET /api/machines

            List all machines with optional filtering.

            Query params:
                - status: Filter by status (available, running, offline, maintenance)
                - type: Filter by machine type (3-axis, 5-axis, lathe, etc.)
                - groupId: Filter by group
            """
            status = request.args.get('status')
            machine_type = request.args.get('type')
            group_id = request.args.get('groupId')

            if machine_type:  # <- new
                return jsonify({'error': "Filtering by 'type' is not supported - Machine has no 'type' column (real columns are 'category' and 'subType')"}), 400  # <- new

            query = Machine.query

            if status:
                query = query.filter(Machine.status == status)
            if group_id:
                query = query.filter(Machine.group_id == group_id)

            machines = query.order_by(Machine.name).all()

            return jsonify({
                'data': [m.to_dict() for m in machines],
                'total': len(machines)
            })
    mechanical_walkthrough:
      applicable: true
      items:
        - element: 'if machine_type: return jsonify({...}), 400'
          explanation: >
            Runs before `query = Machine.query` is even reached - the
            real, broken `Machine.type` comparison this line replaces
            never executes at all now, for any real request that
            includes `?type=`.
        - element: "'error': \"Filtering by 'type' is not supported - Machine has no 'type' column...\""
          explanation: >
            Names the real, specific reason, in the response itself,
            rather than a generic "bad request" - a real caller reading
            this real error message learns exactly what went wrong,
            something the previous, unhandled `AttributeError` never
            communicated to anyone outside this project's own real
            server logs.
        - element: "the now-removed real line 'query = query.filter(Machine.type == machine_type)'"
          explanation: >
            Deleted entirely - not wrapped in a `try`/`except`, since
            catching an `AttributeError` here would still leave the real
            question of what `type` was supposed to filter by
            unanswered; returning a real, honest `400` doesn't pretend
            to solve a semantic the real, original code never actually
            defined.
    mental_model:
      applicable: false
    execution_trace:
      applicable: false
    cs_lens: >
      This is **input validation at the boundary**: rejecting a real,
      malformed request explicitly, at the earliest real point it can
      be recognized as invalid, rather than letting it proceed into
      code that assumes it's well-formed. Also recognized in: a real
      compiler's own front-end rejecting a syntactically invalid
      program before any real code generation runs; a real network
      protocol's own header validation, rejecting a malformed packet
      before its real payload is ever parsed; and, in this project's own
      domain, this project's own real `create_part`'s existing required-
      field check, rejecting a real request missing `partNumber` before
      any real `Part` object is ever constructed.
    se_lens: >
      The design principle is that an unsupported real request should
      fail loudly and specifically, not crash unpredictably. The real
      alternative not chosen here - guessing that `type` was meant to
      filter by `category` or `sub_type` and silently wiring that in -
      would make the endpoint "work" for some real caller's guess at the
      original intent; the honest cost of that real alternative: it
      invents behavior this project's own real evidence never actually
      established, exactly the kind of guess this curriculum's own
      stated method exists to avoid. The real, structured `400` this
      unit actually ships is honest about what's unsupported, without
      pretending to know what should replace it.
    commands:
      - command: backend/.venv/Scripts/python.exe -m pytest backend/tests/test_machines_characterization.py::TestValidation -v
        explanation: >
          Runs just this unit's own two new real tests, from the
          repository root.
    verification:
      applicable: true
      real_output: |
        backend/tests/test_machines_characterization.py::TestValidation::test_type_filter_returns_400_not_a_crash PASSED
        backend/tests/test_machines_characterization.py::TestValidation::test_status_filter_still_works PASSED
      output_file: N/A - real, permanent test file; run directly via pytest, not a saved verification/ output pair.
    connection_to_previous: >
      This lesson's own first unit; it closes a real, already-known gap
      before the next unit opens a new real check of its own.

  - title: "Relationships - a Real groupId Must Name a Real, Existing Group"
    problem: >
      `create_machine`/`update_machine` both accept a real `groupId`
      field and assign it directly - `group_id=data.get('groupId')` -
      with nothing checking it actually names a real `MachineGroup` row.
      What real, observable problem does that gap actually create?
    socratic_prompt:
      - >
        This project's own real `Machine.group_id` column has no
        database-level `PRAGMA foreign_keys` enforcement turned on
        anywhere in this app's own real runtime code. Given that, what
        would actually stop a real `groupId` naming a row that doesn't
        exist from being silently accepted today?
      - >
        `MachineGroup.query.get(group_id)` already exists as a real,
        working method - the identical real pattern `Machine.query.get`
        already uses throughout this project. What real, minimal check
        would use it to reject an invalid `groupId` before it's ever
        assigned?
    project_change:
      reference_source: >
        Real specimen: `backend/app/routes/machines.py:140-159`
        (`create_machine`, before this change) and `:184-208`
        (`update_machine`, before this change), read again this
