number: "8.3"
title: "Rebuild Machine Persistence"
path_note: >
  File paths under backend/... refer to the real manufacturing-platform
  repository. Paths under verification/... refer to that same
  repository's verification folder.

what_you_will_build: >
  Four real, permanent fixes to this project's own real
  `/api/machines` persistence, each pinned by a real, permanent test in
  `backend/tests/test_machines_characterization.py`: validation - the
  real, live `AttributeError` this curriculum's own earlier work
  already triggered against `Machine.type` is now a real, handled `400`;
  relationships - `create_machine`/`update_machine` now check a real,
  submitted `groupId` against `MachineGroup.query` before ever
  committing; transactions - that check runs before any real
  `db.session.add`/`.commit`, so a rejected group leaves no real,
  partial row behind; indexes - `Machine.group_id`
  (`backend/app/models/machine.py:83`) now has a real, working index,
  proven by a real `EXPLAIN QUERY PLAN` changing from `SCAN machines` to
  a real `SEARCH`. The transferable problem: "apply validation,
  relationships, transactions, indexes" isn't four separate rebuilds -
  it's four real lenses on the identical, small set of real code
  changes.

what_you_need_to_know_first: >
  What a real Python `AttributeError` is and when it's raised; what a
  real foreign key column is and what real value it's expected to hold;
  what a real database transaction is, and what committing or rolling
  it back actually does; what a real SQL index does to a real query
  plan.

