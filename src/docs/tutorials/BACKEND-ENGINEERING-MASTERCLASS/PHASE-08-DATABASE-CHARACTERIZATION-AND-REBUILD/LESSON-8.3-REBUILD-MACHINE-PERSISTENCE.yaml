            Names the real, specific `groupId` that failed, directly in
            the response - a real caller doesn't have to guess which
            field was wrong.
        - element: "'groupId' in data and data['groupId'] and not MachineGroup.query.get(data['groupId'])"
          explanation: >
            `update_machine`'s own real version of this check, textually
            different from `create_machine`'s: it tests `'groupId' in
            data` first, because `update_machine` treats a field's
            *absence* from the real request body as "leave unchanged" -
            the identical real convention every other field in this
            route already follows (`if 'name' in data: machine.name =
            data['name']`) - so this check must not fire for a real
            update that never mentions `groupId` at all, only one that
            submits an invalid one.
        - element: 'placed before the try/except block, not inside it'
          explanation: >
            This real check runs and can return early *before* any real
            `Machine(...)` object is even constructed - a deliberate,
            real ordering this lesson's own next unit examines directly.
    mental_model:
      applicable: false
    execution_trace:
      applicable: false
    cs_lens: >
      This is **referential integrity enforced in application code**,
      standing in for the real, database-level enforcement this project
      never turns on. Also recognized in: a real ORM's own
      `validates()`-style decorator, checking a value before it's ever
      assigned to a real attribute; a real compiler's own type checker,
      rejecting a reference to an undeclared name before code generation;
      and, in this project's own domain, this project's own real
      `create_part`'s duplicate-`part_number` check, the identical real
      shape - look a value up, reject if the real lookup fails to find
      what's expected.
    se_lens: >
      The design principle is that when a real database doesn't enforce
      a real constraint itself (this project's own real, confirmed gap:
      `PRAGMA foreign_keys` never turned on anywhere in its own runtime
      code), the application layer has to, or the real constraint simply
      doesn't exist in practice. The real alternative not chosen here -
      turning on `PRAGMA foreign_keys` at the database level instead -
      would enforce this for every real write path at once, not just
      these two routes; the honest cost of the real alternative this
      lesson actually chose: every other real write path that sets
      `group_id` (if any exist elsewhere in this codebase) still isn't
      protected, a real, narrower fix than a database-level change would
      have been.
    commands:
