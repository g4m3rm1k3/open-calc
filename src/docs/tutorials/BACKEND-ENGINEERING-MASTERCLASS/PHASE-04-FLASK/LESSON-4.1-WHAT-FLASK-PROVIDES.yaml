  - title: "Routing - Matching a Real URL Before Any Code Runs"
    problem: >
      This project's own real backend registers 112 real URL rules. When
      a real request for `/api/machines/M-TEST-001` arrives, how does
      Flask decide `get_machine`, specifically, is the real function that
      should handle it?
    socratic_prompt:
      - >
