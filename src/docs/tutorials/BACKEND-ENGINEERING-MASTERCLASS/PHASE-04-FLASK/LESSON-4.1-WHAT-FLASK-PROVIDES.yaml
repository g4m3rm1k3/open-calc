    new_code:
      applicable: true
      intro: >
        This project's own real routing table, inspected directly, then
        matched against one real URL by hand:
      file: verification/phase-04/lab_flask_routing.py
      status: new
      language: python
      code: |
        import sys
        sys.path.insert(0, "backend")

        from app import create_app

        app = create_app("testing")

        machine_rules = sorted(
            (str(rule), sorted(rule.methods - {"HEAD", "OPTIONS"}))
            for rule in app.url_map.iter_rules()
            if rule.rule.startswith("/api/machines")
        )
        for rule, methods in machine_rules:
            print(f"{rule:45s} -> {methods}")

        print("real, total URL rules registered across this whole app:", len(list(app.url_map.iter_rules())))

        with app.test_request_context():
            adapter = app.url_map.bind("localhost")
            endpoint, args = adapter.match("/api/machines/M-TEST-001", method="GET")
            print("real URL match for /api/machines/M-TEST-001 (GET) -> endpoint:", endpoint, "args:", args)

        assert ("/api/machines", ["GET"]) in machine_rules
        assert ("/api/machines", ["POST"]) in machine_rules
        assert endpoint == "machines.get_machine"
        assert args == {"machine_id": "M-TEST-001"}
        print("the identical real URL prefix, /api/machines, matched to two genuinely different real endpoints depending only on the real HTTP method - and a real, specific URL matched to the exact real Python function that will handle it, before that function is ever called")
