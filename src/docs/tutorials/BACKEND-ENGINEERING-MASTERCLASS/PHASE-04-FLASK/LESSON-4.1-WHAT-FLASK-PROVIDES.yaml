        `['GET']` and `['POST']` - for the identical real URL. What real,
        additional piece of information, beyond the URL alone, has to be
        checked before Flask can pick the right real one?
      - >
        `/api/machines/<string:machine_id>` is a real, dynamic URL
        pattern - it has to match `/api/machines/M-TEST-001` AND
        `/api/machines/ANYTHING-ELSE`. What real, structural fact about
        how this pattern is registered makes that possible?
    project_change:
      reference_source: >
