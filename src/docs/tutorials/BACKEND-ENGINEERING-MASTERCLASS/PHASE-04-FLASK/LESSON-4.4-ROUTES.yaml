  - title: "Request Bodies - Two Real, Separate Parsers"
    problem: >
      Every real route this curriculum has studied calls
      `request.get_json()`. Is that the only real way Flask can read a
      request's own body?
    socratic_prompt:
      - >
        This curriculum already found that `request.get_json()` depends
        entirely on the real `Content-Type` header saying
        `application/json`. If a real client instead sent a real,
        form-encoded body (`Content-Type:
        application/x-www-form-urlencoded`), would `request.get_json()`
        find anything there at all?
      - >
        Flask provides `request.form` specifically for real,
        form-encoded bodies. Would you expect it to find anything useful
        in a request whose real body is JSON instead?
    project_change:
      reference_source: >
        No reference counterpart - this unit demonstrates a real,
        general Flask mechanism directly, not one specific route; every
        real route in this project already commits to `request.get_json()`
        alone.
      files_affected: []
      change_type: none
      location: >
        N/A - a new, standalone script; no existing project structure to
        place it within.
      dependencies: None.
    new_code:
      applicable: true
      intro: >
        Two real request bodies, two real parsers, each checked against
        both:
      file: verification/phase-04/lab_routes_request_bodies.py
      status: new
      language: python
      code: |
        import sys
        sys.path.insert(0, "backend")

        from app import create_app
        from flask import request

        app = create_app("testing")

        with app.test_request_context("/x", method="POST", data={"name": "form value"}, content_type="application/x-www-form-urlencoded"):
            print("real, form-encoded body -> request.form:", dict(request.form))
            print("real, form-encoded body -> request.get_json(silent=True):", request.get_json(silent=True))

        with app.test_request_context("/x", method="POST", json={"name": "json value"}):
            print("real, JSON body        -> request.form:", dict(request.form))
            print("real, JSON body        -> request.get_json():", request.get_json())

        with app.test_request_context("/x", method="POST", data={"name": "form value"}, content_type="application/x-www-form-urlencoded"):
            assert dict(request.form) == {"name": "form value"}
            assert request.get_json(silent=True) is None

        with app.test_request_context("/x", method="POST", json={"name": "json value"}):
            assert dict(request.form) == {}
            assert request.get_json() == {"name": "json value"}

        print("two real, separate parsers, gated by the identical real Content-Type header this curriculum already studied - a real form body populates .form and leaves .get_json() empty; a real JSON body does the exact opposite; every real route in this project relies on the second path only")
    updated_project:
      applicable: false
    mechanical_walkthrough:
      applicable: true
      items:
        - element: 'app.test_request_context("/x", method="POST", data={"name": "form value"}, content_type="application/x-www-form-urlencoded")'
          explanation: >
            Builds a real, active request context carrying a real,
            form-encoded body - the same real `Content-Type` value this
            curriculum's own earlier work already showed triggering a
            genuine `415` when sent to a route that calls
            `request.get_json()` without `silent=True`.
        - element: 'request.form (with the form-encoded body active)'
          explanation: >
            Parses the real body as form data, returning a real
            `ImmutableMultiDict` (printed here as a plain `dict`)
            carrying the real, submitted field.
        - element: 'request.get_json(silent=True) (with the form-encoded body active)'
          explanation: >
            Returns real `None` rather than raising - `silent=True`
