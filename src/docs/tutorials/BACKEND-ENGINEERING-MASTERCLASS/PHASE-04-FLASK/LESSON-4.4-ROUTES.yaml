    execution_trace:
      applicable: false
    cs_lens: >
      This is **content-type-gated parsing**: two real, independent
      parsers, each activated by a different real declared format,
      neither one aware of what the other would find. Also recognized
      in: a real email client choosing a plain-text or HTML real parser
      based on a message's own declared MIME type; a real image library
      selecting a decoder based on a real file's own format signature,
      not its extension; and, in this project's own domain, a machine
      control choosing between real G-code and real conversational
      programming parsers based on which real mode is currently active.
    se_lens: >
      The design principle is that Flask supports multiple real request
      body formats without forcing every route to commit to one in
      advance - `request.form` and `request.get_json()` simply return
      real, empty results for a body they weren't built to parse, rather
      than raising by default. The real alternative not chosen anywhere
      in this project's own code: ever actually using `request.form`;
      every real route this curriculum has studied commits to
      `request.get_json()` alone, which is exactly why a real,
      form-encoded request to any of them fails with a real `415`
      instead of degrading gracefully - the honest, real cost of a JSON-only
      API is that `request.form`'s own real, graceful fallback behavior
      never actually gets used to advantage anywhere in this codebase.
    commands:
