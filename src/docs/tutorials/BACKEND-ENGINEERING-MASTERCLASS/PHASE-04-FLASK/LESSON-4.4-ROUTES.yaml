number: "4.4"
title: "Routes"
path_note: >
  File paths under backend/... refer to the real manufacturing-platform
  repository. Paths under verification/... refer to that same
  repository's verification folder.

what_you_will_build: >
  Four real, run checks against this project's own real routes, naming
  what route registration, URL parameters, query parameters, and
  request bodies actually are as Flask mechanics, not just HTTP
  concepts - and, along the way, two genuine real findings: the
  identical real `404` status code hides two structurally different
  real causes (one that never even reaches this project's own code, one
  that does), and `get_machines`'s own real code silently drops every
  repeated real query-parameter value but the first, even though the
  real object carrying them held every one.

what_you_need_to_know_first: >
  What the real WSGI application object, request context, response, and
  routing table this project's own Flask app provides; what the real
  HTTP status codes, headers, and JSON shapes this project's own backend
  returns mean.

terms:
  - name: route registration
    definition: >
      The real, one-time act of telling Flask's own routing table that a
      specific real URL pattern and method should reach a specific real
      Python function - `@blueprint.route(...)`, applied once, when the
      module is first imported. It exists as the real, structural link
      between a URL a client might request and the actual code that
      handles it.
  - name: URL parameter
    definition: >
      A real, named, dynamic segment of a route's own URL pattern -
      `<int:notification_id>`, in this lesson's own second unit -
      extracted from the real, matched URL and handed to the view
      function as a real argument, already converted to the real type
      the pattern names. It exists so one real route definition can
      serve every real, matching value, with Werkzeug itself refusing to
      match a URL whose real segment doesn't fit the declared type.
  - name: query parameter
    definition: >
      A real, optional key-value pair appended to a URL after a real
      `?` - `?status=running`, read through `request.args`, a real
      `ImmutableMultiDict` that can hold more than one real value under
      the identical key. It exists as the real, standard place a client
      puts optional real filters or options, separate from a URL's own
      real path.
  - name: request body
    definition: >
      The real, optional data a request carries beyond its URL and
      headers, parsed by one of several genuinely different real Flask
      mechanisms (`request.form` for form-encoded data,
      `request.get_json()` for JSON) depending entirely on the real
      `Content-Type` header this curriculum has already studied. It
      exists to carry a real operation's own actual content, separate
      from which resource and method identify what operation is being
      requested.

objects_and_methods:
  - name: blueprint.route (the decorator itself)
    what_it_is: >
      The real, existing decorator this project's own route files call
      on every single view function - already used throughout this
      curriculum, examined here specifically for what it does to the
      function it decorates.
    implementation: >
      `Blueprint.route(rule, **options)` returns a real decorator that,
      applied to a real function, registers that function into the
      blueprint's own real, internal list of deferred URL rules, then
      returns the identical real function object, completely
      unmodified.
    its_use: >
      This lesson applies it directly to a small, real, throwaway
      function, specifically to check whether the real object it
      returns is the same one that went in.
    type: A real method on Flask's own `Blueprint` class.
    responsibility: >
      Recording a real URL pattern and method against a real function,
      with no real side effect on the function's own identity.
    depends_on: A real URL pattern string; a real, callable view function.
    connects_to: >
      Every real view function this curriculum has studied was
      registered this identical real way; `@token_required`, applied
      separately on top, is what actually produces a new, real,
      wrapping function - this decorator itself does not.
    shape: >
      Takes a real function in; returns the identical real function
      object out, with a real, internal side effect on the blueprint's
      own state.

  - name: get_machine (revisited for its real decorator stack)
    what_it_is: >
      The real, existing Flask view function this curriculum has
      already studied extensively, revisited here specifically for the
      real, visible effect of the two decorators stacked on top of it.
    implementation: >
      `@machines_bp.route('/<string:machine_id>', methods=['GET'])`
      `@token_required(allowed_roles=[...])`
      `def get_machine(current_user, machine_id: str): ...`
      (`backend/app/routes/machines.py:48-61`) - `token_required`'s own
      real implementation uses `@wraps(f)` internally, which is exactly
      why the real, final `get_machine` name carries a real
      `__wrapped__` attribute pointing back at the original function.
    its_use: >
      This lesson checks its real `__wrapped__` attribute directly, to
      contrast against the plain route decorator's own real,
      non-wrapping behavior.
    type: A Flask view function, decorated with both `@blueprint.route`
      and `@token_required`.
    responsibility: >
      Being the concrete, real proof that not every decorator in this
      project behaves like `@blueprint.route` - some genuinely wrap.
    depends_on: A real `machine_id` matched from the request URL.
    connects_to: >
      Its own real `__wrapped__` attribute is the entire specimen this
      lesson's own registration unit contrasts against `blueprint.route`'s
      own real, non-wrapping behavior.
    shape: >
      Carries a real `__wrapped__` attribute, added by `@token_required`'s
      own use of `functools.wraps`, that `blueprint.route`'s own real
      output never adds on its own.

  - name: mark_as_read / delete_notification
    what_it_is: >
      Two real, existing Flask view functions, registered with a real
      `<int:notification_id>` URL parameter - the first real, typed URL
      converter this curriculum has studied.
    implementation: >
      `@notifications_bp.route('/<int:notification_id>/read',
      methods=['POST']) def mark_as_read(notification_id): ...`
      (`backend/app/routes/notifications.py:38-40`) and
      `@notifications_bp.route('/<int:notification_id>',
      methods=['DELETE']) def delete_notification(notification_id): ...`
      (`:66-76`) - Werkzeug's own real `<int:...>` converter only
      matches a URL segment that parses as a real integer; a
      non-numeric real segment never matches this route at all.
    its_use: >
      This lesson calls `delete_notification` with a real, non-numeric
      ID and a real, numeric-but-nonexistent one, specifically to
      contrast the two real ways this route can end in a `404`.
    type: Two Flask view functions, neither wrapped by
      `@token_required`.
    responsibility: >
      Acting on exactly one real notification, identified by a real,
      integer ID - never even reached at all if the real URL segment
      isn't a real, valid integer to begin with.
    depends_on: >
      A real URL segment matching Werkzeug's own real `<int:...>`
      pattern.
    connects_to: >
      `delete_notification`'s own real `404` branch
      (`:70-71`) is the entire specimen this lesson's own URL-parameters
      unit contrasts against Werkzeug's own routing-level rejection.
    shape: >
      Both take a real `notification_id: int` in (already converted by
      Werkzeug before the function ever runs); `delete_notification`
      returns a real, `jsonify`-wrapped `{'success': bool, ...}` dict.

  - name: get_machines (revisited for request.args)
    what_it_is: >
      The real, existing Flask view function this curriculum has
      already studied, revisited here specifically for how it reads its
      own real, optional query parameters.
    implementation: >
      `status = request.args.get('status')`
      (`backend/app/routes/machines.py:27`) reads a real, SINGLE value
      from `request.args` - a real `ImmutableMultiDict` that, given a
      real, repeated query key, actually holds every real value, not
      just one.
    its_use: >
      This lesson sends it a real URL with the identical query key
      repeated twice, specifically to check whether its own real code
      notices the second value at all.
    type: A Flask view function, decorated with `@token_required`.
    responsibility: >
      Reading a real, optional filter value from the request URL - by
      design, only ever the first one present, if more than one real
      value happens to share the identical key.
    depends_on: >
      Zero or more real query-string parameters.
    connects_to: >
      Its own real `request.args.get('status')` call is the entire
      specimen this lesson's own query-parameters unit is built around.
    shape: >
      `request.args.get('status')` returns a real `str` or `None`,
      never a real list, regardless of how many real values a query
      string actually carries under that key.

concept_units:
  - title: "Route Registration - What the Decorator Actually Returns"
    problem: >
      `@token_required` visibly changes what a decorated function looks
      like (a real `__wrapped__` attribute appears). Does
      `@blueprint.route(...)`, applied on every single real view
      function in this project, do the identical kind of thing?
    socratic_prompt:
      - >
        If `@blueprint.route(...)` returned a genuinely different real
        function object than the one it decorated, would calling that
        real function directly (bypassing Flask's own routing entirely)
        still work the identical way?
      - >
        Given that Flask needs to know, ahead of time, every real URL
        pattern this project registers, what would a route decorator's
        own real job actually have to be - modifying the function
        itself, or simply recording it somewhere?
    project_change:
      reference_source: >
        Real specimen: `backend/app/routes/machines.py:48-61`
        (`get_machine`), read again this session.
      files_affected: []
      change_type: none
      location: >
        N/A - a new, standalone script; no existing project structure to
        place it within.
      dependencies: None.
    new_code:
      applicable: true
      intro: >
        A real, throwaway blueprint and view function, decorated
        directly, next to this project's own real `get_machine`:
      file: verification/phase-04/lab_routes_registration.py
      status: new
      language: python
      code: |
        import sys
        sys.path.insert(0, "backend")

        from flask import Blueprint
        from app.routes.machines import get_machine

        bp = Blueprint("demo", __name__)


        def plain_view():
            return "ok"


        returned = bp.route("/demo")(plain_view)
        print("bp.route('/demo')(plain_view) is plain_view:", returned is plain_view)

        print("get_machine.__name__:", get_machine.__name__)
        print("get_machine has __wrapped__ (token_required's own real wrapping):", hasattr(get_machine, "__wrapped__"))

        assert returned is plain_view
        assert hasattr(get_machine, "__wrapped__")
        print("@blueprint.route(...) registers a real function into the URL map and hands back the identical real object; @token_required, applied separately, is what actually wraps it into a new, real function")
    updated_project:
      applicable: false
    mechanical_walkthrough:
      applicable: true
      items:
        - element: 'bp = Blueprint("demo", __name__); def plain_view(): return "ok"'
          explanation: >
            A real, minimal blueprint and view function - deliberately
            undecorated by anything except the one real decorator this
            unit studies.
        - element: 'returned = bp.route("/demo")(plain_view)'
          explanation: >
            Calls `bp.route("/demo")` to get the real decorator, then
            immediately applies it to `plain_view` by hand - the
            identical real two-step process `@bp.route("/demo")` above a
            function performs in one, real, syntactic step.
        - element: 'assert returned is plain_view'
          explanation: >
            Confirms, for real, that the route decorator's own real
            output is the identical object, not a new, wrapping one.
        - element: 'assert hasattr(get_machine, "__wrapped__")'
          explanation: >
            Confirms the real, opposite fact about a genuinely different
            decorator - `token_required`, stacked on top of
            `@machines_bp.route(...)` on this project's own real
            `get_machine`, does wrap, leaving this real, telltale
            attribute behind.
    mental_model:
      applicable: false
    execution_trace:
      applicable: false
    cs_lens: >
      This is a **registration-only decorator**: a real decorator whose
      entire job is a side effect (recording something elsewhere),
      returning its input completely unchanged, unlike a real decorator
      that wraps behavior around a function's own call. Also recognized
      in: a real test framework's own `@pytest.fixture` (in some real
      usages, primarily registering rather than wrapping); a real plugin
      system's own `@register_plugin` decorator, adding an entry to a
      real, internal registry; and, in this project's own domain, a real
      G-code subprogram's own `O` number declaration, naming and
      registering a real, callable block without altering what runs
      inside it.
    se_lens: >
      The design principle is that Flask's own routing needs a real,
      complete picture of every registered URL before any real request
      ever arrives - `@blueprint.route(...)`'s own job is purely
      building that real, static table, never touching what actually
      happens when a real view function runs. The real alternative not
      chosen: a route decorator that also wraps its function (adding
      real, automatic behavior, the way `@token_required` does for
      authentication); the honest, real distinction this project's own
      code relies on, proven directly by this unit's own two real
      checks: stacking multiple real decorators on one view function
      (`@blueprint.route` outermost, `@token_required` beneath it) only
      works correctly because each one's own real job is genuinely
      different - one records, one wraps - and neither interferes with
      what the other does.
    commands:
      - command: backend/.venv/Scripts/python.exe verification/phase-04/lab_routes_registration.py
        explanation: >
          Runs this as a plain script, from the repository root.
    verification:
      applicable: true
      real_output: |
        bp.route('/demo')(plain_view) is plain_view: True
        get_machine.__name__: get_machine
        get_machine has __wrapped__ (token_required's own real wrapping): True
        @blueprint.route(...) registers a real function into the URL map and hands back the identical real object; @token_required, applied separately, is what actually wraps it into a new, real function
      output_file: verification/phase-04/lab_routes_registration_output.txt
    connection_to_previous: >
      This is the lesson's first unit - it establishes exactly what one
      of the two decorators every protected real route in this project
      stacks actually does to the function underneath it.

  - title: "URL Parameters - Two Real Causes of the Same 404"
    problem: >
      `delete_notification`'s own real route,
      `/<int:notification_id>` (`notifications.py:66`), and its own real
      body both seem able to produce a real `404`. Are they actually the
      same kind of `404`?
    socratic_prompt:
      - >
        A real URL segment like `"not-a-number"` doesn't parse as a real
        integer at all. Given Werkzeug's own real `<int:...>` converter,
        would a request to `/api/notifications/not-a-number` ever
        actually reach `delete_notification`'s own real code?
      - >
        This curriculum already found one real `500` that wasn't valid
        JSON at all (this project's own unhandled `?type=` crash). Would
        you expect a `404` produced before any real route even matched
        to be JSON, or something else?
    project_change:
      reference_source: >
        Real specimen: `backend/app/routes/notifications.py:66-76`
        (`delete_notification`), read again this session.
      files_affected: []
      change_type: none
      location: >
        N/A - a new, standalone script; no existing project structure to
        place it within.
      dependencies: None.
    new_code:
      applicable: true
      intro: >
        Two real requests to the identical real route pattern, one with
        a real segment that doesn't even parse as an integer:
      file: verification/phase-04/lab_routes_url_params.py
      status: new
      language: python
      code: |
        import sys
        sys.path.insert(0, "backend")

        from app import create_app

        app = create_app("testing")
        with app.app_context():
            client = app.test_client()

            r_non_numeric = client.delete("/api/notifications/not-a-number")
            print("DELETE /api/notifications/not-a-number (int converter, non-numeric) -> status:", r_non_numeric.status_code, "Content-Type:", r_non_numeric.content_type)

            r_numeric = client.delete("/api/notifications/999")
            print("DELETE /api/notifications/999 (int converter, numeric, no such row) -> status:", r_numeric.status_code, "Content-Type:", r_numeric.content_type, "body:", r_numeric.get_json())

            assert r_non_numeric.status_code == 404
            assert r_numeric.status_code == 404
            assert "html" in r_non_numeric.content_type
            assert r_numeric.content_type == "application/json"
            print("the identical real 404, two genuinely different real causes: one URL never even matched a real route (Werkzeug's own <int:...> converter rejected it, before delete_notification ever ran); the other matched cleanly and this project's own real code chose to report 404 itself")
    updated_project:
      applicable: false
    mechanical_walkthrough:
      applicable: true
      items:
        - element: 'client = app.test_client()'
          explanation: >
            Builds one real `FlaskClient` - this lesson's own first
            construction of it; the following two units build their own
            fresh copies the same way.
        - element: 'r_non_numeric = client.delete("/api/notifications/not-a-number")'
          explanation: >
            `"not-a-number"` fails Werkzeug's own real `<int:...>`
            conversion - the URL never matches ANY real route at all, so
            Flask falls back to its own real, generic 404 handler,
            exactly like the unmatched-route case this curriculum's own
            earlier work already saw producing real HTML, not JSON.
        - element: 'r_numeric = client.delete("/api/notifications/999")'
          explanation: >
            `"999"` DOES parse as a real integer, so the route matches
            and `delete_notification`'s own real body runs - its own
            explicit `if not notification: return jsonify(...), 404`
            (`notifications.py:70-71`) is what actually produces this
            second, real, JSON `404`.
        - element: 'assert "html" in r_non_numeric.content_type / assert r_numeric.content_type == "application/json"'
          explanation: >
            Confirms both real, distinct causes together - the identical
            real status code, produced by two structurally different
            real code paths, only one of which is this project's own
            application logic.
    mental_model:
      applicable: true
      diagram: |
        DELETE /api/notifications/not-a-number
              |
              v
        Werkzeug's own real routing: does "not-a-number" match <int:...>?  NO
              |
              v
        no route matched at all  ->  Flask's own generic 404  ->  real HTML

        DELETE /api/notifications/999
              |
              v
        Werkzeug's own real routing: does "999" match <int:...>?  YES
              |
              v
        delete_notification(999) runs  ->  Notification.query.get(999) is None
              |
              v
        this project's own real code returns 404  ->  real JSON
    execution_trace:
      applicable: false
    cs_lens: >
      This is **typed URL matching as a real, early filter**: a route's
      own declared parameter type rejects an invalid real URL before any
      application code runs at all, the same way a real, statically-typed
      function signature rejects a wrong-typed real argument before the
      function body executes. Also recognized in: a real REST framework's
      own path-parameter validation, rejecting a malformed real ID before
      a database is ever queried; a real compiler's own type-checked
      function call, caught at compile time rather than at runtime; and,
      in this project's own domain, a machine control refusing to even
      parse a real G-code block whose real address format doesn't match
      what that command expects.
    se_lens: >
      The design principle is that a typed URL converter moves a real
      class of invalid request further left - rejected by Flask's own
      routing layer, before this project's own view function, its own
      database query, or its own error-handling logic ever run at all.
      The real alternative not chosen: a real, untyped
      `<string:notification_id>` (the pattern every other route in this
      project actually uses), checking and converting the value by hand
      inside the view function itself; the honest cost of the typed
      `<int:...>` converter this route actually uses, proven directly by
      this unit's own real run: the resulting `404` for a malformed
      real ID is genuinely different in kind from every other `404`
      this curriculum has studied - real HTML, not this project's own
      real, consistent JSON shape, because the request never reaches any
      of this project's own code at all.
    commands:
      - command: backend/.venv/Scripts/python.exe verification/phase-04/lab_routes_url_params.py
        explanation: >
          Runs this as a plain script, from the repository root.
    verification:
      applicable: true
      real_output: |
        Seeding default users...
        DELETE /api/notifications/not-a-number (int converter, non-numeric) -> status: 404 Content-Type: text/html; charset=utf-8
        DELETE /api/notifications/999 (int converter, numeric, no such row) -> status: 404 Content-Type: application/json body: {'error': 'Notification not found', 'success': False}
        the identical real 404, two genuinely different real causes: one URL never even matched a real route (Werkzeug's own <int:...> converter rejected it, before delete_notification ever ran); the other matched cleanly and this project's own real code chose to report 404 itself
      output_file: verification/phase-04/lab_routes_url_params_output.txt
    connection_to_previous: >
      The previous unit studied a decorator that never touches a real
      request at all; this unit studies the real, first moment a
      specific request either does, or never does, reach a real view
      function to begin with.

  - title: "Query Parameters - A Real MultiDict, Read as if It Weren't"
    problem: >
      `get_machines`'s own real code reads `request.args.get('status')`
      (`machines.py:27`) - a single-value read. What happens to a real
      request that sends the identical query key more than once?
    socratic_prompt:
      - >
        `request.args` is a real `ImmutableMultiDict`, not a plain
        `dict` - the "Multi" in its own real name suggests it can hold
        more than one real value per key. Does `.get('status')` return
        all of them, or just one?
      - >
        If a real client sent `?status=available&status=running`
        genuinely intending "either status," would `get_machines`'s own
        real code, as written, actually honor that intent?
    project_change:
      reference_source: >
        Real specimen: `backend/app/routes/machines.py:14-45`
        (`get_machines`), read again this session.
      files_affected: []
      change_type: none
      location: >
        N/A - a new, standalone script; no existing project structure to
        place it within.
      dependencies: Two real `Machine` rows with different real statuses.
    new_code:
      applicable: true
      intro: >
        A real, repeated query key, inspected directly, then sent
        through this project's own real route:
      file: verification/phase-04/lab_routes_query_params.py
      status: new
      language: python
      code: |
        import sys
        sys.path.insert(0, "backend")

        from app import create_app, db
        from app.models.machine import Machine
        from flask import request

        app = create_app("testing")
        with app.app_context():
            m1 = Machine(id="M-1", name="A", category="mill", sub_type="3_axis", status="available")
            m2 = Machine(id="M-2", name="B", category="mill", sub_type="3_axis", status="running")
            db.session.add(m1)
            db.session.add(m2)
            db.session.commit()

            with app.test_request_context("/api/machines?status=available&status=running"):
                print("real request.args.get('status') (single-value access):", request.args.get("status"))
                print("real request.args.getlist('status') (every value):", request.args.getlist("status"))
                print("real type of request.args:", type(request.args).__name__)

            client = app.test_client()
            r = client.get("/api/machines?status=available&status=running")
            print("real GET with two 'status' values -> real total returned:", r.get_json()["total"], "ids:", [m["id"] for m in r.get_json()["data"]])

            assert r.get_json()["total"] == 1
            print("get_machines's own real code calls request.args.get('status'), a single-value read - the second, real 'status=running' value is silently dropped, even though request.args itself, a real MultiDict, actually carried both")
    updated_project:
      applicable: false
    mechanical_walkthrough:
      applicable: true
      items:
        - element: 'request.args.get("status")'
          explanation: >
            Returns exactly one real value - the FIRST one present under
            this key - even though the real query string named it
            twice.
        - element: 'request.args.getlist("status")'
          explanation: >
            The real, alternate method built specifically for this
            case - returns every real value under the key, in order,
            proving `request.args` itself never lost the second one.
        - element: 'r = client.get("/api/machines?status=available&status=running")'
          explanation: >
            Sends the identical real, repeated query key through this
            project's own actual route - `get_machines`'s own real code
            still only ever calls `.get(...)`, so only the real machine
            with `status='available'` is returned.
        - element: 'assert r.get_json()["total"] == 1'
          explanation: >
            Confirms, for real, the honest finding this unit exists to
            surface - a real, second filter value a caller might
            reasonably expect to matter is silently ignored.
    mental_model:
      applicable: false
    execution_trace:
      applicable: false
    cs_lens: >
      This is a **multi-value mapping, accessed as if single-valued**:
      the real container (`ImmutableMultiDict`) supports more than one
      real value per key, but the specific real method called
      (`.get`) only ever surfaces one. Also recognized in: a real HTTP
      headers object, which can legitimately carry a real header more
      than once, silently truncated by code that only ever calls a
      single-value accessor; a real `dict` built naively from a list of
      real key-value pairs, silently keeping only the last real value
      for a repeated key; and, in this project's own domain, a real,
      multi-line G-code comment block where only the first real line is
      ever actually read by a naive real parser.
    se_lens: >
      The design principle behind `request.args` being a real
      `MultiDict` at all is supporting real, legitimate cases where a
      repeated key is meaningful (multiple real tags, multiple real IDs
      to filter by). The real alternative this project's own code could
      have chosen: calling `request.args.getlist('status')` and
      filtering by ANY of the real values present; the honest cost of
      the single-value `.get(...)` call this project's own code actually
      uses, proven directly by this unit's own real run: a real client
      that reasonably expects `?status=a&status=b` to mean "either" gets
      silently, incorrectly narrowed to just the first real value, with
      no real error, no real warning - the second real filter simply
      never happened.
    commands:
