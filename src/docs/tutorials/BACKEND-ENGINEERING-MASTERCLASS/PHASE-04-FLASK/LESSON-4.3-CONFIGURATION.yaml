  - title: "Three Real Environments, Compared Directly"
    problem: >
      `DevelopmentConfig`, `TestingConfig`, and `ProductionConfig` each
      override a different, small, real handful of settings. Run
      side by side, what do they actually, concretely differ on?
    socratic_prompt:
      - >
        `TestingConfig` explicitly sets its own real
        `SQLALCHEMY_DATABASE_URI = 'sqlite:///:memory:'`
        (`config.py:61`). `DevelopmentConfig` and `ProductionConfig`
        both leave `SQLALCHEMY_DATABASE_URI` unset in their own real
        class bodies. What real value would each of those two actually
        resolve to?
      - >
        If a real deployment forgot to set `DATABASE_URL` in a genuine
        real production environment, what real, concrete consequence
        would that have, given what the previous question's own answer
        implies?
    project_change:
      reference_source: >
        Real specimen: `backend/config.py:46-62`
        (`DevelopmentConfig`, `ProductionConfig`, `TestingConfig`), read
        again this session.
      files_affected: []
      change_type: none
      location: >
        N/A - a new, standalone script; no existing project structure to
        place it within.
      dependencies: None.
    new_code:
      applicable: true
      intro: >
        All three real environments, built through the identical real
        factory function, compared directly:
      file: verification/phase-04/lab_config_environments.py
      status: new
      language: python
      code: |
        import sys
        import os
        import tempfile
        sys.path.insert(0, "backend")

        # real safety measure: point the real 'production' config at a real, scratch
        # SQLite file instead of this project's own real production database path -
        # create_app("production") really would call db.create_all() against
        # whatever SQLALCHEMY_DATABASE_URI resolves to.
        scratch_db = os.path.join(tempfile.mkdtemp(), "scratch.db")
        os.environ["DATABASE_URL"] = f"sqlite:///{scratch_db}"

        from app import create_app

        dev_app = create_app("development")
        test_app = create_app("testing")
        prod_app = create_app("production")

        for label, real_app in [("development", dev_app), ("testing", test_app), ("production", prod_app)]:
            print(f"{label:12s} -> DEBUG: {real_app.config['DEBUG']!s:6s} TESTING: {real_app.config['TESTING']!s:6s} DATABASE_URI: {real_app.config['SQLALCHEMY_DATABASE_URI']}")

        assert dev_app.config["DEBUG"] is True
        assert test_app.config["TESTING"] is True
        assert prod_app.config["DEBUG"] is False
        assert test_app.config["SQLALCHEMY_DATABASE_URI"] == "sqlite:///:memory:"
        assert dev_app.config["SQLALCHEMY_DATABASE_URI"] == prod_app.config["SQLALCHEMY_DATABASE_URI"]
        print("DEBUG and TESTING genuinely differ across all three real configs, as intended - but development and production share the identical real database-URI fallback (Config's own base default) unless DATABASE_URL is explicitly set for each; only testing's own class hard-codes something structurally different (an in-memory database), rather than relying on the same real fallback the other two share")
    updated_project:
      applicable: false
    mechanical_walkthrough:
      applicable: true
