  - title: "Secrets - A Real Default That Was Never Supposed to Ship"
    problem: >
      `Config.SECRET_KEY` (`backend/config.py:19`) falls back to the
      literal real string `'dev-secret-key-change-in-production'` when
      no real `SECRET_KEY` environment variable is set. This project's
      own real `encode_auth_token` signs every real authentication token
      with whatever `SECRET_KEY` resolves to. What does that combination
      actually let someone do?
    socratic_prompt:
      - >
        `encode_auth_token`'s own real code (already studied in an
        earlier lesson) calls `jwt.encode(payload, current_app.config.get('SECRET_KEY'),
        algorithm='HS256')`. If someone else, with no real access to
        this project's own database or login system, knew the exact real
        string `Config.SECRET_KEY` falls back to, what real, additional
        information would they need to produce a token
        `token_required` would accept as genuinely valid?
      - >
        This exact real default string is sitting in
        `backend/config.py:19` - a real file. Does knowing it require
        breaching this project's own real backend at all?
    project_change:
      reference_source: >
        Real specimen: `backend/config.py:15-19` (`Config.SECRET_KEY`)
        and this curriculum's own earlier real citation of
        `encode_auth_token` (`backend/app/utils/auth_utils.py:163-247`),
        both read again this session.
      files_affected: []
      change_type: none
      location: >
        N/A - a new, standalone script; no existing project structure to
        place it within.
      dependencies: >
        The real, third-party `PyJWT` library, already used by this
        project's own real `auth_utils.py`.
    new_code:
      applicable: true
      intro: >
        A real, forged admin token, built from nothing but the real
        default string already sitting in this project's own real
        source code:
      file: verification/phase-04/lab_config_secrets.py
      status: new
      language: python
      code: |
        import sys
        sys.path.insert(0, "backend")

        import jwt
        from datetime import datetime, timedelta

        from app import create_app, db
        from app.models.user import User

        app = create_app("testing")
        with app.app_context():
            admin = User(id="real-admin", email="a@e.com", name="Admin", role="admin")
