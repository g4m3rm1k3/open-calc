            own lab from ever touching this project's own real data.
        - element: 'dev_app = create_app("development"); test_app = create_app("testing"); prod_app = create_app("production")'
          explanation: >
            Three real, separate calls to the identical real factory
            function this curriculum has already studied - each one
            producing a genuinely independent real `Flask` instance.
        - element: 'assert dev_app.config["SQLALCHEMY_DATABASE_URI"] == prod_app.config["SQLALCHEMY_DATABASE_URI"]'
          explanation: >
            Confirms, for real, the honest finding this unit surfaces -
            without an explicit `DATABASE_URL` override for each,
            development and production share the identical real
            fallback database location.
    mental_model:
      applicable: false
    execution_trace:
      applicable: false
    cs_lens: >
      This is **environment-specific configuration selection**: the
      identical real code, running under a genuinely different real
      profile depending on one, real, passed-in name. Also recognized
      in: a real compiler's own build profiles (debug versus release),
      changing real optimization and assertion behavior from the
      identical real source; a real CI pipeline's own staging-versus-production
      deployment targets; and, in this project's own domain, a
      real machine control's own "setup mode" versus "production run"
      profile, changing real feed-rate limits and real safety
      interlocks from the identical underlying real program.
    se_lens: >
      The design principle is that a real config name, chosen once,
      should meaningfully change a real app's own behavior - `TESTING`
      genuinely does, isolating every real test's own database
      completely. The real alternative not chosen for the database URI
      specifically: giving `ProductionConfig` its own real, hard-coded,
      distinct fallback the way `TestingConfig` does for
      `SQLALCHEMY_DATABASE_URI`; the honest cost of relying on
      `Config`'s own shared, real fallback instead, proven directly by
      this unit's own real run: development and production, absent an
      explicit real `DATABASE_URL`, would use the identical real
      database file - a real, easy-to-miss gap between "this environment
      is configured differently" (true for `DEBUG`/`TESTING`) and "this
      environment is SAFELY isolated" (only actually true here for
      `TESTING`, because it alone hard-codes something structurally
      different rather than trusting the same real fallback).
    commands:
