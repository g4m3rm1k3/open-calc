number: "4.3"
title: "Configuration"
path_note: >
  File paths under backend/... refer to the real manufacturing-platform
  repository. Paths under verification/... refer to that same
  repository's verification folder.

what_you_will_build: >
  Four real, run checks against this project's own real
  `backend/config.py`, covering environment variables, the real
  configuration class hierarchy, a direct comparison of this project's
  three real environments, and, closing the lesson, a genuine, severe
  real finding: this project's own real `SECRET_KEY` falls back to a
  hardcoded, publicly-readable default string when no environment
  variable overrides it - a real default this lesson uses to forge a
  fully valid, real admin token, with no login and no real credentials
  at all.

what_you_need_to_know_first: >
  What the real application factory pattern is, and why `create_app`
  takes a config name; what a Python class and inheritance are.

terms:
  - name: environment variable
    definition: >
      A real, named value set outside a Python process entirely - in
      the real shell, or by whatever real system launches it - read
      inside this project's own code via `os.environ.get(...)`. It
      exists so a real deployment's own configuration (a real secret, a
      real database location) can change without editing a single line
      of this project's own real, checked-in source code.
  - name: configuration object
    definition: >
      A real Python class - `Config`, and the three real classes that
      inherit from it - holding a real, named group of settings as
      plain real class attributes. It exists so an entire, real set of
      related settings can be selected together, by name, rather than
      individually assembled every time a real app is built.
  - name: secret
    definition: >
      A real configuration value whose entire purpose depends on staying
      unknown to anyone outside the real deployment that uses it -
      `SECRET_KEY`, in this project's own real code, signs every real
      authentication token this curriculum has used. It exists because
      some real configuration values aren't just settings; their real
      security value comes specifically from not being real, public
      knowledge.

objects_and_methods:
  - name: Config (and its real subclasses)
    what_it_is: >
      This project's own real, base configuration class, and the three
      real classes - `DevelopmentConfig`, `TestingConfig`,
      `ProductionConfig` - that inherit from it.
    implementation: >
      `class Config: SECRET_KEY = os.environ.get('SECRET_KEY',
      'dev-secret-key-change-in-production')` (`backend/config.py:15-19`)
      defines every real, shared default; `class DevelopmentConfig(Config):
      DEBUG = True` (`:46-48`), `class TestingConfig(Config): TESTING =
      True; SQLALCHEMY_DATABASE_URI = 'sqlite:///:memory:'; DEBUG = False`
      (`:58-62`), and `class ProductionConfig(Config): DEBUG = False;
      SQLALCHEMY_DATABASE_URI = os.environ.get('DATABASE_URL',
      Config.SQLALCHEMY_DATABASE_URI)` (`:51-55`) each override only the
      real values genuinely specific to that one real environment.
    its_use: >
      This lesson inspects this real class hierarchy directly, and
      separately builds all three real environments through
      `create_app`, to compare their real, resolved values side by side.
    type: Four real Python classes - one base, three real subclasses.
    responsibility: >
      Holding every real setting a specific real environment needs,
      inheriting everything else unchanged from `Config`.
    depends_on: >
      Whatever real environment variables happen to be set when this
      project's own `config.py` module is first imported.
    connects_to: >
      Selected by name through the real, module-level `config` dict
      (`backend/config.py:66-70`), which `create_app` reads via
      `config.get(config_name, config['default'])`
      (`backend/app/__init__.py:254`).
    shape: >
      Each real class carries plain, real class attributes - strings,
      booleans, integers - no real methods of its own.

  - name: os.environ.get
    what_it_is: >
      The real, standard library method this project's own `config.py`
      calls for every real, environment-driven setting.
    implementation: >
      `os.environ.get(name, default)` reads a real environment variable
      by name, returning the real, given default if it isn't set -
      used throughout `config.py` for `SECRET_KEY` (`:19`), `DATA_PATH`
      (`:22`), `DATABASE_URL` (`:24`, `:54`), and `STORAGE_PATH`
      (`:30`).
    its_use: >
      This lesson sets a real environment variable directly, before
      re-importing this project's own real config module, to observe
      its real effect.
    type: A real method on the standard library's `os.environ`
      mapping.
    responsibility: >
      Reading a real, external value if one was actually provided,
      falling back to a real, hard-coded default otherwise - with no
      real way, from inside this method alone, to tell which of the two
      actually happened.
    depends_on: >
      Whatever real environment variables exist in the current real
      process at the moment `config.py`'s own class bodies execute.
    connects_to: >
      Every real class attribute in `Config` and its real subclasses
      that reads from the environment calls this identical real method.
    shape: >
      Takes a real variable name and a real default value in; returns
      either the real, actual environment value (always a real `str`)
      or the real default, whatever type it happens to be.

concept_units:
  - title: "Environment Variables - The Same Real Code, a Different Real Answer"
    problem: >
      `config.py`'s own real `DATA_PATH = os.environ.get('DATA_PATH',
      str(BASE_DIR / "data"))` (`:22`) runs once, when the module is
      first imported. Does changing a real environment variable after
      that actually change anything?
    socratic_prompt:
      - >
        `os.environ.get('DATA_PATH', ...)` reads a real environment
        variable at the exact moment this real line of class-body code
        executes - not every time `DATA_PATH` is later accessed. Given
        that, would simply setting `os.environ['DATA_PATH']` sometime
        AFTER `config.py` has already been imported once actually change
        the real, already-defined class attribute?
      - >
        What would have to happen to this project's own real `config`
        module - re-importing it fresh, or something else - for a real,
        newly-set environment variable to actually take effect?
    project_change:
      reference_source: >
        Real specimen: `backend/config.py:15-32` (the base `Config`
        class), read again this session.
      files_affected: []
      change_type: none
      location: >
        N/A - a new, standalone script; no existing project structure to
        place it within.
      dependencies: None.
    new_code:
      applicable: true
      intro: >
        The identical real config class, read before and after a real
        environment variable changes, with a real module reload in
        between:
      file: verification/phase-04/lab_config_env_vars.py
      status: new
      language: python
      code: |
        import sys
        import os
        sys.path.insert(0, "backend")

        from app import create_app

        app_default = create_app("testing")
        print("no real DATA_PATH env var set -> real config value:", app_default.config["DATA_PATH"])

        os.environ["DATA_PATH"] = "/real/custom/path"
        import importlib
        import config as config_module
        importlib.reload(config_module)

        app_override = create_app("testing")
        print("real DATA_PATH env var set to '/real/custom/path' -> real config value:", app_override.config["DATA_PATH"])

        assert app_default.config["DATA_PATH"] != app_override.config["DATA_PATH"]
        assert app_override.config["DATA_PATH"] == "/real/custom/path"
        print("the identical real config class read a genuinely different real value, purely because a real environment variable changed between the two calls - nothing in the Python code itself was touched")
    updated_project:
      applicable: false
    mechanical_walkthrough:
      applicable: true
      items:
        - element: 'app_default = create_app("testing")'
          explanation: >
            Imports `config.py` for the real, first time in this
            process - `DATA_PATH`'s own real class attribute is set once,
            here, reading whatever the real environment happened to be
            at this exact moment.
        - element: 'os.environ["DATA_PATH"] = "/real/custom/path"'
          explanation: >
            Sets a real environment variable - by itself, this changes
            nothing about the already-defined `Config.DATA_PATH`
            attribute, since that real class body has already finished
            running.
        - element: 'importlib.reload(config_module)'
          explanation: >
            Forces this project's own real `config` module to
            re-execute its own top-level code, including every real
            class body - only now does `os.environ.get('DATA_PATH', ...)`
            run again, this time seeing the real, newly-set value.
        - element: 'app_override = create_app("testing")'
          explanation: >
            Calls the real application factory again - `from config
            import config` (inside `create_app`) now returns the
            real, reloaded module's own, updated classes.
        - element: 'assert app_default.config["DATA_PATH"] != app_override.config["DATA_PATH"]'
          explanation: >
            Confirms, for real, both facts together - the real value
            genuinely changed, and it only changed once the module was
            actually reloaded, not the instant the environment variable
            was set.
    mental_model:
      applicable: false
    execution_trace:
      applicable: false
    cs_lens: >
      This is **configuration read at load time, not access time**: a
      real class attribute, once defined, holds a fixed real value until
      something re-executes the code that defined it. Also recognized
      in: a compiled program's own real, embedded build-time constants,
      unaffected by an environment variable changed after the binary
      was built; a real Docker image's own baked-in configuration,
      requiring a real rebuild (not just a restart) to pick up certain
      real changes; and, in this project's own domain, a machine
      control's own real parameter set, loaded once at power-on, not
      re-read continuously while a program runs.
    se_lens: >
      The design principle behind reading environment variables at
      class-definition time is simplicity - every real setting is a
      plain, real class attribute, readable with ordinary real
      attribute access, no function call needed anywhere else in the
      codebase. The real alternative not chosen: reading
      `os.environ.get(...)` fresh, every single time a setting is
      actually used, which would let a real, running process pick up a
      real environment change live; the honest cost of the simpler
      approach this project's own code actually uses, proven directly
      by this unit's own real run: a real environment variable set after
      this project's own process has already started has no effect at
      all, until something restarts the process (or, as this lesson's
      own lab had to do, forces a real module reload) - a genuine, real
      surprise for anyone assuming `os.environ.get` behaves like a live
      read.
    commands:
      - command: backend/.venv/Scripts/python.exe verification/phase-04/lab_config_env_vars.py
        explanation: >
          Runs this as a plain script, from the repository root.
    verification:
      applicable: true
      real_output: |
        Seeding default users...
        no real DATA_PATH env var set -> real config value: C:\Users\g4m3r\Documents\manufacturing-platform\backend\data
        Seeding default users...
        real DATA_PATH env var set to '/real/custom/path' -> real config value: /real/custom/path
        the identical real config class read a genuinely different real value, purely because a real environment variable changed between the two calls - nothing in the Python code itself was touched
      output_file: verification/phase-04/lab_config_env_vars_output.txt
    connection_to_previous: >
      This is the lesson's first unit - it establishes exactly when a
      real environment variable's own value actually gets read into this
      project's own real configuration.

  - title: "Configuration Objects - Inheriting What You Don't Override"
    problem: >
      `TestingConfig` (`backend/config.py:58-62`) defines `TESTING`,
      `SQLALCHEMY_DATABASE_URI`, and `DEBUG` - never `SECRET_KEY`. Does
      `TestingConfig.SECRET_KEY` even exist?
    socratic_prompt:
      - >
        `class TestingConfig(Config): ...` names `Config` as its real
        base class. If `TestingConfig`'s own real body never mentions
        `SECRET_KEY` at all, what real, structural fact about Python's
        own class inheritance determines whether `TestingConfig.SECRET_KEY`
        still works?
      - >
        Every real subclass in `config.py` only defines the handful of
        real values that genuinely differ for that one environment. Is
        that a real, deliberate design choice, or would Python actually
        force every subclass to repeat every real value regardless?
    project_change:
      reference_source: >
        Real specimen: `backend/config.py:15-62` (`Config` and its three
        real subclasses), read again this session.
      files_affected: []
      change_type: none
      location: >
        N/A - a new, standalone script; no existing project structure to
        place it within.
      dependencies: None.
    new_code:
      applicable: true
      intro: >
        This project's own real class hierarchy, inspected directly:
      file: verification/phase-04/lab_config_objects.py
      status: new
      language: python
      code: |
        import sys
        sys.path.insert(0, "backend")

        from config import config, Config, DevelopmentConfig, TestingConfig, ProductionConfig

        print("real config dict keys:", sorted(config.keys()))
        print("real TestingConfig.__bases__:", TestingConfig.__bases__)

        print("real TestingConfig.TESTING (defined directly on TestingConfig):", TestingConfig.TESTING)
        print("real TestingConfig.SECRET_KEY (not defined on TestingConfig at all):", TestingConfig.SECRET_KEY)
        print("real Config.SECRET_KEY (the base class it actually resolved from):", Config.SECRET_KEY)

        assert "TESTING" in TestingConfig.__dict__
        assert "SECRET_KEY" not in TestingConfig.__dict__
        assert TestingConfig.SECRET_KEY == Config.SECRET_KEY
        print("TestingConfig only defines what it actually overrides - every other real value, like SECRET_KEY, is inherited straight from Config, resolved by Python's own real class lookup, not copied or repeated anywhere")
    updated_project:
      applicable: false
    mechanical_walkthrough:
      applicable: true
      items:
        - element: 'print("real config dict keys:", sorted(config.keys()))'
          explanation: >
            Reads the real, module-level `config` dict
            (`backend/config.py:66-70`) directly - the real, named lookup
            table `create_app` itself uses to turn a plain real string
            like `"testing"` into an actual real class.
        - element: 'assert "TESTING" in TestingConfig.__dict__'
          explanation: >
            Checks `TestingConfig`'s own real, immediate namespace
            directly (not inherited attributes) - confirms `TESTING` was
            genuinely defined right there, on this specific real class.
        - element: 'assert "SECRET_KEY" not in TestingConfig.__dict__'
          explanation: >
            Confirms the opposite, real fact - `SECRET_KEY` is
            genuinely absent from `TestingConfig`'s own real namespace,
            proving any working value has to come from somewhere else.
        - element: 'assert TestingConfig.SECRET_KEY == Config.SECRET_KEY'
          explanation: >
            Confirms, for real, where that value actually comes from -
            Python's own real attribute lookup walks up to the real base
            class automatically, finding `Config`'s own real definition.
    mental_model:
      applicable: false
    execution_trace:
      applicable: false
    cs_lens: >
      This is **inheritance as configuration layering**: a real base
      class holding every real, shared default, with real subclasses
      overriding only what genuinely differs. Also recognized in: a
      real CSS stylesheet's own cascade, where a specific real selector
      overrides only the real properties it names, inheriting everything
      else; a real operating system's own layered config files (a
      system default, a user override); and, in this project's own
      domain, a specific real machine's own parameter set overriding
      only the handful of real values that differ from its
      manufacturer's own real, standard defaults.
    se_lens: >
      The design principle is that real inheritance eliminates
      real repetition - `TestingConfig` never has to restate
      `SECRET_KEY`'s own real value, so a real change to `Config.SECRET_KEY`
      automatically applies everywhere nothing more specific overrides
      it. The real alternative not chosen: giving each real environment
      class a fully independent, real, complete set of every setting,
      with no real inheritance at all; the honest cost of the
      inheritance approach this project's own code actually uses,
      proven directly by this unit's own real run: `TestingConfig`
      quietly inherits `SECRET_KEY`'s own real, hardcoded default,
      exactly like every other real environment that doesn't explicitly
      override it - a real fact easy to miss precisely because
      `TestingConfig`'s own file never mentions `SECRET_KEY` at all.
    commands:
