number: "4.5"
title: "Blueprints"
path_note: >
  File paths under backend/... refer to the real manufacturing-platform
  repository. Paths under verification/... refer to that same
  repository's verification folder.

what_you_will_build: >
  Four real, run checks against this project's own real, 18-blueprint
  backend, naming what has quietly held every earlier lesson's own
  routes together: a real `Blueprint` object as a self-contained,
  reusable module of routes; two genuinely different real mechanisms
  this project's own code actually uses for setting a route prefix; real
  proof that registering the identical blueprint twice under the same
  name fails, while registering it again under a different name
  succeeds; and, closing the lesson, a real, direct count of exactly how
  this project's own 18 real route files compose into its one, real,
  112-rule routing table.

what_you_need_to_know_first: >
  What real route registration, URL parameters, query parameters, and
  request bodies are as Flask mechanics; what the real application
  factory pattern is.

terms:
  - name: modular routing
    definition: >
      Splitting a real application's own routes across multiple, real,
      independent files - one real `Blueprint` per related group - kept
      isolated from any specific app until registered. It exists so a
      real backend with many routes (this project's own 18 route files)
      never has to hold every real route definition in one, unmanageable
      module.
  - name: blueprint registration
    definition: >
      The real, explicit act of attaching an already-complete
      `Blueprint`'s own routes onto a specific real `Flask` app -
      `app.register_blueprint(bp, url_prefix=...)`. It exists as the
      one real, deliberate step separating "this group of routes exists"
      from "this group of routes is actually live on this specific real
      app."
  - name: route prefix
    definition: >
      A real, shared URL segment automatically prepended to every real
      route a blueprint defines - `/api/machines`, for `machines_bp`'s
      own routes. It exists so an entire real blueprint's worth of
      routes can be relocated, or namespaced, by changing one real
      string in one real place, rather than editing every individual
      real route pattern.
  - name: application composition
    definition: >
      The real, single act of assembling every real blueprint this
      project defines into one, real, working app -
      `register_routes(app)`, called once, inside `create_app`. It
      exists as the one real place a reader (or this lesson's own labs)
      can see the entire real backend's routing structure come together.

objects_and_methods:
  - name: machines_bp (as a real, standalone Blueprint)
    what_it_is: >
      This project's own real `Blueprint` instance for every
      machine-related route, already studied extensively in this
      curriculum, examined here specifically as a self-contained real
      object, independent of any app.
    implementation: >
      `machines_bp = Blueprint('machines', __name__)`
      (`backend/app/routes/machines.py:11`) - every real
      `@machines_bp.route(...)` call anywhere in that same file adds a
      real, deferred registration onto this one object, real and
      complete, before `create_app` is ever called.
    its_use: >
      This lesson imports it directly, before building any real app at
      all, to confirm its own real routes already exist independently.
    type: A real `flask.Blueprint` instance.
    responsibility: >
      Holding every real route this project's own `machines.py` defines,
      ready to be attached to any real Flask app that registers it.
    depends_on: >
      Nothing, to exist with its own real routes already defined; a real
      `Flask` app, via `register_blueprint`, to actually become live.
    connects_to: >
      Registered by `register_routes` (`backend/app/routes/__init__.py:31`,
      `app.register_blueprint(machines_bp, url_prefix='/api/machines')`).
    shape: >
      Carries a real, internal list of deferred route registrations,
      each applied to whichever real app later registers this blueprint.

  - name: bootstrap_bp (a real, self-prefixed Blueprint)
    what_it_is: >
      A real, existing Blueprint that sets its own real URL prefix at
      construction time, rather than at registration time.
    implementation: >
      `bootstrap_bp = Blueprint('bootstrap', __name__,
      url_prefix='/api/bootstrap')` (`backend/app/routes/bootstrap.py:24`) -
      the real prefix is baked directly into the `Blueprint(...)` call
      itself; its own real registration,
      `app.register_blueprint(bootstrap_bp)`
      (`backend/app/__init__.py:299`), passes no `url_prefix` argument
      at all.
    its_use: >
      This lesson contrasts its own real construction-time prefix
      directly against `machines_bp`'s own real, registration-time
      prefix.
    type: A real `flask.Blueprint` instance.
    responsibility: >
      Carrying its own real URL prefix as part of its own identity,
      rather than depending on whoever registers it to supply one.
    depends_on: Nothing beyond its own real construction call.
    connects_to: >
      Registered separately from `register_routes`'s own real 17
      blueprints, directly in `create_app`
      (`backend/app/__init__.py:296-299`).
    shape: >
      `Blueprint(name, import_name, url_prefix=...)` - the real,
      optional `url_prefix` keyword this project's own `bootstrap_bp`
      uses, and every other real blueprint in this project does not.

  - name: app.register_blueprint
    what_it_is: >
      The real, existing `Flask` method every one of this project's own
      18 blueprints is attached through.
    implementation: >
      `app.register_blueprint(blueprint, url_prefix=None, name=None)` -
      attaches a real blueprint's own deferred routes onto this specific
      real app; raises a real `ValueError` if the identical real
      blueprint name is registered twice without a real, explicit
      `name=` override, confirmed directly this session.
    its_use: >
      This lesson calls it multiple times against the identical real
      blueprint object, specifically to observe both its real success
      and real failure paths.
    type: A real instance method on Flask's own `Flask` class.
    responsibility: >
      Merging one real blueprint's own routes into one real app's own
      routing table, under one real, unique name.
    depends_on: >
      A real `Blueprint` instance; a real, unique name (the blueprint's
      own default name, or an explicit real override).
    connects_to: >
      Called once per real blueprint inside `register_routes`
      (`backend/app/routes/__init__.py:9-57`), and once more, separately,
      for `bootstrap_bp`, inside `create_app` itself.
    shape: >
      Takes a real `Blueprint` in (plus optional real `url_prefix`/`name`
      keywords); returns nothing, mutating the real app's own routing
      table in place.

  - name: register_routes
    what_it_is: >
      This project's own real, single function assembling every one of
      its 18 real blueprints into one real app.
    implementation: >
      `def register_routes(app: Flask): ...`
      (`backend/app/routes/__init__.py:9-57`) - imports and registers 17
      real blueprints, each with its own real `url_prefix`; `bootstrap_bp`,
      the 18th, is registered separately, directly inside `create_app`
      (`backend/app/__init__.py:296-299`), relying on its own
      construction-time prefix instead.
    its_use: >
      This lesson calls `create_app` and inspects the real, resulting
      `app.blueprints` and `app.url_map` directly, to count exactly what
      this one real function (plus the one separate call) actually
      produces.
    type: A real, module-level function.
    responsibility: >
      Being the one real, central place every real route in this
      project gets attached to the app - the real, single point a
      reader (or this lesson's own lab) can inspect to see the whole
      real routing structure at once.
    depends_on: >
      A real, already-constructed `Flask` app instance; every real
      blueprint module it imports.
    connects_to: >
      Called once, inside `create_app`
      (`backend/app/__init__.py:298`), immediately before `bootstrap_bp`'s
      own separate, real registration.
    shape: >
      Takes a real `Flask` app in; returns nothing, leaving that real
      app holding every one of this project's own 18 real blueprints
      when it finishes.

concept_units:
  - title: "Modular Routing - A Blueprint Is Real, Complete, Before Any App Exists"
    problem: >
      `machines_bp`'s own real routes are all defined with
      `@machines_bp.route(...)`, inside `machines.py`, with no real
      `Flask` app anywhere in that file. Does `machines_bp` actually need
      one to already hold its own real routes?
    socratic_prompt:
      - >
        Every real `@machines_bp.route(...)` call in `machines.py`
        happens the moment that module is first imported - before
        `create_app()` is ever called anywhere. What does that suggest
        about whether `machines_bp` already "knows" its own real routes
        by the time `create_app` even starts running?
      - >
        If you imported `machines_bp` directly, on its own, with no real
        app built at all, would you expect it to already carry real,
        useful information - or would it be empty until something
        attaches it to an app?
    project_change:
      reference_source: >
        Real specimen: `backend/app/routes/machines.py:11-297` (the
        whole file, defining `machines_bp` and every real route on it),
        read again this session.
      files_affected: []
      change_type: none
      location: >
        N/A - a new, standalone script; no existing project structure to
        place it within.
      dependencies: None.
    new_code:
      applicable: true
      intro: >
        This project's own real `machines_bp`, inspected before any real
        app exists, then registered onto a bare one:
      file: verification/phase-04/lab_blueprints_modular.py
      status: new
      language: python
      code: |
        import sys
        sys.path.insert(0, "backend")

        from app.routes.machines import machines_bp

        print("real machines_bp is a real Blueprint:", type(machines_bp).__name__)
        print("real machines_bp.name:", machines_bp.name)
        print("real number of routes registered on machines_bp, before any app exists:", len(machines_bp.deferred_functions))

        from flask import Flask
        bare_app = Flask(__name__)
        print("real, bare Flask app has zero knowledge of machines_bp until registered -> url rules:", len(list(bare_app.url_map.iter_rules())))

        bare_app.register_blueprint(machines_bp, url_prefix="/api/machines")
        print("after registering the identical real blueprint -> url rules:", len(list(bare_app.url_map.iter_rules())))

        assert len(machines_bp.deferred_functions) > 0
        assert len(list(bare_app.url_map.iter_rules())) > 1
        print("machines_bp already held every one of its own real routes before this script ever built an app - registering it onto a real app just attaches that already-complete real module to one specific app's own real routing table")
    updated_project:
      applicable: false
    mechanical_walkthrough:
      applicable: true
      items:
        - element: 'from app.routes.machines import machines_bp'
          explanation: >
            Importing this real module alone - with no `create_app()`
            call anywhere in this script - is enough to fully populate
            `machines_bp`'s own real, internal route list, since every
            real `@machines_bp.route(...)` call runs the moment this
            module is first imported.
        - element: 'len(machines_bp.deferred_functions)'
          explanation: >
            Reads the real, internal count directly - proof this
            project's own blueprint object is already a real, complete
            module of routes, independent of any specific app.
        - element: 'bare_app = Flask(__name__)'
          explanation: >
            A genuinely fresh, real `Flask` app, built without
            `create_app` at all - has no knowledge of `machines_bp`,
            or any of this project's own routes, until told to.
        - element: 'bare_app.register_blueprint(machines_bp, url_prefix="/api/machines")'
          explanation: >
            The one real, explicit step connecting the two - after this
            real call, `bare_app`'s own routing table gains every real
            route `machines_bp` already carried.
    mental_model:
      applicable: false
    execution_trace:
      applicable: false
    cs_lens: >
      This is a **module of behavior, decoupled from its host**: a real
      blueprint is complete and self-contained the moment it's defined,
      genuinely independent of which real app (if any) eventually uses
      it. Also recognized in: a real Python package, fully importable
      and usable on its own, regardless of which real application
      eventually depends on it; a real dynamic library (`.so`/`.dll`),
      complete on disk before any real process loads it; and, in this
      project's own domain, a real, pre-built tool assembly, complete
      and ready, before any specific real machine ever loads it into a
      turret.
    se_lens: >
      The design principle is that decoupling a blueprint's own real
      definition from its eventual real registration lets the identical
      real module of routes be reused, tested, or even registered more
      than once (this lesson's own later unit proves that directly),
      without ever touching the file that defines it. The real
      alternative not chosen: defining every real route directly on the
      app object itself, the way `health_check` in `__init__.py` still
      does; the honest cost of that simpler, real alternative, which
      this project's own code overwhelmingly avoids: every real route
      would have to live in one, real, monolithic file, or be manually
      attached to a shared `app` object threaded through every real
      module - exactly the real complexity blueprints exist to avoid.
    commands:
      - command: backend/.venv/Scripts/python.exe verification/phase-04/lab_blueprints_modular.py
        explanation: >
          Runs this as a plain script, from the repository root.
    verification:
      applicable: true
      real_output: |
        real machines_bp is a real Blueprint: Blueprint
        real machines_bp.name: machines
        real number of routes registered on machines_bp, before any app exists: 10
        real, bare Flask app has zero knowledge of machines_bp until registered -> url rules: 1
        after registering the identical real blueprint -> url rules: 11
        machines_bp already held every one of its own real routes before this script ever built an app - registering it onto a real app just attaches that already-complete real module to one specific app's own real routing table
      output_file: verification/phase-04/lab_blueprints_modular_output.txt
    connection_to_previous: >
      This is the lesson's first unit - it establishes that a blueprint
      is real, complete, and independent, before any of this lesson's
      later units touch how it actually gets attached to an app.

  - title: "Route Prefixes - Two Real Mechanisms, One Real Outcome"
    problem: >
      `bootstrap_bp`'s own real construction
      (`backend/app/routes/bootstrap.py:24`) names its own real
      `url_prefix` directly; `machines_bp`'s own real construction
      (`machines.py:11`) names none at all. Do both blueprints still end
      up with a real, working prefix?
    socratic_prompt:
      - >
        `app.register_blueprint(bootstrap_bp)`
        (`backend/app/__init__.py:299`) passes no `url_prefix` argument.
        Given what `bootstrap_bp`'s own construction already set, would
        you expect its real routes to end up with no prefix at all, or
        the one it already carries?
      - >
        `app.register_blueprint(machines_bp, url_prefix='/api/machines')`
        (`routes/__init__.py:31`) passes the real prefix explicitly, at
        registration time instead. Which of these two real, genuinely
        different mechanisms would let the SAME blueprint object be
        registered under two different real prefixes later?
    project_change:
      reference_source: >
        Real specimen: `backend/app/routes/bootstrap.py:24` and
        `backend/app/__init__.py:296-299`, plus
        `backend/app/routes/machines.py:11` and
        `backend/app/routes/__init__.py:31`, all read again this
        session.
      files_affected: []
      change_type: none
      location: >
        N/A - a new, standalone script; no existing project structure to
        place it within.
      dependencies: None.
    new_code:
      applicable: true
      intro: >
        Two real blueprints, two real prefix mechanisms, compared
        directly:
      file: verification/phase-04/lab_blueprints_prefixes.py
      status: new
      language: python
      code: |
        import sys
        sys.path.insert(0, "backend")

        from app.routes.bootstrap import bootstrap_bp
        from app.routes.machines import machines_bp

        print("real bootstrap_bp.url_prefix (set at Blueprint() construction time):", bootstrap_bp.url_prefix)
        print("real machines_bp.url_prefix (nothing set at construction time):", machines_bp.url_prefix)

        from app import create_app
        app = create_app("testing")

        bootstrap_rules = sorted({str(r) for r in app.url_map.iter_rules() if r.endpoint.startswith("bootstrap.")})
        machines_rules = sorted({str(r) for r in app.url_map.iter_rules() if r.endpoint.startswith("machines.") and r.rule == "/api/machines"})

        print("real, final bootstrap route(s):", bootstrap_rules)
        print("real, final machines route (list endpoint):", machines_rules)

        assert bootstrap_bp.url_prefix == "/api/bootstrap"
        assert machines_bp.url_prefix is None
        assert bootstrap_rules == ["/api/bootstrap"]
        assert machines_rules == ["/api/machines"]
        print("two real, different mechanisms reach the identical real outcome - bootstrap_bp bakes its own prefix in at construction time; machines_bp carries none of its own, and gets one only when register_routes(app) passes url_prefix='/api/machines' at registration time")
    updated_project:
      applicable: false
    mechanical_walkthrough:
      applicable: true
      items:
        - element: 'bootstrap_bp.url_prefix'
          explanation: >
            Reads the real, already-set prefix directly off the
            blueprint object itself - present the moment
            `bootstrap.py`'s own module-level `Blueprint(...)` call ran.
        - element: 'machines_bp.url_prefix'
          explanation: >
            Reads the identical real attribute off `machines_bp` -
            genuinely `None`, since its own real construction call never
            named one.
        - element: 'app = create_app("testing")'
          explanation: >
            Runs this project's own real, full setup - both real
            mechanisms converge here, one supplying its own prefix, one
            receiving it from `register_routes`'s own explicit real
            `url_prefix=` argument.
        - element: 'assert bootstrap_rules == ["/api/bootstrap"] / assert machines_rules == ["/api/machines"]'
          explanation: >
            Confirms, for real, both real blueprints ended up with the
            identical kind of working prefix, despite reaching it two
            genuinely different real ways.
    mental_model:
      applicable: false
    execution_trace:
      applicable: false
    cs_lens: >
      This is a **default supplied at one of two real points**: a
      configuration value that can be baked into an object's own real
      construction, or supplied later, by whoever actually uses it.
      Also recognized in: a real Python function's own default argument
      value (set once, at definition) versus a caller passing an
      explicit real value at call time; a real class's own
      `__init__`-time defaults versus a factory function overriding them
      per instance; and, in this project's own domain, a real machine's
      own manufacturer-set default feed rate versus a specific real
      program overriding it for one operation.
    se_lens: >
      The design principle behind supporting both real mechanisms is
      flexibility - a blueprint MEANT to live at one, fixed, real URL
      forever (`bootstrap_bp`) can say so once, at its own definition;
      a blueprint meant to be genuinely reusable at different real
      prefixes (proven directly in this lesson's own next unit) should
      leave that decision to whoever registers it. The real alternative
      not chosen: forcing every real blueprint to declare its own fixed
      prefix at construction time, the way `bootstrap_bp` does; the
      honest, real inconsistency this project's own code actually has,
      proven directly by this unit's own two real checks: 17 of this
      project's own 18 real blueprints rely on the registration-time
      mechanism, and exactly one - `bootstrap_bp` - uses the other, with
      nothing in the code itself explaining why that one, real blueprint
      is different.
    commands:
      - command: backend/.venv/Scripts/python.exe verification/phase-04/lab_blueprints_prefixes.py
        explanation: >
          Runs this as a plain script, from the repository root.
    verification:
      applicable: true
      real_output: |
        real bootstrap_bp.url_prefix (set at Blueprint() construction time): /api/bootstrap
        real machines_bp.url_prefix (nothing set at construction time): None
        Seeding default users...
        real, final bootstrap route(s): ['/api/bootstrap']
        real, final machines route (list endpoint): ['/api/machines']
        two real, different mechanisms reach the identical real outcome - bootstrap_bp bakes its own prefix in at construction time; machines_bp carries none of its own, and gets one only when register_routes(app) passes url_prefix='/api/machines' at registration time
      output_file: verification/phase-04/lab_blueprints_prefixes_output.txt
    connection_to_previous: >
      The previous unit established a blueprint as a real, complete
      module before registration; this unit shows one real detail -
      its own prefix - can be decided at either end of that same real
      handoff.

  - title: "Blueprint Registration - A Reusable Real Template, Not a One-Time Use"
    problem: >
      Every real blueprint in this project is registered exactly once.
      Is registering the identical real `Blueprint` object a SECOND
      time even possible - and if so, under what real condition?
    socratic_prompt:
      - >
        If `app.register_blueprint(bp, url_prefix='/first')` already
        ran once, what would you expect to happen if the identical real
        line ran again, unchanged, against the same real app?
      - >
        Given that a blueprint is a real, reusable module of routes (the
        previous unit's own finding), what real, additional piece of
        information would Flask need from you to let the SAME blueprint
        serve a second, genuinely different real prefix?
    project_change:
      reference_source: >
        No reference counterpart - this project's own real code never
        registers the same blueprint twice; this unit demonstrates the
        real, general mechanism directly.
      files_affected: []
      change_type: none
      location: >
        N/A - a new, standalone script; no existing project structure to
        place it within.
      dependencies: None.
    new_code:
      applicable: true
      intro: >
        The identical real blueprint, registered three real times:
      file: verification/phase-04/lab_blueprints_registration.py
      status: new
      language: python
      code: |
        import sys
        sys.path.insert(0, "backend")

        from flask import Flask, Blueprint

        app = Flask(__name__)
        bp = Blueprint("demo", __name__)


        @bp.route("/x")
        def view():
            return "ok"


        app.register_blueprint(bp, url_prefix="/first")
        print("real first registration -> succeeded, endpoint: demo.view")

        try:
            app.register_blueprint(bp, url_prefix="/second")
            print("real second registration (same name) succeeded (unexpected)")
        except ValueError as e:
            print("real second registration (identical name) raised:", type(e).__name__, "-", str(e))

        app.register_blueprint(bp, url_prefix="/third", name="demo_again")
        print("real third registration (explicit different name) -> succeeded")

        real_rules = sorted((str(r), r.endpoint) for r in app.url_map.iter_rules() if "demo" in r.endpoint)
        for rule, endpoint in real_rules:
            print(f"{rule:15s} -> {endpoint}")

        assert real_rules == [("/first/x", "demo.view"), ("/third/x", "demo_again.view")]
        print("the identical real Blueprint object, registered twice under two different real names, now serves two genuinely separate real URL prefixes - a blueprint is a reusable real template, not a one-time registration")
    updated_project:
      applicable: false
    mechanical_walkthrough:
      applicable: true
      items:
        - element: 'app.register_blueprint(bp, url_prefix="/first")'
          explanation: >
            The real, first registration - succeeds, attaching `bp`'s
            own real route under `/first`, registered internally under
            its own real, default name, `"demo"`.
        - element: 'app.register_blueprint(bp, url_prefix="/second") (inside try/except ValueError)'
          explanation: >
            Attempts the identical real registration again - Flask
            itself refuses, since the real name `"demo"` is already
            taken on this app, raising a genuine `ValueError` naming the
            real fix (`name=`).
        - element: 'app.register_blueprint(bp, url_prefix="/third", name="demo_again")'
          explanation: >
            The real, third registration - supplies the real, explicit
            `name=` Flask's own error message asked for, succeeding
            this time.
        - element: 'assert real_rules == [("/first/x", "demo.view"), ("/third/x", "demo_again.view")]'
          explanation: >
            Confirms, for real, the direct payoff - the identical real
            blueprint object now genuinely serves two, separate, live
            real URL prefixes at once.
    mental_model:
      applicable: false
    execution_trace:
      applicable: false
    cs_lens: >
      This is **instance reuse gated by identity**: the real underlying
      object can be reused freely, but each real, distinct use needs its
      own real, unique name to avoid colliding with an earlier one. Also
      recognized in: a real Python class instantiated multiple times,
      each real instance needing no special naming, contrasted with a
      real module-level singleton, which genuinely can't be "registered"
      twice under the same real name; a real database table alias,
      letting the identical real table be joined against itself twice in
      one real query, under two different real names; and, in this
      project's own domain, the identical real tool assembly definition
      loaded into two different real turret positions, each needing its
      own real, distinct slot identity.
    se_lens: >
      The design principle behind requiring a unique real name per
      registration is that Flask's own real endpoint names
      (`blueprint_name.function_name`, already seen in this curriculum's
      own earlier `app.url_map` work) have to stay genuinely unique
      across the whole real app, since `url_for(...)` and Flask's own
      internal dispatch both rely on that real name resolving to exactly
      one real route. The real alternative not chosen: silently
      allowing a duplicate real name, and letting whichever registration
      happened last simply win; the honest, real value of Flask's own
      strict, real refusal here, proven directly by this unit's own
      real `ValueError`: a genuine naming collision is caught
      immediately, loudly, and by name, rather than silently producing
      two real routes no one could reliably tell apart later.
    commands:
      - command: backend/.venv/Scripts/python.exe verification/phase-04/lab_blueprints_registration.py
        explanation: >
          Runs this as a plain script, from the repository root.
    verification:
      applicable: true
      real_output: |
        real first registration -> succeeded, endpoint: demo.view
        real second registration (identical name) raised: ValueError - The name 'demo' is already registered for this blueprint. Use 'name=' to provide a unique name.
        real third registration (explicit different name) -> succeeded
        /first/x        -> demo.view
        /third/x        -> demo_again.view
        the identical real Blueprint object, registered twice under two different real names, now serves two genuinely separate real URL prefixes - a blueprint is a reusable real template, not a one-time registration
      output_file: verification/phase-04/lab_blueprints_registration_output.txt
    connection_to_previous: >
      The previous unit showed two real ways to set a prefix; this unit
      shows why a blueprint needing a real, unique name matters at all -
      it's what makes registering the same one more than once even
      possible.

  - title: "Application Composition - 18 Real Files, One Real App"
    problem: >
      This project's own real backend has 18 real route files. Does
      `register_routes(app)` alone account for all of them, and how much
      does each one actually contribute to the real, final app?
