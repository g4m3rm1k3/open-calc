      applied transparently beneath every real query; and, in this
      project's own domain, a real shop-wide safety interlock, applying
      the identical real stop condition across every machine, rather
      than each machine's own program implementing it separately.
    se_lens: >
      The design principle is that a real, structural fix - registering
      one, real, central handler - reaches every real route
      automatically, including routes whose own real code never changes
      at all. The real alternative this project's own code would
      otherwise need: hand-editing all 18 real route files to format
      their own real errors identically, a real, repetitive, error-prone
      task Lesson 3.7's own proposed contract already anticipated
