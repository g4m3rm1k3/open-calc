  - title: "Centralized Error Mapping - Closing the Loop From Phase 3"
    problem: >
      Lesson 3.7 proposed a real, minimal error contract and proved it
      against three real, already-cataloged failures - but deliberately
      stopped short of wiring it into this project's own real backend,
      pending exactly the real tools this lesson has now built. Does it
      actually work, applied for real?
    socratic_prompt:
      - >
        `get_machines`'s own real `?type=` crash (Lesson 3.3) is a real
        `AttributeError` - not an `HTTPException` at all. Would the
        previous unit's own real handler, registered only for
        `HTTPException`, catch it?
      - >
        Given that, what real, second, broader handler would this
        lesson need to register to catch both real categories - Flask's
        own known failures, AND a genuinely unexpected real exception -
        together?
    project_change:
      reference_source: >
        Real specimen: `backend/app/routes/machines.py:35-36` (the real
        `?type=` crash, already triggered in Lesson 3.3) and `:48-61`
        (`get_machine`'s own, already-correct real `404`), both read
        again this session.
      files_affected: []
      change_type: none
      location: >
        N/A - a new, standalone script; no existing project structure to
        place it within.
      dependencies: >
        This project's own real, unmodified `create_app` output.
    new_code:
      applicable: true
      intro: >
        Two real handlers together, against this project's own,
        completely unmodified real app:
      file: verification/phase-04/lab_errorhandling_centralized.py
      status: new
      language: python
      code: |
        import sys
        sys.path.insert(0, "backend")

        from app import create_app, db
        from app.models.machine import Machine
        from flask import jsonify
        from werkzeug.exceptions import HTTPException

        app = create_app("testing")
        app.config["PROPAGATE_EXCEPTIONS"] = False


        @app.errorhandler(HTTPException)
        def handle_http_exception(e):
            return jsonify({"success": False, "code": e.name.upper().replace(" ", "_"), "message": e.description}), e.code


        @app.errorhandler(Exception)
        def handle_any_exception(e):
            return jsonify({"success": False, "code": type(e).__name__.upper(), "message": str(e)}), 500


        with app.app_context():
            machine = Machine(id="M-TEST-001", name="Test Mill", category="mill", sub_type="3_axis", status="available")
            db.session.add(machine)
            db.session.commit()

            client = app.test_client()

            r_crash = client.get("/api/machines?type=3-axis")
            print("get_machines's own real, already-documented ?type= crash -> status:", r_crash.status_code, "Content-Type:", r_crash.content_type, "body:", r_crash.get_json())

            r_missing = client.get("/api/machines/DOES-NOT-EXIST")
            print("get_machine's own, already-correct, JSON 404 -> status:", r_missing.status_code, "Content-Type:", r_missing.content_type, "body:", r_missing.get_json())

            assert r_crash.status_code == 500
            assert r_crash.content_type == "application/json"
            assert r_crash.get_json()["code"] == "ATTRIBUTEERROR"
            assert r_missing.status_code == 404
            assert r_missing.get_json() == {"error": "Machine not found"}
            print("two real handlers, registered once, with zero changes to machines.py's own real code - the real, already-documented AttributeError crash from Phase 3 is now real, consistent JSON, and every real route that already returned its own correct JSON keeps doing exactly what it already did")
    updated_project:
      applicable: false
    mechanical_walkthrough:
      applicable: true
      items:
        - element: '@app.errorhandler(HTTPException) def handle_http_exception(e): ...'
          explanation: >
            Registered first - catches every real, Flask/Werkzeug-known
            failure, the identical real handler the previous unit
            already proved.
        - element: '@app.errorhandler(Exception) def handle_any_exception(e): ...'
          explanation: >
            Registered second - a real, genuinely broader net, catching
            any real exception `HTTPException`'s own, narrower handler
            wouldn't - including this project's own real
            `AttributeError`, which is not an `HTTPException` at all.
        - element: 'r_crash = client.get("/api/machines?type=3-axis")'
          explanation: >
            The identical real request that first produced an
            uncaught, real, HTML `500` back in Lesson 3.3 -
            `get_machines`'s own real code still crashes identically;
            what changed is only what happens to that real crash on its
            way back out.
        - element: 'r_missing = client.get("/api/machines/DOES-NOT-EXIST")'
          explanation: >
            A real, control case - `get_machine`'s own code already
            returns a real, deliberate `404` (no exception raised at
            all), so neither new real handler ever fires for it; its
            own real, existing behavior is completely unaffected.
        - element: 'assert r_missing.get_json() == {"error": "Machine not found"}'
          explanation: >
            Confirms, for real, that centralizing error handling for
            genuine failures didn't accidentally change a route that was
            never failing to begin with.
    mental_model:
      applicable: true
      diagram: |
        client.get("/api/machines?type=3-axis")
              |
              v
        get_machines's own real code raises AttributeError
              |
              v
        not an HTTPException -> falls through to @app.errorhandler(Exception)
              |
              v
        real, structured JSON 500 (this lesson's own fix)

        client.get("/api/machines/DOES-NOT-EXIST")
              |
              v
        get_machine's own real code returns jsonify({'error': ...}), 404
              |
              v
        no exception raised at all -> neither new handler ever runs
              |
              v
        the identical, already-correct real JSON 404 (unchanged)
    execution_trace:
      applicable: false
    cs_lens: >
      This is **layered exception handling, most-specific first**: a
      narrower real handler (`HTTPException`) and a broader real
      fallback (`Exception`), together covering every real case without
      either one interfering with the other. Also recognized in: a real
      `try`/`except SpecificError`/`except Exception` chain, checked in
      real, declared order; a real logging framework's own handler
      chain, escalating from a specific real logger to a real, root
      catch-all; and, in this project's own domain, a real quality
      escalation path - a specific real inspector handling a known real
      issue type, with an unrecognized real issue escalating to a real
      supervisor instead.
    se_lens: >
      The design principle is that centralized, layered error handling
      closes an entire real category of gap in one, real, small change -
      proven directly by this unit's own real run, which fixes the
      identical real bug Lesson 3.3 first triggered, without touching
      `machines.py` at all. The real alternative this project's own
      code would otherwise need: a real `try`/`except` block added
      inside `get_machines` itself, and another inside every other real
      route that might someday raise something unexpected - real,
      repetitive work this lesson's own two, centralized handlers
      replace entirely. The honest, real limitation this unit doesn't
      solve: `get_machines`'s own real `?type=` filter is still
      genuinely broken - it still crashes on every real attempt to use
      it; this lesson only closes the real GAP in how that crash gets
      reported, exactly the real, deliberate boundary Lesson 3.7 already
      drew between designing a consistent error contract and fixing the
      underlying real bugs that produce errors in the first place.
    commands:
      - command: backend/.venv/Scripts/python.exe verification/phase-04/lab_errorhandling_centralized.py
        explanation: >
          Runs this as a plain script, from the repository root.
    verification:
      applicable: true
      real_output: |
        Seeding default users...
        get_machines's own real, already-documented ?type= crash -> status: 500 Content-Type: application/json body: {'code': 'ATTRIBUTEERROR', 'message': "type object 'Machine' has no attribute 'type'", 'success': False}
        get_machine's own, already-correct, JSON 404 -> status: 404 Content-Type: application/json body: {'error': 'Machine not found'}
        two real handlers, registered once, with zero changes to machines.py's own real code - the real, already-documented AttributeError crash from Phase 3 is now real, consistent JSON, and every real route that already returned its own correct JSON keeps doing exactly what it already did
      output_file: verification/phase-04/lab_errorhandling_centralized_output.txt
    connection_to_previous: >
      The previous unit fixed one real category of gap; this unit
      closes the lesson - and this entire phase - by fixing the other,
      genuinely more severe one, side by side, with the two real
