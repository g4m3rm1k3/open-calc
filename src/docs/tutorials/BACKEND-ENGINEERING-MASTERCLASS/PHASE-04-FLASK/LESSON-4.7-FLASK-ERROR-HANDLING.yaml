number: "4.7"
title: "Flask Error Handling"
path_note: >
  File paths under backend/... refer to the real manufacturing-platform
  repository. Paths under verification/... refer to that same
  repository's verification folder.

what_you_will_build: >
  Three real, run checks closing this phase - and finally closing a
  real thread this curriculum left open at the end of Phase 3: a
  minimal, real exception handler, proving `@app.errorhandler` only
  intercepts the exact real exception type it's registered for; a real
  handler for `HTTPException`, retrofitted onto this project's own,
  completely unmodified real app, converting the real, routing-level
  `404` this curriculum already found (Lesson 4.4) from HTML into
  consistent JSON; and, closing the lesson, two real handlers together,
  turning `get_machines`'s own real, already-documented `?type=` crash
  (first triggered in Lesson 3.3) from an inconsistent HTML `500` into
  real, structured JSON - with zero changes to a single line of
  `machines.py` itself.

what_you_need_to_know_first: >
  What the real HTTP status codes and JSON error shapes this project's
  own backend already returns look like; what `current_app` and
  application context are; what the real, proposed, minimal error
  contract this curriculum designed (but never wired in) looks like.

terms:
  - name: exception handler
    definition: >
      A real function, registered with `@app.errorhandler(ExceptionType)`,
      that Flask calls instead of its own default crash page whenever a
      real exception of that exact type (or a real subclass of it) is
      raised anywhere during a real request. It exists so a real
      application can intercept a specific real category of failure and
      decide, itself, how to respond - rather than always falling back
      to Flask's own generic behavior.
  - name: centralized error mapping
    definition: >
      Registering a small, real, fixed set of exception handlers - one
      per real category of failure - so every real error this
      project's own backend can produce passes through the identical
      real, consistent transformation, no matter which of the 18 real
      route files actually raised it. It exists as the real, structural
      fix for the exact inconsistency this curriculum's own Phase 3
      closing lesson could only catalog and propose, never actually
      apply.

objects_and_methods:
  - name: app.errorhandler
    what_it_is: >
      The real, existing Flask decorator this lesson uses to register
      every one of its own real exception handlers.
    implementation: >
      `Flask.errorhandler(code_or_exception)` returns a real decorator;
      applied to a function, it registers that function to run whenever
      a real exception matching the given real type (or a real,
      registered HTTP status code) occurs during request handling -
      confirmed directly this session to work correctly even when
      applied to an `app` object `create_app()` already fully built,
      with every one of its 18 real blueprints already registered.
    its_use: >
      This lesson registers handlers for a real, custom exception type,
      for Werkzeug's own real `HTTPException`, and for the real, generic
      `Exception` base class.
    type: A real method on Flask's own `Flask` class.
    responsibility: >
      Recording which real function should handle which real category
      of failure, checked by Flask itself the moment a real exception
      actually propagates out of a view function.
    depends_on: >
      A real exception class, or a real, registered HTTP status code.
    connects_to: >
      This lesson's own third unit registers two of these together,
      directly on this project's own real, unmodified `app` object,
      retroactively changing how already-existing real routes behave on
      failure.
    shape: >
      Takes a real exception class (or `int` status code) in; returns a
      real decorator that, applied to a function, registers it as that
      real category's own handler.

  - name: HTTPException (Werkzeug's own real base class)
    what_it_is: >
      The real, shared base class every one of Flask's own built-in
      error responses - `404`, `405`, `415`, and others this curriculum
      has already triggered - is actually an instance of.
    implementation: >
      `werkzeug.exceptions.HTTPException` carries a real `.code`
      (the real HTTP status), `.name` (a real, short label like
      `"Not Found"`), and `.description` (a real, human-readable
      explanation) - registering a single real handler for this one
      base class intercepts every real subclass, including the real,
      routing-level `404` this curriculum already found bypassing this
      project's own application code entirely (Lesson 4.4).
    its_use: >
      This lesson registers exactly one real handler for it, and proves
      that single real registration retroactively fixes a real,
      previously-inconsistent response - with no change to the route
      that produces it.
    type: A real class from Werkzeug, the library Flask itself is built
      on.
    responsibility: >
      Representing every real, "normal" HTTP failure Flask or Werkzeug
      itself already knows how to name - as opposed to a genuinely
      unexpected real exception, which is never an instance of it.
    depends_on: Nothing; raised internally by Flask/Werkzeug itself.
    connects_to: >
      This lesson's own second and third units both register a real
      handler for it; its own real `.code`/`.name`/`.description`
      attributes are exactly what those handlers read to build a real,
      consistent JSON response.
    shape: >
      Carries real `.code: int`, `.name: str`, and `.description: str`
      attributes on every real instance.

concept_units:
  - title: "Exception Handlers - Matched by Real, Exact Type"
    problem: >
      `@app.errorhandler(RealDomainError)`, registered for one specific
      real exception class, is applied to an app that can raise many
      genuinely different kinds of real exception. Does it intercept
      all of them, or only its own?
    socratic_prompt:
      - >
        If a real view function raises `ValueError`, and the only real
        handler registered is for a completely unrelated real exception
        class, would you expect Flask to somehow still route it through
        that handler, or fall back to its own default behavior?
      - >
        Given that a real exception handler is matched by real type,
        what real, structural fact would have to be true for ONE real
        handler to catch several genuinely different kinds of failure at
        once?
    project_change:
      reference_source: >
        No reference counterpart - this unit demonstrates a real,
        general Flask mechanism directly, using a small, real,
        standalone app, since this project's own real backend never
        registers a single exception handler anywhere today.
      files_affected: []
      change_type: none
      location: >
        N/A - a new, standalone script; no existing project structure to
        place it within.
      dependencies: None.
    new_code:
      applicable: true
      intro: >
        One real, registered exception type, next to one that isn't:
      file: verification/phase-04/lab_errorhandling_basic.py
      status: new
      language: python
      code: |
        import sys
        sys.path.insert(0, "backend")

        from flask import Flask, jsonify

        app = Flask(__name__)


        class RealDomainError(Exception):
            pass


        @app.errorhandler(RealDomainError)
        def handle_real_domain_error(e):
            return jsonify({"success": False, "message": str(e)}), 400


        @app.route("/raises-handled")
        def raises_handled():
            raise RealDomainError("this real exception type has a real handler registered")


        @app.route("/raises-unhandled")
        def raises_unhandled():
            raise ValueError("this real exception type has no handler registered at all")


        app.config["PROPAGATE_EXCEPTIONS"] = False
        client = app.test_client()

        r_handled = client.get("/raises-handled")
        print("a real, registered exception type -> status:", r_handled.status_code, "body:", r_handled.get_json())

        r_unhandled = client.get("/raises-unhandled")
        print("a real, UNregistered exception type -> status:", r_unhandled.status_code, "Content-Type:", r_unhandled.content_type)

        assert r_handled.status_code == 400
        assert r_handled.get_json() == {"success": False, "message": "this real exception type has a real handler registered"}
        assert r_unhandled.status_code == 500
        assert "html" in r_unhandled.content_type
        print("@app.errorhandler(RealDomainError) only intercepts the exact real exception type (or a real subclass of it) it was registered for - a genuinely different real exception type still falls through to Flask's own generic real crash page")
    updated_project:
      applicable: false
    mechanical_walkthrough:
      applicable: true
      items:
        - element: 'class RealDomainError(Exception): pass'
          explanation: >
            A real, custom exception type - deliberately simple, so this
            unit's own point stays about matching, not about what a
            real domain exception should actually contain.
        - element: '@app.errorhandler(RealDomainError) def handle_real_domain_error(e): return jsonify(...), 400'
          explanation: >
            Registers a real handler specifically for this real type -
            `e` is the real, actual exception instance Flask caught,
            available to build a real, informative response from.
        - element: 'raises_unhandled(): raise ValueError(...)'
          explanation: >
            Raises a real, genuinely different exception type - no
            handler matches it, so Flask's own default real behavior
            takes over, exactly as if no handler existed anywhere.
        - element: 'client = app.test_client()'
          explanation: >
            Builds one real `FlaskClient` - this lesson's own first
            construction of it; every later unit in this lesson builds
            its own fresh copy the same way.
        - element: 'assert r_unhandled.status_code == 500 / assert "html" in r_unhandled.content_type'
          explanation: >
            Confirms, for real, that registering ONE handler doesn't
            magically catch everything - real type-matching is strict.
    mental_model:
      applicable: false
    execution_trace:
      applicable: false
    cs_lens: >
      This is **type-based exception dispatch**: Flask walks a real
      exception's own class hierarchy, checking for a registered real
      handler at each level, the identical real mechanism a plain Python
      `try`/`except SpecificError` clause uses. Also recognized in: a
      real, ordinary Python `try` block with multiple `except` clauses,
      each catching a different real exception type; a real GUI
      framework's own event-handler registration, matched by real event
      type; and, in this project's own domain, a machine control's own
      real alarm-code table, mapping specific real fault conditions to
      specific real recovery procedures, with an unrecognized real fault
      falling through to a generic real E-stop.
    se_lens: >
      The design principle behind type-based matching is letting an
      application respond differently to genuinely different real
      categories of failure - a real validation error deserves a
      different real response than a real database outage. The real
      alternative not chosen anywhere in this project's own code today:
      registering any exception handler at all; the honest, real
      starting point this lesson's own later units directly address,
      proven by this unit's own real, unhandled case: this project's
      own real backend, exactly as it stands, would treat every single
      real, unanticipated exception - not just the one this curriculum
      already found - with Flask's own generic, real HTML crash page.
    commands:
      - command: backend/.venv/Scripts/python.exe verification/phase-04/lab_errorhandling_basic.py
        explanation: >
          Runs this as a plain script, from the repository root.
    verification:
      applicable: true
      real_output: |
        a real, registered exception type -> status: 400 body: {'message': 'this real exception type has a real handler registered', 'success': False}
        a real, UNregistered exception type -> status: 500 Content-Type: text/html; charset=utf-8
        @app.errorhandler(RealDomainError) only intercepts the exact real exception type (or a real subclass of it) it was registered for - a genuinely different real exception type still falls through to Flask's own generic real crash page
      output_file: verification/phase-04/lab_errorhandling_basic_output.txt
    connection_to_previous: >
      This is the lesson's first unit - it establishes the basic real
      mechanic every later unit in this lesson builds directly on top
      of.

  - title: "API Errors - Fixing a Real Gap With Zero Changes to Its Own Route"
    problem: >
      Lesson 4.4 found a real, routing-level `404` - Werkzeug's own
      `<int:...>` converter rejecting `"not-a-number"` before
      `delete_notification` ever ran - returning real HTML instead of
      this project's own real JSON shape. Can a single, real, centralized
      handler fix that, without touching `notifications.py` at all?
    socratic_prompt:
      - >
        That real, routing-level `404` never reaches any of this
        project's own real view functions. Given that, could a fix
        written INSIDE `delete_notification`'s own real code ever
        actually catch it?
      - >
        `werkzeug.exceptions.HTTPException` is the real, shared base
        class behind every one of Flask's own built-in error pages.
        Would registering one real handler for it reach a failure that
        never even reaches application code?
    project_change:
      reference_source: >
        Real specimen: `backend/app/routes/notifications.py:66-76`
        (`delete_notification`), already studied in Lesson 4.4, read
        again this session - this unit changes none of it.
      files_affected: []
      change_type: none
      location: >
        N/A - a new, standalone script; no existing project structure to
        place it within.
      dependencies: >
        This project's own real, unmodified `create_app` output.
    new_code:
      applicable: true
      intro: >
        One real handler, registered directly on this project's own
        real, already-built app - the identical real routing-level
        failure Lesson 4.4 found, re-run:
      file: verification/phase-04/lab_errorhandling_api_errors.py
      status: new
      language: python
      code: |
        import sys
        sys.path.insert(0, "backend")

        from app import create_app
        from flask import jsonify
        from werkzeug.exceptions import HTTPException

        app = create_app("testing")


        @app.errorhandler(HTTPException)
        def handle_http_exception(e):
            return jsonify({"success": False, "code": e.name.upper().replace(" ", "_"), "message": e.description}), e.code


        with app.app_context():
            client = app.test_client()

            r_routing_404 = client.delete("/api/notifications/not-a-number")
            print("routing-level 404 (Werkzeug's own <int:...> rejection) -> status:", r_routing_404.status_code, "Content-Type:", r_routing_404.content_type, "body:", r_routing_404.get_json())

            assert r_routing_404.status_code == 404
            assert r_routing_404.content_type == "application/json"
            print("with zero changes to notifications.py's own real code, the identical real routing-level 404 - real HTML in an earlier lesson - is now real, consistent JSON, because HTTPException is the real, shared base class every one of Flask's own built-in error pages (404, 405, 415, and more) actually raises")
    updated_project:
      applicable: false
    mechanical_walkthrough:
      applicable: true
      items:
        - element: 'app = create_app("testing")'
          explanation: >
            Builds this project's own real, complete, unmodified app -
            all 18 real blueprints, exactly as Lesson 4.5 studied them,
            already attached.
        - element: '@app.errorhandler(HTTPException) def handle_http_exception(e): return jsonify({...}), e.code'
          explanation: >
            Registered AFTER the app is already fully built - proof, per
            this lesson's own real Header entry, that error-handler
            registration order relative to blueprint registration
            doesn't matter; Flask checks for a matching real handler at
            request time, not at registration time.
        - element: 'r_routing_404 = client.delete("/api/notifications/not-a-number")'
          explanation: >
            The identical real request Lesson 4.4 used to prove this
            failure never reaches `delete_notification`'s own code at
            all - still true here; what's different is what happens to
            it on the way back out.
        - element: 'assert r_routing_404.content_type == "application/json"'
          explanation: >
            Confirms, for real, the fix actually took effect - the exact
            real gap Lesson 4.4 found is closed, with nothing in
            `notifications.py` touched.
    mental_model:
      applicable: false
    execution_trace:
      applicable: false
    cs_lens: >
      This is **cross-cutting concern handling**: a real behavior
      (consistent error formatting) that applies uniformly across every
      real route, implemented once, centrally, rather than repeated
      inside each one. Also recognized in: a real web framework's own
      middleware layer, applying real logging or real authentication
      checks to every request without each route implementing it
