closing:
  connect_the_pieces: >
    One real, custom exception type, caught by its own real, registered
    handler, while a genuinely different real type still fell through to
    Flask's own default page (exception handlers, matched by real
    type). One real handler for `HTTPException`, registered on this
    project's own completely unmodified real app, converting the real,
    routing-level `404` Lesson 4.4 found - real HTML - into real,
    consistent JSON (API errors, fixed with zero route changes). And,
    closing both this lesson and Phase 4 itself, that same real handler
    joined by one more, broader one, together turning `get_machines`'s
    own real, already-documented `?type=` crash - first triggered all
    the way back in Lesson 3.3 - from an inconsistent real HTML `500`
    into the exact real, structured JSON shape Lesson 3.7 proposed but
    never got to actually use (centralized error mapping) - while the
    one real route that was already correct, `get_machine`'s own `404`,
    kept behaving exactly as it always had.
