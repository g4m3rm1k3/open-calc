    se_lens: >
      The design principle is declaring uniqueness on exactly the
      combination that actually needs to be one-of-a-kind, rather than
      on either column alone (which would be too strict - it would
      wrongly forbid a real machine from ever appearing in more than one
      real pairing) or on neither (too loose - nothing would stop the
      identical real pairing from being recorded twice). The real
      alternative NOT chosen - `unique=True` on `machine_id` alone, or on
      `cam_file_id` alone - would actively break this project's own real,
      intended use: one real CAM file proven on several real machines,
      one real machine running several real CAM files over its
      lifetime. The honest cost of getting a composite `UNIQUE`
      constraint's own column list wrong: it is a schema-level decision,
      not adjustable per-row, and this project's own real primary key
      (`id`) still had to be declared separately, since a composite
      `UNIQUE` constraint and a primary key are two different real
      declarations serving two different real jobs.
