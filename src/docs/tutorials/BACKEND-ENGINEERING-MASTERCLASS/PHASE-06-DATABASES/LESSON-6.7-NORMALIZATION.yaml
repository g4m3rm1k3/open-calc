closing:
  connect_the_pieces: >
    Follow the real word `"urgent"` and the real role `"quality"` through
    every unit. As a raw substring inside `Part.tags`'s own real,
    comma-separated string, `"urgent"` produces a wrong answer the
    instant a naively-matching lookup runs against it - 1NF's own
    atomic-value half, broken. As a column-name prefix instead of real
    data, `"quality"` is one of exactly three roles
    `MachineCAMPairing`'s own real schema can ever hold, because adding a
    fourth means adding new columns, not new rows - 1NF's own repeating-
    group half, broken the same way, a different shape. Both failures
    converge on the identical real cost the third unit names directly:
    correcting either one means finding every real copy by hand, with
    nothing in the schema itself confirming all of them were found - an
    update anomaly. And the fourth unit shows the classical progression
    does not stop at 1NF: even a real, correctly-designed composite key
    like `part_tags`'s own `(part_id, tag_id)` could, in principle, still
    carry a 2NF or 3NF violation if it held the wrong non-key attribute -
    it simply happens not to, in this project's own real, current
    schema, which this lesson says honestly rather than inventing a
    violation where none exists.
  next_lesson_pointer: >
    Next, the opposite real question gets asked directly: `CAMFile.version`'s
    own real, stored, computed value - already redundant with the real
    `part_rev` and `cam_rev` columns sitting right next to it - looks
    exactly like this lesson's own kind of violation, and yet was chosen
    deliberately. What makes redundancy like that a legitimate,
    documented tradeoff instead of an anomaly waiting to happen.
