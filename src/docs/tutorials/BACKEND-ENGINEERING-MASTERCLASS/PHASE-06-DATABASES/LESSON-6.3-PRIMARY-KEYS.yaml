number: "6.3"
title: "Primary Keys"
path_note: >
  File paths under backend/... refer to the real manufacturing-platform
  repository. Paths under verification/... refer to that same
  repository's verification folder.

what_you_will_build: >
  Four small, real, throwaway scripts naming what a primary key actually
  has to guarantee - uniqueness, identity, and where a real value for it
  comes from - directly against three genuinely different real strategies
  this project's own schema already mixes: `backend/app/models/tag.py`'s
  own `Tag.id`, a database-generated auto-increment integer with zero
  real-world meaning; `backend/app/models/machine.py` and
  `backend/app/models/part.py`'s own app-generated, meaningful string
  ids (`'m1'`, `'P-1234567'`); and `part_tags`' own real composite
  primary key, `(part_id, tag_id)`, which needs no surrogate at all.

what_you_need_to_know_first: >
  Plain dict and list literals; raising and catching an exception with
  `try`/`except`; that this project's own real `Machine` and `Part`
  models already carry an `id` column, and `Tag`, a separate `id`; f-strings.

terms:
  - name: uniqueness
    definition: >
      The guarantee that no two rows in a relation ever hold the same
      value for a given column - specifically the one a primary key is
      declared on. It exists as a distinct, checkable property because a
      column can hold real, meaningful values (a machine's `name`, a
      part's `description`) without anything ever enforcing that no two
      rows share one - uniqueness has to be a deliberate, separate
      guarantee, never a side effect of a column simply existing.
  - name: identity
    definition: >
      The property that one specific row can be reliably picked out as
      "the same row" across every later change to any of its OTHER
      values - a row whose `name` and `status` both change is still the
      identical row, if and only if the value used to identify it never
      changed along with them. It exists as a concept distinct from
      uniqueness because a value can be unique at every moment in time
      and still fail at identity, if that same value is ever allowed to
      change - the instant it does, whatever depended on it can no
      longer tell "this changed" apart from "this is gone, and something
      unrelated just appeared."
  - name: surrogate key
    definition: >
      A primary key value that has no real-world meaning at all - it
      exists purely to identify a row, generated by the database or
      application itself (an auto-incrementing counter, a generated
      code) rather than derived from any real-world fact about the row.
      It exists because a value invented purely for identification can
      be guaranteed never to need changing for a real-world reason - a
      tag's own generated `id` never has to change just because someone
      corrects the tag's `name`.
  - name: natural key
    definition: >
      A primary key built from data that already has real-world meaning
      - a value (or combination of values) the row would already need to
      store anyway, used directly as its identifier instead of adding a
      separate, invented one. It exists as the alternative to a
      surrogate key: when a real combination of already-meaningful
      values is already guaranteed unique on its own (this project's own
      real `part_tags` table, keyed on the real pairing of an actual
      `part_id` and an actual `tag_id`), inventing a separate surrogate
      value to identify it adds a value with no purpose a natural key
      does not already serve.

objects_and_methods: []

concept_units:
  - title: "Uniqueness - What a Key Actually Promises, and What It Does Not"
    problem: >
      `backend/app/models/machine.py`'s real `Machine.id` is declared
      `primary_key=True`; its real `name` column is not. If two real
      machines were given the identical `name`, would anything in a
      schema shaped this way ever notice - and does that answer change
      if two machines were instead given the identical `id`?
    socratic_prompt:
      - >
        If a real `Machine.id` column enforces uniqueness and a real
        `Machine.name` column does not, what should happen, concretely,
        the instant a second machine is added using an `id` that already
        belongs to an existing one?
      - >
        Before running the lab below: does anything stop two separate
        machines from sharing the exact same `name`? Should it?
    project_change:
      reference_source: >
        Real, verbatim, read this session, `backend/app/models/machine.py:49-50`:
        ```
        id = db.Column(db.String(50), primary_key=True)
        name = db.Column(db.String(100), nullable=False)
        ```
        Real, already-existing evidence that this project declares `id`
        as the one column carrying `primary_key=True` - and declares
        `name` with no uniqueness guarantee at all. The lab below models
        both real behaviors directly in plain Python, since enforcing
        this for real is SQL's own later job.
      files_affected:
        - path: verification/phase-06/lab_uniqueness.py
          status: new
      change_type: add
      location: N/A - a new, standalone throwaway script; no existing project structure to place it within.
      dependencies: None beyond plain Python.
    new_code:
      applicable: true
      intro: >
        A real, minimal machine-adding function that checks only `id`
        for a collision, exactly matching what this project's own schema
        actually enforces and what it does not:
      file: verification/phase-06/lab_uniqueness.py
      status: new
      language: python
      code: |
        machines = []


        def add_machine(machine_id, name):
            if any(m["id"] == machine_id for m in machines):
                raise ValueError(f"machine id {machine_id!r} already exists - rejected")
            machines.append({"id": machine_id, "name": name})
            print(f"added machine id={machine_id!r} name={name!r}")


        add_machine("m1", "Haas VF-2")
        add_machine("m2", "Haas VF-2")  # same name as m1 - nothing here checks name at all
        print(f"machines now: {machines}")

        try:
            add_machine("m1", "Okuma Genos")  # same id as the first machine
        except ValueError as e:
            print(f"rejected: {e}")
    updated_project:
      applicable: false
    mechanical_walkthrough:
      applicable: true
      items:
        - element: 'any(m["id"] == machine_id for m in machines)'
          explanation: >
            A generator expression (basic Python, already established
            vocabulary) feeding the builtin `any(...)`, which returns
            `True` the instant one real match is found, without
            checking the rest of `machines`. This is the ENTIRE
            uniqueness check this lab performs - and it checks `id`
            only, on purpose, mirroring exactly what `Machine.id`'s own
            real `primary_key=True` declares and what `Machine.name`
            does not.
        - element: "raise ValueError(...)"
          explanation: >
            Basic Python exception-raising, used here as the concrete
            stand-in for what a real, enforced `UNIQUE`/primary-key
            constraint does at the database level: refuse the write
            outright, the instant a real collision is detected, rather
            than silently accepting it.
        - element: 'add_machine("m2", "Haas VF-2")'
          explanation: >
            Succeeds without incident - `"Haas VF-2"` already belongs to
            `m1`, and nothing in `add_machine` checks `name` at all. This
            is the direct, observable proof that uniqueness is a
            property of a SPECIFIC declared column, never a property
            data automatically has just by existing in a row.
        - element: 'try: add_machine("m1", "Okuma Genos") except ValueError as e:'
          explanation: >
            Basic Python exception handling. Calling `add_machine` again
            with the already-used `id`, `"m1"`, hits the real check
            above and raises - caught here only so this lab's own
            output can show the rejection message rather than crashing
            the whole script.
    mental_model:
      applicable: false
    execution_trace:
      applicable: false
    cs_lens: >
      This is **uniqueness**: a specific, declared, enforced guarantee
      that a given column never repeats across rows - never an automatic
      property of data simply existing. Also recognized in: a `UNIQUE`
      constraint on a real SQL column, enforced only where it is actually
      declared; a Python `set`, enforcing uniqueness for every member,
      unlike a plain `list`, covered directly in this curriculum's own
      Relational Model lesson; an email address required to be unique
      per account on a signup form, while a display name is not; and, in
      this project's own domain, two real machines legitimately sharing
      an identical `name` (a shop with two identical "Haas VF-2" models)
      while never legitimately sharing the same real `id`.
    se_lens: >
      The design principle is declaring uniqueness deliberately, on
      exactly the column meant to carry it, rather than assuming any
      column that "looks like an identifier" already has it. The real
      alternative NOT chosen here - checking every column for
      collisions, or none at all - either wastes real work enforcing a
      guarantee nothing actually needs (two machines are allowed to
      share a name) or silently permits exactly the collision a real
      primary key exists to prevent. The honest cost of this lab's own
      narrow check: it protects `id` alone; a real machine's `name`
      colliding is left completely unguarded, exactly as this project's
      own real schema currently leaves it.
    commands:
      - command: python verification/phase-06/lab_uniqueness.py
        explanation: >
          Runs the lab from the manufacturing-platform repository root;
          no flags needed.
    verification:
      applicable: true
      real_output: |
        added machine id='m1' name='Haas VF-2'
        added machine id='m2' name='Haas VF-2'
        machines now: [{'id': 'm1', 'name': 'Haas VF-2'}, {'id': 'm2', 'name': 'Haas VF-2'}]
        rejected: machine id 'm1' already exists - rejected
      output_file: verification/phase-06/lab_uniqueness_output.txt
    connection_to_previous: >
      This is the lesson's first unit - it establishes uniqueness as a
      deliberately-scoped guarantee, which the next unit builds on by
      asking whether uniqueness alone is enough to make a good primary
      key.

  - title: "Identity - Staying the Same Row While Everything Else Changes"
    problem: >
      `backend/app/models/machine.py`'s own real `updated_at` column,
      with `onupdate=datetime.utcnow`, exists specifically because a
      machine's other fields - its `status`, potentially its `name` -
      are expected to change over its lifetime. If a machine's `name`
      changed today, would it still be recognizable, by anything that
      referenced it earlier, as the same machine?
    socratic_prompt:
      - >
        If a machine's real `id` never changes but its `name` does, is
        it still "the same machine" to anything that stored a reference
        to it earlier? What if `name` had been used as that reference
        instead of `id`?
      - >
        The previous unit's lab already showed `id` uniquely identifies
        a machine at one moment. Does staying unique at every single
        moment automatically mean it also stays a reliable way to say
        "this is the same one as before"?
    project_change:
      reference_source: >
        Real, verbatim, read this session, `backend/app/models/machine.py:85-86`:
        ```
        created_at = db.Column(db.DateTime, default=datetime.utcnow)
        updated_at = db.Column(db.DateTime, default=datetime.utcnow, onupdate=datetime.utcnow)
        ```
        Real, already-existing evidence that this project expects a
        machine's own fields to change after creation - `updated_at`
        exists specifically to record that a change happened.
        `Machine.id` itself, by contrast, has no `onupdate` and is never
        reassigned anywhere in this project's real code - the lab below
        demonstrates directly why that asymmetry matters.
      files_affected:
        - path: verification/phase-06/lab_identity.py
          status: new
      change_type: add
      location: N/A - a new, standalone throwaway script; no existing project structure to place it within.
      dependencies: None beyond plain Python.
    new_code:
      applicable: true
      intro: >
        One machine dict, mutated twice - its `name` and `status` both
        change, its `id` never does - followed by a direct look at what
        would happen if `name` had been the thing used to track it
        instead:
      file: verification/phase-06/lab_identity.py
      status: new
      language: python
      code: |
        machine = {"id": "m1", "name": "Haas VF-2", "status": "available"}
        print(f"before: {machine}")

        machine["name"] = "Haas VF-2 (Bay 3)"  # renamed
        machine["status"] = "down"  # status changed
        print(f"after:  {machine}")

        print(f"still the same machine? id unchanged: {machine['id'] == 'm1'}")

        old_name_key = "Haas VF-2"
        new_name_key = "Haas VF-2 (Bay 3)"
        print(f"if 'name' had been used as the key instead: {old_name_key!r} now refers to nothing at all - looks like that machine vanished and an unrelated new one, {new_name_key!r}, appeared")
    updated_project:
      applicable: false
    mechanical_walkthrough:
      applicable: true
      items:
        - element: 'machine["name"] = "Haas VF-2 (Bay 3)" / machine["status"] = "down"'
          explanation: >
            Ordinary dict key assignment (basic Python), mutating two
            fields of the SAME dict object in place - `machine` is never
            replaced or re-created, only changed, which is exactly what
            "the same row, with new values" means in practice.
        - element: "machine['id'] == 'm1'"
          explanation: >
            A basic-Python equality check, confirming the one value that
            was never touched by either mutation above. This is the
            entire real mechanism behind identity: nothing clever
            happens to preserve it - it is preserved only because
            nothing in this lab ever assigned to `machine["id"]`.
        - element: "old_name_key / new_name_key"
          explanation: >
            Two plain strings modeling what a lookup keyed on `name`
            would have held before and after the rename. Nothing here
            actually performs such a lookup - the point is that
            `old_name_key`, `"Haas VF-2"`, is now just an ordinary string
            with no live connection to `machine` at all, since the real
            `machine` dict no longer holds that value anywhere.
    mental_model:
      applicable: false
    execution_trace:
      applicable: true
      shape: timing
      lines:
        - >
          `machine = {...}` - one real dict object is created, holding
          `id`, `name`, and `status`.
        - >
          `machine["name"] = "Haas VF-2 (Bay 3)"` - the SAME dict object
          is mutated; `id` is untouched.
        - >
          `machine["status"] = "down"` - the SAME dict object is mutated
          again; `id` is still untouched.
        - >
          `machine['id'] == 'm1'` evaluates `True` - proof that across
          two real mutations, the one value nothing ever assigned to is
          the one value that stayed constant, which is the entire real
          mechanism behind this unit's own claim about identity.
    cs_lens: >
      This is **identity** as distinct from mere equality: whether a
      thing observed at two different times is "the same thing," versus
      whether two values happen to be equal right now. Also recognized
      in: a person's passport number staying fixed across a legal name
      change, while their name itself does not; a file's own inode
      number on a Unix filesystem staying constant across a `mv` rename,
      even though the filename changes completely; a variable's own
      memory identity in Python (`id(obj)`), which stays fixed while the
      object's own attributes are freely mutated; and, in this project's
      own domain, a real machine being physically relocated and renamed
      for a new bay, while every historical CAM-file pairing and
      maintenance record referencing its `id` must still resolve to the
      identical, real machine.
    se_lens: >
      The design principle is picking, for identity, a value that never
      has a real-world reason to change - which is exactly why this
      project's own schema uses a stable `id` for that job and leaves
      `name` free to be edited without consequence. The real alternative
      NOT chosen - using a mutable, meaningful field like `name` as the
      thing other records reference - is shown directly failing in this
      lab's own final two lines: the moment such a field changes,
      anything that referenced the OLD value has no way to find the
      SAME row again; it looks exactly like a deletion followed by an
      unrelated insertion. The honest cost on the chosen side: `id`
      being fixed forever means this project must accept that `id`
      itself can never be corrected later for a real-world reason,
      unlike `name`, which can.
    commands:
      - command: python verification/phase-06/lab_identity.py
        explanation: >
          Runs the lab from the repository root; no flags needed.
    verification:
      applicable: true
      real_output: |
        before: {'id': 'm1', 'name': 'Haas VF-2', 'status': 'available'}
        after:  {'id': 'm1', 'name': 'Haas VF-2 (Bay 3)', 'status': 'down'}
        still the same machine? id unchanged: True
        if 'name' had been used as the key instead: 'Haas VF-2' now refers to nothing at all - looks like that machine vanished and an unrelated new one, 'Haas VF-2 (Bay 3)', appeared
      output_file: verification/phase-06/lab_identity_output.txt
    connection_to_previous: >
      The previous unit showed uniqueness as a moment-in-time guarantee;
      this unit shows the sharper property a real primary key actually
      needs - staying stable across every future change to everything
      else about the row.

  - title: "Surrogate Keys - An Identifier Invented Purely to Identify"
    problem: >
      `backend/app/models/tag.py`'s real `Tag.id` is declared
      `db.Column(db.Integer, primary_key=True)`, with no explicit
      default - SQLAlchemy auto-generates it, sequentially, on insert.
      Unlike `Machine.id` (a meaningful string like `'m1'`) or `Part.id`
      (`'P-1234567'`), a `Tag`'s own real `id` is just a number with no
      connection to what the tag actually IS. What does inventing an
      identifier with zero real-world meaning actually buy this project?
    socratic_prompt:
      - >
        `Tag.name` is the value that actually carries real-world
        meaning - `"urgent"`, `"prototype"`. If a tag's own `name` were
        corrected or renamed later, should its `id` need to change along
        with it?
      - >
        Given this lesson's own Identity unit, what real property does a
        plain, auto-incrementing integer have that makes it a
        particularly safe choice for identity specifically?
    project_change:
      reference_source: >
        Real, verbatim, read this session, `backend/app/models/tag.py:24-25`:
        ```
        id = db.Column(db.Integer, primary_key=True)
        name = db.Column(db.String(50), unique=True, nullable=False, index=True)
        ```
        Real, already-existing evidence of this project's own THIRD
        distinct primary-key strategy alongside `Machine`/`Part`'s
        app-generated meaningful strings: a plain, database-generated
        integer, carrying no meaning about the tag at all - `name` is
        where the tag's own real meaning, and its own separate
        uniqueness guarantee, actually live.
      files_affected:
        - path: verification/phase-06/lab_surrogate_key.py
          status: new
      change_type: add
      location: N/A - a new, standalone throwaway script; no existing project structure to place it within.
      dependencies: None beyond plain Python.
    new_code:
      applicable: true
      intro: >
        A minimal, real auto-increment counter, modeling `Tag.id`'s own
        real generation strategy directly, followed by renaming a tag's
        `name` to show what does - and does not - need to change as a
        result:
      file: verification/phase-06/lab_surrogate_key.py
      status: new
      language: python
      code: |
        next_tag_id = 1
        tags = []


        def add_tag(name):
            global next_tag_id
            tag = {"id": next_tag_id, "name": name}
            tags.append(tag)
            print(f"added tag: {tag} - id {next_tag_id} carries no real-world meaning, only creation order")
            next_tag_id += 1


        add_tag("urgent")
        add_tag("prototype")
        add_tag("q2-2024")

        print("renaming tag id 2's own name to 'proto' - does the surrogate id need to change too?")
        tags[1]["name"] = "proto"
        print(f"after rename: {tags[1]}")
    updated_project:
      applicable: false
    mechanical_walkthrough:
      applicable: true
      items:
        - element: "next_tag_id = 1 / global next_tag_id / next_tag_id += 1"
          explanation: >
            A plain module-level counter (basic Python, using `global`
            to let `add_tag` reassign it), modeling exactly what
            SQLAlchemy's own auto-increment behavior does for
            `Tag.id`'s real declaration: hand out the next sequential
            integer, with no reference to `name` or anything else about
            the tag being created.
        - element: '{"id": next_tag_id, "name": name}'
          explanation: >
            Builds one tag dict pairing the current counter value with
            the real, meaningful value, `name`. The two are constructed
            together but come from entirely separate sources - one
            invented purely for identification, one supplied because it
            is what the tag actually IS.
        - element: "tags[1][\"name\"] = \"proto\""
          explanation: >
            Basic-Python list indexing and dict-key assignment, changing
            ONLY the `name` field of the second tag. Its `id`, `2`, is
            never touched anywhere in this line or anywhere else in the
            script - the direct, observable proof that a surrogate key
            never has a real reason to change, even when the row's own
            actual, meaningful data does.
    mental_model:
      applicable: false
    execution_trace:
      applicable: false
    cs_lens: >
      This is a **surrogate key**: an identifier invented purely to
      identify, carrying no meaning about the thing it identifies. Also
      recognized in: a library's own accession number stamped inside a
      book, unrelated to its title or author; a shipping tracking
      number, meaningless on its own but permanently tied to one real
      package; a UUID generated for a new user account, chosen
      specifically because it commits to nothing about that user at all;
      and, in this project's own domain, a real machine's own database
      `id`, distinct from its human-facing `name`, existing purely so
      every other table's `machine_id` foreign key has something stable
      to point at.
    se_lens: >
      The design principle is separating "what identifies this row" from
      "what this row actually means," so the meaningful data stays free
      to be corrected without disturbing anything that depends on
      identity. The real alternative NOT chosen for `Tag` - using `name`
      itself as the primary key - would work today, since `name` is
      already declared `unique=True`, but would force every real
      `part_tags` row referencing that tag to update its own `tag_id`
      the instant a tag were ever renamed; a surrogate `id` makes that
      renaming free. The honest cost on the surrogate's own side: an
      auto-incrementing integer, by itself, says nothing human-readable
      about the row it identifies - `id=2` means nothing without also
      looking up `name`.
    commands:
      - command: python verification/phase-06/lab_surrogate_key.py
        explanation: >
          Runs the lab from the repository root; no flags needed.
    verification:
      applicable: true
      real_output: |
        added tag: {'id': 1, 'name': 'urgent'} - id 1 carries no real-world meaning, only creation order
        added tag: {'id': 2, 'name': 'prototype'} - id 2 carries no real-world meaning, only creation order
        added tag: {'id': 3, 'name': 'q2-2024'} - id 3 carries no real-world meaning, only creation order
        renaming tag id 2's own name to 'proto' - does the surrogate id need to change too?
        after rename: {'id': 2, 'name': 'proto'}
      output_file: verification/phase-06/lab_surrogate_key_output.txt
    connection_to_previous: >
      The previous unit showed why a key needs to stay stable; this unit
      shows one real strategy this project already uses to guarantee
      that stability outright - inventing a value with no real-world
      reason to ever need changing.

  - title: "Natural and Composite Keys - When the Data Already Is the Key"
    problem: >
      `backend/app/models/tag.py`'s own real `part_tags` association
      table declares BOTH `part_id` and `tag_id` as `primary_key=True`
      together - no separate, surrogate `id` column at all. Given that
      every real pairing already needs to store a real `part_id` and a
      real `tag_id` anyway, what would a separate, invented surrogate key
      actually add here?
    socratic_prompt:
      - >
        A specific part being tagged with a specific tag - say,
        `('P-1234567', 'urgent')` - can only sensibly happen once per
        part+tag pair. Given that, is there ever a real reason two
        DIFFERENT rows in `part_tags` would need to represent the exact
        same `(part_id, tag_id)` pairing?
      - >
        `backend/app/models/part.py`'s own real `part_number` column is
        declared `unique=True` - a natural candidate for a primary key -
        yet `Part`'s actual primary key is `id`, a separate, invented
        string. Why keep both, instead of just using `part_number` as
        the key directly?
    project_change:
      reference_source: >
        Real, verbatim, read this session, `backend/app/models/tag.py:11-15`:
        ```
        part_tags = db.Table(
            'part_tags',
            db.Column('part_id', db.String(50), db.ForeignKey('parts.id'), primary_key=True),
            db.Column('tag_id', db.Integer, db.ForeignKey('tags.id'), primary_key=True)
        )
        ```
        Real, already-existing evidence of this project's own FOURTH
        primary-key shape: a real, composite key built from two real
        foreign keys, with no separate surrogate column at all. Also
        real, verbatim, read this session, `backend/app/models/part.py:210-218`:
        ```
        part_number = db.Column(db.String(20), unique=True, nullable=False, index=True)
        ```
        - the real natural-key CANDIDATE this project keeps, unique and
        indexed, without ever using it as `Part`'s actual primary key.
      files_affected:
        - path: verification/phase-06/lab_natural_composite_key.py
          status: new
      change_type: add
      location: N/A - a new, standalone throwaway script; no existing project structure to place it within.
      dependencies: None beyond plain Python.
    new_code:
      applicable: true
      intro: >
        `part_tags`' own real composite key, modeled directly as this
        curriculum's own Relational Model lesson modeled a relation - a
        `set` of tuples, here each tuple already IS the key, with no
        separate id anywhere:
      file: verification/phase-06/lab_natural_composite_key.py
      status: new
      language: python
      code: |
        part_tags = {
            ("P-1234567", "urgent"),
            ("P-1234567", "prototype"),
            ("P-7654321", "urgent"),
        }
        print(f"part_tags relation contains {len(part_tags)} pairing(s)")

        part_tags.add(("P-1234567", "urgent"))  # attempted duplicate pairing
        print(f"after re-adding an existing pairing: {len(part_tags)} pairing(s) - still no separate surrogate id needed")
    updated_project:
      applicable: false
    mechanical_walkthrough:
      applicable: true
      items:
        - element: '{ ("P-1234567", "urgent"), ... } (the set literal)'
          explanation: >
            The same `set`-of-tuples construct this curriculum's own
            Relational Model lesson already established. Each tuple here
            is not "a row with a key" - the tuple's own two real values,
            `part_id` and `tag_id` together, ARE the entire key; there is
            no third, separate identifier value anywhere in this
            structure at all.
        - element: 'part_tags.add(("P-1234567", "urgent"))'
          explanation: >
            `set.add` (basic Python) attempts to insert a tuple already
            present. Because a `set`'s own membership is based on value
            equality, this changes nothing - `len(part_tags)` still
            reports `3` - the exact same real behavior this project's
            own composite primary key gives it for free: the pairing
            `('P-1234567', 'urgent')` simply cannot exist twice.
        - element: "len(part_tags) (both calls)"
          explanation: >
            `len`, established in this curriculum's own Relational Model
            lesson, called before and after the attempted duplicate -
            confirming directly that no new, distinct member was ever
            added.
    mental_model:
      applicable: false
    execution_trace:
      applicable: false
    cs_lens: >
      This is a **composite key**, a specific case of a **natural key**:
      an identifier built directly from data the row already needs to
      hold, rather than an invented extra value. Also recognized in: a
      seating chart keyed on `(row, seat)` together, since neither alone
      identifies a seat; an ISBN, a natural key already unique to one
      real published book with no separate invented number needed; a
      composite primary key on `(year, month)` for a monthly report
      table, where the two values together are already guaranteed
      unique; and, in this project's own domain, `part_tags` needing
      nothing more than the real, already-required `part_id` and `tag_id`
      together to know a pairing is genuinely unique.
    se_lens: >
      The design principle is not inventing an identifier when the data
      a row already has to store is already, provably, unique on its
      own. The real alternative NOT chosen for `part_tags` - adding a
      separate surrogate `id` column, the way `Tag` itself has one -
      would work, but would add a value with no real job: nothing about
      `part_tags` ever needs to identify "this specific pairing" except
      by which part and which tag it connects. The honest cost on the
      natural-key side, made concrete by `Part.part_number`'s own real
      design: `part_number` is a genuine natural-key candidate,
      guaranteed unique, yet `Part` still uses a separate `id` as its
      real primary key - because, unlike a surrogate, a natural key CAN
      have a real-world reason to change (a part number gets corrected,
      re-issued, or renumbered), and every real foreign key pointing at
      it would then need to change too; this project's own choice keeps
      `part_number` unique and indexed for lookups, without ever letting
      other tables depend on it for identity.
