closing:
  connect_the_pieces: >
    Follow this project's own real primary keys across every unit.
    `Machine.id` first has to be unique - the Uniqueness unit's own lab
    shows a duplicate `id` genuinely rejected, while a duplicate `name`
    is not, proving uniqueness is a property of one declared column, not
    of a row automatically. That same `id` then has to survive every
    later change to the row around it - the Identity unit's own lab
    renames and re-statuses a machine while its `id` never moves,
    proving identity requires more than momentary uniqueness. `Tag.id`
    shows one real way this project GUARANTEES that stability outright:
    a plain, auto-incrementing integer invented purely to identify,
    which a real rename of `Tag.name` never has to touch - a surrogate
    key. And `part_tags`' own real composite key, `(part_id, tag_id)`,
    shows the opposite real strategy this same project also uses: no
    invented value at all, because the pairing itself is already,
    provably, unique - a natural key. `Part.part_number`, unique and
    indexed but never the actual primary key, is this project's own
    honest middle case: a natural key it keeps around for lookups,
    without ever trusting it with identity.
  next_lesson_pointer: >
    Next, the other real direction a key points in - one row's own
    reference to a DIFFERENT relation entirely, and what actually
    guarantees that reference points at something real - gets built
    directly on top of the primary keys this lesson just established.
