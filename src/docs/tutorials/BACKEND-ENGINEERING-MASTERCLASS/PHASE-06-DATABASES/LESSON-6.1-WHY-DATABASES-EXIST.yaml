      applicable: false
    execution_trace:
      applicable: true
      shape: timing
      lines:
        - >
          `python -u verification/phase-06/lab_durability.py` (run 1) -
          writes `"committed-value"`, calls `f.flush()`, then
          `os.fsync(f.fileno())`; only once that real call returns does
          `os._exit(1)` run, ending the process immediately with exit
          code `1` and skipping every normal shutdown step.
        - >
          The real file `durability_data.txt` now holds
          `"committed-value"` on the physical storage device - not
          merely "written" from this now-dead process's point of view,
          but confirmed there by the `os.fsync()` call that ran before
          the crash.
        - >
          `python -u verification/phase-06/lab_durability.py` (run 2, a
          genuinely separate, later process) - `os.path.exists` reports
          `True`; reading the file back recovers `'committed-value'`
          exactly, proving the confirmed write survived a process that
          never shut down cleanly at all.
    cs_lens: >
      This is **durability**: a confirmed write surviving even an
      abnormal interruption, not just an ordinary exit. Also recognized
      in: a bank's own ledger system, which does not report a wire
      transfer as complete to the sender until its own record of it is
      confirmed durably written, specifically so a datacenter power loss
      one instant later cannot un-happen an already-confirmed transfer;
      a real database's write-ahead log, flushed and fsync'd before the
      database ever tells a caller "committed"; a text editor's
      write-to-a-temp-file-then-rename save pattern, chosen specifically
      so a crash mid-save cannot corrupt the real file it is replacing;
      and, in this project's own domain, a CNC program transfer that is
      verified complete (a checksum, a re-read) before it is ever
      trusted for a real production run - "the file appears to be there"
      and "the file is confirmed, completely and correctly there" are
      exactly as different for a toolpath as they are for this lab's own
      single string.
    se_lens: >
      The design principle is forcing the gap between "the program was
      told this succeeded" and "this is physically, verifiably true"
      closed on purpose, rather than trusting an ordinary buffered write
      to have already closed it. The real alternative NOT chosen here is
      relying on an ordinary `write()` (or even a `flush()` alone) and
      simply hoping no crash lands in the narrow window before the
      operating system gets around to its own physical write - cheaper,
      and correct almost all of the time, which is exactly why it is
      dangerous: the one time it matters is the one time something
      already went wrong. The honest cost on the other side, stated
      plainly: `os.fsync()` is understood to be slower than an ordinary
      buffered write - a design rationale this lesson did not itself
      measure, but one that follows directly from what `os.fsync()`'s
      own real contract requires: it cannot return until the hardware
      itself confirms the write, where an ordinary buffered write
      returns as soon as Python's own side is done. Genuine durability
      is bought with real latency as a result, the same tradeoff this project's own choice
      of `sqlite:///:memory:'` for `TestingConfig` deliberately opts out
      of, on purpose, for tests that do not need it.
    commands:
      - command: python -u verification/phase-06/lab_durability.py
        explanation: >
          Runs the lab from the repository root; `-u` runs Python in
          unbuffered mode so this script's own `print()` output is not
          silently lost when `os._exit()` skips Python's normal
          shutdown flush. Run a second time, unmodified, to see the
          real, post-crash recovery this unit is about.
