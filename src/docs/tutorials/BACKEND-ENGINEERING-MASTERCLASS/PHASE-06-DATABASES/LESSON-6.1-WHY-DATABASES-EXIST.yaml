                f.write("committed-value")
                f.flush()
                os.fsync(f.fileno())
            print("wrote 'committed-value', then flush() and os.fsync() - the operating system has now confirmed those bytes are physically on the storage device, not just sitting in this process's own memory buffer")
            print("simulating a hard crash right here, immediately after that confirmed write")
            os._exit(1)  # skips every normal shutdown step Python would otherwise run - no atexit, no cleanup
