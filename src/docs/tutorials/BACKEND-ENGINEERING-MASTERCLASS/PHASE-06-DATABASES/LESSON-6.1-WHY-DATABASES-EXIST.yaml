        whether the write actually survived that crash:
      file: verification/phase-06/lab_durability.py
      status: new
      language: python
      code: |
        import os

        DATA_FILE = os.path.join(os.path.dirname(__file__), "durability_data.txt")
        DISPLAY_PATH = "verification/phase-06/durability_data.txt"

        if os.path.exists(DATA_FILE):
