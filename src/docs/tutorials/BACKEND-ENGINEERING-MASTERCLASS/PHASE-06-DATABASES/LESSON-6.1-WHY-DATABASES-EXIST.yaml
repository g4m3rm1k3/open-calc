number: "6.1"
title: "Why Databases Exist"
path_note: >
  File paths under backend/... refer to the real manufacturing-platform
  repository. Paths under verification/... refer to that same
  repository's verification folder.

what_you_will_build: >
  Five small, real, throwaway scripts - one per property this lesson
  names - each directly demonstrating the exact problem a database
  exists to solve, before this curriculum starts building the
  relational model and SQL that actually solve it: a value surviving a
  fresh process where an in-memory list does not (persistence); a
  file's already-committed bytes surviving a process that crashes on
  purpose immediately after writing them (durability); the real,
  measured cost an application pays to answer one question over data it
  has to scan by hand (querying); two real threads racing to claim the
  same shared value, producing a real, silent lost update (concurrency);
  and a plain data structure accepting a reference to something that
  does not exist, with nothing to stop it (integrity). Each lab is
  grounded in a real field this project's own `backend/config.py` or
  `backend/app/models/machine.py` already carries today.

what_you_need_to_know_first: >
  Defining and calling plain Python functions; that a running process
  has its own private memory, and that memory disappears the instant
  the process exits; plain dict and list literals, and reading a value
  out of either by key or index; comparing two values with `==`;
  f-strings.

terms:
  - name: persistence
    definition: >
      The property of data continuing to exist after the specific
      process that created it has ended. It exists as a named concept
      because a running program's own memory - every plain variable,
      list, or dict it holds - belongs only to that one process, and is
      reclaimed by the operating system the instant the process exits,
      whether that exit is intentional (a clean shutdown) or not; data
      that needs to still be there afterward has to live somewhere else
      entirely - on disk, or in a separate process that outlives it.
  - name: durability
    definition: >
      The stronger guarantee that once a write has been confirmed as
      complete, it survives even an abnormal interruption - a crash, a
      power loss, a killed process - not merely an ordinary, clean exit.
      It exists as a concept distinct from persistence because an
      ordinary file write is not, by itself, durable: the operating
      system is free to hold written bytes in a memory buffer for a
      while before actually placing them on the physical storage
      device, and a crash in that window loses data a program had
      already been told was "written." Durability is what forces that
      window shut - confirming a write only once the bytes are
      genuinely, physically on the device, not just handed to a buffer.
  - name: querying
    definition: >
      The ability to ask a specific question about stored data and get
      back only the answer, without the thing asking having to
      personally read and judge every single record itself. It exists
      as a distinct concept from mere storage because being ABLE to
      keep data somewhere says nothing about how expensive it is to
      later ask "which of these match X" - without a real querying
      capability, answering that question is the caller's own problem,
      solved by manually inspecting everything it has, every time.
  - name: concurrency
    definition: >
      More than one independent flow of execution - two threads, two
      processes, two separate users' requests - being active over the
      same shared data at the same time, with no guarantee about which
      one's steps happen in which order relative to the other's. It
      exists as a named concern because a single flow of execution
      touching data by itself never has this problem; the instant a
      second one can touch the same data before the first one finishes,
      an operation that looks like one atomic step from the outside
      (read the current value, decide, write a new value) can actually
      happen as two separately-interleaved flows, each unaware of the
      other's steps in between its own.
  - name: integrity
    definition: >
      The property that stored data actually obeys the real-world rules
      it is supposed to - a reference points at something that genuinely
      exists, a required field is actually present, a value is actually
      the kind of thing it claims to be - rather than merely being
      whatever bytes happened to get written. It exists as a distinct
      concern because storing a value and storing a CORRECT value are
      different guarantees: nothing about the physical act of writing
      data checks whether that data makes real-world sense, unless
      something is specifically built to check it.
  - name: "context manager (the `with` statement)"
    definition: >
      A Python construct, `with EXPR as NAME:`, that guarantees a
      cleanup action runs when the indented block ends - whether it
      ends normally or by an exception - without the caller having to
      write that cleanup by hand. For a file opened with `open(...)`,
      the object returned defines what happens on entry (the file is
      already open by the time the block starts) and on exit (the file
      is closed automatically, the instant the block ends, no matter
      how it ends). It exists so "open a resource, use it, always
      release it" does not depend on every caller remembering a matching
      `.close()` call on every possible exit path.
  - name: list comprehension
    definition: >
      The expression `[EXPR for NAME in ITERABLE if CONDITION]`,
      building a brand-new, fully-realized list by evaluating `EXPR`
      once for every item in `ITERABLE` that satisfies `CONDITION` (the
      `if` clause is optional). It exists as a compact way to build a
      filtered/transformed list without writing an explicit loop and an
      empty list to `.append()` into by hand - but, as this lesson's own
      querying unit shows, it still has to actually visit every item in
      `ITERABLE` to decide which ones satisfy `CONDITION`; compactness of
      syntax is not the same thing as cheapness of execution.

objects_and_methods:
  - name: "open() (file object)"
    what_it_is: >
      A built-in Python function that opens a real file on disk and
      returns a file object representing an open connection to it.
    implementation: >
      `open(path, mode)`, where `mode` is a string such as `"a"`
      (append - write at the end, creating the file if it does not
      exist yet, without erasing what is already there) or the default
      read mode. The returned file object supports `.read()` (returns
      the file's entire remaining contents as one string), `.write(s)`
      (appends the string `s` to the file, though not necessarily to
      the physical disk immediately - see `flush()`/`os.fsync()`
      below), and `.flush()` (pushes any bytes Python itself has been
      holding in its own internal buffer out to the operating system;
      this does not by itself guarantee the operating system has placed
      them on the physical device).
    its_use: >
      This lesson's persistence and durability labs both use it as the
      real mechanism for writing to, and reading back from, an actual
      file on disk - the concrete, minimal stand-in for what a real
      database's own on-disk storage does at a much larger scale.
    type: A builtin function returning a file object; used here through the `with ... as f:` context-manager form.
    responsibility: >
      Representing one real, open connection to a file on disk, and
      exposing the operations (`read`, `write`, `flush`) that actually
      move bytes between this process's own memory and that file.
    depends_on: >
      A real, valid file path, and a mode string telling it whether to
      read or append.
    connects_to: >
      Opened via the `with` statement (context manager) in both the
      persistence and durability labs; its `.flush()` is called directly
      before `os.fsync()` in the durability lab specifically to control
      exactly when buffered bytes actually leave this process.
    shape: >
      Takes a path and mode string in, returns one file object whose
      `.read()` returns a string and whose `.write()`/`.flush()` return
      nothing - the object's real value is the side effect of moving
      bytes to or from the real file, not a return value.
  - name: os.path.exists
    what_it_is: >
      A function in Python's standard `os.path` module that checks
      whether a given path currently refers to a real, existing file or
      directory on disk.
    implementation: >
      `os.path.exists(path)` - asks the operating system directly
      whether `path` currently exists, and returns `True` or `False`.
      It does not open, read, or lock anything - a pure existence check.
    its_use: >
      Both the persistence and durability labs call this once, at the
      very start of the script, specifically to detect whether a
      PREVIOUS, separate run of this same script already wrote to the
      real data file - the concrete way each lab tells "first run" apart
      from "a later, fresh process, after an earlier one already ran."
    type: A builtin standard-library function, called as `os.path.exists(...)`.
    responsibility: >
      Answering one true/false question - does this path exist right
      now - without touching the file's actual contents.
    depends_on: A real path string.
    connects_to: >
      Called once at the top of each lab, before either lab decides
      whether to run its "first run" branch or its "later run" branch.
    shape: Takes a path string in, returns a plain `bool` out.
  - name: os.fsync
    what_it_is: >
      A standard-library function that tells the operating system to
      force any of its own buffered writes for a given open file all
      the way out to the physical storage device, before returning.
    implementation: >
      `os.fsync(fd)`, where `fd` is a real OS-level file descriptor
      (obtained here via a file object's own `.fileno()`). Until this is
      called, the operating system is free to hold recently-written
      bytes in its own memory buffer for a while, for performance,
      before actually placing them on the physical device - a normal,
      ordinary `write()`/`flush()` from Python's own side does not, by
      itself, force that.
    its_use: >
      The durability lab calls this immediately after writing and
      `flush()`ing, specifically so the very next line - a deliberate,
      simulated crash - happens only after the operating system has
      already confirmed the bytes are physically on disk, not merely
      sitting in a buffer that a real crash could still lose.
    type: A builtin standard-library function operating on a real OS file descriptor.
    responsibility: >
      Forcing the gap between "written, as far as this process can
      tell" and "physically on the storage device" closed, on demand,
      rather than leaving it to the operating system's own timing.
    depends_on: An open file's real OS-level file descriptor, obtained from `f.fileno()`.
    connects_to: >
      Called directly after `f.flush()` in the durability lab, and
      immediately before `os._exit(1)` - the ordering is the entire
      point of the lab.
    shape: Takes a file descriptor integer in, returns nothing - its effect is entirely the side effect of forcing a real disk write.
  - name: os._exit
    what_it_is: >
      A standard-library function that terminates the current process
      immediately, at the operating-system level, skipping every normal
      Python shutdown step.
    implementation: >
      `os._exit(code)` - unlike a normal script ending or Python's own
      `sys.exit()`, this does not run any pending cleanup, does not
      flush any output Python itself was still buffering, and does not
      let any `finally` block or context manager's own exit logic run.
      `code` becomes the process's real exit code, readable by whatever
      shell or process launched it.
    its_use: >
      The durability lab calls this deliberately, right after the real
      `os.fsync()` call, specifically to simulate a genuine, abnormal
      crash immediately after a confirmed write - not a clean exit -
      which is exactly the scenario durability (as opposed to mere
      persistence) is a guarantee about.
    type: A builtin standard-library function; called here as the very last statement this process ever executes.
    responsibility: >
      Ending the process instantly and unconditionally, standing in for
      a real crash in a way this lesson's lab can trigger on purpose and
      still observe the aftermath of.
    depends_on: An integer exit code.
    connects_to: >
      Called only after `f.flush()` and `os.fsync()` have already run in
      this lesson's own durability lab - the ordering proves the crash
      happens strictly after the write was confirmed, not before.
    shape: Takes an integer exit code in; never returns - the process it is called from ceases to exist at that line.
  - name: threading.Thread
    what_it_is: >
      A class in Python's standard `threading` module representing one
      separate, real thread of execution running inside the same
      process as the one that created it.
    implementation: >
      `threading.Thread(target=callable, args=tuple)` constructs a
      thread object that will run `callable(*args)` once started;
      `.start()` actually begins running it concurrently with whatever
      created it; `.join()` blocks the calling code until that thread
      has finished running. Two `Thread` objects, both started before
      either is joined, genuinely run at the same time, with the
      operating system - not this lesson's own code - deciding the exact
      order their individual steps actually interleave in.
    its_use: >
      The concurrency lab creates two real `Thread` objects, both
      targeting the same function, `claim_machine`, and starts both
      before joining either - the real mechanism this lesson uses to
      make two independent flows of execution genuinely race over the
      same shared dict at the same time, rather than merely describing
      that race in prose.
    type: A builtin standard-library class, instantiated twice in this lesson's own lab.
    responsibility: >
      Representing, and actually running, one independent, concurrently-
      executing flow through Python code, sharing the same process
      memory as every other thread in the same process.
    depends_on: A callable to run, and optionally the arguments to call it with.
    connects_to: >
      `.start()` is called on both thread objects before `.join()` is
      called on either, in this lesson's own lab - that specific
      ordering is what allows both threads' `claim_machine` calls to
      genuinely overlap in time.
    shape: >
      Constructed from a callable and its arguments; `.start()` and
      `.join()` both return nothing - the real effect is entirely the
      side effect of code in `target` actually running, concurrently
      with the rest of the program.
  - name: time.sleep
    what_it_is: >
      A standard-library function that pauses the calling thread for a
      given number of seconds, without blocking any OTHER thread in the
      same process.
    implementation: >
      `time.sleep(seconds)` - the specific thread that calls it stops
      executing for approximately `seconds`, then resumes; every other
      thread already running continues, unaffected.
    its_use: >
      The concurrency lab's own `claim_machine` function calls this
      between checking whether the machine is free and actually writing
      its own claim - a deliberately widened gap standing in for the
      real, ordinary gap between "read the current state" and "write a
      new state" that exists in any real concurrent system, made large
      enough here to reliably force the race to actually happen instead
      of leaving it to chance.
    type: A builtin standard-library function.
    responsibility: >
      Deliberately widening the real window between two steps of
      `claim_machine`, so this lesson's lab reliably demonstrates a race
      instead of usually not showing one.
    depends_on: A number of seconds to pause for.
    connects_to: >
      Called inside `claim_machine`, after the shared value has already
      been read but before it is written - the exact gap a real
      concurrency bug lives inside.
    shape: Takes a number in, returns nothing - its only effect is the passage of time before the next line runs.
  - name: time.perf_counter
    what_it_is: >
      A standard-library function returning a high-resolution timestamp,
      suitable for measuring how long something took to run.
    implementation: >
      `time.perf_counter()` returns a floating-point number of seconds
      from some arbitrary starting point - not tied to the wall clock -
      so subtracting two calls to it gives an accurate elapsed duration
      between them, unaffected by the system clock being adjusted.
    its_use: >
      The querying lab calls this once immediately before, and once
      immediately after, scanning every machine record for a match - the
      real mechanism this lesson uses to put an actual measured number
      on the cost of that scan, rather than only asserting it has one.
    type: A builtin standard-library function.
    responsibility: >
      Producing a timestamp precise and stable enough that the
      difference between two calls is a trustworthy measurement of
      elapsed time.
    depends_on: Nothing - takes no arguments.
    connects_to: >
      Called once before, and once after, this lesson's own list
      comprehension in the querying lab; the difference between the two
      calls becomes `elapsed`.
    shape: Takes nothing in, returns a single float out.
  - name: dict.get
    what_it_is: >
      A dict method that looks up a key and returns a default value
      instead of raising an exception when that key is not present.
    implementation: >
      `some_dict.get(key, default=None)` - if `key` exists in
      `some_dict`, returns its value, exactly like `some_dict[key]`
      would; if `key` does NOT exist, returns `default` (which itself
      defaults to `None`) instead of raising `KeyError`.
    its_use: >
      The integrity lab's own resolution step calls `groups.get(...)`
      with a machine's stored `group_id` - when that `group_id` points
      at a real group, this returns the real group's dict; when it does
      not (the deliberately broken reference this lab creates), it
      returns `None`, silently, with no exception at all - which is
      precisely how an unenforced, broken reference actually surfaces
      downstream: not as an error at the moment it was written, but as a
      quiet `None` the first time something later tries to use it.
    type: A builtin dict method, called here as `groups.get(machine["group_id"])`.
    responsibility: >
      Answering "does this key exist, and if so what is its value" as
      one call, without ever raising for a missing key itself.
    depends_on: A dict to call it on, and a key to look up.
    connects_to: >
      Called on the `groups` dict, once per machine, using each
      machine's own stored `group_id` - the same `group_id` that was
      accepted with zero checking when the machine was first added.
    shape: >
      Takes a key (and an optional default) in; returns either the
      real value stored under that key, or `None` - the same shape
      either way, which is exactly why a caller cannot tell, just from
      the return type, whether the reference it followed was ever real.

concept_units:
  - title: "Persistence - Data That Outlives the Process That Created It"
    problem: >
      `backend/config.py`'s own real `SQLALCHEMY_DATABASE_URI` points at
      an actual file path on disk - `manufacturing.db` - not at any
      Python variable inside the running Flask process. If this
      backend's real machines, groups, and CAM files instead lived only
      in ordinary Python variables inside the running server process,
      what would happen to every one of them the instant that process
      restarted - a deploy, a crash, a plain reboot?
    socratic_prompt:
      - >
        If `backend/app/models/machine.py`'s real `Machine` rows lived
        only in a plain Python list inside the running server process,
        what would that list contain the instant after the process
        restarted?
      - >
        `config.py`'s own real `SQLALCHEMY_DATABASE_URI` points at a
        file path, not a Python variable. What does pointing at a real
        file, specifically, buy this project that a variable inside the
        running process cannot?
    project_change:
      reference_source: >
        Real, verbatim, read this session, `backend/config.py:21-26`:
        ```
        # DATABASE CONFIGURATION
        DATA_PATH = os.environ.get('DATA_PATH', str(BASE_DIR / "data"))
        SQLALCHEMY_DATABASE_URI = os.environ.get(
            'DATABASE_URL',
            f'sqlite:///{os.path.join(DATA_PATH, "manufacturing.db")}'
        )
        ```
        This is the real, already-existing evidence that this project's
        database lives at a real file path, not inside any Python
        process's own memory. The lab below models the identical
        underlying property - a real file outliving the process that
        wrote to it - directly with plain file I/O, since SQL and the
        relational model are later lessons' own subject.
      files_affected:
        - path: verification/phase-06/lab_persistence.py
          status: new
      change_type: add
      location: N/A - a new, standalone throwaway script; no existing project structure to place it within.
      dependencies: None beyond Python 3's own standard library (`os`).
    new_code:
      applicable: true
      intro: >
        One script, run twice as two genuinely separate processes,
        holding the identical value two different ways - one in a
        plain Python list, one written to a real file:
      file: verification/phase-06/lab_persistence.py
      status: new
      language: python
      code: |
        import os

        DATA_FILE = os.path.join(os.path.dirname(__file__), "persistence_data.txt")
        DISPLAY_PATH = "verification/phase-06/persistence_data.txt"

        in_memory_log = []  # exists only inside this one running process


        def record_in_memory(value):
            in_memory_log.append(value)
            print(f"in-memory log now holds: {in_memory_log}")


        def record_to_real_file(value):
            with open(DATA_FILE, "a") as f:
                f.write(f"{value}\n")


        if os.path.exists(DATA_FILE):
            with open(DATA_FILE) as f:
                existing = f.read().splitlines()
            print(f"real file {DISPLAY_PATH!r} already contains: {existing}")
        else:
            print(f"no {DISPLAY_PATH!r} yet - this is this file's first run")

        print(f"in-memory log at process start: {in_memory_log}")

        record_in_memory(42)
        record_to_real_file(42)
        print("wrote 42 to the real file on disk; this process is about to exit normally")
    updated_project:
      applicable: false
    mechanical_walkthrough:
      applicable: true
      items:
        - element: "in_memory_log = []"
          explanation: >
            A plain list literal, bound to a name at module scope. This
            list is real Python object, but it lives only inside this
            one process's own memory - nothing about creating it writes
            anything to disk, anywhere, ever. It is this unit's
            deliberate contrast object: watch what it contains at the
            start of each of this script's two separate runs.
        - element: "os.path.exists(DATA_FILE)"
          explanation: >
            The real existence check described in this lesson's own
            Header. Its result is what lets this single script tell
            "this is the first time this file has ever run" apart from
            "a separate, earlier process already ran and wrote
            something real" - the concrete question persistence is
            actually about.
        - element: "with open(DATA_FILE) as f: existing = f.read().splitlines()"
          explanation: >
            A context manager, opening the real file for reading;
            `.read()` returns its entire contents as one string, and the
            basic-Python `str.splitlines()` splits that string back into
            a list of lines - the same shape of value `record_to_real_file`
            originally wrote, one number per line. The `with` block
            closes the file automatically the instant this indented
            block ends, whether or not anything inside it raises.
        - element: "print(f\"in-memory log at process start: {in_memory_log}\")"
          explanation: >
            The line this whole unit hinges on: on the first run, this
            prints `[]`, because the list was just created fresh and
            nothing has appended to it yet; on the SECOND run - a
            genuinely separate process - it prints `[]` again, for the
            identical reason: a new process means a brand-new, empty
            list, no matter what the previous process's own list ever
            held.
        - element: "record_in_memory(42) / in_memory_log.append(value)"
          explanation: >
            `list.append` (basic Python) mutates `in_memory_log` in
            place, adding `42`. This changes what the CURRENT process's
            own list contains - it does nothing whatsoever to any other,
            past or future, process's copy of this same script.
        - element: "record_to_real_file(42) / with open(DATA_FILE, \"a\") as f: f.write(...)"
          explanation: >
            Opens the real file in append mode (`"a"` - write at the
            end, creating the file if it does not exist, never erasing
            what is already there) and writes `"42\n"` to it. Unlike the
            in-memory list, this line's effect is not confined to this
            process - it is a real change to a real file on disk, which
            is exactly why the SECOND run of this script is able to see
            it at all.
    mental_model:
      applicable: false
    execution_trace:
      applicable: true
      shape: timing
      lines:
        - >
          `python verification/phase-06/lab_persistence.py` (run 1) -
          `os.path.exists` reports `False`; `in_memory_log` starts as
          `[]`; `record_in_memory(42)` and `record_to_real_file(42)` both
          run; the process then exits normally. Its own `in_memory_log`,
          now holding `[42]`, is discarded along with the rest of this
          process's memory the instant it exits.
        - >
          The real file `persistence_data.txt` now contains `42` on
          disk, entirely independent of the process that just ended.
        - >
          `python verification/phase-06/lab_persistence.py` (run 2, a
          genuinely separate process) - `os.path.exists` now reports
          `True`, and reading the real file back shows `['42']`, proving
          it survived; meanwhile `in_memory_log` starts as a brand-new
          `[]` all over again, proving the earlier run's in-memory state
          did NOT survive the same way.
    cs_lens: >
      This is **persistence**: state that outlives the specific process
      that produced it. Also recognized in: a web browser's own
      `localStorage`, still readable the next time a tab opens, long
      after the tab that wrote it closed; a git repository's committed
      objects, still there the next time anyone opens a terminal in that
      folder; a phone's photo library, unaffected by the phone being
      rebooted; and, in this project's own domain, a machine's real,
      recorded maintenance history needing to survive every single
      server restart between now and whenever anyone actually looks it
      up again.
    se_lens: >
      The design principle is choosing to store meaningful state outside
      any one process's own memory, specifically so it survives that
      process ending. The real alternative NOT chosen here is exactly
      what `in_memory_log` models: keep everything in ordinary Python
      variables, which is simpler to write and needs no separate storage
      layer at all - right up until the process restarts, at which point
      every bit of it is gone, unconditionally, with no warning and no
      way back. The honest cost on the other side: choosing to persist
      data at all is not free - it is real, additional design work
      (deciding what to write, when, and in what form) that a purely
      in-memory program never has to do.
    commands:
      - command: python verification/phase-06/lab_persistence.py
        explanation: >
          Runs the lab from the manufacturing-platform repository root.
          Run a second time, unmodified, to see the real, separate-
          process contrast this unit is about - no flags needed either
          time.
    verification:
      applicable: true
      real_output: |
        === RUN 1 ===
        no 'verification/phase-06/persistence_data.txt' yet - this is this file's first run
        in-memory log at process start: []
        in-memory log now holds: [42]
        wrote 42 to the real file on disk; this process is about to exit normally
        === RUN 2 (fresh process) ===
        real file 'verification/phase-06/persistence_data.txt' already contains: ['42']
        in-memory log at process start: []
        in-memory log now holds: [42]
        wrote 42 to the real file on disk; this process is about to exit normally
      output_file: verification/phase-06/lab_persistence_output.txt
    connection_to_previous: >
      This is the lesson's first unit - it establishes the running
      distinction, real file versus in-memory Python state, that the
      rest of this lesson builds on.

  - title: "Durability - Surviving a Crash, Not Just an Exit"
    problem: >
      The previous unit showed a real file surviving a normal process
      exit. But `backend/config.py`'s own `TestingConfig` deliberately
      overrides `SQLALCHEMY_DATABASE_URI` to `'sqlite:///:memory:'` for
      tests specifically - an entirely in-memory database, gone the
      moment its connection closes, chosen ON PURPOSE for tests that
      should never leave real data behind. That contrast raises a
      sharper question than persistence alone answers: even for data
      that IS written to a real file, is a write that has been
      "written" always actually safe the instant a crash happens right
      after it?
    socratic_prompt:
      - >
