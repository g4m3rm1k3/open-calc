      applicable: true
      real_output: |
        === RUN 1 (crashes on purpose) ===
        wrote 'committed-value', then flush() and os.fsync() - the operating system has now confirmed those bytes are physically on the storage device, not just sitting in this process's own memory buffer
        simulating a hard crash right here, immediately after that confirmed write
        exit code: 1
        === RUN 2 (fresh process, after the crash) ===
        real file 'verification/phase-06/durability_data.txt' contains: 'committed-value'
        the previous process that wrote this never shut down cleanly - it crashed on purpose, immediately after writing
      output_file: verification/phase-06/lab_durability_output.txt
    connection_to_previous: >
      The previous unit showed a file surviving a clean exit; this unit
      shows the sharper, real guarantee durability actually adds on top
      of that - surviving a process that never got the chance to exit
      cleanly at all.

  - title: "Querying - Answering a Question Without Scanning Everything by Hand"
    problem: >
      `backend/app/models/machine.py`'s real `Machine` model declares a
      real `status` column - `'available'`, `'down'`, and others. Suppose
      this application needs to answer one real, ordinary question:
      which machines are currently down? Without any real querying
      capability, what does answering that question actually cost the
      application itself, and does that cost depend on how many machines
      actually happen to be down?
    socratic_prompt:
      - >
        If the only way to find machines with `status == 'down'` is to
        personally look at every single `Machine` record one at a time,
        does the amount of WORK that takes depend on how many machines
        are actually down - or on how many machines exist in total?
      - >
        The lab below finds exactly one matching record out of 200,000.
        Before running it: does the code shown do any less work to find
        that one match than it would to find, say, 100,000 matches out
        of the same 200,000?
    project_change:
      reference_source: >
        Real, verbatim, read this session, `backend/app/models/machine.py:75`:
        ```
        status = db.Column(db.String(20), default='available')  # available, running, setup, offline, maintenance, down, issue
        ```
        This is the real, already-existing column this lesson's own
        synthetic lab models the shape of - not this project's real
        production rows, which the lab does not read at all, but a
        realistically-sized, synthetic stand-in built specifically to
        make the real cost of a manual scan actually measurable.
      files_affected:
        - path: verification/phase-06/lab_querying.py
          status: new
      change_type: add
      location: N/A - a new, standalone throwaway script; no existing project structure to place it within.
      dependencies: None beyond Python 3's own standard library (`time`).
    new_code:
      applicable: true
      intro: >
        200,000 synthetic machine-shaped records, all `'available'`
        except one, deliberately placed last - answering "which ones are
        down" the only way available without a real query capability:
        by looking at every single one:
      file: verification/phase-06/lab_querying.py
      status: new
      language: python
      code: |
        import time

        machines = [{"id": f"m{i}", "status": "available"} for i in range(200_000)]
        machines[199_999]["status"] = "down"  # the one real match sits at the very end, on purpose

        start = time.perf_counter()
        found = [m for m in machines if m["status"] == "down"]
        elapsed = time.perf_counter() - start

        print(f"scanned all {len(machines)} machine records to find {len(found)} matching status == 'down'")
        print(f"elapsed: {elapsed:.6f} seconds")
        print(f"even though only {len(found)} row(s) actually matched, every one of the {len(machines)} records still had to be read to find it")
    updated_project:
      applicable: false
    mechanical_walkthrough:
      applicable: true
      items:
        - element: "[{\"id\": f\"m{i}\", \"status\": \"available\"} for i in range(200_000)]"
          explanation: >
            A list comprehension building 200,000 dicts, each shaped
            like this lesson's own real `Machine.status` column, every
            one starting `"available"`. `range(200_000)` (basic Python)
            supplies the 200,000 integers this comprehension iterates
            over.
        - element: "machines[199_999][\"status\"] = \"down\""
          explanation: >
            Ordinary list indexing and dict-key assignment (basic
            Python), placing the single real match deliberately at the
            very LAST position - specifically so a scan cannot get lucky
            and stop early; it has to genuinely reach every record before
            it can even find this one.
        - element: "time.perf_counter() (before)"
          explanation: >
            Captures a precise timestamp immediately before the scan
            begins, described fully in this lesson's own Header.
        - element: "[m for m in machines if m[\"status\"] == \"down\"]"
          explanation: >
            A second list comprehension - the real scan itself. For
            every one of the 200,000 dicts in `machines`, it evaluates
            `m["status"] == "down"`, and only includes `m` in the result
            when that comparison is `True`. There is no way for this
            expression to know in advance which records will match - it
            has to actually evaluate the condition against all 200,000
            before it can be done.
        - element: "time.perf_counter() (after) / elapsed = ... - ..."
          explanation: >
            A second timestamp, taken immediately after the scan
            finishes; subtracting the first from the second gives a real,
            measured elapsed duration for that specific scan - not an
            estimate, an actual number this lesson's own verification
            output shows.
    mental_model:
      applicable: false
    execution_trace:
      applicable: false
    cs_lens: >
      This is **querying**: asking a declarative question - "which
      records satisfy this condition" - versus the caller itself doing
      linear, manual work to answer it. Also recognized in: a search
      engine returning matches for a keyword without the person
      searching having to read every page on the internet themselves; a
      spreadsheet's own filter feature versus manually scrolling every
      row by eye; a phone's contacts search box versus scrolling every
      contact by hand; and, in this project's own domain, a shop
      supervisor needing "every machine currently down" as a single,
      fast answer rather than personally walking the floor and checking
      each machine one at a time.
    se_lens: >
      The design principle is pushing the cost of finding a match down
      to the system that actually holds the data, instead of the calling
      application doing linear work by hand every single time it needs
      an answer. The real alternative NOT chosen in this lab - and the
      one this project's own application code would be stuck with,
      absent a real query capability - is exactly what is shown: hold
      everything in memory, and scan all of it, every time, no matter
      how selective the real question actually is. The honest cost of
      that alternative, made concrete by this lab's own measured
      `elapsed` number: the work done scales with the TOTAL size of the
      data, not with how many rows actually match - the list
      comprehension's own shape, shown above, evaluates its `if`
      condition once per record with no way to stop early, so doubling
      the number of machines doubles how many records get inspected,
      even if the number of down machines never changes at all. The
      honest cost on the other side:
      a real querying capability does not remove that underlying cost by
      magic - it has to be built, and how well it avoids a full scan
      depends entirely on what the system storing the data is actually
      given to work with, which is exactly what a later lesson's own
      indexes are for.
    commands:
      - command: python verification/phase-06/lab_querying.py
        explanation: >
          Runs the lab from the repository root; no flags needed. The
          exact `elapsed` value will vary slightly run to run (real
          machine timing, not a fixed constant) - the point this unit
          makes is what scales with total record count, not the precise
          number of seconds.
    verification:
      applicable: true
      real_output: |
        scanned all 200000 machine records to find 1 matching status == 'down'
        elapsed: 0.003078 seconds
        even though only 1 row(s) actually matched, every one of the 200000 records still had to be read to find it
      output_file: verification/phase-06/lab_querying_output.txt
    connection_to_previous: >
      The previous two units established that data has to be stored
      somewhere real and safely; this unit shows that being stored is
      not the same problem as being efficiently ASKED ABOUT - a
      completely different cost, paid by whoever has to answer the
      question.

  - title: "Concurrency - Two Flows of Execution, One Shared Value"
    problem: >
      `backend/app/models/machine.py`'s real `Machine` model carries
      `current_operator_client_id` and `operator_last_heartbeat_at` -
      real, already-existing fields for tracking which operator's client
      currently "owns" a given machine. Real shop floors have more than
      one operator; what actually happens if two different operators'
      clients both try to claim the same real machine at nearly the same
      instant?
    socratic_prompt:
      - >
        Suppose two operators' clients both check `current_operator_client_id`,
        both see it is empty, and both then decide to write their own ID
        into it. Is there anything in that description alone that
        guarantees only one of them actually succeeds?
      - >
        If both operators' writes "succeed" from each operator's own
        point of view - neither gets an error - what does the shared
        value actually end up holding, and does either operator have any
        way to know, from their own side, that this happened?
    project_change:
      reference_source: >
        Real, verbatim, read this session, `backend/app/models/machine.py:78-80`:
        ```
        # Operator session routing (best-effort)
        current_operator_client_id = db.Column(db.String(100), nullable=True)
        operator_last_heartbeat_at = db.Column(db.DateTime, nullable=True)
        ```
        Real, already-existing evidence that this exact concern - more
        than one operator's client potentially touching the same
        machine's claim at once - is already a real part of this
        project's own schema; its own comment, `"best-effort"`, is this
        project's own honest admission that nothing here currently
        coordinates that. The lab below reproduces the identical shape
        of race directly, with two real threads sharing one plain dict
        in place of the real, network-separated operator clients.
      files_affected:
        - path: verification/phase-06/lab_concurrency.py
          status: new
      change_type: add
      location: N/A - a new, standalone throwaway script; no existing project structure to place it within.
      dependencies: None beyond Python 3's own standard library (`threading`, `time`).
    new_code:
      applicable: true
      intro: >
        One shared dict, standing in for one real machine's row, and two
        real threads - standing in for two operators' clients - both
        racing to claim it:
      file: verification/phase-06/lab_concurrency.py
      status: new
      language: python
      code: |
        import threading
        import time

        machine = {"current_operator_client_id": None}


        def claim_machine(client_id):
            current = machine["current_operator_client_id"]
            print(f"{client_id} checked: machine is currently claimed by {current!r}")
            if current is None:
                time.sleep(0.05)  # the real-world gap between "checked it's free" and "wrote my own claim"
                machine["current_operator_client_id"] = client_id
                print(f"{client_id} claimed the machine")


        t1 = threading.Thread(target=claim_machine, args=("operator-A",))
        t2 = threading.Thread(target=claim_machine, args=("operator-B",))
        t1.start()
        t2.start()
        t1.join()
        t2.join()

        print(f"final current_operator_client_id = {machine['current_operator_client_id']!r}")
        print("both operators believed they successfully claimed the machine - nothing raised an error for either one")
    updated_project:
      applicable: false
    mechanical_walkthrough:
      applicable: true
      items:
        - element: "machine = {\"current_operator_client_id\": None}"
          explanation: >
            One plain dict, shared by both threads - there is only ever
            one of it - standing in for one real machine's row in this
            project's own database, where `current_operator_client_id`
            starts unclaimed.
        - element: "current = machine[\"current_operator_client_id\"]"
          explanation: >
            Reads the shared value into a LOCAL name inside whichever
            thread is running this line. This is the first half of the
            real race: this read and the write further down are two
            separate steps, not one atomic operation, and another thread
            is free to run its own steps in between them.
        - element: "time.sleep(0.05)"
          explanation: >
            Deliberately widens the real gap between the read above and
            the write below, described fully in this lesson's own
            Header - large enough that, with two threads both started
            before either is joined, both reliably reach this point
            having already both seen `current is None`, before either
            has written anything back.
        - element: "machine[\"current_operator_client_id\"] = client_id"
          explanation: >
            Writes this thread's own `client_id` into the shared dict.
            Because BOTH threads already passed the `if current is None:`
            check before either one reached this line, both threads
            execute this write - the second one to actually run it
            silently overwrites whatever the first one just wrote, with
            no error, no exception, and no signal to either thread that
            this happened.
        - element: "threading.Thread(target=claim_machine, args=(\"operator-A\",)) / t1.start() / t2.start() / t1.join() / t2.join()"
          explanation: >
            Full treatment in this lesson's own Header. Starting BOTH
            threads before joining EITHER is what actually allows their
            two calls to `claim_machine` to run concurrently instead of
            one strictly finishing before the other begins - the real
            mechanism that makes the race in this lab genuinely
            possible, not merely described.
        - element: "print(f\"final current_operator_client_id = ...\")"
          explanation: >
            Only reached after both threads have fully finished
            (`t1.join()` and `t2.join()` have both returned). Whichever
            operator's write happened to run last is the one left
            standing - and, as this unit's own two real captured runs
            show, that is not the same operator every time.
    mental_model:
      applicable: true
      diagram: |
        operator-A thread                    operator-B thread
        ------------------                    ------------------
        read current -> None
                                                read current -> None
        sleep(0.05)
                                                sleep(0.05)
        write "operator-A"
                                                write "operator-B"  <- overwrites A, silently

        Both threads pass the "current is None" check before either
        writes anything back - the sleep widens that shared window.
        Whichever thread's write actually happens last wins; the other
        thread's write is still executed, still believed successful by
        that thread, and simply gone.
    execution_trace:
      applicable: true
      shape: timing
      lines:
        - >
          `t1.start()` then `t2.start()` - both real threads are now
          running concurrently; the operating system, not this lesson's
          own code, decides the exact order their individual print
          statements actually interleave in.
        - >
          Both threads read `current` as `None` before either one writes
          anything - this is true in every real run of this lab, because
          each thread's own `time.sleep(0.05)` happens only AFTER its own
          read, giving the other thread ample time to also complete its
          own read first.
        - >
          Both threads then write their own `client_id` into the shared
          dict - whichever one's write actually executes second (an
          outcome this lesson's own two captured real runs show going
          both ways) becomes the final value; the other thread's earlier
          write is silently gone, with nothing anywhere reporting that it
          was ever overwritten.
    cs_lens: >
      This is a **race condition**: the correctness of a result depending
      on the precise, unguaranteed timing of two concurrent flows of
      execution. Also recognized in: two people editing the same shared
      spreadsheet cell at nearly the same instant, where the second save
      silently wins; two shoppers both trying to buy the last unit of a
      product at the same moment, both seeing "in stock" a moment before
      either checkout is confirmed; two threads incrementing a shared
      counter without a lock, losing one of the two increments entirely;
      and, in this project's own domain, the exact scenario `machine.py`'s
      own `current_operator_client_id` field already exists to represent
      - two real operators' clients both able to reach the same real
      machine's claim at once.
    se_lens: >
      The design principle at stake is recognizing that "read, decide,
      write" is not automatically one indivisible step just because it
      is written as consecutive lines of code - a second flow of
      execution can run its own steps anywhere in between. The real
      alternative NOT chosen in this lab - and, per `machine.py`'s own
      `"best-effort"` comment, not fully chosen in this project's real
      code either - is assuming only one operator ever touches a given
      machine at a time and never actually coordinating that assumption.
      The honest cost, made concrete by this lab's own two real runs:
      the failure is completely silent - no exception, no error message,
      no log entry - one operator's real, genuine claim on a real
      machine simply vanishes, and nothing in the system, including the
      operator who lost it, is ever told that it happened.
    commands:
      - command: python verification/phase-06/lab_concurrency.py
        explanation: >
          Runs the lab from the repository root; no flags needed. Run it
          more than once, unmodified, to see the real, genuine
          nondeterminism this unit's own two captured runs show - which
          operator ends up "winning" is not fixed by the code at all.
    verification:
      applicable: true
      real_output: |
        === RUN 1 ===
        operator-A checked: machine is currently claimed by None
        operator-B checked: machine is currently claimed by None
        operator-B claimed the machine
        operator-A claimed the machine
        final current_operator_client_id = 'operator-A'
        both operators believed they successfully claimed the machine - nothing raised an error for either one
        === RUN 2 ===
        operator-A checked: machine is currently claimed by None
        operator-B checked: machine is currently claimed by None
        operator-A claimed the machine
        operator-B claimed the machine
        final current_operator_client_id = 'operator-B'
        both operators believed they successfully claimed the machine - nothing raised an error for either one
      output_file: verification/phase-06/lab_concurrency_output.txt
    connection_to_previous: >
      The previous unit showed the cost of ASKING a question over shared
      data; this unit shows a completely different problem with that
      same shared data - two independent flows of execution CHANGING it
      at once, with no guarantee about which one's change actually
      survives.

  - title: "Integrity - Stored Data That Doesn't Actually Obey Its Own Rules"
    problem: >
      `backend/app/models/machine.py`'s real `group_id` column is
      declared as a `db.ForeignKey('machine_groups.id')` - a real,
      already-existing statement in this project's own schema that every
      machine's `group_id` is SUPPOSED to point at a real, existing
      group. What actually happens if something writes a `group_id` that
      does not point at any real group at all, using only a plain data
      structure with none of a real database's own enforcement behind
      it?
    socratic_prompt:
      - >
        `machine.py`'s own real `group_id` column names a real group's
        `id` it is supposed to point to. If nothing is actually
        CHECKING that at the moment a machine record is created, what
        stops a typo, or a deleted group, from leaving a `group_id` that
        points at nothing real at all?
      - >
        The lab below stores a machine pointing at a group_id that was
        never real to begin with. At the exact moment that machine is
        added, does anything about the code notice? If not, when -
        and how - does the problem actually surface?
    project_change:
      reference_source: >
        Real, verbatim, read this session, `backend/app/models/machine.py:83`:
        ```
        group_id = db.Column(db.String(50), db.ForeignKey('machine_groups.id'), nullable=True)
        ```
        This is the real, already-existing declaration that a
        `Machine`'s `group_id` is supposed to reference a real
        `MachineGroup`. The lab below deliberately builds the identical
        shape of relationship - a machine record holding a reference to
        a group - using only plain Python dicts, with none of a real
        `ForeignKey`'s own enforcement behind it, specifically to show
        what that enforcement is actually protecting against.
      files_affected:
        - path: verification/phase-06/lab_integrity.py
          status: new
      change_type: add
      location: N/A - a new, standalone throwaway script; no existing project structure to place it within.
      dependencies: None beyond plain Python.
    new_code:
      applicable: true
      intro: >
        Two plain dicts modeling groups and machines, with nothing
        checking whether a machine's `group_id` actually names a real
        group before accepting it:
      file: verification/phase-06/lab_integrity.py
      status: new
      language: python
      code: |
        groups = {"grp-1": {"name": "Mill Bay"}}
        machines = {}


        def add_machine(machine_id, group_id):
            machines[machine_id] = {"group_id": group_id}
            print(f"added {machine_id!r} pointing at group_id {group_id!r} - nothing checked whether that group actually exists")


        add_machine("m1", "grp-1")               # points at a real, existing group
        add_machine("m2", "grp-does-not-exist")  # points at nothing real - accepted anyway

        print()
        for machine_id, machine in machines.items():
            group = groups.get(machine["group_id"])
            if group is None:
                print(f"{machine_id}: group_id {machine['group_id']!r} does not resolve to any real group - {machine_id} is now an orphaned reference")
            else:
                print(f"{machine_id}: belongs to real group {group['name']!r}")
    updated_project:
      applicable: false
    mechanical_walkthrough:
      applicable: true
      items:
        - element: "groups = {\"grp-1\": {\"name\": \"Mill Bay\"}}"
          explanation: >
            A plain dict modeling this project's own real
            `MachineGroup` table, with exactly one real, genuinely-
            existing group - the only thing in this whole lab that a
            `group_id` could ever legitimately point at.
        - element: "def add_machine(machine_id, group_id): machines[machine_id] = {\"group_id\": group_id}"
          explanation: >
            Stores a new machine record with WHATEVER `group_id` string
            it is given - there is no check anywhere in this function
            for whether that `group_id` names a real key in `groups` at
            all. This is the deliberate absence at the center of this
            unit: a real `db.ForeignKey`, by contrast, is exactly the
            declaration that this exact check should happen.
        - element: "add_machine(\"m1\", \"grp-1\")"
          explanation: >
            Adds a machine whose `group_id` happens to name a real,
            existing group - accepted, and, as the loop below shows,
            correctly resolvable later.
        - element: "add_machine(\"m2\", \"grp-does-not-exist\")"
          explanation: >
            Adds a second machine whose `group_id` names nothing that
            exists in `groups` at all - accepted exactly the same way,
            with the exact same "nothing checked" print, because nothing
            in `add_machine` treats this case any differently at the
            moment it happens.
        - element: "group = groups.get(machine[\"group_id\"])"
          explanation: >
            `dict.get`, fully treated in this lesson's own Header. For
            `m1`, this returns the real `Mill Bay` group's dict; for
            `m2`, it returns `None` - silently, with no exception - which
            is the exact moment this project's real, missing enforcement
            would have needed to catch the problem, and did not.
        - element: "if group is None: ... else: ..."
          explanation: >
            Basic Python conditional branching. The `is None` branch is
            reached only for `m2` - the orphaned reference - and it is
            reached here, in a completely different function, at a
            completely different time, than the moment the bad
            `group_id` was actually written; nothing connects the two
            moments except this lab's own later attempt to resolve it.
    mental_model:
      applicable: false
    execution_trace:
      applicable: false
    cs_lens: >
      This is **referential integrity**: the specific guarantee that a
      stored reference actually points at something real. Also
      recognized in: a shipping form rejecting a ZIP code that does not
      match any real postal code, rather than accepting any five digits;
      a spreadsheet's own data-validation dropdown, restricting a cell to
      only real, listed values instead of any typed string; a compiler's
      type system rejecting code that would construct an object
      referencing something that does not exist; and, closer to this
      project's own real, already-known findings, `create_machine`'s own
      real, already-flagged acceptance of a non-numeric string for its
      `axes` field with zero validation - the identical pattern this
      lab shows, in this project's own real code, for a different
      field.
    se_lens: >
      The design principle is enforcing a real-world rule (a reference
      must point at something that exists) at the moment data is
      written, rather than trusting every future caller to only ever
      write valid references. The real alternative NOT chosen in this
      lab - plain dicts, no `ForeignKey`, no check at write time - is
      cheap and requires no enforcement code at all, which is exactly
      why it is tempting. The honest cost, made concrete by this lab's
      own `m2`: a broken reference is accepted silently, exists
      undetected for as long as nothing happens to look at it, and only
      surfaces later, somewhere else entirely, as a quiet `None` instead
      of a loud error at the actual moment - and, unlike a real
      database's own constraint violation, nothing here ever records
      when or how the bad reference got there in the first place.
    commands:
      - command: python verification/phase-06/lab_integrity.py
        explanation: >
          Runs the lab from the repository root; no flags needed.
    verification:
      applicable: true
      real_output: |
        added 'm1' pointing at group_id 'grp-1' - nothing checked whether that group actually exists
        added 'm2' pointing at group_id 'grp-does-not-exist' - nothing checked whether that group actually exists

        m1: belongs to real group 'Mill Bay'
        m2: group_id 'grp-does-not-exist' does not resolve to any real group - m2 is now an orphaned reference
      output_file: verification/phase-06/lab_integrity_output.txt
    connection_to_previous: >
      The previous unit showed two flows of execution racing to CHANGE
      shared data; this unit shows a different failure entirely - data
      that was never racing anyone, written by one single, uncontested
      call, that is simply wrong the moment it is written, because
      nothing checked it against reality at all.

closing:
  connect_the_pieces: >
    Follow one real machine, `m2`, through every property this lesson
    named. Stored only as a plain Python list in a running process, it
    would vanish the instant that process restarted - written instead to
    a real file, it survives a clean exit, exactly as the persistence
    unit's own two real runs proved. Written, `flush()`ed, and
    `os.fsync()`ed before a deliberate, simulated crash, that same kind
    of write survives even a process that never shuts down cleanly at
    all - durability's own real guarantee, strictly stronger than mere
    persistence. Once safely stored, asking "which machines are down"
    still costs a real, measured amount of work that scales with how
    much data exists in total, not with how selective the real question
    is - querying's own real cost, paid by whoever has to answer it by
    hand. If two operators' clients both reach for the same machine's
    claim at once, whichever one's write happens to run last silently
    wins, and the other is simply gone, with no error anywhere -
    concurrency's own real, silent failure mode. And this same `m2`,
    given a `group_id` that was never real to begin with, is accepted
    without a single check at the moment it is written, only to surface
    later, somewhere else entirely, as a quiet `None` instead of a loud
    error - integrity's own real cost of enforcement never actually
    built. Every one of these five real, measured failures is what a
    real database exists specifically to prevent - which is exactly
    where this curriculum goes next.
  next_lesson_pointer: >
    Next, this same real backend's own schema - `Machine`, `MachineGroup`,
    and the real `group_id` reference this lesson's own integrity unit
    modeled - gets named formally: rows, columns, and relations, the
    actual vocabulary a real relational database uses to describe
    exactly the kind of structured, related data this project already
    has.
