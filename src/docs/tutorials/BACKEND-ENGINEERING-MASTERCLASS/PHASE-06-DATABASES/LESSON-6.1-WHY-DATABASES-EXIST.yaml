      applicable: false
    mechanical_walkthrough:
      applicable: true
      items:
        - element: "with open(DATA_FILE, \"w\") as f: f.write(\"committed-value\")"
          explanation: >
            Opens the real file for writing and writes the string
            `"committed-value"`. At this exact point, Python itself may
            still be holding those bytes in its own internal buffer,
            not yet handed to the operating system at all - `.write()`
            returning does not by itself mean the data is safe against a
            crash.
        - element: "f.flush()"
          explanation: >
            Forces Python's own internal buffer out to the operating
            system. This closes one gap - the data is no longer sitting
            only inside this Python process - but the operating system
            itself may still be holding it in ITS OWN buffer, not yet on
            the physical device; `flush()` alone does not close that
            second gap.
        - element: "os.fsync(f.fileno())"
          explanation: >
            The real construct this whole unit exists to teach: forces
            the operating system to place those bytes on the actual
            physical storage device before this line returns. Only
            after this call has this lab's write earned the word
            "durable" - confirmed as physically stored, not merely
            handed somewhere.
        - element: "os._exit(1)"
          explanation: >
            Ends the process immediately, skipping every normal
            shutdown step - no cleanup, nothing else runs. Placed
            deliberately as the very next line after `os.fsync()`
            returns, so this simulated crash happens strictly AFTER the
            write was confirmed durable, testing exactly the guarantee
            durability makes: a crash here should not be able to lose
            it.
        - element: "os.path.exists(DATA_FILE) (second run)"
          explanation: >
            The same real existence check from the persistence unit,
            here telling this script's second, later invocation that an
            earlier process already ran - specifically, the one that
            just crashed on purpose.
        - element: "with open(DATA_FILE) as f: survived = f.read().strip()"
          explanation: >
            Opens the real file for reading in the second run; basic-
            Python `str.strip()` removes any surrounding whitespace from
            the read string. If durability actually held, this is the
            exact same `"committed-value"` the crashed process wrote,
            recovered by a completely different, later process that had
            no memory of the first one at all.
