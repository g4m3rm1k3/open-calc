      code: |
        import sys
        from pathlib import Path

        sys.path.insert(0, str(Path(__file__).resolve().parent.parent.parent / "backend"))

        from sqlalchemy import text

        from app import create_app, db
        from app.models.machine import Machine

        app = create_app("testing")

        with app.app_context():
            db.session.add_all([
                Machine(id="m1", name="Haas VF-2", category="mill", sub_type="3_axis"),
                Machine(id="m2", name="Haas UMC-750", category="mill", sub_type="5_axis"),
                Machine(id="m3", name="Okuma Genos", category="lathe", sub_type="single_turret"),
                Machine(id="m4", name="Swiss Type A", category="swiss", sub_type="single_turret"),
            ])
            db.session.commit()

            print("SELECT category, COUNT(*) FROM machines GROUP BY category ORDER BY COUNT(*) DESC:")
            query = text(
                "SELECT category, COUNT(*) AS machine_count FROM machines "
                "GROUP BY category ORDER BY machine_count DESC"
            )
            for row in db.session.execute(query):
                print(" ", row)
