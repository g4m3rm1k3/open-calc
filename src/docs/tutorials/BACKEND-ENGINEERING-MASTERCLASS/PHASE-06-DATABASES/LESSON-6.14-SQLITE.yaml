  - title: "Type Affinity - Why a Non-Numeric axes Was Always Possible"
    problem: >
      This curriculum's own Constraints lesson already named a real,
      separate, already-known finding: `create_machine` accepts a
      non-numeric string for `Machine.axes` - a column declared
      `db.Integer` - with zero validation. That finding was about missing
      APPLICATION-level validation. Does SQLite's own real database
      engine, independent of the application entirely, actually enforce
      `axes` being a real number at all?
    socratic_prompt:
      - >
        `Machine.axes` is declared `db.Column(db.Integer, default=3)`. If
        a real client-server database enforced column types strictly, a
        non-numeric value would be refused at the database level even if
        application code never checked it. Does SQLite refuse it too?
      - >
        SQLite's own real `typeof()` function reports the ACTUAL runtime
        type of a stored value. Before running the lab below: what would
        you expect it to report for a value that was declared `INTEGER`
        but was actually stored as a real string?
    project_change:
      reference_source: >
        Real, verbatim, read this session, `backend/app/models/machine.py:63`,
        already cited in this curriculum's own Why Databases Exist
        lesson:
        ```
        axes = db.Column(db.Integer, default=3)
        ```
        This unit proves directly, at the database level, why this
        column - and the already-documented `create_machine` finding
        naming it - was ever able to hold a non-numeric value at all,
        independent of anything the application does or does not
        validate.
      files_affected:
        - path: verification/phase-06/lab_sqlite_type_affinity.py
          status: new
      change_type: add
      location: N/A - a new, standalone script; no existing project structure to place it within.
      dependencies: This project's own real backend, and its already-installed `sqlalchemy`.
    new_code:
      applicable: true
      intro: >
        A real `Machine`, its own `axes` column directly overwritten
        with a non-numeric string, then read back with `typeof()`:
      file: verification/phase-06/lab_sqlite_type_affinity.py
      status: new
      language: python
      code: |
        import sys
        from pathlib import Path

        sys.path.insert(0, str(Path(__file__).resolve().parent.parent.parent / "backend"))

        from sqlalchemy import text

        from app import create_app, db
        from app.models.machine import Machine

        app = create_app("testing")

        with app.app_context():
            db.session.add(Machine(id="m1", name="Haas VF-2", category="mill", sub_type="3_axis", axes=3))
            db.session.commit()

            print("Machine.axes is declared db.Integer - storing a non-numeric string directly:")
            db.session.execute(text("UPDATE machines SET axes = 'not-a-number' WHERE id = 'm1'"))
            db.session.commit()

            row = list(db.session.execute(text("SELECT id, axes, typeof(axes) FROM machines WHERE id = 'm1'")))
            print(f"real stored value and its real runtime type: {row}")
    updated_project:
      applicable: false
    mechanical_walkthrough:
      applicable: true
      items:
        - element: "UPDATE machines SET axes = 'not-a-number' WHERE id = 'm1'"
          explanation: >
            A real `UPDATE`, already fully treated in this curriculum's
            own SQL lesson, deliberately storing a non-numeric string in
            a column declared `db.Integer` - if SQLite genuinely
            enforced that declaration, this statement itself should
            fail.
        - element: "db.session.commit() (succeeds)"
          explanation: >
            Already fully treated in this curriculum's own Transactions
            lesson - succeeds without incident, the first real proof
            that nothing here was refused at all.
        - element: "typeof(axes)"
          explanation: >
            Fully treated in this lesson's own Header - reports the
            REAL, actual storage class SQLite used for the value just
            written, independent of what `axes`'s own column declaration
            says.
        - element: "the real result: ('m1', 'not-a-number', 'text')"
          explanation: >
            Confirms directly: the stored value is genuinely
            `'not-a-number'`, and SQLite's own `typeof()` reports its
            real storage class as `'text'` - not `'integer'`, despite the
            column's own declared type.
    mental_model:
      applicable: false
    execution_trace:
      applicable: false
    cs_lens: >
      This is **type affinity**, fully named in this lesson's own
      Header - SQLite's own real, specific choice to treat a declared
      column type as a preference, not an enforced guarantee. Also
      recognized in: a JavaScript variable accepting any real value
      regardless of what it held before, unlike a statically-typed
      language's own variable; a spreadsheet cell accepting text in a
      column formatted as "Number," displaying it unconverted; a loosely
      typed configuration file accepting a quoted string where a number
      was expected, without validating it; and, in this project's own
      domain, this exact real column - `Machine.axes`, already flagged
      in this curriculum's own Constraints lesson as accepting invalid
      application input, now shown to be permitted at the database
      level too.
    se_lens: >
      The design principle behind SQLite's own real type affinity is
      flexibility - a column's declared type guides storage without
      rigidly enforcing it, useful for a lightweight, embedded engine
      not built around strict schema enforcement as its primary job. The
      real alternative NOT chosen by SQLite itself - refusing a
      non-numeric value for an `INTEGER` column outright, the way a real
      client-server database more commonly would - would have caught
      this project's own already-known `axes` finding at the database
      level, regardless of whatever the application itself validates or
      fails to. The honest cost of the flexibility SQLite actually
      provides: this project's own real schema cannot rely on its
      declared column types alone to guarantee real data quality - only
      application-level validation, which this curriculum's own
      Constraints lesson already found missing for this exact column.
    commands:
      - command: backend\.venv\Scripts\python.exe verification\phase-06\lab_sqlite_type_affinity.py
        explanation: >
          Run from the manufacturing-platform repository root, using
          this project's own real backend virtual environment.
    verification:
      applicable: true
      real_output: |
        Seeding default users...
        Machine.axes is declared db.Integer - storing a non-numeric string directly:
        real stored value and its real runtime type: [('m1', 'not-a-number', 'text')]
      output_file: verification/phase-06/lab_sqlite_type_affinity_output.txt
    connection_to_previous: >
      The previous unit named SQLite as a specific, real engine; this
      unit proves one of its own real, distinctive behaviors, and
      connects it to an already-known finding from earlier in this
      curriculum. The final unit proves a second, equally real
      limitation.

  - title: "Single-Writer Concurrency - A Real Ceiling on Top of This Project's Own"
    problem: >
      This curriculum's own Why Databases Exist lesson already showed
      two real threads racing over a shared Python dict, with no
      database involved at all. If two genuinely SEPARATE real
      connections both tried to WRITE to the identical real SQLite
      database file at the same time, does SQLite itself add any real
      limitation of its own, on top of whatever the application already
      does or does not coordinate?
    socratic_prompt:
      - >
        If one real connection has an open, uncommitted write
        transaction against a real SQLite file, and a second, separate
        connection tries to write to the SAME file before the first one
        commits, what would you expect SQLite itself to do?
      - >
        Does this real limitation, if it exists, depend on the
        application's own code coordinating anything at all - or is it
        something SQLite itself enforces regardless?
    project_change:
      reference_source: >
        No real project file changes - this unit demonstrates a real,
        general limitation of SQLite itself, using two genuinely separate
        real `sqlite3` connections to a shared, real, temporary file -
        the identical real engine this project's own `config.py` already
        uses for real, per this curriculum's own Why Databases Exist and
        SQLite (this lesson's own first) units.
      files_affected:
        - path: verification/phase-06/lab_sqlite_single_writer.py
          status: new
      change_type: add
      location: N/A - a new, standalone script; no existing project structure to place it within.
      dependencies: None beyond Python's own standard library (`sqlite3`).
    new_code:
      applicable: true
      intro: >
        Two real, separate `sqlite3` connections to the identical real
        file - one holds an open write transaction while the other tries
        to write too:
      file: verification/phase-06/lab_sqlite_single_writer.py
      status: new
      language: python
      code: |
        import os
        import sqlite3
        from pathlib import Path

        DB_PATH = str(Path(__file__).resolve().parent / "lock_demo.db")
        if os.path.exists(DB_PATH):
            os.remove(DB_PATH)

        connection_a = sqlite3.connect(DB_PATH, timeout=0.5)
        connection_a.execute("CREATE TABLE t (id INTEGER)")
        connection_a.commit()

        connection_b = sqlite3.connect(DB_PATH, timeout=0.5)

        connection_a.execute("BEGIN IMMEDIATE")
        connection_a.execute("INSERT INTO t VALUES (1)")
        print("connection A holds a real, open write transaction (not committed yet)")

        try:
            connection_b.execute("INSERT INTO t VALUES (2)")
            connection_b.commit()
            print("connection B wrote fine too - no lock")
        except sqlite3.OperationalError as e:
            print(f"connection B's own real write was refused: {e}")

        connection_a.commit()
        print("connection A commits - the lock is released")

        connection_b.execute("INSERT INTO t VALUES (2)")
        connection_b.commit()
        print("connection B's identical write now succeeds")

        connection_a.close()
        connection_b.close()
        os.remove(DB_PATH)
    updated_project:
      applicable: false
    mechanical_walkthrough:
      applicable: true
      items:
        - element: "sqlite3.connect(DB_PATH, timeout=0.5) (both connections)"
          explanation: >
            Python's own standard-library `sqlite3` module (basic
            Python, already available without installing anything),
            opening two genuinely separate real connections to the
            IDENTICAL real file; `timeout=0.5` bounds how long each
            connection waits for a lock before giving up, rather than
            waiting forever.
        - element: "connection_a.execute(\"BEGIN IMMEDIATE\")"
          explanation: >
            A real SQLite statement, already established as basic real
            SQL usage in this curriculum's own SQL lesson, explicitly
            starting a real write transaction and acquiring SQLite's own
            real write lock immediately, rather than waiting until the
            first actual write.
        - element: "connection_b.execute(\"INSERT INTO t VALUES (2)\") (raises)"
          explanation: >
            A second, real, genuinely separate connection attempting to
            write to the SAME real file while connection A's own
            transaction is still open - SQLite itself, not any
            application code, refuses this.
        - element: "except sqlite3.OperationalError as e: ..."
          explanation: >
            A real, standard-library exception, distinct from the real
            SQLAlchemy `IntegrityError` this curriculum has used
            elsewhere - `"database is locked"` is SQLite's own real,
            literal message for exactly this situation.
        - element: "connection_a.commit() / connection_b.execute(...) (succeeds)"
          explanation: >
            Once connection A's own transaction actually ends, the
            IDENTICAL write from connection B, retried, succeeds - proof
            this is genuinely about the transaction being open, not
            about connection B being broken in some other way.
    mental_model:
      applicable: true
      diagram: |
        connection A                       connection B
        -------------                       -------------
        BEGIN IMMEDIATE
        INSERT INTO t VALUES (1)
        (transaction still open,
         real write lock held)
                                            INSERT INTO t VALUES (2)
                                            -> OperationalError:
                                               "database is locked"
        commit()
        (real write lock released)
                                            INSERT INTO t VALUES (2)
                                            -> succeeds

        SQLite allows only one real, open write transaction against a
        given database at a time - a second one waits, or is refused,
        regardless of what either connection's own application code
        does to coordinate.
    execution_trace:
      applicable: false
    cs_lens: >
      This is **single-writer concurrency**, fully named in this
      lesson's own Header - a real, engine-level constraint layered on
      top of whatever the application itself does or does not
      coordinate. Also recognized in: a single-user desktop file locked
      by whichever program opened it for editing first, refusing a
      second program's own attempt to save; a printer accepting only one
      real print job at a time, queuing or refusing the rest; a
      single-threaded event loop processing one real task fully before
      starting the next; and, in this project's own domain, this
      curriculum's own Why Databases Exist lesson's own real concurrency
      lab - two operators racing over a shared value with NOTHING
      coordinating them - now layered under a real, additional guarantee
      SQLite itself provides for actual writes, regardless of whether
      the application coordinates anything at all.
    se_lens: >
      The design principle is that SQLite's own embedded, serverless
      design - already named in this lesson's own first unit - has no
      separate server process to coordinate multiple simultaneous real
      writers, so it enforces safety the only way it can: by refusing a
      second real writer outright rather than risking real corruption.
      The real alternative NOT chosen by this project - a real
      client-server database, supporting many simultaneous real writers
      - is exactly what `backend/config.py`'s own real comment already
      names as available but unused. The honest cost of this project's
      own real, current choice: every real, concurrent write this
      application ever needs to make competes for the SAME single real
      write lock, a genuine, real ceiling this curriculum's own earlier
      Concurrency unit's own operator-claiming race never had to
      contend with at all, since it never touched a real database file.
    commands:
      - command: python verification/phase-06/lab_sqlite_single_writer.py
        explanation: >
          Runs the lab from the manufacturing-platform repository root;
          no flags needed - uses only Python's own standard library.
          Creates and removes a real, temporary file database under
          `verification/phase-06/` for the duration of the run.
    verification:
      applicable: true
      real_output: |
        connection A holds a real, open write transaction (not committed yet)
        connection B's own real write was refused: database is locked
        connection A commits - the lock is released
        connection B's identical write now succeeds
      output_file: verification/phase-06/lab_sqlite_single_writer_output.txt
    connection_to_previous: >
      The previous unit proved a real SQLite-specific data behavior;
      this unit closes the lesson, and this phase, with a real
      SQLite-specific concurrency limitation - the last of this
      project's own real, current database engine's own particular
      properties this phase set out to study.

closing:
  connect_the_pieces: >
    Follow this project's own real database engine, SQLite, through
    every unit, and back through this entire phase. `backend/config.py`
    named it plainly from Lesson 6.1 onward - a real, embedded, file-
    based engine, never a separate server, used identically for
    development, testing, and (per its own comment) production too. That
    real choice is exactly why `Machine.axes`, declared `db.Integer`,
    could genuinely store the non-numeric string `'not-a-number'`,
    confirmed by SQLite's own real `typeof()` reporting `'text'` - not a
    missing check in this project's own code, this lesson's own second
    unit shows, but a real property of the specific engine underneath
    it, already flagged as a separate finding in this curriculum's own
    Constraints lesson. And that same embedded, serverless design is
    exactly why a second, real, separate connection's own write was
    refused outright - `"database is locked"` - while a first
    connection's own transaction stayed open, a real ceiling on
    concurrent writes that has nothing to do with whatever the
    application itself coordinates, and everything to do with which
    real engine this project chose.
  next_lesson_pointer: >
    Phase 6 is complete - every real term this phase set out to teach,
    from why a database exists at all to the real, particular engine
    this project actually runs, has now been shown directly against this
    project's own real code, real schema, and real data, not invented
    from scratch. Next, this curriculum turns to the real tool that has
    been generating every one of this phase's own SQL statements
    underneath a Python object all along: SQLAlchemy itself, studied as
    its own real subject rather than a means to an end.
