number: "6.14"
title: "SQLite"
path_note: >
  File paths under backend/... refer to the real manufacturing-platform
  repository. Paths under verification/... refer to that same
  repository's verification folder.

what_you_will_build: >
  Two real scripts naming what has actually been true underneath every
  lesson in this entire phase: this project's own real database has
  always been SQLite specifically, not a generic stand-in. The first
  proves a real, distinctive SQLite behavior - a column declared
  `db.Integer` genuinely accepting, and storing, a non-numeric string,
  confirmed by SQLite's own real `typeof()` function - which turns out
  to be the real, underlying reason a much earlier, already-known
  finding in this project (`create_machine` accepting a non-numeric
  `axes` value) was ever possible at the database level at all. The
  second proves a real, single-writer limitation directly: a second,
  genuinely separate connection's own write is refused outright,
  `"database is locked"`, while a first connection's own write
  transaction is still open.

what_you_need_to_know_first: >
  This curriculum's own Why Databases Exist lesson - `backend/config.py`'s
  own real `SQLALCHEMY_DATABASE_URI`, already cited there, pointing at a
  real SQLite file; this curriculum's own Transactions lesson - what an
  open, uncommitted transaction is, and this curriculum's own Constraints
  lesson's own already-documented finding that `create_machine` accepts a
  non-numeric `axes` value with zero validation.

terms:
  - name: "SQLite (as a specific engine)"
    definition: >
      A real, specific relational database engine - not a generic
      stand-in for "a database" - that runs embedded directly inside the
      same process as the application using it, storing an entire real
      database as one ordinary file (or, this curriculum's own real
      `TestingConfig`, entirely in memory), with no separate database
      server process involved at all. It exists as its own real,
      distinct thing from a client-server database (like PostgreSQL or
      MySQL) because embedding the engine directly removes an entire
      real layer - no server to install, configure, or connect to over a
      network - at the real cost of the specific limitations this
      lesson's own two units demonstrate directly.
  - name: "type affinity"
    definition: >
      SQLite's own real, specific rule for how strictly a column's
      declared type is actually enforced: a declared type is a strong
      preference for how a value SHOULD be stored, not a hard guarantee
      of what CAN be - a column declared `INTEGER` will genuinely accept,
      and store, a real value that is not numeric at all. It exists
      because SQLite's own real, documented type system was designed
      around flexibility rather than the strict type enforcement a
      client-server database more commonly provides for the identical
      declared column type - a real, specific SQLite behavior, not a
      general SQL guarantee.
  - name: "single-writer concurrency"
    definition: >
      SQLite's own real, specific limitation that only one real
      connection may hold an open write transaction against a given
      database at a time - a second, real, concurrent attempt to write
      is refused outright until the first one's own transaction ends,
      rather than both being allowed to proceed at once. It exists as a
      real, direct consequence of SQLite's own embedded, serverless
      design: with no separate server process to coordinate multiple
      real writers the way a client-server database's own server
      process can, SQLite instead locks the entire real database file
      for the duration of one real write transaction at a time.

objects_and_methods:
  - name: "typeof()"
    what_it_is: >
      A real, built-in SQLite SQL function that returns the actual,
      real runtime type SQLite is storing for a given value - `'integer'`,
      `'text'`, `'real'`, `'null'`, or `'blob'` - regardless of what type
      the column holding it was declared with.
    implementation: >
      `typeof(column_name)`, called inside a real `SELECT`, already
      fully treated in this curriculum's own SQL lesson - returns one of
      SQLite's own five real, named storage classes as a string.
    its_use: >
      This lesson's own Type Affinity unit uses it directly to prove,
      not merely assert, that a value stored in a column declared
      `db.Integer` is genuinely being stored as real text underneath,
      exactly as entered.
    type: A real, built-in SQLite SQL function.
    responsibility: >
      Reporting the real, actual storage class SQLite is using for one
      specific value, as opposed to whatever type its own column was
      declared with.
    depends_on: A real column reference inside a real SELECT statement.
    connects_to: >
      Called directly inside this lesson's own real `SELECT`, immediately
      after a real `UPDATE` deliberately stores a non-numeric string in
      an `INTEGER`-declared column.
    shape: Takes one value in, returns one of five real, named strings out.

