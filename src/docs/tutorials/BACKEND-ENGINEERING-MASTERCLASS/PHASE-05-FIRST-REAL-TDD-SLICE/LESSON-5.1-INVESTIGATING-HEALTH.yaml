number: "5.1"
title: "Investigating /health"
path_note: >
  File paths under backend/... refer to the real manufacturing-platform
  repository. Paths under verification/... refer to that same
  repository's verification folder.

what_you_will_build: >
  This curriculum's first real, PERMANENT test file -
  `backend/tests/test_health.py` - not a throwaway `verification/` lab
  like every earlier lesson, but real code that joins this project's
  own actual test suite. Seven real characterization tests, pinning
  down exactly what this project's own two, real, pre-rebuild health
  endpoints - `/health` and `/api/health` - actually do today: their
  real status codes, real `Content-Type`, and real, complete body
  shapes, closing on one real test proving directly what this whole
  slice exists to fix - the two endpoints disagree with each other
  about the identical real question.

what_you_need_to_know_first: >
  What characterization testing is and why it captures current, real
  behavior before changing anything (already studied, as a lab
  exercise, in an earlier phase); what pytest fixtures are; what the
  real WSGI application object and Flask routing this project's own
  backend uses actually do.

terms:
  - name: characterization test (applied for real)
    definition: >
      A real, permanent test asserting exactly what a real, existing
      implementation currently does - not what it should do - written
      before that implementation changes, so any real deviation later
      is a deliberate, visible decision rather than an accidental,
      silent one. It exists, in this lesson specifically, as the first
      real application (not a lab exercise) of characterization testing
      anywhere in this curriculum - the real safety net this entire
      phase's own rebuild depends on.

objects_and_methods:
  - name: health_check (the bare /health route)
    what_it_is: >
      A real, existing Flask view function, registered directly on the
      `app` object itself - not through a blueprint - already read in
      an earlier phase, characterized here for the first time with real,
      permanent tests.
    implementation: >
      `@app.route('/health') def health_check(): return {'status':
      'healthy', 'message': 'Manufacturing Platform API is running'}`
      (`backend/app/__init__.py:426-439`) - returns a real, bare Python
      dict, with no explicit status code and no `jsonify(...)` call,
      relying on Flask's own automatic dict-to-JSON conversion (already
      studied in Phase 4).
    its_use: >
      This lesson's own real tests call it directly, pinning its exact
      real status code, `Content-Type`, and body shape.
    type: A Flask view function, registered directly on `app`, not a
      blueprint.
    responsibility: >
      Reporting this backend's own health, at the bare, real,
      infra-conventional URL (`/health`) real tools like Kubernetes and
      load balancers are documented, in this project's own real code
      comments, to expect.
    depends_on: Nothing - a real, unconditional, hardcoded response.
    connects_to: >
      Registered with no `@token_required` decorator at all; this
      lesson's own real test file is the entire specimen this unit's
      characterization is built around.
    shape: >
      Returns a real, bare `dict`; Flask converts it into a real
      response with an implicit `200`.

  - name: health_check (the /api/health route, health_bp)
    what_it_is: >
      A real, existing Flask view function, registered through its own
      real blueprint, sharing its real Python function name with the
      bare `/health` route above (a genuine, harmless naming
      coincidence, since the two live in separate real modules).
    implementation: >
      `health_bp = Blueprint('health', __name__)`
      `@health_bp.route('/health', methods=['GET']) def health_check():
      return jsonify({'status': 'online', 'message': 'Manufacturing
      Data Platform Backend is ready.', 'version': '1.0.0'})`
      (`backend/app/routes/health.py:1-11`) - registered with a real
      `url_prefix='/api'` (`backend/app/routes/__init__.py:16`),
      producing the real, final URL `/api/health`.
    its_use: >
      This lesson's own real tests call it directly too, pinning its
      own, genuinely different real status code, `Content-Type`, and
      body shape.
    type: A Flask view function, registered through `health_bp`.
    responsibility: >
      Reporting this backend's own health at the real, `/api`-prefixed
      URL every other real business route in this project also uses.
    depends_on: Nothing - a real, unconditional, hardcoded response.
    connects_to: >
      Also registered with no `@token_required` decorator; its own
      real, different body shape from the bare `/health` route is the
      central real finding this entire lesson exists to document.
    shape: >
      Returns a real, explicit `jsonify(...)` call; an implicit `200`.

concept_units:
  - title: "Characterizing /health - The Bare, Infra-Conventional Endpoint"
    problem: >
      Before anything about this project's own two health endpoints
      changes, what real, exact, current behavior does the bare
      `/health` route actually have?
    socratic_prompt:
      - >
        `health_check`'s own real code
        (`backend/app/__init__.py:426-439`) returns a bare dict with two
        real keys, `'status'` and `'message'`. Before running anything,
        what real, exact value would you predict for `'status'`, given
        its own real key name?
      - >
        This route is registered directly on `app`, never through a
        blueprint, with no `@token_required` decorator anywhere. What
        does that suggest about who this specific real endpoint is
        actually meant to be reachable by?
    project_change:
      reference_source: >
        Real specimen: `backend/app/__init__.py:426-439`
        (`health_check`), read again this session.
      files_affected:
        - path: backend/tests/test_health.py
          status: new
      change_type: add
      location: >
        `backend/tests/` - this project's own real, existing test
        directory, already holding `test_operation_manager.py` and
        `test_part_model.py`.
      dependencies: >
        A real, running app built via `create_app("testing")`; `pytest`,
        already a real, installed dependency this project's own
        existing tests already use (in a real, older `unittest.TestCase`
        style this lesson deliberately does not copy - see this unit's
        own SE Lens).
    new_code:
      applicable: true
      intro: >
        Three real, permanent tests, pinning the bare `/health` route's
        exact current behavior:
      file: backend/tests/test_health.py
      status: new
      language: python
      code: |
        import pytest

        from app import create_app


        @pytest.fixture
        def client():
            app = create_app("testing")
            with app.app_context():
                yield app.test_client()


        class TestLegacyHealthEndpoints:
            def test_bare_health_status_code(self, client):
                response = client.get("/health")
                assert response.status_code == 200

            def test_bare_health_content_type(self, client):
                response = client.get("/health")
                assert response.content_type == "application/json"

            def test_bare_health_body_shape(self, client):
                response = client.get("/health")
                assert response.get_json() == {
                    "status": "healthy",
                    "message": "Manufacturing Platform API is running",
                }
    updated_project:
      applicable: false
    mechanical_walkthrough:
      applicable: true
      items:
        - element: '@pytest.fixture def client(): app = create_app("testing"); with app.app_context(): yield app.test_client()'
          explanation: >
            A real, plain pytest fixture - not the `unittest.TestCase`
            `setUp`/`tearDown` style this project's own existing tests
            use - building a genuinely fresh real app and client for
            every real test function that requests it, matching this
            curriculum's own earlier, real testing lessons.
        - element: 'class TestLegacyHealthEndpoints:'
          explanation: >
            A real, deliberately-named class - "Legacy" marks these
            real tests as characterizing the pre-rebuild implementation
            specifically, not this project's own permanent, ongoing
            contract, which Lesson 5.4 is expected to test separately
            once the rebuild lands.
        - element: 'def test_bare_health_status_code(self, client): response = client.get("/health"); assert response.status_code == 200'
          explanation: >
            Pins the real, current status code - a real, concrete
            assertion a future reader (or a future accidental change)
            could break, and would immediately know it broke.
        - element: 'def test_bare_health_body_shape(self, client): assert response.get_json() == {"status": "healthy", "message": "..."}'
          explanation: >
            Pins the real, exact, complete body - every real key and
            every real value, not just "some real dict came back."
    mental_model:
      applicable: false
    execution_trace:
      applicable: false
    cs_lens: >
      This is **characterization testing, applied for real** - the
      identical real technique an earlier phase's own lab exercise
      taught, now protecting an actual, real, permanent piece of this
      project's own codebase for the first time. Also recognized in: a
      real "golden file" test suite, pinning a real, complex program's
      exact current output before a real refactor; a real API
      contract-testing tool, capturing a real, live service's actual
      responses as a real baseline; and, in this project's own domain,
      measuring a real, existing part's actual dimensions before
      attempting to improve the real process that makes it.
    se_lens: >
      The design principle behind writing these real tests as plain
      pytest, rather than matching this project's own existing
      `unittest.TestCase` style (already seen in
      `backend/tests/test_operation_manager.py`), is that this
      curriculum's own earlier testing phase already taught real pytest
      fixtures as the more capable, more idiomatic real approach - this
      lesson doesn't silently copy the older real style just because
      it's already present; it explains the real deviation directly, as
      the project's own stated rules require. The real alternative not
      chosen: matching the existing style for real, local consistency;
      the honest, real cost of diverging instead: this project's own
      real test suite now has two genuinely different real testing
      styles coexisting, until (or unless) a later phase unifies them.
    commands:
      - command: backend/.venv/Scripts/python.exe -m pytest tests/test_health.py -v
        explanation: >
          Runs this real, permanent test file from `backend/`, using
          this project's own real, installed pytest - the identical
          real command this project's own existing tests are run with.
