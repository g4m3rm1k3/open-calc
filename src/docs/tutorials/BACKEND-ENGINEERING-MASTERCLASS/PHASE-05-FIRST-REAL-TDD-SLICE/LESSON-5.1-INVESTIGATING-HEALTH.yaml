  - title: "Characterizing /api/health - The API-Conventional Twin"
    problem: >
      `/api/health` answers the identical real question as `/health` -
      "is this backend healthy?" What real, exact, current behavior
      does it actually have?
    socratic_prompt:
      - >
        `health_bp`'s own real registration
        (`backend/app/routes/__init__.py:16`,
        `app.register_blueprint(health_bp, url_prefix='/api')`) gives
        this route the real `/api` prefix every other business route in
        this project also uses. Would you expect its own real response
        shape to match `/health`'s, or to follow whatever convention
        `/api/...` routes elsewhere in this project already established?
      - >
        `health.py`'s own real code
        (`backend/app/routes/health.py:5-11`) includes a real
        `'version'` field neither the bare `/health` route nor this
        curriculum's own earlier lessons have seen on any other health
        specimen. Before reading below, would you predict its real,
        exact value?
    project_change:
      reference_source: >
        Real specimen: `backend/app/routes/health.py:1-11`
        (`health_check`) and `backend/app/routes/__init__.py:16`, both
        read again this session.
      files_affected:
        - path: backend/tests/test_health.py
          status: modified
      change_type: add
      location: >
        `backend/tests/test_health.py`, inside the same real
        `TestLegacyHealthEndpoints` class the previous unit started.
      dependencies: >
        The identical real `client` fixture the previous unit already
        defined in this same real file.
    new_code:
      applicable: true
      intro: >
        Three more real, permanent tests, appended inside the identical
        real `TestLegacyHealthEndpoints` class the previous unit
        started (directly below its own three real tests, in the
        identical real file), pinning `/api/health`'s own exact current
        behavior:
      file: backend/tests/test_health.py
      status: existing
      language: python
      code: |
        def test_api_health_status_code(self, client):
            response = client.get("/api/health")
            assert response.status_code == 200

        def test_api_health_content_type(self, client):
            response = client.get("/api/health")
