closing:
  connect_the_pieces: >
    Two real health endpoints, both already living in this project's
    own real backend, characterized for the first time with real,
    permanent tests rather than a throwaway lab: `/health`'s own real,
    two-key body (`status: healthy`), and `/api/health`'s own real,
    three-key body (`status: online`, plus a real `version`). Six real
    tests pinning each one's own exact current behavior independently,
    and a seventh, real, closing test proving directly what both of
    them, together, actually mean: two real answers to the identical
    real question, genuinely disagreeing with each other, with neither
    one checking any real, actual system state at all.
  next_lesson_pointer: >
    This lesson found the real problem and pinned it down with real,
    permanent tests; next, this curriculum designs the actual fix - one
    real, canonical health contract, deciding what shape, what status
    code, and what real semantics this project's health check should
    actually have, before a single line of the real implementation
    changes.
