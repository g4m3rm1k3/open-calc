  - title: "The Two Endpoints Disagree - The Real Finding This Slice Exists to Fix"
    problem: >
      Both `/health` and `/api/health` claim to answer "is this backend
      healthy?" Run side by side, does either real answer actually agree
      with the other?
    socratic_prompt:
      - >
        `/health`'s own real body has two keys; `/api/health`'s own real
        body has three, and neither one uses the identical real word for
        `'status'` (`'healthy'` versus `'online'`). If a real caller
        checked `response['status'] == 'healthy'` against `/api/health`,
        what would that real check actually return?
      - >
        Neither real endpoint's own code checks anything about this
        project's own actual, real system state - no real database
        query, no real check of any kind. What does that suggest about
        what "healthy" and "online" even mean, in either real
        implementation, today?
    project_change:
      reference_source: >
        Real specimens: `backend/app/__init__.py:426-439` and
        `backend/app/routes/health.py:1-11`, both already cited in this
        lesson's own earlier units.
      files_affected:
        - path: backend/tests/test_health.py
          status: modified
      change_type: add
      location: >
        `backend/tests/test_health.py`, the same real
        `TestLegacyHealthEndpoints` class, as its own final real test.
      dependencies: >
        The identical real `client` fixture and both real endpoints
        this lesson's own earlier units already characterized.
    new_code:
      applicable: true
      intro: >
        One real, final test, comparing both real responses directly:
      file: backend/tests/test_health.py
      status: existing
      language: python
      code: |
        def test_the_two_endpoints_disagree(self, client):
            """
            The real, central finding this whole slice exists to fix: two
            endpoints, both claiming to report this backend's health,
            returning two genuinely different real shapes for the identical
            real question.
            """
            bare = client.get("/health").get_json()
            api = client.get("/api/health").get_json()
            assert bare.keys() != api.keys()
            assert bare["status"] != api["status"]
    updated_project:
      applicable: false
    mechanical_walkthrough:
      applicable: true
      items:
        - element: 'bare = client.get("/health").get_json(); api = client.get("/api/health").get_json()'
          explanation: >
            Calls both real, already-characterized endpoints together,
            in the identical real test, specifically to compare their
            real outputs directly rather than trusting two, separate
            real assertions written in two different real tests.
        - element: 'assert bare.keys() != api.keys()'
          explanation: >
            Confirms, for real, the real, structural disagreement -
            different real key sets for the identical real concept.
        - element: 'assert bare["status"] != api["status"]'
          explanation: >
            Confirms the deeper, real, semantic disagreement - even the
            one real key both bodies happen to share,
            `'status'`, carries two genuinely different real vocabulary
            words (`'healthy'` vs `'online'`) for what should be the
            identical real fact.
    mental_model:
