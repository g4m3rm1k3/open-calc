      real calibration drift neither gauge's own isolated reading would
      reveal.
    se_lens: >
      The design principle is that characterizing two related real
      specimens SEPARATELY (the previous two units) doesn't automatically
      reveal how they relate - this unit's own direct, real comparison
      is what actually proves the inconsistency, in one real,
      unambiguous assertion, rather than leaving a reader to notice it
