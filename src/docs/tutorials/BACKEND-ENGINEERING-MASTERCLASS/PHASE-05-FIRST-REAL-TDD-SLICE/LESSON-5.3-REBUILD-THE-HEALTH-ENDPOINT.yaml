      final assembly; and, in this project's own domain, individually
      calibrated real machine axes, re-verified together once a real
      program actually runs a real cut using all of them at once.
    se_lens: >
      The design principle behind this closing, real, end-to-end proof
      is that neither of this lesson's own earlier units, alone, fully
      proves the fix - each one only showed ITS OWN real route calling
      the real, shared function correctly, never both together, and
      never the real, unhealthy path through the real, live app at all.
      The real alternative not chosen: treating the two, earlier,
      real, per-route checks as sufficient; the honest, real value
