number: "5.3"
title: "Rebuild the Health Endpoint"
path_note: >
  File paths under backend/... refer to the real manufacturing-platform
  repository. Paths under verification/... refer to that same
  repository's verification folder.

what_you_will_build: >
  This curriculum's first real, permanent change to this project's own
  actual backend source - not a lab, not a prototype. Lesson 5.2's own
  proven design, wired in for real: one real, shared
  `get_health_response()` function in `backend/app/routes/health.py`,
  called by both `/api/health` (through `health_bp`) and the bare
  `/health` route (`backend/app/__init__.py`), replacing two real,
  independent, disagreeing implementations with one. Proven, end to
  end, through the real, live routes themselves, in both the real
  healthy state and a real, test-doubled unhealthy one - and closing
  honestly on the fact that Lesson 5.1's own characterization tests now
  fail, on purpose, because the real behavior they pinned has
  genuinely, deliberately changed.

what_you_need_to_know_first: >
  Lesson 5.2's own real, proven design - one shared, flat contract, and
  a real database-connectivity check distinguishing healthy from
  unhealthy; Lesson 5.1's own real characterization of the pre-rebuild
  behavior.

terms:
  - name: rebuild (as this curriculum's own real term)
    definition: >
      Replacing a real, existing implementation with a genuinely new
      one that satisfies a real, deliberately-designed contract - not a
      cosmetic refactor, and not a change made to make a failing test
      pass by coincidence. It exists, in this lesson specifically, as
      this curriculum's own first real instance of the entire
      masterclass's own central method: characterize the old, design
      the new, implement it for real, then prove it.

objects_and_methods:
  - name: get_health_response (real, now live)
    what_it_is: >
      The real function Lesson 5.2 only prototyped, now living for real
      in this project's own backend.
    implementation: >
      `def get_health_response(): try: db.session.execute(text('SELECT
      1')); return {'status': 'healthy', 'message': '...', 'version':
      API_VERSION}, 200 except OperationalError: return {'status':
      'unhealthy', 'message': '...', 'version': API_VERSION}, 503`
      (`backend/app/routes/health.py:24-45`) - the identical real logic
      Lesson 5.2 proved, now the real, single source of truth both
      health routes actually call.
    its_use: >
      This lesson calls it, indirectly, through both real, live routes -
      never directly - specifically to prove the real wiring, not just
      the function in isolation (already proven in Lesson 5.2).
    type: A real, module-level function, now part of this project's own
      backend.
    responsibility: >
      Being the one, real, actual source of truth both `/health` and
      `/api/health` now depend on for what "healthy" means.
    depends_on: >
      A real, active Flask application context; `db.session`, this
      project's own real, shared SQLAlchemy session.
    connects_to: >
      Called by `health_check` in `backend/app/routes/health.py:48-51`
      (the real `/api/health` route) and, indirectly, by `health_check`
      in `backend/app/__init__.py:426-437` (the real, bare `/health`
      route, via a real, local import).
    shape: >
      Takes no arguments; returns a real `(dict, int)` tuple - always
      one of exactly two real, possible pairs, matching Lesson 5.2's own
      proven design exactly.

  - name: health_check (both real routes, now unified)
    what_it_is: >
      The two, real, existing view functions Lesson 5.1 characterized
      as disagreeing - now both real, thin callers of the identical
      real `get_health_response()`.
    implementation: >
      `backend/app/routes/health.py:48-51`:
      `@health_bp.route('/health', methods=['GET']) def health_check():
      body, status_code = get_health_response(); return jsonify(body),
      status_code`; `backend/app/__init__.py:426-437`:
      `@app.route('/health') def health_check(): from
      app.routes.health import get_health_response; return
      get_health_response()` - the second one relies on Flask's own
      real, automatic `(dict, int)` tuple conversion (already studied in
      Phase 4), confirmed this session to work correctly even for a
      real, non-`200` status code.
    its_use: >
      This lesson calls both, together, in every real state this
      lesson's own units prove, to confirm the real wiring holds
      end-to-end.
    type: Two Flask view functions, one registered through `health_bp`,
      one directly on `app`.
    responsibility: >
      Translating `get_health_response()`'s own real return value into
      an actual real HTTP response - nothing more; neither one makes
      any real decision of its own anymore.
    depends_on: >
      `get_health_response()`'s own real return value.
    connects_to: >
      Both now call the identical real function; this lesson's own
      closing unit is the real, direct proof that doing so actually
      closed the gap Lesson 5.1 found.
    shape: >
      Both return a real HTTP response with `Content-Type:
      application/json`, and either a real `200` or a real `503`,
      matching `get_health_response()`'s own real, current decision.

concept_units:
  - title: "One Real, Shared Check Function"
    problem: >
      Lesson 5.2 proved a real check function in isolation. Wired for
      real into this project's own backend, does it need to change at
      all?
    socratic_prompt:
      - >
        Lesson 5.2's own real `real_health_status(session)` took a
        SQLAlchemy session as an explicit argument. This project's own
        real routes already have `db.session` available via
        `current_app`-style context access (already studied in this
        curriculum's own Flask phase). Does the real, live version still
        need that same real parameter?
      - >
        `backend/app/routes/health.py`'s own real, existing code already
        does `from app import db` at its own top level. Does the real,
        live check function need that real import passed in, or can it
        just use the identical real, already-imported name directly?
    project_change:
      reference_source: >
        Real specimen: `backend/app/routes/health.py:1-11` (the real,
        pre-rebuild file, already read in Lesson 5.1), and
        `verification/phase-05/lab_health_check_semantics.py:8-14`
        (Lesson 5.2's own proven prototype), both read again this
        session.
      files_affected:
        - path: backend/app/routes/health.py
          status: modified
      change_type: replace
      location: >
        `backend/app/routes/health.py` - this project's own real,
        existing health blueprint file, replacing its own previous,
        real, hardcoded implementation entirely.
      dependencies: >
        `sqlalchemy.text` and `sqlalchemy.exc.OperationalError`, real,
        already-installed dependencies this project's own code already
        uses elsewhere; the real, shared `db` object
        (`from app import db`), already this project's own established
        real pattern.
    new_code:
      applicable: true
      intro: >
        The real, complete, new `backend/app/routes/health.py` -
        replacing every line of the real, previous version Lesson 5.1
        characterized, since the real change here touches the whole
        real file (new imports, a new real constant, a new real
        function, and a rewritten real route body), not one isolated
        fragment inside an otherwise-stable structure:
      file: backend/app/routes/health.py
      status: new
      language: python
      code: |
        from flask import Blueprint, jsonify
        from sqlalchemy import text
        from sqlalchemy.exc import OperationalError

        from app import db

        health_bp = Blueprint('health', __name__)

        API_VERSION = '1.0.0'


        def get_health_response():
            try:
                db.session.execute(text('SELECT 1'))
                return {
                    'status': 'healthy',
                    'message': 'Manufacturing Platform API is running.',
                    'version': API_VERSION,
                }, 200
            except OperationalError:
                return {
                    'status': 'unhealthy',
                    'message': 'Database connectivity check failed.',
                    'version': API_VERSION,
                }, 503


        @health_bp.route('/health', methods=['GET'])
        def health_check():
            body, status_code = get_health_response()
            return jsonify(body), status_code
    updated_project:
      applicable: false
    mechanical_walkthrough:
      applicable: true
      items:
        - element: 'API_VERSION = ''1.0.0'''
          explanation: >
            A real, module-level constant - the identical real version
            string the pre-rebuild `/api/health` already used, now
            named once, real and shared, rather than typed twice.
        - element: 'db.session.execute(text(''SELECT 1''))'
          explanation: >
            The identical real check Lesson 5.2 already proved - moved
            here, real and live, using this project's own already-imported
            real `db` object directly instead of a passed-in parameter.
        - element: 'except OperationalError: return {...}, 503'
          explanation: >
            The real, live failure branch - genuinely untested against a
            real, actual outage in THIS unit (that would require
            breaking this project's own real database), but already
            proven correct in isolation in Lesson 5.2, and proven again,
            end-to-end, through the real, live routes, in this lesson's
            own closing unit.
        - element: 'body, status_code = get_health_response(); return jsonify(body), status_code'
          explanation: >
            `/api/health`'s own real route, now reduced to two real
            lines - call the real, shared function, translate its real
            result into a real Flask response. All of its own real
            decision-making logic is gone; `get_health_response` owns
            it now.
    mental_model:
      applicable: false
    execution_trace:
      applicable: false
    cs_lens: >
      This is **extracting a shared decision out of duplicated call
      sites**: two real, independent implementations, each making the
      identical real kind of decision differently, replaced by one real
      function both now defer to. Also recognized in: a real compiler's
      own constant-folding pass, replacing two real, independently
      computed identical values with one, real, shared one; a real
      database's own foreign-key constraint, replacing two, real,
      independently-maintained copies of the same real fact with one,
      real, authoritative source; and, in this project's own domain,
      replacing two real, independently-maintained tool-length tables
      with one, real, shared source both real machines read from.
    se_lens: >
      The design principle is that once a real decision (Lesson 5.2's
      own health semantics) is made once, correctly, every real call
      site should defer to it rather than re-implementing it. The real
      alternative not chosen: copying the real check logic into BOTH
      real route functions separately, preserving the real, historical
      pattern of two real, independent implementations; the honest,
      real cost avoided by extracting one, real, shared function
      instead, proven directly by this unit's own real diff: a future,
      real change to this project's own health semantics now has
      exactly one, real place to happen, not two real places that could
      drift apart again exactly the way Lesson 5.1 found them already
      had.
    commands:
      - command: backend/.venv/Scripts/python.exe -c "import sys; sys.path.insert(0, 'backend'); from app import create_app; app = create_app('testing'); app.app_context().push(); from app.routes.health import get_health_response; print(get_health_response())"
        explanation: >
          Runs the real, live function directly, from the repository
          root, confirming it returns the real, designed shape without
          going through either real route yet.
    verification:
      applicable: true
      real_output: |
        Seeding default users...
        ({'status': 'healthy', 'message': 'Manufacturing Platform API is running.', 'version': '1.0.0'}, 200)
      output_file: verification/phase-05/lesson_5.3_shared_function_output.txt
    connection_to_previous: >
      This is the lesson's first unit - it moves Lesson 5.2's own,
      already-proven prototype into this project's own real, live
      backend for the first time.

  - title: "Wiring the Bare /health Route to the Same Real Function"
    problem: >
      `/api/health` now calls the real, shared function. The bare
      `/health` route, registered directly in
      `backend/app/__init__.py`, still returns its own, real, separate,
