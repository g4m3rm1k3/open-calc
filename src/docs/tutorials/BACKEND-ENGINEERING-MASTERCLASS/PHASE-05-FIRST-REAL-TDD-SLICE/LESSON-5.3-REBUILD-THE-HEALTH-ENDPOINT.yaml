  - title: "Real Proof, End to End - Both Real Routes, Both Real States"
    problem: >
      Both real routes now call the identical real function. Run
      together, through the real, live app - not the isolated function
      Lesson 5.2 already proved - do they actually agree, in both the
      real healthy and real unhealthy case?
    socratic_prompt:
      - >
        Lesson 5.1's own real, permanent test file still asserts the
        OLD, pre-rebuild body shapes. Given this lesson's own real
        changes, would you expect those specific real assertions to
        still pass, or to now fail?
      - >
        If they now fail, does that mean this lesson's own real rebuild
        is broken - or does it mean something else, given
        characterization tests are supposed to pin down real behavior
        AT THE TIME they were written, not forever?
    project_change:
      reference_source: >
        Real specimens: `backend/app/routes/health.py` and
        `backend/app/__init__.py:426-439`, both already modified by this
        lesson's own earlier units.
      files_affected: []
      change_type: none
      location: >
        N/A - a new, standalone script; no existing project structure to
        place it within.
      dependencies: >
        This project's own real, already-rebuilt `create_app` output;
        `unittest.mock.patch`, for the real, unhealthy-path proof.
    new_code:
      applicable: true
      intro: >
        Both real, live routes, called together, in both real states:
      file: verification/phase-05/lab_health_rebuild_proof.py
      status: new
      language: python
      code: |
        import sys
        from unittest.mock import patch
        sys.path.insert(0, "backend")

        from app import create_app, db
        from sqlalchemy.exc import OperationalError

        app = create_app("testing")
        with app.app_context():
            client = app.test_client()

            r1 = client.get("/health")
            r2 = client.get("/api/health")
            print("/health     (healthy) -> status:", r1.status_code, "body:", r1.get_json())
            print("/api/health (healthy) -> status:", r2.status_code, "body:", r2.get_json())

            with patch.object(db.session, "execute", side_effect=OperationalError("SELECT 1", {}, Exception("real connection refused"))):
                r1_down = client.get("/health")
                r2_down = client.get("/api/health")
                print("/health     (real, test-doubled outage) -> status:", r1_down.status_code, "body:", r1_down.get_json())
                print("/api/health (real, test-doubled outage) -> status:", r2_down.status_code, "body:", r2_down.get_json())

            assert r1.get_json() == r2.get_json()
            assert r1.status_code == r2.status_code == 200
            assert r1_down.get_json() == r2_down.get_json()
            assert r1_down.status_code == r2_down.status_code == 503
            print("both real, live routes agree completely, in both real states - the exact real gap Lesson 5.1 found is now closed")
    updated_project:
