    new_code:
      applicable: true
      intro: >
        The real, complete, updated `health_check` function inside
        `create_app` - its own real docstring stays exactly as it
        already was; only the real body, at the bottom, changes:
      file: backend/app/__init__.py
      status: new
      language: python
      code: |
        @app.route('/health')
        def health_check():
            """
            Health check endpoint for monitoring and load balancers.

            WHY THIS EXISTS:
            ─────────────────
            - Kubernetes/Docker use this to check if container is alive
            - Load balancers use this to know if server can receive traffic
            - Monitoring tools use this to alert when API is down

            Returns minimal response to be FAST.
            """
