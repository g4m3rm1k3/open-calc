# What the agent does at each step - the HOW, migrated out of
# LESSON SCHEMA.md's prose so it's an explicit work order instead of
# something to remember to re-apply by feel each time.
#
# validation.yaml holds what Python can mechanically reject.
# This file holds what only judgment/authoring discipline produces -
# a rule belongs here only if Python genuinely cannot check it.

lesson:

  header_its_use_scope:
    problem: >
      "Its use" (an Objects/methods entry's own field) was being
      written pinned to one specific call site - "download_cam_file
      reads an optional commit_sha this way" - instead of the
      construct's general reason for appearing in this lesson at all.
      That breaks the moment the same construct is used a second time,
      elsewhere in the same lesson, for a different specific reason -
      the Header would still only state the first one, and a reader
      has to reconcile a Header claim that no longer matches what
      they're looking at.
    rule: >
      "What it is" (generic identity) and "Its use" (why THIS LESSON
      reaches for it at all) stay genuinely different claims - "Its
      use" is still lesson-specific, not a second generic dictionary
      definition, but it states the construct's overall role in this
      lesson, one level up from any single call site - never a
      specific call's specific arguments. Example: not "reads an
      optional commit_sha this way" (one call site) but "reads an
      optional value from the URL's own query string, without it
      affecting which route handles the request" (the general reason
      this lesson needs the construct at all). Every specific,
      moment-by-moment reason a PARTICULAR line does what it does -
      including a second, different reason the same construct
      reappears later in the same lesson - belongs in the Mechanical
      Walkthrough's own per-element explanation, which is already built
      for exactly that granularity.

  vocabulary_extraction:
    order: strict
    steps:
      - Before drafting Terms or Objects/methods, collect every code
        span this lesson will show anywhere - New Code, isolated lab
        code, any real signature quoted inside an Implementation
        bullet. A token appearing only inside a quoted signature still
        counts.
      - Tokenize each span into its distinct pieces - keyword,
        annotation, operator, type name, method name, named constant.
      - Give every token a slot before writing a single word of prose -
        a Terms entry (keyword/annotation/operator/reappearing
        language concept) or an Objects/methods entry (real class,
        interface, method) - decided by category, never by which
        section "feels right."
      - Once the Header is assembled this way it is closed vocabulary -
        no later section may introduce a technical word with no slot.
        If a sentence in Mechanical Walkthrough/CS Lens/SE Lens/Connect
        the Pieces/Commands needs a word with no slot, that is the
        signal a token was missed - stop, add the slot, then finish
        the sentence.
    prose_jargon_note: >
      The mechanical compiler check only tokenizes real CODE spans
      against Terms/Objects - a CS/SE-jargon word introduced only in
      prose (a Lens, a walkthrough explanation), never appearing as a
      literal code token, gets no mechanical check at all. Lesson 1.4's
      own list-comprehension unit called the construct "declarative" in
      its CS Lens without ever giving that word its own Terms slot or
      explaining what it actually commits the reader to - caught only
      by a human re-read, never the compiler. Before reaching for a
      technical term that isn't already a Terms/Objects entry, either
      give it one or don't use the word - describe the mechanism in
      plain terms instead (what a list comprehension actually does:
      iterate, filter, produce, collect) rather than reaching for a
      paradigm label the lesson never actually defines.

  repetition_rule:
    applies_to: every construct, new or reappearing
    scope: >
      CROSS-LESSON only. The rule exists so a lesson never skips
      explaining something on the grounds that a DIFFERENT lesson
      already covered it - that reliance is what broke in practice
      (a citation target that moved, was rewritten, or was never as
      complete as assumed). It says nothing about repeating yourself
      WITHIN one lesson's own already-self-contained Header. A Header
      entry (Terms/Objects, full CRC) is written exactly once per
      lesson; that single entry IS the full treatment. Everything
      after it in the SAME lesson - Mechanical Walkthrough, Lenses,
      Connect the Pieces - just uses the name naturally. It does not
      need to say "(full treatment above)" or any other self-citation
      phrase every time the name reappears in the same document - that
      phrase adds no information a reader doesn't already have (the
      Header is right there, in the same lesson), and repeating it
      turns into pure noise across a long walkthrough. This was a real
      mistake made early on: writing "(full treatment above)" after
      nearly every reappearing name in a Mechanical Walkthrough,
      confusing "don't skip explaining across lessons" with "keep
      pointing back at your own Header within one lesson."
    instruction: >
      Every concept, construct, method, or term gets full, real
      treatment at every single use ACROSS LESSONS - first appearance
      in the curriculum, or the fiftieth lesson to use it. A hard
      concept (design pattern, SE principle, CS idea, named
      architectural decision) gets its real, full explanation - what it
      is, why it exists, what it does - written out again, by name, in
      EVERY LESSON that uses it. A basic already-taught construct gets
      the identical treatment, in every lesson. Never a brief reminder,
      never a citation to a different lesson substituting for
      explanation. Within one lesson's own Header, write the full
      treatment ONCE per entry - never repeated a second time later in
      the same lesson, and never flagged with a self-referential
      pointer phrase either.
    forbidden:
      - Citing "Lesson N" (this curriculum or any other) as a
        substitute for explaining a concept inline, even with a full
        explanation following it - naming the lesson number is itself
        the violation.
      - "Already covered elsewhere" or "already explained earlier in
        this curriculum" language anywhere except a Header's own
        forward-looking pointer fields."
      - "(full treatment above)" or any equivalent self-citation phrase
        pointing back at this SAME lesson's own Header - just use the
        name; the Header already did its job once.
    basic_python_phrasing: >
      When something genuinely is ordinary, already-assumed-known
      Python (an `if`, `open()`, a plain `or`), a short parenthetical
      like "(basic Python)" says everything "ordinary Python, already
      assumed prior knowledge" said, with none of the repeated bulk.
    permitted_lesson_number_locations:
      - "Header: what you need to know first (concepts only preferred; see project override)"
      - "Closing: next lesson pointer"

  verified_claim_vs_design_rationale:
    problem: >
      Lesson 1.4's own Tuples unit stated that `dict.items()` and
      `enumerate()` hand back tuples "because" tuples are immutable and
      therefore "can be trusted" - phrased as the real, structural
      reason those APIs are shaped that way. What this lesson actually
      verified was only that they yield tuples; why CPython's own
      designers chose that representation is a plausible design
      rationale, never run or proven, and it was stated with the exact
      same confidence as the verified fact sitting right next to it.
    rule: >
      A Lens (or any prose field) may name a design rationale for why a
      construct is shaped the way it is, but must not present that
      rationale with the same certainty as something this lesson
      actually ran and observed. Verified: "X yields a tuple - this
      lesson's own execution confirms it." Design rationale (weaker,
      and must read as such): "one reason a tuple is a natural fit
      here is ___." Never "the real, structural reason X happens is
      ___" for something that is design opinion, not verified
      execution.

  implementation_detail_vs_language_guarantee:
    problem: >
      Lesson 1.4's own Sets unit stated flatly that "a set is the same
      real hash table structure a dict uses internally" - true of
      CPython, the interpreter this curriculum actually runs and
      verifies against every single time, but not a guarantee the
      Python language itself makes about every implementation.
    rule: >
      A claim about HOW a built-in type is actually implemented
      internally (a hash table, a specific data structure) gets
      attributed to CPython by name, not stated as a bare "Python"
      language fact - unless the behavior is one the language itself
      documents as guaranteed (average O(1) dict/set membership, for
      instance) as opposed to merely true of the one real
      implementation this project happens to verify against every
      time. This curriculum verifies real, running CPython constantly
      - that's exactly why it's easy to blur "what I just watched
      CPython do" with "what Python promises," and the two are
      different claims.

  concept_extraction:
    instruction: >
      Recursively analyze the real code/material being added to
      identify every new teachable concept - any language feature,
      library API, framework feature, construct, design pattern, SE
      principle, CS idea, architectural decision, tooling concept, or
      project-specific abstraction not already introduced earlier in
      THIS lesson (per-lesson self-containment; see project override
      on cross-lesson citation).
    split_rule: >
      If a piece of code introduces more than one new concept, split
      at the seam into separate Concept Units. The goal is the
      smallest meaningful teaching sequence, not the smallest syntax
      tree.
    stopping_rule: >
      Continue splitting until each Concept Unit introduces exactly
      one new concept, then stop. Do not decompose into punctuation or
      basic syntax already taught, unless that exact token is itself
      the concept being taught. Test: "has this exact IDEA - not this
      exact character - been taught before?"

  concept_isolation:
    instruction: >
      The first appearance of every new concept in a Concept Unit uses
      throwaway code, never production/rebuild code, before it's used
      for real. Applies to every construct, not just unfamiliar-feeling
      ones - a construct with a direct equivalent in something already
      taught still gets its own lab; the idea may be familiar, the
      specific syntax/behavior is not.
    throwaway_code_requirements:
      - Demonstrates only the one new concept, minimum surrounding code.
      - Actually executed per verification.necessity (validation.yaml),
        real output shown, or the narrow prediction exemption stated
        and marked as such.
      - States what the output PROVES about the concept, not just what
        the code does.
      - Explicitly marked discarded - stated plainly it will not appear
        in the real/rebuild project again.
    escalating_input_rule: >
      When the real project input this construct will face is
      genuinely complex, don't jump straight from a minimal lab to
      that complexity - run the real construct against a short
      escalating sequence of tiny inputs first, each changing exactly
      one thing.

unit:

  problem:
    instruction: >
      State the problem in prose, no code yet - what are we trying to
      solve, right now, specifically?

  socratic:
    instruction: >
      After stating the problem, before revealing the concept, ask 2-4
      real questions putting the reader in the position of trying to
      solve it themselves first.
    rules:
      - Answerable using only what THIS lesson has already established -
        never demanding syntax/an API the reader hasn't seen; that's
        trivia, not Socratic.
      - Explicitly invite pausing and attempting something concrete -
        a guess, pseudocode, a predicted output - before reading on.
    good_shapes:
      - "Given what X already does, what would you try here first?"
      - "What happens if this step is just skipped?"
      - "Look at the name Y - what does it suggest this does, before you're told?"

  project_change:
    instruction: >
      Before showing real code, state exactly how it lands in the
      actual project - a delta against the previous unit's/lesson's
      end state, never a full snapshot.
    required_fields:
      reference_source: >
        Real file + line range, quoted verbatim, read this session -
        or an explicit "No reference counterpart - because ___." This
        field comes first; nothing below it can be trusted without it.
      files_affected: Exact path(s), created/modified/deleted.
      change_type: add | replace | remove | refactor | configure | none
      location: Named by what's already there, not a guess a reader must make.
      dependencies: Anything required that isn't already present.
    skip_rule: >
      Skip only fields genuinely inapplicable (a brand-new file has no
      "location" to name within). Never skip reference_source silently
      even when the honest answer is none.

  citation_vs_walkthrough:
    problem: >
      A whole Concept Unit was built as pure citation - Reference
      Source named real file:line ranges, but no code was ever shown,
      and CS/SE Lens then asserted things about that code's behavior
      ("graceful degradation") that a reader had no way to verify,
      because they never saw it.
    rule: >
      Citation-only (new_code and updated_project both applicable:
      false, nothing shown) is legitimate ONLY when this unit's actual
      teaching point is classification or location - WHERE something
      lives, or WHICH named category/boundary it belongs to - and nothing
      in CS Lens or SE Lens depends on the reader having seen the code's
      actual mechanism. The moment CS Lens or SE Lens makes a claim
      about HOW code behaves (a fallback, a conditional, an algorithm,
      an exception path) - that code MUST be shown as a real block
      (use new_code/updated_project's `files: [...]` list when more
      than one real file is involved) and given a real Mechanical
      Walkthrough. An assertion about behavior the reader never saw is
      exactly the "prose isn't proof" failure this curriculum exists to
      avoid, whether the code is brand-new or an already-existing file
      being read.
    test: >
      Before setting new_code/updated_project to applicable: false, ask:
      does CS Lens or SE Lens name a *behavior* (not just a location)?
      If yes, the code behind that behavior must be shown, not cited.

  new_code:
    instruction: >
      The smallest resulting fragment after concept_extraction - not a
      whole function/file. Written as something to actually type, not
      just read. When a unit needs to show more than one real file
      together (e.g. a route and the service it delegates to), use a
      `files: [{file, status, code}, ...]` list instead of a single
      file/code pair - the compiler renders each with its own `**File:**`
      line and code block, and the vocabulary/marker checks cover every
      block in the list the same way.

  updated_project:
    instruction: >
      Return immediately, before any explanation - show the smallest
      enclosing structure that already existed, new piece placed
      inside, marked. Say briefly what the structure now does as a
      whole (orientation, then meaning - not just a marker with no
      sentence). Supports the same `files: [...]` multi-file shape as
      new_code, above, when showing more than one real file - each
      gets its own status label (existing/new) and marker check.
    never:
      - Eliding any part of the shown structure ("{ ... }", "// unchanged",
        any placeholder) - even code just shown moments earlier, even
        code identical to an earlier lesson.
    when_new_since_a_prior_step_in_this_lesson: >
      If any part of what's shown already appeared in an earlier step
      of the SAME lesson (New Code, or an earlier Updated Project in
      the same or an earlier unit), every line new since that step
      must carry a real marker - never left for prose alone to
      describe. (Mechanically checked in validation.yaml.)
    skip_condition: >
      Skip this step only when New Code IS the whole new structure with
      nothing surrounding it yet (a brand-new file/freestanding
      function) - Project Change already covers that case.

  applicable_false_rendering: >
    When new_code, updated_project, or mechanical_walkthrough is set to
    applicable: false, the compiler omits that section's heading and
    body from the compiled lesson entirely - it does not print a "not
    applicable, because..." placeholder. These three are steps in the
    write-code/place-it/walk-through-it sequence; a citation-only unit
    simply doesn't have that step, the same way a unit with no loop
    doesn't get an empty "### Execution Trace" heading. A `note` field
    may still be written in the YAML for the next author's own
    reference, but it is authoring-time documentation only - it is
    never rendered. Verification is different in kind and keeps its
    own explicit exemption_reason ON THE PAGE even when applicable:
    false - "how do we know this is true" is a live question for every
    unit, not a step some units skip, and the Verification Rule this
    curriculum runs on depends on that reasoning being visible, not
    just recorded.

  mechanical_walkthrough:
    instruction: >
      Before writing a word of prose, literally enumerate every
      distinct syntactic element in New Code, in order - every method
      call, property access, operator, literal. A fluent/chained call
      sequence is every one of those calls, not one block waved
      through as a unit.
    per_item_requirements:
      - Explain, don't just describe - the reasoning (why shaped this
        way, what breaks without it, what it enables), not a flat
        account of what it looks like/does.
      - Real vocabulary, not paraphrase - the item's real declaring
        type/signature stays in the sentence; effect-only language
        ("this pre-fills the field") without the mechanism fails this.
      - When a concept needs more than a clause, take the room (a
        longer paragraph, an extra Concept Unit, or a whole extra
        lesson) rather than compressing it to fit one bullet.
      - One method/object/function explanation per bullet, leading
        with its name - never folded as a clause into prose about
        something else, even when mentioned only in passing.
    objects_and_methods_shape_rule: >
      Show the real declared shape (verified against real source/docs
      this session) when either holds: (i) the lesson calls more than
      one related member of the same external type, or (ii) a value
      passed/returned is a compound type. Skip only when a single
      simple method with one plain input/output already fully explains
      itself in prose.
    hidden_behavior_rule: >
      A claim about hidden/invisible behavior ("the compiler generated
      it," "this happens automatically") needs the same proof as
      anything else - if a real tool can show it, show that output;
      a confident sentence is not a substitute.

  mental_model:
    when: >
      Only when the unit's real shape has more than one path, boundary,
      or branch that prose alone makes hard to hold in mind at once -
      two different exception boundaries at two different points in a
      call chain, several conditional branches converging on one
      outcome, a fallback with more than one real trigger. A single
      linear sequence (call this, which calls that, which returns)
      never needs one - the Mechanical Walkthrough already covers that
      clearly enough in prose.
    what_it_is_not: >
      Not a restatement of execution_trace's real per-step values, and
      not decoration. A mental model diagram shows STRUCTURE or
      RELATIONSHIP (what connects to what, which branch goes where) -
      the moment it starts carrying one specific run's actual values,
      it has become an execution trace instead and belongs in that
      field, not this one.
    placement: >
      After the Mechanical Walkthrough, not before - a diagram naming
      functions or branches the reader hasn't met yet orients no one;
      recapping the same structure just walked through in prose, in one
      picture, is what actually earns its place on the page.
    check_before_using: >
      Before adding one, check whether removing it would actually cost
      the reader something a careful re-read of the Mechanical
      Walkthrough wouldn't already give them. If not, `applicable:
      false` and no diagram - a decorative diagram is exactly the kind
      of thing this curriculum's "real, not decorative" standard exists
      to keep out.

  execution_trace:
    when: loop, recursion, or state carried across steps - OR a
      sequence of calls where the point is timing/control-flow order.
    value_trace_shape: >
      Fenced "Iteration N: values" - concrete real values AND the
      reasoning for each (which condition/branch/argument produced it),
      only while lines stay terse and tabulate-able. The moment
      explaining "why" pushes a line into a real sentence, switch to
      the timing shape below even though the data is still values.
    timing_trace_shape: >
      Unfenced numbered list, one real statement (as an inline code
      span) per step, plus prose on what happens and, where it's the
      crux, why a reader would expect otherwise. Never wrap this shape
      in a code fence - it's prose that references code, not code.

  cs_lens:
    instruction: >
      Name the computational concept, if any. For a hard concept
      specifically, name SEVERAL unrelated real-world recurrences, not
      one - one example teaches "this has a use"; several teach "this
      is a pattern you'll keep noticing."

  se_lens:
    instruction: >
      Name the design principle. State the real alternative NOT chosen
      and why - a real tradeoff, not a vocabulary definition. State the
      honest maintenance/failure cost, including debt the project is
      currently carrying, if any.

  commands:
    instruction: >
      Every terminal command needed to make this unit real: program,
      every flag/argument's meaning, what success output looks like.
    rule: >
      The real, concrete, actually-runnable command - a real file
      path, a real flag value - never a placeholder like <path> left
      for the reader to guess how to fill in. If more than one command
      runs, state the real order and whether they run
      separately/simultaneously.

  verification:
    instruction: >
      Run it, show the real output - unless the narrow prediction
      exemption applies (see validation.yaml's verification rules),
      in which case state the predicted output/shape directly, marked
      as a prediction, with why it's confidently predictable.
    citation_only_exemption_reason_scope: >
      When applicable: false because the unit is citation-only (real,
      already-existing code shown, nothing executed), the
      exemption_reason must name the SPECIFIC claim the citation
      actually establishes (a structural fact - what the code says,
      what branches exist, where a function lives) and say plainly that
      it does NOT establish runtime behavior (what a dependency
      actually returns, what's in a real database, what a real request
      does end to end) - that would need a separate execution trace.
      "The code itself is the evidence" is too strong on its own: real
      source is evidence of the control flow being examined, not of
      what happens when it runs. This is the same source-vs-behavioral
      distinction this curriculum's own CS/SE Lenses exist to teach -
      the exemption_reason should model it, not contradict it.
    repeated_run_claims: >
      If a Lens or Mechanical Walkthrough claims something is true
      ACROSS repeated executions specifically ("run to run," "each time
      this runs," "isn't the same from one run to the next") - not just
      true of a single run - the verification block must actually show
      more than one real run's output proving it, the same way any
      other behavioral claim needs the code/output behind it visible on
      the page. Lesson 1.4's own Sets unit claimed set iteration order
      "isn't even the same from one run to the next" - true, and
      actually checked by running the lab three times during authoring
      - but the lesson's own verification block only ever showed one
      run, leaving the claim unproven to an actual reader of the
      finished page. Being run-this-session isn't enough on its own
      here; what's shown has to match what's claimed.

  connection:
    instruction: >
      One sentence connecting this unit to what came immediately
      before it.

closing:

  connect_the_pieces:
    instruction: >
      A full trace - one concrete value or action moving through every
      unit built in this lesson, start to finish.

  next_lesson:
    instruction: >
      State what the next lesson builds on top of this one - no lesson
      number required; a real description of the next real thing.

project_overrides:
  # This project's own decisions, layered on top of the generic rules
  # above - kept here, in one place, rather than re-litigated per lesson.
  - "What you need to know first" states concepts only, never a lesson
    number/pointer - a lesson is never itself the dependency, only its
    content is, and content gets fully re-taught inline regardless per
    repetition_rule.
  - "elsewhere in this curriculum" (or equivalent hand-waves) is
    forbidden in Shape bullets, Commands, or anywhere else - if
    something reappears, restate its real content in full, in place.
  - Every code block states its real file and new-vs-existing status in
    its own immediately adjacent prose, not once, disconnected, earlier
    in the unit.
  - rebuild/ holds only lesson code - nothing added there that wasn't
    taught in a lesson first (mechanically checked by
    verify_rebuild_taught.py, not this file).
  - Every inline code reference in prose text fields (a file name, a
    function/method/class name, a literal value) is wrapped in
    backticks - "pdm.py" and "ast.parse" in running prose read as plain
    English words, not real identifiers; "`pdm.py`" and "`ast.parse`"
    read as real code, which is what they are. This isn't mechanically
    checked (a compiler can't tell an intentional plain-English mention
    from a missed one) - it's an authoring habit to hold consistently,
    found missing across an early YAML-authored lesson where hand-
    written earlier lessons had it right by feel.
  - A YAML folded scalar (">") joins wrapped source lines with a single
    space - a literal string (a file path, a route path) that happens
    to wrap across two source lines in the .yaml file gets a stray
    space inserted into it in the compiled output (e.g. "cam-\nfiles"
    becomes "cam- files"). Keep any literal string that must stay
    exact on one source line, or avoid repeating a long literal path in
    prose at all when a plain description works just as well.
  - Don't restate a code block's own file path in an "intro" prose field
    when the compiler already renders a separate `**File:**` line for
    that same block (updated_project) - say what changed since the
    prior step instead of repeating the path a second time.
