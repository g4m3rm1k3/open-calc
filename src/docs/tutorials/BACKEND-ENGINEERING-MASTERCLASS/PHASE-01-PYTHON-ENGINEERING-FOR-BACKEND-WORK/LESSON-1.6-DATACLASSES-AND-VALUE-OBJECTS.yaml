number: "1.6"
title: "Dataclasses and Value Objects"
path_note: >
  File paths under backend/... refer to the real manufacturing-platform
  repository. Paths under verification/... refer to that same
  repository's verification folder.

what_you_will_build: >
  No new backend feature - this lesson reads a real, already-existing
  progression already present in this backend: an ad hoc dict bundle
  (`backend/app/services/cam_import_service.py`), a second, independently
  written description of that same shape that has already drifted out of
  sync with it (`backend/app/schemas.py`), a real `@dataclass(frozen=True)`
  pair that replaces exactly this problem elsewhere in the same codebase
  (`backend/app/services/stl_scaffold_service.py`), and a real ORM model
  (`backend/app/models/user.py`) whose own real, mutable behavior shows why
  a frozen dataclass isn't always the right choice either.

what_you_need_to_know_first: >
  Reading a real, existing file as evidence for what a function actually
  does; dict/list/set/tuple, and which of them is mutable; a function
  parameter's real type annotation.

terms:
  - name: "Value object"
    definition: >
      A real bundle of data whose own identity IS its values - two value
      objects holding the identical real data are considered the same,
      interchangeably, with no separate real identity tracked beyond what
      they actually hold. It exists as its own concept because a real
      program often needs to distinguish this case (a computed result, a
      coordinate, a fixed set of related fields describing one real thing)
      from a case where two objects holding identical data right now are
      still genuinely different real things - the next unit's own real
      contrast.
  - name: "Domain object"
    definition: >
      A real bundle of data with its own persistent identity, tracked
      separately from its current values, usually carrying real behavior
      (methods that do more than just return a stored field) and expected
      to change over its own real lifetime while remaining "the same"
      real thing throughout. It exists as its own concept because a value
      object's own core property - sameness determined purely by current
      values - is exactly wrong for something like a real user account,
      whose password, name, or login time can all genuinely change while
      it's still unambiguously the same real account throughout.

objects_and_methods:
  - name: "dataclasses.dataclass"
    what_it_is: "A real class decorator from the standard library `dataclasses` module that generates several real methods from a class's own field declarations."
    implementation: "`@dataclass` (real fields = the class's own annotated attributes) or `@dataclass(frozen=True)` (the same, plus real immutability) - confirmed this session."
    its_use: "This lesson's third unit uses it to replace a real, ad hoc dict bundle - and a real, second, independently drifted description of that same bundle - with one single real declaration."
    type: "A class decorator, part of the standard library `dataclasses` module."
    responsibility: "Generate, from a class's own real, annotated field declarations, a real `__init__` (accepting exactly those fields), a real `__repr__` (showing every field's real current value), and a real `__eq__` (comparing two instances by their actual field values, not by object identity) - confirmed this session directly, not merely asserted."
    depends_on: "A class whose own body is written as plain, real type-annotated field declarations - the exact same annotation syntax this lesson's own prior lesson (Type Hints) already covered in full."
    connects_to: "`frozen=True` makes every generated field genuinely immutable after construction - the identical real property this lesson's own prior-lesson tuple already had, applied here to a real, named, multi-field class instead of a fixed-position sequence."
    shape: "Takes zero required arguments as a bare `@dataclass`, or real keyword arguments (`frozen=True`, among others) as `@dataclass(...)`; applied directly above a real `class` statement, never called on an already-defined class after the fact."
  - name: "OperationScaffoldItem"
    what_it_is: "A real, already-existing `@dataclass(frozen=True)` in this backend, the exact real fix this lesson's own third unit reaches for."
    implementation: "Defined at `backend/app/services/stl_scaffold_service.py:33`, seven real, annotated fields, no methods of its own."
    its_use: "This lesson's third unit reads it as real, already-shipped proof that this exact fix - one real dataclass declaration, replacing an ad hoc dict and a second, drifted description - is not hypothetical; this backend already made this exact choice elsewhere."
    type: "A real, frozen dataclass, defined in `backend/app/services/stl_scaffold_service.py`."
    responsibility: "Hold seven real, related values describing one real subprogram's own scaffold files together, immutably, as a single real unit - explicitly documented, in the real file's own docstring, as a 'Value Object.'"
    depends_on: "The `dataclasses.dataclass` decorator, above, and Python's own real type-annotation syntax on each of its seven fields."
    connects_to: "Nested directly inside `ScaffoldManifest`, a second real `@dataclass(frozen=True)` in the same real file, via a real `List[OperationScaffoldItem]` field - a dataclass containing a real list of another dataclass, the identical nested-collection-type-hint shape this lesson's own prior lesson already covered for `List[Dict[str, Any]]`."
    shape: "Constructed with exactly seven real positional or keyword arguments, one per declared field, in the real order they're declared - a real `TypeError` results from too few, too many, or an unrecognized keyword, the same way any real dataclass-generated `__init__` behaves."
  - name: "generate_password_hash"
    what_it_is: "A real function from Flask's own real dependency, `werkzeug.security`, that turns a real plaintext password into a real, salted hash."
    implementation: "`generate_password_hash(password: str) -> str` - confirmed this session to include a real, randomly generated salt each call, via `werkzeug`'s own `scrypt` algorithm."
    its_use: "This lesson's fourth unit uses it to reproduce, in an isolated real lab, exactly what `User.set_password` (below) does internally with a real password, before returning to that real method itself."
    type: "A free function, part of the real `werkzeug.security` module (already a real dependency of this Flask backend)."
    responsibility: "Return a real, one-way hash string that encodes the real algorithm used, its real parameters, a real random salt, and the real resulting hash - never the original plaintext password itself, and never the identical string twice in a row even for the identical real password."
    depends_on: "Nothing beyond the real plaintext string passed in."
    connects_to: "Its own real output is what `User.set_password` stores directly into the real `password_hash` column - never the original plaintext, which this real class never stores anywhere at all."
    shape: "Takes one real string in; returns one real string out, confirmed this session to differ between two calls with the identical real input, because of its own real random salt."
  - name: "check_password_hash"
    what_it_is: "The real matching function from `werkzeug.security` that verifies a real plaintext password against an already-generated real hash."
    implementation: "`check_password_hash(pwhash: str, password: str) -> bool` - confirmed this session."
    its_use: "This lesson's fourth unit uses it to confirm, in the same isolated real lab, that a real hash generated from one password verifies correctly against that same real password and fails against a real wrong one - before returning to `User.check_password`, which calls this exact real function."
    type: "A free function, part of the real `werkzeug.security` module."
    responsibility: "Return a real `True`/`False` - never the original password, and never requiring the real salt to be tracked separately, since `generate_password_hash`'s own real output already encodes it."
    depends_on: "A real hash string already produced by `generate_password_hash`, and the real plaintext password being checked against it."
    connects_to: "Called directly inside `User.check_password`'s own real body, below, with `self.password_hash` (the real, already-stored hash) and the real password argument passed in."
    shape: "Takes two real strings in (hash, then plaintext); returns one real bool - confirmed this session to return `True` for the real matching password and `False` for a real wrong one, using the identical real hash both times."

concept_units:
  - title: "Ad Hoc Dict Bundles - Several Fixed Values With No Named Shape"
    problem: >
      `CAMImportService.handle_xml_import` needs to hand back several
      real, fixed, related pieces of information about one real import -
      not a single value, and not a real database row either. A dict
      (this lesson's own prior-lesson construct) is what's already at
      hand for bundling values together - but nothing about a plain dict
      states, anywhere a reader or a tool can check, exactly which real
      keys are actually supposed to be there.
    socratic_prompt:
      - "If a real caller wrote `result.get(\"Count\")` instead of the
        real key `result[\"ncFilesCreated\"]` uses, what real, concrete
        thing would happen - an error immediately, or something quieter?"
      - "Given a real dict with eight real keys, what real, concrete
        document (if any) currently states, in one place, that all eight
        are actually supposed to be there?"
    project_change:
      reference_source: >
        `backend/app/services/cam_import_service.py:99-108` and
        `backend/app/routes/cam_files.py:188-197`, real, already-existing
        code, read and quoted verbatim this session.
      explanation: >
        `handle_xml_import` builds and returns a real, eight-key dict
        bundling everything one real XML import actually produced - a
        new CAM file's own dict form, several real counts, the real
        metadata parsed from the file, and real warnings/recommendations
        lists. `import_xml`, the real route calling it, passes that same
        real dict straight through as the real JSON response's own
        `data` key.
      files_affected:
        - path: "verification/phase-01/lab_dict_bundle.py"
          status: new
      change_type: add
      location: "New file, no existing project to place it within."
      dependencies: "None - Python's own built-in `dict` type only."
    new_code:
      applicable: true
      intro: >
        A small, real, throwaway bundle with the identical real shape -
        several fixed keys built once, then read back two ways, one
        correct and one typo'd:
      file: "verification/phase-01/lab_dict_bundle.py"
      status: new
      language: python
      code: |
        def build_summary(name, count, warnings):
            return {
                "name": name,
                "count": count,
                "warnings": warnings,
            }

        summary = build_summary("import-42", 3, [])
        print(summary.get("count"))
        print(summary.get("Count"))
    updated_project:
      applicable: true
      intro: >
        The real project code this lab's own shape reproduces - a real
        eight-key dict, built once and handed straight through to a real
        JSON response:
      files:
        - file: "backend/app/services/cam_import_service.py (lines 99-108)"
          status: existing
          code: |
            return {
                'camFile': cam_file.to_dict(include_sequences=True),
                'ncFilesCreated': len(parsed_data['nc_files']),
                'sequencesCount': len(parsed_data['sequences']),
                'operationsCount': sum(len(s['operations']) for s in parsed_data['sequences']),
                'toolAssembliesCreated': len(parsed_data['tool_assemblies']),
                'metadata': parsed_data['metadata'],
                'warnings': warnings,
                'recommendations': recommendations
            }
        - file: "backend/app/routes/cam_files.py (lines 195-197)"
          status: existing
          code: |
            result = CAMImportService.handle_xml_import(cam_file_id, request.files['xml'])
            return jsonify({'message': 'XML imported successfully', 'data': result}), 200
    mechanical_walkthrough:
      applicable: true
      items:
        - element: "summary = build_summary(\"import-42\", 3, [])"
          explanation: >
            Builds a real, three-key dict bundle - the identical real
            pattern as `handle_xml_import`'s own return value, at minimal
            scale.
        - element: "print(summary.get(\"count\"))"
          explanation: >
            The real, correct key - `.get()` (already fully covered in
            this lesson's own prior-lesson Dictionaries unit) returns the
            real stored value, `3`.
        - element: "print(summary.get(\"Count\"))"
          explanation: >
            A real, one-character typo - capital `C` instead of lowercase
            - `.get()`'s own real default behavior (`None` when a key is
            genuinely absent) makes this typo indistinguishable from a
            real, legitimately-missing key: no error, no warning, just a
            quiet, wrong `None`.
        - element: "return { 'camFile': ..., 'ncFilesCreated': ..., ... }"
          explanation: >
            The real, eight-key version of the identical pattern - built
            once, in one real place, with nothing anywhere stating these
            exact eight keys are the real, complete, required shape other
            than this one function's own body.
        - element: "result = CAMImportService.handle_xml_import(...); return jsonify({'message': ..., 'data': result}), 200"
          explanation: >
            The real dict, unpacked into no explicit shape at all before
            being sent - `jsonify` accepts any real, JSON-serializable
            structure, so nothing here would catch a typo'd key on
            either side of this real call either.
    cs_lens: >
      An ad hoc dict bundle is a real, structurally-untyped record - a
      real collection of named fields with no separate, checkable
      declaration of what those names and types are supposed to be. Also
      recognized in: a real CSV file with no header row (every reader has
      to already know what column 3 means), a loosely-typed JSON blob
      before any real schema is applied to it, and a real key-value store
      where nothing enforces which keys a given "kind" of record is
      supposed to carry.
    se_lens: >
      The real cost this unit's own lab just demonstrated: a one-letter
      typo, `\"Count\"` instead of `\"count\"`, produced no error at all -
      just a quiet, wrong `None`, indistinguishable from a real,
      legitimately-absent key. Correctness here depends entirely on every
      real reader and writer agreeing, by convention alone, on exactly
      which keys exist - nothing actually checks that agreement, and
      this lesson's own next unit shows a real, already-existing case
      where that agreement has already quietly broken.
    commands:
      - command: "python verification/phase-01/lab_dict_bundle.py"
        explanation: "Run from the manufacturing-platform repository root."
    verification:
      applicable: true
      real_output: |
        3
        None
      output_file: "verification/phase-01/lab_dict_bundle_output.txt"
    connection_to_previous: >
      There is no previous unit - this is the first one in this lesson.

  - title: "When an Ad Hoc Bundle Drifts - Two Real, Disagreeing Descriptions of One Shape"
    problem: >
      This backend doesn't just have one real, ad hoc description of this
      exact eight-key shape - it has a second one, written independently,
      in `backend/app/schemas.py`. Reading both real descriptions side by
      side shows they no longer agree.
    socratic_prompt:
      - "Given the real dict above has eight real keys, and a second, real
        class elsewhere in this codebase declares fields for only some of
        them, what real, concrete situation would actually expose that
        gap to a caller relying on the second description instead of the
        first?"
      - "If a real class describing this exact shape is never actually
        imported or used anywhere else in the codebase, what real,
        different problem is that - separate from the fields already
        disagreeing?"
    project_change:
      reference_source: >
        `backend/app/schemas.py:97-108`, real, already-existing code, read
        and quoted verbatim this session, compared directly against
        `cam_import_service.py:99-108` from the unit above (already fully
        shown there - repeated here only for direct side-by-side
        comparison, per this project's own no-eliding rule).
      explanation: >
        `XMLImportResponse`, a real Pydantic model, independently declares
        its own version of this same shape - `cam_file`, `nc_files_created`,
        `sequences_count`, `operations_count`, `metadata` - but is missing
        three real keys the actual dict includes:
        `toolAssembliesCreated`, `warnings`, `recommendations`. A
        repository-wide search this session confirms `XMLImportResponse`
        is never imported or referenced anywhere outside its own
        definition line - a second, drifted description, currently unused
        by anything.
      files_affected:
        - path: "backend/app/schemas.py"
          status: none
      change_type: none
      location: "No change - a real, structural comparison of two already-existing files."
      dependencies: "None."
    new_code:
      applicable: false
    updated_project:
      applicable: true
      intro: >
        The real, second description, compared directly against the real
        dict from the unit above:
      files:
        - file: "backend/app/services/cam_import_service.py (lines 99-108)"
          status: existing
          code: |
            return {
                'camFile': cam_file.to_dict(include_sequences=True),
                'ncFilesCreated': len(parsed_data['nc_files']),
                'sequencesCount': len(parsed_data['sequences']),
                'operationsCount': sum(len(s['operations']) for s in parsed_data['sequences']),
                'toolAssembliesCreated': len(parsed_data['tool_assemblies']),
                'metadata': parsed_data['metadata'],
                'warnings': warnings,
                'recommendations': recommendations
            }
        - file: "backend/app/schemas.py (lines 97-108)"
          status: existing
          code: |
            class XMLImportResponse(BaseModel):
                """Response schema for successful XML import."""
                message: str
                cam_file: CAMFileSchema = Field(alias='camFile')
                nc_files_created: int = Field(alias='ncFilesCreated', ge=0)
                sequences_count: int = Field(alias='sequencesCount', ge=0)
                operations_count: int = Field(alias='operationsCount', ge=0)
                metadata: dict

                class Config:
                    populate_by_name = True
    mechanical_walkthrough:
      applicable: true
      items:
        - element: "cam_file: CAMFileSchema = Field(alias='camFile'); nc_files_created: int = Field(alias='ncFilesCreated', ge=0); ..."
          explanation: >
            Four of the real dict's eight keys are represented here,
            each under a real, separately-chosen Python-side name
            (`nc_files_created`) mapped back to the real JSON key
            (`ncFilesCreated`) via a real `Field(alias=...)` - a second,
            independent real naming decision on top of the original.
        - element: "metadata: dict"
          explanation: >
            The one real key given no further real shape at all here -
            `dict`, with no type arguments, the identical bare form this
            lesson's own prior lesson already showed states nothing about
            what's actually inside.
        - element: "toolAssembliesCreated, warnings, recommendations - absent"
          explanation: >
            Three real keys the actual returned dict includes are simply
            not declared anywhere in this second description at all - not
            wrong, just genuinely missing; a real caller trusting this
            schema's own declared shape would have no way to know these
            three real values even exist.
    cs_lens: >
      Two independent, hand-written encodings of what's supposed to be
      one real data model. Also recognized in: two microservices each
      maintaining their own separate copy of a shared entity's real
      schema, a database replica whose own schema migration was applied
      inconsistently against the primary, and duplicated real API
      definitions (an OpenAPI spec and the actual server code it's meant
      to describe) that quietly drift apart over time.
    se_lens: >
      The real cost of two hand-maintained descriptions of the same
      shape isn't hypothetical here - they have already drifted, and
      nothing in this codebase currently catches it, because
      `XMLImportResponse` is never actually used to validate anything
      real. Even if it WERE used, a caller trusting its own declared
      shape would be quietly missing three real fields the actual
      response includes. This is exactly the real problem this lesson's
      next unit's own fix - one real declaration, not two - is built to
      remove: not by making the single declaration more careful, but by
      making a second, independently drifting one impossible to write in
      the first place.
    commands: []
    verification:
      applicable: false
      exemption_reason: >
        This unit's own real teaching point is structural - which real
        keys each of two already-existing descriptions declares, and
        which of the actual dict's eight keys are missing from the
        second one - established directly by reading both real files,
        already quoted above in full. This does NOT establish anything
        about runtime behavior (whether either shape is actually
        validated against real data anywhere, what a real client
        currently receives) - only that the two real, already-existing
        descriptions disagree as written. The one behavioral claim this
        unit does make - that `XMLImportResponse` is never imported or
        used anywhere else - was verified this session with a real,
        repository-wide search, not assumed from reading `schemas.py`
        alone.
    connection_to_previous: >
      The unit above built one real, ad hoc dict bundle and showed a typo
      could silently slip past it undetected; this unit finds a second,
      independently-written real description of that same bundle already
      sitting in this exact codebase, disagreeing with the first - the
      same underlying risk, already realized for real, not hypothetical.

  - title: "Dataclasses - One Real Declaration Instead of Two"
    problem: >
      `stl_scaffold_service.py` already solves the exact problem the two
      units above just found - a bundle of several fixed, related real
      values - a different way: one real `@dataclass(frozen=True)`
      declaration, not a dict and a second, separately-maintained
      schema.
    socratic_prompt:
      - "Given a real `@dataclass` with fields `x` and `y`, and two real
        instances built with the identical values, what real, concrete
        result would you expect comparing them with `==` - and would
        that be the same real answer a plain dict comparison already
        gives, or something different?"
      - "If a real dataclass field is accessed by a genuinely typo'd
        name - `p.z` instead of a real field `p.y` - what real, different
        outcome would you expect compared to this lesson's own first
        unit's `summary.get(\"Count\")`?"
    project_change:
      reference_source: >
        `backend/app/services/stl_scaffold_service.py:20-70`, real,
        already-existing code, read and quoted verbatim this session.
      explanation: >
        `OperationScaffoldItem` and `ScaffoldManifest` are real, already-
        shipped `@dataclass(frozen=True)` classes in this exact backend -
        not a hypothetical fix, proof this codebase has already made this
        exact real choice for a comparable bundling problem.
      files_affected:
        - path: "verification/phase-01/lab_dataclass.py"
          status: new
      change_type: add
      location: "New file, no existing project to place it within."
      dependencies: "Python's own standard library `dataclasses` module only."
    new_code:
      applicable: true
      intro: >
        A small, real, throwaway dataclass - compared by value, then
        tested against the same two real failure modes this lesson's
        first unit already showed for a plain dict:
      file: "verification/phase-01/lab_dataclass.py"
      status: new
      language: python
      code: |
        from dataclasses import dataclass

        @dataclass(frozen=True)
        class Point:
            x: int
            y: int

        p1 = Point(1, 2)
        p2 = Point(1, 2)
        print(p1)
        print(p1 == p2)
        print(p1 is p2)

        try:
            p1.x = 99
        except Exception as e:
            print(f"{type(e).__name__}: {e}")

        try:
            print(p1.z)
        except AttributeError as e:
            print(f"AttributeError: {e}")
    updated_project:
      applicable: true
      intro: >
        The real, already-shipped fix this lab's own shape reproduces -
        two real dataclasses, one nested inside the other:
      file: "backend/app/services/stl_scaffold_service.py (lines 20-66)"
      status: existing
      language: python
      code: |
        import os
        import json
        from pathlib import Path
        from typing import List, Dict, Any, Optional
        from dataclasses import dataclass
        from app.models.cam_file import CAMFile
        from app.models.sequence import Sequence


        @dataclass(frozen=True)
        class OperationScaffoldItem:
            """
            Value Object representing a single subprogram's scaffold files.

            Immutable to ensure domain integrity.
            """
            subprogram: str           # e.g., "O1103"
            operation_num: str        # e.g., "1" (first digit - the operation)
            sequence_number: int      # Order in XML
            stock_filename: str       # e.g., "O1103_stock.stl" (per subprogram)
            part_filename: str        # e.g., "O1_part.stl" (per operation - shared)
            fixture_filename: str     # e.g., "O1_fixture.stl" (per operation - shared)
            operation_id: str         # Database ID for upload mapping


        @dataclass(frozen=True)
        class ScaffoldManifest:
            """
            Value Object representing the complete scaffold manifest.
            """
            cam_file_id: str
            part_id: str
            folder_path: str
            operations: List[OperationScaffoldItem]

            def to_dict(self) -> Dict[str, Any]:
                """Serialize to dictionary for JSON export."""
    mechanical_walkthrough:
      applicable: true
      items:
        - element: "@dataclass(frozen=True) class Point: x: int; y: int"
          explanation: >
            Two real, annotated field declarations - the identical
            annotation syntax this lesson's own prior lesson (Type Hints)
            already covered - are all this class's own body needs;
            `@dataclass` generates a real `__init__(self, x, y)`,
            `__repr__`, and `__eq__` from exactly these two declarations,
            confirmed by every line below.
        - element: "print(p1)"
          explanation: >
            The real, auto-generated `__repr__` - `Point(x=1, y=2)` -
            showing every real field's own current value, never written
            by hand.
        - element: "print(p1 == p2)"
          explanation: >
            `True` - the real, auto-generated `__eq__` compares two
            instances by their actual real field values, not by object
            identity; this is a real value object exactly as this
            lesson's own Terms entry defines one.
        - element: "print(p1 is p2)"
          explanation: >
            `False` - two genuinely separate real objects in memory,
            confirming the `True` above came from real value comparison,
            not from `p1` and `p2` secretly being the same object.
        - element: "p1.x = 99"
          explanation: >
            `frozen=True` makes every real field immutable after
            construction - this raises a real `FrozenInstanceError`,
            never silently succeeding the way assigning a new key onto a
            plain dict always would.
        - element: "print(p1.z)"
          explanation: >
            A real, typo'd field name - unlike this lesson's own first
            unit's `summary.get(\"Count\")`, which returned a quiet,
            wrong `None`, this raises a real, immediate `AttributeError`
            naming the exact real object type and the exact missing name
            - the real, structural fix for the first unit's own
            demonstrated risk.
        - element: "subprogram: str; operation_num: str; sequence_number: int; ..."
          explanation: >
            The real, identical pattern as this unit's own `Point` lab, at
            real project scale - seven real, annotated fields, each one
            documented in a real, adjacent comment naming its own real
            example value.
        - element: "operations: List[OperationScaffoldItem]"
          explanation: >
            A real dataclass field whose own type is a real list of
            another real dataclass - the identical nested-collection-type
            shape this lesson's own prior lesson already covered for
            `List[Dict[str, Any]]`, here holding real, immutable value
            objects instead of plain dicts.
    cs_lens: >
      A frozen dataclass is a real value object - the exact real concept
      this lesson's own Terms entry names, and the exact real word this
      backend's own docstring already uses for both `OperationScaffoldItem`
      and `ScaffoldManifest`. Also recognized in: an immutable `Money` or
      `Currency` type in a real financial library, a `datetime.date`
      object (two dates for the same real calendar day are simply equal,
      never tracked as separate real identities), and a coordinate/point
