closing:
  connect_the_pieces: >
    One real shape, "what one XML import produced," traced through every
    real choice this lesson found already made in this backend: as a
    plain, ad hoc dict (Ad Hoc Dict Bundles), it silently tolerated a
    typo'd key; as a second, independently hand-written Pydantic schema
    (When an Ad Hoc Bundle Drifts), it already disagreed with the first,
    unnoticed, because nothing used it. This lesson's own third unit read
    this exact backend's own real fix to that class of problem elsewhere
    - `OperationScaffoldItem`/`ScaffoldManifest` (Dataclasses), one real,
    frozen declaration standing in for both a dict and a second
    description, a typo'd field failing loudly instead of quietly. And
    the closing unit read the real limit of that fix: `User` (Domain
    Objects) needs its own password to genuinely change while remaining
    the same real account throughout - the one real case, among all four
    real shapes this lesson found already in use, that value equality
    alone could never express.
  next_lesson_pointer: >
    How the manual grouping and transformation loops already read in this
    backend - building a dict bundle one key at a time, one record at a
    time - map onto Python's own built-in tools for exactly that job, and
    which parts of those same real loops don't cleanly map onto any of
    them at all.
