  - title: "Domain Objects - When a Bundle Needs Identity and Behavior, Not Just Values"
    problem: >
      `OperationScaffoldItem` and `ScaffoldManifest` are frozen - a
      perfect fit for a real bundle fully described by its own current
      values. A real user account can't work that way: its own password
      changes, its own login time changes, and it has to remain
      recognizably the SAME real account throughout - value equality
      alone can't express that at all.
    socratic_prompt:
      - "If `User` were built as a frozen dataclass instead, what real,
        concrete operation would `set_password` - which needs to change
        `password_hash` on an already-existing real account - no longer
        be able to do at all?"
      - "Given two real `User` rows with the identical real email, name,
