<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Ribbon Nav</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <nav class="ribbon-nav" aria-label="Portfolio sections">
      <div class="ribbon-progress">
        <div class="ribbon-progress-fill" id="ribbon-progress"></div>
      </div>
      <ul class="ribbon-list">
        <li class="ribbon-item"><a href="#hero" class="ribbon-link is-active" data-section="hero"><span class="ribbon-dot"></span><span class="ribbon-label">Hero</span></a></li>
        <li class="ribbon-item"><a href="#work" class="ribbon-link" data-section="work"><span class="ribbon-dot"></span><span class="ribbon-label">Work</span></a></li>
        <li class="ribbon-item"><a href="#canvas" class="ribbon-link" data-section="canvas"><span class="ribbon-dot"></span><span class="ribbon-label">Canvas</span></a></li>
        <li class="ribbon-item"><a href="#terminal" class="ribbon-link" data-section="terminal"><span class="ribbon-dot"></span><span class="ribbon-label">Terminal</span></a></li>
        <li class="ribbon-item"><a href="#contact" class="ribbon-link" data-section="contact"><span class="ribbon-dot"></span><span class="ribbon-label">Contact</span></a></li>
      </ul>
    </nav>
    <main class="portfolio">
      <section id="hero" class="port-section section-hero"><div class="section-inner"><h1 class="placeholder-heading">Hero Section</h1><p class="placeholder-sub">Three.js background coming in LAB-30</p></div></section>
      <section id="work" class="port-section section-work"><div class="section-inner"><h2 class="placeholder-heading">Work Section</h2><p class="placeholder-sub">Card grid coming in LAB-31</p></div></section>
      <section id="canvas" class="port-section section-canvas"><div class="section-inner"><h2 class="placeholder-heading">Canvas Section</h2><p class="placeholder-sub">Particle widget coming in LAB-32</p></div></section>
      <section id="terminal" class="port-section section-terminal"><div class="section-inner"><h2 class="placeholder-heading">Terminal Section</h2><p class="placeholder-sub">Typewriter animation coming in LAB-33</p></div></section>
      <section id="contact" class="port-section section-contact"><div class="section-inner"><h2 class="placeholder-heading">Contact Section</h2><p class="placeholder-sub">Contact form</p></div></section>
    </main>
    <script src="main.js"></script>
  </body>
</html>
