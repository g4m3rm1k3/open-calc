<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>LAB 07 — Glassmorphism</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="hero-bg">
      <div class="glass-card">
        <h1 class="card-name">Michael McLean</h1>
        <p class="card-role">Creative Developer</p>
        <p class="card-desc">I build beautiful interfaces with CSS, JavaScript, and Three.js.</p>
        <button class="card-btn">View Work</button>
      </div>
      <div class="stat-card">
        <span class="stat-number">12</span>
        <span class="stat-label">Projects Shipped</span>
      </div>
    </div>
  </body>
</html>
